    \ notarization(公证)\n\n### Pervasive security mechanisms\n\n- trusted functionality(可信功能),\
    \ security labels(安全标识), event detection(事件检测), security audit trails(安全审计追踪),\
    \ security recovery(安全恢复)\n\n## 1.6 网络安全模型\n\n- 在需要保护信息传输以防攻击者威胁消息的保密性、真实性等的时候，就会涉及信息安全，任何用来保证安全的方法都包含两个方面：\n\
    \  - 被发送信息的安全相关变换，如对消息加密，打乱消息使得攻击者不能读懂消息，或者将基于消息的编码附于消息后，用于验证发送方的身份。\n  - 双方共享某些秘密信息，并希望这些信息不为攻击者所知。如加密密钥，配合加密算法在消息传输之前将消息加密，在接收端将消息解密。\n\
