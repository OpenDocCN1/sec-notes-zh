    \n## 网络信息安全\n\n## Chapter 8\n\n## Introduction to Number Theory\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_358_0.png)\n\
    \n### 费马小定理（范例）\n\n#### （1）计算610 mod 11\n\n若p是素数，a是正整数且不能被p整除，则a<sup>p-1</sup>\
    \ mod p=1\n\n解法：我们可得6<sup>10</sup> mod 11 = 1。\n这是p = 11 时，可以使用费马小定理的第一个版本直接计算得到。\n\
    \n### 费马小定理（范例）\n\n#### （2）计算3<sup>12</sup> mod 11\n\na<sup>p</sup>≡a mod p, p是素数\n\
    解法：此处指数（12）和模数（11）是不同的。\n\n3<sup>12</sup> mod 11 = (3<sup>11</sup> × 3) mod 11\
    \ = (3<sup>11</sup> mod 11) (3 mod 11) = (3 × 3) mod 11 = 9\n\n### 欧拉函数 \\(\\\
    Phi(n)\\)的证明\n\n#### 定理8.2 \\(p\\)和\\(q\\)是素数，\\(n=p*q\\)，\\(\\Phi(n) = \\Phi(p)\
    \ \\Phi(q) = (p-1)(q-1)\\)\n\n#### 显然，对于素数\\(p\\)，\\(\\Phi(p) = p-1\\)\n\n证明：考虑余数集合\\\
    (\\{0, 1, \\dots, (pq-1)\\}\\)中不与\\(n\\)互素的余数集合是\\(\\{p, 2p, \\dots, (q-1)p\\\
    }\\)，\\(\\{q, 2q, \\dots, (p-1)q\\}\\)和\\(0\\)，所以  \n\\(\\Phi(n) = pq - [(q-1)\
    \ + (p-1) + 1] = pq - (p+q) + 1 = (p-1)(q-1) = \\Phi(p) \\Phi(q)\\)\n\n### 欧拉定理\n\
    \n- 对任意互质的a和n有：\n\n  \\( a^{\\phi(n)} \\equiv 1(\\text{mod } n) \\)\n\n  \\( a^{\\\
    phi(n)+1} \\equiv a(\\text{mod } n) \\)\n\n### 欧拉定理（证明）\n\n\\(a^{\\phi(n)} \\\
    equiv 1(\\text{mod } n)\\)\n\n（1）若 \\(n\\) 是素数，根据 \\(\\phi(n)=(n-1)\\) 和费马小定理，则上式成立；\n\
    \n若p是素数，a是正整数且不能被p整除，则a<sup>p-1</sup> mod p=1\n\n（2）所有小于 \\(n\\)，且与 \\(n\\) 互质的正整数的集合\
    \ \\(R = \\{x_1, x_2, \\cdots, x_{\\phi(n)}\\}\\)\n\n### 欧拉定理（证明）\n\n- 即每一个元素都有\
    \ $\\gcd(x_i,n)=1$。用 $a$ 与 $R$ 中的每个元素模 $n$ 相乘：\n\n  $$S=\\{(ax_1\\bmod n),(ax_2\\\
    bmod n),\\ldots,(ax_{\\phi(n)}\\bmod n)\\}$$\n\n- $S$ 是 $R$ 的一个排列，因为\n\n  (1)\
