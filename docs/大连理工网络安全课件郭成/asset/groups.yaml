    +   - 所有加密算法都涉及到整数集上的算术运算，如果用到除法，必须使用定义在域上的运算。


    +   - 整数集里的数与给定的二进制位数所能表达的信息一一对应，即整数集的范围从0到2ⁿ-1，正好对应一个n位的字。


    +   - 将一个整数集不平均地映射到自身的算法用于加密时可能要弱于一个提供一一映射的算法，因此，有限域GF(2ⁿ)对加密算法是很有吸引力的。所以要寻找一个包含2ⁿ个元素的集合，其上定义了加法和乘法使之成为一个域，给集合的每个元素赋值为0到2ⁿ-1之间的唯一整数，用多项式算术来构造所需的域。


    +   - 可以使用扩展的欧几里德算法来为集合中的元素找到逆元。'
