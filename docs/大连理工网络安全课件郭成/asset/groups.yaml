  - '[PAGE 216]


    # # RSA密码体制基本原理


    +   - RSA算法满足公开密钥加密的要求，必须符合下列条件：

    +     - 有可能找到e, d, n的值，使得对所有M<n有M<sup>ed</sup> mod n = M

    +     - 对于所有M<n的值，要计算M<sup>e</sup>和C<sup>d</sup>是相对容易的

    +     - 在给定e和n时，计算d是不可行的


    +   - 几个关系

    +     - φ(n) = φ(pq)=φ(p)φ(q)=(p-1)(q-1), p,q are prime

    +     - ed mod φ(n)=1, ed = kφ(n)+1, 即ed≡1 mod φ(n), d≡e<sup>-1</sup> mod φ(n)'
  - '[PAGE 217]


    # # RSA密码体制基本原理


    定理：给定ed mod φ(n) = 1, m∈[0, n-1], gcd(m, n)=1，则：


    (mᵉ mod n)ᵈ mod n = mᵉᵈ mod n = m


    证明：∵ ed mod φ(n) = 1


    ∴ ed = kφ(n)+1，对某些整数k


    ∴ mᵉᵈ mod n = mᵏφ(n)+1 mod n


    = m(mᵏφ(n) mod n) mod n


    ∴ mᵏφ(n) mod n = (mφ(n) mod n)ᵏ mod n


    = 1ᵏ mod n = 1


    ∴ mᵉᵈ mod n = (m* 1) mod n = m'
  - '[PAGE 218]


    证明：\( M^{ed} \mod n = M \)

    \( ed \mod \phi(n) = 1 \)，存在整数 \( k \) 满足 \( ed = k\phi(n) + 1 \)，

    因此，我们必须证明 \( M^{k\phi(n)+1} \mod n = M^{k(p-1)(q-1)+1} \mod n = M \)

    首先证明 \( M^{k(p-1)(q-1)+1} \mod p = M \mod p \)

    情况1：\( M \) 和 \( p \) 不是互素的，即 \( p \) 整除 \( M \)。此时 \( M \mod p = 0 \)，

    因此有 \( M^{k(p-1)(q-1)+1} \mod p = 0 \)，

    从而 \( M^{k(p-1)(q-1)+1} \mod p = M \mod p \)。'
  - '[PAGE 219]


    情况2：如果$M$和$p$互素，由欧拉定理，$M^{\phi(p)}\ \mathrm{mod}\ p=1$。继续如下步骤：


    $M^{k(p-1)(q-1)+1}\ \mathrm{mod}\ p=[(M)M^{k(p-1)(q-1)}]\ \mathrm{mod}\ p$


    $=[(M)(M^{\phi(p)})^{k(q-1)}]\ \mathrm{mod}\ p$


    $=(M\ \mathrm{mod}\ p)\times[(M^{\phi(p)})\ \mathrm{mod}\ p]^{k(q-1)}$


    $=(M\ \mathrm{mod}\ p)\times(1)^{k(q-1)}$


    $=M\ \mathrm{mod}\ p$


    $[M^{k(p-1)(q-1)+1}-M]\ \mathrm{mod}\ p=[M^{k(p-1)(q-1)+1}\ \mathrm{mod}\ p]-[M\
    \mathrm{mod}\ p]=0$


    因此$p$整除$[M^{k(p-1)(q-1)+1}-M]$，同理$q$也整除$[M^{k(p-1)(q-1)+1}-M]$。


    因为$p$和$q$为不同的素数，因此必定存在一个整数$r$满足


    $[M^{k(p-1)(q-1)+1}-M]=(pq)r=nr$


    因此，$n$整除$[M^{k(p-1)(q-1)+1}-M]$，所以$M^{k\phi(n)+1}\ \mathrm{mod}\ n=M^{k(p-1)(q-1)+1}\
    \mathrm{mod}\ n=M$。'
