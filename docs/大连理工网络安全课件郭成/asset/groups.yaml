    \n- Diffie-Hellman密钥交换算法是基于有限域GF中的指数运算的（模一个素数或多项式）\n\n- Diffie-Hellman密钥交换算法的安全性依赖于求解离散对数问题DLP\n\
    \n## Diffie-Hellman Key Exchange\n\n- 通信双方约定一个大素数（或多项式）\\(p\\)，和模\\(p\\)的一个素根\\\
    (\\alpha\\)\n- 各方产生公开密钥\n  - 选择一个秘密钥（数值），如\\(x_A < p，x_B < p\\)\n  - 计算公钥，如\\\
    (y_A=\\alpha^{x_A}\\bmod p，y_B=\\alpha^{x_B}\\bmod p\\)，并相互交换\n- 双方共享的会话密钥\\(K_{AB}\\\
