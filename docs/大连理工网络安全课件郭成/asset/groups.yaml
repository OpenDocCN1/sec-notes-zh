    \ n) mod n\n\n## 模算术运算\n\n(a + b) mod n = (a mod n + b mod n) mod n\n\n证明：定义 (a\
    \ mod n) = ra, (b mod n) = rb\n于是存在整数 j, k 使得 a = ra + jn, b = rb + kn。\n那么\n\
    (a + b) mod n = (ra + jn + rb + kn) mod n\n= (ra + rb + (k + j)n) mod n\n= (ra\
    \ + rb) mod n\n= [(a mod n) + (b mod n)] mod n\n\n"
