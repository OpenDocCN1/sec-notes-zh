    \ authentication tied to ciphertext\n\n## 11.2.3 散列函数 Hash Function\n\n- 一个散列函数以变长的报文M作为输入，产生定长的散列码H(M)，作为输出，亦称作报文摘要Message\
    \ Digest。散列码是报文所有比特的函数值，具有差错检测能力，报文任意一比特的改变都将引起散列码的改变\n- 不同的散列码使用方式\n- 对附加了散列码的报文进行加密\n\
    - 使用常规加密方法仅对散列码加密\n- 使用公开密钥方法仅对散列码加密，提供数字签名\n- 同时提供保密和签名，可以分别使用常规方法加密报文及使用公开密钥方法加密散列码\n\
    - 其他\n- 对避免加密的方法重视的原因加密过程很慢，硬件开销大\n\n"
  mdcn: "\n\n## 公钥证书的交换\n\nFigure 10.4 Exchange of Public-Key Certificates\n\n## 10.1.3\
    \ 利用公钥密码分配传统密码体制的密钥\n\n- 采用前述方法获得的公钥可以用于保密和认证之需\n- 公钥密码算法速度较慢，因此更适合作为传统密码中实现秘密密钥分配的一种手段\n\
    - 因此，需要产生会话密码来加密\n- 已经有一些方法用来协商适当的会话密钥\n\n## 10.2 Diffie-Hellman密钥交换\n\n- Diffie和Hellman在1976年首次提出了公钥算法，给出了公钥密码学的定义，该算法通常被称为Diffie-Hellman密钥交换算法\n\
    - Diffie-Hellman密钥交换算法是一种公钥分发机制\n  - 它不是用来加密消息的\n  - 所生成的是通信双方共享的会话密钥，必须保密，其值取决于通信双方的私钥和公钥信息\n\
    - Diffie-Hellman密钥交换算法是基于有限域GF中的指数运算的(模一素数或多项式)\n- Diffie-Hellman密钥交换算法的安全性依赖于求解离散对数问题DLP\n\
    \n## Diffie-Hellman Key Exchange\n\n- 通信双方约定一个大素数(或多项式)p，和模p的一个素根α\n- 各方产生公开密钥\n\
    \  - 选择一个秘密钥(数值)，如x<sub>A</sub> < p，x<sub>B</sub> < p\n  - 计算公钥，如y<sub>A</sub>\
    \ = α<sup>x<sub>A</sub></sup> mod p, y<sub>B</sub> = α<sup>x<sub>B</sub></sup>\
    \ mod p，并相互交换\n- 双方共享的会话密钥K<sub>AB</sub>可以如下算出\n  - K<sub>AB</sub> = α<sup>x<sub>A</sub>.x<sub>B</sub></sup>\
    \ mod p\n  - = y<sub>A</sub><sup>x<sub>B</sub></sup> mod p (which B can compute)\n\
    \  - = y<sub>B</sub><sup>x<sub>A</sub></sup> mod p (which A can compute)\n- K<sub>AB</sub>是双方用对称密码通信时共享的密钥\n\
    - 如果双方继续通信，可以继续使用这个密钥，除非他们要选择新的密钥\n- 攻击者如果想要获得x，则必须解决DLP问题\n\n## 10.2.2 Diffie-Hellman密钥交换协议\n\
    \n- 本协议不能抵抗中间人攻击\n\nFigure 10.8 Diffie-Hellman Key Exchange\n\n## 中间人攻击\n\n假定A和B希望交换密钥，而D是攻击者，攻击过程如下：\n\
    \n(1) 为了进行攻击，D先生成两个随机的私钥\\(X_{D1}\\)和\\(X_{D2}\\)，然后计算相应的公钥\\(Y_{D1}\\)和\\(Y_{D2}\\\
    )。\n\n(2) Alice将\\(Y_A\\)传递给Bob。\n\n(3) D截获了\\(Y_A\\)，将\\(Y_{D1}\\)传给B。D同时计算\\\
    (K_2 = (Y_A)^{X_{D2}} \\mod q\\)。\n\n(4) B收到\\(Y_{D1}\\)，计算\\(K_1 = (Y_{D1})^{X_B}\
    \ \\mod q\\)。\n\n(5) B将\\(Y_B\\)传给A。\n\n(6) D截获了\\(Y_B\\)，将\\(Y_{D2}\\)传给A。D计算\\\
    (K_1 = (Y_B)^{X_{D1}} \\mod q\\)。\n\n(7) A收到\\(Y_{D2}\\)，计算\\(K_2 = (Y_{D2})^{X_A}\
    \ \\mod q\\)。\n\n此时，B和A想，他们已共享了密钥，但实际上，B和D共享了密钥\\(K_1\\)，而A和D共享了密钥\\(K_2\\)。接下来，B和A之间的通信以下列方式泄密：\n\
    \n(1) A发了一份加了密的消息M：\\(E(K_2, M)\\)。\n\n(2) D截获了该秘密消息，解密，恢复出M。\n\n(3) D将\\(E(K_1,\
    \ M)\\)或\\(E(K_1, M')\\)发给B，其中\\(M'\\)是任意的消息。\n\n2022-11-3 69/60 现代密码学理论与实践-10\n\
    \n## 基于DLP的概率密码系统 ElGamal Cryptosystem\n\n- 假设A和B互相通信，共享大素数p，本原元素a，0≤m≤p-1\n-\
    \ 加密：\n  - A选择k∈[0, p-1]，k的作用其实即为xA，A访问公共区域找到B的公开密钥YB = αxB mod p，计算：\n    - K\
    \ = (YB)k mod p，即K = αxBk mod p\n    - c1 = αk mod p\n    - c2 = mK mod p\n  \
    \  - 密文即为 (c1, c2)\n- 解密：\n  - B首先恢复K：K = c1xB mod p = αkxB mod p\n  - 然后恢复m：m\
    \ = c2/K mod p = c2K-1 mod p\n\n## ElGamal Cryptosystem\n\n例：P = 17，α = 3，x_A\
    \ = 2，x_B = 5，m = 11，从A发送到B，A选择k = 7。\n\n求：密文(c₁, c₂)并解密\n\n## ElGamal Cryptosystem\n\
    \n例：P = 17, α= 3, xA = 2, xB = 5, m = 11，从A发送到B, A选择k = 7.\n\n求：密文(c1, c2)并解密\n\
    \n加密：YA = αxA mod P = 32 mod 17 = 9  \nYB = αxB mod P = 35 mod 17 = 5  \nK = (YB)k\
    \ mod P = 57 mod 17 = 10  \nc1 = αk mod P = 37 mod 17 = 11  \nc2 = mK mod P =\
    \ 10x11 mod 17 = 8  \n所以，密文C = (c1, c2) = (11, 8)\n\n解密：K = c1xB mod P = 115 mod\
    \ 17 = 10  \nc2 = mK mod P = 10m mod 17 = 8  \nm = c2/K mod P = c2K-1 mod P  \n\
    K K-1 mod P = 1，即10 K-1 mod 17 = 1，得K-1 = 12  \n所以，明文m = c2K-1 mod P = 8x12 mod\
    \ 17 = 11\n\n## 网络信息安全\n\n# Chapter 11 Message Authentication and Hash Functions\n\
    \n## MAC: 消息认证码的特点\n\n- MAC加密所得的消息校验和\n  - \\( MAC = C_K(M) \\)\n- 使用一个秘密密钥K，浓缩一个变长的消息M，产生一个固定长度的认证子\n\
    - MAC是一种多对一的函数\n- 定义域由任意长的消息组成，值域由所有可能的MAC和密钥组成。若使用n位长的MAC，则有2^n个可能的MAC，有N条可能的消息，N>>2^n。若密钥长度为k，则有2^k种可能的密钥。\n\
    - 如N为100，n为10，共有2^100不同的消息，2^10种不同的MAC，平均而言同一MAC可由2^100/2^10=2^90条不同的消息产生。若密钥长度为5，则从消息集合到MAC值的集合有2^5=32不同映射。\n\
    - 可以证明，由于认证函数的数学性质，与加密相比，认证函数更不易被攻破\n\n## Figure 11.4 Basic Uses of Message Authentication\
    \ Code (MAC)\n\n(a) Message authentication\n\n(b) Message authentication and confidentiality;\
    \ authentication tied to plaintext\n\n(c) Message authentication and confidentiality;\
    \ authentication tied to ciphertext\n\n## 11.2.3 散列函数 Hash Function\n\n- 一个散列函数以变长的报文M作为输入，产生定长的散列码H(M)，作为输出，亦称作报文摘要Message\
    \ Digest。散列码是报文所有比特的函数值，具有差错检测能力，报文任意一比特的改变都将引起散列码的改变\n- 不同的散列码使用方式\n- 对附加了散列码的报文进行加密\n\
    - 使用常规加密方法仅对散列码加密\n- 使用公开密钥方法仅对散列码加密，提供数字签名\n- 同时提供保密和签名，可以分别使用常规方法加密报文及使用公开密钥方法加密散列码\n\
    - 其他\n- 对避免加密的方法重视的原因加密过程很慢，硬件开销大\n\n"
