    # 英文字母使用频率用于密码分析


    +   - 关键的一点，单表代换不能改变相关字母出现的频率

    +   - 这是由阿拉伯科学家在公元九世纪就分析发现了

    +   - 所以，只要统计密文中字母出现的频率，与已知的统计值做比较就可以分析出相应明文字母了

    +   - 如果Caesar密码中字母呈现出通常的峰值和低谷，那么单表代换也会呈现相同的特性，比如：

    +     - 峰值在：A-E-H-I, N-O, R-S-T

    +     - 低谷在：J-K, Q, X-Z

    +   - 双字母、三字母出现特性表也会有助于破译密文'
