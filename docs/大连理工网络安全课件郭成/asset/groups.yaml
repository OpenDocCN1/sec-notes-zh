  - '[PAGE 135]


    # 双重DES和三重DES


    +   - 双重DES（Double DES）

    +     - 给定明文P和加密密钥K₁和K₂，

    +     - 加密：C=E_K₂[E_K₁[P]]

    +     - 解密：P=D_K₁[D_K₂[C]]

    +     - 密钥长度为56×2=112位


    存在中途相遇攻击问题


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_135_0.png)'
  - '[PAGE 136]


    # 中途相遇攻击(Meet-in-the-Middle Attack)


    +   - 这种攻击对使用两次加密的分组密码都有效

    +     C=E_{K_2}[E_{K_1}[P]]，则X=E_{K_1}[P]=D_{K_2}[C]

    +   - 若已知(P，C)，则

    +     - 对 $2^{56}$ 个可能的 $K_1$ 加密P，结果存入表中，按X值排序

    +     - 对 $2^{56}$ 个可能的 $K_2$ 解密C，在表中寻找匹配

    +     - 如果产生匹配，则用一个新的明文密文对检测所得两个密钥

    +     - 如果两密钥产生正确的密文，则接受为正确密钥


    对任意给定的明文P，双重DES产生的密文有 $2^{64}$ 可能，密钥空间为 $2^{112}$。对给定明文P，可产生给定密文C的密钥的个数平均为 $2^{112}/2^{64}=2^{48}$。上述攻击过程对第一个(P，C)对将产生
    $2^{48}$ 个错误的结果，而对第二个(P，C)对，错误结果的概率就降为 $2^{48-64}=2^{-16}$，即中途相遇攻击使用两组已知明文密文对就可以检测到正确密钥的概率是
    $1-2^{-16}$，攻击双重DES，工作量仅为 $2^{56}$，与攻击单DES所需的 $2^{55}$ 差不多。'
  - '[PAGE 137]


    # 6.1.2 使用两个密钥的三重DES


    +   - 使用两个密钥进行三次加密：E-D-E sequence

    +     - `C ≡ E_{K1}[D_{K2}[E_{K1}[P]]]`

    +     - 如果 K1=K2，则相当于单次DES

    +   - 已被用于密钥管理标准 ANSI X9.17 和 ISO8732

    +   - 当前还没有对三重DES的可行攻击方法


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_137_0.png)'
  - '[PAGE 138]


    # # 6.1.3 使用三个密钥的三重DES


    +   - 虽然对于使用两个密钥的Triple-DES还没有实际的成功攻击，但是仍然令人有些担心


    +   - 因此可以考虑使用三个密钥的Triple-DES，这样，密钥的长度就是168位


    +   - \( C = E_{K3}[D_{K2}[E_{K1}[P]]] \)


    +   - 使用三个密钥的Triple-DES如今已被广泛采用，如PGP，S/MIME


    +   - 当然还有使用更多重DES的，如5DES'
  - '[PAGE 139]


    # 6.2 分组密码的工作模式


    | Mode | Description | Typical Application |

    |---|---|---|

    | Electronic Codebook (ECB) | Each block of 64 plaintext bits is encoded independently
    using the same key. | • Secure transmission of single values (e.g., an encryption
    key) |

    | Cipher Block Chaining (CBC) | The input to the encryption algorithm is the XOR
    of the next 64 bits of plaintext and the preceding 64 bits of ciphertext. | •
    General-purpose block-oriented transmission<br>• Authentication |

    | Cipher Feedback (CFB) | Input is processed s bits at a time. Preceding ciphertext
    is used as input to the encryption algorithm to produce pseudorandom output, which
    is XORed with plaintext to produce next unit of ciphertext. | • General-purpose
    stream-oriented transmission<br>• Authentication |

    | Output Feedback (OFB) | Similar to CFB, except that the input to the encryption
    algorithm is the preceding DES output. | • Stream-oriented transmission over noisy
    channel (e.g., satellite communication) |

    | Counter (CTR) | Each block of plaintext is XORed with an encrypted counter.
    The counter is incremented for each subsequent block. | • General-purpose block-oriented
    transmission<br>• Useful for high-speed requirements |'
  - '[PAGE 140]


    # 电子密码本模式Electronic Codebook, ECB


    +   - 明文分成64的分组进行加密，必要时填充，每个分组用同一密钥加密，同样明文分组加密得相同密文


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_140_0.png)


    Figure 6.3  Electronic Codebook (ECB) Mode'
  - '[PAGE 141]


    # # ECB模式的局限性


    +   - ECB模式特别适合数据较少的情况，如安全传输DES密钥

    +   - 一段明文消息中若有几个相同的明文组，则密文也将出现几个相同的片段

    +   - 对于很长的消息，ECB是不安全的，如果消息是非常结构化的，密码分析可能利用其结构特征来破解

    +   - ECB的弱点来源于其加密过的密文分组是互相独立的'
  - '[PAGE 142]


    <!-- no content -->'
  - '[PAGE 143]


    # # CBC的优点和局限


    +   - 每个密文分组依赖于所有明文分组

    +   - 明文消息中的任何一点变化都会影响所有的密文分组

    +   - 发送方和接收方需要共享初始向量Initial Value(IV)

    +     - 如果IV被明文传送，则攻击者可以改变第一个分组的某些位，然后预先改变IV中的某些位，则接收者收到的P1也就相应改变了

    +     - 因此，IV必须是一个固定的值或者必须用ECB方式在消息之前加密传送

    +   - 在消息的最后，还要处理不够长度的分组

    +     - 可以填充已知非数据值，或者在最后一块补上填充位长度

    +     - eg. [ b1 b2 b3 0 0 0 0 5 ] <- 3 data bytes, then 5 bytes pad+count'
  - '[PAGE 144]


