  - '[PAGE 109]


    # gcd(a, b) = gcd(b, a mod b)


    使d等于gcd(a,b),根据gcd的定义，有d|a和d|b成立。对于任意正整数b,a可以表示为如下形式：


    a=kb+r =r(mod b)

    a mod b=r


    其中k,r为整数。因此，对于某个整数k,有(a mod b)=a-kb。

    因为d|b，所以有d|kb；又因为d|a，所以有d|(a mod b). 这说明d是b和(a mod b)的公因子。反之，如果d是b和(a mod b)的公因子，那么d|kb并且由此可知d|[kb+(a
    mod b)],即d|a。因此，a和b的公因子的集合与b和(a mod b)的公因子的集合相等。'
