    # 公开可访问的目录


    +   - 维护一个动态可访问的公钥目录可以获得更大程度的安全性

    +   - 一个可信实体或组织负责这个公开目录的维护和分配

    +     - 目录包含{name, public-key}等项

    +     - 每一通信方通过目录管理员以安全的方式注册一个公钥

    +     - 通信方在任何时刻可以用新的密钥替代当前的密钥

    +     - 目录定期更新

