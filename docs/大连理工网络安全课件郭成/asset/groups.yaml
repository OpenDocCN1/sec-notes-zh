    phi(n)} ax_i \\equiv \\prod_{i=1}^{\\phi(n)} x_i (\\mod n)\\)\n\n\\(a^{\\phi(n)}\
    \ \\times \\left[\\prod_{i=1}^{\\phi(n)} x_i \\right] \\equiv \\prod_{i=1}^{\\\
    phi(n)} x_i (\\mod n)\\)\n\n\\(a^{\\phi(n)} \\equiv 1(\\mod n)\\)\n\n## 8.4 Chinese\
