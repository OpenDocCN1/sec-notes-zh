    \n## 6.1.3 使用三个密钥的三重DES\n\n- 虽然对于使用两个密钥的Triple-DES还没有实际的成功攻击，但是仍然令人有些担心\n- 因此可以考虑使用三个密钥的Triple-DES，这样，密钥的长度就是168位\n\
    - \\( C = E_{K3}[D_{K2}[E_{K1}[P]]] \\)\n- 使用三个密钥的Triple-DES如今已被广泛采用，如PGP，S/MIME\n\
    - 当然还有使用更多重DES的，如5DES\n\n## 6.2 分组密码的工作模式\n\n| Mode | Description | Typical Application\
    \ |\n|---|---|---|\n| Electronic Codebook (ECB) | Each block of 64 plaintext bits\
    \ is encoded independently using the same key. | • Secure transmission of single\
    \ values (e.g., an encryption key) |\n| Cipher Block Chaining (CBC) | The input\
    \ to the encryption algorithm is the XOR of the next 64 bits of plaintext and\
    \ the preceding 64 bits of ciphertext. | • General-purpose block-oriented transmission<br>•\
    \ Authentication |\n| Cipher Feedback (CFB) | Input is processed s bits at a time.\
    \ Preceding ciphertext is used as input to the encryption algorithm to produce\
    \ pseudorandom output, which is XORed with plaintext to produce next unit of ciphertext.\
    \ | • General-purpose stream-oriented transmission<br>• Authentication |\n| Output\
    \ Feedback (OFB) | Similar to CFB, except that the input to the encryption algorithm\
    \ is the preceding DES output. | • Stream-oriented transmission over noisy channel\
    \ (e.g., satellite communication) |\n| Counter (CTR) | Each block of plaintext\
    \ is XORed with an encrypted counter. The counter is incremented for each subsequent\
    \ block. | • General-purpose block-oriented transmission<br>• Useful for high-speed\
    \ requirements |\n\n## 电子密码本模式Electronic Codebook, ECB\n\n- 明文分成64的分组进行加密，必要时填充，每个分组用同一密钥加密，同样明文分组加密得相同密文\n\
    \n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_140_0.png)\n\nFigure 6.3  Electronic\
    \ Codebook (ECB) Mode\n\n## ECB模式的局限性\n\n- ECB模式特别适合数据较少的情况，如安全传输DES密钥\n- 一段明文消息中若有几个相同的明文组，则密文也将出现几个相同的片段\n\
    - 对于很长的消息，ECB是不安全的，如果消息是非常结构化的，密码分析可能利用其结构特征来破解\n- ECB的弱点来源于其加密过的密文分组是互相独立的\n\n\
    ## CBC的优点和局限\n\n- 每个密文分组依赖于所有明文分组\n- 明文消息中的任何一点变化都会影响所有的密文分组\n- 发送方和接收方需要共享初始向量Initial\
    \ Value(IV)\n  - 如果IV被明文传送，则攻击者可以改变第一个分组的某些位，然后预先改变IV中的某些位，则接收者收到的P1也就相应改变了\n\
