    \ 0426  \n1704^71 mod 3233 = 3106，...，  \nC = 3106 0100 0931 2691 1984 2927\n\n\
    +   - RSA的安全性  \n+     有三种可能的对RSA的攻击方法  \n+     - 强行攻击：尝试所有可能的密钥  \n+     - 数学攻击：对两个素数乘积的因子分解(FAC问题)\
    \  \n+     - 计时攻击：依赖于解密算法的运行时间  \n+   RSA的安全性问题依赖于大合数的素因子分解，即factorization problem\
    \ (FAC)，FAC的计算复杂性为T=exp((ln(n)ln(ln(n)))^1/2)，同DLP问题。"
