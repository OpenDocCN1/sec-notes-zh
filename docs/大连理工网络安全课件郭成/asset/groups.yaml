  - '[PAGE 298]


    1. User logs on to workstation and requests service on host.


    once per user logon session


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_298_0.png)


    2. AS verifies user''s access right in database, creates ticket-granting ticket
    and session key. Results are encrypted using key derived from user''s password.


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_298_1.png)


    request ticket-granting ticket


    ticket + session key


    request service-granting ticket


    ticket + session key


    once per type of service


    3. Workstation prompts user for password and uses password to decrypt incoming
    message, then sends ticket and authenticator that contains user''s name, network
    address, and time to TGS.


    once per server session


    request service


    provide server authenticator


    4. TGS decrypts ticket and authenticator, verifies request, then creates ticket
    for requested server.


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_298_2.png)


    5. Workstation sends ticket and authenticator to server.


    6. Server verifies that ticket and authenticator match, then grants access to
    service. If mutual authentication is required, server returns an authenticator.


    # Figure 14.1 Overview of Kerberos'
  - '[PAGE 299]


    # # Kerberos 4中所用元素之作用


    # ## Table 14.2 Rationale for the Elements of the Kerberos Version 4 Protocol
    (page 1 of 2)


    | Message (1)   | Client requests ticket-granting ticket                                       |

    |---------------|------------------------------------------------------------------------------|

    | \( ID_C \)     | Tells AS identity of user from this client                                   |

    | \( ID_{TGS} \) | Tells AS that user requests access to TGS                                    |

    | \( TS_1 \)     | Allows AS to verify that client''s clock is synchronized with
    that of AS      |

    | Message (2)   | AS returns ticket-granting ticket                                            |

    | \( E_{K_c} \)  | Encryption is based on user''s password, enabling AS and client
    to verify     |

    |               | password, and protecting contents of message (2)                             |

    | \( K_{c,tgs} \) | Copy of session key accessible to client; created by AS to
    permit secure     |

    |               | exchange between client and TGS without requiring them to share
    a            |

    |               | permanent key                                                                |

    | \( ID_{tgs} \) | Confirms that this ticket is for the TGS                                     |

    | \( TS_2 \)     | Informs client of time this ticket was issued                                |

    | \( Lifetime_2 \) | Informs client of the lifetime of this ticket                                |

    | \( Ticket_{tgs} \) | Ticket to be used by client to access TGS                                    |'
  - '[PAGE 300]


    | Message (3) | Client requests service-granting ticket |

    | --- | --- |

    | IDv: | Tells TGS that user requests access to server V |

    | Tickettgs: | Assures TGS that this user has been authenticated by AS |

    | Authenticatorc: | Generated by client to validate ticket |

    | Message (4) | TGS returns service-granting ticket |

    | Kc,tgs: | Key shared only by C and TGS; protects contents of message (4) |

    | Kc,v: | Copy of session key accessible to client; created by TGS to permit secure
    exchange between client and server without requiring them to share a permanent
    key |

