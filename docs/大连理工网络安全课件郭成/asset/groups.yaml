  - '[PAGE 3]


    # # Internet(网络互联)Security


    +   - Internet安全包括阻止、防止、检测和纠正信息传输和存储中出现的安全问题的措施

    +   - Internet安全的复杂性

    +     - 安全涉及到通信和网络

    +     - 安全机制或算法必须考虑各种各样潜在攻击

    +     - 要从可能存在哪些攻击方法来确定所需的安全机制

    +     - 安全机制的应用部署位置

    +     - 秘密信息的产生、分配和保护等问题'
  - '[PAGE 4]


    # # 第1章 引言


    +   - 本章要点


    +   - 安全攻击分为被动攻击和主动攻击。被动攻击包括非授权阅读消息、文件以及流量分析；主动攻击包括对消息和文件的修改以及拒绝服务。


    +   - 安全机制是一种处理过程，或含有该处理过程的设备，用来检测、阻止攻击或者从攻击状态里恢复为正常。这种机制如加密算法、数字签名和认证协议。


    +   - 安全服务包括认证、访问控制、数据保密性、数据完整性、不可否认性以及可用性。'
