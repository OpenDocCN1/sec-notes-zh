    \n## 报文认证Message Authentication\n\n- 消息认证（报文认证）关心的问题是\n  - 保护消息的完整性\n  - 验证发起方身份\n\
    \  - 消息源的不可否认（解决分歧）\n\n- 消息认证要考虑安全需求\n\n- 三种消息认证的方法\n  - 消息加密\n  - 消息认证码(MAC)\n\
    \  - 哈希函数\n\n## 11.1 对认证的要求\n\n### 可能有下述攻击\n\n- 泄密Disclosure，将消息透露给没有合法身份的第三方\n\
    - 传输分析Traffic analysis，分析双方通信模式\n- 伪装Masquerade，欺诈源向网络中插入一条消息\n- 内容篡改Content modification，对消息内容的修改\n\
    - 顺序篡改Sequence modification，对消息顺序的修改\n- 计时篡改Timing modification，对消息的延时和重放\n- 信源抵赖Source\
    \ repudiation，发送方否认发送过某消息\n- 信宿抵赖Destination repudiation，接收方否认接收过某消息\n\n## 11.2\
    \ 认证函数\n\n### 11.2.1 消息加密\n\n- 消息加密本身提供了一种认证手段\n- 对称加密\n- 接收方可以确信消息是由发送方产生的，因为除了接收方以外只有发送方拥有加密密钥，产生出用此密钥可以解密的密文\n\
    - 如果消息可以是任意的位模式，接收方无法确定收到的消息是合法明文的密文。因此，通常不管密文的值是什么，如果解密后得到的明文有合法明文的位模式，接收方都会作为真实的密文接收。\n\
    \n### 解决解密所得消息是否具有可读性的问题\n\n- 要求明文具有某种易于识别的结构，如在加密前对每个消息附加一个帧校验序列FCS\n- FCS和加密函数执行的顺序很重要\n\
    \nFigure 11.2 Internal and External Error Control\n\n### 公钥加密作为认证手段\n\n- 若要提供认证，发送方用自己的私钥对消息加密，接收方用发送方的公钥解密(验证)，就提供了认证功能。\n\
    - 如果发送方用私钥加密消息，再用接收方的公钥加密，就实现了既保密又认证的通信\n- 既保密又认证的通信的代价是需要执行四次复杂的公钥算法而不是两次。\n\n\
    ### 11.2.2 消息认证码MAC\n\n- 使用密钥产生短小的定长数据分组，即所谓的密码检验MAC，将它附加在报文中。通信双方A和B共享密钥K，报文从A发往B，A计算MAC=C<sub>K</sub>(M)，附在报文后发给B。B对接收到的报文重新计算MAC，并与接收到的MAC比较。如果只有收发双方知道密钥且两个MAC匹配，则：\n\
    \  - 接收方可以确信报文未被更改；\n  - 接收方可以确信报文来自声称的发送者；\n  - 接收方可以确信报文序号正确，如果有的话。\n- 报文认证不提供保密\n\
    - MAC函数类似加密，但非数字签名，也无需可逆\n- 将MAC直接与明文并置，然后加密传输比较常用\n\n### MAC: 消息认证码的特点\n\n- MAC加密所得的消息校验和\n\
    \  \\( MAC = C_K(M) \\)\n- 使用一个秘密密钥K，浓缩一个变长的消息M，产生一个固定长度的认证子\n- MAC是一种多对一的函数\n\
    - 定义域由任意长的消息组成，值域由所有可能的MAC和密钥组成。若使用n位长的MAC，则有2^n个可能的MAC，有N条可能的消息，N>>2^n。若密钥长度为k，则有2^k种可能的密钥。\n\
    - 如N为100，n为10，共有2^100不同的消息，2^10种不同的MAC，平均而言同一MAC可由2^100/2^10=2^90条不同的消息产生。若密钥长度为5，则从消息集合到MAC值的集合有2^5=32不同映射。\n\
    - 可以证明，由于认证函数的数学性质，与加密相比，认证函数更不易被攻破\n\nFigure 11.4 Basic Uses of Message Authentication\
    \ Code (MAC)\n\n(a) Message authentication\n\n(b) Message authentication and confidentiality;\
    \ authentication tied to plaintext\n\n(c) Message authentication and confidentiality;\
    \ authentication tied to ciphertext\n\n### 11.2.3 散列函数 Hash Function\n\n- 一个散列函数以变长的报文M作为输入，产生定长的散列码H(M)，作为输出，亦称作报文摘要Message\
    \ Digest。散列码是报文所有比特的函数值，具有差错检测能力，报文任意一比特的改变都将引起散列码的改变\n- 不同的散列码使用方式\n  - 对附加了散列码的报文进行加密\n\
    \  - 使用常规加密方法仅对散列码加密\n  - 使用公开密钥方法仅对散列码加密，提供数字签名\n  - 同时提供保密和签名，可以分别使用常规方法加密报文及使用公开密钥方法加密散列码\n\
    \  - 其他\n- 对避免加密的方法重视的原因\n  加密过程很慢，硬件开销大\n\nFigure 11.5 Basic Uses of Hash Function\
    \ (page 2 of 2)\n\n### Table 11.3 Basic Uses of Hash Function H (see Figure 11.5)\n\
    \n| A → B: \\( E_K[M \\| H(M)] \\) |\n|---|\n| • Provides confidentiality<br>—\
    \ Only A and B share \\( K \\)<br>• Provides authentication<br>— \\( H(M) \\)\
    \ is cryptographically protected |\n| (a) Encrypt message plus hash code |\n|\
    \ A → B: \\( M \\| E_K[H(M)] \\) |\n| • Provides authentication<br>— \\( H(M)\
    \ \\) is cryptographically protected |\n| (b) Encrypt hash code - shared secret\
    \ key |\n| A → B: \\( M \\| E_{KR_a}[H(M)] \\) |\n| • Provides authentication\
    \ and digital signature<br>— \\( H(M) \\) is cryptographically protected<br>—\
    \ Only A could create \\( E_{KR_a}[H(M)] \\) |\n| (c) Encrypt hash code - sender's\
    \ private key |\n| A → B: \\( E_K[M \\| E_{KR_a}[H(M)]] \\) |\n| • Provides authentication\
    \ and digital signature<br>• Provides confidentiality<br>— Only A and B share\
    \ \\( K \\) |\n| (d) Encrypt result of (c) - shared secret key |\n| A → B: \\\
    ( M \\| H(M \\| S) \\) |\n| • Provides authentication<br>— Only A and B share\
    \ \\( S \\) |\n| (e) Compute hash code of message plus secret value |\n| A → B:\
    \ \\( E_K[M \\| H(M) \\| S] \\) |\n| • Provides authentication<br>— Only A and\
    \ B share \\( S \\)<br>• Provides confidentiality<br>— Only A and B share \\(\
    \ K \\) |\n| (f) Encrypt result of (e) |\n\n"
