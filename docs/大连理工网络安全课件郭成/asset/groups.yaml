    \n## 对安全的攻击\n\n- **Interruption**: 对 availability 的攻击\n- **Interception**: 对 confidentiality\
    \ 的攻击\n- **Modification**: 对 integrity 的攻击\n- **Fabrication**: 对 authenticity\
    \ 的攻击\n\n## 1.4 安全服务\n\n- X.800 将安全服务定义为通信开放系统协议层提供的服务，从而保证系统或数据传输有足够的安全性\n- RFC2828\
    \ 定义安全服务为：一种由系统提供的对系统资源进行特殊保护的处理或通信服务；安全服务通过安全机制来实现安全策略\n- X.800 将安全服务分为 5 类共\
