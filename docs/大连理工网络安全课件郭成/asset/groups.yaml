  md: "\n\n## One-way Function and One-way Trapdoor Function\n\n### 定义8.1 单向函数 (One-way\
    \ Function)\n\n一函数 $f$ 若满足下列条件，则称 $f$ 为单向函数：\n\n- 对于所有属于 $f$ 域的任一 $x$，容易计算 $y=f(x)$。\n\
    - 对于几乎所有属于 $f$ 域的任一 $y$，求得 $x$，使 $y=f(x)$，在计算上不可行。\n\n### 定义8.2 单向陷井门函数 (One-way\
    \ Trapdoor Function)\n\n一“可逆”函数 $F$ 若满足下列二条件，则称 $F$ 为单向陷井门函数：\n\n- 对于所有属于 $F$\
    \ 域的任一 $x$，容易计算 $F(x)=y$；\n- 对于几乎所有属于 $F$ 域的任一 $y$，除非获得暗门信息（trapdoor），否则求出 $x$，使得\
    \ $x=F^{-1}(y)$ 在计算上不可行，$F^{-1}$ 为 $F$ 之逆函数；如有额外信息（暗门），则容易求出 $x=F^{-1}(y)$。\n\n\
    ## 单向函数举例\n\n### 1. Discrete Logarithm Problem (DLP) 离散对数问题\n\n令质数 $p$ 满足 $p-1$\
    \ 含有另一大质数 $q$ ($q$ 整除 $p-1$) 及一整数 $g$，$1<g<p-1$。\n\n若给定整数 $x$，求 $y = g^x \\bmod\
    \ p$，最多需要 $\\lfloor \\log_2 x \\rfloor + w(x) - 1$ 次乘法，$w(x)$ 为 $x$ 中所有 1 的个数。如\
    \ $x = 15$，即\n\n$x = (1111)_2$，$w(x)=4$，则 $g^{15} = ((g^2)g)^2 \\cdot g)^2 \\\
    cdot g \\bmod p$，只需要 $3 + 4 - 1 = 6$ 次乘法。\n\n但是若给定 $p, g$ 及 $y$，求 $x$，则为 DLP 问题，最快方法需要\
    \ $L(p) = \\exp\\{(\\ln p \\ln(\\ln p))^{1/2}\\}$ 次运算。\n\n当 $p=512$ 位时，$L(p)$\
    \ 约为 $2^{256} \\approx 10^{77}$，计算上不可行，因为 $2^{100} \\approx 10^{30}$，计算要 $10^{16}$\
    \ 年。\n\n## 单向函数举例（续）\n\n### 2. Factorization Problem 因数分解问题\n\n给定大素数 $p$ 和 $q$，求\
    \ $n = p \\times q$，只要一次乘法。\n\n给定 $n$，求 $p$ 和 $q$，即为因数分解问题 (FAC)，最快方法需要 $T(n)\
    \ = \\exp\\{c(\\ln n \\ln(\\ln n))^{1/2}\\}$ 次运算，其中 $c$ 为大于 1 的正整数。若 $p \\approx\
    \ n$，解离散对数比因数分解难。\n\n### 3. 背包问题 Knapsack Problem\n\n给定有限个自然数序列集合 $B=(b_1,b_2,\\\
    dots,b_n)$ 及二进制序列 $x=(x_1,x_2,\\dots,x_n)$，$x_i \\in (0,1)$，求 $S=\\sum x_i b_i$，最多只需\
    \ $n-1$ 次加法；但若给定 $B$ 和 $S$，求 $x$ 则非常困难。\n\n穷举时有 $2^n$ 种可能，当 $n$ 很大时为计算上不可行。Garey\
    \ 和 Johnson 证明，背包问题是 NP 问题 (Non-Polynomial)。\n\n## 单向函数及其交换性\n\n- 单向函数的交换性 (commutative\
    \ property)\n\n单向函数本身对近代密码学领域用处不大，但若具有交换性，则作用大。\n\n### 定义8.3 交换性\n\n令 $Z$ 为一集合，$F$\
    \ 为将 $Z$ 映射到 $Z$ 本身的函数集合。令 $z \\in Z$，$F_x(z)$ 表示此函数集合之第 $x$ 函数，若 $F_x(F_y(z))\
    \ = F_y(F_x(z))$，则称此函数集合具有交换性。例：$D(E(m)) = E(D(m))$。\n\n## 8.2 费马定理和欧拉定理\n\n###\
    \ 定理8.1 费马定理 Fermat’s Theorem\n\n若 $p$ 是素数，$a$ 是正整数且不能被 $p$ 整除，则 $a^{p-1} \\bmod\
    \ p = 1$。\n\n- 证明：\n  - 因为 $\\{a \\bmod p, 2a \\bmod p, \\dots, (p-1)a \\bmod\
    \ p\\}$ 是 $\\{1, 2, \\dots, (p-1)\\}$ 的置换形式，所以，$(a \\times 2a \\times \\dots \\\
    times (p-1)a) \\equiv (1 \\times 2 \\times \\dots \\times (p-1)) \\pmod p \\equiv\
    \ (p-1)! \\pmod p$。\n  - 但是，$a \\times 2a \\times \\dots \\times (p-1)a = (p-1)!\
    \ a^{p-1}$，因此 $(p-1)! a^{p-1} \\equiv (p-1)! \\pmod p$，两边去掉 $(p-1)!$，即得 $a^{p-1}\
    \ \\bmod p = 1$。\n  - 例如：$a=7$，$p=19$，$a^{p-1} \\bmod p = 7^{18} \\bmod 19 = ?$\n\
    \n    $7^2 = 49 \\equiv 11 \\pmod{19}$　　　 $7^4 = 121 \\equiv 7 \\pmod{19}$\n \
    \   $7^8 = 49 \\equiv 11 \\pmod{19}$　　　 $7^{16} = 121 \\equiv 7 \\pmod{19}$\n\n\
    \    $a^{p-1} = 7^{18} = 7^{16} \\times 7^2 \\equiv 7 \\times 11 \\equiv 1 \\\
    pmod{19}$\n\n用 $a$ 乘以集合中所有元素并对 $p$ 取模，则得到集合 $X=\\{a \\bmod p, 2a \\bmod p, \\\
    dots, (p-1)a \\bmod p\\}$。因为 $p$ 不能整除 $a$，所以 $X$ 的元素都不等于 0，而且各元素互不相等。\n\n假设 $a\
    \ \\equiv ka \\pmod p$，其中 $1 \\le j < k \\le p-1$，因为 $a$ 和 $p$ 互素，所以两边可以把 $a$\
    \ 消去，则推出 $j \\equiv k \\pmod p$，而这是不可能的。\n\n因此 $X$ 的 $p-1$ 个元素都是正整数且互不相等。所以说 $X$\
    \ 和 $\\{1, 2, \\dots, p-1\\}$ 构成相同，只是元素顺序不同。\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_165_0.png)\n\
    \n## 费马定理的等价形式\n\n- 费马定理等价形式\n  - $a^p \\equiv a \\pmod p$，$p$ 是素数\n  - 例如：$p=5,\
    \ a=3, 3^5=243 \\equiv 3 \\pmod 5$\n  - $p=5, a=10, 10^5=100000 \\equiv 10 \\\
    pmod 5 \\equiv 0 \\pmod 5$\n\n## 费马小定理（范例）\n\n（1）计算 $6^{10} \\bmod 11$；\n\n（2）计算\
    \ $3^{12} \\bmod 11$。\n\n### （1）计算 $6^{10} \\bmod 11$\n\n若 $p$ 是素数，$a$ 是正整数且不能被\
    \ $p$ 整除，则 $a^{p-1} \\bmod p = 1$。\n\n解法：我们可得 $6^{10} \\bmod 11 = 1$。这是 $p=11$\
    \ 时，可以使用费马小定理的第一个版本直接计算得到。\n\n### （2）计算 $3^{12} \\bmod 11$\n\n$a^p = a \\bmod\
    \ p$，$p$ 是素数。\n\n解法：此处指数（12）和模数（11）是不同的。\n\n```\n$3^{12} \\bmod 11=(3^{11}\\times3)\\\
    bmod11=(3^{11}\\bmod11)(3\\bmod11)=(3\\times3)\\bmod11=9$\n```\n\n## 费马大定理（费马最后定理）\n\
    \n- 将一个立方数分成两个立方数之和，或一个四次幂分成两个四次幂之和，或者一般地将一个高于二次的幂分成两个同次幂之和，这是不可能的。关于此，我确信已发现了一种美妙的证法，可惜这里空白的地方太小，写不下。\n\
    \n## 欧拉定理\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_171_0.png)\n\n- 欧拉（Euler,\
    \ Léonard, 1707年4月15日—1783年9月18日）是瑞士数学家和物理学家。\n\n## 欧拉函数 $\\varphi(n)$ 的证明\n\n\
    定理8.2 $p$ 和 $q$ 是素数，$n=p \\times q$，$\\varphi(n) = \\varphi(p)\\varphi(q) = (p-1)(q-1)$。\n\
    \n显然，对于素数 $p$，$\\varphi(p) = p-1$。\n\n证明：考虑余数集合 $\\{0, 1, \\dots, (pq-1)\\}$ 中不与\
    \ $n$ 互素的余数集合是 $\\{p, 2p, \\dots, (q-1)p\\}$，$\\{q, 2q, \\dots, (p-1)q\\}$ 和 $0$，所以\
    \ $\\varphi(n) = pq - [(q-1) + (p-1) + 1] = pq - (p+q) + 1 = (p-1)(q-1) = \\varphi(p)\\\
    varphi(q)$。\n\n## 欧拉定理\n\n- 对任意互质的 $a$ 和 $n$ 有：\n\n  $a^{\\phi(n)} \\equiv 1 \\\
    pmod{n}$\n\n  $a^{\\phi(n)+1} \\equiv a \\pmod{n}$\n\n## 欧拉定理（证明）\n\n$$\\prod_{i=1}^{\\\
    varphi(n)}(ax_i \\bmod n) = \\prod_{i=1}^{\\varphi(n)}x_i$$\n\n$$\\prod_{i=1}^{\\\
    varphi(n)} ax_i \\equiv \\prod_{i=1}^{\\varphi(n)} x_i \\pmod n$$\n\n$$a^{\\varphi(n)}\
    \ \\times \\left[\\prod_{i=1}^{\\varphi(n)} x_i\\right] \\equiv \\prod_{i=1}^{\\\
    varphi(n)} x_i \\pmod n$$\n\n$$a^{\\varphi(n)} \\equiv 1 \\pmod n$$\n\n## 8.4\
    \ Chinese Remainder Theorem\n\n- 中国余数定理 CRT 说明某一范围内的整数可通过它对两两互素的整数取模所得的余数来重构。\n\
    \n- $Z_{10}(0,1,\\dots,9)$ 中的 10 个整数可通过它们对 2 和 5 (10 的素因子) 取模所得的两个余数来重构。假设数 $x$\
    \ 的余数 $r_2=0$ 且 $r_5=3$，即 $x \\bmod 2 = 0$，$x \\bmod 5 = 3$，则 $x$ 是 $Z_{10}$ 中的偶数且被\
    \ 5 除余 3，唯一解 $x=8$。\n\n- 一种 CRT 的表示形式\n\n  令 $M = \\prod_{i=1}^k m_i$，其中 $m_i$\
    \ 两两互素，$1 \\le i, j \\le k, i \\ne j, \\gcd(m_i, m_j)=1$。\n\n  将 $Z_m$ 中的任一整数对应一个\
    \ $k$ 元组，该 $k$ 元组的元素均在 $Z_{m_i}$ 中，对应关系为 $A \\Leftrightarrow (a_1, a_2, \\dots,\
    \ a_k)$，其中 $A \\in Z_m$，对 $1 \\le i \\le k, a_i \\in Z_{m_i}$，且 $a_i = A \\bmod\
    \ m_i$。\n\n"
