  - '[PAGE 242]


    # Diffie-Hellman Key Exchange


    +   - 通信双方约定一个大素数(或多项式)\(p\)，和模\(p\)的一个素根\(\alpha\)

    +   - 各方产生公开密钥

    +     - 选择一个秘密钥(数值)，如\(x_A < p，x_B < p\)

    +     - 计算公钥，如\(y_A=\alpha^{x_A}\bmod p，y_B=\alpha^{x_B}\bmod p\)，并相互交换

    +   - 双方共享的会话密钥\(K_{AB}\)可以如下算出

    +     \[

    +     K_{AB}=\alpha^{x_Ax_B}\bmod p

    +     \]

    +     \[

    +     =y_A^{x_B}\bmod p\quad\text{(which B can compute)}

    +     \]

    +     \[

    +     =y_B^{x_A}\bmod p\quad\text{(which A can compute)}

    +     \]

    +   - \(K_{AB}\)是双方用对称密码通信时共享的密钥

    +   - 如果双方继续通信，可以继续使用这个密钥，除非他们要选择新的密钥

    +   - 攻击者如果想要获得x，则必须解决DLP问题'
  - '[PAGE 243]


    # Diffie-Hellman Example


    +   - Users Alice & Bob who wish to swap keys

    +   - Agree on prime p=353 and **a** =3

    +   - Select random secret keys:

    +     - A chooses x<sub>A</sub>=97,

    +     - B chooses x<sub>B</sub>=233

    +   - Compute public keys:

    +     - y<sub>A</sub>=3<sup>97</sup> mod 353 = 40　　　　(Alice)

    +     - y<sub>B</sub>=3<sup>233</sup> mod 353 = 248　　　(Bob)

    +   - Compute shared session key as:

    +     K<sub>AB</sub>= y<sub>B</sub><sup>x<sub>A</sub></sup> mod 353 = 248<sup>97</sup>
    mod 353 = 160　　　(Alice)

    +     K<sub>AB</sub>= y<sub>A</sub><sup>x<sub>B</sub></sup> mod 353 = 40<sup>233</sup>
    mod 353 = 160　　　(Bob)'
