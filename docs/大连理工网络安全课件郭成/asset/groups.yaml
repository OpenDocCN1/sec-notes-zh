  - '[PAGE 319]


    # Two-Way Authentication


    +   - 使用两条消息建立认证过程(A->B, B->A)

    +     - A的标识和A创建的消息

    +     - B所需要的消息

    +     - 消息的完整性和原创性(不能多次发送)

