    \n## 13.1 数字签名Digital Signature\n\n- 数字签名的简单定义\n\n- 数字签名是使以数字形式存储的明文信息经过特定密码变换生成密文，作为相应明文的签名，使明文信息的接收者能够验证信息确实来自合法用户，以及确认信息发送者身份。\n\
    \n- 对数字签名的基本要求\n\n- 在收发双方不能完全信任的情况下，需要除认证之外的其他方法来解决假冒和否认的问题，数字签名则是解决办法；\n\n- 签名接收者能容易地验证签字者对消息所做的数字签名，包括日期和时间；\n\
    \n- 任何人，包括签名接收者，都不能伪造签名者的签字；\n\n- 发生争议时，可由第三方解决。\n\n## 数字签名的基本形式\n\n- 数字签名与消息认证的区别\n\
    \  - 消息认证是使消息接收方验证消息发送者发送的内容有没有被修改过，对防止第三者破坏足够，但收发双方有利害冲突时就无法解决纷争，需要更严格的手段，即数字签名。\n\
    \n- 数字签名的基本形式\n  - 对消息签名的两种方法\n    - 对消息整体的签字，将被签消息整体经过密码变换得到签字；\n    - 对消息摘要的签字，附在被签消息之后，或嵌在某一特定位置上一段签字图样。\n\
    \  - 两类数字签名\n    - 确定性数字签名，明文与签名一一对应；\n    - 概率性数字签名，一个明文可以有多个合法签名，每次都不一样。\n\n\
    ## 13.1.3 仲裁数字签名\n\n- 涉及到一个仲裁方(arbiter A)\n- 签名方的签名报文首先送给仲裁者\n- 仲裁者对报文和签名进行测试以检验出处和内容，然后注上日期和仲裁说明后发给接收方\n\
    - 要求仲裁方在一定程度上是可以信任的\n- 可以用对称密码或公开密钥密码实现\n- 仲裁方可以知道消息，也可以不知道消息\n\n## 13.2 认证协议\n\
    \n- 认证服务和功能\n\n- 认证是证实信息交换过程有效性和合法性的一种手段，包括对通信对象的认证(身份认证)和报文内容的认证(报文认证)，起到数据完整性的保护。这里有\n\
    \n- 信息的真实性\n\n- 存储数据的真实性\n\n- 接收方提供回执\n\n- 发送方不可否认\n\n- 时效性和公证可能性\n\n- 认证的目的\n\
    \n- 防窃听、防假冒或拦截、防窃取等\n\n## 基本认证方法\n\n- 单向认证\n  - 使用对称加密方法，即一次一密方法的变形\n  - 使用公开密钥方法：A向B声称是A，B则向A送一随机数R，A用其私有密钥加密送B，B用A的公开密钥验证。\n\
    \  - 使用改进的口令方式\n- 双向认证\n  - 对称密钥方式(三次握手)\n  - 公开密钥方式，A、B双方使用不同的R值\n  - 时标方式\n\
    - 可信中继\n  - 使用KDC密钥分发中心\n  - 通过DASS (Distributed Authentication Security Service)\n\
    - 群认证(Group Authentication)\n\n## 对称加密方法\n\n- 使用两层传统加密密钥结构来保证分布环境中通信的保密性\n- 通常需要可信密钥分发中心Key\
    \ Distribution Center (KDC)\n  - 每一方与KDC共享主密钥\n  - KDC产生双方通信要用的会话密钥\n  - 用主密钥来分发会话密钥\n\
    \n## ElGamal的数据加密方法\n\n- 假定A和B互相通信，共享大素数p，本原元素a\n  0<= m <= p-1, gcd(a, p) = 1，A和B各有自己的秘密xA和xB\n\
    \n- 加密\n  A选择k∈[0, p-1]，k的作用即为xA，A访问公共区域找到B的公开密钥Y<sub>B</sub> = α<sup>x<sub>B</sub></sup>\
    \ mod p，计算：\n  K = (Y<sub>B</sub>)<sup>k</sup> mod p，即K = α<sup>x<sub>B</sub>k</sup>\
    \ mod p\n  c<sub>1</sub> = α<sup>k</sup> mod p\n  c<sub>2</sub> = mK mod p\n \
    \ 密文即为 (c<sub>1</sub>, c<sub>2</sub>)\n\n- 解密\n  B首先恢复K： K = c<sub>1</sub><sup>x<sub>B</sub></sup>\
