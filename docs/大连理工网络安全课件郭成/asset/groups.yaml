  - '[PAGE 205]


    # 公钥密码的分析


    +   - 公钥密码易受穷举攻击，解决方法是使用长密钥；同时为了便于实现加密和解密，又希望密钥足够短，目前仅限于密钥管理和签名。

    +   - 找出一种从给定的公钥计算出私钥是第二种攻击方法，尚未在数学上证明对一特定公钥算法这种攻击是不可行的，因此包括RSA在内的任何算法都是值得怀疑的。

    +   - 穷举消息攻击是第三种攻击形式，攻击者用公钥对所有可能的消息加密，并与传送的密文匹配，从而解密任何消息；抵抗的方法是在要发送的消息后附加随机数。'
  - '[PAGE 206]


    # # 9.2 RSA算法


    +   • 概述


    +   • 1977年，Rivest、Shamir、Adleman提出的非对称密码体制，是基于大合数的质因子分解问题的困难性。1994年4月一个小组通过Internet合作，8个月时间成功分解129位的数，大约428比特；1999年分解155位合数，最新的记录是2005年5月分解200位十进制数。


    +   • RSA专利于2000年9月20日到期。'
  - '[PAGE 207]


    # 9.2 RSA算法


    +   - 概述


    +   - RSA体制是一种分组密码体制，其明文和密文均是0至某$n-1$之间的整数，通常$n$的大小为1024位二进制或309位十进制数，也就是说$n$小于$2^{1024}$。'
