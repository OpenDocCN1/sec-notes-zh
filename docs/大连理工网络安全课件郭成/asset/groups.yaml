    ## Internet(网络互联)Security\n\n- Internet 安全包括阻止、防止、检测和纠正信息传输和存储中出现的安全问题的措施\n- Internet\
    \ 安全的复杂性\n  - 安全涉及到通信和网络\n  - 安全机制或算法必须考虑各种各样潜在攻击\n  - 要从可能存在哪些攻击方法来确定所需的安全机制\n\
    \  - 安全机制的应用部署位置\n  - 秘密信息的产生、分配和保护等问题\n\n## 第1章 引言\n\n- 本章要点\n- 安全攻击分为被动攻击和主动攻击。被动攻击包括非授权阅读消息、文件以及流量分析；主动攻击包括对消息和文件的修改以及拒绝服务。\n\
    - 安全机制是一种处理过程，或含有该处理过程的设备，用来检测、阻止攻击或者从攻击状态里恢复为正常。这种机制如加密算法、数字签名和认证协议。\n- 安全服务包括认证、访问控制、数据保密性、数据完整性、不可否认性以及可用性。\n\
    \n## 1.1 安全趋势\n\n## Vulnerabilities Reported and Incidents Reported\n\n## 1.3\
    \ 安全攻击\n\n- 对任何机构的信息资源进行破坏的行为即安全攻击\n- 信息安全就是要检测和防范这种攻击行为\n- 通常 threat 和 attack\
    \ 指的是同样的事情\n- 安全攻击的行为范围很广\n- 通常有两大类安全攻击\n- 被动攻击：对传输进行窃听和监测，通信和信息不受影响，用户感觉不到攻击存在，攻击通常是窃听或流量分析，判断通信性质\n\
    - 主动攻击：攻击者破坏通信过程，拦截、修改、伪造、丢弃信息、拒绝服务或假冒合法用户\n\n## Passive Attack—traffic analysis\n\
    被动攻击之流量分析\n\nDarth observe pattern of messages from Bob to Alice\n\nInternet or\
    \ other comms facility\n\nBob\n\nAlice\n\n(b) Traffic analysis\n\n## Active Attack—Masquerade\n\
    主动攻击之伪装\n\n## Active Attack—Replay\n主动攻击之重放\n\nDarth\n\nCapture message from Bob\
    \ to Alice; later replay message to Alice\n\nBob\n\nAlice\n\nInternet or other\
