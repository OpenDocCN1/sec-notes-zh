    - 某些但非全部整数存在一个乘法逆元就将使模数不再是素数。如果gcd(a, n)=1，则能在Zn中找到b，使得axb ≡ 1 mod n，则b即为乘法逆元a⁻¹，因为a与n互素\n\
    \n## 4.3欧几里得算法Euclid Algorithm\n\na=q1b+r1  0≤r1<b  \n假设r1≠0.因为b>r1，可以用r1除b，应用除法有\
    \  \nb=q2r1+r2  0≤r2<r1  \n如前所述，如果r2=0，则d=r1.如果r2≠0，则d=gcd(r1,r2)。  \n继续除法过程直到余数为0，比如说在第(n+1)阶段有rn整除\
    \  \nr(n-1)。结果为如下的方程系统：\n\na=q1b+r1  0<r1<b  \nb=q2r1+r2  0<r2<r1  \nr1=q2r2+r3\
    \  0<r3<r2  \n...  \nr n-2=qnrn-1+rn  0<rn<rn-1  \nr n-1=qn+1rn+0  \nd=gcd(a,b)=gcd(rn,0)=rn\n\
    \n## gcd(a, b) = gcd(b, a mod b)\n\n使d等于gcd(a,b),根据gcd的定义，有d|a和d|b成立。对于任意正整数b,a可以表示为如下形式：\n\
