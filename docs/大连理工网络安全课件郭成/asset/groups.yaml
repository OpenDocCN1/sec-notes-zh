  - '[PAGE 211]


    # # RSA密码体制基本原理


    +   - 算法流程

    +     - 随机选择两个秘密大素数p和q；

    +     - 计算公开模数n=p*q；

    +     - 计算秘密的欧拉指数函数φ(n)=(p-1)(q-1)；

    +     - 选择一个与φ(n)互素的数，作为e或d；

    +     - 用Euclid算法计算模φ(n)的乘法逆元素，即根据ed mod φ(n)=1，求d或e；

    +     - 加密：C = Me mod n

    +     - 解密：M=Cd mod n = (Me mod n)d mod n = M

    +     这里，φ(n)为欧拉函数，即集合(1, 2, ..., n-1)中与n互素的数的个数。'
  - '[PAGE 212]


    # Key Generation


    Select *p*, *q*　　　　　　　　　　　　*p* and *q* both prime


    Calculate *n* = *p* × *q*


    Calculate φ(*n*) = (*p* − 1)(*q* − 1)


    Select integer *e*　　　　　　　　　　gcd(φ(*n*), *e*) = 1; 1 < *e* < φ(*n*)


    Calculate *d*　　　　　　　　　　　　*d* = *e*⁻¹ mod φ(*n*)


    Public key　　　　　　　　　　　　　KU = {*e*, *n*}


    Private key　　　　　　　　　　　　 KR = {*d*, *n*}


    | Encryption | Decryption |

    |---|---|

    | Plaintext: *M* < *n* | Ciphertext: *C* |

    | Ciphertext: *C* = *M*^*e* (mod *n*) | Plaintext: *M* = *C*^*d* (mod *n*) |'
