    \ 和 $\\{1, 2, \\dots, p-1\\}$ 构成相同，只是元素顺序不同。\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_165_0.png)\n\
    \n## 费马定理的等价形式\n\n- 费马定理等价形式\n  - $a^p \\equiv a \\pmod p$，$p$ 是素数\n  - 例如：$p=5,\
    \ a=3, 3^5=243 \\equiv 3 \\pmod 5$\n  - $p=5, a=10, 10^5=100000 \\equiv 10 \\\
    pmod 5 \\equiv 0 \\pmod 5$\n\n## 费马小定理（范例）\n\n（1）计算 $6^{10} \\bmod 11$；\n\n（2）计算\
    \ $3^{12} \\bmod 11$。\n\n### （1）计算 $6^{10} \\bmod 11$\n\n若 $p$ 是素数，$a$ 是正整数且不能被\
    \ $p$ 整除，则 $a^{p-1} \\bmod p = 1$。\n\n解法：我们可得 $6^{10} \\bmod 11 = 1$。这是 $p=11$\
    \ 时，可以使用费马小定理的第一个版本直接计算得到。\n\n### （2）计算 $3^{12} \\bmod 11$\n\n$a^p = a \\bmod\
    \ p$，$p$ 是素数。\n\n解法：此处指数（12）和模数（11）是不同的。\n\n```\n$3^{12} \\bmod 11=(3^{11}\\times3)\\\
    bmod11=(3^{11}\\bmod11)(3\\bmod11)=(3\\times3)\\bmod11=9$\n```\n\n## 费马大定理（费马最后定理）\n\
    \n- 将一个立方数分成两个立方数之和，或一个四次幂分成两个四次幂之和，或者一般地将一个高于二次的幂分成两个同次幂之和，这是不可能的。关于此，我确信已发现了一种美妙的证法，可惜这里空白的地方太小，写不下。\n\
    \n## 欧拉定理\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_171_0.png)\n\n- 欧拉（Euler,\
    \ Léonard, 1707年4月15日—1783年9月18日）是瑞士数学家和物理学家。\n\n## 欧拉函数 $\\varphi(n)$ 的证明\n\n\
    定理8.2 $p$ 和 $q$ 是素数，$n=p \\times q$，$\\varphi(n) = \\varphi(p)\\varphi(q) = (p-1)(q-1)$。\n\
    \n显然，对于素数 $p$，$\\varphi(p) = p-1$。\n\n证明：考虑余数集合 $\\{0, 1, \\dots, (pq-1)\\}$ 中不与\
    \ $n$ 互素的余数集合是 $\\{p, 2p, \\dots, (q-1)p\\}$，$\\{q, 2q, \\dots, (p-1)q\\}$ 和 $0$，所以\
    \ $\\varphi(n) = pq - [(q-1) + (p-1) + 1] = pq - (p+q) + 1 = (p-1)(q-1) = \\varphi(p)\\\
    varphi(q)$。\n\n## 欧拉定理\n\n- 对任意互质的 $a$ 和 $n$ 有：\n\n  $a^{\\phi(n)} \\equiv 1 \\\
    pmod{n}$\n\n  $a^{\\phi(n)+1} \\equiv a \\pmod{n}$\n\n## 欧拉定理（证明）\n\n$$\\prod_{i=1}^{\\\
    varphi(n)}(ax_i \\bmod n) = \\prod_{i=1}^{\\varphi(n)}x_i$$\n\n$$\\prod_{i=1}^{\\\
    varphi(n)} ax_i \\equiv \\prod_{i=1}^{\\varphi(n)} x_i \\pmod n$$\n\n$$a^{\\varphi(n)}\
    \ \\times \\left[\\prod_{i=1}^{\\varphi(n)} x_i\\right] \\equiv \\prod_{i=1}^{\\\
    varphi(n)} x_i \\pmod n$$\n\n$$a^{\\varphi(n)} \\equiv 1 \\pmod n$$\n\n## 8.4\
    \ Chinese Remainder Theorem\n\n- 中国余数定理 CRT 说明某一范围内的整数可通过它对两两互素的整数取模所得的余数来重构。\n\
    \n- $Z_{10}(0,1,\\dots,9)$ 中的 10 个整数可通过它们对 2 和 5 (10 的素因子) 取模所得的两个余数来重构。假设数 $x$\
    \ 的余数 $r_2=0$ 且 $r_5=3$，即 $x \\bmod 2 = 0$，$x \\bmod 5 = 3$，则 $x$ 是 $Z_{10}$ 中的偶数且被\
    \ 5 除余 3，唯一解 $x=8$。\n\n- 一种 CRT 的表示形式\n\n  令 $M = \\prod_{i=1}^k m_i$，其中 $m_i$\
    \ 两两互素，$1 \\le i, j \\le k, i \\ne j, \\gcd(m_i, m_j)=1$。\n\n  将 $Z_m$ 中的任一整数对应一个\
    \ $k$ 元组，该 $k$ 元组的元素均在 $Z_{m_i}$ 中，对应关系为 $A \\Leftrightarrow (a_1, a_2, \\dots,\
    \ a_k)$，其中 $A \\in Z_m$，对 $1 \\le i \\le k, a_i \\in Z_{m_i}$，且 $a_i = A \\bmod\
    \ m_i$。\n\n"
