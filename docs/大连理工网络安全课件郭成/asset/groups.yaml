    # # 3.3 DES的安全强度


    # ## 密钥的长度问题


    +   - 56-bit 密钥有\(2^{56} = 72,057,584,037,927,936 \approx 7.2\)亿亿之多

    +   - 强力搜索( brute force search ) 似乎很困难，20世纪70年代估计要1000—2000年

    +   - 技术进步使穷举搜索成为可能


    +   - 1997年1月29日，RSA公司发起破译RC4、RC5、MD2、MD5，以及DES的活动，破译DES奖励10000美金。明文是：Strong cryptography
    makes the world a safer place. 结果仅搜索了24.6%的密钥空间便得到结果，耗时96天。

    +   - 1998年在一台专用机上(EFF)只要三天时间即可

    +   - 1999年在超级计算机上只要22小时！

    +   - 现在只需要10小时！'
