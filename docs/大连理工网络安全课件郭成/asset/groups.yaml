  md: "\n\n# ElGamal的数字签名方法\n\n若A为B签署m，0≤m≤p-1，  \nA随机选择k∈[0,p-1]，gcd(k,p-1)=1，  \n\
    计算r=α^k mod p，  \n计算α^m=Y_A^r·r^s mod p，Y_A=α^{x_A} mod p，  \n即α^m=α^{x_A r}·α^{ks}\
    \ mod p，  \n则m=(x_A r+ks) mod p-1。  \n根据此式求s，则对于m的数字签名即为(r,s)，0≤r,s<p-1。\n\n#\
    \ ElGamal数字签名的验证\n\n- 验证：给定m、r和s，容易计算  \n  α^m mod p = Y_A^r·r^s mod p，看其是否一致，k不能重复使用。\n\
    \n- 例：p=17，α=3，x_A=2，x_B=5，m=11，k=5，求签名及验证。  \n  签名：r=α^k mod p=3^5 mod 17=5，\
    \  \n  11=(2×5+5s) mod 16=(10+5s) mod 16，  \n  5s mod 16=1，s=13。  \n  所以，签名为(5,13)。\
