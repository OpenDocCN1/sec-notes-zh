  - '[PAGE 284]


    # ElGamal的数字签名方法


    若A为B签署m，0<= m <= p-1，

    A随机选择k∈[0, p-1]，gcd(k, p-1) = 1

    计算r = α^k mod p

    计算α^m = Y_A^r r^s mod p，Y_A = α^{x_A} mod p

    即α^m = α^{x_A r} α^{k s} mod p

    则 m = (x_A r + ks) mod p-1

    根据此式求s，则对于m的数字签名即为(r, s)，

    0≤ r, s <p-1。'
