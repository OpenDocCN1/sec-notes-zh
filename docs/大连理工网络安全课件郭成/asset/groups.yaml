    # # 密钥的产生和检验素数


    +   - 确定两个素数p和q，选择e或d并计算另外一个

    +   - 检验素数


    +   - 随机选择一个奇数，如使用伪随机数产生器

    +   - 随机选一个整数a < n

    +   - 完成随机素数性检验，如果n没有通过检验，则另选n

    +   - 如果n通过了足够多次的检验，则接受n，否则另选


    例： p = 5, q = 7, n = 35, φ(n)=24

    选d = 11，则e = inv(11, 24) = 11， M = 2

    C = mᵉ mod n = 2¹¹ mod 35 = 18

    M = Cᵈ mod n = 18¹¹ mod 35 = 2'
  - "[PAGE 223]\n\n# # RSA的安全性\n\n例：p = 53，q = 61，n = pq = 3233，  \nφ(n)=52x60 = 3120\
