    \  - B chooses x<sub>B</sub>=233\n- Compute public keys:\n  - y<sub>A</sub>=3<sup>97</sup>\
    \ mod 353 = 40　　　　(Alice)\n  - y<sub>B</sub>=3<sup>233</sup> mod 353 = 248　　　(Bob)\n\
    - Compute shared session key as:\n  K<sub>AB</sub>= y<sub>B</sub><sup>x<sub>A</sub></sup>\
