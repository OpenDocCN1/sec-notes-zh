    # # 求多项式的最大公因式


    $$x^4+x^2+x+1\ \big)\ x^6+x^5+x^4+x^3+x^2+x+1$$


    $$\frac{x^2+x}{\phantom{x}}$$


    $$x^6\qquad +x^4+x^3+x^2$$


    $$\overline{\hspace{3.2cm}}$$


    $$x^5\qquad\qquad\qquad +x+1$$


    $$x^5\qquad\qquad +x^3+x^2+x$$


    $$\overline{\hspace{3.7cm}}$$


    $$\qquad\qquad x^3+x^2\qquad +1$$


    从而获得 $r_1(x)=x^3+x^2+1$ 和 $q_1(x)=x^2+x$。

    接着用 $r_1(x)$ 除 $b(x)$。'
  - '[PAGE 128]


    # 求多项式的最大公因式


    $$\begin{aligned}

    a(x)&=x^4+x^3+x^2+1\\

    b(x)&=x^3+x^2+x+1

    \end{aligned}$$


    $$\frac{x+1}{x^3+x^2+1}=x+\frac{x^4+x^3+x}{x^3+x^2+1}$$


    $$x^4+x^3+x=x(x^3+x^2+1)-1$$


    从而获得 $r_2(x)=0,\ q_2(x)=x+1$。


    因此，$\gcd[a(x),b(x)]=r_1(x)=x^3+x^2+1$。'
