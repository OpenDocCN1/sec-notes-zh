    # Cryptology 密码学


    +   - **密码编码学(Cryptography)**

    +     密码编码系统根据以下三个独立方面进行分类

    +     - 用于将明文转换为密文的操作类型：代换和置换

    +     - 所使用的密钥的数量和方式：

    +       - 对称密码体制(单钥系统、秘密密钥系统)

    +       - 非对称密码体制(双钥系统、公钥密钥系统)

    +     - 明文的处理方式：分组加密和流加密


    +   - **密码分析学(Cryptanalysis)**

    +     - 密码分析：试图破译密文得到明文或试图获得密钥的过程为密码分析，密码破译的策略取决于加密方法及可供破译者使用的信息。

    +     - 穷举攻击：对密文尝试所有可能的密钥，直到把它转化为可读的有意义的明文，至少要尝试1/2可能的密钥。'
