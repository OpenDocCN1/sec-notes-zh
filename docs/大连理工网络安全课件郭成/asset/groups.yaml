    \ = α^{x_B} \\bmod q$; Calculate $K = (Y_A)^{x_B} \\bmod q$\n\nFigure 10.8  Diffie-Hellman\
    \ Key Exchange\n\n## 中间人攻击\n\n假定A和B希望交换密钥，而D是攻击者，攻击过程如下：\n\n- (1) 为了进行攻击，D先生成两个随机的私钥\
