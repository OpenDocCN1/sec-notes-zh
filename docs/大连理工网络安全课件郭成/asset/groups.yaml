  - '[PAGE 145]


    # 密码反馈模式Cipher FeedBack (CFB)


    +   - 是一种将DES转化成流密码的技术，不再要求报文被填充完成整个分组，可以实时运行，如果要传输一个字符流，每个字符都可以使用面向字符的流密码加密后立即传输。

    +   - 加密：加密函数的输入是一个64位的移位寄存器，产生初始向量IV。加密函数高端位与明文P1的第一单元异或，产生位密文C1进入移位寄存器低端，继续加密，与P2输入异或，如此重复直到所有明文单元都完成加密。

    +   - 解密：采用相同方案，但是使用加密函数而非解密函数。'
