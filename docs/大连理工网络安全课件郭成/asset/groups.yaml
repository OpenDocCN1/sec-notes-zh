  - '[PAGE 395]


    # # 中间人攻击


    假定A和B希望交换密钥，而D是攻击者，攻击过程如下：


    (1)为了进行攻击，D先生成两个随机的私钥\(X_{D1}\)和\(X_{D2}\)，然后计算相应的公钥\(Y_{D1}\)和\(Y_{D2}\)。


    (2)Alice将\(Y_A\)传递给Bob。


    (3)D截获了\(Y_A\)，将\(Y_{D1}\)传给B。D同时计算\(K_2 = (Y_A)^{X_{D2}} \mod q\)。


    (4)B收到\(Y_{D1}\)，计算\(K_1 = (Y_{D1})^{X_B} \mod q\)。


    (5)B将\(Y_B\)传给A。


    (6)D截获了\(Y_B\)，将\(Y_{D2}\)传给A。D计算\(K_1 = (Y_B)^{X_{D1}} \mod q\)。


    (7)A收到\(Y_{D2}\)，计算\(K_2 = (Y_{D2})^{X_A} \mod q\)。


    此时，B和A想，他们已共享了密钥，但实际上，B和D共享了密钥\(K_1\)，而A和D共享了密钥\(K_2\)。接下来，B和A之间的通信以下列方式泄密：


    (1)A发了一份加了密的消息M：\(E(K_2, M)\)。


    (2)D截获了该秘密消息，解密，恢复出M。


    (3)D将\(E(K_1, M)\)或\(E(K_1, M'')\)发给B，其中\(M''\)是任意的消息。


    2022-11-3 69/60 现代密码学理论与实践-10'
