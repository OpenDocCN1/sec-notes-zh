  - '[PAGE 340]


    # # 现代密码学基本原则


    +   • 现代密码学的基本原则


    +   • 设计加密系统时，总是假定密码算法是可以公开的，需要保密的是密钥。一个密码系统的安全性不在算法的保密，而在于密钥，即Kerckhoff原则。


    +   • 对加密系统的要求


    +   • 系统应该是实际上安全的(practical secure)，截获密文或已知明文—密文对时，要决定密钥或任意明文在计算上是不可行的。


    +   • 加密解密算法适用于密钥空间中的所有元素。


    +   • 系统易于实现，使用方便。


    +   • 系统的安全性不依赖于对加密体制或加密算法的保密，而依赖于密钥。


    +   • 系统的使用不应使通信网络的效率过分降低。'
