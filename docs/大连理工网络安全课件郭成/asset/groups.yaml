    # 一种简单的秘密密钥分配方法


    +   - Merkle在1979提出一种简单的方法

    +     - A产生公/私钥对{PUₐ, PRₐ}，将含有PUₐ和标识IDₐ的消息发给B

    +     - B产生秘密密钥（会话密钥）Kₛ，并用A的公钥加密后发给A

    +     - A解密D(PRₐ, E(PUₐ, Kₛ))，得到Kₛ，这样双方即可通信

    +   - 这个协议不安全，因为会受到中间人攻击


