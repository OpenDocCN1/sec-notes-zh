  md: "\n## RSA密码体制基本原理\n\n- 算法流程\n  - 随机选择两个秘密大素数 p 和 q；\n  - 计算公开模数 n = p × q；\n\
    \  - 计算秘密的欧拉函数 φ(n) = (p − 1)(q − 1)；\n  - 选择一个与 φ(n) 互素的数，作为 e 或 d；\n  - 用 Euclid\
    \ 算法计算模 φ(n) 的乘法逆元素，即根据 ed mod φ(n) = 1，求 d 或 e；\n  - 加密：C = M^e mod n\n  - 解密：M\
    \ = C^d mod n = (M^e mod n)^d mod n = M\n\n这里，φ(n) 为欧拉函数，即集合 {1, 2, ..., n−1}\
    \ 中与 n 互素的数的个数。\n\n### Key Generation\n\n- 选择 p, q：p 和 q 均为素数\n- 计算 n = p × q\n\
    - 计算 φ(n) = (p − 1)(q − 1)\n- 选择整数 e：gcd(φ(n), e) = 1；1 < e < φ(n)\n- 计算 d：d =\
    \ e⁻¹ mod φ(n)\n- 公钥：KU = {e, n}\n- 私钥：KR = {d, n}\n\n| Encryption | Decryption\
    \ |\n|---|---|\n| Plaintext: M < n | Ciphertext: C |\n| Ciphertext: C = M^e (mod\
    \ n) | Plaintext: M = C^d (mod n) |\n\n### Encryption\n\nPlaintext 19 → 19^5 =\
    \ 2476099 / 119 = 20807，余数 66 → Ciphertext 66\n\n### Decryption\n\nCiphertext\
    \ 66 → 66^77 = 1.27... × 10^140 / 119 = 1.06... × 10^138，余数 19 → Plaintext 19\n\
    \nKU = {5, 119}\n\nKR = {77, 119}\n\n*Figure 6.6 Example of RSA Algorithm*\n\n\
    ### Encryption\n\nPlaintext 88 → 88^7 mod 187 = 11 → Ciphertext 11\n\n### Decryption\n\
    \nCiphertext 11 → 11^23 mod 187 = 88 → Plaintext 88\n\nKU = {7, 187}\n\nKR = {23,\
    \ 187}\n\n*Figure 9.6 Example of RSA Algorithm*\n\n### 一个例子\n\n- p = 17, q = 11,\
    \ e = 7, M = 88\n- 求公钥 KU 和私钥 KR 分别为多少？\n- 加密计算后所得到的 C 为多少？\n- 并验证解密运算后，是否能恢复出明文\
    \ M。\n- 解：n = pq = 17 × 11 = 187, φ(n) = (p−1)(q−1) = 16 × 10 = 160\n- 选择 e =\
    \ 7, gcd(7,160) = 1, 23 × 7 = 161, 所以 d = 23\n- 公钥 KU = {7,187}, 私钥 KR = {23,187},\
    \ M = 88\n- 加密计算 C = 88^7 mod 187\n- 88^7 mod 187 = [(88^4 mod 187) × (88^2 mod\
    \ 187) × (88^1 mod 187)] mod 187\n- 88^1 mod 187 = 88\n- 88^2 mod 187 = 7744 mod\
    \ 187 = 77\n- 88^4 mod 187 = 59969536 mod 187 = 132\n- 88^7 mod 187 = (88 × 77\
    \ × 132) mod 187 = 894432 mod 187 = 11\n- 解密计算 M = 11^23 mod 187 = 88\n\n- RSA算法满足公开密钥加密的要求，必须符合下列条件：\n\
    \  - 有可能找到 e, d, n 的值，使得对所有 M < n 有 M^ed mod n = M\n  - 对于所有 M < n 的值，要计算 M^e\
    \ 和 C^d 是相对容易的\n  - 在给定 e 和 n 时，计算 d 是不可行的\n\n- 几个关系：\n  - φ(n) = φ(pq) = φ(p)φ(q)\
    \ = (p−1)(q−1), p, q are prime\n  - ed mod φ(n) = 1, ed = kφ(n)+1, 即 ed ≡ 1 mod\
    \ φ(n), d ≡ e⁻¹ mod φ(n)\n\n定理：给定 ed mod φ(n) = 1, m ∈ [0, n−1], gcd(m, n) = 1，则：\n\
    \n(m^e mod n)^d mod n = m^ed mod n = m\n\n证明：∵ ed mod φ(n) = 1\n∴ ed = kφ(n)+1，对某些整数\
    \ k\n∴ m^ed mod n = m^{kφ(n)+1} mod n = m(m^{kφ(n)} mod n) mod n\n∴ m^{kφ(n)}\
    \ mod n = (m^{φ(n)} mod n)^k mod n = 1^k mod n = 1\n∴ m^ed mod n = (m × 1) mod\
    \ n = m\n\n证明：M^ed mod n = M\n\n由 ed mod φ(n) = 1，存在整数 k 满足 ed = kφ(n) + 1。\n\n\
    因此，我们必须证明 M^{kφ(n)+1} mod n = M^{k(p−1)(q−1)+1} mod n = M。\n\n首先证明 M^{k(p−1)(q−1)+1}\
    \ mod p = M mod p。\n\n情况1：M 和 p 不是互素的，即 p 整除 M。此时 M mod p = 0，因此有 M^{k(p−1)(q−1)+1}\
    \ mod p = 0，从而 M^{k(p−1)(q−1)+1} mod p = M mod p。\n\n情况2：如果 M 和 p 互素，由欧拉定理，M^{φ(p)}\
    \ mod p = 1。继续如下步骤：\n\nM^{k(p−1)(q−1)+1} mod p = [(M)M^{k(p−1)(q−1)}] mod p\n\n\
    = [(M)(M^{φ(p)})^{k(q−1)}] mod p\n\n= (M mod p) × [(M^{φ(p)}) mod p]^{k(q−1)}\n\
    \n= (M mod p) × (1)^{k(q−1)}\n\n= M mod p\n\n[M^{k(p−1)(q−1)+1} − M] mod p = [M^{k(p−1)(q−1)+1}\
    \ mod p] − [M mod p] = 0\n\n因此 p 整除 [M^{k(p−1)(q−1)+1} − M]，同理 q 也整除 [M^{k(p−1)(q−1)+1}\
    \ − M]。\n\n因为 p 和 q 为不同的素数，因此必定存在一个整数 r 满足\n\n[M^{k(p−1)(q−1)+1} − M] = (pq)r\
    \ = nr\n\n因此，n 整除 [M^{k(p−1)(q−1)+1} − M]，所以\n\nM^{kφ(n)+1} mod n = M^{k(p−1)(q−1)+1}\
    \ mod n = M\n\n- RSA方案概述\n  - prime p, q，私有，选择\n  - n = pq，公开，计算出\n  - e, gcd(φ(n),\
    \ e) = 1；1 < e < φ(n)，公开，选择\n  - d = e⁻¹ mod φ(n)，私有，计算出\n\n- RSA实现方面的考虑\n  -\
    \ 加密与解密\n    - 模运算特性之一：[(a mod n) × (b mod n)] mod n = (a × b) mod n\n    - 指数运算的效率问题\n\
    \n### 计算 a^b mod n 的算法和快速取模指数算法\n\n```\nc ← 0; d ← 1\nfor i ← k downto 0\n   \
    \ do c ← 2 × c\n        d ← (d × d) mod n\n        if b_i = 1\n            then\
    \ c ← c + 1\n                d ← (d × a) mod n\nreturn d\n```\n\n*Figure 9.7 Algorithm\
    \ for Computing a^b mod n*\n\n| i | 9 | 8 | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |\n\
    |---|---|---|---|---|---|---|---|---|---|---|\n| b_i | 1 | 0 | 0 | 0 | 1 | 1 |\
    \ 0 | 0 | 0 | 0 |\n| c | 1 | 2 | 4 | 8 | 17 | 35 | 70 | 140 | 280 | 560 |\n| d\
    \ | 7 | 49 | 157 | 526 | 160 | 241 | 298 | 166 | 67 | 1 |\n\n*Figure 9.8 Result\
    \ of the Fast Modular Exponentiation Algorithm for a^b mod n, where a = 7, b =\
    \ 560 = 1000110000, n = 561*\n"
