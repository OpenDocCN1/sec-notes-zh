    \n### Figure 4.1 Group, Ring, and Field\n\n## 4.2 Modular Arithmetic\n\n- 给定任意正整数\
    \ n 和 a，如果用 a 除以 n，得到的商 q 和余数 r 满足如下关系：\n    - a = qn + r，0 ≤ r < n；q = ⌊a/n⌋，⌊x⌋\
