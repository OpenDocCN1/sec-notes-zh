    \n- 假设A和B互相通信，共享大素数 $p$，本原元素 **α**，$0\\le m\\le p-1$\n- **加密：**\n  - A选择 $k\\\
    in[0,p-1]$，$k$的作用其实即为 $x_A$，A访问公共区域找到B的公开密钥 $Y_B=\\alpha^{x_B}\\bmod p$，计算：\n\
