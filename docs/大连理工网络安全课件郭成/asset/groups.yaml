  - '[PAGE 160]


    # # One-way Function and

    # One-way Trapdoor Function


    # ## 定义8.1  单向函数 (One-way Function)


    一函数 $f$ 若满足下列条件，则称 $f$ 为单向函数：


    +   1. 对于所有属于 $f$ 域的任一 $x$，容易计算 $y=f(x)$。

    +   2. 对于几乎所有属于 $f$ 域的任一 $y$，求得 $x$，使 $y=f(x)$，在计算上不可行。


    # ## 定义8.2 单向陷井门函数 (One-way Trapdoor Function)


    一“可逆”函数 $F$ 若满足下列二条件，则称 $F$ 为单向陷井门函数：


    +   1. 对于所有属于 $F$ 域的任一 $x$，容易计算 $F(x)=y$；

    +   2. 对于几乎所有属于 $F$ 域的任一 $y$，除非获得暗门信息（trapdoor），否则求出 $x$，使得 $x=F^{-1}(y)$ 在计算上不可行，$F^{-1}$
    为 $F$ 之逆函数；如有额外信息（暗门），则容易求出 $x=F^{-1}(y)$。'
  - '[PAGE 161]


    # # 单向函数举例


    # ## 1. Discrete Logarithm Problem (DLP) 离散对数问题


    令质数p满足p-1含有另一大质数q (q整除p-1)及一整数g, 1<g< p-1。


    若给定整数x, 求y = gˣ mod p, 最多需要Llog₂x|+w(x)-1次乘法, w(x)为x中所有1的个数。如x = 15, 即


    x =(1111)₂, w(x)=4, 则g¹⁵ = ((g²)g)²·g)²·g mod p, 只需要3 + 4 -1=6次乘法。


    但是若给定p, g及y, 求x, 则为DLP问题, 最快方法需要L(p)=exp{(lnpln(lnp))½}次运算。


    当p=512位时, L(p)约为2²⁵⁶≈10⁷⁷, 计算上不可行, 因为2¹⁰⁰≈10³⁰, 计算要10¹⁶年。'
  - "[PAGE 162]\n\n# # 单向函数举例（续）\n\n# ## 2. Factorization Problem 因数分解问题\n\n给定大素数\
    \ p和q，求n = p × q，只要一次乘法  \n给定n，求p和q，即为因数分解问题(FAC)，最快方法需要  \nT(n) = exp {c(ln n\
    \ ln (ln n))½} 次运算，其中c为大于1的  \n正整数。 若p≈n，解离散对数比因数分解难。\n\n# ## 3. 背包问题Knapsack\
    \ Problem\n\n给定有限个自然数序列集合B=(b1,b2,...bn)及二进制序列  \nx=(x1,x2,...xn)，xi ∈ (0,1)，求S=Σxi\
    \ bi,最多只需n-1次加法；  \n但若给定B和S，求x则非常困难。  \n穷举时有2n种可能，当n很大时为计算上不可行。  \nGarey和Johnson证明，背包问题是NP问题\
    \  \n(Non-Polynomial)"
  - "[PAGE 163]\n\n# # 单向函数及其交换性\n\n+   - 单向函数的交换性(commutative property)\n\n单向函数本身对近代密码学领域用处不大，但若具有交换性，则作用大。\n\
    \n# ## 定义8.3 交换性\n\n令Z为一集合，F为将Z映射到Z本身的函数集合。  \n令z∈Z，Fx(z)表示此函数集合之第x函数，  \n若Fx(Fy(z))=Fy(Fx(z))，则称此函数集合具有交换性。\
    \  \n例：D(E(m))=E(D(m))"
  - "[PAGE 164]\n\n# 8.2 费马定理和欧拉定理\n\n# 定理8.1 费马定理  Fermat’s Theorem\n\n若 p 是素数，a\
    \ 是正整数且不能被 p 整除，则 a^{p-1} mod p = 1\n\n+   证明：\n+   \n+   - 因为 {a mod p，2a mod\
    \ p，…，(p−1)a mod p} 是 {1，2，…，(p−1)} 的置换形式，所以，(a × 2a × … × (p−1)a) ≡ (1 × 2 ×\
    \ … × (p−1)) (mod p) ≡ (p−1)! mod p。\n+   - 但是，a × 2a × … × (p−1)a = (p−1)!a^{p−1}，因此\
    \ (p−1)!a^{p−1} ≡ (p−1)! mod p，两边去掉 (p−1)!，即得 a^{p−1} mod p = 1。\n+   - 例如：a=7，p=19，a^{p−1}\
    \ mod p = 7^{18} mod 19 = ?\n+   \n+     7^2=49≡11 mod 19　　　 7^4=121≡7 mod 19\n\
    +     7^8=49≡11 mod 19　　　7^16=121≡7 mod 19\n+   \n+     a^{p−1}=7^{18}=7^{16}×7^2≡7×11≡1\
    \ mod 19"
  - '[PAGE 165]


    # 8.2 费马定理和欧拉定理


    用a乘以集合中所有元素并对p取模，则得到集合

    X={a mod p, 2a mod p, …, (p-1)a mod p}。因为p不能整除a，所以X的元素都不等于0，而且各元素互不相等。

    假设a ≡ ka(mod p),其中1≤j<k≤p-1,因为a和p互素，所以两边可以把a消去，则推出j ≡ k(mod p)，而这是不可能的。

    因此X的p-1个元素都是正整数且互不相等。所以说X和{1,2,…,p-1}构成相同，只是元素顺序不同。


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_165_0.png)'
