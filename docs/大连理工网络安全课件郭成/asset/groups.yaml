    \n- 如果明文所用语言不为我们所知，则明文输出不可识别，而且输入可能按某种方式经过缩写或压缩，则识别就更加困难\n- 例如\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_60_0.png)\n\
