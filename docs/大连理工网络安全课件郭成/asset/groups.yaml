    # # 公钥授权


    +   - A发送带有时间戳的消息给公钥管理员，请求B的当前公钥

    +   - 管理员给A发送用其私钥\( KR_{auth} \)加密的消息，A用管理员的公钥解密，可以确信该消息来自管理员：

    +     - B的公钥\( KU_b \)，用来加密；

    +     - 原始请求，A可以验证其请求未被修改；

    +     - 原始时间戳，A可以确定收到的不是来自管理员的旧消息。

    +   - A保存B的公钥，并用它对包含A的标识\( ID_A \)和\( Nonce_1 \)的消息加密，然后发送给B

    +   - B以同样方式从管理员处得到A的公钥

    +   - B用\( KU_a \)对A的\( N_1 \)和B的\( N_2 \)加密，发送给A

    +   - A用B的公钥对\( N_2 \)加密并发送给B，使B相信其通信伙伴是A'
