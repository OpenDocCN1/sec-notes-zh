    - **Authentication 认证** – 确保通信实体是合法和真实的，包括同等实体认证和数据源认证\n- **Access Control 访问控制**\
    \ – 防止资源非授权使用\n- **Data Confidentiality 数据保密性** – 保护数据免于非授权泄漏，并防止流量分析\n- **Data\
    \ Integrity 数据完整性** – 确保接收到的数据是由授权用户发出的或者是未被修改过的\n- **Non-Repudiation 不可否认性**\
    \ – 防止通信方对通信行为的否认，包括源不可否认性和宿不可否认性\n- **Availability Service** – 系统或系统资源能够按照要求根据系统性能规范被授权系统的实体访问和使用\n\
