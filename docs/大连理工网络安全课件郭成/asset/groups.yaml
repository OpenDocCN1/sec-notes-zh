  - '[PAGE 87]


    # S盒(Substitution Boxes)


    +   - 有8个将6位数据映射成4位数据的S盒

    +   - 6到4的映射规则是

    +     - 外侧的第1位和第6位用作行选择

    +     - 其余4位(2-5bit)用作列选择

    +     - 这样每盒就有4行16列，输出4位，8个S盒输出32位

    +   - 行的选择依赖于数据和密钥

    +   - 例如


