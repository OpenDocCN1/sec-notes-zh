    \n## 13.1 数字签名Digital Signature\n\n- 数字签名的简单定义\n- 数字签名是使以数字形式存储的明文信息经过特定密码变换生成密文，作为相应明文的签名，使明文信息的接收者能够验证信息确实来自合法用户，以及确认信息发送者身份。\n\
    - 对数字签名的基本要求\n- 在收发双方不能完全信任的情况下，需要除认证之外的其他方法来解决假冒和否认的问题，数字签名则是解决办法；\n- 签名接收者能容易地验证签字者对消息所做的数字签名，包括日期和时间；\n\
    - 任何人，包括签名接收者，都不能伪造签名者的签字；\n- 发生争议时，可由第三方解决。\n\n## 数字签名的基本形式\n\n- **数字签名与消息认证的区别**\n\
    \  - 消息认证是使消息接收方验证消息发送者发送的内容有无被修改过，对防止第三者破坏足够，但收发双方有利害冲突时就无法解决纷争，需要更严格的手段，即数字签名。\n\
    - **数字签名的基本形式**\n  - 对消息签名的两种方法\n    - 对消息整体的签字，将被签消息整体经过密码变换得到签字；\n    - 对消息摘要的签字，附在被签消息之后，或嵌在某一特定位上作一段签字图样。\n\
    \  - 两类数字签名\n    - 确定性数字签名，明文与签名一一对应；\n    - 概率性数字签名，一个明文可以有多个合法签名，每次都不一样。\n\n\
    ## ElGamal的数据加密方法\n\n- 假定A和B互相通信，共享大素数p，本原元素a，0<= m <= p-1, gcd(a, p) = 1，A和B各有自己的秘密xA和xB\n\
    - 加密\n  - A选择k∈[0, p-1]，k的作用即为xA，A访问公共区域找到B的公开密钥Y<sub>B</sub> = α<sup>x<sub>B</sub></sup>\
    \ mod p，计算：\n    - K = (Y<sub>B</sub>)<sup>k</sup> mod p，即K = α<sup>x<sub>B</sub>k</sup>\
    \ mod p\n    - c<sub>1</sub> = α<sup>k</sup> mod p\n    - c<sub>2</sub> = mK mod\
    \ p\n  - 密文即为 (c<sub>1</sub>, c<sub>2</sub>)\n- 解密\n  - B首先恢复K：K = c<sub>1</sub><sup>x<sub>B</sub></sup>\
    \ mod p = α<sup>kx<sub>B</sub></sup> mod p\n  - 然后恢复m：m = c<sub>2</sub>/K mod\
    \ p = c<sub>2</sub>K<sup>-1</sup> mod p\n\n## ElGamal的数字签名方法\n\n若A为B签署m，0<= m\
    \ <= p-1，\nA随机选择k∈[0, p-1]，gcd(k, p-1) = 1\n计算r = α^k mod p\n计算α^m = Y_A^r s mod\
    \ p，Y_A=α^x_A mod p\n即α^m = α^x_A r α^k s mod p\n则 m = (x_A r + ks) mod p-1\n\
    根据此式求s，则对于m的数字签名即为(r，s)，0≤r，s<p-1。\n\n## ElGamal数字签名的验证\n\n- 验证：给定 m，r，和 s，容易计算\n\
    \  - α^m mod p = Y_A^r r^s mod p，看其是否一致，k不能重复使用。\n  - （p287）\n- 例：p = 17，α = 3，x_A\
    \ = 2，x_B = 5，m = 11，k = 5，求签名及验证。\n\n# 网络信息安全\n\n## Chapter 14\n\n## Authentication\
