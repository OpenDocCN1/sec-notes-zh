    什么是好的密码系统和协议？\n\n#### 1. 保护的程度与应用需求相符合\n\n对很多公平掷币的更重要的应用场合，使用杂凑函数不一定就是好的，必须用更加严格的密码技术。另一方面，对决定娱乐场点来说，使用重量级密码技术显然是不必要的。对有些应用来说，太强的保护甚至会妨碍想要的安全服务的正常性能。\n\
