    # 2.2.2 Monoalphabetic Cipher 单表替换密码


    +   - 单表代换密码不只是25种可能的密钥，而是允许任意代换，增加密钥空间

    +   - 每个明文字母可以随机映射到任意一个密文字母，密文行是26个字母的任意置换，那么有26!或大于4×10^26种可能的密钥，每条消息用一个字母表加密

    +   - 这样密钥有26个字母长


    ```

    Plain:  abcdefghijklmnopqrstuvwxyz

    Cipher: DKVQFTBJWPESCXHTMYAUOLRGZN


    Plaintext:  ifwewishtoreplaceletters

    Ciphertext: WIRFRWAJUHYFISDVFSFUUFEYA

    ```'
  - '[PAGE 62]


    # 单表代换密码的安全性分析


    +   - 单表代换密码每条消息用一个字母表加密

    +   - 这样有 $26! = 4 \times 10^{26}$ 种可能的密钥，超过

    +     $400,000,000,000,000,000,000,000,000$

    +     $4 \times 10^{26} = 400万亿亿$

    +   - 这比DES的密钥空间大10个数量级，看起来是安全的，应该可以抵御穷举攻击，其实不然

    +   - 这是因为语言的一些规律和特性


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_62_0.png)'
  - '[PAGE 63]


    # 语言的冗余性和密码攻击


    +   - 人类的语言是有冗余性的

    +   - 比如从“th lrd s m shphrd shll nt wnt”中我们可以大概猜出些什么

    +   - 字母使用的频率是不一样的

    +   - 英文字母E是使用最频繁的，然后是T，R，N，I，O，A，S等

    +   - 有些字母使用得很少，如Z，J，K，Q，X

    +   - 这样可以得到英文字母使用频率分布表

    +   - 同时，统计双字母组合和三字母组合的使用频率也是非常有用的'
