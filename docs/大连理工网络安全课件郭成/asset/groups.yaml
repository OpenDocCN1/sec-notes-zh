    # Galois Fields GF(p)


    +   - 阶为 p 的有限域 GF(p)

    +     - 给定一个素数 p，元素个数为 p 的有限域 GF(p) 被定义为整数 {0,1，…，p-1} 的集合 Zₚ，其运算为模 p 的算术运算

    +     - Zₙ 中的任一整数有乘法逆元当且仅当该整数与 n 互素，若 n 为素数，Zₙ 中的所有非零整数都与 n 互素，因此 Zₙ 中所有非零整数都有乘法逆元

    +     - 对每一个 w∈Zₚ，存在一个 z，使得 w×z≡1 mod p，则 z 即为乘法逆元 w⁻¹

    +     - 因为 w 与 p 互素，如果用 w 乘以 Zₚ 中的所有数模 p，得到的余数将以不同次序涵盖 Zₚ 中的所有数，即余数集合是 {0,1，…，p-1}
    的置换形，那么至少有一个余数的值为 1。因此，在 Zₚ 中的某个数与 w 相乘模 p 的余数为 1，这个数就是 w 的乘法逆元，w⁻¹。所以，Zₚ 是一个有限域。'
