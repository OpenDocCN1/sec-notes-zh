  - "[PAGE 85]\n\n# Feistel Cipher分组加密循环细节\n\n+   - 将明文分成左右两部分\n+   \n+     $L_i =\
    \ R_{i-1}$\n+   \n+     $R_i = L_{i-1} \\mathbin{\\mathrm{xor}} F(R_{i-1}, K_i)$\n\
    +   \n+   - 将32-bit右半部和48-bit子密钥做以下动作\n+     - 使用置换表E，将32位右半部R扩展成48位\n+     -\
    \ 与48位子密钥做异或\n+     - 48位结果送给8个替换盒S-boxes，得到32位结果\n+     - 最后使用32位置换表P，把32位结果再进行一次置换处理"
