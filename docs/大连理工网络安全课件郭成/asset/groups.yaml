  - "[PAGE 245]\n\n# 中间人攻击\n\n假定A和B希望交换密钥，而D是攻击者，攻击过程如下：\n\n+   (1) 为了进行攻击，D先生成两个随机的私钥\
    \ $X_{D1}$ 和 $X_{D2}$，然后计算相应的公钥 $Y_{D1}$ 和 $Y_{D2}$。\n+   \n+   (2) Alice将 $Y_A$\
    \ 传递给Bob。\n+   \n+   (3) D截获了 $Y_A$，将 $Y_{D1}$ 传给B。D同时计算 $K_2=(Y_A)^{X_{D2}}\\\
    bmod q_0$。\n+   \n+   (4) B收到 $Y_{D1}$，计算 $K_1=(Y_{D1})^{X_B}\\bmod q_0$。\n+ \
    \  \n+   (5) B将 $Y_B$ 传给A。\n+   \n+   (6) D截获了 $Y_B$，将 $Y_{D2}$ 传给A。D计算 $K_1=(Y_B)^{X_{D1}}\\\
    bmod q_0$。\n+   \n+   (7) A收到 $Y_{D2}$，计算 $K_2=(Y_{D2})^{X_A}\\bmod q_0$。\n\n\
    此时，B和A想，他们已共享了密钥，但实际上，B和D共享了密钥$K_1$，而A和D共享了密钥$K_2$。接下来，B和A之间的通信以下列方式泄密：\n\n+ \
    \  (1) A发了一份加了密的消息 $M$：$E(K_2，M)$。\n+   \n+   (2) D截获了该秘密消息，解密，恢复出$M$。\n+   \n\
    +   (3) D将 $E(K_1，M)$ 或 $E(K_1，M')$ 发给B，其中 $M'$ 是任意的消息。"
  - "[PAGE 246]\n\n# 基于DLP的概率密码系统\nElGamal Cryptosystem\n\n+   - 假设A和B互相通信，共享大素数 $p$，本原元素\
    \ **α**，$0\\le m\\le p-1$\n+   - **加密：**\n+     - A选择 $k\\in[0,p-1]$，$k$的作用其实即为\
    \ $x_A$，A访问公共区域找到B的公开密钥 $Y_B=\\alpha^{x_B}\\bmod p$，计算：\n+       $K=(Y_B)^k\\\
    bmod p$，即 $K=\\alpha^{x_Bk}\\bmod p$\n+       \n+       $c_1=\\alpha^k\\bmod p$\n\
    +       \n+       $c_2=mK\\bmod p$\n+       \n+       密文即为 $(c_1,c_2)$\n+   -\
    \ **解密：**\n+     - B首先恢复K：$K=c_1^{x_B}\\bmod p=\\alpha^{kx_B}\\bmod p$\n+    \
    \ - 然后恢复m：$m=c_2/K\\bmod p=c_2K^{-1}\\bmod p$"
  - '[PAGE 247]


    # ElGamal Cryptosystem


    这里特别注意，k不能重复使用，如果


    (1) c₁,₁ = αᵏ mod p　　　　　　　　 c₂,₁ = m₁K mod p

    (2) c₁,₂ = αᵏ mod p　　　　　　　　 c₂,₂ = m₂K mod p


    得：m₁/m₂ = c₂,₁/c₂,₂ mod p. 如果m₁已知，m₂即可算出。


    +   • ElGamal密码体制是概率密码体制，同样的明文每次加密得到不同的密文，因为每次随机选择k。

    +   • ElGamal密码体制加密效率是50%，因为密文大小是明文的两倍。

    +   • ElGamal密码体制的破译难度同Diffie-Hellman的方法，即基于DLP，离散对数问题，最快的算法需要T=exp((ln(p)lnln(p))^(1/2))次运算。'
