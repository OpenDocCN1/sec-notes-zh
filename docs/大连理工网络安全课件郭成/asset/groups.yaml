    # # 第3章 分组密码和数据加密标准


    +   - 分组密码是一种加密解密算法，将输入明文分组当做一个整体处理，输出一个等长的密文分组。

    +   - 许多分组密码都采用Feistel结构，这样的结构由许多相同的轮函数组成。每一轮里，对输入数据的一半进行代换，接着用一个置换来交换数据的两个部分，扩展初始的密钥使得每一轮使用不同的子密钥。

    +   - DES是应用最为广泛的分组密码，它扩展了经典的Feistel结构。DES的分组和密钥分别是64位和56位的。'
  - "[PAGE 74]\n\n# # 乘积密码的设计思想\n\n+   - Claude Shannon and Substitution-Permutation\
    \ Ciphers\n+   \n+     1949年，Claude Shannon 引进了 substitution-permutation (S-P)\
    \ networks 的思想，即现代的乘积加密器，形成了现代分组加密的基础。S-P Networks 是基于替代和置换这两个基本操作的。\n+   \n+\
    \   - 提供了对明文信息处理所做的 *confusion* 和 *diffusion*。\n+     - Shannon认为，为了对付基于统计分析的密码破译，必须对明文作confusion(混淆)和diffusion(扩散)处理，以减少密文的统计特性，为统计分析制造障碍。\n\
    +   \n+   - **diffusion** – 明文统计结构扩散消失到大批密文统计特性中，使明文和密文之间统计关系尽量复杂；\n+   \n+  \
    \ - **confusion** – 混淆，使密文和加密密钥之间的关系尽量复杂。"
