    # 10.1.1 密钥管理之公钥的分配


    +   - 公共密钥的主要作用之一就是解决密钥分配问题，公钥密码实际上可以用于以下两个不同的方面

    +     - 公钥的分配

    +     - 公钥密码用于传统密码体制的密钥分配

    +   - 几种公钥分配方法

    +     - 公开发布、公开可访问的目录

    +     - 公钥授权、公钥证书

    +   - 公钥的公开发布

    +     - 用户将他的公钥发送给另一通信方，或者广播给通信各方，比如在电子邮件后附上PGP密钥，或者发布到邮件列表上

    +     - 最大问题在于任何人都可以伪造这种公钥的发布'
