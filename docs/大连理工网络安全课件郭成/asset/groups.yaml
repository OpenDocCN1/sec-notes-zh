  - '[PAGE 257]


    # # 公钥加密作为认证手段


    +   - 若要提供认证，发送方用自己的私钥对消息加密，接收方用发送方的公钥解密(验证)，就提供了认证功能。

    +   - 如果发送方用私钥加密消息，再用接收方的公钥加密，就实现了既保密又认证的通信

    +   - 既保密又认证的通信的代价是需要执行四次复杂的公钥算法而不是两次。'
  - '[PAGE 258]


    # # 11.2.2 消息认证码MAC


    +   - 使用密钥产生短小的定长数据分组，即所谓的密码检验MAC，将它附加在报文中。通信双方A和B共享密钥K，报文从A发往B，A计算MAC=C<sub>K</sub>(M)，附在报文后发给B。B对接收到的报文重新计算MAC，并与接收到的MAC比较。如果只有收发双方知道密钥且两个MAC匹配，则：

    +     - 接收方可以确信报文未被更改；

    +     - 接收方可以确信报文来自声称的发送者；

    +     - 接收方可以确信报文序号正确，如果有的话。

    +   - 报文认证不提供保密

    +   - MAC函数类似加密，但非数字签名，也无需可逆

    +   - 将MAC直接与明文并置，然后加密传输比较常用'
  - "[PAGE 259]\n\n# # MAC: 消息认证码的特点\n\n+   - MAC加密所得的消息校验和  \n+     \\( MAC = C_K(M)\
    \ \\)\n\n+   - 使用一个秘密密钥K，浓缩一个变长的消息M，产生一个固定长度的认证子\n\n+   - MAC是一种多对一的函数\n\n+  \
    \ - 定义域由任意长的消息组成，值域由所有可能的MAC和密钥组成。若使用n位长的MAC，则有2^n个可能的MAC，有N条可能的消息，N>>2^n。若密钥长度为k，则有2^k种可能的密钥。\n\
    \n+   - 如N为100，n为10，共有2^100不同的消息，2^10种不同的MAC，平均而言同一MAC可由2^100/2^10=2^90条不同的消息产生。若密钥长度为5，则从消息集合到MAC值的集合有2^5=32不同映射。\n\
    \n+   - 可以证明，由于认证函数的数学性质，与加密相比，认证函数更不易被攻破"
