    # 断言一


    对任何A，$0\le A\le M$，有唯一的k元组$(a_1,a_2,\ldots,a_k)$与之对应，其中$0\le a_i<m_i$；并且对任何这样的k元组$(a_1,a_2,\ldots,a_k)$，$\mathbb{Z}_M$中有唯一的A与之对应。'
