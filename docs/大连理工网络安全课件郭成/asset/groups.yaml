  md: "\n\n## 网络信息安全\n\nChapter 6\nMore on Symmetric Ciphers\n\n### 6.1.1 双重DES\n\n\
    - 多次加密的最简单形式是进行两次加密，每次使用不同的密钥\n  - `C = E_{K2}(E_{K1}(P))`\n  - `P = D_{K1}(D_{K2}(C))`\n\
    \  - 这种方法的密钥长度是56×2=112位\n\n- 虽然双重DES对应的映射与单DES对应的映射不同，但是有中途相遇攻击“meet-in-the-middle”\n\
    \  - 只要连续使用密码两次，这种攻击总是有效\n  - 因为 `X = E_{K1}(P) = D_{K2}(C)`\n  - 用所有可能的密钥加密明文P并把结果存储起来\n\
    \  - 然后用所有可能的密钥解密密文C，寻找匹配的X值\n  - 因此复杂度只有 `O(2^{56})`\n\n### 双重DES和三重DES\n\n-\
    \ 双重DES (Double DES)\n  给定明文P和加密密钥K₁和K₂，\n  加密：C=Eₖ₂[Eₖ₁[P]]\n  解密：P=Dₖ₁[Dₖ₂[C]]\n\
