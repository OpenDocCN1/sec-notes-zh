    # 对安全的攻击


    +   - **Interruption**: 对availability的攻击

    +   - **Interception**: 对confidentiality的攻击

    +   - **Modification**: 对integrity的攻击

    +   - **Fabrication**: 对authenticity的攻击


    ![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_14_0.png)'
  - '[PAGE 15]


    # 1.4 安全服务


    +   - X.800将安全服务定义为通信开放系统协议层提供的服务，从而保证系统或数据传输有足够的安全性

    +   - RFC2828定义安全服务为：一种由系统提供的对系统资源进行特殊保护的处理或通信服务；安全服务通过安全机制来实现安全策略

    +   - X.800将安全服务分为5类共14个特定服务

    +     - 认证、访问控制、数据保密性、数据完整性、不可否认性'
  - '[PAGE 16]


    # Security Services (X.800)


    +   - **Authentication认证** – 确保通信实体是合法和真实的，包括同等实体认证和数据源认证

    +   - **Access Control访问控制** – 防止资源非授权使用

    +   - **Data Confidentiality数据保密性** – 保护数据免于非授权泄漏，并防止流量分析

    +   - **Data Integrity数据完整性** – 确保接收到的数据是由授权用户发出的或者是未被修改过的

    +   - **Non-Repudiation不可否认性**– 防止通信方对通信行为的否认，包括源不可否认性和宿不可否认性

    +   - **Availability Service** – 系统或系统资源能够按照要求根据系统性能规范被授权系统的实体访问和使用'
  - '[PAGE 17]


    # 1.5 安全机制


    +   - 安全机制是用来检测、防止安全攻击，或从安全攻击中恢复的机制

    +   - 单一的安全机制不能保证所需的所有安全服务

    +   - 最重要的安全机制之一就是密码编码机制

    +   - 本课程的目标集中在密码编码机制'
  - '[PAGE 18]


    # # Security Mechanisms (X.800)


    # ## Specific security mechanisms


    +   - Encipherment(加密), digital signatures(数字签名), access controls(访问控制), data
    integrity(数据完整性), authentication exchange(认证交换), traffic padding(通信填充), routing
    control(路由控制), notarization(公证)


    # ## Pervasive security mechanisms


    +   - trusted functionality(可信功能), security labels(安全标识), event detection(事件检测),
    security audit trails(安全审计追踪), security recovery(安全恢复)'
  - '[PAGE 19]


    # 1.6 网络安全模型


    +   - 在需要保护信息传输以防攻击者威胁消息的保密性、真实性等的时候，就会涉及信息安全，任何用来保证安全的方法都包含两个方面：

    +     - 被发送信息的安全相关变换，如对消息加密，打乱消息使得攻击者不能读懂消息，或者将基于消息的编码附于消息后，用于验证发送方的身份。

    +     - 双方共享某些秘密信息，并希望这些信息不为攻击者所知。如加密密钥，配合加密算法在消息传输之前将消息加密，在接收端将消息解密。


    +   - 为实现安全传输，可能需要可信第三方，例如，由第三方复杂将秘密信息分配给通信双方，而对攻击者保密，或者当通信双方就关于信息传输的真实性发生争执时，由第三方来仲裁。'
