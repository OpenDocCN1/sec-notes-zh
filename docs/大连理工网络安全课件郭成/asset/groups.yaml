    \ Copy of session key accessible to client; used to decrypt authenticator, thereby\
    \ authenticating ticket\n- ID<sub>C</sub>: Indicates the rightful owner of this\
    \ ticket\n- AD<sub>C</sub>: Prevents use of ticket from workstation other than\
    \ one that initially requested the ticket\n- ID<sub>V</sub>: Assures server that\
    \ it has decrypted ticket properly\n- TS<sub>4</sub>: Informs server of time this\
    \ ticket was issued\n- Lifetime<sub>4</sub>: Prevents replay after ticket has\
    \ expired\n- Authenticator<sub>C</sub>: Assures server that the ticket presenter\
    \ is the same as the client for whom the ticket was issued; has very short lifetime\
    \ to prevent replay\n- E<sub>K<sub>C,V</sub></sub>: Authenticator is encrypted\
    \ with key known only to client and server, to prevent tampering\n- ID<sub>C</sub>:\
    \ Must match ID in ticket to authenticate ticket\n- AD<sub>C</sub>: Must match\
    \ address in ticket to authenticate ticket\n- TS<sub>5</sub>: Informs server of\
    \ time this authenticator was generated\n\n## Kerberos域和多重Kerberos\n\n- 一个Kerberos域包括Kerberos服务器，若干客户端和若干应用服务器\n\
    \  - Kerberos服务器必须有存放用户标识(UID)和用户口令的数据库，所有用户必须在Kerberos服务器注册\n  - Kerberos服务器必须与每个应用服务器共享一个特定密钥，所有应用服务器必须在Kerberos服务器上注册\n\
    - 隶属于不同行政机构的客户/服务器通常构成了不同域，在一个Kerberos服务器中注册的客户与服务器属于同一个行政区域。一个域中的客户可能需要访问另一个域中的服务器，而某些服务器也希望给其他域的客户提供服务，因此需要提供域间认证机制\n\
    \  - 每个互操作域的Kerberos服务器应共享一个密钥，双方的Kerberos服务器应相互注册\n- 一个域的Kerberos服务器必须信任其他域的Kerberos服务器对其用户的认证，其他域的应用服务器也必须信任第一个域中的Kerberos服务器\n\
    \n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_303_0.png)\n\nFigure 14.2 Request for\
    \ Service in Another Realm\n\n## Kerberos的安全问题和Kerberos 5\n\n- Kerberos的安全性问题\n\
    \  - 使用Time Stamp防止playback攻击；\n  - 使用口令做密钥，不安全；\n  - 集中式管理，使用AS和TGS，容易出危险。\n\
    - Kerberos 5的改进\n  - 增加代理功能，委托授权与有限授权\n  - 改进安全机制\n  - 在鉴别符Authenticator中增加子密钥，可用于群通信\n\
    \  - 增加域名，名字的结构分为两部分\n  - PDU描述改为ASN.1，方便变长字段和可选字段的处理\n\n## 14.1.3 Kerberos Version\
    \ 5\n\n- Kerberos v5是上个世纪90年代中期开发的\n- Kerberos v4与Kerberos v5的区别\n\n- 加密系统依赖性：v4使用DES，v5用加密类型标记密文，可以使用任何加密技术\n\
    - Internet协议依赖性：v4使用IP地址，不支持其他地址类型；v5用类型和长度标记网络地址，允许使用任何类型的网络地址\n- 消息字节顺序：v4由发送方说明消息字节顺序；v5按编码规则确定消息字节顺序\n\
    - 票据的生命期：v4生命期8位表示，2⁸x5=1280分钟；v5有精确的起始时间和终止时间，允许任意长度生命期\n- 向前认证：v4发给客户端的证书不能转发给其他用户进行其他相关操作；v5提供这项功能\n\
    - 域间认证：v4中N个域的互操作需要N2个Kerberos-to-Kerberos关系；v5需要的连接少\n\n## Kerberos版本5的消息交换\n\
    \n| 阶段 | 消息交换 |\n|---|---|\n| **(a) Authentication Service Exchange: to obtain\
    \ ticket-granting ticket** | **(1) C → AS:** Options ‖ IDc ‖ Realmc ‖ IDtgs ‖\
    \ Times ‖ Nonce₁<br><br>**(2) AS → C:** Realmc ‖ IDc ‖ Tickettgs ‖ Eₖc[ Kc,tgs\
    \ ‖ Times ‖ Nonce₁ ‖ Realmtgs ‖ IDtgs ]<br><br>Tickettgs = Eₖtgs[ Flags ‖ Kc,tgs\
    \ ‖ Realmc ‖ IDc ‖ ADc ‖ Times ] |\n| **(b) Ticket-Granting Service Exchange:\
    \ to obtain service-granting ticket** | **(3) C → TGS:** Options ‖ IDv ‖ Times\
    \ ‖‖ Nonce₂ ‖ Tickettgs ‖ Authenticatorc<br><br>**(4) TGS → C:** Realmc ‖ IDc\
    \ ‖ Ticketv ‖ Eₖc,tgs[ Kc,v ‖ Times ‖ Nonce₂ ‖ Realmv ‖ IDv ]<br><br>Tickettgs\
    \ = Eₖtgs[ Flags ‖ Kc,tgs ‖ Realmc ‖ IDc ‖ ADc ‖ Times ]<br><br>Ticketv = Eₖv[\
    \ Flags ‖ Kc,v ‖ Realmc ‖ IDc ‖ ADc ‖ Times ]<br><br>Authenticatorc = Eₖc,tgs[\
    \ IDc ‖ Realmc ‖ TS₁ ] |\n| **(c) Client/Server Authentication Exchange: to obtain\
    \ service** | **(5) C → V:** Options ‖ Ticketv ‖ Authenticatorc<br><br>**(6) V\
    \ → C:** Eₖc,v[ TS₂ ‖ Subkey ‖ Seq# ]<br><br>Ticketv = Eₖv[ Flags ‖ Kc,v ‖ Realmc\
    \ ‖ IDc ‖ ADc ‖ Times ]<br><br>Authenticatorc = Eₖc,v[ IDc ‖ Realmc ‖ TS₂ ‖ Subkey\
    \ ‖ Seq# ] |\n\n"
