    # # 针对RSA的计时攻击


    +   • 计时攻击

    +     • 类似通过观察他人转动保险柜拨号盘的时间长短来猜测密码

    +   • 可能的解决办法

    +     • 不变的幂运行时间，可能会降低性能

    +     • 在求幂运算中加入随机延时

    +     • 隐蔽：在执行幂运算之前先将密文乘上一个随机数

    +     • RSA数据安全算法，用私钥实现操作M=C^d mod n的过程如下

    +       • 产生0—n-1之间的秘密随机数r

    +       • 计算C''=C(r^e) mod n, e是公开的指数

    +       • 计算M''=(C'')^d mod n

    +       • 计算M=M''r^-1 mod n, 其中r^-1是r模n的乘法逆元，根据redmod n=r，可以证明结论是正确的'
