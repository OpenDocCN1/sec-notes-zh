    \ a<sub>i</sub>∈Z<sub>mi</sub>，且a<sub>i</sub> = A mod m<sub>i</sub>\n\n## 8.4\
    \ Chinese Remainder Theorem\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_369_0.png)\n\
    \n### 断言一\n\n对任何A，0≤A≤M，有唯一的k元组(a₁,a₂,…,aₖ)与之对应，其中0≤aᵢ<mᵢ；并且对任何这样的k元组(a₁,a₂,…,aₖ)，ℤₘ中有唯一的A与之对应。\n\
