    # # 本章要点


    +   - 域是一些元素的集合，其上定义了两个算术运算（加法和乘法），具有常规算术性质，如封闭性、结合律、交换律、分配律、加法逆和乘法逆等。

    +   - 模算术是一种整数算术，它将所有整数约减为一个固定的集合 `[0,1,⋯,n−1]`，`n` 为某个整数。任何这个集合外的整数通过除以 `n` 取余的方式约减到这个范围内。

    +   - 两个整数的最大公因子是可以整除这两个整数的最大正整数。

    +   - 一个有限域就是有有限个元素的域。可以证明有限域的阶（元素个数）一定可以写作素数的幂形式 `p^n`，`n` 为一个整数，`p` 为素数。

    +   - 阶为 `p` 的有限域可以由模 `p` 的算术来定义。

    +   - 阶为 `p^n`，`n>1` 的有限域可由多项式算术来定义。'
  - '[PAGE 93]


    # # 4.1群，环和域Groups, Rings, and Fields


    +   - 群G，记作{G, ·}，定义一个二元运算·的集合， G中每一个序偶(a, b)通过运算生成G中元素(a·b)， 满足下列公理：

    +     - (A1) 封闭性Closure: 如果a和b都属于G，则a·b也属于G.

    +     - (A2) 结合律Associative: 对于G中任意元素a, b, c，都有a·(b·c)=(a·b)·c成立

    +     - (A3) 单位元Identity element: G中存在一个元素e，对于G中任意元素a，都有a·e=e·a=a成立

    +     - (A4) 逆元Inverse element: 对于G中任意元素a，G中都存在一个元素a’，使得a·a’=a’·a=e成立'
  - '[PAGE 94]


    # # 群、有限群和无限群


    +   - 用 $N_n$ 表示 $n$ 个不同符号的集合，\{1,2,\ldots,n\}。$n$ 个不同符号的一个置换是一个 $N_n$ 到 $N_n$
    的一一映射。定义 $S_n$ 为 $n$ 个不同符号的所有置换组成的集合。$S_n$ 中的每一个元素都代表集合 $\{1,2,\ldots,n\}$ 的一个置换，容易验证
    $S_n$ 是一个群：

