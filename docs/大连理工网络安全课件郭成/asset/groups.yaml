    \ mod 353 = 40<sup>233</sup> mod 353 = 160　　　(Bob)\n\n### 10.2.2 Diffie-Hellman密钥交换协议\n\
    \n- 本协议不能抵抗中间人攻击\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_244_0.png)\n\nUser\
