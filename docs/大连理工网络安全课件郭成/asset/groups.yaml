  - '[PAGE 313]


    # 证书的层次结构


    +   - 如果用户有共同的CA，则他们应该知道彼此的公钥，否则CA必须形成层次结构并互相发放证书

    +   - 每个CA目录入口包含两种证书

    +     - 向前证书：由其他CA发给X的证书（forward, client）

    +     - 向后证书：X发给其他CA的证书（backward, parent）

    +   - 每一个用户信任他的父节点的证书

    +   - 通过层次化的结构，可以使一个CA下的用户验证任何其他CA下的用户的公钥证书'
  - "[PAGE 314]\n\n# # CA层次结构的使用\n\n+   - A从目录获得证书以建立通往B的证书路径  \n+     - X<<W>>W<<V>>V<<Y>>Y<<Z>>Z<<B>>\n\
    \n+   - B通过如下路径获得A的公开密钥  \n+     - Z<<Y>>Y<<V>>V<<W>>W<<X>>X<<A>>\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_314_0.png)"
  - '[PAGE 315]


    # 证书的撤销


    +   - 每个证书都有一个有效期，到期失效

    +   - 可能因为如下原因提前撤销证书

    +     1. 用户的私钥被认为不安全了

    +     2. 用户不再信任该CA

    +     3. CA的证书被认为不安全了

    +   - 每个CA维护一张证书撤销列表

    +     - the Certificate Revocation List (CRL)

    +   - 用户应该经常去CRL看看某个证书是否还有效'
