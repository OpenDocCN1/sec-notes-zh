    \  \n所以对所有的j≠i，有Mi≡0(modmj)。令  \nci=Mi×(Mi-1 mod mi)，1≤i≤k  \n根据Mi的定义有Mi与mi互素，所以Mi有唯一的模m的乘法逆元，因此可\
