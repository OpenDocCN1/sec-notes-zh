    \n- 非对称密码体制(Asymmetric System, Two-key System, Public-key System)\n\n  加密密钥和解密密钥不相同，从一个密钥导出另一个密钥是计算上不可行的，加密能力和解密能力是分开的，开放性好。\n"
  mdcn: "\n## Three-Way Authentication\n\n- 使用三条消息(A->B, B->A, A->B)建立认证过程而不需要同步时钟\n\
    - 最后从A发往B的消息中包含签了名的临时交互号r<sub>b</sub>，这样，其中的时间戳就不用检查了\n\n## 14.2.3 X.509 Version\
    \ 3\n\n- 密钥和策略信息\n  - 授权密钥标识符\n  - 主体密钥标识符\n  - 密钥使用\n  - 私钥使用期\n  - 证书策略\n  -\
    \ 策略映射\n- 证书主体和发行商属性\n  - 主体可选名字\n  - 发行商可选名字\n  - 主体目录属性\n- 证书路径约束\n  - 基本限制、名字限制、策略限制\n\
    \n## 14.3 公开密钥的全局管理体制PKI\n\n- 基于X.509证书的PKI\n\n- 公钥体制需要一个管理机制，保证公开密钥的可靠性。PKI (Public\
    \ Key Infrastructure)是公开密钥证书的管理体制。除了登记注册、管理、发布公钥证书之外，PKI还要负责撤销过去签发但现已失效的密钥证书，即CRL(X.509证书和证书撤销列表)。\n\
    \n- PKI本质上是一种公证服务，通过离线的数字证书来证明某个公开密钥的真实性，并通过CRL来确认某个公开密钥的有效性。\n\n- PKI的目标是向Internet用户和应用程序提供公开密钥管理服务，使其可靠地使用非对称密钥加密技术。数字证书是PKI的核心数据结构，引入了公认可信的第三方和数字证书，依赖证书上的第三方数字签名，用户可以离线地确认公钥的真实性。\n\
    \n## Public Key Infrastructure\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_323_0.png)\n\
    \n## PKI (Public Key Infrastructure)\n\n- X.509证书和证书撤销列表CRL\n\n  - X.509证书是由发布者数字签名的、用于绑定某公开密钥及其持有者身份的数据结构。\n\
    \n  - 证书撤销列表是另一种证书有效期控制机制，由发布者数字签名。证书使用者可以依据CRL (Certificate Revocation List)验证某证书是否已被撤销。\n\
    \n- PKI的结构模型\n\n  - PKI是公钥的管理机制，为域结构形态，每个PKI都有一定的覆盖范围，形成一个管理域。这些管理域通过交叉证书相互关联，构成更大的管理域，最终形成全局性公钥管理体系。\n\
    \n## PKI (Public Key Infrastructure)\n\n- PAA(Policy Approval Authority) 政策审批机构\
    \  \n  - 制订整个体系结构的安全政策并制订所有下级机构都需要遵循的规章制度，主要是证书政策和证书使用规定。\n- CA(Certificate Authority)\
    \ 证书管理中心  \n  - 负责具体的证书颁发与管理，如同颁发护照的部门，是可信任的第三方。\n- ORA(Organizational Registry\
    \ Authority) 单位注册机构  \n  - 帮助用户在CA处注册并获得证书。\n- PMA(Policy Management Authority)\
    \ 政策管理机构，对PKI进行宏观管理。\n- 端实体：数字签名和加密的实体\n\n## PKI (Public Key Infrastructure)\n\
    \n### PKI的操作模型\n\nPKI中有两种管理实体：证书管理中心CA和注册中心RA  \nCA：能够发布和撤销证书，维护证书的生存周期  \nRA：负责处理用户注册请求，在验证请求有效性后代用户向CA提交。\n\
    \nPKI中有两种端实体：持证者(Holder)和验证者(Verifier)\n\n- 持证者是证书拥有者，是证书所声明事实的主体；验证者通常是授权方，确认证书持有者的证书有效后再授予对方相应权力。\n\
    \n- 不同实体之间通过PKI操作完成证书的请求、确认、发布、撤销、更新、获取等过程。PKI的操作主要分成两大类：存取操作和管理操作。\n\n## 网络信息安全\n\
    \n### Chapter 1 Introduction\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_327_0.png)\n\
    \n### 1.3 安全攻击\n\n- 对任何机构的信息资源进行破坏的行为即安全攻击\n- 信息安全就是要检测和防范这种攻击行为\n- 通常 threat\
    \ 和 attack 指的是同样的事情\n- 安全攻击的行为范围很广\n- 通常有两大类安全攻击\n  - 被动攻击：对传输进行窃听和监测，通信和信息不受影响，用户感觉不到攻击存在，攻击通常是窃听或流量分析，判断通信性质\n\
    \  - 主动攻击：攻击者破坏通信过程，拦截、修改、伪造、丢弃信息、拒绝服务或假冒合法用户\n\n### Passive Attack -- release\
    \ of contents 被动攻击之消息内容的泄漏\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_329_0.png)\n\
    \n(a) Release of message contents\n\n### Passive Attack—traffic analysis 被动攻击之流量分析\n\
    \n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_330_0.png)\n\n(b) Traffic analysis\n\
    \n### Active Attack—Masquerade 主动攻击之伪装\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_331_0.png)\n\
    \nDarth  \nMessage from Darth that appears to be from Bob  \nInternet or other\
    \ comms facility  \nBob  \nAlice  \n(a) Masquerade\n\n### Active Attack—Replay\
    \ 主动攻击之重放\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_332_0.png)\n\n**Darth**\
    \  \nCapture message from Bob to Alice; later replay message to Alice  \nInternet\
    \ or other comms facility  \n**Bob**  \n**Alice**  \n(b) Replay\n\n### Active\
    \ Attack—Modification of messages 主动攻击之消息修改\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_333_0.png)\n\
    \n### Active Attack—Denial of Service 主动攻击之拒绝服务\n\n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_334_0.png)\n\
    \n(d) Denial of service\n\n## 网络信息安全\n\n### Chapter 2 Classical Encryption Techniques\n\
    \n![](img/4c4bffc5085ec4e6ce37d2fe335fbad5_335_0.png)\n\n### 理论安全和实际安全\n\n- **理论安全，或无条件安全**\
    \ Theoretical Secure (or Perfect Secure)\n  \n  攻击者无论截获多少密文，都无法得到足够的信息来唯一地决定明文。Shannon用理论证明：欲达理论安全，加密密钥长度必须大于等于明文长度，密钥只用一次，用完即丢，即一次一密，One-time\
    \ Pad，不实用。\n\n- **实际安全，或计算上安全** Practical Secure (or Computationally Secure)\n\
    \  \n  如果攻击者拥有无限资源，任何密码系统都是可以被破译的；但是，在有限的资源范围内，攻击者都不能通过系统的分析方法来破解系统，则称这个系统是计算上安全的或破译这个系统是计算上不可行(Computationally\
    \ Infeasible)。\n\n### 对称密码体制和非对称密码体制\n\n- 对称密码体制(Symmetric System, One-key System,\
    \ Secret-key System)\n\n  加密密钥和解密密钥相同，或者一个密钥可以从另一个导出，能加密就能解密，加密能力和解密能力是结合在一起的，开放性差。\n\
    \n- 非对称密码体制(Asymmetric System, Two-key System, Public-key System)\n\n  加密密钥和解密密钥不相同，从一个密钥导出另一个密钥是计算上不可行的，加密能力和解密能力是分开的，开放性好。\n"
