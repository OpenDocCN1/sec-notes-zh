    # 穷举攻击


    +   - 总是可以简单地尝试每一个可能的密钥

    +   - 穷举攻击是最基本的攻击，难度与密钥长度成正比

    +   - 平均来说要获得成功必须尝试所有可能密钥的一半


    **Table 2.2 Average Time Required for Exhaustive Key Search**


    | Key size (bits) | Number of alternative keys | Time required at 1 decryption/μs
    | Time required at 10^6 decryptions/μs |

    |---|---:|---:|---:|

    | 32 | 2^32 = 4.3 × 10^9 | 2^31 μs = 35.8 minutes | 2.15 milliseconds |

    | 56 | 2^56 = 7.2 × 10^16 | 2^55 μs = 1142 years | 10.01 hours |

    | 128 | 2^128 = 3.4 × 10^38 | 2^127 μs = 5.4 × 10^24 years | 5.4 × 10^18 years
    |

    | 168 | 2^168 = 3.7 × 10^50 | 2^167 μs = 5.9 × 10^36 years | 5.9 × 10^30 years
    |

    | 26 characters (permutation) | 26! = 4 × 10^26 | 2 × 10^26 μs = 6.4 × 10^12 years
    | 6.4 × 10^6 years |


