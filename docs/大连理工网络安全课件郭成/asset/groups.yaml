  mdcn: "\n\n## 8.4 Chinese Remainder Theorem\n\n$$\\left\\{\\begin{aligned} a_1&=A\\\
    bmod m_1\\\\ a_2&=A\\bmod m_2\\\\ \\vdots\\\\ a_k&=A\\bmod m_k\\end{aligned}\\\
    right. \\quad \\text{或} \\quad \\left\\{\\begin{aligned} A&\\equiv a_1\\pmod{m_1}\\\
    \\ A&\\equiv a_2\\pmod{m_2}\\\\ \\vdots\\\\ A&\\equiv a_k\\pmod{m_k}\\end{aligned}\\\
    right.$$\n\n### 断言一\n\n对任何$A$，$0\\le A\\le M$，有唯一的k元组$(a_1,a_2,\\ldots,a_k)$与之对应，其中$0\\\
    le a_i<m_i$；并且对任何这样的k元组$(a_1,a_2,\\ldots,a_k)$，$\\mathbb{Z}_M$中有唯一的$A$与之对应。\n\n\
    由$A$到$(a_1,a_2,\\ldots,a_k)$的转换显然是唯一确定的。即只需取$a_i=A\\bmod m_i$。对给定的$(a_1,a_2,\\\
    ldots,a_k)$，可如下计算$A$。\n\n对$1\\le i\\le k$，令$M_i=M/m_i$，因为$M=m_1\\times m_2\\times\\\
    ldots\\times m_{i-1}\\times m_{i+1}\\times\\ldots\\times m_k$，所以对所有的$j\\ne i$，有$M_i\\\
    equiv0\\pmod{m_j}$。令$c_i=M_i\\times(M_i^{-1}\\bmod m_i)$，$1\\le i\\le k$。根据$M_i$的定义有$M_i$与$m_i$互素，所以$M_i$有唯一的模$m$的乘法逆元，因此可得到唯一的$c_i$。计算\n\
    \n$$A=\\left(\\sum_{i=1}^{k}a_ic_i\\right)\\bmod M \\tag{8.9}$$\n\n要证明式(8.9)产生的$A$是正确的，必须证明对$1\\\
    le i\\le k$有$a_i=A\\bmod m_i$。由于$j\\ne i$时，$c_j\\equiv M_j\\equiv0\\pmod{m_i}$，而且$c_i\\\
    equiv1\\pmod{m_i}$，故$a_i=A\\bmod m_i$。\n\n第二个断言与算术运算有关，可从模算术规则推出\n\n若 $A \\leftrightarrow\
    \ (a_1, a_2, \\dots, a_k)$，$B \\leftrightarrow (b_1, b_2, \\dots, b_k)$\n\n则\n\
    \n$(A + B) \\mod M \\leftrightarrow ((a_1 + b_1) \\mod m_1, \\dots, (a_k + b_k)\
    \ \\mod m_k)$\n$(A - B) \\mod M \\leftrightarrow ((a_1 - b_1) \\mod m_1, \\dots,\
    \ (a_k - b_k) \\mod m_k)$\n$(A \\times B) \\mod M \\leftrightarrow ((a_1 \\times\
    \ b_1) \\mod m_1, \\dots, (a_k \\times b_k) \\mod m_k)$\n\n### 定理8.7 中国余数定理，Chinese\
    \ Remainder Theorem\n\n令 $d_1,\\ldots,d_t$ 两两互素，$n=d_1d_2\\cdots d_t$，则\n\n$x\
    \ \\bmod d_i=x_i,\\ i=1,\\ldots,t$ 在 $[0,n-1]$ 中有一个公共解 $x$。\n\n证明：对每一个 $i,\\ i=1,\\\
    ldots,t$，$\\gcd(d_i,\\frac{n}{d_i})=1$，存在 $y_i$，使得\n\n$\\left(\\frac{n}{d_i}\\\
    right)y_i\\bmod d_i=1$；\n\n进一步地，$\\left(\\frac{n}{d_i}\\right)y_i\\bmod d_j=0，j\\\
    ne i$，（因为 $d_j$ 是 $\\left(\\frac{n}{d_i}\\right)$ 的一个因数）\n\n令 $x=\\left[\\sum_{i=1}^{t}\\\
    left(\\frac{n}{d_i}\\right)y_i x_i\\right]\\bmod n$。\n\n∵ $x\\bmod d_i=\\left(\\\
    frac{n}{d_i}\\right)y_i x_i\\bmod d_i=x_i，\\left(\\left(\\frac{n}{d_i}\\right)y_i\\\
    bmod d_i=1\\right)$\n\n∴ $x$ 是 $x\\bmod d_i=x_i\\ (1\\le i\\le t)$ 的公共解。\n\n###\
    \ 孙子定理(孙子算经, 3-5世纪)\n\n今有物不知其数，三三数之剩二，五五数之剩三，七七数之剩二，问物几何。\n\n- $x \\bmod 3=2$\n\
    - $x \\bmod 5=3$\n- $x \\bmod 7=2$\n\n- $n=3\\times5\\times7=105$\n- $d_1=3, d_2=5,\
    \ d_3=7$\n- $x_1=2, x_2=3, x_3=2$\n\n(1) 求$y_i$，$(\\frac{n}{d_i})y_i \\mod d_i=1$\n\
    \n$(\\frac{105}{3})y_1 \\mod 3=1$\n$(\\frac{105}{5})y_2 \\mod 5=1$\n$(\\frac{105}{7})y_3\
    \ \\mod 7=1$\n\n得：\n$35 y_1 \\mod 3=1$\n$21 y_2 \\mod 5=1$\n$15 y_3 \\mod 7=1$\n\
    \n$y_1=2$\n$y_2=1$\n$y_3=1$\n\n(2) $x = (35\\times2\\times2+21\\times1\\times3+15\\\
    times1\\times2) \\mod 105=23$\n\n### Discrete logarithms\n\n- 模 $n$ 的整数幂\n  -\
    \ 根据欧拉定理(定理8.3)，$a^{\\phi(n)} \\bmod n=1$。\n  - 考虑欧拉定理更一般的形式：$a^m \\bmod n=1$，$\\\
    gcd(a,n)=1$，至少有一个整数 $m$ 满足 $a^m \\bmod n=1$，即 $m=\\phi(n)$，使其成立的最小正幂 $m$ 为下列之一：\n\
    \    - $a(模n)$的阶\n    - $a$所属的模的指数\n    - $a$所产生的周期长度\n\n- 7模19的各次幂\n  - $7^1=7\
    \ \\bmod 19$；$7^2=49=2\\times19+11=11 \\bmod 19$\n  - $7^3=343=18\\times19+1=1\
    \ \\bmod 19$；$7^4=2401=126\\times19+7=7 \\bmod 19$\n  - $7^5=16807=884\\times19+11=11\
    \ \\bmod 19$\n\n  因为 $7^3=1 \\bmod 19$，可得 $7^{3+j}=7^3 7^j=7^j \\bmod 19$，这说明若7的两个指数相差3或3的倍数，则以它们为指数的7的模19幂是相同的，即该序列是周期性的，且其周期长是使\
    \ $7^m=1 \\bmod 19$ 成立的最小正幂 $m$。\n\n### 模19的整数幂\n\n**Table 8.3 Powers of Integers,\
    \ Modulo 19**\n\n| a | a² | a³ | a⁴ | a⁵ | a⁶ | a⁷ | a⁸ | a⁹ | a¹⁰ | a¹¹ | a¹²\
