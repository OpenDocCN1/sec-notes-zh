    varphi(n))=1\\)。\n\n- 1) 计算 \\(g=(e_1, ed-1)\\);\n- 2) 计算 \\(h=(ed-1)/g\\);\n\
    - 3) 求数 \\(r, d_1\\) 使得 \\(rh + d_1 e_1 = 1\\).\n\n注意到 \\(g \\mid e_1\\)，则 \\\
    ((g,\\varphi(n))=1\\)。由于 \\(\\varphi(n) \\mid (ed-1)\\)，从而 \\(\\varphi(n) \\mid\
    \ h\\)。故得：\n\n\\[\nd_1 e_1 \\equiv 1 \\pmod{\\varphi(n)}\n\\]\n\n## § 10.4 Rabin\
    \ 加密算法\n\n密钥生成：\n\n取素数 \\(p, q\\) 作为私钥，要满足\n\n\\[\np \\equiv 3 \\pmod 4,\\quad\
