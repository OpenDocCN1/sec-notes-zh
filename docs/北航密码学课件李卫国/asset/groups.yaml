    ## 6.1 数据加密标准 DES

    (Data Encryption Standard)


    1972年NBS（National Bureau of Standards）开始旨在保护计算机和通信数据的项目。


    1973年5月，NBS公开征集标准加密算法，要求：


    - 1. 高度安全；

    - 2. 安全性取决于密钥；

    - 3. 易于理解；

    - 4. 适用于所有用户和各种应用；

    - 5. 可移植；

    - 6. 能用电子设备经济地实现；

    - 7. 使用效率高；

    - 8. 算法能被证明有效；


    1977年DES由IBM设计并正式由NBS公布使用。


    由于以上的请求被满足, DES成为一个世界范围内的标准已有20多年. 它抗住了多年的密码分析, 除可能的最强有力的敌手外, 对其他的攻击仍是安全的.


    1987年, ISO(International Standard Organization)下属的国际销售金融标准组在国际认证标准中使用了DES.


    我们国家许多金融证券部门仍在使用DES.


    1999年, 在RSA会议中, 电子前沿基金会在不到24小时内破解了一个DES密码!!! 世界需要一个替代者!


    ## 6.2 DES 加密算法


    **DES** 加密算法是一个对称算法：

    加密和解密用**同一算法和密钥**


    **DES** 加密算法是分组密码（**Block cipher**）：

    明文分成**64**位的分组进行加密，输出64位密文

    密钥长度64位，其中**56**位密钥，**8**位校验位


    **DES** 采用两种最基本的加密技术：

    **混乱**（**confusion**）

    **扩散**（**diffusion**）


    **DES** 加密算法分为16轮，每轮结构相同：

    每一轮采用 **Fistel** 结构


    ## 两个基本设计要求：


    **Shannon**称之为理想密码系统中，密文的所有统计特性都与所使用的密钥独立


    - **扩散（Diffusion）**：使得明文和密文之间的统计关系尽量复杂

    - **混乱（confusion）**：使得密文的统计特性与密钥的取值之间的关系尽量复杂


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_202_0.png)


    设明文 M 和密钥 K 均为由 0 和 1 组成的 64 位的符号串：


    M = m₁m₂…m₆₄

    K = k₁k₂…k₆₄


    其中 k₈, k₁₆, k₂₄, k₃₂, k₄₀, k₄₈, k₅₆, k₆₄ 为奇偶校验码。


    DES 算法由一系列循环运算（16轮）组成：


    DES(M) = IP⁻¹ ∘ T₁₆ ∘ T₁₅ ∘ … ∘ T₂ ∘ T₁ ∘ IP (M)


