    # 解密密文c:


    因为c是 mod p 的平方剩余(QR), 可知


    c^{(p-1)/2} ≡ 1 mod p


    从而 (c^{(p+1)/4})^2 ≡ c^{(p+1)/2} ≡ c^{(p-1)/2} c ≡ c mod p


    同样可得 (c^{(q+1)/4})^2 ≡ c mod q


    所以


    x = ± c^{(p+1)/4} mod p

    x = ± c^{(q+1)/4} mod q


