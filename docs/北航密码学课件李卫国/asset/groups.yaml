  - "[PAGE 323]\n\n# 定理 3 如果\n\n$$\begin{cases} a \\equiv b \\mod m_1 \\\\ a \\equiv\
    \ b \\mod m_2 \\\\ \\cdots \\\\ a \\equiv b \\mod m_k \\end{cases}$$\n\n则\n\n\
    $a \\equiv b \\mod [m_1, m_2, \\cdots, m_k]$"
  - '[PAGE 324]


    # 中国剩余定理（CRT）


    设正整数 $m_1, m_2, \dots, m_k$ 两两互素，则


    \begin{cases}

    x \equiv b_1 \mod m_1 \\

    x \equiv b_2 \mod m_2 \\

    \dots\dots \\

    x \equiv b_k \mod m_k

    \end{cases}


    模 $M$ 有唯一的解：


    $x = b_1 M_1 y_1 + b_2 M_2 y_2 + \cdots + b_k M_k y_k$


    其中：


    $M = m_1 m_2 \cdots m_j \cdots m_k$


    $M_j = m_1 m_2 \cdots m_{j-1} m_{j+1} \cdots m_k = M / m_j$


    $M_j y_j \equiv 1 \mod m_j, \quad j = 1,2,\dots,k$'
  - '[PAGE 325]


    # 求解步骤：


    设正整数 $m_1,m_2,\ldots,m_k$ 两两互素；


    +   1. $M=m_1m_2\cdots m_k$

    +   2. $M_j=M/m_j,\ j=1,2,\ldots,k$

    +   3. 求 $M_j$ 的 mod $m_j$ 的乘法逆元 $y_j$

    +   4. 同余方程组的解是

    +      $$x=b_1M_1y_1+b_2M_2y_2+\cdots+b_kM_ky_k$$'
  - '[PAGE 326]


    # 例 1 求解联立的线性同余式


    x ≡ 2 mod 3

    x ≡ 3 mod 5

    x ≡ 2 mod 7


    # 解


    M = 3*5*7 = 105


    M1 = 5*7 = 35

    M2 = 3*7 = 21

    M3 = 3*5 = 15


    y1 = 35⁻¹ ≡ 2¹ mod 3 = 2

    y2 = 21⁻¹ ≡ 1³ mod 5 = 1

    y3 = 15⁻¹ ≡ 1⁵ mod 7 = 1


    x = 2*35*2 + 3*21*1 + 2*15*1 mod 105

    = 23 mod 105'
  - '[PAGE 327]


    # 例 2 某数被7和13除余3，可被12 整除， =?


    # 解


    x ≡ 3 mod 7

    x ≡ 3 mod 13

    x ≡ 0 mod 12


    M=7*13*12=1092


    M1=13*12=156


    M2=7*12=84


    M3=7*13=91


    y1=156⁻¹ mod 7=2⁻¹ mod 7

    =2⁵ mod 7=4


    y2=84⁻¹ = 6⁻¹ mod 13

    =6¹¹ mod 13=11


    y3=91⁻¹ = 7⁻¹ mod 12 = 7


    x = 3*156*4+3*84*11 mod 1092=276'
  - '[PAGE 328]


    # 例 3 怎样用一系列小数表示一个大数？


