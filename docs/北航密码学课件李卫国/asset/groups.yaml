  - '[PAGE 376]


    # (1) 因数分解攻击（Factorization Attack）


    如果数 $n=pq$ 的因子分解被破，则可得

    $\varphi(n)=(p-1)(q-1)$

    从而由加密密钥 $e$ 可解出解密密钥 $d$：

    $de \equiv 1 \mod \varphi(n)$


    目前最快的因子分解算法的计算复杂度为：

    $O\left(2^{\sqrt{(\log_2 n)\log_2 \log_2 n}}\right)$


    RSA 要求模 n 必须大于 1024 位二进制数，

    约为 309 位的十进制数。

    p, q 最小应该 512 位二进制数

    约为 154 位的十进制数。'
  - '[PAGE 377]


    # (2) 选择密文攻击（Chosen-Ciphertext Attack）


    窃密者截获 Alic 的密文 C

    窃密者选择一个与 n 互素的随机数 X,

    计算 Y= C×X^e mod n ，发给Bob

    Bob 用私钥解密得 Z= Y^d mod n

    窃密者有可能利用 Z 解出 P


    Z= Y^d mod n = (C^d×X^{ed}) mod n

    = (C^d×X) mod n = (P×X) mod n


    P = Z×X^{-1} mod n'
  - '[PAGE 378]


    # （3）对加密指数 e 攻击


    加密指数 e 比较小，可提高加密的计算速度。


    但较小的 e 可能遇到如下攻击：


    +   - Copper smith 定理攻击：

    +   - 广播攻击：

    +   - 相关信息攻击：

    +   - 短填充攻击：


    > > e 不要过小。

    > > 建议取为 $2^{16}+1$ 附近的数'
  - '[PAGE 379]


    <!-- no content -->'
  - '[PAGE 380]


    # (5) 明文攻击（Plaintext Attack）


    短消息攻击：


    如短消息为4235，窃密者可以用公钥对0000-9999加密，然后与密文比较就可以确定出明文。


    > RSA 建议：

    > 对短消息要进行头尾的填充。


    循环攻击：'
  - '[PAGE 381]


    # (6) 对模 n 的攻击


    # 低模攻击：


    如果 n 过小，有可能进行因数分解。


    # 同模攻击：


    使用相同的 n，针对同一组织的很多人使用各不同的 (e_i, d_i)，是不安全的。

    有可能通过概率攻击破解 n 的因数分解


    RSA 建议：

    不要使用共同的模 n'
  - '[PAGE 382]


    # (7) 执行攻击


    时序攻击：


    由于指数的快速算法中，0 或 1 的计算量不同，监测加密过程的计算时间间隔，可以判断每一位是 0 或 1，进而破解出明文。


    能量攻击：


    原理相同，监测加密计算过程的能量变化


    RSA 建议：

    加随机延迟； 盲签名'
  - '[PAGE 383]


    # RSA建议：


    +   1. $p, q$ 最小应为512位二进制数，或154位十进制数，$n=pq$ 最小为1024位二进制数或309位十进制数；

    +   2. $p, q$ 的差应该比较大；

    +   3. $p-1, q-1$ 都应当至少有一个大的素因子；

    +   4. $gcd(p-1, q-1)$ 很小。


    这样的 $p, q$ 称为安全素数。'
  - "[PAGE 384]\n\n# 注：\n\n+   1. 知道 $n$ 与 $\\varphi(n)$ 容易破解 $p,q$：\n+   \n+   $$\\\
    varphi(n)=(p-1)(q-1)=pq-(p+q)+1=n-(p+q)+1$$\n+   $$ (p-q)^2=(p+q)^2-4pq $$\n\n\
    +   2. 如果 $p-q=k$ 较小，容易破解 $p,q$：\n+   \n+   $$ (p+q)^2-(p-q)^2=4pq=4n $$\n+  \
    \ $$ (p+q)^2=4n+k^2 $$\n+   $$ p+q=(4n+k^2)^{1/2},\\quad p-q=k $$"
  - '[PAGE 385]


    # 如何找安全素数：


    Mersenne 素数： 2^p−1


    Fermat 素数： 2^{2^n}+1


    π(x)： 小于x的素数个数


    # 素数定理：


    lim_{x→∞} \frac{π(x) ln x}{x} = 1'
  - '[PAGE 386]


    # 例： 估计64位的素数个数


    2^64 / ln 2^64 − 2^63 / ln 2^63 ≈ 2.05 × 10^17


    从而，64位的奇数为素数的概率为0.44；

    128位的奇数为素数的概率为0.22；

    256位的奇数为素数的概率为0.11；....

    因此，在64、128、和256位奇数中分别选

    23、46、92次奇数，就分别可获得一个素数。


    大素数如何产生？（请参见第九章）'
  - "[PAGE 387]\n\n此外，RSA 还建议：\n\n+   5、建议 $e$ 且取接近 $2^{16}+1$ 的整数。  \n+   6、$d$ 应大于\
    \ $n^{1/4}$；  \n+   7、不可使用公共的模 $n$  \n+   8、若私钥 $d$ 泄漏，必须同时更换 $n$、$e$、$d$  \n\
    +   9、信息必须要用 OAEP 填充"
  - '[PAGE 388]


    # 二、有关SRA的算法


    # 1、模幂乘法的快速计算


    **理由：** RSA的加密和解密都要进行 $mod\ n$ 的幂运算


    **关键：** 将幂指数化成2的方幂和'
  - '[PAGE 389]


    # 例子：（算法一）


    计算 $1520^{13} \mod 2537$。


    ```

    $l=1520^{13}=(1520)^ {2\times6+1}=(1520^2)^6\times1520$

    $=1730^6\times1520\pmod{2537}$

    $=1730^{2\times3}\times1520$

    $=1777^3\times1520\pmod{2537}$

    $=1777^2\times(1777\times1520)$

    $=1701\times1627\pmod{2537}$

    $=95\pmod{2537}$

    ```'
  - '[PAGE 390]


    # 计算 x^r (mod p) 的算法—流程图：


    a ← x

    b ← r

    c ← 1


    b=0?


    输出


    b ← b - 1

    c ← a c (mod p)


    b=0(mod 2)?


    b ← b / 2

    a ← a² (mod p)'
