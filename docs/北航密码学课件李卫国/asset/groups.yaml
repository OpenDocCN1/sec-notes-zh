    +   - 相关技术的发展

    +     - 1949年Shannon的 “The Communication Theory of Secret Systems”

    +     - 1967年David Kahn的《The Codebreakers》

    +     - 1971-73年IBM Watson实验室的Horst Feistel等几篇技术报告

    +   - 主要特点：数据的安全基于密钥而不是算法的保密'
