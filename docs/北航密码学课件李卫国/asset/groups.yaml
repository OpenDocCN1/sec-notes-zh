    - 密文 Ci 同时会反馈到下一个分组的移位寄存器，进而影响后面各组的密码，因此对后面个分组的明文都有影响。


    ## CFB 的使用


    - (1) CFB 本质上是流密码。

    - (2) 通常用于加密小的分组，比如1位或8位的小分组

    - (3) 通常不需要填充

    - (4) 当分组大小与DES或AES相同时（64位或128位），加解密更加简单明了。

    - (5) 不适合数据库的随机存取。


    ## 五、输出反馈（OFB）


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_292_0.png)


    ## OFB 解密过程


    ## OFB 的安全性


    - （1）本质上是同步流密码，密钥流独立于明文和密文，

    但由于密钥反馈的机制，密钥分组是相互关联的。


    - （2）不保留分组层


    - （3）传输错误的影响：

    　　Ci有一位传错，只会对明文 Pi 的同一位置产生影响。

    这就避免了错误的传播。


    ## OFB 的使用


    - 1. CFB 本质上是流密码。

    - 2. 通常用于加密小的分组，比如1位或8位的小分组。

    - 3. 通常不需要填充。

    - 4. 当分组大小与DES或AES相同时（64位或128位），加解密更加简单明了。


    ## CTR 解密过程


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_297_0.png)


    ## CTR 的安全性


    - (1) 本质上是同步流密码，密钥流独立于明文和密文，但由于计数器的递增机制，密钥与计数器所记的数字有关。


    - (2) 不保留分组层


    - (3) 传输错误的影响：

    - Ci有一位传错，只会对明文 Pi 的同一位置产生影响。

    - 这就避免了错误的传播。


    ## CTR 的使用


    - （1） CTR 本质上是流密码。

    - （2） 分组大小与DE或SAES相同

    - （3） 通常需要填充

    - （4） 与ECB 类似，各分组之间相互不影响，只要计数器的值与文件中的记录号有关，就可以使用于随机存取数据库记录


    ## CTR 的使用


    - (1) CTR 本质上是流密码。

    - (2) 分组大小与DE或SAES相同

    - (3) 通常需要填充

    - (4) 与ECB 类似，各分组之间相互不影响，只要计数器的值与文件中的记录号有关，就可以使用于随机存取数据库记录


    ## 第九章 密码数学C


    - 素数、因式分解

    - 同余方程组

    - 二次同余式

    - 指数与对数


    ## 二、素数的分布：


    π(n) = 小于等于 n 的素数的个数


    π(1) = 0      π(4) = 2      π(20) = 8

    π(2) = 1      π(5) = 3      π(50) = 15

    π(3) = 2      π(10) = 4     π(100) = 25


    n / ln n < π(n) < n / (ln n - 1.08366)


    ## 三、怎样找出素数？


    n = √n × √n


    若 n 不能被 ≤ √n 的所有素数整除，则 n 是素数。


    # Eratosthenes(埃拉托色尼) 筛法：


    要筛出100以内的所有素数：


    100的平方根=10， 小于10的素数有2,3,5,7


    不能被 2,3,5,7 整除的数一定是素数！


