    ## 怎样生成一个素数呢？


    - 1、 Mersenne(梅森) 素数


    Mp = 2^p - 1，其中 p 是素数。


    Mp 不一定是素数：

    如 M11=2^11-1 = 2047 = 23*89 不是素数

    目前发现了41个梅森素数，最大一个是 M124036583，有7253733位的十进制数，很大！


    - 2、 Fermat(菲玛) 素数


    Fn = 2^(2n) + 1


