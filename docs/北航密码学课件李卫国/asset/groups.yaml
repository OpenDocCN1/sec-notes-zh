  - '[PAGE 404]


    # Rabin密码的问题


    已知明文的攻击：


    窃密者选一随机数 $x$，并求出 $x^2 = c \mod n$。

    窃密者将 $c$ 送给Bob要求解密。

    Bob 解密后的明文 $m$ 被窃密者获取，

    如果 $m \neq \pm x \mod n$ (其概率为 $1/2$)，

    则Eve可获得$c$的4个平方根的两个独立解，

    并据此可解$n$的因子，故此系统可被破解。'
