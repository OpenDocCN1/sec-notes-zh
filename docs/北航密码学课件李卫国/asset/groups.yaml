    ## 选择明文攻击（Chosen-Plaintext Attack）。


    破译者除了知道加密算法外，还可以选定明文消息，并可以知道对应的加密得到的密文，即知道选择的明文和对应的密文。


    例如，公钥密码体制中，攻击者可以利用公钥加密他任意选定的明文，这种攻击就是选择明文攻击。


    ## 自适应选择明文攻击（Adaptive-Chosen-Plaintext Attack）。


    这是选择明文攻击的特殊情况。密码分析者不仅能选择被加密的明文，而且也能基于以前加密的结果修正这个选择。在选择明文攻击中，密码分析者可以选择一大块被加密的明文，而在自适应选择明文攻击中，可选取较小的明文块，然后再基于第一块的结果选择另一明文块，依此类推。


    ## 选择密文攻击（Chosen-Cipher Text Attack）


    破译者除了知道加密算法外，还包括他自己选定的密文和对应的、已解密的原文，即知道选择的密文和对应的明文。


    ## 选择文本攻击（Chosen-Text Attack）


    选择明文攻击与选择密文攻击的结合。

    破译者已知：加密算法、由破译者选择的明文消息和它对应的密文，以及由破译者选择的猜测性密文和它对应的已破译的明文。


    ## 选择密钥攻击（Chosen-Key Attack）


    这种攻击并不表示密码分析者能够选择密钥，它只表示密码分析者具有不同密钥之间的关系的有关知识。


    | 攻击类型 | 密码破译者已知的东西 |

    | --- | --- |

    | 唯密文 | - 加密算法

    - 待破译的密文 |

    | 已知明文 | - 加密算法

    - 待破译的密文

    - 由密钥形成的一个或多个明文—密文对 |

    | 选择明文 | - 加密算法

    - 待破译的密文

    - 由破译者选择的明文消息，连同对应的由密钥生成的密文 |

    | 选择密文 | - 加密算法

    - 待破译的密文

    - 由破译者选择的猜测性密文，连同它对应的由密钥生成的已破译明文 |

    | 选择文本 | - 加密算法

    - 待破译的密文

    - 由破译者选择的明文消息，连同对应的由密钥生成的密文

    - 由破译者选择的猜测性密文，连同它对应的由密钥生成的已破译明文 |


    ## 攻击方法


    - 蛮力攻击（Brute-force Method）

    - 穷举攻击（Exhausieve-key-search Mathod）

    - 统计攻击（Statistical Attack）

    - 模式攻击（Pattern Attack）


    软磨硬泡攻击（Rubber-Hose Cryptanalysis）

    这种攻击是对密码分析者威胁、劝察，或者折磨某人，直到他给出密钥为止。行贿有时称为购买密钥攻击（purchase-key attack）。这些是非常有效的攻击，并且经常是破译算法的最好途径。


    '
