    # Whittfield Diffie , Martin Hellman


    Whittfield Diffie : 斯丹福大学学生


    Martin Hellman: Diffie 的导师


    # 荣誉归属存在争议：


    James Ellis 英国通信电子安全小组（CSEG）1960年代，提出非对称加密思想；1973年其同事 Clifford Cocks 提出可行算法；1974年另一同事
    Williamson 开发非对称密钥加密算法。保密原因未发表。


    美国国家安全局（NSA）于1970年代中期也开始研究非对称密钥加密系统。'
  - '[PAGE 349]


    # 非对称密码体系：


    +   - Alice和Bob选用同一个公钥密码系统；

    +   - Bob将自己的公钥Kᴮᴱ传送给Alice；

    +   - Alice用B的公钥Kᴮᴱ加密信息并传送给Bob；

    +   - Bob用自己的私钥Kᴮᴰ解密收到的加密信息。


    公钥加密： C = f( Kpublic, P )

    私钥解密： P = g( Kprivate, C )'
