    \n令\n\n\\[\nr \\equiv c^{(p+1)/4} \\pmod p,\\qquad s \\equiv c^{(q+1)/4} \\pmod\
    \ q\n\\]\n\n求 \\(a\\) 和 \\(b\\) 使得\n\n\\[\nap + bq = 1\n\\]\n\n计算\n\n\\[\nx \\\
    equiv aps + bqr \\pmod n\n\\]\n\n\\[\ny \\equiv aps - bqr \\pmod n\n\\]\n\n则明文\
    \ \\(P\\) 为下述之一：\n\n\\[\nx,\\ -x,\\ y,\\ -y \\pmod n\n\\]\n\n**Bob：**\n\n- 选出\
    \ \\(p,\\ q \\equiv 3 \\pmod 4\\)\n- \\(n = p \\times q\\)\n- 公钥 \\(n\\)\n- 私钥\
    \ \\(p,q\\)\n\n**Alice：**\n\n- 明文 \\(P\\)\n- \\(C = P^2 \\bmod n\\)\n- 密文 \\(C\\\
    )\n- 求 \\(C\\) 的平方根\n- 明文 \\(P\\)\n\n### Rabin 密码中对应于密文 \\(C\\) 有四个可能的明文。\n\n\
    如果明文是一个随机序列，则无法确定该选择哪一个。一个解决的办法是加已知的前缀。\n\n### 例1\n\n私钥 \\(p=23,\\ q=7\\)，公钥 \\\
    (n=161\\)。\n\n明文 \\(P = 24\\)。\n\n加密：\n\n\\[\nC = 24^2 \\bmod 161 = 93\n\\]\n\n\
    解密：\n\n\\[\nP \\equiv 93^{(23+1)/4} \\pmod{23} \\equiv 1^6 \\pmod{23} \\equiv\
    \ 1 \\pmod{23}\n\\]\n\n\\[\nP \\equiv 93^{(7+1)/4} \\pmod{7} \\equiv 2^2 \\pmod{7}\
    \ \\equiv 4 \\pmod{7}\n\\]\n\n### 中国剩余定理求解\n\n\\[\nx \\equiv \\pm 4 \\pmod 7\n\
    \\]\n\n\\[\nx \\equiv \\pm 1 \\pmod{23}\n\\]\n\n四种组合：\n\n- \\(x \\equiv 4 \\pmod\
    \ 7,\\ x \\equiv 1 \\pmod{23}\\)\n- \\(x \\equiv 4 \\pmod 7,\\ x \\equiv -1 \\\
    pmod{23}\\)\n- \\(x \\equiv -4 \\pmod 7,\\ x \\equiv 1 \\pmod{23}\\)\n- \\(x \\\
    equiv -4 \\pmod 7,\\ x \\equiv -1 \\pmod{23}\\)\n\n得\n\n\\[\nx = 116,\\ 137,\\\
    \ 24,\\ 45 \\pmod{161}\n\\]\n\n### Rabin 密码的问题\n\n已知明文的攻击：\n\n窃密者选一随机数 \\(x\\\
    )，并求出 \\(x^2 \\equiv c \\pmod n\\)。\n\n窃密者将 \\(c\\) 送给 Bob 要求解密。\n\nBob 解密后的明文\
