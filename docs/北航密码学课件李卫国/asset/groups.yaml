    ## CFB 解密过程


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_289_0.png)


    ## CFB 的安全性


    - （1）分组存在相互关联：

    - 前一组的也密文会影响下一组的密钥

    - 明文相同的分组，其密文分组不一定相同


    - （2）不保留分组层


    - （3）攻击者可以在密文流的末尾增加一些密文分组


    - （4）传输错误的影响：

    - 传输中若密文 Ci 有一位传错，会对明文 Pi 的同一位位置产生影响。

    - 密文 Ci 同时会反馈到下一个分组的移位寄存器，进而影响后面各组的密码，因此对后面个分组的明文都有影响。


    ## CFB 的使用


    - (1) CFB 本质上是流密码。

    - (2) 通常用于加密小的分组，比如1位或8位的小分组

    - (3) 通常不需要填充

    - (4) 当分组大小与DES或AES相同时（64位或128位），加解密更加简单明了。

    - (5) 不适合数据库的随机存取。


    ## 五、输出反馈（OFB）


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_292_0.png)


    ## OFB 解密过程


    ## OFB 的安全性


    - （1）本质上是同步流密码，密钥流独立于明文和密文，

    但由于密钥反馈的机制，密钥分组是相互关联的。


    - （2）不保留分组层


    - （3）传输错误的影响：

    　　Ci有一位传错，只会对明文 Pi 的同一位置产生影响。

    这就避免了错误的传播。


    ## OFB 的使用


    - 1. CFB 本质上是流密码。

    - 2. 通常用于加密小的分组，比如1位或8位的小分组。

    - 3. 通常不需要填充。

    - 4. 当分组大小与DES或AES相同时（64位或128位），加解密更加简单明了。


    ## CTR 解密过程


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_297_0.png)


    ## CTR 的安全性


    - (1) 本质上是同步流密码，密钥流独立于明文和密文，但由于计数器的递增机制，密钥与计数器所记的数字有关。


    - (2) 不保留分组层


    - (3) 传输错误的影响：

    - Ci有一位传错，只会对明文 Pi 的同一位置产生影响。

    - 这就避免了错误的传播。


    ## CTR 的使用


    - （1） CTR 本质上是流密码。

    - （2） 分组大小与DE或SAES相同

    - （3） 通常需要填充

    - （4） 与ECB 类似，各分组之间相互不影响，只要计数器的值与文件中的记录号有关，就可以使用于随机存取数据库记录


    ## CTR 的使用


    - (1) CTR 本质上是流密码。

    - (2) 分组大小与DE或SAES相同

    - (3) 通常需要填充

    - (4) 与ECB 类似，各分组之间相互不影响，只要计数器的值与文件中的记录号有关，就可以使用于随机存取数据库记录


