    # § 10.3 RSA 加密算法


    1977年，麻省理工学院教授Rivest, 聘请 Samir 和 Adleman 在麻省进行共同研究,根据 Diffie 和 Hellman 的理论框架开发了第一个重要的非对称密钥加密系统，并于1978年发表。该密码以三人名字的首字母命名，称为
    RSA 算法。


    Ron Rivest, Adi Shamir, Len Adleman


    RSA 已成为最广泛接受的公钥方案。三人因此获得图灵奖。'
  - '[PAGE 369]


    # 一、RSA 密钥生成算法：


    +   1. 取两个充分大的素数 p, q;


    +   2. 计算 n=pq （公开）

    +      φ(n)=(p-1)(q-1) （保密）


    +   3. 随机选取整数 e （公开）

    +      满足 gcd(e, φ(n))=1;


    +   4. 计算 d （保密）

    +      满足 d e ≡1 mod φ(n)


    公钥: n, e


    私钥 d, φ(n)'
  - '[PAGE 370]


    # 对明文的加密算法：


    +   1. 将明文(二进制数串)按长度不大于 log₂ n 进行分组；

    +   2. 用公钥 n,e 对分组明文 p (设 p < n) 加密：

    +      加密算法： c = p^e mod n


    # 对明文的解密算法：


    解密算法： p = c^d mod n'
  - '[PAGE 371]


    # RSA算法证明：


    p1 = c^d mod n = (p^e mod n)^d mod n


    = p^{ed} mod n = p^{1 mod φ(n)} mod n


    = p^{kφ(n)+1} mod n


    = p mod n


    所以，p1 = p mod n'
