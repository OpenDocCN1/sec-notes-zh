    # 怎样进行因式分解呢？


    +   1、试除法： 复杂度：指数(NP)

    +   2、Fermat(费玛)方法： 复杂度：次指数

    +   3、Pollard p -1 方法： 复杂度：指数（NP）

    +   4、Pollard ρ 方法： 复杂度：指数O(2^{n/4})

    +   5、二次筛法： 复杂度：次指数

    +   6、数字域筛法： 复杂度：次指数


