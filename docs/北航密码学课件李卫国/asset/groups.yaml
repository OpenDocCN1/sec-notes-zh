  - '[PAGE 25]


    # 二、整数除法——带余除法


    我们在整数集 ℤ 上的除法运算：


    $a=q\times n+r$　　⇒　　$a\div n=q\ldots r$


    $255=23\times11+2$　　⇒　　$255\div11=23\ldots2$


    规定：除数 $n$ 为正数，余数 $r$ 非负。


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_25_0.png)


    $-255=(-23\times11)+(-2)=(-24\times11)+9$


    $-89\div7=-12\ldots-5=-13\ldots2$


    商数 -1，余数 +11'
  md: "\n# 密码学与网络安全\n\n李卫国\n\n北京航空航天大学软件学院\n\nE-mail: liwg@buaa.edu.cn\n\n## 教科书\n\
