    # 怎样检验一个数是素数呢？


    +   1、整除性检验：复杂度：指数 O(2^{n_b/2})

    +   2、AKS*(Agrawal, Kayal, Saxena, 2002)检验：复杂度：多项式 O(log₂ n_b)^{12} （第一个！）

    +   3、Fermat检验：指数复杂度

