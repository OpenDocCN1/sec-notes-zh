    - 1、H(x) 是单向函数；即对任意 x∈A*，容易计算 y = H(x)，y∈Aⁿ；但对给定 y∈Aⁿ，很难求出 x，使 H(x) = y\n- 2、已知\
    \ x，很难算出 x*∈A*，使 H(x) = H(x*)；\n- 3、很难求出一对 x 和 x*（x≠x*），使 H(x) = H(x*)\n\n###\
    \ 三、Hash函数的作用\n\n- 1、Hash 函数用于保护数据的完整性：生成消息摘要\n- 2、Hash 函数不能用于保护数据的机密性：不同于数据加密\n\
    - 3、Hash 函数不能用于数据的抗抵赖性：不同于数据签名\n\n## §2 信息认证码\n\n### Message Authentication Code:\
    \ MAC\n\n### 1、MAC\n\n利用密码产生的长度固定的信息摘要，附于信息之后，用于信息认证。\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_417_0.png)\n\
    \n### 2、MAC的使用模式：\n\n（1）A → B\n(m, Hₖ(m))\n\nA、B 共有 k，Hₖ(m) 是带 k 的 Hash 函数。A 发出\
    \ m 和 Hₖ(m)，B 计算 Hₖ*(m) 与 Hₖ(m) 比较。\n\n完整性\n\n（2）A → B\n(m, Eₖ(H(m)))\n\nH 不使用密钥，但制作\
    \ MD 之后用密钥加密。\n\n完整性\n\n（3）A → B\nEₖ(m, H(m))\n\n用密钥 K 同时加密 (m, H(m))。\n\n完整性\n\
    机密性\n\n## 第十二章 加密Hash函数\n\n### §1 迭代 hash 函数\n\n### 一、Merkle-Damgard 方案\n\n原信息\
    \ M 填充 | 长度 （长度为 0 mod n）\n\n```\nn比特 n比特 n比特\nM₁ M₂ M₃ …… Mₜ （n比特为一段）\nm比特\n\
    H₀ → f → H₁ → f → H₂ …… Hₜ → f → Hₜ\nm比特\n压缩函数\n```\n\n其中 f 为压缩函数 Hᵢ = f(Hᵢ₋₁,\
    \ Mᵢ)\n\nh(M)\n\n### 二、压缩函数的设计\n\n- 1、基于 Scratch 方法构建压缩函数：\n  MD2、MD4、MD5 —— MD\
    \ 表示信息摘要。由 Ron Rivest 设计的一系列数据摘要算法，最早称为 MD。\n  - 很快进入下一个版本 MD2\n  - 第三版 MD3 失败，没有发布\n\
    \  - 第四版 MD4 虽然发布，但仍不理想\n  - 最终推出 MD5\n\n  MD5 可以生成 128 位的数据摘要。\n\n- 3、基于对称分组密码构建压缩函数：\n\
    \  如 DES、3DES、AES。Hi——明文 P；Mi——密钥 K。\n  - Rabin 方案：f 取任意分组加密密码。Hi——明文 P；Mi——密钥\
    \ K。\n\n  ![](img/b96edad7944fa6b4b037429dcfe38a6f_424_0.png)\n\n  - Davis-Meyer\
    \ 方案：增加前馈，明文与密文相加。\n\n    ```\n    n比特\n    M₁\n    M₂\n    ……\n    Mₜ\n    m比特\n\
    \    H₀\n    H₁\n    H₂\n    Hₜ\n    h(M)\n    ```\n\n  - Matyas-Meyer-Oseas 方案：\n\
    \    Mi——明文；Hi——密钥 K\n    增加前馈，密钥与密文相加\n\n    ![](img/b96edad7944fa6b4b037429dcfe38a6f_426_0.png)\n\
    \n  - Miyaguchi-Preneel 方案：\n    再增加前馈，明文、密钥、密文进行异或加\n\n    ![](img/b96edad7944fa6b4b037429dcfe38a6f_427_0.png)\n\
    \n### §2 SHA-512\n\n### 一、SHA-512的结构\n\n```\n|M|    |P|    128\n原信息  填充  信息长度\n\
    k×1024\n\n1024 1024 1024 …… 1024\n\nH₀  512  初始值\nf   f   f …… f\nH₁  H₂  Hₖ\n\
    512 512 512 512\n信息摘要 512\n```\n\n- 3、以字为基本处理单元 —— 面向字（word oriented）\n\n  一个\
    \ word = 64 比特 = 8 字节\n\n  分组为16个字一组：16×64 = 2⁴×2⁶ = 1024\n\n  信息摘要只有8个字：8×64\
    \ = 2³×2⁶ = 2⁹ = 512\n\n  记为：A B C D E F G H\n\n- 4、压缩函数 f：（共 80 轮）\n\n    ```\n\
    \    H_{i-1}\n    512位\n    前一组的结果或初始摘要\n\n    A B C D E F G H\n\n    W₀ 64位 K₀\
    \ 64位轮常数 轮0\n    A B C D E F G H 初始H₀\n\n    输入80个字 80个轮常数\n\n    轮79\n    W₇₉\
    \ K₇₉\n\n    A B C D E F G H\n\n    Hᵢ 512位\n    初始值与79轮的结果相加\n    得到下一分组值或最后摘要\n\
    \n    A B C D E F G H\n    ```\n\n- 5、每一轮的结构\n\n  有6个轮换复制（字置换）：A→B, B→C, C→D,\
    \ E→F, F→G, G→H\n\n  ![](img/b96edad7944fa6b4b037429dcfe38a6f_432_0.png)\n\n \
    \ 其中新的 A = X 和 E = Y 需要重新计算，见下图：\n\n  ```\n  A B C\n  Majority (A, B, C) Rotate(A)\n\
    \  H E F G\n  Conditional (E, F, G) Rotate(E)\n  + + + w_i k_i\n  + D\n  X = A\
    \  Y = E\n  ```\n\n  其中 Majority(X, Y, Z)——多数函数（表决函数），每个对应位上：少数服从多数。\n  Conditional(X,\
    \ Y, Z)——条件函数，若 X 则 Y 否则 Z = (X AND Y) ⊕ (Not X and Z)。\n  Rotate(X)——旋转函数 = RotR₆₄(X)\
    \ ⊕ RotR₇₉(X)。\n\n"
