    x¹⁷: 10111100\nx¹⁸: 01111000+00011011= 01100011\n\n不进位时：\n左移位\n\n有进位时：\n先左移位再\n\
    +00011011\n\n## 2、模 $P(x)$ 乘法运算\n\n$(x^5+x^2+x^1)\\otimes(x^7+x^4+x^3+x^2+x^1)\\\
    bmod(x^8+x^4+x^3+x+1)$\n\n$=x^5\\otimes(x^7+x^4+x^3+x^2+x^1)+x^2\\otimes(x^7+x^4+x^3+x^2+x^1)$\n\
