  - '[PAGE 163]


    # 1、怎样进行模运算？


    P₁(x)=q(x)*P(x)+r(x)


    P₁(x) mod P(x) = r(x)


    含义：P1(x)与 r(x) 同余


    当 P₁(x) 也是 n 次多项式时：

    P₁= P(x) + r(x)    （商q(x)=1）

    r(x) = P₁(x) - P(x) = P₁(x) +P(x)


    当 P₁(x) 也是 n-1 低次多项式时：

    P₁= r(x)    （商q(x)=0）

    r(x) = P₁(x)


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_163_0.png)


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_163_1.png)'
