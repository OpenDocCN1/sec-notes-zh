    ## 第二章 传统对称密钥密码


    ## § 1 基本概念


    - 密码学 (Cryptology)：是研究信息系统安全保密的科学。

    - 密码编码学 (Cryptography)：研究对信息进行编码，实现对信息的隐蔽。

    - 密码分析学 (Cryptanalysis)：研究加密消息的破译或消息的伪造。


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_82_0.png)


    明文（Plaintext）： 原信息的初始形式 P

    密文（CypherText）： 编码后的加密信息 C

    加密算法（Encryption Algorithm）： C=E (P)

    解密算法 (Decryption Algorithm)： P=D(C)

    密码系统满足： P=D(E(P))


    密钥（Secret Key）:

    需要使用密钥的加密算法，记为： C=E(K,P),

    加密与解密的密钥相同，即： P=D(K,E(K,P))

    加密与解密的密钥不同，则： P=D(K_D,E(K_E,P))


