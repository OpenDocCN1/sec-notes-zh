  - '[PAGE 157]


    # 二、域（field）


    定义  设 $G$ 为一非空集合，$G$ 上定义了两种二元运算：


    $+$：构成加法交换群


    $*$：构成乘法交换群


    而且 $*$ 对 $+$ 有分配律


    则称代数系统 $F=\langle G,+,*\rangle$ 为一个域。


    | +运算 | *运算 |

    |---|---|

    | 运算封闭性 | 运算封闭性 |

    | 结合律 | 结合律 |

