  - '[PAGE 352]


    # 非对称密钥的核心技术：


    单向陷门函数（TOWF）：


    加密容易，但解密却相当难。

    其中，陷门就是解密密钥——有密钥解密就不难。


    加密： C = f( Kpublic, P )

    解密： P = g( Kprivate, C )


    +   （1）单向： y = f( x ) 容易计算；

    +   x = f⁻¹( y ) 很难计算。


    +   （2）陷门： 给定陷门的值 k， x = f⁻¹( y, k ) 就很容易计算。'
  - '[PAGE 353]


    # 需要澄清的问题：


    +   - 不要误认为公钥密码加密在防止密码攻击方面更安全可靠（任何加密方案的安全性都依赖于密钥的长度和加密算法的计算复杂度）；

    +   - 不要误认为公钥密码加密使得常规加密技术过时（公钥密码加密开销更大，所以公认为仅用于密钥管理和数字签名）；

    +   - 不要误认为公钥密码技术使得密钥管理非常简单，事实上，仍需要一个代理中心，而且整个过程既不简单，也不是更有效。'
  - '[PAGE 354]


    # § 10.2 背包公钥密码系统


    # 一、背包问题


    有 n 件物品装可以被装入背包


    物品名称： A₁, A₂, ... Aₙ


    物品重量： a₁, a₂, ..., aₙ


    装与不装： x₁, x₂, ..., xₙ （xᵢ=0, 1）


    称 A=(a₁, a₂, ..., aₙ) 为背包向量，


    X=(x₁, x₂, ..., xₙ) 为装法向量，


    背包重量为


    ```

    b = Σᵢ₌₁ⁿ aᵢ xᵢ = A'' X

    ```'
  - '[PAGE 355]


    $b = \sum_{i=1}^{n} a_i x_i = A''X$


    这是单向函数：给定X，容易计算b；

    反之，给定b，很不容易计算出X


    以n=100为例，穷举法的计算需要2¹⁰⁰次。

    计算复杂度是指数，这是一个NP完全问题。实际是不可计算的。


    有没有陷门？？？'
  - '[PAGE 356]


    # 例1 设 $n=6$, $A=(1, 25, 6, 11, 9, 20)$, $X=(0, 1, 1, 0, 0, 1)$, 求背包重量 $b$.


    解 背包重量 $b=25+6+20=51$.


    # 例2 设 $n=6$, $A=(1, 25, 6, 11, 9, 20)$, 背包重量 $b=54$, 求 $X$.


    解 $X=(0, 1, 0, 0, 1, 1)$ 因为必须装大件。


    $b=42$  $X=(0, 1, 1, 1, 0, 0)$'
  - '[PAGE 357]


    # 二、超递增数列与陷门


    定义：如果 $a_1, a_2, \dots, a_n$ 满足：

    $$\sum_{j=1}^{i-1} a_j < a_i$$


    则称 $A$ 是一个超递增数列（简单背包）。


    例如 $A = (17,25,46,94,201,400)$ 是简单背包。


    对超递增 $A$，按照“先挑大的装，超过不装”的原则，很容易由重量 $b$ 求解出装法 $X$。


    简单背包 $A$，就是由 $b$ 求解 $X$ 的陷门。'
  - '[PAGE 358]


    # 例3


    设 $n=6$, $A=(17, 25,46, 94, 201, 400)$, 若已知重量 $b=272$. 求 $X$


    # 解


    $A=(17, 25,46, 94, 201, 400)$

    $X=( 0, 1, 1, 0, 1, 0)$'
