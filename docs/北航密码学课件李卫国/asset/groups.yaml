  - '[PAGE 397]


    “在RSA公钥加密方案中，每个用户有一个公开密钥e和一个私有密钥d. 假设他已泄露了d和e，他不是产生一个新的模数，而是产生一对新的d和e，这样做安全吗？”


    # 不安全的理由：


    设新的公开密钥为e₁. 则(e₁, φ(n))=1.


    +   1) 计算g=(e₁, ed−1);

    +   2) 计算 h=(ed−1)/g;

    +   3) 求数 r, d₁ 使得 rh+ d₁e₁=1.


    注意到 g|e₁, 则 (g, φ(n))=1. 由于 φ(n)|(ed−1), 从而 φ(n)|h. 故得： d₁e₁≡1 mod φ(n)'
