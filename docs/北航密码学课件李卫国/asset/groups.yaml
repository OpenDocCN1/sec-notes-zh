    ## 选择明文攻击（Chosen-Plaintext Attack）。


    破译者除了知道加密算法外，还可以选定明文消息，并可以知道对应的加密得到的密文，即知道选择的明文和对应的密文。


    例如，公钥密码体制中，攻击者可以利用公钥加密他任意选定的明文，这种攻击就是选择明文攻击。


    ## 自适应选择明文攻击（Adaptive-Chosen-Plaintext Attack）。


    这是选择明文攻击的特殊情况。密码分析者不仅能选择被加密的明文，而且也能基于以前加密的结果修正这个选择。在选择明文攻击中，密码分析者可以选择一大块被加密的明文，而在自适应选择明文攻击中，可选取较小的明文块，然后再基于第一块的结果选择另一明文块，依此类推。


    ## 选择密文攻击（Chosen-Cipher Text Attack）


    破译者除了知道加密算法外，还包括他自己选定的密文和对应的、已解密的原文，即知道选择的密文和对应的明文。


