    \ n$）。\n\n(3) 作变换（默克尔-赫尔曼变换）：\n\n$$T\\equiv rB\\pmod n$$\n\n先乘后换。\n\n(4) 作置换 $P$：得到数列\
    \ $A=P*T$。\n\n$A=(a_1,a_2,\\dots,a_k)$ 不再是简单背包，称为陷门背包，可作为公钥予以公布。陷门信息 $n,r,P$ 和\
    \ $B$ 保密，作为私钥。\n\n公钥加密：\n\n$$c=A'X=(P(rB\\bmod n))'X=r(PB)'X\\bmod n$$\n\n私钥解密：\n\
    \n$$c'=r^{-1}c\\bmod n=(PB)'X=B'(P^{-1}X)$$\n\n利用 $B$ 是简单背包，可解出 $\\underline{X}=P^{-1}X$，进而求出\
    \ $X=P\\underline{X}$。\n\n**鲍勃：** 选出 $B=[b_1,b_2,\\dots,b_k]$；选出模数 $n$ 和 $r$；计算公钥\
    \ $A$。\n\n公钥 $A$ 发送给爱丽丝。\n\n**爱丽丝：** 明文 $x$；$c=\\mathrm{Sum}(x,A)$；得到密文 $c$。\n\
    \n密文 $c$ 发送给鲍勃。\n\n**鲍勃解密：** 使用私钥 $B,n,r$；$c'=r^{-1}c\\bmod n$；$x'=\\mathrm{inv}\\\
    text{-}\\mathrm{Sum}(c',B)$；$x=\\mathrm{permute}(x')$；还原明文 $x$。\n\n### 例5\n\n\
    鲍勃有背包私钥：\n\n$$B=(7,11,19,39,79,157,313)$$\n\n超递增，并且 $7+11+19+39+79+157+313=625$。\n\
    \n取 $n=900$，$r=37$，置换 $P=(4,2,5,3,1,7,6)$。\n\n**鲍勃生成公钥：**\n\n$$t=r\\times B\\\
    bmod 900=(259,407,703,543,223,409,781)$$\n\n$$a=\\mathrm{Permute}(t)=(543,407,223,703,259,781,409)$$\n\
    \n**爱丽丝用公钥将明文 $x=1100111$ 加密：**\n\n$$s=\\mathrm{sum}(x,a)=543+407+259+781+409=2399$$\n\
    \n**鲍勃用私钥解密：** $n=900$，$r=37$，置换 $P=(4,2,5,3,1,7,6)$，$B=(7,11,19,39,79,157,313)$。\n\
    \n$$s=2399\\times 37^{-1}\\bmod 900=527$$\n\n得到 $\\mathrm{sum}(x',B)=527$。\n\n\
    利用 $B$ 是简单背包，解出\n\n$$x'=(1,1,0,1,0,1,1)$$\n\n进而解出\n\n$$x=P(x')=(1,1,0,0,1,1,1)$$\n\
    \n在实际应用中，默克尔-赫尔曼建议，$k>100$，$2^{201}+1\\le n\\le 2^{202}-1$。简单背包的 $b_i$ 在范围 $(2^{i-1})2^{100}\\\
    le b_i\\le 2^{100+i-1}$ 内均匀地选取。\n\n"
