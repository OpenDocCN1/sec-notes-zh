    equiv -1\\pmod p$，则$a$是非平方同余（QNR）。\n\n### 2、$p$是奇素数时二次同余式的求解\n\n**定理3** 设 $p=4k+3$，$a$\
    \ 是 $\\mathbb{Z}_p^*$ 中的 QR，\n则 $x^2\\equiv a\\pmod p$ 的解是\n\n$$x=a^{(p+1)/4}\\\
    pmod p$$\n$$x=-a^{(p+1)/4}\\pmod p$$\n\n**例1** $x^2\\equiv 3\\pmod{23}$　（$23=4*5+3$）\n\
    \n$$x=3^{(23+1)/4}\\pmod p=3^6\\pmod{23}=16$$\n$$x=-3^6\\pmod{23}=-16\\pmod{23}=7$$\n\
    \n### 例2  x² ≡ 2 mod 11    （11=4*2+3）\n\n根据欧拉标准，\n\n2^( (11-1)/2 ) mod 11 = 2^5\
    \ mod 11 = -1\n\n所以，2是QNR。\n\n### 例3  求7在模19下的平方根。\n\nx² ≡ 7 mod 19    （19=4*4+3）\n\
    \nx = ±7^( (19+1)/4 ) mod 19 = ±7^5 mod 19 = ±11\n\n即 x = 11 或 x = 8\n\n### 3、mod\
    \ n 时二次同余式的求解\n\n设 $n = p_1 p_2 \\dots p_k$，求解\n\n$x^2 \\equiv a \\mod p_1$\n\
    $x^2 \\equiv a \\mod p_2$\n......\n$x^2 \\equiv a \\mod p_k$\n\n$x \\equiv \\\
    pm b_1 \\mod p_1$\n$x \\equiv \\pm b_2 \\mod p_2$\n......\n$x \\equiv \\pm b_k\
    \ \\mod p_k$\n\n再用中国剩余定理（韩信点兵法）求解 $2^k$ 个同余方程组。\n\n### 例4  $x^2 \\equiv 36 \\\
    mod 77$\n$n = 77 = 7*11$\n\n$x^2 \\equiv 36 \\equiv 1 \\mod 7$\n$x^2 \\equiv 36\
    \ \\equiv 3 \\mod 11$\n\n$x \\equiv \\pm 1^2 \\mod 7 = \\pm 1$\n$x \\equiv \\\
    pm 3^3 \\mod 11 = \\pm 5$\n\n$x \\equiv 1 \\mod 7$\n$x \\equiv 5 \\mod 11$\n\n\
    $x \\equiv 1 \\mod 7$\n$x \\equiv -5 \\mod 11$\n\n$x \\equiv -1 \\mod 7$\n$x \\\
    equiv 5 \\mod 11$\n\n$x \\equiv -1 \\mod 7$\n$x \\equiv -5 \\mod 11$\n\nx ≡ 1\
    \ mod 7\nx ≡ 5 mod 11\n\nx ≡ 1 mod 7\nx ≡ -5 mod 11\n\nx ≡ -1 mod 7\nx ≡ 5 mod\
    \ 11\n\nx ≡ -1 mod 7\nx ≡ -5 mod 11\n\nM=77\nM1=11, M2=7\ny1=11^{-1}=4^{-1}=2\
    \ mod7\ny2=7^{-1} mod 11=8\n\nx = 1*11*2+5*7*8 mod77\n= 302 = 71 = - 6 mod77\n\
    \nx = ±6 mod 77\nx = ±27 mod 77\n\n## 三、指数与离散对数\n\n指数计算： 由 x 求出 y = a^x mod n\n\
    \n离散对数： 由 y 求出 x， L_a y = x mod φ(n)\n\n由 a^{k φ(n)+1} = a mod n 可知\n a^{k φ(n)+x}\
    \ = a^x mod n\n y = a^x = a^{x mod φ(n)} mod n\n 通解 L_a y = x mod φ(n)\n\n###\
    \ 1、构造离散对数表\n\n设 a 是一个循环乘法群 G 的本源根（生成元），\nG 的非零元素都可以表示成 a^k，\n由此可构造指数表，其逆映射就是离散对数表\n\
    例： Z7* = {1, 2, 3, 4, 5, 6}，生成元为 3 和 5\n\ny = a^x\n\n| 3^1 | 3^2 | 3^3 | 3^4 |\
    \ 3^5 | 3^6 |\n| --- | --- | --- | --- | --- | --- |\n| 3 | 2 | 6 | 4 | 5 | 1\
    \ = 3^0 |\n\n指数表\ny = 3^x\n\n| x | 0 | 1 | 2 | 3 | 4 | 5 |\n| --- | --- | ---\
    \ | --- | --- | --- |\n| y | 1 | 3 | 2 | 6 | 4 | 5 |\n\n对数表\ny = L3 x\n\n| x |\
    \ 1 | 2 | 3 | 4 | 5 | 6 |\n| --- | --- | --- | --- | --- | --- |\n| y | 0 | 2\
    \ | 1 | 4 | 5 | 3 |\n\n### 2、利用离散对数表计算（查表）\n\n对数表\ny = L₃ x\n\n| x | 1 | 2 | 3\
    \ | 4 | 5 | 6 |\n| y | 0 | 2 | 1 | 4 | 5 | 3 |\n\n对数表\ny = L₅ x\n\n| x | 1 | 2\
    \ | 3 | 4 | 5 | 6 |\n| y | 0 | 4 | 5 | 2 | 1 | 3 |\n\n已知 3^x = 4 (mod 7)，求 x=?\
    \      x (mod 6) = L₃ 4 = 4\n\nx = 4, 10, 16, 22, 28, ... 都满足 3^x = 4 (mod 7)\n\
    \n已知 5^x = 6 (mod 7)，求 x=?      x (mod 6) = L₅ 6 = 3\n\n求 5^22 (mod 7) = ?\n\n\
    5^22 mod 7) = 5^22 mod φ(7) = 5^22 mod 6 = 5^4 = 2\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_340_0.png)\n\
    \n### 3、模指数快速算法\n\n求 17²² mod 21\n\n解： 22 = (10110)二进制 = 2⁴+2²+2 = 16+4+2\n\n\
    17² mod 21 = 16\n\n17⁴ mod 21 = 16*16 mod 21 = 4\n\n17⁸ mod 21 = 4*4 mod 21 =\
    \ 16 = -5\n\n17¹⁶ mod 21 = (-5)*(-5) mod 21 = 4\n\n17²² = 17^(10110) = 17^(2+4+16)\n\
    \n= 16*4*4 mod 21 = 4\n\n### 3、离散对数的性质\n\nLₐ 1 = 0 mod φ(n)\n\nLₐ a = 1 mod φ(n)\n\
    \nLₐ (x*y) = ( Lₐ x + Lₐ y ) mod φ(n)\n\nLₐ xᵏ = k * Lₐ x mod φ(n)\n\n注意： aᵏ mod\
    \ n\n\n= a^(k mod φ(n)) mod n\n\n≠ a^(k mod n) mod n\n\n模指数计算：\n快速乘幂算法\n\n多项式复杂度\n\
    \n离散对数计算：\n无有效快速算法\n\n指数复杂度（NP）\n\n# 习题9    p266\n\n21, 22, 23, 31, 33, 34, 35\n\
    \n## 第十章 公钥密码\n\n（非对称密钥密码）\n\n### § 10.1 非对称密钥简介\n\n传统密码技术(包括分组密码)建立在替代和置换基础之上.\
