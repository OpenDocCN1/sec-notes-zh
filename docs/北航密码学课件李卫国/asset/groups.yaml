    A₃ = ⌊A₂/3⌋ = aₙ₋₁ (n-1)!/3! + aₙ₋₂ (n-2)!/3! + ⋯ + a₃


    余数 r₂ = a₂ = A₂ − 3A₃


    一般地，有

    $A_i = \left\lfloor \frac{A_{i-1}}{i} \right\rfloor$


    余数 $r_{i-1}=a_{i-1}=A_{i-1}-iA_i$, $i=1, 2, \cdots, n-1$


    S 盒有 8 个，取 $n=8$, $8!=40320$。


    任意取一个随机数


    例如：


    由日期 20/09/01 得随机数：


    $200901 \equiv 39721 \pmod{40320}$


    由日期 20/09/01 得随机数：

    200901 ≡ 39721 (mod 40320 )

    而 39721 = a₇ 7! + a₆ 6! + a₅ 5! + a₄ 4! + a₃ 3! + a₂ 2! + a₁

    19865 = ⌊39721 / 2⌋ = a₇ 7!/2 + a₆ 6!/2 + a₅ 5!/2 + a₄ 4!/2 + a₃ 3!/2 + a₂

    余数 r₁ = a₁ = 1

    6621 = ⌊19865 / 3⌋ = a₇ 7!/3! + a₆ 6!/3! + a₅ 5!/3! + a₄ 4!/3! + a₃ 余数 r₂ = a₂
    = 0

    1655 = ⌊6621 / 4⌋ = a₇ 7!/4! + a₆ 6!/4! + a₅ 5!/4! + a₄ 余数 r₃ = a₃ = 0

    331 = ⌊1655 / 5⌋ = a₇ 7!/5! + a₆ 6!/5! + a₅ 余数 r₄ = a₄ = 0

    55 = ⌊331 / 6⌋ = a₇ 7!/6! + a₆ 余数 r₅ = a₅ = 1


    ## IDEA简单描述：


    明文：分组长度64 位


    密钥：解密密钥和加密密钥不同，长度均为128位


    基本运算：


    三个不同的代数群进行混合运算，


    用软件和硬件均容易实现，


    IDEA的混淆特性也是由这三个运算实现：


    - 1. 16 位的逐位异或运算, 记为 ⊕；

    - 2. 模2¹⁶的加法运算, 记为 ⊕；

    - 3. 模2¹⁶+1的乘法运算, 记为 ⊙。


    注： 2¹⁶+1=65537 为一素数(称为Fermat 数).


    ## 轮算法：


    - 将 64 位明文分成 4 个 16-位 组：

    - X₁， X₂， X₃， X₄


    - 将 128 位密钥分成 8 个 16-位组：

    - Z₁⁽¹⁾， Z₂⁽¹⁾， Z₃⁽¹⁾， Z₄⁽¹⁾， Z₅⁽¹⁾， Z₆⁽¹⁾， Z₁⁽²⁾， Z₂⁽²⁾


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_237_0.png)


    第一批的8个子密钥中的前6个用于第一轮，后两个Z₁⁽²⁾，Z₂⁽²⁾用于第二轮的前两个。密钥向左循环移25位再分成8个子密钥，其中前4个与第一批中剩下的Z₁⁽²⁾,
    Z₂⁽²⁾（作为第二批的前两个子密钥）作为第二轮的子密钥；等等. 共进行8轮。


    设第八轮的输出为 W₁, W₂, W₃, W₄

    则分别与最后4个子密钥Z₁⁽⁹⁾, Z₂⁽⁹⁾, Z₃⁽⁹⁾, Z₄⁽⁹⁾作运算：

    W₁ •₁₆ Z₁⁽⁹⁾=Y₁      W₂ +₁₆ Z₂⁽⁹⁾=Y₂

    W₃ +₁₆ Z₃⁽⁹⁾=Y₃      W₄ •₁₆ Z₄⁽⁹⁾=Y₄

    密文为： Y₁Y₂Y₃Y₄


    解密过程与加密过程完全一样，只是所用的解密密钥对应于加密密钥为：


    | 轮次 | 加密密钥 | 解密密钥 |

    |---|---|---|

    | 1 | $Z_1^{(1)}Z_2^{(1)}Z_3^{(1)}Z_4^{(1)}Z_5^{(1)}Z_6^{(1)}$ | $Z_1^{(9)}-1Z_2^{(9)}-Z_3^{(9)}Z_4^{(9)}-1Z_5^{(8)}Z_6^{(8)}$
    |

    | 2 | $Z_1^{(2)}Z_2^{(2)}Z_3^{(2)}Z_4^{(2)}Z_5^{(2)}Z_6^{(2)}$ | $Z_1^{(8)}-1Z_2^{(8)}-Z_3^{(8)}Z_4^{(8)}-1Z_5^{(7)}Z_6^{(7)}$
    |

    | 3 | $Z_1^{(3)}Z_2^{(3)}Z_3^{(3)}Z_4^{(3)}Z_5^{(3)}Z_6^{(3)}$ | $Z_1^{(7)}-1Z_2^{(7)}-Z_3^{(7)}Z_4^{(7)}-1Z_5^{(6)}Z_6^{(6)}$
    |

    | 4 | $Z_1^{(4)}Z_2^{(4)}Z_3^{(4)}Z_4^{(4)}Z_5^{(4)}Z_6^{(4)}$ | $Z_1^{(6)}-1Z_2^{(6)}-Z_3^{(6)}Z_4^{(6)}-1Z_5^{(5)}Z_6^{(5)}$
    |

    | 5 | $Z_1^{(5)}Z_2^{(5)}Z_3^{(5)}Z_4^{(5)}Z_5^{(5)}Z_6^{(5)}$ | $Z_1^{(5)}-1Z_2^{(5)}-Z_3^{(5)}Z_4^{(5)}-1Z_5^{(4)}Z_6^{(4)}$
    |

    | 6 | $Z_1^{(6)}Z_2^{(6)}Z_3^{(6)}Z_4^{(6)}Z_5^{(6)}Z_6^{(6)}$ | $Z_1^{(4)}-1Z_2^{(4)}-Z_3^{(4)}Z_4^{(4)}-1Z_5^{(3)}Z_6^{(3)}$
    |

    | 7 | $Z_1^{(7)}Z_2^{(7)}Z_3^{(7)}Z_4^{(7)}Z_5^{(7)}Z_6^{(7)}$ | $Z_1^{(3)}-1Z_2^{(3)}-Z_3^{(3)}Z_4^{(3)}-1Z_5^{(2)}Z_6^{(2)}$
    |

    | 8 | $Z_1^{(8)}Z_2^{(8)}Z_3^{(8)}Z_4^{(8)}Z_5^{(8)}Z_6^{(8)}$ | $Z_1^{(2)}-1Z_2^{(2)}-Z_3^{(2)}Z_4^{(2)}-1Z_5^{(2)}Z_6^{(2)}$
    |

    | 9 | $Z_1^{(9)}Z_2^{(9)}Z_3^{(9)}Z_4^{(9)}$ | $Z_1^{(1)}-1Z_2^{(1)}-Z_3^{(1)}Z_4^{(1)}-1$
    |


    其中 $Z$ 为 $Z$ 模 $2^{16}+1$ 的逆元。而 $-Z$ 为为 $Z$ 模 $2^{16}$ 的负元。


    ## IDEA 的速度： 比DES快两倍


    ## IDEA 的安全性：


    - 有穷攻击： 设计一个每秒测试十亿个密钥的芯片，并用十亿个芯片进行并行处理，将花费10¹³年！而用10²⁴个芯片进行并行处理，一天的時間可搜索完所有的密钥，但宇宙间没有足够的硅原子用来制作这些芯片！

    - 已证明IDEA四轮后对差分攻击免疫。


    ## 6.7 其他分组对称密码简介（补充内容）


    RC5分组密码算法是1994由麻萨诸塞技术研究所的Ronald L. Rivest教授发明的，并由RSA实验室分析。


    它是参数可变的分组密码算法，三个可变的参数是：分组大小、密钥大小和加密轮数。


    在此算法中使用了三种运算：异或、加和循环移位。


    ## RC5:


    - 一般形式为 RC5 – w/r/b

    - w: 分组长度（w = 16, 32, 64）

    - r: 迭代轮数

    - b: 密钥的8比特字节数（密钥长度 8*b）


    - RC5-32/12/16

    - 分组长度 2w = 64位

    - 迭代轮数 12轮

    - 密钥长度 128位


    ## RC6: 对RC5的改进版。


