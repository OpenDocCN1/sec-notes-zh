    \ Eve 可获得 \\(c\\) 的 4 个平方根的两个独立解，并据此可解 \\(n\\) 的因子，故此系统可被破解。\n\n### Rabin 密码的安全性\n\
    \n求解方程\n\n\\[\nx^2 \\equiv a \\pmod n\n\\]\n\n的计算复杂度与对 \\(n\\) 进行因数分解等价。\n\n只要\
    \ \\(n\\) 足够大，Rabin 密码与 RSA 同样安全。\n\n## § 10.5 Elgamal 密码\n\n密钥生成：\n\n- 1. 取大素数\
    \ \\(p\\)，取 \\(d \\in \\mathbb{Z}_p^*\\)，且 \\(1 \\leq d \\leq p-2\\)。\n  取 \\\
    (e_1\\) 为 \\(\\mathbb{Z}_p^*\\) 的一个生成元（本原根）。\n- 2. 计算 \\(e_2 = e_1^d \\bmod p\\\
    )。\n\n公钥：\\((e_1, e_2, p)\\)\n\n私钥：\\(d\\)\n\n加密：明文 \\(P < p\\)，任选随机 \\(r\\)。\n\
    \n\\[\nC_1 \\equiv e_1^r \\pmod p,\\quad C_2 \\equiv P \\times e_2^r \\pmod p\n\
    \\]\n\n密文 \\(C = (C_1, C_2)\\)。\n\n解密：\\(P = C_2 \\times (C_1^d)^{-1} \\bmod p\\\
    )。\n\n证明：\n\n\\[\n\\begin{aligned}\nP' &= C_2 \\times (C_1^d)^{-1} \\bmod p \\\
    \\\n&= (P \\times e_2^r) \\times (e_1^{rd})^{-1} \\bmod p \\\\\n&= (P \\times\
    \ e_1^{rd}) \\times (e_1^{rd})^{-1} \\bmod p \\\\\n&= P\n\\end{aligned}\n\\]\n\
    \n![](img/b96edad7944fa6b4b037429dcfe38a6f_408_0.png)\n\n**Alice：**\n\n公钥 \\((e_1,\
    \ e_2, p)\\)\n\n\\[\nC_1 \\equiv e_1^r \\pmod p,\\quad C_2 \\equiv P \\times e_2^r\
    \ \\pmod p\n\\]\n\n明文 \\(P\\)\n\n密文 \\(C\\)\n\n**Bob：**\n\n- 1. 选出 \\(p\\) 和生成元\
    \ \\(e_1\\)\n- 2. 选出 \\(d\\)\n- 3. 计算 \\(e_2 = e_1^d \\bmod p\\)\n\n私钥 \\(d\\\
    )\n\n\\[\nP = C_2 \\times (C_1^d)^{-1} \\pmod p\n\\]\n\n明文 \\(P\\)\n"
