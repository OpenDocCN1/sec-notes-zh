  md: "\n## Whitfield Diffie, Martin Hellman\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_346_0.png)\n\
    \n![](img/b96edad7944fa6b4b037429dcfe38a6f_346_1.png)\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_347_0.png)\n\
    \n### Whitfield Diffie：斯坦福大学学生\n\n### Martin Hellman：Diffie 的导师\n\n## 荣誉归属存在争议\n\
    \nJames Ellis（英国通信电子安全小组，CESG）于1960年代提出非对称加密思想；1973年其同事 Clifford Cocks 提出可行算法；1974年另一同事\
    \ Williamson 开发非对称密钥加密算法。由于保密原因未发表。\n\n美国国家安全局（NSA）于1970年代中期也开始研究非对称密钥加密系统。\n\n\
    ## 非对称密码体系\n\n- Alice 和 Bob 选用同一个公钥密码系统；\n- Bob 将自己的公钥 $K_B^E$ 传送给 Alice；\n- Alice\
    \ 用 B 的公钥 $K_B^E$ 加密信息并传送给 Bob；\n- Bob 用自己的私钥 $K_B^D$ 解密收到的加密信息。\n\n公钥加密：$C=f(K_{\\\
    text{public}},P)$  \n私钥解密：$P=g(K_{\\text{private}},C)$\n\n**Alice：** 明文 P → 加密\
    \ → 密文 C。密钥生成系统生成 B 的公钥和 B 的私钥。\n\n**Bob：** 密文 C 经不安全信道到达 → 解密 → 明文 P。\n\nB 的公钥相当于信报箱的开口，所有人都可放入信件；B\
    \ 的私钥相当于信报箱的钥匙，只有 B 可以取出信件。\n\n## 非对称密钥的核心技术\n\n单向陷门函数（TOWF）：加密容易，但解密却相当难。其中，陷门就是解密密钥——有密钥解密就不难。\n\
    \n公钥加密：$C=f(K_{\\text{public}},P)$  \n私钥解密：$P=g(K_{\\text{private}},C)$\n\n1.\
    \ 单向：$y=f(x)$ 容易计算；$x=f^{-1}(y)$ 很难计算。\n2. 陷门：给定陷门的值 $k$，$x=f^{-1}(y,k)$ 就很容易计算。\n\
    \n## 需要澄清的问题\n\n- 不要误认为公钥密码加密在防止密码攻击方面更安全可靠（任何加密方案的安全性都依赖于密钥的长度和加密算法的计算复杂度）；\n\
    - 不要误认为公钥密码加密使得常规加密技术过时（公钥密码加密开销更大，所以公认为仅用于密钥管理和数字签名）；\n- 不要误认为公钥密码技术使得密钥管理非常简单，事实上，仍需要一个代理中心，而且整个过程既不简单，也不是更有效。\n\
    \n## § 10.2 背包公钥密码系统\n\n### 一、背包问题\n\n有 $n$ 件物品可以被装入背包。\n\n物品名称：$A_1,A_2,\\dots,A_n$\
    \  \n物品重量：$a_1,a_2,\\dots,a_n$  \n装与不装：$x_1,x_2,\\dots,x_n$（$x_i=0,1$）\n\n称 $A=(a_1,a_2,\\\
    dots,a_n)$ 为背包向量，$X=(x_1,x_2,\\dots,x_n)$ 为装法向量，背包重量为\n\n$$b=\\sum_{i=1}^{n}a_i\
    \ x_i = A'X$$\n\n这是单向函数：给定 $X$，容易计算 $b$；反之，给定 $b$，很不容易计算出 $X$。\n\n以 $n=100$ 为例，穷举法的计算需要\
    \ $2^{100}$ 次。计算复杂度是指数，这是一个 NP 完全问题，实际是不可计算的。\n\n有没有陷门？？？\n\n### 例1\n\n设 $n=6$，$A=(1,25,6,11,9,20)$，$X=(0,1,1,0,0,1)$，求背包重量\
    \ $b$。\n\n解：背包重量 $b=25+6+20=51$。\n\n### 例2\n\n设 $n=6$，$A=(1,25,6,11,9,20)$，背包重量\
    \ $b=54$，求 $X$。\n\n解：$X=(0,1,0,0,1,1)$，因为必须装大件。\n\n$b=42$ 时，$X=(0,1,1,1,0,0)$。\n\
    \n### 二、超递增数列与陷门\n\n定义：如果 $a_1,a_2,\\dots,a_n$ 满足\n\n$$\\sum_{j=1}^{i-1}a_j <\
    \ a_i$$\n\n则称 $A$ 是一个超递增数列（简单背包）。\n\n例如 $A=(17,25,46,94,201,400)$ 是简单背包。\n\n对超递增\
    \ $A$，按照“先挑大的装，超过不装”的原则，很容易由重量 $b$ 求解出装法 $X$。\n\n简单背包 $A$，就是由 $b$ 求解 $X$ 的陷门。\n\
    \n### 例3\n\n设 $n=6$，$A=(17,25,46,94,201,400)$，若已知重量 $b=272$，求 $X$。\n\n解：\n\n$$A=(17,25,46,94,201,400)$$\n\
    \n$$X=(0,1,1,0,1,0)$$\n\n### 三、MH 背包公钥密码\n\n**Ralph Merkle, Martin Hellman**\n\
    \n**1、背包公钥密码系统**\n\n选取一组正整数 $a_1,a_2,\\dots,a_n$ 作为公钥予以公布，$m=m_1m_2\\dots m_n$\
    \ 是 $n$ 位的 $0,1$ 明文符号串。\n\n利用公钥加密为密文：\n\n$$c=a_1m_1+a_2m_2+\\dots+a_nm_n$$\n\n\
    从密文 $c$ 求解明文 $m$ 就是一个背包问题。\n\n例：公钥 $A=(28,32,11,08,71,51,43,67)$；明文分别为 $P_1=10110110$，$P_2=11001001$，则密文分别为：\n\
    \n$$c_1=28+11+8+51+43=141$$\n\n$$c_2=28+32+71+67=198$$\n\n若不知私钥，由 $c_1=141$，$c_2=198$\
    \ 反解 $P_1,P_2$ 不易计算。\n\n**2、MH 密钥生成**\n\n(1) 设 $B=(b_1,b_2,\\dots,b_k)$ 是超递增数列，满足：\n\
    \n$$\\sum_{j=1}^{i-1}b_j < b_i$$\n\n称 $B$ 为简单背包——当成私钥。\n\n打乱顺序，隐藏超递增性，作为公钥。\n\n\
    (2) 选择 $n>2b_k$（或 $n>\\sum_{j=1}^{k}b_j$），取 $r\\le n-1$ 且与 $n$ 互素（$r$ 可逆，$\\bmod\
    \ n$）。\n\n(3) 作变换（Merkle-Hellman 变换）：\n\n$$T\\equiv rB\\pmod n$$\n\n先乘后换。\n\n\
    (4) 作置换 $P$：得到数列 $A=P*T$。\n\n$A=(a_1,a_2,\\dots,a_k)$ 不再是简单背包，称为陷门背包，可作为公钥予以公布。陷门信息\
    \ $n,r,P$ 和 $B$ 保密，作为私钥。\n\n公钥加密：\n\n$$c=A'X=(P(rB\\bmod n))'X=r(PB)'X\\bmod n$$\n\
    \n私钥解密：\n\n$$c'=r^{-1}c\\bmod n=(PB)'X=B'(P^{-1}X)$$\n\n利用 $B$ 是简单背包，可解出 $\\underline{X}=P^{-1}X$，进而求出\
    \ $X=P\\underline{X}$。\n\n**Bob：** 选出 $B=[b_1,b_2,\\dots,b_k]$；选出模数 $n$ 和 $r$；计算公钥\
    \ $A$。\n\n公钥 $A$ 发送给 Alice。\n\n**Alice：** 明文 $x$；$c=\\mathrm{Sum}(x,A)$；得到密文 $c$。\n\
    \n密文 $c$ 发送给 Bob。\n\n**Bob 解密：** 使用私钥 $B,n,r$；$c'=r^{-1}c\\bmod n$；$x'=\\mathrm{inv}\\\
    text{-}\\mathrm{Sum}(c',B)$；$x=\\mathrm{permute}(x')$；还原明文 $x$。\n\n### 例5\n\n\
    Bob 有背包私钥：\n\n$$B=(7,11,19,39,79,157,313)$$\n\n超递增，并且 $7+11+19+39+79+157+313=625$。\n\
    \n取 $n=900$，$r=37$，置换 $P=(4,2,5,3,1,7,6)$。\n\n**Bob 生成公钥：**\n\n$$t=r\\times B\\\
    bmod 900=(259,407,703,543,223,409,781)$$\n\n$$a=\\mathrm{Permute}(t)=(543,407,223,703,259,781,409)$$\n\
    \n**Alice 用公钥将明文 $x=1100111$ 加密：**\n\n$$s=\\mathrm{sum}(x,a)=543+407+259+781+409=2399$$\n\
    \n**Bob 用私钥解密：** $n=900$，$r=37$，置换 $P=(4,2,5,3,1,7,6)$，$B=(7,11,19,39,79,157,313)$。\n\
    \n$$s=2399\\times 37^{-1}\\bmod 900=527$$\n\n得到 $\\mathrm{sum}(x',B)=527$。\n\n\
    利用 $B$ 是简单背包，解出\n\n$$x'=(1,1,0,1,0,1,1)$$\n\n进而解出\n\n$$x=P(x')=(1,1,0,0,1,1,1)$$\n\
    \n在实际应用中，Merkle-Hellman 建议，$k>100$，$2^{201}+1\\le n\\le 2^{202}-1$。简单背包的 $b_i$\
    \ 在范围 $(2^{i-1})2^{100}\\le b_i\\le 2^{100+i-1}$ 内均匀地选取。\n"
