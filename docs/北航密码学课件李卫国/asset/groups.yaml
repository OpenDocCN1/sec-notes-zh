    **定理3** 设 $p=4k+3$，$a$ 是 $\mathbb{Z}_p^*$ 中的 QR，\n则 $x^2\equiv a\pmod p$ 的解是


    $$x=a^{(p+1)/4}\pmod p$$\n$$x=-a^{(p+1)/4}\pmod p$$


    **例1** $x^2\equiv 3\pmod{23}$　（$23=4*5+3$）


    $$x=3^{(23+1)/4}\pmod p=3^6\pmod{23}=16$$\n$$x=-3^6\pmod{23}=-16\pmod{23}=7$$'
