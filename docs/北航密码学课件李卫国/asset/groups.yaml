  - '[PAGE 22]


    # # 密码体系形式化描述


    密码体系是一个五元组（P, C, K, E, D）满足条件：


    +   1. **P** 是可能明文的有限集；（明文空间）

    +   2. **C** 是可能密文的有限集；（密文空间）

    +   3. **K** 是一切可能密钥构成的有限集；（密钥空间）

    +   4. 任意 *k* ∈ **K**，有一个加密算法 *eₖ* ∈ **E** 和相应的解密算法 *dₖ* ∈ **D**，使得 *eₖ: P → C*
    和 *dₖ: C → P* 分别为加密解密函数，满足 *dₖ(eₖ(x)) = x*，这里 *x* ∈ **P**。'
