    将64 Bit的密钥去掉第 8, 16, 24, 32, 40, 48, 56, 64 位上的校验字符，剩下56 Bit，再做如下置换：


    | 输入位 | 置换输出 |

    |---|---|

    | 1 2 3 4 5 6 7 | 57 49 41 33 25 17 9 |

    | 9 10 11 12 13 14 15 | 1 58 50 42 34 26 18 |

