  - '[PAGE 320]


    # § 9.2 中国剩余定理


    来自《孙子算经》的问题：

    “今有物不知其数，三三数之剩二，五五数之剩三，七七数之剩二，问物几何？”


    如设 x 为其数，则有：


    ```

    x ≡ 2 mod 3

    x ≡ 3 mod 5

    x ≡ 2 mod 7

    ```


