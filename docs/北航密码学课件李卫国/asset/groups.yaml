    # 理论安全与实际安全


    1883年Kerck hoffs 第一次提出了编码的原则：


    假设加密算法是公开的，预防攻击主要依赖密钥。


    如果密钥足够安全，加密算法则无必要隐藏。


    密钥域要足够大，才能使密钥足够安全。


    1949年， Shannon 提出：


    +   1. 当破译者有无限制的时间和无限制的计算能力时一个密码系统的安全性；


    +   2. 当破译者在有限的时间和有限的计算能力时，一个密码系统的安全性。'
  - '[PAGE 94]


    # 加密方案的安全性


    +   - 无条件安全：无论提供的密文有多少，如果由一个加密方案产生的密文中包含的信息不足以唯一地决定对应的明文

    +   - 除了一次一密的方案外，没有无条件安全的算法

    +   - 密码安全性体现在：

    +     - 破译成本超过加密信息的价值

    +     - 破译时间超过该信息有用的生命周期'
