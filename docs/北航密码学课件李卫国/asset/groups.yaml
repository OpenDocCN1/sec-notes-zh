    \ 1、加密保护机密性：\n  防暴露攻击、防窃听、防流量分析\n- 2、保护完整性：\n  防篡改、插入、删除、重放\n- 3、身份认证：\n- 4、不可否认性：\n\
    - 5、访问控制：\n  防未经授权的实体访问（读、写、修改、执行）\n\n### 安全机制\n\n- 1、加密（encipherment）：\n- 2、信息完整性（data\
