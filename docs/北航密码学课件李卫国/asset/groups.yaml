    ## 5、一次一密密码（One-time-pad ——OTP）


    每发送一次信息，改变一次密钥。


    密钥完全随机生成，密钥长度固定。


    加密方法： Ci = Pi * Ki mod 26


    解密方法： Pi = Ci-*Ki mod 26


    明文： P = how are you（你好吗）


    密钥： K= NCBTZQARX


    加密下一条信息时，更换密码


    | P | h | o | w | a | r | e | y | o | U |

    |---|---|---|---|---|---|---|---|---|---|

    | P~ | 7 | 14 | 22 | 0 | 17 | 4 | 24 | 14 | 20 |

    | K~ | 13 | 2 | 1 | 19 | 25 | 16 | 0 | 17 | 23 |

    | C~ | 20 | 16 | 23 | 19 | 16 | 20 | 24 | 5 | 17 |

    | C | U | Q | X | T | Q | U | Y | F | R |


    - 使用非重复的随机字母序列加密，会使至今能使用的任何密码分析工具失效。——“完美”的替换密码


    - 一次性密钥（One Time Pad——OTP）

    - > 相同的PAD，发方与收方绝对同步；

    - > 打印、分发、保存与使用问题???


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_128_0.png)


    - 长随机数序列（对OTP的近似实现）：

    - **r_{i+1}=r_i*c+b mod w**

    - 其中w c和b为常数,为计算机能表示的最大整数


    - 最初，AT&T 使用 Vernam密码机实现一次一密的加密，故又称 Vernam 密码。


    ## § 3 换位密码（Transposition Cipher）


    换位密码是采用移动字母位置的方法进行加密的。

    它把明文中的字母重新排列，字母本身不变，但位置变了。


    如：把明文中的字母的顺序倒过来写，然后以固定长度的字母组发送或记录。


    明文：**computer systems**（计算机系统）

    密文：**sm etsy sretupmoc**


    换位并没有改变字母，可能的攻击方法：


    - - 单字母频率攻击

    - - 蛮力攻击：考虑所有可能的排列

    - - 模式攻击


    ![](img/b96edad7944fa6b4b037429dcfe38a6f_129_0.png)


