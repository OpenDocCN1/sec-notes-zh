    # Bob


    选出 B = [b1, b2, ... bk]

    选出模数 n 和 r

    计算公钥 A


    公钥 A


    # Alice


    c = Sum (x, A)


    明文 x


    密文 c


    私钥 b,n,r


    c'' = r ^-1 c mod n

    x'' = inv- Sum (c'', B)

    x = permute(x'')


    明文 x'
