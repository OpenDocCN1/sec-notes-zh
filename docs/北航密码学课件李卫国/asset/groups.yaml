  - '[PAGE 116]


    # 二、多码代换（Polyalphabetic subistution）


    在多码代换中，明文中的一个字符被代换成密文中的多个字符，明文与密文中的字符总是一对多的对应关系。


    可以看成是 Z26 到 Z26 的一对多的映射。


    由于在多码代换中，阴藏了字母的频率特征，可以防范频率统计攻击。


    例如：用两张字母替换表E₁和E₂，分别替换明文信息中的奇数和偶数位置的字符，从而打乱密文中的字母分布频率特性，以避免遭受频率统计攻击，这种编码方法称为“双表密码”。类似地，可以构造出更复杂的“多表密码”。'
