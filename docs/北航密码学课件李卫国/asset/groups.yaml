    # 三、MH 背包公钥密码


    # Ralph Merkle , Martin Hellman


    # 1、背包公钥密码系统：


    选取一组正整数 a₁, a₂, …, aₙ 作为公钥予以公布，


    m = m₁m₂…mₙ 是 n 位的 0, 1 明文符号串。


    利用公钥加密为密文：


