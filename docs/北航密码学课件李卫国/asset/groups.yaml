    打乱顺序，隐藏超递增性,作为公钥


    (2) 选择 n > 2bₖ ( 或 n > Σ_{j=1}^k b_j ), 取 r ≤ n-1 且与 n 互素, ( r 可逆, mod n )


    (3) 作变换( Merkle-Hellman变换 ):

    T ≡ r B mod n


    先乘后换


    (4) 作置换P: 得到数列 A = P*T'
  - '[PAGE 362]


    A=(a₁, a₂, ..., aₖ)不再是简单背包, 称为陷门背包, 可作为公钥予以公布。

    陷门信息 n、r、P 和 B 保密, 作为私钥密码。


    公钥加密： c = A′X = (P(r B mod n))′X

    = r (PB)′X mod n


    私钥解密： c′ = r⁻¹ c mod n

    = (PB)′X = B′(P⁻¹X)


    利用 B 是简单背包, 可解出 X̲ = P⁻¹ X


    进而求出 X = P X̲'
