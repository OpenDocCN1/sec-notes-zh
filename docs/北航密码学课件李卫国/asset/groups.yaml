    \ padding）：\n- 6、路由控制（routing control）：\n- 7、公证（notarization）：\n- 8、访问控制（access\
    \ control）：\n\n### 安全技术\n\n- 1、密码术\n- 2、密写术\n\n## 二、密码学的发展过程\n\n- 1949年之前\n  密码学是一门艺术\n\
    - 1949～1975年\n  密码学成为科学\n- 1976年以后\n  密码学的新方向——公钥密码学\n\n### 第1阶段—古典密码\n\n- 密码学还不是科学，而是艺术\n\
    - 出现一些密码算法和加密设备\n- 密码算法的基本手段出现，针对的是字符\n- 简单的密码分析手段出现\n- 主要特点：数据的安全基于算法的保密\n\n\
    ![](img/b96edad7944fa6b4b037429dcfe38a6f_10_0.png)\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_11_0.png)\n\
    \n**Phaistos圆盘**，一种直径约为**160mm**的**Cretan-Minoan**粘土圆盘，始于公元前**17世纪**。表面有明显字间空格的字母，至今还没有破解。\n\
    \n### 20世纪早期密码机\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_0.png)\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_1.png)\n\
    \n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_2.png)\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_3.png)\n\
    \n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_4.png)\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_12_5.png)\n\
    \n### 第1阶段—古典密码\n\n- 1883年Kerckhoffs第一次明确提出了编码的原则：加密算法应建立在算法的公开不影响明文和密钥的安全。\n\
    - 这一原则已得到普遍承认，成为判定密码强度的衡量标准，实际上也成为传统密码和现代密码的分界线。\n\n### 第2阶段 1949~1975\n\n- 计算机使得基于复杂计算的密码成为可能\n\
    - 相关技术的发展\n  - 1949年Shannon的“Communication Theory of Secrecy Systems”\n  - 1967年David\
    \ Kahn的《The Codebreakers》\n  - 1971-73年IBM Watson实验室的Horst Feistel等几篇技术报告\n- 主要特点：数据的安全基于密钥而不是算法的保密\n\
    \n### 第3阶段 1976~\n\n- 1976年：Diffie & Hellman 的“New Directions in Cryptography”提出了不对称密钥密码\n\
    - 1977年Rivest, Shamir & Adleman提出了RSA公钥算法\n- 90年代逐步出现椭圆曲线等其他公钥算法\n- 主要特点：公钥密码使得发送端和接收端无密钥传输的保密通信成为可能\n\
    - 1977年DES正式成为标准\n- 80年代出现“过渡性”的“Post DES”算法，如 IDEA, RCx, CAST等\n- 90年代对称密钥密码进一步成熟，Rijndael、RC6、MARS、Twofish、Serpent等出现\n\
    - 2001年Rijndael成为DES的替代者\n\n## 三、密码学基本概念\n\n- 密码学（Cryptology）：是研究信息系统安全保密的科学。\n\
    - 密码编码学（Cryptography）：主要研究对信息进行编码，实现对信息的隐藏。\n- 密码分析学（Cryptanalysis）：主要研究加密消息的破译或消息的伪造。\n\
    \n### 基本概念\n\n明文（Plaintext）：消息的初始形式；\n\n密文（Ciphertext）：加密后的形式\n\n记：\n\n明文记为P且P为字符序列，P=[P1,P2,...,Pn]\n\
    \n密文记为C，C=[C1,C2,...,Cn]\n\n明文和密文之间的变换记为C=E(P)及P=D(C)\n\n其中C表示密文，E为加密算法；P为明文，D为解密算法\n\
    \n我们要求密码系统满足：P=D(E(P))\n\n- 需要密钥的加密算法，记为：C=E(K,P)，即密文消息同时依赖于初始明文和密钥的值。实际上，E是一组加密算法，而密钥则用于选择其中特定的一个算法。\n\
    - 加密与解密的密钥相同，即：P=D(K,E(K,P))\n- 加密与解密的密钥不同，则：P=D(K_D,E(K_E,P))\n\n### 常规加密系统的模型\n\
    \n![](img/b96edad7944fa6b4b037429dcfe38a6f_21_0.png)\n\n### 密码体系形式化描述\n\n密码体系是一个五元组（P,\
    \ C, K, E, D）满足条件：\n\n- 1. **P** 是可能明文的有限集；（明文空间）\n- 2. **C** 是可能密文的有限集；（密文空间）\n\
    - 3. **K** 是一切可能密钥构成的有限集；（密钥空间）\n- 4. 任意 *k* ∈ **K**，有一个加密算法 *eₖ* ∈ **E** 和相应的解密算法\
    \ *dₖ* ∈ **D**，使得 *eₖ: P → C* 和 *dₖ: C → P* 分别为加密解密函数，满足 *dₖ(eₖ(x)) = x*，这里 *x*\
    \ ∈ **P**。\n\n## 第二章 密码数学基础（1）\n\n### 二、整数除法——带余除法\n\n我们在整数集 ℤ 上的除法运算：\n\n$a=q\\\
    times n+r$　　⇒　　$a\\div n=q\\ldots r$\n\n$255=23\\times11+2$　　⇒　　$255\\div11=23\\\
    ldots2$\n\n规定：除数 $n$ 为正数，余数 $r$ 非负。\n\n![](img/b96edad7944fa6b4b037429dcfe38a6f_25_0.png)\n\
    \n$-255=(-23\\times11)+(-2)=(-24\\times11)+9$\n\n$-89\\div7=-12\\ldots-5=-13\\\
    ldots2$\n\n商数 -1，余数 +11\n"
