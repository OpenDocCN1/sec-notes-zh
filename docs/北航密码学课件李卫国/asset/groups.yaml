    # 五、$Z_n$中的逆元素与逆运算


    # 3 乘法逆的求法——Euclid（辗转相除）


    设 $\gcd(n,b)=1$，$b^{-1}$ 存在


    可求出：$s\times n+b\times t=1$


    $(s\times n)\bmod n+(b\times t)\bmod n=1\bmod n$


    $=0\bmod n$


    $(b\times t)\bmod n=1$


    $b^{-1}=t\bmod n$'
