    \n- 单表代换密码不是依靠**长密钥**来提供安全的\n\n- 提高安全性的一个途径是去**加密双字母，多字母表代换密码**\n\n- 其中一个例子是Playfair密码，Playfair将明文中的双字母组合看作一个单元对待，并将这些单元转换为双字母组合。加密后的字符出现的频率在一定程度上被均匀化。\n\
    \n- Wheatstone（惠特斯通）于1854年发明，却以他朋友Playfair的名字命名\n\n## 字母出现频率比较\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_60_0.png)\n\
    \n明文\nPlayfair密码\nVigenère密码\n随机的多表代替密码\n字母的频率\n图 2.6 字母出现的相对频率\n\n## Playfair\
    \ 密钥矩阵\n\n- 基于密钥词构成的5X5字母矩阵\n\n- 用关键字字母填充(没有重复字母)\n\n- 矩阵的其余部分用其他字母填充\n\n- 例如,使用关键字MONARCHY\n\
