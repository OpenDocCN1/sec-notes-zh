  - '[PAGE 10]


    # 脆弱性与攻击


    +   - 系统资源的脆弱性可能是：

    +     - 被破坏（缺乏完整性）

    +     - 泄漏（缺乏保密性）

    +     - 不可用（缺乏可用性）


    +   - 攻击是被实施的威胁

    +     - 被动的

    +     - 主动的

    +     - 内部的

    +     - 外部的'
  - '[PAGE 11]


    # 对策


    +   - 用于对付攻击的方法：防止、检测、恢复

    +   - 可能导致新的弱点

    +   - 可能残留弱点

    +   - 目标是最大限度的降低风险'
  - '[PAGE 12]


    # 威胁后果


    +   > 未授权的泄露

    +     - 暴露, 截获, 推理, 入侵

    +   > 欺骗

    +     - 冒充, 伪造, 抵赖

    +   > 破坏

    +     - 失能, 损坏, 阻碍

    +   > 篡夺

    +     - 盗用, 误用'
