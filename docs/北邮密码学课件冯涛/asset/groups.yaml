  - "[PAGE 145]\n\n# 求逆元\n\n```\nEXTENDED EUCLID(m, b)\n1. (A1, A2, A3)=(1, 0, m);\n\
    \   (B1, B2, B3)=(0, 1, b)\n2. if B3 = 0\n   return A3 = gcd(m, b); no inverse\n\
    3. if B3 = 1\n   return B3 = gcd(m, b); B2 = b⁻¹ mod m\n4. Q = A3 div B3\n5. (T1,\
    \ T2, T3)=(A1 - Q B1, A2 - Q B2, A3 - Q B3)\n6. (A1, A2, A3)=(B1, B2, B3)\n7.\
    \ (B1, B2, B3)=(T1, T2, T3)\n8. goto 2\n```\n\n注意：\nm T1+ b T2 = T3 ;  m A1+ b\
    \ A2 = A3 ; m B1+ b B2 = B3"
