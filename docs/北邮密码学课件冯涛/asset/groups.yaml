    \ 5 章 高级加密标准\n\nAES 是一种分组密码，用于取代 DES，分组长度为 128 位，密钥长度为 128 位或更长。\n\nAES 没有使用 Feistel\
    \ 结构，每轮包含四个独立的运算：\n\n- 字节代换\n- 置换\n- 有限域上的算术运算\n- 密钥异或运算\n\n## 动机及历史\n\n> 替换 DES\
