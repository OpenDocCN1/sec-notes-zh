    # DES 密钥方案


    +   > 每轮都要产生子密钥

    +   - 密钥的初始转换(PC1)即在两个28位的密钥等份中选取48位

    +   - 16 轮的组成如下:

    +     - 根据密钥移位表K,分别使这两等份循环左移1位或2位

    +     - 从这两部分中分别选择24位，在轮函数F中,使用 PC2对它们进行置换'
  - '[PAGE 108]


    # DES 解密


    +   - 解密必须按数据加密运算的相反步骤进行

    +   - 用Feistel设计,再执行一次加密步骤,但子密钥按相反顺序使用(SK₁₆...SK₁)

    +     - IP 使用最后的 FP 加密步骤

    +     - 第1轮使用SK₁₆,使用第16轮加密步骤

    +     - ....

    +     - 第16轮使用SK₁,使用第1轮的加密步骤

    +     - 最后的FP使用开始加密时使用的IP

    +     - 最后恢复出原始数据值'
