  - '[PAGE 29]


    # 安全服务


    +   > X.800:

    +   > “它是通信开放系统的协议层提供的服务，确保系统或数据传输的安全”


    +   > RFC 2828:

    +   > “由系统提供的一种处理或通信服务，以对系统资源提供某种特定的保护”'
  md: "\n# 信息安全理论与实践\n\n冯　涛\n\n兰州理工大学计算机与通信学院\n\n## 背景\n\n➢ 信息安全的第一次变革：数据处理设备\n\n\
    自动化的工具保护文件和其他存储信息\n\n| 物理机制：加载<br>管理机制：检查 | → | 计算机安全 |\n\n➢ 信息安全的第二次变革：网络与通信设施\n\
    \n网络安全措施保护数据\n\n| 计算机安全 | → | 网络安全 |\n\n## 计算机安全:\n\n- 提供自动化信息系统的保护\n- 确保信息系统资源的完整性、有效性和机密性\n\
    - 信息系统资源包括硬件,软件,防火墙,信息和数据库以及通信安全\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_4_0.png)\n\
    \n## 课程目标\n\n- 我们主要讨论密码学理论与实践\n- 在信息传输或存储期间使用的一系列方法\n- 阻止、预防、检测等方法以及纠正信息传输中出现的安全问题的措施等。\n\
    \n![](img/682122af1912e8a90686cd55e4d3ecdb_5_0.png)\n\n## 安全威胁案例\n\n- A向B传送文件，C无权接该文件，但是监听并截获\n\
    - A向B发出命令，C截获并修改后发送给B\n- C假冒A向B发送命令\n- A向B发出命令，事后A否认发出命令\n- A向B发出命令，C截获并延迟发送给B\n\
    \n![](img/682122af1912e8a90686cd55e4d3ecdb_6_0.png)\n\n## 信息安全面临的挑战\n\n1. 满足安全机制非常复杂\n\
    2. 必须考虑潜在的、隐藏的攻击\n3. 特定的处理过程经常违反直觉\n4. 安全机制必须考虑使用场所\n5. 安全机制包括多个算法与协议\n6. 攻击者和设计者、管理者之间的较量\n\
    7. 安全的好处不能直接感受\n8. 需要持续的监视\n9. 经常是设计开始没有考虑\n10. 被看成是使用系统的障碍\n\n## 安全概念及关系\n\n\
    ![](img/682122af1912e8a90686cd55e4d3ecdb_8_0.png)\n\n## 安全概念及关系\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_9_0.png)\n\
    \n图1-2 安全概念及其关系\n\n## 脆弱性与攻击\n\n- 系统资源的脆弱性可能是：\n  - 被破坏（缺乏完整性）\n  - 泄漏（缺乏保密性）\n\
    \  - 不可用（缺乏可用性）\n\n- 攻击是被实施的威胁\n  - 被动的\n  - 主动的\n  - 内部的\n  - 外部的\n\n## 对策\n\n\
    - 用于对付攻击的方法：防止、检测、恢复\n- 可能导致新的弱点\n- 可能残留弱点\n- 目标是最大限度的降低风险\n\n## 威胁后果\n\n> 未授权的泄露\n\
    \  - 暴露, 截获, 推理, 入侵\n> 欺骗\n  - 冒充, 伪造, 抵赖\n> 破坏\n  - 失能, 损坏, 阻碍\n> 篡夺\n  - 盗用,\
    \ 误用\n\n## 计算机与网络安全事故分类\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_13_0.png)\n\
    \n| 分类 | 内容 |\n|---|---|\n| Attackers | Hackers；Spies；Terrorists；Corporate raiders；Professional\
    \ criminals；Vandals；Voyeurs |\n| Tool | Physical attack；Information exchange；User\
    \ command；Script or program；Autonomous agent；Toolkit；Distributed tools；Data tap\
    \ |\n| Vulnerability | Design；Implementation；Configuration |\n| Action | Probe；Scan；Flood；Authenticate；Bypass；Spoof；Read；Copy；Steal；Modify；Delete\
    \ |\n| Target | Account；Process；Data；Component；Computer；Network；Internetwork |\n\
    | Unauthorized result | Increased access；Disclosure of information；Corruption\
    \ of information；Denial of service；Theft of resources |\n| Objectives | Challenge\
    \ status, thrill；Political gain；Financial gain；Damage |\n\n## 计算机与网络安全事故分类\n\n\
    ![](img/682122af1912e8a90686cd55e4d3ecdb_14_0.png)\n\n## 脆弱性报告\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_15_0.png)\n\
    \n## 事件报告\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_16_0.png)\n\n(b) 报告的事件\n\
    \n## 安全发展趋势\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_17_0.png)\n\n## 安全发展趋势\n\
    \n![](img/682122af1912e8a90686cd55e4d3ecdb_18_0.png)\n\n## 计算机安全损失\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_19_0.png)\n\
    \nSource: Computer Security Institute/FBI 2006 Computer Crime and Security Survey\n\
    \n## 计算机安全损失\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_20_0.png)\n\n## 采用的安全技术\n\
    \n![](img/682122af1912e8a90686cd55e4d3ecdb_21_0.png)\n\nSource: Computer Security\
    \ Institute/FBI 2006 Computer Crime and Security Survey\n\n## 采用的安全技术\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_22_0.png)\n\
    \n## OSI 安全框架结构\n\n- ITU-T：X.800 = “OSI安全框架”\n- 定义一种系统化的方法，该方法定义和提供了安全需求，以及对安全产品和政策进行评价和选择。\n\
    - 从理论上说，它为涉及的许多概念提供了一些有用的概貌\n\n## X.800 关注的安全内容\n\n- 安全攻击\n- 安全机制\n- 安全服务\n\n\
    ![](img/682122af1912e8a90686cd55e4d3ecdb_24_0.png)\n\n## 安全攻击\n\n> 采用的任何危及组织信息安全的活动\n\
    > 信息安全是关于怎样去预防攻击、怎样检测针对信息系统的攻击\n> 威胁与攻击细化的概念是不同的\n> 有两种基本的攻击类型\n  - 被动攻击：消息内容的泄露，流量分析（预防）\n\
    \  - 主动攻击：伪装，重放，消息修改，拒绝服务\n\n## 被动攻击\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_26_0.png)\n\
    \nDarth\n\nread contents of message from Bob to Alice\n\nInternet or other comms\
    \ facility\n\nBob\n\nAlice\n\n## 主动攻击\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_27_0.png)\n\
    \nDarth\n\nCapture message from Bob to Alice; later replay message to Alice\n\n\
    Internet or other comms facility\n\nBob\n\nAlice\n\n## 安全服务\n\n> X.800:\n> “它是通信开放系统的协议层提供的服务，确保系统或数据传输的安全”\n\
    \n> RFC 2828:\n> “由系统提供的一种处理或通信服务，以对系统资源提供某种特定的保护”\n"
  mdcn: "\n\n# Information Security Theory and Practice\n\nFeng Tao\n\nSchool of Computer\
    \ and Communication, Lanzhou University of Technology\n\n## Background\n\n➢ The\
    \ first revolution of information security: data processing equipment\n\nAutomated\
    \ tools protect files and other stored information\n\n| Physical mechanisms: loading<br>Management\
    \ mechanisms: inspection | → | Computer security |\n\n➢ The second revolution\
    \ of information security: network and communication infrastructure\n\nNetwork\
    \ security measures protect data\n\n| Computer security | → | Network security\
    \ |\n\n## Computer Security:\n\n- Provide protection for automated information\
    \ systems\n- Ensure the integrity, availability, and confidentiality of information\
    \ system resources\n- Information system resources include hardware, software,\
    \ firewalls, information and databases, and communication security\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_4_0.png)\n\
    \n## Course Objectives\n\n- We mainly discuss cryptography theory and practice\n\
    - A series of methods used during information transmission or storage\n- Measures\
    \ such as blocking, prevention, detection, and correction of security problems\
    \ that occur during information transmission.\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_5_0.png)\n\
    \n## Security Threat Examples\n\n- A sends a file to B; C is not authorized to\
    \ receive the file, but eavesdrops and intercepts it.\n- A sends a command to\
    \ B; C intercepts, modifies it, and then sends it to B.\n- C impersonates A and\
    \ sends a command to B.\n- A sends a command to B, but later A denies having sent\
    \ it.\n- A sends a command to B; C intercepts it and delays sending it to B.\n\
    \n![](img/682122af1912e8a90686cd55e4d3ecdb_6_0.png)\n\n## Challenges Facing Information\
    \ Security\n\n1. Satisfying security mechanisms is very complex.\n2. Potential\
    \ and hidden attacks must be considered.\n3. Specific processes often violate\
    \ intuition.\n4. Security mechanisms must consider the place of use.\n5. Security\
    \ mechanisms include multiple algorithms and protocols.\n6. A contest between\
    \ attackers and designers/managers.\n7. The benefits of security cannot be directly\
    \ perceived.\n8. Continuous monitoring is required.\n9. Often not considered at\
    \ the beginning of design.\n10. Seen as an obstacle to using the system.\n\n##\
    \ Security Concepts and Relationships\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_8_0.png)\n\
    \n## Security Concepts and Relationships\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_9_0.png)\n\
    \nFigure 1-2 Security concepts and their relationships\n\n## Vulnerabilities and\
    \ Attacks\n\n- Vulnerabilities of system resources may be:\n  - Destroyed (lack\
    \ of integrity)\n  - Leaked (lack of confidentiality)\n  - Unavailable (lack of\
    \ availability)\n\n- Attacks are threats that are carried out\n  - Passive\n \
    \ - Active\n  - Internal\n  - External\n\n## Countermeasures\n\n- Methods used\
    \ to deal with attacks: prevention, detection, recovery\n- May lead to new weaknesses\n\
    - May leave residual weaknesses\n- The goal is to minimize risk\n\n## Threat Consequences\n\
    \n> Unauthorized disclosure\n  - Exposure, interception, inference, intrusion\n\
    > Deception\n  - Masquerade, forgery, repudiation\n> Disruption\n  - Incapacitation,\
    \ corruption, obstruction\n> Usurpation\n  - Misappropriation, misuse\n\n## Computer\
    \ and Network Security Incident Classification\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_13_0.png)\n\
    \n| Category | Content |\n|---|---|\n| Attackers | Hackers；Spies；Terrorists；Corporate\
    \ raiders；Professional criminals；Vandals；Voyeurs |\n| Tool | Physical attack；Information\
    \ exchange；User command；Script or program；Autonomous agent；Toolkit；Distributed\
    \ tools；Data tap |\n| Vulnerability | Design；Implementation；Configuration |\n\
    | Action | Probe；Scan；Flood；Authenticate；Bypass；Spoof；Read；Copy；Steal；Modify；Delete\
    \ |\n| Target | Account；Process；Data；Component；Computer；Network；Internetwork |\n\
    | Unauthorized result | Increased access；Disclosure of information；Corruption\
    \ of information；Denial of service；Theft of resources |\n| Objectives | Challenge\
    \ status, thrill；Political gain；Financial gain；Damage |\n\n## Computer and Network\
    \ Security Incident Classification\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_14_0.png)\n\
    \n## Vulnerability Reports\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_15_0.png)\n\
    \n## Incident Reports\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_16_0.png)\n\n\
    (b) Reported incidents\n\n## Security Development Trends\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_17_0.png)\n\
    \n## Security Development Trends\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_18_0.png)\n\
    \n## Computer Security Losses\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_19_0.png)\n\
    \nSource: Computer Security Institute/FBI 2006 Computer Crime and Security Survey\n\
    \n## Computer Security Losses\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_20_0.png)\n\
    \n## Adopted Security Technologies\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_21_0.png)\n\
    \nSource: Computer Security Institute/FBI 2006 Computer Crime and Security Survey\n\
    \n## Adopted Security Technologies\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_22_0.png)\n\
    \n## OSI Security Framework Structure\n\n- ITU-T: X.800 = \"OSI Security Framework\"\
    \n- Defines a systematic approach that defines and provides security requirements,\
    \ as well as the evaluation and selection of security products and policies.\n\
    - Theoretically, it provides a useful overview of many of the concepts involved.\n\
    \n## Security Content Addressed by X.800\n\n- Security attacks\n- Security mechanisms\n\
    - Security services\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_24_0.png)\n\n\
    ## Security Attacks\n\n> Any action that compromises the security of organizational\
    \ information\n> Information security is about how to prevent attacks and how\
    \ to detect attacks against information systems\n> The concepts of threat and\
    \ attack refinement are different\n> There are two basic types of attacks\n  -\
    \ Passive attacks: disclosure of message contents, traffic analysis (prevention)\n\
    \  - Active attacks: masquerade, replay, message modification, denial of service\n\
    \n## Passive Attacks\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_26_0.png)\n\n\
    Darth\n\nread contents of message from Bob to Alice\n\nInternet or other comms\
    \ facility\n\nBob\n\nAlice\n\n## Active Attacks\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_27_0.png)\n\
    \nDarth\n\nCapture message from Bob to Alice; later replay message to Alice\n\n\
    Internet or other comms facility\n\nBob\n\nAlice\n\n## Security Services\n\n>\
    \ X.800:\n> \"It is a service provided by the protocol layer of an open communication\
    \ system to ensure the security of system or data transmission.\"\n\n> RFC 2828:\n\
    > \"A processing or communication service provided by a system to provide a specific\
    \ type of protection for system resources.\"\n\n"
