  - '[PAGE 57]


    # 在密码分析学中的使用


    +   > 关键概念-单表代换密码不改变相关字母的出现频率


    +   > 由阿拉伯科学家在第9世纪发现，要对密文统计出字母的出现频率


    +   > 把出现的频率值与已知字母出现频率值相比较


    +     - 多频的: A-E-I 三元, NO 对, RST 三元


    +     - 低频的: JK, X-Z


    +   > 单表代换密码必须鉴别每一个字母


    +     - 使用共同的双/三字母表的帮助'
  - '[PAGE 58]


    # 密码分析举例


    +   - 给定密文:

    +     UZQSOVUOHXMOPVGPOZPEVSGZWSZOPFPESXUDBMETSXAIZ

    +     VUEPHZHMDZSHZOWSFPAPPDTSVPQUZWYMXUZUHSX

