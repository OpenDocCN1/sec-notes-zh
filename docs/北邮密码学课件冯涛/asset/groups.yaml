    \n有9/11/13轮，每轮中状态经历四个阶：\n\n- 字节代替（每个字节进行一次S盒代替）\n- 行移位（列之间字节置换）\n- 列混合（有限域的矩阵乘法代替，有限域不可约多项式）\n\
