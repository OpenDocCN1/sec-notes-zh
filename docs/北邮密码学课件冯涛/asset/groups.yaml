    # 公钥密码分配密钥


    +   - 使用前面的方法获取公钥,能用来保密或认证

    +   - 公钥算法速度很慢,通常使用 “秘密钥” 加密去保护消息内容

    +   - 因此需要会话密钥,经过协商获得合适的会话密钥'
  - '[PAGE 316]


    # 简单密钥分配


    Merkle 于 1979年提出


    +   - A产生一个新的临时公/私钥对

    +   - A将该公钥和其标识发送给B

    +   - B产生会话密钥K,并用A的公钥加密后发送给A

    +   - A解出 B 的会话密钥并且只有A和B才可以使用该会话密钥


    问题在于,攻击者可以截获消息,并且在协议中模仿通信的一方与另一方通信(中间人攻击？如何做---截获信息)'
  - '[PAGE 317]


    # 公钥密码分配密钥


    如果有安全交换的公钥：


    ![](img/682122af1912e8a90686cd55e4d3ecdb_317_0.png)'
  - '[PAGE 318]


    # 混合密钥分配


    +   > 保留了私钥的KDC

    +   > KDC与每个用户共享一个秘密的主密钥

    +   > 使用主密钥分配会话密钥

    +   > 使用公钥分配主密钥

    +   >   - 当用户分布广泛时尤其有用

    +   > 依据

    +   >   - 性能

    +   >   - 向后兼容性'
  - '[PAGE 319]


    # Diffie-Hellman 密钥交换


    +   > 提出的第 一种公钥机制

    +   > 由Diffie & Hellman 于1976年的公钥概念说明会上提出

    +   >   - 注意,现在已知道, Williamson (UK CESG) 于1970年就已经秘密地提出了这个概念

    +   > 它是一种实用的密钥交换方法

    +   > 许多商业产品都使用了这种密钥交换技术'
  - '[PAGE 320]


    # Diffie-Hellman 密钥交换


    +   > 一种公钥分配方案

    +     - 不能用来交换任何消息

    +     - 它能建立一个共同的密钥

    +     - 只有参与双方知道协商的密钥


    密钥值依赖于参与双方(和他们的私钥和公钥信息)


    +   > 基于有限域(Galois)里的幂运算(模一个素数或一个多项式)

    +     - 容易


    安全性依赖于离散对数计算上的困难问题(类似于因式分解) – 困难'
  - '[PAGE 321]


    # Diffie-Hellman 设置


    +   > 用户协商全局参数:

    +   - 大素整数或多项式 q

    +   - a是模q的素根


    +   > 每个用户(例如A)产生他们各自的密钥

    +   - 选择一个密钥(整数): x_A < q

    +   - 计算他们各自的公钥: y_A = a^xA mod q


    +   > 每个用户公开他们的公钥 y_A'
  - '[PAGE 322]


    # Diffie-Hellman 密钥交换


    +   > 用户A&B共享的会话密钥是K_AB:

    +   > K_AB = a^{x_A·x_B} mod q

    +   > = y_A^{x_B} mod q （由B计算）

    +   > = y_B^{x_A} mod q （由A计算）


    +   > 在Alice和Bob的私钥加密机制中, K_AB 被作为会话密钥使用


    +   > 在选择新的公钥以前,Alice和Bob将一直使用同样的会话密钥进行通信


    +   > 攻击者要得到x,必须得求解离散对数'
  - '[PAGE 323]


    # Diffie-Hellman 举例


    +   > 用户Alice&Bob想要交换密钥:

    +   > 协商素数q=353 以及 a=3

    +   > 选择随机密钥:

    +   > - A选择x_A=97, B选择x_B=233

    +   > 计算各自的公钥:

    +   > - y_A=3^97 mod 353 = 40 (Alice)

    +   > - y_B=3^233 mod 353 = 248 (Bob)

    +   > 计算共享的会话密钥:

    +   > - K_AB= y_B^x_A mod 353 = 248^97 = 160 (Alice)

    +   > - K_AB= y_A^x_B mod 353 = 40^233 = 160 (Bob)'
  - '[PAGE 324]


    # 密钥交换协议


    +   - 在每次用户通信时，他们都可以协商任意的D-H私/公钥对


    +   - 用户能协商产生一个D-H私/公钥对，并存于某个中心目录中，然后使用它们进行协商和安全通信


    +   - 它们都很容易受到中间人攻击


    +   - 需要对密钥进行认证'
  - '[PAGE 325]


    # 总结


    +   - 公钥分配

    +   - 利用公钥密码分配密钥

    +   - Diffie-Hellman密钥交换'
