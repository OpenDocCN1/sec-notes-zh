  - '[PAGE 95]


    # Feistel 密码解密


    加密过程：

    LE₁₆ = RE₁₅

    RE₁₆ = LE₁₅ ⊕ F(RE15, K₁₆)


    解密过程：

    LD₁ = RD₀ = LE₁₆ = RE₁₅

    RD₁ = LD₀ ⊕ F(RD₀, K₁₆)

    = RE₁₆ ⊕ F(RE₁₅, K₁₆)

    = [LE₁₅ ⊕ F(RE₁₅, K₁₆)] ⊕ F(RE₁₅, K₁₆)

    = LE₁₅


    XOR运算：

    [A ⊕ B] ⊕ C = A ⊕ [B ⊕ C]

    D ⊕ D = 0

    E ⊕ 0 = E'
