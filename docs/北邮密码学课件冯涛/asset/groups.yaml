    \n+   ➢ 运算规则：\n+   \n+   - 封闭性：$a、b$ 属于 $S_n$，那么 $a·b$ 属于 $G$，例如 $\\{3,2,1\\}·\\\
    {1,3,2\\}=\\{2,3,1\\}$，置换 $a$ 改变 $b$\n+   - 结合律：$(a·b)·c=a·(b·c)$\n+   - 单位元：$e·e·a=a·e=a$，例如，单位元\
    \ $\\{1,2,...,n\\}$\n+   - 逆元 $a^{-1}$：$a·a^{-1}=e$，例如 $\\{2,3,1\\}\\{3,1,2\\\
    }=\\{1,2,3\\}$\n+   - 当大于2，不是交换群"
  - '[PAGE 129]


    # 循环群


    +   - 重复运用群运算定义为幂运算

    +     - 例如：\(a^3=a\cdot a\cdot a\)


    +   - 单位元是：\(e=a^0\)


    +   - 如果群中的每个元素都是某个固定元素的幂，则该群是循环群

    +     - 例如 \(b=a^k\)，对某个元素 \(a\) 和群中的每个元素 \(b\)


    +   - \(a\) 被称为是群的生成元


    +   - 循环群总是交换群。整数的加法群是无限循环群，生成元是1，幂被解释为加法合成的，\(n\) 是1的 \(n\) 次幂。'
  - '[PAGE 130]


    # 环


    +   - 两个二元运算的集合，{R，+，×}，加法和乘法


    +   - R 对加法构成阿贝尔群，满足五个公理。单位元 0，逆元 a+(-a)=0


    +   - R 对乘法满足：

    +     - 封闭性，a、b 属于 G，那么 a×b 属于 G

    +     - 满足结合律，(a×b)×c = a×(b×c)

    +     - 满足对加法的分配律：

    +       - a×(b+c) = a×b + a×c

    +       - (a+b)×c = a×c + b×c


    +   - 如果乘法运算是可交换的，它构成一个交换环


    +   - 如果乘法有单位元和无零因子，那么构成一个整环

    +     - 单位元为1，无零因子 ab=0，则必有 a=0 或 b=0'
