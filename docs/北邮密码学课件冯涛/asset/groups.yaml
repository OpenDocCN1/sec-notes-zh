  - '[PAGE 25]


    # 安全攻击


    +   > 采用的任何危及组织信息安全的活动

    +   > 信息安全是关于怎样去预防攻击、怎样检测针对信息系统的攻击

    +   > 威胁与攻击细化的概念是不同的

    +   > 有两种基本的攻击类型

    +     - 被动攻击：消息内容的泄露，流量分析（预防）

    +     - 主动攻击：伪装，重放，消息修改，拒绝服务'
