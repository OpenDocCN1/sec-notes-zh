    > 将生成元的指数相加可以实现多项式乘法\n\n## 使用生成元\n\n可以从不可约多项式的根计算生成元。\n\n例如，不可约多项式 x³ + x + 1，GF(2³)\n\
    \n- g³ + g + 1 = 0，{0}\n- g³ = g + 1，{3}\n- g⁴ = g³g = g² + g，{6}\n- g⁵ = g⁴g\
    \ = g² + g + 1，{7}\n- g⁶ = g⁵g = g² + 1，{5}\n- g⁷ = g⁶g = g⁰ = 1，{1}\n- g²，{4}\n\
    - g，{2}\n\n将生成元的指数相加可以实现多项式乘法。\n\n## 总结\n\n- 群、环、域的概念\n- 整数的模运算\n- 求 GCD 的欧几里得算法\n\
