  - '[PAGE 4]


    # 计算机安全:


    +   - 提供自动化信息系统的保护

    +   - 确保信息系统资源的完整性、有效性和机密性

    +   - 信息系统资源包括硬件,软件,防火墙,信息和数据库以及通信安全


    ![](img/682122af1912e8a90686cd55e4d3ecdb_4_0.png)'
  - '[PAGE 5]


    # # 课程目标


    +   - 我们主要讨论密码学理论与实践

    +   - 在信息传输或存储期间使用的一系列方法

    +   - 阻止、预防、检测等方法以及纠正信息传输中出现的安全问题的措施等。


    ![](img/682122af1912e8a90686cd55e4d3ecdb_5_0.png)'
  - '[PAGE 6]


    # 安全威胁案例


    +   - A向B传送文件，C无权接该文件，但是监听并截获

    +   - A向B发出命令，C截获并修改后发送给B

    +   - C假冒A向B发送命令

    +   - A向B发出命令，事后A否认发出命令

    +   - A向B发出命令，C截获并延迟发送给B


    ![](img/682122af1912e8a90686cd55e4d3ecdb_6_0.png)'
  - '[PAGE 7]


    # # 信息安全面临的挑战


    +   1. 满足安全机制非常复杂

    +   2. 必须考虑潜在的、隐藏的攻击

    +   3. 特定的处理过程经常违反直觉

    +   4. 安全机制必须考虑使用场所

    +   5. 安全机制包括多个算法与协议

    +   6. 攻击者和设计者、管理者之间的较量

    +   7. 安全的好处不能直接感受

    +   8. 需要持续的监视

    +   9. 经常是设计开始没有考虑

    +   10. 被看成是使用系统的障碍'
