    \n- 在 GF(2³) 中，(x²+1) 是 101₂，(x²+x+1) 是 111₂\n\n- 加法是\n  - (x²+1) + (x²+x+1) =\
    \ x\n  - 101 ⊕ 111 = 010₂\n\n- 乘法是\n  - (x+1) × (x²+1) = x × (x²+1) + 1 × (x²+1)\
    \ = x³+x+x²+1 = x³+x²+x+1\n  - 011 × 101 = (101)<<1 ⊕ (101)<<0 = 1010 ⊕ 101 =\
    \ 1111₂\n\n- 多项式模约减（获得 q(x) 和 r(x)）\n  - (x³+x²+x+1) mod (x³+x+1) = 1 × (x³+x+1)\
    \ + (x²) = x²\n  - 1111 mod 1011 = 1111 ⊕ 1011 = 0100₂\n\n## 计算上的考虑\n\n- 因为系数是\
