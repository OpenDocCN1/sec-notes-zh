  - '[PAGE 168]


    # 筛选AES算法


    99年8月筛选出的算法：测试和评价


    +   - MARS (IBM) – 复杂、速度快、安全性高

    +   - RC6 (USA) – 简单、速度快、安全性不高

    +   - Rijndael (Belgium) – 清晰,速度快,安全性好

    +   - Serpent (Euro) – 速度慢、清晰、安全性高

    +   - Twofish (USA) – 复杂、速度快、安全性高


    算法之间比较的主要因素


    +   - 少轮复杂计算与多轮简单计算

    +   - 经典密码算法结构与新的密码算法结构'
