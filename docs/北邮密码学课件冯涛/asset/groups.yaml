  - '[PAGE 140]


    # 欧几里得算法


    +   - 求 GCD(a,b) 的一个有效算法

    +   - 使用定理：`GCD(a,b) = GCD(b, a mod b)`


    计算GCD(a,b)的算法是：


    ```

    EUCLID(a,b)

    1. A = a; B = b

    2. if B = 0 return A = gcd(a, b)

    3. R = A mod B

    4. A = B

    5. B = R

    6. goto 2

    ```


    Ai=Bi×Qi+Ri


    ![](img/682122af1912e8a90686cd55e4d3ecdb_140_0.png)'
  - '[PAGE 141]


    # 例求 GCD(1970,1066)


    1970 = 1 x 1066 + 904      gcd(1066, 904)

    1066 = 1 x 904 + 162      gcd(904, 162)

    904 = 5 x 162 + 94      gcd(162, 94)

    162 = 1 x 94 + 68      gcd(94, 68)

    94 = 1 x 68 + 26      gcd(68, 26)

    68 = 2 x 26 + 16      gcd(26, 16)

    26 = 1 x 16 + 10      gcd(16, 10)

    16 = 1 x 10 + 6      gcd(10, 6)

    10 = 1 x 6 + 4      gcd(6, 4)

    6 = 1 x 4 + 2      gcd(4, 2)

    4 = 2 x 2 + 0      gcd(2, 0)'
