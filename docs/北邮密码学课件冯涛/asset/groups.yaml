    \ 分组加密和数据加密标准\n\n- 分组密码是一种加/解密算法，明文分组处理，输出等长密文\n- 采用Feistel费斯特结构，由多个轮函数组成。该结构每一轮对输入数据的一半进行代换，接着用置换来交换数据的两部分，扩展初始密钥使得每轮使用不同的子密钥。\n\
    - DES 扩展了Feistel结构，64位分组，56位密钥\n- 差分分析与线性分析是两种重要的密码分析方法，DES对两类攻击具有免疫性\n\n## 分组密码与流密码比较\n\
    \n- 分组密码用分组的方式处理消息，以分组为单位加密和解密\n\n- 分组大小64位或128位\n\n- 流密码在加密和解密时，每次处理一位或一字节的消息\n\
    \n- 维吉尼亚密码，Vernam密码\n\n- 当前许多密码算法都是分组密码，应用范围广阔\n\n## 理想的分组密码\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_86_0.png)\n\
    \n## 代换密码加/解密码表\n\n表 3.1 图 3.4 所示代换密码的加密与解密表\n\n| 明 文 | 密 文 |\n| --- | --- |\n\
    | 0000 | 1110 |\n| 0001 | 0100 |\n| 0010 | 1101 |\n| 0011 | 0001 |\n| 0100 | 0010\
    \ |\n| 0101 | 1111 |\n| 0110 | 1011 |\n| 0111 | 1000 |\n| 1000 | 0011 |\n| 1001\
    \ | 1010 |\n| 1010 | 0110 |\n| 1011 | 1100 |\n| 1100 | 0101 |\n| 1101 | 1001 |\n\
    | 1110 | 0000 |\n| 1111 | 0111 |\n\n| 密 文 | 明 文 |\n| --- | --- |\n| 0000 | 1110\
    \ |\n| 0001 | 0011 |\n| 0010 | 0100 |\n| 0011 | 1000 |\n| 0100 | 0001 |\n| 0101\
    \ | 1100 |\n| 0110 | 1010 |\n| 0111 | 1111 |\n| 1000 | 0111 |\n| 1001 | 1101 |\n\
    | 1010 | 1001 |\n| 1011 | 0110 |\n| 1100 | 1011 |\n| 1101 | 0010 |\n| 1110 | 0000\
    \ |\n| 1111 | 0101 |\n\n## 分组密码原理\n\n- 对称的分组密码基于Feistel密码结构\n- 可逆变换（非奇异变换）确保唯一对应\n\
    - 原理上分组密码是规模巨大的代换，不实际\n  - n为分组，有2^n个明文信息组，可逆变换，则为2^n!个变换\n  - 对于64位的分组，需要2^64个条目的表\n\
    \  - 密钥的规模为64 × 2^64 = 2^70 = 10^21 bits\n- 理想体制的近似体制，通过小的容易实现的部件上逐步完成，例如密钥长度为2k，小于n。\n\
    - 使用乘积(product)密码的思想，交替使用代换和置换\n\n## Claude Shannon 克劳德·香农 和 代替-置换密码\n\n- Claude\
    \ Shannon，1949年，思想是混淆和扩散\n- 现代分组密码的基础：代换-置换(S-P)网络是混淆和扩散的实际应用\n- S-P网络基于两个简单的密码操作，即\n\
    \  - 代换(S盒)\n  - 置换(P盒)\n- 提供消息和密钥的混乱和扩散\n\n## 混淆和扩散\n\n- 如何防止基于统计方法的密码分析\n- 密码算法需要原始消息统计特征变得完全不明显\n\
    - 一次一密也是如此\n- Shannon建议S&P元素结合获得：\n\n- 扩散-去掉密文上有关明文的统计结构，明文置换+函数\n- 混乱-使得密文和密钥之间的关系尽可能复杂\n\
    \n## Feistel 密码结构\n\n- Horst Feistel 设计了 **feistel 密码**\n  - 基于可求逆的乘积(product)密码思想\n\
    \n- 把输入块分割为两个等份\n  - 要经过多轮相同结构的迭代\n  - 对左半边的数据执行代换操作\n    - 基于右半部分和子密钥的轮函数处理后做异或\n\
    \  - 然后左右部分进行交换，即置换操作\n\n- 实现Shannon的S-P网络思想\n\n## Feistel 密码结构\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_92_0.png)\n\
    \n## Feistel 密码设计元素\n\n- 分组长度：安全性与速度的平衡。64或128位，扩散性\n- 密钥长度：安全性与速度的平衡。抗穷举，混淆性\n\
    - 迭代轮数：16轮，高安全性\n- 子密钥产生算法：密码分析困难\n- 轮函数：抗攻击能力\n- 快速软件加/解密：更多的应用领域\n- 简化分析难度，容易发现缺陷\n\
    \n## Feistel 密码解密\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_94_0.png)\n\n##\
    \ Feistel 密码解密\n\n加密过程：\nLE₁₆ = RE₁₅\nRE₁₆ = LE₁₅ ⊕ F(RE15, K₁₆)\n\n解密过程：\nLD₁\
    \ = RD₀ = LE₁₆ = RE₁₅\nRD₁ = LD₀ ⊕ F(RD₀, K₁₆)\n= RE₁₆ ⊕ F(RE₁₅, K₁₆)\n= [LE₁₅\
    \ ⊕ F(RE₁₅, K₁₆)] ⊕ F(RE₁₅, K₁₆)\n= LE₁₅\n\nXOR运算：\n[A ⊕ B] ⊕ C = A ⊕ [B ⊕ C]\n\
    D ⊕ D = 0\nE ⊕ 0 = E\n\n"
