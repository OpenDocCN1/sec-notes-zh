    \ = 00011100 ⊕ (00011011) = 00000111\n- 01010111 × 00100000 = 00001110\n- 01010111\
    \ × 01000000 = 00011100\n- 01010111 × 10000000 = 00111000\n> 其次 01010111 × 10000011\
    \ =\n- 01010111 ⊕ 0 ⊕ 10101110 ⊕ 00111000 = 11000001\n\n## 使用生成元\n\n> 有限域的等价定义（第\
