    # 工作模式


    # 表 6.1 分组密码的工作模式


    | 模式 | 描述 | 典型应用 |

    |---|---|---|

    | 电码本(ECB) | 用相同的密钥分别对明文组加密 | • 单个数据的安全传输(如一个加密密钥) |

    | 密文分组链接(CBC) | 加密算法的输入是上一个密文组和下一个明文组的异或 | • 普通目的的面向分组的传输

    • 认证 |

    | 密文反馈(CFB) | 一次处理 j 位,上一块密文作为加密算法的输入,用产生一个伪随机数输出与明文异或作为下一块的输入 | • 普通目的的面向分组的传输

    • 认证 |

    | 输出反馈(OFB) | 与 CFB 基本相同,只是加密算法的输入是上一次 DES 的输出 | • 噪声频道上的数据流的传输(如卫星通信) |

    | 计数器(CTR) | 每个明文分组都与一个加密计数器相异或。对每个后续分组计数器递增 | • 普通目的的面向分组的传输

    • 用于高速需求 |'
