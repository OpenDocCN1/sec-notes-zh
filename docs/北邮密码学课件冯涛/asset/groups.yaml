    \ 0 0 0 0 5]\n- 表示有3个数据字节,后面5个字节填充+计数\n- 消息中或许需要一个特殊的完整分组\n- 有其它深奥的模式，这些模式避免了特殊分组的使用\n\
    \n## CBC的优缺点\n\n- 密文分组依赖于前面的所有分组\n- 一个分组的任何变化影响后续的密文分组\n- 需要初始化矢量 (IV)\n- 对发送者和接收者是已知的\n\
    - 如果不加密发送，攻击者可能改变第一分组的前几位，进而获得秘密信息\n- 因此 IV 必须是一个固定值 (如电子转账应用中) 或者必须在发送其它消息之前，用ECB模式加密后发送\n\
    \n## 密文反馈模式（CFB）\n\n- 消息按照流密码（字符序列）处理\n- 分组密码的输出与明文异或\n- 密文的结果反馈为下一阶段的输入\n- 标准允许反馈任意位数（1,\
    \ 8, 64 or 128 etc）\n- 表示成 CFB-1, CFB-8, CFB-64, CFB-128 等\n- 使用分组中的所有位（64 or\
    \ 128）最有效\n```\nC_i = P_i XOR DES_{K}(C_{i-1})\nC_{-1} = IV\n```\n- 用途：流数据加密、认证\n\
    \n## 密文反馈模式 (CFB)\n\n(a) Encryption\n\n(b) Decryption\n\n## CFB的优缺点\n\n- 适用于数据以\
    \ bits/bytes 到达\n- 最常用的序列（流）密码模式\n- 缺点是每n-bits后要做分组加密时需停止\n- 在加解密的两端，分组算法用于其加密模式中出现错误后错误扩散到后续分组\n\
    \n## 输出反馈模式 (OFB)\n\n- 消息按照位序列处理\n- 加密算法的输出被加到消息上\n- 输出被反馈为下一阶段的输入 (因此得名)\n- 反馈机制与明文密文相互独立\n\
    - 能被预处理\n- Cᵢ = Pᵢ XOR Oᵢ\n- Oᵢ = DESₖ₁(Oᵢ₋₁)\n- O₋₁ = IV\n- 用途: 对噪音信道的序列加密\n\n\
    ## 输出反馈模式 (OFB)\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_223_0.png)\n\n## OFB的优缺点\n\
    \n- 位错误不扩散\n- 更易受消息篡改攻击\n- Vernam 密码的一种形式，因此从不重复使用相同的（key+IV）序列\n- 发送者和接收者必须保持同步，前m-bit反馈\n\
    - 研究表明只有完整的分组反馈（例如 CFB-64 和 CFB-128）模式被使用\n\n## 计数器模式 (CTR)\n\n- 尽管类似于OFB，是一种新的反馈模式\n\
    - 加密的是计数值而不是反馈值\n- 对每个明文分组必须有一个不同的密钥和计数值\n- (从不重复使用)\n- Cᵢ = Pᵢ XOR Oᵢ\n- Oᵢ =\
    \ DESₖ₁(i)\n- 用途:高速的网络加密\n\n## CTR优缺点\n\n- 效率\n- 在硬件或软件中能够进行并行加密\n- 预处理\n- 适用于高速链路\n\
    - 能够随机访问加密的数据分组\n- 可证明安全性 (和其它模式一样安全)\n- 但必须确保从不重复使用密钥/计数值,否则可能破译 (如同 OFB)\n\n\
    ## 流（序列）密码\n\n- 逐位处理消息 (一个序列或流)\n- 使用伪随机密钥流\n- 密钥流与明文按位异或\n- 密钥流的随机性完全破坏了消息中的统计属性\n\
    - C₁ = M₁ XOR StreamKey₁\n- 但不能重复使用序列密钥\n- 否则可能恢复消息 (如同密码本)\n\n## 序列密码结构\n\n![](img/682122af1912e8a90686cd55e4d3ecdb_229_0.png)\n\
    \n## RC4\n\n- 由RSA数据安全公司拥有的 一种序列密码\n- 由Ron Rivest等设计的,简单而且有效\n- 可变密钥长度,面向字节操作的序列密码\n\
    - 广泛使用(web SSL/TLS, wireless WEP)\n- 密钥构成所有8-bit值的随机变换\n- 使用该变换搅乱一次处理一个字节的输入信息\n\
    \n## RC4 密钥方案\n\n- 用 0，…，255 初始化一个数组 S\n- 使用密钥去实现混淆\n- S 构成了密码的内部状态\n\n```\nfor\
    \ i = 0 to 255 do\n    S[i] = i\n    T[i] = K[i mod keylen]\n\nj = 0\nfor i =\
    \ 0 to 255 do\n    j = (j + S[i] + T[i]) (mod 256)\n    swap (S[i], S[j])\n```\n\
    \n"
