    )）\n- 这样的 \\(a\\) 是有用的，但找 \\(a\\) 相对困难\n\n## 离散对数\n\n- 一个数的模 \\(p\\) 指数运算的逆是找该数的离散对数\n\
    - 也就是找 \\(x\\) 以使 \\(y = g^x \\pmod p\\)\n- 写成 \\(x = \\log_g y \\pmod p\\) 的形式\n\
    - 如果 \\(g\\) 是本原根，那么 \\(x\\) 总存在；否则 \\(x\\) 或许不存在，如：\n  - \\(x = \\log_3 4 \\\
    bmod 13\\) 没有答案\n  - \\(x = \\log_2 3 \\bmod 13 = 4\\)，通过尝试连续的次方得到\n- 尽管幂运算是相对容易的，但找离散对数一般是困难问题\n\
    \n## 总结\n\n- 素数\n- 费马定理、\\(\\varphi(n)\\)、欧拉定理\n- 素性测试\n- 中国剩余定理\n- 离散对数\n\n##\
    \ 信息安全理论与实践\n\n冯涛\n\n兰州理工大学计算机与通信学院\n\n## 第8章 公钥密码学与RSA\n\n- 非对称密码体制，两个密钥\n- 完成加密和认证\n\
    - 广泛应用的是 RSA，基于寻找大合数的素因子\n\n## 私钥密码学\n\n- 传统的私钥/秘密钥/单密钥密码学使用一个密钥，发送方和接收方共享密钥；如果密钥泄露，那么通信被攻陷\n\
    - 是对称密码体制，参与方是平等的\n- 不能阻止伪造的消息发送给接收方，也不能阻止谎称自己是合法发送方的发送者发送消息\n\n## 公钥密码学\n\n-\
    \ 密码学历史发展历程中最伟大的一次革命\n- 使用两个密钥——一个是公钥，一个是私钥\n- 因为参与方不等价，因此是非对称密码体制\n- 数论概念到函数的灵活应用，补充而不是代替私钥密码学\n\
    \n"
