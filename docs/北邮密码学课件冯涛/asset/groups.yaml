  - '[PAGE 61]


    # Playfair 密钥矩阵


    +   基于密钥词构成的5X5字母矩阵


    +   用关键字字母填充(没有重复字母)


    +   矩阵的其余部分用其他字母填充


    +   例如,使用关键字MONARCHY


    | M | O | N | A | R |

    | C | H | Y | B | D |

    | E | F | G | I/J | K |

    | L | P | Q | S | T |

    | U | V | W | X | Z |'
  - '[PAGE 62]


    # 字母对加密和解密


    +   - 如果有一对字母是相同的,则插入填充字符,如''X''


    +   - 如果两个字母落在了同一行,则把每个字母用右边的字母替换(如果是最右位,则用该行最左边的字母替换)


    +   - 如果两个字母落在同一列,则每个字母用它下面的一个字母替换(如是最下位,则用该列最上面的字母替换)


    +   - 否则,明文字母对中的字母按如下方式代换:该字母所在行为密文所在行,另一字母所在列为密文所在列。(先行后列, HS--BP)'
  - '[PAGE 63]


    # Playfair 密码的安全


    +   > 安全性比单表代换密码更高

    +   > 因为有 26 x 26 = 676种字母对组合

    +   > 需要一张有676个条目的频率表去分析(相对于单表代换密码的26个)

    +   > 相对更多的密文

    +   > 在很多年里被广泛使用

    +   >   - 例如,在一战时期美国&英国军事上的运用

    +   > 只有不多的几百个字母,则是能够破解的

    +   > 因为它依然保留了相当的明文结构信息'
  - '[PAGE 64]


    # 希尔密码(Hill Cipher)


    +   - 希尔密码就是矩阵乘法密码。运用基本矩阵论原理的替换密码。


    +   - 每个字母当作26进制数字：A=0，B=1，C=2……一串字母当成n维向量，跟一个n×n的密钥矩阵相乘，再将得出的结果模26。


    +   - 希尔密码的优点是完全隐藏了字符的频率信息，弱点是容易被已知明文攻击击破。


    ![](img/682122af1912e8a90686cd55e4d3ecdb_64_0.png)'
  - '[PAGE 65]


    # 多表代换密码


    +   > 使用多张密码字母表来改进安全性

    +   > 使用更多的字母表使得通过猜测和对比频率分布的方法进行密码分析变得更加困难

    +   > 通过密钥去选择哪张字母表是对应于消息的每个字母的

    +   > 依次使用每张字母表

    +   > 当密钥选择最后一张字母表后,又重新从第一张表开始选择'
  - '[PAGE 66]


    # Vigenère维吉尼亚密码


    +   - 最简单的多表代换密码

    +   - 有效的多重caesar密码

    +   - 密钥是多字母长度K = k₁, k₂ ... k_d

    +     - 第i个字母使用第i张字母表

    +     - 轮流使用每张字母表

    +   - 消息中，每隔d位字母重复处理一次

    +   - 解密是一个逆过程'
