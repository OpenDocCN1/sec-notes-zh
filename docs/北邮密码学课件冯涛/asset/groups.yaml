    \n## 维吉尼亚密码的攻击\n\n- 首先根据字母频率分析是单表代换还是维吉尼亚密码\n- 如果是维吉尼亚密码，判定密钥词的长度N\n- 根据密钥词长度确定包含的N个单表代换\n\
    \n## 维吉尼亚密码的改进\n\n- 从理想化的角度,希望密钥和消息长度一样\n- 密码自动生成技术\n- 密钥字作为消息的前缀组成密钥\n- 知道密钥字就能恢复前面几位字母\n\
    - 然后使用恢复的字母做后续的密钥字\n- 但是仍然具有频率特征,容易受到攻击\n\n## 一次一密乱码本\n\n- > 如果使用的随机密钥与消息长度一样,则密码是安全的,称为一次一密乱码本\n\
    - > - Gilbert Vernham， Joseph Mauborgne\n- > 它是破解不了的,因为密文与明文不具有统计关系\n- > 因为对所有明文/密文,存在一个密钥把明文映射到密文上，密钥只能使用一次\n\
    - > 在密钥的产生/安全分配上容易出现问题\n\n## 置换密码\n\n- > 通过重新对字母排序来隐藏消息\n- > 不改变实际使用的字母\n- > 由于密文字母和原始明文字母有相同的频率分布，所以比较容易的分析出秘密信息\n"
