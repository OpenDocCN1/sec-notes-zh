  - '[PAGE 210]


    # 工作模式


    +   > 分组密码加密固定的分组长度

    +   >   - 如. DES 加密64-bit的数据分组，密钥长度为56-bit

    +   > 实际中需要加密/解密任意长度数据的方法

    +   > 使用ANSI X3.106-1983 模式 (FIPS 81)定义了4种工作模式

    +   > 为 AES 和 DES扩展为5种模式

    +   > 有分组密码模式和序列密码模式'
