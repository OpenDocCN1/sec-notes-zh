    |---|

    | 由字母表按行循环移位组成的密码代换表。 |'
  - '[PAGE 69]


    # # Vigenère密码的安全


    +   - 每个明文字母对应多个密文字母

    +   - 字母出现的频率信息被隐藏了

    +   - 但也不是完全被隐藏


    ![](img/682122af1912e8a90686cd55e4d3ecdb_69_0.png)'
  - '[PAGE 70]


    # 维吉尼亚密码的攻击


    +   - 首先根据字母频率分析是单表代换还是维吉尼亚密码

    +   - 如果是维吉尼亚密码，判定密钥词的长度N

    +   - 根据密钥词长度确定包含的N个单表代换'
  - '[PAGE 71]


    # 维吉尼亚密码的改进


    +   - 从理想化的角度,希望密钥和消息长度一样

    +   - 密码自动生成技术

    +   - 密钥字作为消息的前缀组成密钥

    +   - 知道密钥字就能恢复前面几位字母

    +   - 然后使用恢复的字母做后续的密钥字

    +   - 但是仍然具有频率特征,容易受到攻击'
  - '[PAGE 72]


    # 一次一密乱码本


    +   > 如果使用的随机密钥与消息长度一样,则密码是安全的,称为一次一密乱码本

    +   > - Gilbert Vernham， Joseph Mauborgne

    +   > 它是破解不了的,因为密文与明文不具有统计关系

    +   > 因为对所有明文/密文,存在一个密钥把明文映射到密文上，密钥只能使用一次

    +   > 在密钥的产生/安全分配上容易出现问题'
  - '[PAGE 73]


    # 置换密码


    +   > 通过重新对字母排序来隐藏消息

    +   > 不改变实际使用的字母

    +   > 由于密文字母和原始明文字母有相同的频率分布，所以比较容易的分析出秘密信息'
