    # 电码本模式 (ECB)


    +   > 消息被分成要加密的独立分组

    +   > 每个分组被替换为一个新值，明文与密文唯一对应，类似密码本，因此得名

    +   > 每个分组独立于其它分组加密

    +   >   C_i = DES_K1 (P_i)

    +   > 用途: 单个数据的安全传输'
