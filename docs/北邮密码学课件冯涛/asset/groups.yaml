    \ GF(2⁸)，模多项式 m(x)=x⁸+ x⁴+ x³+ x+1。\n\n- x⁸ mod m(x) = m(x) - x⁸ = x⁴+ x³+ x+1\n\
    - xⁿ mod p(x) = p(x) − xⁿ\n\n假设 f(x)= b₇x⁷ + b₆x⁶ + ... + b₁x + b₀，那么 x × f(x)=\
    \ ( a₇x⁸ + a₆x⁷ + ... + a₁x ) mod m(x)\n\n- 如果 a₇=0，则 b₆ b₅ b₄ b₃ b₂ b₁ b₀ 0\n\
    - 如果 a₇=1，则 b₆ b₅ b₄ b₃ b₂ b₁ b₀ 0 ⊕ (00011011)\n\n## 示例\n\n> 计算 01010111 × 10000011\
