    +     it was disclosed yesterday that several informal but direct contacts have
    been made with political representatives of the viet cong in moscow'
  - '[PAGE 59]


    # Playfair（普莱费尔）密码


    +   - 单表代换密码不是依靠**长密钥**来提供安全的


    +   - 提高安全性的一个途径是去**加密双字母，多字母表代换密码**


    +   - 其中一个例子是Playfair密码，Playfair将明文中的双字母组合看作一个单元对待，并将这些单元转换为双字母组合。加密后的字符出现的频率在一定程度上被均匀化。


    +   - Wheatstone（惠特斯通）于1854年发明，却以他朋友Playfair的名字命名'
