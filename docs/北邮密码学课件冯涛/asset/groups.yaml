  - '[PAGE 233]


    # RC4 加密


    +   - 连续混淆数组值加密

    +   - 流密钥是从置换中获的混淆对的和

    +   - 为加密和解密消息的后续字节与 S[t] 异或


    ```

    i = j = 0

    for each message byte M_i

    i = (i + 1) (mod 256)

    j = (j + S[i]) (mod 256)

    swap(S[i], S[j])

    t = (S[i] + S[j]) (mod 256)

    K = S[t]


    C_i = M_i XOR S[t]

    ```'
