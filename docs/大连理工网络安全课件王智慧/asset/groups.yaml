    \ requesting connection\n2. Front end buffers packet; asks KDC for session key\n\
    3. KDC distributes session key to both front ends\n4. Buffered packet transmitted\n\
    \nFEP = front end processor  \nKDC = key distribution center\n\n![](img/09e6564ace8d10cc99172928c514fc45_309_0.png)\n\
    \n### Decentralized Key Distribution\n\n- 用户必须信任KDC\n- KDC能解密用户间通信的内容\n- Decentralized\
    \ key distribution\n- 适合于小型网络环境\n\n![](img/09e6564ace8d10cc99172928c514fc45_310_0.png)\n\
    \n## 基于公开密钥体制的对称密钥分发\n\n- 简单的密钥分发 Simple secret key distribution\n- 具有保密和身份认证能力的分发\
    \ Secret key distribution with confidentiality and authentication\n- 混合方案 Hybrid\
    \ scheme\n\n### Simple secret key distribution\n\n- Merkle的建议：[Merkle 79]\n\n\
    ![](img/09e6564ace8d10cc99172928c514fc45_312_0.png)\n\n1. A生成{KUa,KRa}，A→B：(IDa,KUa)\n\
    2. B生成随机密钥Ks，B→A：E_KUa(Ks)\n3. A解密E_KUa(Ks)得到Ks：D_KRa(E_KUa(Ks))\n4. A丢弃{KUa,KRa}，B丢弃KUa\n\
    \n- 通讯前不需存在密钥，通讯后也不存在密钥\n- 能抵抗偷听，不能抵抗主动攻击（中间人攻击）\n\n### Merkle协议的中间人攻击\n\n1. A生成{KUa,KRa},\
    \ A→B: (IDa,KUa)\n2. E截获，生成{KUe,KRe}冒充A→B: (IDa,KUe)\n3. B生成随机密钥Ks, B→A: E_KUe(Ks)\n\
    4. E截获，解密后再用E_KUa加密Ks→A: E_KUa(Ks)\n5. A丢弃{KUa,KRa}, B丢弃KUa\n\n- E获得了Ks，故以后只需进行窃听。\n\
    - A、B并不知晓它们被攻击了\n\n### Secret key distribution with confidentiality and authentication\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_314_0.png)\n\n假定A和B已经获得了双方的公钥：\n\n\
    1. A→B: \\( E_{KUb}(ID_A, N_1) \\)\n2. B→A: \\( E_{KUa}(N_1, N_2) \\)\n3. A→B:\
    \ \\( E_{KUb}(N_2) \\)\n4. A→B: \\( Y = E_{KUb}(E_{KRa}(Ks)) \\)\n5. B解密Y获得会话密钥\
    \ \\( Ks = D_{KUa}(D_{KRb}(Y)) \\)\n\n### Hybrid Scheme\n\n- 在IBM大型主机上使用\n- 仍然使用KDC\n\
    - KDC与每个用户都拥有{公钥,私钥}对\n- KDC与每个用户共享主密钥(对称密钥密码)\n- 会话密钥的分发由主密钥完成\n- 主密钥更新由公钥完成\n\
    \n## 三、公钥分发技术\n\n### 公开发布公钥\n\n- 具体方式：\n  - 通过亲自交换\n  - 通过广播给通信各方\n- 缺点：伪造公钥，并公开发布，在受害者发现有人假冒并通知其他用户之前，假冒者可以读取本该发送给受害者的信息\n\
    \n### 公开可访问的公钥目录\n\n- 管理员建立一个可信的目录，其中每个目录项包括各用户的名称和可信公钥\n- 通信方通过管理员来注册公钥\n- 通信方可以用新的密钥代替当前的密钥\n\
    - 用户直接从目录中获取公钥\n\n缺点：攻击管理员的私钥，或者修改目录内容\n\n### 公钥授权\n\n- 通过在线可信服务器获取指定用户的公钥\n-\
    \ 在线可信服务器对公钥进行签名后再传送\n- 参与方可验证接收到的签名的真实性\n- 缺点：\n  - 可信服务器必须在线\n  - 可信服务器可能会成为瓶颈\n\
    \  - 必须建立预定的通信方与可信服务器的通信链接\n\n### 离线服务器和证书的使用\n\n- 公钥证书\n  - X.509证书\n- PKI\n\
    \  - 一种安全体系和框架\n\n### 公钥证书\n\n- 目的：使一个实体的公钥可用于其他实体，并能验证公钥的真实性和有效性。\n- 是一个由数据部分和签名部分组成的数据结构\n\
    \  - 数据部分：包括明文数据，最少包括一个公钥和一个参与方的标识符\n  - 签名部分：证书颁发机构 CA (Certification Authority)\
    \ 对数据部分的数字签名，以保证公钥的真实性\n- 用户通过公钥证书来互相交换自己的公钥，而无需与公钥管理机构联系\n- 公钥证书能以明文的形式进行存储和分配\n"
