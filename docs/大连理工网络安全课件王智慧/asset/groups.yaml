  - '[PAGE 197]


    # 大素数产生


    +   - 素数生成过程：

    +     ① 随机选择一个奇数 n（如通过伪随机数发生器）

    +     ② 随机选择 a，使 a<n

    +     ③ 进行素性测试（例如用 Miller-Rabin 算法），若 n 没有通过测试，抛弃 n，转到 ①

    +     ④ 如果通过了足够次数的测试，认为 n 是素数。


    +   - 素数理论：在 N 附近，每 ln(N) 个整数中有一个素数'
  - '[PAGE 198]


    # 离散对数:


    离散对数问题可以描述为：给定一个质数p，和有限域Zp上的一个本原元α，对Zp上整数b，寻找唯一的整数c，使得α^c≡b(mod p)。一般的，如果仔细选择p，则认为该问题是难解的，且目前还没有找到计算离散对数问题的多项式时间算法。


    为了抵抗已知的攻击，p至少应该是150位的十进制整数，且p-1至少有一个大的素数因子。'
