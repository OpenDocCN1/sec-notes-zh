    - 产生数字签名比较容易\n- 容易被识别及验证\n- 签名的伪造在计算上是不可行的，无论是从给定的数字签名伪造消息，还是从给定的消息伪造数字签名。\n-\
    \ 可以保存数字签名的副本\n\n## 数字签名的功能特征\n\n- 必须能够验证作者及其签名的日期时间\n- 必须能认证签名时刻的消息内容\n- 签名必须能够由第三方验证，以解决争议\n\
    \n## 数字签名分类\n\n### 签名方式\n\n- 直接数字签名direct digital signature\n- 仲裁数字签名arbitrated\
    \ digital signature\n\n### 安全性\n\n- 无条件安全的数字签名\n- 计算上安全的数字签名\n\n### 可签名次数\n\n\
    - 一次性的数字签名\n- 多次性的数字签名\n\n## 直接数字签名\n\n(1) A→B: \\( E_{KRa}[M] \\)\n提供了鉴别与签名：\n\
    - 只有A具有KRa进行加密；\n- 传输中没有被篡改；\n- 需要某些格式信息/冗余度；\n- 任何第三方可以用KUa 验证签名\n\n(1’) A→B:\
    \ \\( E_{KUb}[E_{KRa}(M)] \\)\n提供了保密(KUb)、鉴别与签名(KRa)\n\n(2) A→B: M||E<sub>KRa</sub>[H(M)]\n\
    \n提供鉴别及数字签名\n-- H(M) 受到密码算法的保护；\n-- 只有 A 能够生成 E<sub>KRa</sub>[H(M)]\n\n(2’) A→B:\
    \ E<sub>K</sub>[M||E<sub>KRa</sub>[H(M)]]\n\n提供保密性、鉴别和数字签名。\n\n## 直接数字签名的缺点\n\n\
    - 验证模式依赖于发送方的保密密钥\n  - 发送方要抵赖发送某一消息时，可能会声称其私有密钥丢失或被窃，从而他人伪造了他的签名\n  - 通常需要采用与私有密钥安全性相关的行政管理控制手段来制止或至少是削弱这种情况，但威胁在某种程度上依然存在\n\
    \  - 改进的方式例如可以要求被签名的信息包含一个时间戳（日期与时间），并要求将已暴露的密钥报告给一个授权中心\n  - X的某些私有密钥确实在时间T被窃取，敌方可以伪造X的签名并加盖一个早于或等于时间T的时间戳\n\
    \n## 数字签名算法\n\n- 普通数字签名算法\n  - RSA\n  - ElGamal\n  - Schnorr\n  - DSS/DSA\n- 不可否认的数字签名算法\n\
    - 群签名算法\n- 盲签名算法\n\n# 签名与加密\n\n- 签名提供真实性(authentication)\n- 加密提供保密性(confidentiality)\n\
    - “签名+加密”提供“真实性+保密性”\n- 两种实现方式：(A➜B)\n  ① 先签名，后加密：`E_Kub{M||Sig_A(M)}`\n  ② 先加密，后签名：`{E_Kub(M)||Sig_A(E_Kub(M))}`\n\
    - 方式②的问题：\n  - 发生争议时，B需要向仲裁者提供自己的私钥\n  - 安全漏洞：攻击者E截获消息，把 `Sig_A(E_Kub(M))` 换成\
    \ `Sig_E(E_Kub(M))`，让B以为该消息来自E\n  - 保存信息多：除了 `M,Sig_A(E_Kub(M))`，还要保存 `E_Kub(M)`（`KUb`\
    \ 可能过期）\n\n## ElGamal签名方案\n\n### 签名方案\n\n- 公钥：p: 素数，g<p，g是p的原根，y=g^x (mod p)\n\
    - 私钥：x<p-1\n- 签名：k: 随机选取，k属于[1,p-1] 且k与p-1互素，\n  a（签名）=g^k mod p\n  b（签名）满足 M=(xa+kb)\
    \ mod (p-1)\n  （即有：b=(M-xa)k^-1 mod (p-1)）\n- 验证：如果 y^a a^b (mod p)=g^M (mod p)，则签名有效\n\
    \  （原根的性质，F格式定理）\n\n# 例子\n\n- p=19\n- g=10\n- x=16\n- k=5\n- M=14\n\na=?\nb=?\n\
    \n验证v1=?  v2=?\n\n# 课堂练习\n\n- p=19\n- g=3\n- x=13\n- k=7\n- M=14\n\na=?\nb=?\n\
    \n验证v1=? v2=?\n\n# DSS数字签名\n\n- 是由美国国家标准化研究院和国家安全局共同开发的。由于它是由美国政府颁布实施的，主要用于与美国政府做生意的公司，其他公司则较少使用，它只是一个签名系统，而且美国政府不提倡使用任何削弱政府窃听能力的加密软件，认为这才符合美国的国家利益。\n\
    - 公布于1994年5月19日的联邦记录上，并于1994年12月1日采纳为标准DSS。DSS为ElGamal签名方案的改进。\n\nDSS (Digital\
    \ Signature Standard)\n\n# DSS签名和验证\n\n![](img/09e6564ace8d10cc99172928c514fc45_297_0.png)\n\
