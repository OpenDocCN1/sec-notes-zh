    +   DES的破译'
  - '[PAGE 102]


    <!-- no content -->'
  - '[PAGE 103]


    # # S-盒的构造要求


    +   - S-盒是许多密码算法的唯一非线性部件,因此,它的密码强度决定了整个算法的安全强度


    +   - 提供了密码算法所必须的混乱作用


    +   - 如何全面准确地度量S-盒的密码强度和设计有效的S-盒是分组密码设计和分析中的难题


    +   - 非线性度、差分均匀性、严格雪崩准则、可逆性、没有陷门


    +   - 陷门是在某个系统或某个文件中设置的"机关"，使得在提供特定的输入数据时，允许违反安全策略。例如，一个登录处理子系统允许处理一个特定的用户识别码，以绕过通常的口令检查。'
  - '[PAGE 104]


    # # DES密钥长度


    +   关于DES算法的另一个最有争议的问题就是担心实际56比特的密钥长度不足以抵御穷举式攻击，因为密钥量只有 \( 2^{56} \approx 10^{17}
    \) 个


    +   早在1977年，Diffie和Hellman已建议制造一个每秒能测试100万个密钥的VLSI芯片。每秒测试100万个密钥的机器大约需要一天就可以搜索整个密钥空间。他们估计制造这样的机器大约需要2000万美元（昂贵）；所以，当时DES被认为是一种十分强壮的加密方法。'
  - '[PAGE 105]


    # DES密钥长度


    +   - 在CRYPTO’93上，Session和Wiener给出了一个非常详细的密钥搜索机器的设计方案，这个机器基于并行运算的密钥搜索芯片，所以16次加密能同时完成。花费10万美元，平均用1.5天左右就可找到DES密钥

    +   - 美国克罗拉多州的程序员Verser从1997年2月18日起，用了96天时间，在Internet上数万名志愿者的协同工作下，成功地找到了DES的密钥，赢得了悬赏的1万美元'
  - '[PAGE 106]


    # # DES密钥长度


    +   - 1998年7月电子前沿基金会（EFF）使用一台25万美圆的电脑在56小时内破译了56比特密钥的DES


    +   - 1999年1月RSA数据安全会议期间，电子前沿基金会用22小时15分钟就宣告破解了一个DES的密钥


    +   - 所以现在再对要求“强壮”加密的场合已经不再适用了。'
  - '[PAGE 107]


    # # 破译DES


    +   1990年，以色列密码学家Eli Biham和Adi Shamir提出了差分密码分析法，可对DES进行选择明文攻击


    +   线性密码分析比差分密码分析更有效，为了分析DES而提出来的。分析线性部件，容易；非线性部件才是密码分析的主要障碍，因此差分分析和线性分析，集中在非线性部件S盒。'
  - '[PAGE 108]


    # 数学基础'
  - '[PAGE 109]


    # # 整除性


    **定义（整除、倍数、因数）** 设a，b为整数，若存在整数c，使b=ac，则称a可整除b，记作a|b。b叫做a的倍数，a叫做b的因数。若不存在这样的整数c，则称a不能整除b，记作a
    ∤ b。


    * 如果b|g，b|h,对于任何整数m和n，则满足b|(mg+nh)。'
  - '[PAGE 110]


    # # 互素


    +   - 定义：


    素数：又叫质数，除了1和本身，不能被其他数整除的数


    公因子：a, b 为整数，整除a的数组成组成集合A，整除b的数组成集合B，C=A∩B，C中的元素称为a和b的公因子。


    (a, b) 表示a和b的最大公因子(gcd, Great Common Divisor)， (a, b) =1表示a与b互素


    eg GCD(8,15) = 1'
