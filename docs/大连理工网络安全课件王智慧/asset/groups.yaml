    # # 同余（Congruence）的数学定义及性质


    +   - Def : Let \( m \in \mathbb{Z}^+ \) and \( a, b \in \mathbb{Z} \), we say
    \( a \) is congruence to \( b \) modulo \( m \) if \( (a-b)=km, k \in \mathbb{Z}
    \), or \( m|(a-b) \), then \( a \equiv b \, (\text{mod } m) \).


    +   - Thm: If \( a, b \in \mathbb{Z} \), then \( a \equiv b \, (\text{mod } m)
    \) iff \( \exists k \in \mathbb{Z} \, \text{s.t.} \, a=b+km \).


    +   - Thm :Properties :

    +     Let \( m \in \mathbb{Z}^+ \) and \( a, b, c \in \mathbb{Z} \), then

    +     (i) \( a \equiv a \, (\text{mod } m) \) [ reflexive ]

    +     (ii) If \( a \equiv b \, (\text{mod } m) \), then \( b \equiv a \, (\text{mod
    } m) \) [symmetric]

    +     (iii) If \( a \equiv b \, (\text{mod } m) \) and \( b \equiv c \, (\text{mod
    } m) \), then \( a \equiv c \, (\text{mod } m) \) [Transitive]'
