    \n## 散列函数的要求\n\n- H 能用于任意大小的分组\n- H 能产生定长的输出\n- 对任何给定的 x，H(x) 要相对易于计算，使得硬件和软件实现成为实际可能\n\
    - 对任何给定的码 h，寻找 x 使得 H(x)=h 在计算上是不可行的，即单向性\n- 对任何给定的分组 x，寻找不等于 x 的 y，使得 H(x)=H(y)\
    \ 在计算上是不可行的，即弱抗冲突性\n- 寻找对任何的 (x,y) 对使得 H(x)=H(y) 在计算上是不可行的，即强抗冲突性\n\n## Hash function\
    \ 的攻击方法-生日攻击\n\n### 题目描述\n\n- 密码学中有种很有意思的攻击方式叫做生日攻击。其原理是基于这样一个神奇的结论：如果一个房间里有 23\
    \ 个人，那么其中两个人生日相同的概率超过 50%，当人数上升到 40 人时，这一概率提高到了 89% 以上。注意生日相同指的是两个人的出生月份和日期相同，不考虑年份。这个结论听上去很神奇，因为一年有\
    \ 365 天，但是，事实上你可以通过概率知识验证这个结论。\n\n## 使用散列函数的数字签名算法\n\n- 数字签名算法为公钥密码学算法，计算复杂度很大。\n\
    \  如果直接对消息进行运算，计算开销太大，因此先对消息进行散列运算，计算出定长的比较短的哈希值。这样再继续数字签名，节省计算开销。\n\n## Hash\
    \ vs MAC\n\n- MAC 需要对全部数据进行加密\n- MAC 速度慢\n- Hash 是一种直接产生鉴别码的方法\n\n## 常用 Hash 算法\n\
    \n- SHA-1\n- MD5\n- RIPEMD-160\n- HMAC\n\n## MD5\n\nMD5 即 Message-Digest Algorithm\
    \ 5，用于确保信息传输完整一致。\n是计算机广泛使用的散列算法之一（又译摘要算法、哈希算法），主流编程语言普遍已有 MD5 实现。\n\n将数据（如汉字）运算为另一固定长度值，是散列算法的基础原理，\n\
    MD5 的前身有 MD2、MD3 和 MD4。\n\nMD5 一度被广泛应用于安全领域。但是由于 MD5 的弱点被不断发现以及计算机能力不断的提升，现在已经可以构造两个具有相同\
    \ MD5 的信息，使本算法不再适合当前的安全环境。目前，MD5 计算广泛应用于错误检查。例如在一些 BitTorrent 下载中，软件通过计算 MD5 和检验下载到的碎片的完整性。\n\
    \n## MD5 算法描述 - step 1\n\n在 MD5 算法中，首先需要对信息进行填充，使其字节长度对 512 求余的结果等于 448。因此，信息的字节长度（Bits\
    \ Length）将被扩展至 N*512+448，即 N*64+56 个字节（Bytes），N 为一个正整数。填充的方法如下，在信息的后面填充一个 1 和无数个\
    \ 0，直到满足上面的条件时才停止用 0 对信息的填充。然后，在这个结果后面附加一个以 64 位二进制表示的填充前信息长度。经过这两步的处理，现在的信息字节长度=N*512+448+64=(N+1)*512，即长度恰好是\
    \ 512 的整数倍。这样做的原因是为满足后面处理中对信息长度的要求。\n\n## Padding of Message Digest\n\n![](img/09e6564ace8d10cc99172928c514fc45_274_0.png)\n\
    \nAny length message 1-512 bits Padding 64 bits length\n\nTotal length : multiiple\
    \ of 512 bits\n\n## MD5 描述一 step 2\n\n- 初始化 MD 缓存\n\n- MD 为 128bit，用于存放散列函数的中间及最终结果\n\
    \n- MD 可表示为 4 个 32bit 的寄存器(A,B,C,D)，初始化如下\n\nA = 01 23 45 67 (0x67452301)\nB =\
    \ 89 AB CD EF (0xEFCDAB89)\nC = FE DC BA 98 (0x98BADCFE)\nD = 76 54 32 10 (0x10325476)\n\
    \n## One way hash of MD5\n\n![](img/09e6564ace8d10cc99172928c514fc45_276_0.png)\n\
    \n$H_{i-1}$ (128 bits)\n\n$M_i$ (512 bits)\n\nRound 1 $FF\\times16$\n\nRound 2\
    \ $GG\\times16$\n\nRound 3 $HH\\times16$\n\nRound 4 $II\\times16$\n\n$H_i$ (128\
    \ bits)\n\n"
