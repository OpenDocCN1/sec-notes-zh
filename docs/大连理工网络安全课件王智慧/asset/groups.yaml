    # Simple secret key distribution


    • Merkle的建议：[Merkle 79]


    ![](img/09e6564ace8d10cc99172928c514fc45_312_0.png)


    +   ❶ A生成{KUₐ,KRₐ}，A→B：(IDₐ,KUₐ)

    +   ❷ B生成随机密钥Kₛ，B→A：E_KUₐ(Kₛ)

    +   ❸ A解密E_KUₐ(Kₛ)得到Kₛ：D_KRₐ(E_KUₐ(Kₛ))

    +   ❹ A丢弃{KUₐ,KRₐ}，B丢弃KUₐ


    +   • 通讯前不需存在密钥，通讯后也不存在密钥

    +   • 能抵抗偷听，不能抵抗主动攻击（中间人攻击）'
  - '[PAGE 313]


    # # Merkle协议的中间人攻击


    ①A生成{KUa,KRa}, A→B: (ID<sub>A</sub>,KUa)


    ②E截获,生成{KUe,KRe}冒充A→B: (ID<sub>A</sub>,KUe)


    ③B生成随机密钥Ks, B→A: E<sub>KUe</sub>(Ks)


    ④E截获,解密后再用E<sub>KUa</sub>加密Ks→A: E<sub>KUa</sub>(Ks)


    ⑤A丢弃{KUa,KRa},B丢弃KUa


    ·E获得了Ks,故以后只需进行窃听.


    ·A,B并不知晓它们被攻击了'
