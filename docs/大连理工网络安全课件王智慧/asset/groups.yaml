  - '[PAGE 270]


    # # MD5


    +   MD5即Message-Digest Algorithm 5，用于确保信息传输完整一致。

    +   是计算机广泛使用的散列算法之一（又译摘要算法、哈希算法），主

    +   流编程语言普遍已有MD5实现。


    +   将数据（如汉字）运算为另一固定长度值，是散列算法的基础原理，

    +   MD5的前身有MD2、MD3和MD4。


    +   MD5一度被广泛应用于安全领域。但是由于MD5的弱点被不断发现以

    +   及计算机能力不断的提升，现在已经可以构造两个具有相同MD5的信

    +   息，使本算法不再适合当前的安全环境。目前，MD5计算广泛应用于

    +   错误检查。例如在一些BitTorrent下载中，软件通过计算MD5和检验

    +   下载到的碎片的完整性。'
