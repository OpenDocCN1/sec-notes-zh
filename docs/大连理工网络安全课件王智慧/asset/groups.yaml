    # # Vernam密码


    +   1918年，Gillbert Vernam建议密钥与明文一样长并且没有统计关系的密钥内容，他采用的是二进制数据：

    +   加密：\( C_i = P_i \oplus K_i \)

    +   解密：\( P_i = C_i \oplus K_i \)


    核心：构造和消息一样长的随机密钥'
