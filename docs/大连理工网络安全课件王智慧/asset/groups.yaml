    ### 4. 密钥恢复服务器


    在任何可操作的PKI环境中，在密钥或证书在生命周期内都会有部分用户可能会丢失他们的私钥。CA必须撤销相应的公钥证书。或生成新的密钥对产生相应的公钥证书。结果，在此事件之前的所有加密数据都是不可恢复的。都会对PKI的实体造成沉重的负担。


    解决办法是提供一个密钥备份和恢复服务器。其目的是为CA提供在创建私钥时备份私钥和在以后恢复私钥的一种简单方式。


    ![](img/09e6564ace8d10cc99172928c514fc45_359_0.png)


    ### 5. 管理协议


    有助于一个PKI内的最终用户之间的在线通信和管理。管理协议应该支持下列功能：


    - 注册：用户首次将自己告知CA的过程。

    - 初始化：在最终用户系统安全运转前，安装那些与存储在基础设施的其他地方的密钥有适当关系的密钥信息。

    - 认证：CA为用户的公钥颁发证书的过程，将证书返回给最终用户系统或将证书公布在证书库中。

    - 密钥恢复：最终用户客户端的密钥信息可以通过CA或者密钥备份系统来备份。

    - 密钥更新：所有的密钥对必须定期更新。在这个过程中，将替换密钥对同时并颁发新的证书。

    - 撤销：当一个授权用户通知CA出现了一个需要撤销证书的异常情形时才激活该过程。

    - 交叉认证：两个CA交换用于建立一个交叉证书的信息。一个交叉证书是一个CA颁发给另一个CA的证书，该证书中含有用于颁发证书的CA签名密钥。


    在线协议并不是惟一实现这些功能的方式，也可以使用脱机方式。


    ### 6. 操作协议（Operational Protocol）


    操作协议是允许在目录、最终用户和可信主体之间传输证书和撤销的状态信息的协议。X.509标准规定了如何构建传输的数据。下面的协议是常用的协议：HTTP、FTP、e-mail和LDAP。各种PKI构成部分之间交互作用的方式如图所示。


