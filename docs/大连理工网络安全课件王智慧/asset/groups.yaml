  - '[PAGE 233]


    # # RSA的速度


    +   - 由于进行的都是大数计算，使得RSA最快的情况也比DES慢上100倍，无论是软件还是硬件实现。

    +   - 速度一直是RSA的缺陷。一般来说只用于少量数据加密。


    # # RSA的缺点


    +   - A)产生密钥很麻烦，受到素数产生技术的限制，因而难以做到一次一密。

    +   - B)分组长度太大。

    +   - C)为保证安全性，n 至少也要 600 bits以上，使运算代价很高，尤其是速度较慢，较对称密码算法慢几个数量级；且随着大数分解技术的发展，这个长度还在增加，不利于数据格式的标准化。

    +   - D)目前，SET(Secure Electronic Transaction)协议中要求CA采用2048比特长的密钥，其他实体使用1024比特时的密钥。

    +   -'
  - '[PAGE 234]


    # RSA算法应用


    +   - RSA为公用网络上信息的加密和鉴别提供了一种基本的方法。它通常是先生成一对RSA密钥，其中之一是保密密钥，由用户保存；另一个为公开密钥，可对外公开，甚至可在网络服务器中注册，人们用公钥加密文件发送给个人，个人就可以用私钥解密接受。为提高保密强度，RSA密钥至少为500位长，一般推荐使用1024位。


    +   - RSA系统是公钥系统的最具有典型意义的方法，大多数使用公钥密码进行加密和数字签名的产品和标准使用的都是RSA算法


    +   - 单钥密码加密速度快，人们用它来加密较长的文件，然后用RSA来给文件密钥加密，极好的解决了单钥密码的密钥分发问题。'
  - '[PAGE 235]


    # Hash函数及消息认证码'
  - '[PAGE 236]


    # # 网络通信的攻击威胁


    +   - 被动攻击：对传输进行窃听和监测，通信和信息不受影响，用户感觉不到攻击存在，攻击通常是窃听或流量分析，判断通信性质。

    +   - 主动攻击：攻击者破坏通信过程，拦截、修改、伪造、丢弃信息、拒绝服务或假冒合法用户。'
  - '[PAGE 237]


    # # 信息安全的需求


    +   - 保密性（Confidentiality）

    +   - 完整性（Integrity）

    +     - 数据完整性，未被未授权篡改或者损坏

    +     - 系统完整性，系统未被非授权操纵，按既定的功能运行

    +   - 鉴别（Authenticity）

    +     - 实体身份的鉴别，适用于用户、进程、系统、信息等

    +   - 不可否认性（Non-repudiation）

    +     - 防止源点或终点的抵赖

    +   - ......'
  - '[PAGE 238]


    # # 定义


    +   - 消息鉴别（Message Authentication，也叫信息完整性鉴别）：

    +     是一个证实收到的消息来自可信的源点且未被篡改的过程，也就是既包含信息来源的完整性鉴别又包含信息内容的完整性鉴别。


    +   - 散列函数（Hash Functions）：

    +     一个散列函数以一个变长的报文作为输入，并产生一个定长的散列码，有时也称报文摘要，作为输出。'
  - '[PAGE 239]


    # # 鉴别的结构


    任何消息认证或数字签名机制可以看到两个层次：


    +   - 底层必须有某种函数产生一个认证标识：一个用于认证一个报文的值


    +   - 高层认证协议以底层函数为原语，使接收者完成报文的鉴别'
  - "[PAGE 240]\n\n# # 鉴别的目的\n\n+   - 信源识别：验证信息的发送者是真正的，而不是冒充的  \n+     - 一数字签名\n\n\
    +   - 验证信息的完整性，在传送或存储过程中未被篡改，重放或延迟等  \n+     - 一消息认证码，消息加密"
  - '[PAGE 241]


