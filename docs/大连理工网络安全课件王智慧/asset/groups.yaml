    # # ElGamal签名方案


    # ## 签名方案


    +   * 公钥：p: 素数，g<p，g是p的原根，y=g^x (mod p)

    +   * 私钥：x<p-1

    +   * 签名：k: 随机选取，k属于[1,p-1] 且k与p-1互素，

    +     a（签名）=g^k mod p

    +     b（签名）满足 M=(xa+kb) mod (p-1)

    +     （即有：b=(M-xa)k^-1 mod (p-1)）

    +   * 验证：如果 y^a a^b (mod p)=g^M (mod p)，则签名有效

    +     （原根的性质，F格式定理）'
