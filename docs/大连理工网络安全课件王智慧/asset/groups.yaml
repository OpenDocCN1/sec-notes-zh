  md: "\n## Chinese Remainder Theorem（中国剩余定理）\n\n- 韩信点兵问题：「今有物不知其数，三三数之剩二，五五数之剩三，七七数之剩二，问物几何？」～（孙武\
    \ 孙子算经）\n\n也就是求正整数 x，使得\n\nx ≡ 2 （mod 3）\n\nx ≡ 3 （mod 5）\n\nx ≡ 2 （mod 7）\n\n\
    两个问题：\n(1) x是否存在？\n(2) 如何求x？\n\n- **回答（1）：中国剩余定理**\n\n令 $n_1,n_2,\\cdots,n_t$\
    \ 为两两互素的正整数，\n\n令 $N=n_1n_2\\cdots n_t$\n\n则以下同余系统中，$x\\equiv a_1\\pmod{n_1}$，$x\\\
    equiv a_2\\pmod{n_2}$，$\\cdots$，$x\\equiv a_t\\pmod{n_t}$，$x$ 会在 $[0,N-1]$ 中有唯一解。\n\
    \n证明：\n\n由于 $n_1,n_2,\\cdots,n_t$ 为两两互素的正整数，故对所有 $i=1,2,\\cdots,t$，$(n_i,N/n_i)=1$。因此，存在\
    \ $y_i$，使得 $(N/n_i)y_i\\equiv1\\pmod{n_i}$。\n\n若我们令\n\n$$x=\\left(\\frac{N}{n_1}\\\
    right)y_1a_1+\\left(\\frac{N}{n_2}\\right)y_2a_2+\\cdots+\\left(\\frac{N}{n_t}\\\
    right)y_ta_t\\pmod N$$\n\n则 $x$ 是上述同余系统的解，因为对于所有 $i$，$1\\leq i\\leq t$，\n\n$$x\\\
    pmod{n_i}=\\left(\\frac{N}{n_i}\\right)y_i a_i\\pmod{n_i}=a_i$$\n\n- 回答(2)：\n\
    - N=3*5*7=105，\n- N/n₁=105/3=35，\n- N/n₂=105/5=21\n- N/n₃=105/7=15\n- 35y₁=1mod3\
    \ y₁=2\n- 21y₂=1mod5 y₂=1\n- 15y₃=1mod7 y₃=1\n- x=35*2*2+21*1*3+15*1*2=23 mod\
    \ 105\n\n「三人同行七十稀\n五樹梅花廿一枝\n七子團圓正半月\n除百零五便得知。」\n\n～ (程大位 算法統宗(1593))\n\n- Ex :\
    \ Use CRT to solve the system\n  - x = 1 mod 3\n  - x = 2 mod 5\n  - x = 3 mod\
    \ 7\n\n## 大素数产生\n\n- 素数生成过程：\n  - ① 随机选择一个奇数 n（如通过伪随机数发生器）\n  - ② 随机选择 a，使 a<n\n\
    \  - ③ 进行素性测试（例如用 Miller-Rabin 算法），若 n 没有通过测试，抛弃 n，转到 ①\n  - ④ 如果通过了足够次数的测试，认为\
    \ n 是素数。\n\n- 素数理论：在 N 附近，每 ln(N) 个整数中有一个素数\n\n## 离散对数:\n\n离散对数问题可以描述为：给定一个质数p，和有限域Zp上的一个本原元α，对Zp上的整数b，寻找唯一的整数c，使得α^c≡b(mod\
    \ p)。一般的，如果仔细选择p，则认为该问题是难解的，且目前还没有找到计算离散对数问题的多项式时间算法。\n\n为了抵抗已知的攻击，p至少应该是150位的十进制整数，且p-1至少有一个大的素数因子。\n\
    \n## 公钥密码\n\n### 问题的提出\n\n#### （1）密钥管理量的困难\n\n传统密钥管理：两两分别用一对密钥时，则n个用户需要C(n,2)=n(n-1)/2个密钥，当用户量增大时，密钥空间急剧增大。如：\n\
    \nn=100 时， C(100,2)=4,950\n\nn=5000时， C(5000,2)=12,497,500\n\n#### （2）数字签名的问题\n\
    \n传统加密算法无法实现抗抵赖的需求。\n\n#### （3）密钥必须经过安全的信道分配\n\n从最初一直到现代，几乎所有密码系统都建立在基本的替代和置换工具的基础上。在用了数千年的本质上可以手算完成的算法之后，常规的密码学随着转轮加密/解密机的发展才出现了一个重大进步。机电式变码旋转机使得极其复杂的密码系统被研制出来。有了计算机后，更加复杂的系统被设计出来。但是不管是转轮机还是后来的\
    \ DES（数据加密标准），虽然代表了重要的进展，却仍然依赖于替代和置换这样的基本工具。\n\n## 密码学历史上唯一的一次真正的革命\n\n### 公钥密码的应用\n\
    \n- 加密/解密\n- 数字签名\n- 密钥交换\n\n## 公钥密码系统的加密原理\n\n- 每个通信实体有一对密钥（公钥，私钥）。公钥公开，用于加密和验证签名，私钥保密，用作解密和签名\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_204_0.png)\n\n任何人向B发送信息都可以使用同一个密钥（B的公钥）加密，没有其他人可以得到B的私钥，所以只有B可以解密\n\
    \n## 公钥密码体制的加密功能\n\n- A向B发消息X，\n- B的公钥为KUb，私钥为KRb\n- 加密 Y = E<sub>KUb</sub>(X)\n\
    - 解密 X = D<sub>KRb</sub>(Y)\n\n### 公钥密码体制的加密\n\n![](img/09e6564ace8d10cc99172928c514fc45_206_0.png)\n\
    \nFigure 9.2 Public-Key Cryptosystem: Secrecy\n\n### 公钥密码体制的认证\n\n- A向B发送消息X\n\
    - A的公钥为KUa，私钥为KRa\n- “加密”： Y = E<sub>KRa</sub>(X) （数字签名）\n- “解密”： X = D<sub>KUa</sub>(Y)\n\
    - 注意： 不能保证消息的保密性\n\n### 公钥密码体制的认证\n\n![](img/09e6564ace8d10cc99172928c514fc45_209_0.png)\n\
    \nFigure 9.3 Public-Key Cryptosystem: Authentication\n\n## 具有保密与认证的公钥体制\n\n![](img/09e6564ace8d10cc99172928c514fc45_210_0.png)\n\
    \n### 鉴别+保密\n\n\\( A \\rightarrow B : Z = E_{KU_b} (E_{KR_a} (X)) \\)\n\n\\( B\
    \ : E_{KU_a} (E_{KR_b} (Z)) = X \\)\n\n## 对称密码\n\n## 公钥密码\n\n| 对称密码 | 公钥密码 |\n\
    |---|---|\n| 一般要求：<br>1、加密解密用相同的密钥<br>2、收发双方必须共享密钥<br><br>安全性要求：<br>1、密钥必须保密<br>2、没有密钥，解密不可行<br>3、知道算法和若干密文不足以确定密钥\
    \ | 一般要求：<br>1、加密解密算法相同，但使用不同的密钥<br>2、发送方拥有加密或解密密钥，而接收方拥有另一个密钥<br><br>安全性要求：<br>1、两个密钥之一必须保密<br>2、无解密密钥，解密不可行<br>3、知道算法和其中一个密钥以及若干密文不能确定另一个密钥\
    \ |\n\n## 对公钥密码算法的误解\n\n- 公开密钥算法比对称密钥密码算法更安全？\n  - 任何一种算法都依赖于密钥长度、破译密码的工作量，从抗分析角度，没有一方更优越\n\
    \n- 公开密钥算法使对称密钥成为过时了的技术？\n  - 公开密钥很慢，只能用在密钥管理和数字签名，对称密钥密码算法将长期存在\n\n- 使用公开密钥加密，密钥分配变得非常简单？\n\
    \  - 事实上的密钥分配既不简单，也不有效\n\n### 5.1.3 公钥密码的要求\n\n- 涉及到各方：发送方、接收方、攻击者\n- 涉及到数据：公钥、私钥、明文、密文\n\
    - 公钥算法的条件：\n  - 产生一对密钥是计算可行的\n  - 已知公钥和明文，产生密文是计算可行的\n  - 接收方利用私钥来解密密文是计算可行的\n\
    \  - 对于攻击者，利用公钥来推断私钥是计算不可行的\n  - 已知公钥和密文，恢复明文是计算不可行的\n  - (可选)加密和解密的顺序可交换\n\n\
    ### 满足上述条件找到单向陷门函数\n\n- 满足下列条件的函数f：\n  - (1) 给定x，计算y=f(x)是容易的\n  - (2) 给定y，计算x使y=f(x)是困难的\n\
    \  - (3) 存在z，已知z时，对给定的任何y，若相应的x存在，则计算x使y=f(x)是容易的\n\n- 所谓计算x= f⁻¹(Y)困难是指计算上相当复杂，已无实际意义\n\
    \n寻找合适的单向陷门函数是公钥密码体制应用的关键\n"
