    # # 问题的提出


    # ## （1）密钥管理量的困难


    传统密钥管理：两两分别用一对密钥时，则n个用户需要C(n,2)=n(n-1)/2个密钥，当用户量增大时，密钥空间急剧增大。如：


    n=100 时， C(100,2)=4,995


    n=5000时， C(5000,2)=12,497,500


    # ## （2）数字签名的问题


    传统加密算法无法实现抗抵赖的需求。


    # ## （3）密钥必须经过安全的信道分配'
