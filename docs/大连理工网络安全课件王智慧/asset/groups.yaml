  md: "\n## Vernam密码\n\n- 1918年，Gilbert Vernam建议密钥与明文一样长并且没有统计关系的密钥内容，他采用的是二进制数据：\n\
    - 加密：\\( C_i = P_i \\oplus K_i \\)\n- 解密：\\( P_i = C_i \\oplus K_i \\)\n\n核心：构造和消息一样长的随机密钥\n\
    \n## 总结\n\n- 替换是密码学中有效的加密方法。本世纪上半叶用于外交通信\n- 破译威胁来自：\n  - 频率分布\n  - 重合指数\n  - 考虑最可能的字母及可能出现的单词\n\
    \  - 重复结构分析及克思斯基方法\n  - 持久性、组织性、创造性和运气\n\n## 置换\n\n- 通过执行对明文字母的置换，取得一种类型完全不同的映射，即置换密码。\n\
    - 若该明文被视为一个比特序列，则置换涉及到用密文比特模式代替明文比特模式\n- 换位密码把明文按列写入，按行读出\n- 密钥包含3方面信息：行宽，列高，读出顺序\n\
    \n```\nkey:        4  3  1  2  5  6  7\nplaintext:  a  t  t  a  c  k  p\n    \
    \        o  s  t  p  o  n  e\n            d  u  n  t  i  l  t\n            w \
    \ o  a  m  x  y  z\nciphertext: TTNAAPT MTSU AODWCOIXPETZ\n```\n\n- 完全保留字符的统计信息\n\
    - 使用多轮加密可提高安全性\n\n## 转子机\n\n- 通过多个加密阶段的组合，能使密码分析变得极为困难\n- 将机械转轮用线连起来完成通常的密码替代；\n\
    - 转轮机有键盘和一系列转轮；\n- 每个转轮是字母的任意组合；\n- 有26个位置来完成一种简单的替代；\n- 转轮的输出连接到相邻的输入栓；\n\n###\
    \ 例如：\n\n3个转轮密码机中，第一个转轮可能用“Y”替代“A”，第二个转轮可能用“R”替代“Y”，第三个转轮可能用“B”替代“R”，“B”应该是输出密文。\n\
    \n最著名的转轮装置是恩尼格马（Enigma）\n\n### 初始情况\n\n### 经过一次按键后\n\n![](img/09e6564ace8d10cc99172928c514fc45_60_0.png)\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_60_1.png)\n\n## 密码系统的模型\n\n![](img/09e6564ace8d10cc99172928c514fc45_62_0.png)\n\
    \n消息源\n\n加密\n\n解密\n\n目的地\n\n密码分析者\n\n安全信道\n\n密钥源\n\n明文\n\n密文\n\n明文\n\n密钥\n\n密钥\n\
    \n- 对称密码算法有时又叫传统密码算法，加密密钥能够从解密密钥中推算出来，反过来也成立。在大多数对称算法中，加密解密密钥是相同的。\n\n- 它要求发送者和接收者在安全通信之前，商定一个密钥。对称算法的安全性依赖于密钥，泄漏密钥就意味着任何人都能对消息进行加密解密。\n\
    \n- 对称算法的加密和解密表示为：\n  - Ek(M)=C\n  - Dk(C)=M\n\n## 单钥体制(cont.)\n\n单钥体制中，加密密钥和解密密钥是相同的（可互推算），系统的保密性取决于密钥的安全性。有两大课题：\n\
    \n- 如何产生满足保密要求的密钥？\n- 如何将密钥安全可靠地分配给通信对方？\n\n包括密钥产生、分配、存储、销毁等多方面的问题，统称密钥管理。\n\n\
    - 发送方与接收方用同一个随机对称密钥进行加密数据和解密数据\n- 对称密钥在使用过一次后就被抛弃。\n- **优点**：速度比较快\n- **缺点**：\n\
    \  - 不适用于数字签名\n  - 密钥每用一次都被抛弃，需要重复的生成密钥，这样对密钥的管理压力会很大\n- 所有古典密码都属于对称密码\n\n对称算法可分为两类。\n\
    \n- 一次只对明文中的单个位（有时对字节）运算的算法称为序列算法或序列密码，流密码。如，Vigenere密码也是流密码。这种情况下，密钥流就是m值的重复，其中m表示关键字的大小。\n\
    - 对明文的一组位进行运算，这些位组称为分组，相应的算法称为分组算法或分组密码。现代计算机密码算法的典型分组长度为64位——这个长度大到足以防止分析破译，但又小到足以方便作用。\n\
    \nDk(Ek(M))=M\n\n## 流密码模型\n\n![](img/09e6564ace8d10cc99172928c514fc45_67_0.png)\n\
    \n流密码体制模型\n\n## 分组密码概述\n\n分组密码是将明文消息编码表示后的数字（简称明文数字）序列，划分成长为$n$的组（可看成长度为$n$的矢量），每组分别在密钥的控制下变换成等长的输出数字（简称密文数字）序列，\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_68_0.png)\n\n## 两个基本设计方法\n\nShannon称之为理想密码系统中，密文的所有统计特性都与所使用的密钥独立\n\
    \n- 扩散（Diffusion）：明文的统计结构被扩散消失到密文中，使得明文和密文之间的统计关系尽量复杂\n- 混乱（Confusion）：使得密文的统计特性与密钥的取值之间的关系尽量复杂，从而使统计分析攻击不能奏效。\n\
    \n## 安全密码的特性\n\n- Shannon特性（1949）\n  - 所需的保密程度决定了用于加密和解密过程的相应的工作量\n  - 处理的实现应尽可能简单\n\
    \  - 编码中的错误不应传播及影响后面的消息\n  - 加密后密文的尺寸不应大于明文的尺寸\n\n## 分组密码：软件实现的设计原则\n\n- 使用子块和简单的运算\n\
    - 密码运算在子块上进行，要求子块的长度能自然地适应软件编程，如8、16、32比特等。\n- 应尽量避免按比特置换，在子块上所进行的密码运算尽量采用易于软件实现的运算。\n\
    - 最好是用处理器的基本运算，如加法、乘法、移位等。\n\n## 分组密码：硬件实现的设计原则\n\n- 加密和解密的相似性，即加密和解密过程的不同应仅仅在密钥使用方式上，以便采用同样的器件来实现加密和解密，以节省费用和体积。\n\
    - 尽量采用标准的组件结构，以便能适应于在超大规模集成电路中实现。\n\n## 数据加密标准（Data Encryption Standard, DES）\n\
    \n### 背景\n\n- 发明人：美国IBM公司 W. Tuchman 和 C. Meyer 1971-1972年研制成功\n- 基础：1967年美国Horst\
    \ Feistel提出的理论\n- 产生：美国国家标准局（NBS）1973年5月到1974年8月两次发布通告，公开征求用于电子计算机的加密算法。经评选从一大批算法中采纳了IBM的LUCIFER方案\n\
    - 标准化：DES算法1975年3月公开发表，1977年1月15日由美国国家标准局颁布为数据加密标准（Data Encryption Standard），于1977年7月15日生效\n\
    \n## 分组密码：Feistel密码结构\n\n- 是密码设计的一个主要原则，而不是一个特殊的密码。\n- 就是一种分组密码，一般分为64位一组，一组分左右部分，进行一般为16轮的迭代运算，每次迭代完后交换左右位置，可以自己进行设计的有：分组大小、密钥长度、轮次数、子密钥生成、轮函数\n\
    \n### Feistel加密过程\n\n输入：\n\n- 长为2w比特的明文分组\n- 密钥k\n\n输出：\n\n- 长为2w比特的密文分组\n\n![](img/09e6564ace8d10cc99172928c514fc45_77_0.png)\n\
    \n### Feistel密码设计原则\n\n- 分组大小\n  - increasing size improves security, but slows\
    \ cipher\n- 密钥长度\n  - increasing size improves security, makes exhaustive key\
    \ searching harder, but may slow cipher\n- 轮次数\n  - increasing number improves\
    \ security, but slows cipher\n- 子密钥生成\n  - greater complexity can make analysis\
    \ harder, but slows cipher\n- 轮函数\n  - greater complexity can make analysis harder,\
    \ but slows cipher\n- 快速软件加密/解密\n  - are more recent concerns for practical use\
    \ and testing\n"
