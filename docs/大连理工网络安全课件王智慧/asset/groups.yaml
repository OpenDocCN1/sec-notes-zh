  - '[PAGE 63]


    +   - 对称密码算法有时又叫传统密码算法，加密密钥能够从解密密钥中推算出来，反过来也成立。在大多数对称算法中，加密解密密钥是相同的。


    +   - 它要求发送者和接收者在安全通信之前，商定一个密钥。对称算法的安全性依赖于密钥，泄漏密钥就意味着任何人都能对消息进行加密解密。


    +   - 对称算法的加密和解密表示为：

    +   Ek(M)=C

    +   Dk(C)=M'
  - '[PAGE 64]


    # 单钥体制(cont.)


    单钥体制中，加密密钥和解密密钥是相同的（可互推算），系统的保密性取决于密钥的安全性。有两大课题：


    +   - 如何产生满足保密要求的密钥？

    +   - 如何将密钥安全可靠地分配给通信对方？


    包括密钥产生、分配、存储、销毁等多方面的问题，统称密钥管理。'
  - '[PAGE 65]


    +   - 发送方与接收方用同一个随机对称密钥进行加密数据和解密数据

    +   - 对称密钥在使用过一次后就被抛弃。

    +   - **优点**：速度比较快

    +   - **缺点**：

    +     - 不适用于数字签名

    +     - 密钥每用一次都被抛弃，需要重复的生成密钥，这样对密钥的管理压力会很大

