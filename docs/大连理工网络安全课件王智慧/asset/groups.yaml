    # 香港邮政电子证书－你的「电子身份」


    电子证书可被视为「电子身分证」，用作核证持有人的网上身分。它可确保数据在电子传送过程中免受破坏和保密性，以及保障有关电子交易完成后，双方必须确认曾进行交易。


    根据电子交易条例，香港邮政作为认可核证机关（“核证机关”），负责使用稳妥系统发出、撤回及利用公开储存库公布已认可之数码证书作为在网上进行稳妥的身分辨认。该等认可证书名为“证书”或“电子核证证书”并符合以下所有说明之纪录：


    +   - 由核证机关为证明数码签署之目的而发出该数码签署用意为确认持有某特定配对密码钥匙者身分或其他主要事项；

    +   - 识别发出纪录之核证机关；

    +   - 指名或识别获发给纪录者；

    +   - 包含该获发给纪录者之公开密码匙；并

    +   - 经发出纪录核证机关之负责人签署。


    ![](img/09e6564ace8d10cc99172928c514fc45_349_0.png)


    +   相关网址

    +   - 网上申请－电子证书申请

    +   - 证书资料确认

    +   - 首次申请－电子证书（伺服器）－提交 Certificate Signing Request (CSR)

    +   - 更新证书－电子证书（伺服器）－提交 Certificate Signing Request (CSR)'
  md: "\n\n## Exchange of public-key certificates\n\n- 泄漏私钥等价于丢失证书\n- 证书的时间作为有效期\n\
    \n## X.509证书\n\n- 目前应用最广泛的证书格式是国际电信联盟ITU(International telecommunication Union)提出的X.509版本3格式。\n\
    - X.509标准最早于1988年颁发，此后又于1993年和1995年进行了两次修改\n- Internet工程任务组(IETF)针对X.509在Internet环境的应用，颁发了一个作为X.509子集的RFC2459。从而使得X.509在Internet环境中得到广泛应用。\n\
    \n如果用户数量极多，则仅一个CA负责为用户签署证书就有点不现实，通常应有多个CA，每个CA为一部分用户发行、签署证书。\n\n例如：设用户A已从证书发放机构X₁处获取了公开密钥证书，用户B已从X₂处获取了证书。如果A不知X₂的公开密钥，则他虽然能读取B的证书，但却无法验证用户B证书中X₂的签名，因此B的证书对A来说是没有用处的。然而，如果两个CA：X₁和CA：X₂彼此间已经安全地交换了公开密钥，则A可通过以下过程获取B的公开密钥：\n\
    \nY《X》表示证书发放机构Y向用户X发放的证书，Y{I}表示Y对I的哈希值签名\n\n(1) A从目录中获取由X₁签署的X₂的证书X₁《X₂》，因A知道X₁的公开密钥，所以能验证X₂的证书，并从中得到X₂的公开密钥。\n\
    \n(2) A再从目录中获取由X₂签署的B的证书X₂《B》，并由X₂的公开密钥对此加以验证，然后从中得到B的公开密钥。\n\n以上过程中，A是通过一个证书链来获取B的公开密钥的，证书链可表示为\n\
    \nX₁《X₂》 X₂《B》\n\n类似地，B能通过相反的证书链获取A的公开密钥，表示为\n\nX₂《X₁》X₁《A》\n\n以上证书链中只涉及两个证书，同样有N个证书的证书链可表示为\n\
    \nX₁《X₂》X₂《X₃》Xₙ《B》\n\n用户A可从目录中得到相应的证书以建立到B的以下证书链：\nX《W》W《V》V《U》U《Y》Y《Z》Z《B》\n\
    并通过该证书链获取B的公开密钥。\n类似地，B可建立以下证书链以获取A的公开密钥：\nZ《Y》Y《U》U《V》V《W》W《X》X《A》\n\n## PKI：公钥管理与公钥基础设施\n\
    \n为管理公开密钥（生成、认证、存储、安装），须建立一套公钥基础设施（PKI - Public Key Infrastructure）。PKI的基本组成元素是证书颁发机构（CA-Certificate\
    \ Authority），PKI主要完成功能：\n\n- ①为用户生成一对密钥（公开密钥，私有密钥），并通过一定的途径分发给用户；\n- ②CA为用户签发数字证书，形成用户的公开密钥信息，并通过一定的途径分发给用户；\n\
    - ③对用户证书的有效性进行验证；\n- ④对用户的数字证书进行管理。这些管理包括有效证书的公布、撤销证书的公布（有时也称证书黑名单表的维护）、证书归档等。\n\
    \n## PKI/CA\n\n- PKI概论\n- PKI/CA的理论基础\n- PKI/CA体系架构\n- PKI/CA标准与协议\n- 国内外发展现状和前景\n\
    - PKI/CA的应用\n\n## 什么是PKI\n\n- PKI是public key infrastructure缩写\n- 即公钥基础设施，是一种运用公钥的概念与技术来实施并提供安全服务的具体普遍适用性的网络安全基础设施。\n\
    - PKI(公钥基础设施)技术采用证书管理公钥，通过第三方的可信任机构——认证中心CA(Certificate Authority)，把用户的公钥和用户的其它标识信息(如名称、e-mail、身份证号等)捆绑在一起，在Internet网上验证用户的身份。\n\
    - 通过把要传输的数字信息进行加密和签名，保证信息传输的机密性、真实性、完整性和不可否认性，从而保证信息的安全传输。\n\n## 一个典型、完整、有效的PKI应用系统至少应具有以下部分：\n\
    \n- 端实体\n- CA\n- RA\n- CRL发布机构\n- 证书存取库\n\n管理任务：\n\n- (1)用户注册；\n- (2)初始化；\n- (3)认证；\n\
    - (4)密钥对恢复及更新；\n- (5)证书撤销请求；\n- (6)支持交叉认证。\n\n## PKI/CA发展历程\n\n- 1976年，提出RSA算法\n\
