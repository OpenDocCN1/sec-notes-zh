    \ |\n\n## 对公钥密码算法的误解\n\n- 公开密钥算法比对称密钥密码算法更安全？\n  - 任何一种算法都依赖于密钥长度、破译密码的工作量，从抗分析角度，没有一方更优越\n\
    \n- 公开密钥算法使对称密钥成为过时了的技术？\n  - 公开密钥很慢，只能用在密钥管理和数字签名，对称密钥密码算法将长期存在\n\n- 使用公开密钥加密，密钥分配变得非常简单？\n\
    \  - 事实上的密钥分配既不简单，也不有效\n\n### 5.1.3 公钥密码的要求\n\n- 涉及到各方：发送方、接收方、攻击者\n- 涉及到数据：公钥、私钥、明文、密文\n\
    - 公钥算法的条件：\n  - 产生一对密钥是计算可行的\n  - 已知公钥和明文，产生密文是计算可行的\n  - 接收方利用私钥来解密密文是计算可行的\n\
    \  - 对于攻击者，利用公钥来推断私钥是计算不可行的\n  - 已知公钥和密文，恢复明文是计算不可行的\n  - (可选)加密和解密的顺序可交换\n\n\
    ### 满足上述条件找到单向陷门函数\n\n- 满足下列条件的函数f：\n  - (1) 给定x，计算y=f(x)是容易的\n  - (2) 给定y，计算x使y=f(x)是困难的\n\
    \  - (3) 存在z，已知z时，对给定的任何y，若相应的x存在，则计算x使y=f(x)是容易的\n\n- 所谓计算x= f⁻¹(Y)困难是指计算上相当复杂，已无实际意义\n\
    \n寻找合适的单向陷门函数是公钥密码体制应用的关键\n"
