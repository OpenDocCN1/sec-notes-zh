  - '[PAGE 27]


    # # 网络安全模型1


    模型1说明：


    +   - 设计目的：为了实现安全传输。


    +   - 设计安全服务应包括以下4个方面的内容：


    +   1. 设计执行安全相关传输的算法，该算法应是攻击者无法攻破的；


    +   2. 产生算法所用的秘密信息；


    +   3. 设计分配和共享秘密信息的方法；


    +   4. 指明通信双方使用的协议，该协议利用安全算法和秘密信息实现安全服务。'
