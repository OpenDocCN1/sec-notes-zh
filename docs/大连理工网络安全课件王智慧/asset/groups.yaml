  - '[PAGE 218]


    # # 人物介绍


    +   1976年，美国斯坦福大学教授赫尔曼(E.Hellman)和他的研究助理迪菲(W.Diffie)，以及博士生默克勒(R.C.Merkle)（简称为DHM）首先创立并发表了所谓的“公钥密码体制”（public
    key cryptography），即加密、解密用两个不同的钥，加密用公钥（public key），即可以公开，不必保密，任何人都可以用；解密用私钥（private
    key），此钥必须严加管理，不能泄漏。更为称绝的是，他们还发明了所谓的数字签名（digital signatures）技术，即用私钥签名，再用公钥验证。


    +   当然，DHM只是提出了一种关于公钥密码体制与数字签名的思想，而没有真正实现。不过，他们确实是实现了一种体现公钥密码体制思想、基于离散对数问题的、在不安全的通道上进行密钥形成与交换的新技术。'
  - '[PAGE 219]


    # RSA算法


    +   - 由MIT的 Rivest, Shamir & Adleman 在 1977 提出

    +   - 最著名的且被广泛应用的公钥加密体制

    +   - 明文、密文是0到n-1之间的整数，通常n的大小为1024位或309位十进制数'
  - "[PAGE 220]\n\n# # RSA算法的实现\n\n+   - 实现的步骤如下： Bob为实现者  \n+     (1) Bob寻找出两个大素数p和q\
    \  \n+     (2) Bob计算出n=pq 和 φ(n)=(p-1)(q-1)  \n+     (3) Bob选择一个随机数e (0<e< φ(n))，\
    \ 满足(e, φ(n))=1  \n+     (4) Bob使用辗转相除法计算d=e^-1(mod φ(n))，即ed≡1(mod(p-1)(q-1))\
    \  \n+     (5) Bob在目录中（e,n)作为公钥。  \n+     (6) (d,n)或者d作为私钥。\n\n+   - 密码分析者攻击RSA体制的关键点在于如何分解n。若分解成功使n=pq，则可以算出φ(n)=(p-1)(q-1)，然后由公开的e，解出秘密的d"
  - '[PAGE 221]


    # # RSA算法编制


    +   - 参数T={N}；

    +   - 私钥SK=D；

    +   - 公钥PK=E；


    设：明文M，密文C，那么：

    用公钥作业：M^E mod N = C

    用私钥作业：C^D mod N = M'
  - '[PAGE 222]


    # # RSA Example


    +   1. Select primes: \( p=17 \, \& \, q=11 \)


    +   2. Compute \( n = pq = 17 \times 11 = 187 \)


    +   3. Compute \( \phi(n) = (p-1)(q-1) = 16 \times 10 = 160 \)


    +   4. Select \( e : \gcd(e, 160) = 1 \; ; \; \text{choose } e=7 \)


    +   5. Determine \( d: \; de=1 \, \text{mod} \, 160 \, \text{and} \, d < 160 \;
    \text{Value is } d=23 \text{ since } 23 \times 7 = 161 = 1 \times 160 + 1 \)


    +   6. Publish public key \( KU = \{7, 187\} \)


    +   7. Keep secret private key \( KR = \{23, 187\} \)'
  - '[PAGE 223]


    # RSA Example cont


    +   - sample RSA encryption/decryption is:

    +   - given message M = 88 (nb. 88 < 187)

    +   - encryption:

    +     \[

    +     C = 88^7 \mod 187 = 11

    +     \]

    +   - decryption:

    +     \[

    +     M = 11^{123} \mod 187 = 88

    +     \]'
  - '[PAGE 224]


    # 加密算法：


    假设 M 是明文（M<n），那么密文就是 C=M^e mod n。


    # 解密算法：


    假设 C 是密文，那么明文就是 M=C^d mod n。


    证明：


    （1）由于 C^d = M^ed = M^{k*φ(n)+1} (mod n)。


    如果 M 和 n 是互素的，显然直接由欧拉定理我们就能得到：


    C^d = M^{k*φ(n)}*M^1 = M (mod n) = M。


    ed≡1(mod(p−1)(q−1))'
  - '[PAGE 225]


    2）如果 M 和 n 不互素，由于 n 是两个素数 p 和 q 的乘积且 M<n，e*d = 1(mod Φ(n)) = 1(mod (p-1)(q-1))，可以得到：


    e*d = 1(mod (p-1)) 且 e*d = 1(mod (q-1))。


    则 e*d 可以写成： e*d = k*(p-1)+1，e*d = h*(q-1)+1


    由费马小定理：


    M^e*d = M^k*(p-1)+1 = M(mod p) 和 M^e*d = M^h*(q-1)+1 = M(mod q)。


    所以我们有：


    C^d = M^e*d = M (mod p*q) = M (mod n) = M'
  - '[PAGE 226]


    # # RSA 的安全性


    +   - 三种攻击 RSA的方法：

    +     - 1，强力穷举密钥:尝试所有可能的密钥。因此，e 和d 的位数越大，算法就越安全。然而，在密钥产生和加密解密中使用的计算都非常复杂，所以密钥越大，系统运行越慢。

    +     - 2，时间攻击：依赖解密算法的运行时间，利用 CPU处理某些特殊的模乘比较慢的规律来确定每一位指数'
  - '[PAGE 227]


    <!-- no content -->'
  - '[PAGE 228]


    # # RSA算法的安全性分析


    +   - 密码分析者攻击RSA体制的关键点在于如何分解n


    +   - 若分解成功使n=pq，则可以算出φ(n) = (p-1)(q-1)，然后由公开的e，解出秘密的d


    +   - 若使RSA安全，p与q必为足够大的素数，使分析者没有办法在多项式时间内将n分解出来'
  - '[PAGE 229]


    素数：只能被1和它本身整除的自然数；否则为合数。


    每个合数都可以唯一地分解出素数因子

    6 = 2 · 3

    999999 = 3·3·7·11·13·37

    27641 = 131·121

    从2 开始试验每一个小于等于√27641 的素数。


    | 整数n的十进制位数 | 因子分解的运算次数 | 所需计算时间（每微秒一次） |

    |---------------------|----------------------|-------------------------------|

    | 50                  | 1.4x10¹⁰             | 3.9小时                       |

    | 75                  | 9.0x10¹²             | 104天                         |

    | 100                 | 2.3x10¹⁵             | 74年                          |

    | 200                 | 1.2x10²³             | 3.8x10⁹年                     |

    | 300                 | 1.5x10²⁹             | 4.0x10¹⁵年                    |

    | 500                 | 1.3x10³⁹             | 4.2x10²⁵年                    |'
  - '[PAGE 230]


    # RSA算法的安全性分析


    +   - 建议选择p和q大约是100位的十进制素数

    +   - 模n的长度要求至少是512比特，

    +   - EDI攻击标准使用的RSA算法中规定n的长度为512至1024比特位之间，但必须是128的倍数

    +   - 国际数字签名标准ISO/IEC 9796中规定n的长度位512比特位'
  - '[PAGE 231]


    # RSA算法的安全性分析


    为了抵抗现有的整数分解算法，对RSA模n的素因子p和q还有如下要求：


    +   1. |p-q|很大，通常p和q的长度相同；

    +   2. p-1和q-1分别含有大素因子p1和q1；

    +   3. p1-1和q1-1分别含有大素因子p2和q2；

    +   4. p+1和q+1分别含有大素因子p3和q3。'
