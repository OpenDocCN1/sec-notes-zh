    \n### 鉴别的目的\n\n- 信源识别：验证信息的发送者是真正的，而不是冒充的 —— 数字签名\n- 验证信息的完整性，在传送或存储过程中未被篡改、重放或延迟等\
    \ —— 消息认证码，消息加密\n\n### 鉴别函数分类\n\n- 消息加密：整个消息的密文作为认证标识\n- 消息鉴别码(MAC)：公开函数+密钥产生一个固定长度的值作为认证标识\n\
    - 散列函数：一个公开函数将任意长度的消息映射到一个固定长度的哈希值，作为认证标识\n\n## 鉴别函数分类\n\n（1）消息加密\n\n### 对称加密—保密和鉴别\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_243_0.png)\n\nA与B共享密钥k\n\nA：\\( E_k(M)\
    \ \\rightarrow B \\)\n\nB：\\( D_k(M) \\)，查看M是否为有意义的明文\n\n- 提供保密\n  - 仅 A 和 B 共享\
    \ k\n- 提供一定程度的鉴别\n  - 仅来自 A\n  - 传输中不会被更改\n  - 需要某种结构和冗余\n- 不提供签名\n  - 接收人可以伪造报文\n\
    \  - 发送人可以伪造报文\n\n### 公钥加密—保密性\n\n![](img/09e6564ace8d10cc99172928c514fc45_245_0.png)\n\
    \n- 提供保密 —— 仅B有KR<sub>b</sub>能解密\n- 不提供鉴别 —— 任何一方均可以使用KU<sub>b</sub>加密报文而假称它是发自A的\n\
    \n### 公钥加密—鉴别和签名\n\n![](img/09e6564ace8d10cc99172928c514fc45_246_0.png)\n\n- 提供鉴别和签名\n\
    \  - 仅 A 有 KR<sub>a</sub> 可进行加密\n  - 传输中不会被更改\n  - 需要某种结构或冗余\n  - 任何一方均能使用 KU<sub>a</sub>\
    \ 验证签名\n\n### 公钥加密—保密、鉴别和签名\n\n![](img/09e6564ace8d10cc99172928c514fc45_247_0.png)\n\
    \n- \\( KR_a \\) 提供鉴别和签名\n- \\( KU_b \\) 可提供保密性\n\n## 消息鉴别码\n\n- 使用一个密钥生成一个固定大小的小数据块，并加入到消息中，称\
    \ **MAC**，或密码校验和（**cryptographic checksum**）\n  1. 接收者可以确信消息 M 未被改变\n  2. 接收者可以确信消息来自所声称的发送者\n\
    \  3. 如果消息中包含顺序码（如 HDLC、X.25、TCP），则接收者可以保证消息的正常顺序\n- MAC 函数类似于加密函数，但不需要可逆性。因此在数学上比加密算法被攻克的弱点要少\n\
    \n### MAC消息认证码\n\n![](img/09e6564ace8d10cc99172928c514fc45_250_0.png)\n\n### 消息鉴别\n\
    \n![](img/09e6564ace8d10cc99172928c514fc45_251_0.png)\n\nMAC = C<sub>k</sub>(M);\
    \ k 为 A 和 B 共享的密钥，M 为明文  \nA → B: M || C<sub>k</sub>(M)\n\n- 提供鉴别\n  - 仅A和B共享密钥k\n\
    \n### 消息鉴别与保密，鉴别与明文连接\n\n![](img/09e6564ace8d10cc99172928c514fc45_252_0.png)\n\
    \nA → B : E<sub>k2</sub>[M || C<sub>k1</sub>(M)]\n\n- 提供鉴别\n  - 仅 A 和 B 共享密钥 k₁\n\
    - 提供保密\n  - 仅 A 和 B 共享密钥 k₂\n\n### 消息鉴别与保密，鉴别与密文连接\n\n![](img/09e6564ace8d10cc99172928c514fc45_253_0.png)\n\
    \nA → B：E<sub>k2</sub>[M || C<sub>k1</sub>(E<sub>k2</sub>(M))]\n\n- 提供鉴别\n  -\
    \ 仅 A 和 B 共享密钥 k₁\n- 提供保密\n  - 仅 A 和 B 共享密钥 k₂\n\n### 消息鉴别 vs 常规加密\n\n- 保密性与真实性是两个不同的概念\n\
    - 根本上，信息加密提供的是保密性而非真实性\n- 加密代价大（公钥算法代价更大）\n- 鉴别函数与保密函数的分离能提供功能上的灵活性\n- 某些信息只需要真实性，不需要保密性\n\
    \  - 广播的信息难以使用加密（信息量大）\n  - 网络管理信息等只需要真实性\n  - 政府/权威部门的公告\n\n### 散列函数\n\n- H(M):\
    \ 输入为任意长度的消息M; 输出为一个固定长度的散列值，称为消息摘要（Message Digest）\n- H(M)是消息M的所有位的函数并提供错误检测能力：消息中的任何一位或多位的变化都将导致该散列值的变化\n\
    - H(M)又称为：哈希函数、数字指纹（Digital finger print）、压缩（Compression）函数、数据鉴别码（Data authentication\
    \ code）等\n\n### Message Digest\n\n- 目標：確保資料之完整性（Integrity）\n- 特色：\n  - (1) 不具有金鑰之密碼元件\n\
    \  - (2) 任意長度資料之輸入，固定長度摘要輸出\n  - (3) 找出兩個不同之輸入，使輸出相同在計算上很難\n- 常用系統：\n  - MD5 (RFC\
    \ 1321)\n  - SHA-1 (FIPS 180-1)\n\n"
  mdcn: "\n### RSA的速度\n\n- 由于进行的都是大数计算，使得RSA最快的情况也比DES慢上100倍，无论是软件还是硬件实现。\n- 速度一直是RSA的缺陷。一般来说只用于少量数据加密。\n\
    \n### RSA的缺点\n\n- A)产生密钥很麻烦，受到素数产生技术的限制，因而难以做到一次一密。\n- B)分组长度太大。\n- C)为保证安全性，n\
    \ 至少也要 600 bits以上，使运算代价很高，尤其是速度较慢，较对称密码算法慢几个数量级；且随着大数分解技术的发展，这个长度还在增加，不利于数据格式的标准化。\n\
    - D)目前，SET(Secure Electronic Transaction)协议中要求CA采用2048比特长的密钥，其他实体使用1024比特的密钥。\n\
    \n## RSA算法应用\n\n- RSA为公用网络上信息的加密和鉴别提供了一种基本的方法。它通常是先生成一对RSA密钥，其中之一是保密密钥，由用户保存；另一个为公开密钥，可对外公开，甚至可在网络服务器中注册，人们用公钥加密文件发送给个人，个人就可以用私钥解密接收。为提高保密强度，RSA密钥至少为500位长，一般推荐使用1024位。\n\
    \n- RSA系统是公钥系统的最具有典型意义的方法，大多数使用公钥密码进行加密和数字签名的产品和标准使用的都是RSA算法\n\n- 单钥密码加密速度快，人们用它来加密较长的文件，然后用RSA来给文件密钥加密，极好地解决了单钥密码的密钥分发问题。\n\
