    # Chinese Remainder Theorem

    （中国剩余定理）


    +   - 韓信點兵問題：「今有物不知其數，三三數之剩二，五五數之剩三，七七數之剩二，問物幾何？」～（孫武 孫子算經）


    也就是求正整數 x，使得


    x ≡ 2 （mod 3）


    x ≡ 3 （mod 5）


    x ≡ 2 （mod 7）


    两个问题？

    (1) x是否存在？

    (2) 如何求x？'
  - '[PAGE 193]


    • **回答（1）：中国剩余定理**


    令 $n_1,n_2,\cdots,n_t$ 为两两互素的正整数，


    令 $N=n_1n_2\cdots n_t$


    则以下同余系统中，$x\equiv a_1\pmod{n_1}$，$x\equiv a_2\pmod{n_2}$，$\cdots$，$x\equiv a_t\pmod{n_t}$，$x$
    会在 $[0,N-1]$ 中有唯一解。


    证明：


    由于 $n_1,n_2,\cdots,n_t$ 为两两互素的正整数，故对所有 $i=1,2,\cdots,t$，$(n_i,N/n_i)=1$。因此，存在
    $y_i$，使得 $(N/n_i)y_i\equiv1\pmod{n_i}$。


    若我们令


    $$x=\left(\frac{N}{n_1}\right)y_1a_1+\left(\frac{N}{n_2}\right)y_2a_2+\cdots+\left(\frac{N}{n_t}\right)y_ta_t\pmod
    N$$


    则 $x$ 是上述同余系统的解，因为对于所有 $i$，$1\leq i\leq t$，


    $$x\pmod{n_i}=\left(\frac{N}{n_i}\right)y_i a_i\pmod{n_i}=a_i$$'
