    \ 2845\n\n## 密钥置换算法的构造准则\n\n- 设计目标：子密钥的统计独立性和灵活性\n- 实现简单\n- 速度\n- 不存在简单关系：（给定两个有某种关系的种子密钥,能预测它们轮子密钥之间的关系）\n\
