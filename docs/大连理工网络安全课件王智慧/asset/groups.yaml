  - "[PAGE 190]\n\n+   - **ax = b mod n的求解过程：**\n\n(1) 利用欧几里德算法求出 d=(a, n)  \n　　若\
    \ d 不能整除 b，则无解。\n\n(2) 若 d 能整除 b，则令：\n\n$$a'=\\frac{a}{d},\\quad b'=\\frac{b}{d},\\\
    quad n'=\\frac{n}{d}$$\n\n因为 $(a', n')=1$，$a'x'=b' \\pmod {n'}$ 有唯一解，假设此解为 $x_0$\n\
    \n利用欧几里德算法求出 $a'$ 模 $n'$ 的乘法逆元 $(a')^{-1}$，\n$x'=(a')^{-1}b' \\pmod {n'}$\n\n\
    $x_0=x' \\pmod n$\n\n令 $x=x_0+(n/d)t \\pmod n$，$t=1,2,\\ldots,d-1$，即可求出剩下的 $d-1$\
    \ 个解"
  - '[PAGE 191]


    # 求解 $9x=12 \pmod{15}$


    $(1)$ 求出 $d=(a,n)=(9,15)=3$


    $3$ 能整除 $12$，因此 $x$ 有解，且有 $3$ 个解


    $(2)$


    $a''=\frac{a}{d}=3,\ b''=\frac{b}{d}=4,\ n''=\frac{n}{d}=5$


    $3x''=4 \pmod{5}$


    $3\times2=1 \pmod{5}$


    $3^{-1}=2 \pmod{5}$


    $x''=(2\times4)\pmod{5}=3$


    $x_0=x''\pmod n=3\pmod{15}=3$


    $x_1=x_0+\left(\frac{n}{d}\right)\times t_1=3+\left(\frac{15}{3}\right)\times1=8$


    $x_2=x_0+\left(\frac{n}{d}\right)\times t_2=3+\left(\frac{15}{3}\right)\times2=13$'
