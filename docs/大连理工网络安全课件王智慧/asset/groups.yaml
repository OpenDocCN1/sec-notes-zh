    # # Elementary MD5 Operation


    初值

    A=01234567

    B=89ABCDEF

    C=FEDCBA98

    D=76543210


    F(B, C, D)=(B∧C)∨(¬B∧D)

    G(B, C, D)=(B∧C)∨(B∧¬D)

