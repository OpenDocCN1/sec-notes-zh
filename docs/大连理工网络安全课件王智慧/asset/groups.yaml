  - "[PAGE 177]\n\n# 密钥扩展的伪代码\n\n```\nKeyExpansion(byte key[4 * Nk], word w[Nb * (Nr\
    \ + 1)], Nk)\nbegin\n    i = 0\n    while (i < Nk)\n        w[i] = word[key[4*i],\
    \ key[4*i+1], key[4*i+2], key[4*i+3]]\n        i = i + 1\n    end while\n\n  \
    \  i = Nk\n    while (i < Nb * (Nr + 1))\n        word temp = w[i - 1]\n     \
    \   if (i mod Nk = 0)\n            temp = SubWord(RotWord(temp)) xor Rcon[i /\
    \ Nk]\n        else if (Nk = 8 and i mod Nk = 4)\n            temp = SubWord(temp)\n\
    \        end if\n        w[i] = w[i − Nk] xor temp\n        i = i + 1\n    end\
    \ while\nend\n```\n\nNote that Nk=4, 6, and 8 do not all have to be implemented;\
    \ they are all included in the conditional statement above for conciseness. Specific\
    \ implementation requirements for the Cipher Key are presented in Sec. 6.1."
