    # # Thm : The Euclidean Algorithm


    Let \( r_0 = a \), \( r_1 = b \) be integers \( \geq a \geq b > 0 \). If the division
    algorithm is successively applied to obtain \( r_j = r_{j-1}q_{j-1} + r_{j-2}
    \), with \( 0 < r_{j-2} < r_{j-1} \), for \( j=0,1, \dots, n-2 \) and \( r_{n+1}
    = 0 \), then \( (a, b) = r_n \), the last nonzero mainder.


    <proof>: Since


    | \( r_0 = r_1q_1 + r_2 \) | \( 0 \leq r_2 < r_1 \) |

    |---|---|

    | \( r_1 = r_2q_2 + r_3 \) | \( 0 \leq r_3 < r_2 \) |

    | \( \vdots \) | \( \vdots \) |

    | \( r_{j-2} = r_{j-1}q_{j-1} + r_j \) | \( 0 \leq r_j < r_{j-1} \) |

    | \( \vdots \) | \( \vdots \) |

    | \( r_{n-2} = r_{n-1}q_{n-1} + r_n \) | \( 0 \leq r_n < r_{n-1} \) |

    | \( r_{n-1} = r_nq_n \) | |'
