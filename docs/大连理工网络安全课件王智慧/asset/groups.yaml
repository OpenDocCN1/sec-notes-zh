  - '[PAGE 254]


    # # 消息鉴别 vs 常规加密


    +   - 保密性与真实性是两个不同的概念

    +   - 根本上,信息加密提供的是保密性而非真实性

    +   - 加密代价大(公钥算法代价更大)

    +   - 鉴别函数与保密函数的分离能提供功能上的灵活性

    +   - 某些信息只需要真实性,不需要保密性

    +     - 广播的信息难以使用加密(信息量大)

    +     - 网络管理信息等只需要真实性

    +     - 政府/权威部门的公告'
  - '[PAGE 255]


    # # 散列函数


    +   - H(M): 输入为任意长度的消息M; 输出为一个固定长度的散列值，称为消息摘要（MessageDigest）


    +   - H(M)是消息M的所有位的函数并提供错误检测能力：消息中的任何一位或多位的变化都将导致该散列值的变化


    +   - H(M)又称为：哈希函数、数字指纹（Digital finger print）、压缩（Compression)函数、数据鉴别码（Dataauthentication
    code）等'
  - '[PAGE 256]


    # # Message Digest


    +   - 目標：確保資料之完整性(Integrity)


    +   - 特色：


    +   (1) 不具有金鑰之密碼元件


    +   (2) 任意長度資料之輸入，固定長度摘要輸出


    +   (3) 找出兩個不同之輸入，使輸出相同在計算上很難


    +   - 常用系統：


    +   - MD5 (RFC 1321)


    +   - SHA-1 (FIPS 180-1)'
