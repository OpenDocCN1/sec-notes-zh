  mdcn: "\n\n## Euclid 算法\n\n又叫 “辗转相除法”\n\n简单的描述就是，记 gcd(a,b) 表示非负整数 a,b 的最大公因数，那么：gcd(a,b)\
    \ = max[k, 其中 k|a 且 k|b] = gcd(b,a%b) 假设 a>b\n\n## 欧几里得算法\n\nA systematic method\
    \ to find the gcd of two positive integers\n\nLemma：If $c,d\\in\\mathbb{Z}$ and\
    \ $c=dq+r$, where $q,r\\in\\mathbb{Z}$, then $(c,d)=(d,r)$.\n\n<proof>:\n\n- 1.\
    \ $r=c-dq$; if $e\\mid c$ and $e\\mid d$, then $e\\mid r$.\n- 2. $c=dq+r$; if\
    \ $e\\mid d$ and $e\\mid r$, then $e\\mid c$.\n- $\\Rightarrow (c,d)=(d,r)$\n\n\
    ## Thm : The Euclidean Algorithm\n\nLet \\( r_0 = a \\), \\( r_1 = b \\) be integers\
    \ \\( \\geq a \\geq b > 0 \\). If the division algorithm is successively applied\
    \ to obtain \\( r_j = r_{j-1}q_{j-1} + r_{j-2} \\), with \\( 0 < r_{j-2} < r_{j-1}\
    \ \\), for \\( j=0,1, \\dots, n-2 \\) and \\( r_{n+1} = 0 \\), then \\( (a, b)\
    \ = r_n \\), the last nonzero mainder.\n\n<proof>: Since\n\n| \\( r_0 = r_1q_1\
    \ + r_2 \\) | \\( 0 \\leq r_2 < r_1 \\) |\n|---|---|\n| \\( r_1 = r_2q_2 + r_3\
    \ \\) | \\( 0 \\leq r_3 < r_2 \\) |\n| \\( \\vdots \\) | \\( \\vdots \\) |\n|\
    \ \\( r_{j-2} = r_{j-1}q_{j-1} + r_j \\) | \\( 0 \\leq r_j < r_{j-1} \\) |\n|\
    \ \\( \\vdots \\) | \\( \\vdots \\) |\n| \\( r_{n-2} = r_{n-1}q_{n-1} + r_n \\\
