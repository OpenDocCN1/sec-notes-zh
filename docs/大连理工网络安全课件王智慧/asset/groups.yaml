    - PKI/CA的应用\n\n## 什么是PKI\n\n- PKI是public key infrastructure缩写\n- 即公钥基础设施，是一种运用公钥的概念与技术来实施并提供安全服务的具体普遍适用性的网络安全基础设施。\n\
    - PKI(公钥基础设施)技术采用证书管理公钥，通过第三方的可信任机构——认证中心CA(Certificate Authority)，把用户的公钥和用户的其它标识信息(如名称、e-mail、身份证号等)捆绑在一起，在Internet网上验证用户的身份。\n\
    - 通过把要传输的数字信息进行加密和签名，保证信息传输的机密性、真实性、完整性和不可否认性，从而保证信息的安全传输。\n\n## 一个典型、完整、有效的PKI应用系统至少应具有以下部分：\n\
    \n- 端实体\n- CA\n- RA\n- CRL发布机构\n- 证书存取库\n\n管理任务：\n\n- (1)用户注册；\n- (2)初始化；\n- (3)认证；\n\
    - (4)密钥对恢复及更新；\n- (5)证书撤销请求；\n- (6)支持交叉认证。\n\n## PKI/CA发展历程\n\n- 1976年，提出RSA算法\n\
    - 20世纪80年代，美国学者提出了PKI的概念\n- 1996年，以Visa、MastCard、IBM、Netscape、MS、数家银行推出SET协议，推出CA和证书概念\n\
    - 1999年，PKI论坛成立\n- 2000年4月，美国国防部宣布要采用PKI安全倡议方案。\n- 2001年6月13日，在亚洲和大洋洲推动PKI进程的国际组织宣告成立，该国际组织的名称为“亚洲PKI论坛”，其宗旨是在亚洲地区推动PKI标准化，为实现全球范围的电子商务奠定基础······\n\
    - 2007年11月7日，“亚洲PKI联盟”（APKIC，Asia PKI Consortium）成立大会在中国西安召开\n\n## 世界各国的PKI建设\n\
    \n- 美国——联邦桥计划\n- 加拿大——加拿大PKI计划\n- 澳大利亚、英国、法国、德国、意大利、奥地利、比利时、希腊、荷兰、芬兰、日本、俄罗斯等几十个国家都在发展、使用PKI\n\
    - 欧洲——欧洲桥CA，促进欧洲各种的CA互联互操作\n\n## 美国——联邦桥\n\n## 中国的PKI建设(1)\n\n### 区域型\n\n- 上海CA中心（SHECA）；北京CA（BJCA）；天津CA中心；福建CA中心，湖北CA（简称HBECA）；海南电子商务认证中心（HNECA）；广东省电子商务认证中心\n\
    \n### 行业型\n\n- 金融、电信和外经贸等行业建立的相关证书机构\n- 国内十三家商业银行联合建设中国金融认证中心(CFCA)\n- 中国电信组建的CTCA\n\
    - 由国家外经贸部建立的中国国际电子商务中心（CIECC）\n\n### 国家根CA\n\n- 国家密码管理局\n\n## 中国的PKI建设(2)\n\n\
    - 获证机构和发证数量，逐年增加\n  - 至2005年底，15家CA，发证总量236万\n  - 至2006年底，21家CA，累计发证546万\n  -\
    \ 至2007年底，26家CA，初步统计发证约740多万\n    - 上海CA累计发证突破90万（2007年7月）\n    - CFCA累计发证突破100万（2006年7月）\n\
    \    - 山东CA已发放证书40多万张（2006年1月）\n    - ......\n\n## PKI/CA\n\n- PKI概论\n- **PKI/CA的理论基础**\n\
    - PKI/CA体系架构\n- PKI/CA标准与协议\n- 国内外发展现状和前景\n- PKI/CA的应用\n\n## PKI理论基础\n\n- 密码学(略)\n\
    - 目录服务\n- 数字证书\n\n## 各种实例（1）\n\n- 中国各大银行已大规模地推广基于个人数字证书的网上银行身份认证，防止银行账号被窃和网银欺诈\n\
    - 25家银行采用数字证书，根据央行05年10月26日颁布的《电子支付指引》，凡使用数字证书等安全认证方式的网银用户，将不会存在每日、每笔网上支付金额的限制\n\
    - 每个香港公民一人一个智能身份证，每个智能身份证上配发一个全球通用的由香港邮政局颁发的个人数字证书\n- 美国军方采用基于PKI技术的网络身份证/工作证\n\
    \n## 香港邮政电子证书－你的「电子身份」\n\n电子证书可被视为「电子身分证」，用作核证持有人的网上身分。它可确保数据在电子传送过程中免受破坏和保密性，以及保障有关电子交易完成后，双方必须确认曾进行交易。\n\
    \n根据电子交易条例，香港邮政作为认可核证机关（“核证机关”），负责使用稳妥系统发出、撤回及利用公开储存库公布已认可之数码证书作为在网上进行稳妥的身分辨认。该等认可证书名为“证书”或“电子核证证书”并符合以下所有说明之纪录：\n\
    \n- 由核证机关为证明数码签署之目的而发出该数码签署用意为确认持有某特定配对密码钥匙者身分或其他主要事项；\n- 识别发出纪录之核证机关；\n- 指名或识别获发给纪录者；\n\
    - 包含该获发给纪录者之公开密码匙；并\n- 经发出纪录核证机关之负责人签署。\n\n相关网址\n\n- 网上申请－电子证书申请\n- 证书资料确认\n-\
