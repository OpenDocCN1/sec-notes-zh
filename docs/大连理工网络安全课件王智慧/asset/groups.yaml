  - '[PAGE 337]


    # # 什么是PKI


    +   ✔ PKI是public key infrastructure缩写

    +   ✔ 即公钥基础设施，是一种运用公钥的概念与技术来实施并提供安全服务的具体普遍适用性的网络安全基础设施。

    +   ✔ PKI(公钥基础设施)技术采用证书管理公钥，通过第三方的可信任机构——认证中心CA(Certificate Authority)，把用户的公钥和用户的其它标识信息(如名称、e-mail、身份证号等)捆绑在一起，在Internet网上验证用户的身份。

    +   ✔ 通过把要传输的数字信息进行加密和签名，保证信息传输的机密性、真实性、完整性和不可否认性，从而保证信息的安全传输。'
  - "[PAGE 338]\n\n# 一个典型、完整、有效的PKI应用系统至少应具有以下部分：\n\n+   端实体  \n+   CA  \n+   RA \
    \ \n+   CRL发布机构  \n+   证书存取库\n\n+   管理任务：  \n+   (1)用户注册；  \n+   (2)初始化；  \n+\
    \   (3)认证；  \n+   (4)密钥对恢复及更新；  \n+   (5)证书撤销请求；  \n+   (6)支持交叉认证。"
  - '[PAGE 339]


    # # PKI/CA发展历程


    +   1976年，提出RSA算法


    +   20世纪80年代，美国学者提出了PKI的概念


    +   1996年，以Visa、MastCard、IBM、Netscape、MS、数家银行推出SET协议，推出CA和证书概念


