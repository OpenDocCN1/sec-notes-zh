    # # 散列函数的要求


    +   - H能用于任意大小的分组

    +   - H能产生定长的输出

    +   - 对任何给定的x，H(x)要相对易于计算，使得硬件和软件实现成为实际可能

    +   - 对任何给定的码h，寻找x使得H(x)=h在计算上是不可行的，即单向性

    +   - 对任何给定的分组x，寻找不等于x的y，使得H(x)=H(y)在计算上是不可行的，即弱抗冲突性

