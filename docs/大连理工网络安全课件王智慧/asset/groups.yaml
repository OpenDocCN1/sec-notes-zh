    \ 为了有效评价一个机构的安全需求，以及对安全产品和政策进行评估和选择，负责安全的管理员需要某种系统的方法来定义对安全的要求，并刻画满足这些要求的措施。 \
    \ \n- 由ITU-T推荐的方案：**X.800**，即OSI安全框架；  \n- **OSI安全框架**给出了满足上述要求的系统化的定义方法，作为国际标准被提出。计算机和电信销售商在他们的产品和服务上开发了其相关的安全特性。\
    \  \n\n# OSI关注点  \n\n- 安全攻击：任何危及系统信息安全的活动。  \n- 安全机制：用来保护系统免受监听、阻止安全攻击及恢复系统的机制。\
    \  \n- 安全服务：加强数据处理系统和信息传输的安全性的一种服务。其目的在于利用一种或多种安全机制阻止安全攻击。  \n\n# 安全攻击  \n\n-\
    \ **主动攻击**  \n  以各种方式有选择地破坏信息，如伪装、重播、消息修改和拒绝攻击。  \n- **被动攻击**  \n  对传输进行窃听和监测，如信息内容泄露和流量分析。\
    \  \n\n# OSI安全框架:安全服务  \n\n- 在RFC2828中的定义：一种由系统提供的对系统资源进行特殊保护的处理或通信服务；安全服务通过安全机制来实现安全策略。\
    \  \n- ITU-T(X.800)已经定义出5种服务：5类14个特定服务：认证；数据完整性；数据保密；存取控制；不可否认。  \n\n# 1. 信息的机密性\
    \  \n\n信息的机密性(data confidentiality)在于保护信息免于被暴露攻击。正像X.800给服务下的定义那样，服务的内容非常宽泛，包含信息的整体和部分的机密性，也包含信息免于被进行流量分析，即它可以保护信息免于窃听和流量分析。\
    \  \n\n# 2. 信息的完整性  \n\n信息的完整性(data integrity)在于保护信息免于被恶意方篡改、插入、删除和重放。它可以保护信息的整体和部分。\
    \  \n\n# 5. 访问控制  \n\n访问控制(access control)在于保护信息免于被未经授权的实体访问。在这里，访问的含义是非常宽泛的，包含对程序的读、写、修改和执行等。\
    \  \n\n# 1. 加密  \n\n加密(encryption)：隐藏或覆盖信息以使其具有机密性。  \n传统加密方法，对称加密：DES AES，非对称加密：RSA\
    \ 椭圆曲线  \n\n# 2. 信息的完整性  \n\n信息的完整性(data integrity)机制附加于一个短的键值，该键值是信息本身创建的特殊程序。接收方接收信息和键值，再从接收的信息中创建一个新的键值，并把新创建的键值和原来的进行比较。如果两个键值相同，则说明信息的完整性被保全。\
    \  \n消息认证码MAC：hash函数 SHA  \n\n# 3. 数字签名  \n\n信息发送方可以对信息进行电子签名，信息接收方可以对签名进行电子检验。\
    \  \nElGamal，Schnorr数字签名方案  \n\n# 4. 身份认证交换  \n\n进行身份认证交换(authentication exchange)时，两个实体交换信息以相互证明身份。例如，一方实体可以证明他知道一个只有他才知道的秘密。\
    \  \n\nKerberos认证过程  \n\n# 5. 流量填充  \n\n流量填充(traffic padding)是指在数据流中嵌入一些虚假信息，从而阻止对手全图使用流量分析。\
    \  \n\nIpsec  \n\n# 6. 路由控制  \n\n路由控制(routing control)是指在发送方和接收方之间选择并不断改变有效路由，以避免对手在特定的路由上进行偷听。\
    \  \n\n# 7. 公证  \n\n公证(notarization)是指选择一个双方都依赖的第三方控制双方的通信，如此即可避免否认。为了避免发送方过后否认其曾经提出这样的请求，接收方可以牵涉第三方来保存发送方的请求。\
    \  \n\n[PKI, x.509数字证书](#)  \n\n# 8. 访问控制  \n\n访问控制(access control)就是用各种方法，证明某用户具有访问该信息或系统所拥有的资源的权利。\
    \  \n\n[身份管理](#)  \n\n| 安全服务 | 安全机制 |\n|---|---|\n| 信息机密性 | 加密和路由控制 |\n| 信息完整性\
    \ | 加密、数字签名、信息完整性 |\n| 身份认证 | 加密、数字签名、身份认证交换 |\n| 不可否认性 | 数字签名、信息完整性和公证 |\n| 访问控制\
    \ | 访问控制机制 |\n\n# 网络安全模型1  \n\n模型1说明：  \n\n- 设计目的：为了实现安全传输。  \n- 设计安全服务应包括以下4个方面的内容：\
    \  \n  1. 设计执行安全相关传输的算法，该算法应是攻击者无法攻破的；  \n  2. 产生算法所用的秘密信息；  \n  3. 设计分配和共享秘密信息的方法；\
    \  \n  4. 指明通信双方使用的协议，该协议利用安全算法和秘密信息实现安全服务。  \n\n# 网络安全模型2  \n\n# Opponent  \n\
    —human (e.g., cracker)  \n—software  \n(e.g., virus, worm)  \n\n# Access Channel\
    \  \n\n# Gatekeeper function  \n\n# Information System  \nComputing resources\
    \  \n(processor, memory, I/O)  \nData  \nProcesses  \nSoftware  \nInternal security\
    \ controls  \n\n**Figure 1.4 Network Access Security Model**  \n\n"
