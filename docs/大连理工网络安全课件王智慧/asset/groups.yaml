  md: "\n\n| GF(2⁸) | α 的多项式表示 | D₇D₆D₅D₄D₃D₂D₁D₀ | 推导过程 |\n|--------|----------------|------------------|----------|\n\
    | 0      | 0              | 00000000         |          |\n| α⁰     | α⁰     \
    \        | 00000001         |          |\n| α¹     | α¹             | 00000010\
    \         |          |\n| α²     | α²             | 00000100         |       \
    \   |\n| α³     | α³             | 00001000         |          |\n| α⁴     | α⁴\
    \             | 00010000         |          |\n| α⁵     | α⁵             | 00100000\
    \         |          |\n| α⁶     | α⁶             | 01000000         |       \
    \   |\n\n- 思考：\n- 计算3*7，和129*5在该域内的数值？\n\n3^7=(x+1)(x^2+x+1)=x^3+x^2+x+1（模2运算中，x^4+x=0\
    \ and x^2+x^2=0）\n\n所以3^7=9\n\n在乘积得出来的多项式次数大于7时，我们需要对多项式在GF(2)上关于h(x)求余数，也就是\n\
    \n12^95=(x^7+1)(x^2+1)=x^9+x^7+x^2+1\n\n将上面的函数加上x^n h(x)可以消去x^9（其实就是手工除法过程，只是在每一次商总是0或1），所以\n\
    \n12^95=x^9+x^7+x^2+1+x^9+x^5+x^4+x^3+x=x^7+x^5+x^4+x^3+x^2+x+1\n\n=00101111111=191\n\
    \n- 思考：\n- 计算 \\( (x^7+x+1)^{-1} \\mod (x^8+x^4+x^3+x+1) \\)\n- 计算 \\( (x^5+x+1)^{-1}\
    \ \\mod (x^8+x^4+x^3+x+1) \\)\n\n## AES：AES背景-i\n\n- 1997年4月15日，（美国）国家标准技术研究所（NIST）发起征集**高级加密标准（Advanced\
    \ Encryption Standard）**AES的活动，活动目的是确定一个非保密的、可以公开技术细节的、全球免费使用的分组密码算法，作为新的数据加密标准。\n\
    - 1997年9月12日，美国联邦登记处公布了正式征集AES候选算法的通告。对AES的基本要求是：比三重DES快、至少与三重DES一样安全、数据分组长度为128比特、密钥长度为128/192/256比特。\n\
    \n## AES背景-ii\n\n- 1998年8月12日，在首届AES会议上指定了15个候选算法。\n- 1999年3月22日第二次AES会议上，将候选名单减少为5个，这5个算法是RC6，Rijndael，SERPENT，Twofish和MARS。\n\
    - 2000年4月13日，第三次AES会议上，对这5个候选算法的各种分析结果进行了讨论。\n- 2000年10月2日，NIST宣布了获胜者—Rijndael算法，2001年11月出版了最终标准FIPS\
    \ PUB197。\n\n## AES 算法的一般描述\n\n![](img/09e6564ace8d10cc99172928c514fc45_150_0.png)\n\
    \n- AES算法的轮变换中没有Feistel结构，轮变换是由三个不同的可逆一致变换组成，称之为层。\n- 线性混合层： 确保多轮之上的高度扩散。\n- 非线性层：\
    \ 具有最优最差-情形非线性性的S-盒的并行应用。\n- 密钥加层： 轮密钥简单地异或到中间状态上。\n- Rijndael （发音为\"Rhine dale\"\
    ） 作为 AES 算法。\n\n## Rijndael简介\n\n- 不属于Feistel结构\n- 加密、解密相似但不对称\n- 支持128/192/256三种分组长度\n\
