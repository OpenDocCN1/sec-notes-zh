    # # 完全剩余系 Complete Set of Residues


    Zn={0, 1, 2, ..., n-1}


    定义：由同余概念，所有整数在模n中分成n类，以n整除余数为1的数为一类，为2的数为一类，以此类推，将每一类中取一个数作为代表形成的集合。


    # ## 素数：又叫质数，除了1和本身，不能被其他数整除的数


    # ## 公因子：a, b 为整数，整除a的数组成组成集合A，整除b的数组成集合B，C=A∩B，C中的元素称为a和b的公因子。（a，b）表示a和b的最大公因子(gcd，Great
    Common Divisor)，（a，b）=1表示a与b互素


    # ## 既约剩余系Reduced Set of Residues Zn*：在模n的完全剩余系中，若将所有与n互素的数形成的集合


    如：n=10


