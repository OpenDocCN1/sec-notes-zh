    - 明文、密文是0到n-1之间的整数，通常n的大小为1024位或309位十进制数\n\n## RSA算法的实现\n\n- 实现的步骤如下：Bob为实现者\n\
    \  - (1) Bob寻找出两个大素数p和q\n  - (2) Bob计算出n=pq 和 φ(n)=(p-1)(q-1)\n  - (3) Bob选择一个随机数e\
    \ (0<e< φ(n))，满足(e, φ(n))=1\n  - (4) Bob使用辗转相除法计算d=e^-1(mod φ(n))，即ed≡1(mod(p-1)(q-1))\n\
    \  - (5) Bob在目录中（e,n)作为公钥。\n  - (6) (d,n)或者d作为私钥。\n\n- 密码分析者攻击RSA体制的关键点在于如何分解n。若分解成功使n=pq，则可以算出φ(n)=(p-1)(q-1)，然后由公开的e，解出秘密的d\n\
    \n## RSA算法编制\n\n- 参数T={N}；\n- 私钥SK=D；\n- 公钥PK=E；\n\n设：明文M，密文C，那么：\n用公钥作业：M^E mod\
    \ N = C\n用私钥作业：C^D mod N = M\n\n## RSA Example\n\n1. Select primes: \\( p=17 \\\
    , \\& \\, q=11 \\)\n\n2. Compute \\( n = pq = 17 \\times 11 = 187 \\)\n\n3. Compute\
    \ \\( \\phi(n) = (p-1)(q-1) = 16 \\times 10 = 160 \\)\n\n4. Select \\( e : \\\
    gcd(e, 160) = 1 \\; ; \\; \\text{choose } e=7 \\)\n\n5. Determine \\( d: \\; de=1\
    \ \\, \\text{mod} \\, 160 \\, \\text{and} \\, d < 160 \\; \\text{Value is } d=23\
    \ \\text{ since } 23 \\times 7 = 161 = 1 \\times 160 + 1 \\)\n\n6. Publish public\
    \ key \\( KU = \\{7, 187\\} \\)\n\n7. Keep secret private key \\( KR = \\{23,\
    \ 187\\} \\)\n\n## RSA Example cont\n\n- sample RSA encryption/decryption is:\n\
    - given message M = 88 (nb. 88 < 187)\n- encryption:\n  \\[\n  C = 88^7 \\mod\
    \ 187 = 11\n  \\]\n- decryption:\n  \\[\n  M = 11^{123} \\mod 187 = 88\n  \\]\n\
    \n## 加密算法：\n\n假设 M 是明文（M<n），那么密文就是 C=M^e mod n。\n\n## 解密算法：\n\n假设 C 是密文，那么明文就是\
    \ M=C^d mod n。\n\n证明：\n\n（1）由于 C^d = M^ed = M^{k*φ(n)+1} (mod n)。\n\n如果 M 和 n\
    \ 是互素的，显然直接由欧拉定理我们就能得到：\n\nC^d = M^{k*φ(n)}*M^1 = M (mod n) = M。\n\ned≡1(mod(p−1)(q−1))\n\
    \n2）如果 M 和 n 不互素，由于 n 是两个素数 p 和 q 的乘积且 M<n，e*d = 1(mod Φ(n)) = 1(mod (p-1)(q-1))，可以得到：\n\
    \ne*d = 1(mod (p-1)) 且 e*d = 1(mod (q-1))。\n\n则 e*d 可以写成： e*d = k*(p-1)+1，e*d\
    \ = h*(q-1)+1\n\n由费马小定理：\n\nM^e*d = M^k*(p-1)+1 = M(mod p) 和 M^e*d = M^h*(q-1)+1\
    \ = M(mod q)。\n\n所以我们有：\n\nC^d = M^e*d = M (mod p*q) = M (mod n) = M\n\n## RSA\
    \ 的安全性\n\n- 三种攻击 RSA的方法：\n  - 1，强力穷举密钥:尝试所有可能的密钥。因此，e 和d 的位数越大，算法就越安全。然而，在密钥产生和加密解密中使用的计算都非常复杂，所以密钥越大，系统运行越慢。\n\
    \  - 2，时间攻击：依赖解密算法的运行时间，利用 CPU处理某些特殊的模乘比较慢的规律来确定每一位指数\n\n## RSA算法的安全性分析\n\n- 密码分析者攻击RSA体制的关键点在于如何分解n\n\
    - 若分解成功使n=pq，则可以算出φ(n) = (p-1)(q-1)，然后由公开的e，解出秘密的d\n- 若使RSA安全，p与q必为足够大的素数，使分析者没有办法在多项式时间内将n分解出来\n\
    \n素数：只能被1和它本身整除的自然数；否则为合数。\n\n每个合数都可以唯一地分解出素数因子\n6 = 2 · 3\n999999 = 3·3·7·11·13·37\n\
    27641 = 131·121\n从2 开始试验每一个小于等于√27641 的素数。\n\n| 整数n的十进制位数 | 因子分解的运算次数 | 所需计算时间（每微秒一次）\
    \ |\n|-------------------|--------------------|----------------------------|\n\
    | 50                | 1.4x10¹⁰           | 3.9小时                    |\n| 75  \
    \              | 9.0x10¹²           | 104天                      |\n| 100     \
    \          | 2.3x10¹⁵           | 74年                       |\n| 200         \
    \      | 1.2x10²³           | 3.8x10⁹年                  |\n| 300             \
    \  | 1.5x10²⁹           | 4.0x10¹⁵年                 |\n| 500               | 1.3x10³⁹\
    \           | 4.2x10²⁵年                 |\n\n## RSA算法的安全性分析\n\n- 建议选择p和q大约是100位的十进制素数\n\
    - 模n的长度要求至少是512比特，\n- EDI攻击标准使用的RSA算法中规定n的长度为512至1024比特位之间，但必须是128的倍数\n- 国际数字签名标准ISO/IEC\
    \ 9796中规定n的长度位512比特位\n\n## RSA算法的安全性分析\n\n为了抵抗现有的整数分解算法，对RSA模n的素因子p和q还有如下要求：\n\
    \n1. |p-q|很大，通常p和q的长度相同；\n2. p-1和q-1分别含有大素因子p1和q1；\n3. p1-1和q1-1分别含有大素因子p2和q2；\n\
    4. p+1和q+1分别含有大素因子p3和q3。\n\n"
