  - '[PAGE 100]


    # # 密钥置换算法的构造准则


    +   - 设计目标：子密钥的统计独立性和灵活性

    +   - 实现简单

    +   - 速度

    +   - 不存在简单关系：（给定两个有某种关系的种子密钥,能预测它们轮子密钥之间的关系）

    +   - 种子密钥的所有比特对每个子密钥比特的影响大致相同

    +   - 从一些子密钥比特获得其他的子密钥比特在计算上是难的

    +   - 没有弱密钥'
  - '[PAGE 101]


