  - '[PAGE 202]


    从最初一直到现代，几乎所有密码系统都建立在基本的替代和置换工具的基础上。


    在用了数千年的本质上可以手算完成的算法之后，常规的密码学随着转轮加密/解密机的发展才出现了一个重大进步。


    机电式变码旋转软件使得极其复杂的密码系统被研制出来。有了计算机后，更加复杂的系统被设计出来。


    但是不管是转轮机还是后来的 DES（数据加密标准），虽然代表了重要的进展，却仍然依赖于替代和置换这样的基本工具。


    # 密码学历史上唯一的一次真正的革命'
