    +   - AES算法的轮变换中没有Feistel结构，轮变换是由三个不同的可逆一致变换组成，称之为层。

    +   - 线性混合层： 确保多轮之上的高度扩散。

    +   - 非线性层： 具有最优最差-情形非线性性的S-盒的并行应用。

    +   - 密钥加层： 轮密钥简单地异或到中间状态上。

    +   - Rijndael （发音为"Rhine dale"） 作为 AES 算法。'
