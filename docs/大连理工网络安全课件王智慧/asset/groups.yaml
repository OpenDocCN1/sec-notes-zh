  - '[PAGE 172]


    # AES 算法的设计原理


    +   - GF（2^8）中乘法使用的多项式是8次不可约多项式列表中的第一个多项式。

    +   - **ByteSubstitution**（称为S盒）在设计时考虑到抵抗差分密码分析、线性密码分析的要求，应满足以下条件：1. 可逆性；2. 输入比特的线性组合与输出比特的组合之间的最大非平凡相关性的极小化；3.
    异或差分表中最大非平凡值的极小化；4. GF（2^8）中代数表示的复杂性；5. 描述的简单性。'
  - '[PAGE 173]


    满足前3条准则的S盒的构造方法已被给出，AES的作者从众多候选构造中选择将x映射到它的逆的S盒。该映射过于简单，为了抵抗插入攻击，加入仿射变换：


    $$b(x)=(x^7+x^6+x^2+x)+a(x)(x^7+x^6+x^5+x^4+1)$$


    $$\mod\ x^8+1$$


    模数多项式 $x^8+1$ 选择为可能是最简单的模数多项式。


    可以找到其它的S盒满足以上准则。'
  - '[PAGE 174]


    +   • MixColumn变换符合以下准则： 1. 可逆性； 2. GF(2)中的线性性； 3. 适当的扩散性能； 4. 8位处理器上实现速度快； 5.
    对称性； 6. 描述的简单性。选择模数多项式x4+1可满足准则2、5、6。准则1、3、4要求系数的值要小，故选00、01、02 、03。


    +   • ByteRotation符合以下准则： 1. 4个位移量互不相同且C0=0； 2. 能抵抗差分截断攻击； 3. 能抗Square攻击； 4. 简单。
    从满足准则2和准则3出发， AES的作者选取了最简单的组合。'
  - '[PAGE 175]


    # AES的密钥调度


    +   - 轮密钥是通过密钥调度算法从密钥中产生，包括两个组成部分：密钥扩展和轮密钥选取。基本原理如下：

    +     - 所有轮密钥比特的总数等于分组长度乘轮数加1。（如128比特的分组长度和10轮迭代，共需要1408比特的密钥）。

    +     - 将密码密钥扩展成一个扩展密钥。

    +     - 轮密钥按下述方式从扩展密钥中选取：第一个轮密钥由开始Nb个字组成，第二个轮密钥由接下来的Nb个字组成，如此继续下去。'
