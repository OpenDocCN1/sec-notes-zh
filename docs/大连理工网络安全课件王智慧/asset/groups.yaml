    - 所以现在再对要求“强壮”加密的场合已经不再适用了。\n\n## 破译DES\n\n1990年，以色列密码学家Eli Biham和Adi Shamir提出了差分密码分析法，可对DES进行选择明文攻击\n\
    \n线性密码分析比差分密码分析更有效，为了分析DES而提出来的。分析线性部件，容易；非线性部件才是密码分析的主要障碍，因此差分分析和线性分析，集中在非线性部件S盒。\n\
    \n## 数学基础\n\n## 整除性\n\n**定义（整除、倍数、因数）** 设a，b为整数，若存在整数c，使b=ac，则称a可整除b，记作a|b。b叫做a的倍数，a叫做b的因数。若不存在这样的整数c，则称a不能整除b，记作a\
    \ ∤ b。\n\n* 如果b|g，b|h,对于任何整数m和n，则满足b|(mg+nh)。\n\n## 互素\n\n- 定义：\n\n素数：又叫质数，除了1和本身，不能被其他数整除的数\n\
