    # ## 题目描述


    +   - 密码学中有种很有意思的攻击方式叫做生日攻击。其原理是基于这样一个神奇的结论：如果一个房间里有23个人，那么其中两个人生日相同的概率超过50%，当人数上升到40人时，这一概率提高到了89%以上。注意生日相同指的是两个人的出生月份和日期相同，不考虑年份。这个结论听上去很神奇，因为一年有365天，但是，事实上你可以通过概率知识验证这个结论。'
  - '[PAGE 267]


    # 使用散列函数的数字签名算法


    +   - 数字签名算法为公钥密码学算法，计算复杂度很大。

    +     如果直接对消息进行运算，计算开销太大，因此先对消息进行散列运算，计算出定长的比较短的哈希值。这样再继续数字签名，节省计算开销。'
  - '[PAGE 268]


