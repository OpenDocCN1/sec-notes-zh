    # 公钥密码系统的加密原理


    +   - 每个通信实体有一对密钥（公钥，私钥）。公钥公开，用于加密和验证签名，私钥保密，用作解密和签名


    ![](img/09e6564ace8d10cc99172928c514fc45_204_0.png)


    任何人向B发送信息都可以使用同一个密钥（B的公钥）加密


    没有其他人可以得到B的私钥，所以只有B可以解密'
  - '[PAGE 205]


    # 公钥密码体制的加密功能


    +   - A向B发消息X，

    +   - B的公钥为KUb，私钥为KRb

    +   - 加密 Y = E<sub>KUb</sub>(X)

    +   - 解密 X = D<sub>KRb</sub>(Y)'
