    # AES：AES背景-i


    +   - 1997年4月15日，（美国）国家标准技术研究所（NIST）发起征集**高级加密标准（Advanced Encryption Standard）**AES的活动，活动目的是确定一个非保密的、可以公开技术细节的、全球免费使用的分组密码算法，作为新的数据加密标准。

    +   - 1997年9月12日，美国联邦登记处公布了正式征集AES候选算法的通告。对AES的基本要求是：比三重DES快、至少与三重DES一样安全、数据分组长度为128比特、密钥长度为128/192/256比特。'
  - '[PAGE 149]


    # # AES背景-ii


    +   - 1998年8月12日，在首届AES会议上指定了15个候选算法。

    +   - 1999年3月22日第二次AES会议上，将候选名单减少为5个，这5个算法是RC6，Rijndael，SERPENT，Twofish和MARS。

    +   - 2000年4月13日，第三次AES会议上，对这5个候选算法的各种分析结果进行了讨论。

    +   - 2000年10月2日，NIST宣布了获胜者—Rijndael算法，2001年11月出版了最终标准FIPS PUB197。'
