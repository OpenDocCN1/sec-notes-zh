    +   - 思考：


    +   - 计算3*7，和129*5在该域内的数值？'
  - '[PAGE 146]


    3^7=(x+1)(x^2+x+1)=x^3+x^2+x+1（模2运算中，x^4+x=0 and x^2+x^2=0）


    所以3^7=9


    在乘积得出来的多项式次数大于7时，我们需要对多项式在GF(2)上关于h(x)求余数，也就是


    12^95=(x^7+1)(x^2+1)=x^9+x^7+x^2+1


    将上面的函数加上x^n h(x)可以消去x^9（其实就是手工除法过程，只是在每一次商总是0或1），所以


    12^95=x^9+x^7+x^2+1+x^9+x^5+x^4+x^3+x=x^7+x^5+x^4+x^3+x^2+x+1


    =00101111111=191'
