  - '[PAGE 127]


    # # 平面交叉认证模式


    +   - 平面交叉认证模式没有明确的信任中心，各个CA之间是平等的。

    +   - 平面交叉认证模式具有如下些优点：

    +     - 由于具有多个信任点，因此这种模式具有很好的灵活性，如一个CA非常容易加入到该体系中来。属于为分来管理的结构模型；

    +     - 不存在唯一的信任中心，因此当一个信任点出现信任问题之后（如CA1的私钥泄密），不会造成整个PKI体系的崩溃。并且由于每个信任点的用户数相对较少，因此恢复这种信任关系相对容易；

    +     - 可以比较容易的在各个独立的CA之间建立信任关系，即信任链的节点数目最多为加入该信任体系CA的数量；


    +   - 与链式层次模式一样，平面交叉认证模式也同样具有一些缺点：

    +     - 证书验证路径难以确定。因为用户可以有多种选择，比如CA1的用户要与CA2的用户确认相互信任的关系，可以选择两种途径：

    +       - CA1（——）CA2；

    +       - CA1（——）CA3（——）CA2；

    +     - 由于有多种验证途径可供选择，因此容易产生验证路径过长的情况（即实现无法估计验证路径的长度），并且如果存在单方信任的情况下，有些信任路径无法建立双向信任关系。事实上，网状结构的这个缺点恰恰是由于在这种模式中存在多个信任点造成的；

    +     - 在这种模式下的用户必须根据证书中的内容确认该证书能够在什么应用中使用，而不能根据证书是那一个CA签发的来确定。'
  - '[PAGE 128]


    # 3 证书信任列表模式


    +   证书信任列表（CTL）是一份被认证机构数字签名后包含“所信认证机构根证书”列表的PKCS#7数据结构；因为使用了数字签名技术，因此CTL具有一定的抗篡改能力。使用者可以通过该数据结构中的一大串认证机构的数字证书遴选出其所信任的认证机构，同时也可以获得其所信任的认证机构的政策依据（通过CTL中的策略标识符policy
    identifiers指明）。


    +   从PKI领域间互连互通性观点出发，CTL是一个既简单又实用的手段。值得注意的是，在形成可信任的CTL之前，必须先评价和确定CTL的签发机构以及CTL中包含的所有证书中指明的认证机构的可信性。在应用CTL时，需要相关的应用程序（如浏览器）支持CTL的结构和方法。


    +   在实际的应用中，主要存在两种证书信任列表：简单信任列表（Simple Trust List）、扩展信任列表（Extended Trust List）。'
