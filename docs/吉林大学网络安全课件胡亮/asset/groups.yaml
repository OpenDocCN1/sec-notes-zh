    # 信任模型比较


    |  | 分层机构 | 分布式 | 基于信任列表 | 以用户为中心 |

    |---|---|---|---|---|

    | 信任起点 | 根CA | 本地发证CA | 所有接受的可信CA列表 | 信任关系网的起点 |

    | 可信CA私钥泄露所带来的问题 | 毁灭性灾难 | 只影响该CA的用户 | 需要所有用户修改自身配置,否则可能造成欺骗 | 无中心CA |

    | 认证路径构造 | 简单,自上而下 | 难,可能会出现多路径或死循环现象 | 各CA独立可信,无需构造信任路径 | 依靠信任关系网建立 |

    | 对目录的依赖性 | 低 | 高 | 低 | 高,依靠集中查询信任关系 |

    | 对域间互操作的支持 | 弱,需要一方更改自己的信任起点 | 较好,但数量的增加会带来管理上的困难 | 需要所有用户同时操作,可实施性较差 | 以个体为单位形成信任链(不构成域)
