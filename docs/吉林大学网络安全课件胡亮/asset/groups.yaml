    PE类可执行文件，被其感染的程序文件长度增加。此版本中的CIH不具有破坏性。当发展到v1.1版本时，病毒长度为796字节，此版本的CIH病毒具有可判断Windows
    NT操作系统信息的功能，一旦判断运行环境是Windows NT，则不发生作用，进行自我隐藏，以避免生产商提出信息，同时对代码进行优化，缩减了长度。此版本的CIH另外一个特点在于其可以利用WIN
    PE可执行文件中的“空隙”，将自身根据需要分成几段后，分别插入到PE类可执行文件中，这样做的优点是在感染大部分WIN PE类文件时，不会导致文件长度增加。


    其发展到v1.2版本时，除了改进了上述缺陷之外，同时增加了破坏用户硬盘以及用户主机BIOS程序的代码，这使得其步入恶性病毒的行列。v1.2版本的CIH病毒最大的缺陷在于当其感染ZIP自解压文件时，将导致此ZIP压缩包在自解压时出现：

    WinZip Self-Extractor header corrupt.

    Possible cause: disk or file transfer error.

    的错误警告信息。v1.3版本的CIH病毒改进了以上缺陷，它的改进方法是：一旦判断开启的文件是WinZIP类的自解压程序，则不进行感染，同时，此版本的CIH病毒修复了发作时间。v1.4版本的CIH病毒改进了上几个版本中的缺陷，不感染ZIP自解压包文件，同时修改了发作日期及病毒中的版本信息（版本信息被更改为：“CIH
    v1.4 TATUNG”，在以前版本中的相关信息为“CIH v1.x TTIT”），此版本的病毒长度为1019字节。

    '
