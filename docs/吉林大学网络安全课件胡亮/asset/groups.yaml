    ## 对称密钥加密算法的密钥长度


    对称密钥加密算法的主要参数是密钥长度和块长度。密钥的长度对应着算法抵抗密钥穷举攻击的能力。上世纪70年代美国的数据加密标准（DES）算法的密钥长度是56位。随着计算能力提高，DES的加密强度已经不能满足安全的需求，因此在上世纪90年代出现了一批128位密钥长度的算法，其中包括IDEA、RC2、RC5、CAST5和BLOWFISH等。而最新的高级数据加密标准AES的候选算法的密钥长度更是达到了256位以上。


    ## IDEA算法


    IDEA(International Data Encryption Algorithm)是由中国学者来学嘉和著名密码学家James Massey于1990年联合提出，后于1992年修改完成。它的明文与密文块长度都是64位，密钥长度为128位。加密与解密使用相同算法，但使用的子密钥不同。这是与多数分组加密算法不同的。子密钥由算法的128-bit密钥通过密钥扩展生成。IDEA算法的的加解密运算是8重循环。


    ### 4.3 高级加密标准


    1977年颁布的数据加密标准DES算法，其56位长的密钥空间在计算技术高速发展的今天，越来越不适应安全需求。1997年9月美国国家标准技术研究所(NIST)提出了征求新的加密标准---AES（Advanced
    Encryption Standard）的建议，作为一种取代DES的二十一世纪加密标准技术。其目标是：（1）执行速度快；（2）易于设计；（3）从大型计算机到智能IC卡（CPU卡）都可实现。在1998年8月举行的第一次AES会议（AES1）上，宣布了来自12个国家的15种候选AES算法。


    ## 高级加密标准


    1999年8月举行的第二次AES会议（AES2）上，从中筛选出5个候选算法，下边列出了这些算法，每个条目的内容为：算法名，作者，（国家）。


    - (1) **MARS** IBM (美国)

    - (2) **RC6** RSA Laboratories(美国)

    - (3) **Rijndael** John Danemen,Vincent Rijmen(比利时)

    - (4) **Serpent** Ross Anderson(英国),Eli Bihan(以色列), Lars Knudsen(挪威)

    - (5) **Twofish** Bruce Schneier,John Kelsey, Doug Whiting, David Wagner, Chris
    Hall,Nids Ferguson


    经过大量的分析及评估后，NIST最终选择了Rijndael。这是在考虑安全，性能，效率，易用和灵活等诸多方面做的一种权衡选择，正如NIST在其报告中称："将这五种算法的任何一个作为AES都是安全的"。

