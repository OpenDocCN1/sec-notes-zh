    # 5 相互承认模式（Cross Recognition）


    +   - 相互承认的概念由亚太经合组织的电子安全工作组（APEC E-Security Task Group）提出，其将相互承认定义为：“相互承认是一项互通性的协定，通过它可以使依附于某PKI领域的可信团体体能够使用另一个PKI领域的认证信息，达到可以认证其它PKI领域中主体身份的目的，反之亦然。”


    +   - 具体的说，相互承认模式实际上是一种声明（或陈述），它明确的说明了一个给定的PKI领域中的用户可以在其某个特定的应用上面信任一个外部PKI领域的数字证书。如一个团体外部的证书拥有者需要和团体内部的用户进行通信或交易；或者是需要通信或交易的双方在一个团体内部，但是因为特殊的原因他们希望使用一个外部PKI提供的CA服务，即使用外部PKI提供的数字证书。可以看出，两种方式的相互承认模式在技术处理上面没有本质的区别。'
