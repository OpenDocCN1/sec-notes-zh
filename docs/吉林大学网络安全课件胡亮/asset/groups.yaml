    ## 第4章 密码学


    密码学的起源可追溯到人类语言的出现。当人们想确保他们通信的机密的时候，密码学的诞生就是不可避免了。古希腊人的斯巴达人可能是最早有意识地使用一些技术方法来加密信息的人。他们的加密设备是一根叫σκυτάλη的棍子。写信人先将一个纸条绕在棍子上，然后把要写的信在棍子表面上按照与纸条缠绕方向垂直的方向写在纸上，接着将纸条取下，送给收信人。如果不知道棍子的宽度（这里作为密钥）是不可能解密信里面的内容的。后来，罗马的军队用凯撒密码（三个字母表轮换）进行通信。在随后的19个世纪里面，主要是发明一些更加高明的加密技术，这些技术的安全性通常依赖于用户赋予它们多大的信任程度。在19世纪Kerchoffs写下了现代密码学的原理。其中一个重要的原理是：加密体系的安全性并不依赖于加密的方法本身，而是依赖于所使用的密钥。


    ## 实现保密通信必须提供的三种服务


    - 数据保密 传输的信息除了指定的接收者其他人无法解密。

    - 身份鉴别 传输通信的双方能够相互鉴别身份。

    - 保证数据完整性 保证接收者收到的信息与发送者发送的信息相同，并且能够检测到信息被破坏。


    密码学的研究目标就是设计能够实现上述三种服务的各种算法。在本章介绍的算法包括：分组加密算法、公开密钥加密算法、文摘算法。通过组合使用这些算法可全部实现这些服务。


