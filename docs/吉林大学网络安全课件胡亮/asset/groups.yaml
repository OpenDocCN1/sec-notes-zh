- raw:
  - '[PAGE 129]


    # 简单信任列表（Simple Trust List）


    需要交叉认证的PKI领域可以存在多家CA提供PKI服务，每个CA都是单层结构，这些CA之间并没有任何相互信赖的关系。如果采用简单信任列表的模式，使用证书的用户必须自行的在自己的应用中列出自己所信任的的CA的名单。当收到名单上所列的CA签发的证书时，使用者信任该证书并进行进一步的验证操作。如图X机构员工B可依据其信任列表对Y机构的D员工发送的证书进行验证。


    ![](img/3a12b03e666342abc42d27db0d69f39c_129_0.png)'
  - '[PAGE 130]


    # 扩展信任列表（Extended Trust List）


    从简单信任列表模式来看，每一个CA都是单层结构，这实际上与现实应用中的PKI模式并不相同。扩展信任列表与简单信任列表相同之处为，在扩展信任列表中列出的是多个被用户信任的根节点；但是这些根节点代表的是证书用户所信任的PKI架构，而不是单一的CA。扩展信任列表不仅能够快速解决互连互通的需求，也继承了绝对层次模式和平面交叉认证模式的优点；换句话说，证书用户可以继承进行交叉认证的各PKI架构已经建立完成的信任关系，可以大幅度减少证书用户在信任列表中必须列出的可信端点的数量。'
  - '[PAGE 131]


    # 证书信任列表模式的优缺点


    +   - 解决任何两个认证机构（或PKI领域）交叉认证最简单的方式就是采用信任列表（Trust List）的方案。使用证书信任列表模式的最大优点就是单纯性，可以减少寻找信任路径的复杂步骤；即使有新的CA加入时也很容易解决，即只需将新CA加入信任列表即可。


    +   - 证书信任列表模式的最大缺点是，使用者将CA放入其信任列表中的主要动机是为完成对该CA的某一使用者进行沟通和验证该CA签发的证书的需求，而对列于信任列表中的CA本身，并无充分了解与信任。


    +   - 因此，使用信任列表模式的最理想状况是，使用者自己在将新CA加入信任列表之前，必须对该CA进行调查与了解，同时还必须经常性地更新所信任CA的重要信息。随着列表中所列出CA数量的增加，使用者的负担也随之增加。


    +   - 另外，对于简单信任列表模式无法适当的处理列表中具有某个已失效不再运作的CA的情况，这是因为失效CA与使用列表的证书用户所属的CA之间并不存在任何信任关系，该失效CA甚至不知道自己是某使用者的信任对象，因此无法告知该使用者其失效状况，导致一些信任列表的特有者将继续信任该失效CA所签发的证书，直到察觉到问题为止。对于扩展信任列表模式还存在着证书路径的寻找与构造问题。'
  - '[PAGE 132]


    # 4 桥接模式（Bridge Certification Authority, Bridge CA）


    为了弥补绝对层次模式（树状结构）和平面交叉认证模式（网状结构）的缺点，提出了桥接模式解决交叉认证问题。采用桥型结构首先要建立一个CA，该CA称为“桥CA”（BCA—Bridge
    Certification Authority），在不同的PKI体系中，起信任桥梁作用。BCA不直接向用户签发证书，它也不作为PKI体系中用户的一个信任点，只是用它来建立一个端到端的信任关系。这样，就避免了其它两种方式带来的认证策略方面的问题，允许用户保持他们原来的信任点。BCA只是一个信任关系的桥梁。'
  - '[PAGE 133]


    # # 桥接模式示意图


    ![](img/3a12b03e666342abc42d27db0d69f39c_133_0.png)'
  - '[PAGE 134]


    # 桥梁模式的优点


    +   当BCA与树状PKI信任域建立信任关系时，BCA需要与该树状PKI的Root CA进行连结；当BCA与网状PKI信任域建立信任关系时，BCA则只需要与该网状PKI结构中的其中一个CA进行连结。无论上述何种情况，与BCA直接连结的CA称作信任认证机构（Principal
    CA）；通过桥接动作，任何不同PKI架构下的认证机构均可达到相互信任的目的。


    +   桥接模式最大优点就是其具有的“弹性特性”，增加一个CA或甚至一个PKI体系到BCA中是十分容易的，即BCA的扩充十分容易。在BCA架构规模不断扩大情况下，新的信任关系的建立在BCA上面也具备可管理的特性。当架构中有某一节点的Principal
    CA受到损害时，BCA仅需注销发给该Principal CA的认证证书，使其所属的PKI与BCA间的信任关系无效，但此动作并不影响BCA与其它PKI的信任桥接功能。


    +   在BCA失效或无法正常工作的情况下，由于没有使用者以此BCA作为信任源，因此与BCA连结的各个Principal CA仅需注销各自发放给BCA的认证证书，即可终止与BCA的信任关系。这样的结果是，虽然进行桥接的各个PKI架构使用者不再享有桥接互连互通服务，成为独立运作的PKI系统，但每一系统的CA仍可正常运作。当BCA修复后，整个BCA架构即可重新恢复正常的工作状态。这也被称为桥接模式的“单纯性”。'
