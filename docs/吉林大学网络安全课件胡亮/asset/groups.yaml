    - 序列号（32位）：单调递增的计数器的值。用于防范重放攻击。

    - 负载数据（变长）：被保护的原IP负载（传输模式）或原IP报文（隧道模式）。其数据类型由下面的“下一首部”字段指明。加密保护使用的初始向量（IV），也存放在此字段中。

    - 填充（0~255字节）：既可用于帮助满足某些加密算法对明文长度的要求，又可以帮助满足ESP格式本身对从“安全参数索引”到“下一首部”必须是4字节的倍数的要求，而且还可以通过填充起到一定的防范流量分析攻击的作用。

    - 填充长度（8位）：表示填充字段的长度。

    - 下一首部（8位）：指明前面的负载字段中数据的类型。

    - 认证数据（变长）：用于完整性检查的数据信息。长度和所使用的认证算法有关，必须为32位的整数倍。


    ## Internet密钥交换


    - 安全关联可以手工建立和管理。但对于大型网络环境，动态建立和管理的方法可以更具备良好的可扩充性。IPSec利用Internet密钥交换（IKE）协议来动态创建和管理安全关联。它建立在ISAKMP（Internet
    Security Association and Key Management Protocol）和Oakley协议基础上，是两者的混合体。

    - ISAKMP定义了一套标准化的过程和报文格式，用于建立、协商、修改和删除安全关联。报文由ISAKMP首部和一个或多个负载组成。负载类型不仅包括安全关联，还可以是证书、签名等其它类型数据。安全关联的协商、证书的交换和验证等就是通过这些多种负载类型的ISAKMP报文的交换完成的。Oakley是ISAKMP中使用的一种专门的密码交换算法，是Diffie-Hellman密钥交换算法的优化。

    - IKE的协商过程分两个阶段完成。第一阶段协商产生IKE SA，建立安全通道。此阶段可以使用主模式交换，也可以使用野蛮模式交换。后者交换信息量少，速度更快，但不具备抗拒绝服务攻击的能力。第二个阶段在IKE
    SA的保护下协商IPSec SA，建立会话密钥等。此阶段使用快速模式。可以在第一阶段的基础上完成多次第二阶段交换。


