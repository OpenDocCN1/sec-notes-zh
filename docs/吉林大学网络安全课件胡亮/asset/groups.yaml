  - '[PAGE 180]


    # 防火墙的分类


    防火墙有许多种形式，有以软件形式运行在普通计算机上的，也有以固件形式设置在路由器之中的。按照不同的角度可对防火墙做出不同的分类。'
  - '[PAGE 181]


    # 按照软硬件功能分配分类


    软件防火墙 软件防火墙运行于特定的计算机上，它需要客户预先安装好的计算机操作系统的支持，一般来说这台计算机就是整个网络的网关。常用的“个人防火墙”也属于这一类。软件防火墙就像其它的软件产品一样需要预先在计算机上安装并做好配置才可以使用。软件防火墙中具有代表性的产品是Checkpoint。


    硬件防火墙 这里说的硬件防火墙是指“所谓的硬件防火墙”。之所以加上“所谓”二字是针对芯片级防火墙来说的。它们最大的差别在于是否基于专用的硬件平台。目前市场上大多数防火墙都是这种所谓的硬件防火墙，他们都基于PC架构，就是说，它们和普通的家庭用的PC没有太大区别。在这些PC架构计算机上运行一些经过裁剪和简化的操作系统，最常用的有Unix、Linux和FreeBSD系统。值得注意的是，此类防火墙采用的是别人的内核，因此依然会受到操作系统本身的安全性影响。


    芯片级防火墙 芯片级防火墙基于专门的硬件平台。专有的ASIC芯片使它们比其他种类的防火墙速度更快，处理能力更强，性能更高。做这类防火墙最出名的厂商有NetScreen、FortiNet、Cisco等。这类防火墙采用固化于硬件的专用操作系统，防火墙本身的漏洞比较少，不过价格相对比较高昂。'
  - '[PAGE 182]


    # 按照检查协议深度分类


    包（packet）是网络上信息流动的单位，在网上传输的文件一般在发送端被划分成一系列包，经过网络上的中间站点转发，最终到达目的地，然后这些包中的数据又重新组成原来的信息。每个包包括两部分：数据部分和包头，包头中含有源地址和目的地址等信息。防火墙按照其分析网络包的协议深度可分为三种：包过滤防火墙、应用级网关和状态检测防火墙。'
  - '[PAGE 183]


    # 包过滤防火墙


    包过滤通过拦截数据包，检查包头，过滤掉不应转发的信息，放行合法数据包。包过滤器又称为筛选路由器，它通过将包头信息和管理员设定的规则表比较，如果有一条规则不允许发送某个包，路由器将它丢弃。规则表又称为访问控制表（Access
    Control Table）。包过滤规则一般基于网络层之上的部分的或全部的包头信息，例如对于TCP包头信息为：1. IP协议类型 2. IP源地址 3. IP目的地址
    4. IP选择域的内容 5. TCP源端口号 6. TCP目的端口号 7. TCP ACK标识。另外，TCP的序列号、确认号，IP校验和、分片偏移也往往是要检查的内容。


    这类防火墙几乎是与路由器同时产生的。防火墙常常就是一个具备包过滤功能简单路由器，包过滤是路由器的固有功能。包过滤方式是一种通用、廉价和有效的安全手段。之所以通用，是因为它不是针对各个具体的网络服务采取特殊的处理方式，适用于所有网络服务；之所以廉价，是因为大多数路由器都提供数据包过滤功能，所以这类防火墙多数是由路由器集成的；之所以有效，是因为它能在很大程度上满足绝大多数企业安全要求。'
  - '[PAGE 184]


    # 包过滤防火墙


    包过滤对于拒绝一些TCP或UDP应用程序的IP地址进入或离开你的网络是很有 效的。举个例子，如果想 禁止从Internet TELNET 到你的内部网络设备中，
    你需要建立一条包过滤规 则。如果在包过滤防火墙 的默认是允许所有都可访 问，则一条禁止TELNET的 包过滤规则。


    | 规则号 | 功能 | 源IP地址 | 目标IP地址 | 源端口 | 目标端口 | 协议 |

    |---|---|---|---|---|---|---|

    | 1 | Discard | * | * | 23 | * | TCP |

    | 2 | Discard | * | * | * | 23 | TCP |


    包过滤规则


    右表列出的信息告诉路由器丢弃所有从TCP 23端口出去和进来的数据包。星 号说明是该数据的任何值。在上面的例子中，如果一个数据包通过第一条规则时，若源端口为23，那么它将立刻被丢弃。如果一个数据包通过这条规则时，若目标端口为23时，则当规则中的第二条应用时它会被丢弃。所有其它的
    数据包都允许通过。'
  - '[PAGE 185]


    # 状态检测防火墙


    这类防火墙检查的包内容不局限于IP包头，而是深入到更高层协议。状态检测防火墙具有跟踪TCP连接的能力，记录每个连接的状态，根据这些信息对包进行过滤。并且采用动态设置包过滤规则的方法，避免了静态包过滤所具有的问题。这种技术后来发展成为包状态监测(Stateful
    Inspection)技术。状态多层检测允许检查OSI七层模型的所有层以决定是否过滤，而不仅仅是网络层。目前很多公司在它们的包过滤防火墙中都使用状态多层检测，也称为基于内容的过滤。'
  - '[PAGE 186]


    # 代理


    应用代理型防火墙工作在OSI的最高层，即应用层。其特点是完全"阻隔"了网络通信流，通过对每种应用服务编制专门的代理程序，实现监视和控制应用层通信流的作用。代理技术与包过滤技术完全不同，包过滤技术是在网络层拦截所有的信息流，代理技术针对每一个特定服务都有一个程序。代理是在应用层实现防火墙的功能，代理的主要特点是有状态性。通过代理网络管理员可以实现比包过滤路由器更严格的安全策略。代理把网络IP地址替换成其它的暂时的地址。这种方法有效地隐藏了真正的网络IP地址，保护了整个网络。代理还有一个用处。当黑客开始活动的时候，所做的第一件事就是踩点，侦查的网络上的弱点。通常都是利用端口扫描。为了防止暴露有用信息，应该尽可能地隐藏内部系统的配置信息，使之不暴露给潜在的攻击者。代理可以隐藏这些信息，并能对合法用户提供有效的通信。


    在代理型防火墙可分为两个不同的类型。'
  - '[PAGE 187]


    # 应用网关(Application Gateway)型防火墙


    这类防火墙是通过一种代理(Proxy)技术监视并参与一个TCP连接的全过程。从内部发出的数据包经过这样的防火墙处理后，就好像是源于防火墙外部网卡一样，从而可以达到隐藏内部网络结构的作用。这种类型的防火墙被网络安全专家和媒体公认为是最安全的防火墙。它的核心技术就是代理服务器技术。应用级网关能够理解应用层上的协议，能够做复杂一些的访问控制，并做精细的注册。但每一种协议需要相应的代理软件，使用时工作量大，效率不如包过滤防火墙。常用的应用级防火墙已有相应的代理服务器，例如：HTTP、NNTP、FTP、Telnet、rlogin、X-Window等，但是，对于新开发的应用，尚没有相应的代理服务，它们将通过包过滤防火墙和一般的代理服务。应用级网关有较好的访问控制，是目前最安全的防火墙技术，但实现困难，而且有的应用级网关缺乏“透明度”。在实际使用中，用户在受信任的网络上通过防火墙访问Internet时，经常会发现存在延迟并且必须进行多次登录(Login)才能访问Internet或Intranet。常见的一些代理防火墙产品有Axent
    Raptor防火墙和微软Microsoft Proxy Server。'
  - '[PAGE 188]


    # 自适应代理(Adaptive proxy)型防火墙


    +   - 它是近几年才得到广泛应用的一种新防火墙类型。它可以结合代理类型防火墙的安全性和包过滤防火墙的高速度等优点，在毫不损失安全性的基础上将代理型防火墙的性能提高10倍以上。组成这种类型防火墙的基本要素有两个：

    +   - 在“自适应代理服务器”与“动态包过滤器”之间存在一个控制通道。在对防火墙进行配置时，用户仅仅将所需要的服务类型、安全级别等信息通过相应Proxy的管理界面进行设置就可以了。然后，自适应代理就可以根据用户的配置信息，决定是使用代理服务从应用层代理请求还是从网络层转发包。如果是后者，它将动态地通知包过滤器增减过滤规则，满足用户对速度和安全性的双重要求。

    +   - 代理型防火墙的优点是安全性较高，可以针对应用层进行侦测和扫描，对付基于应用层的侵入和病毒都十分有效。而不是像包过滤那样，只是对网络层的数据进行过滤。

    +   - 代理防火墙的最大缺点就是速度相对比较慢，当用户对内外外部网络网关的吞吐量要求比较高时，代理防火墙就会成为内外外部网络之间的瓶颈。因为防火墙需要为不同的网络服务建立专门的代理服务，在自己的代理程序为内、外部网络用户建立连接时消耗大量的处理器和存储资源，所以给系统性能带来了一些负面影响，而且可能容易受到拒绝服务攻击。'
  - '[PAGE 189]


    # 7.2 防火墙结构


    目前比较流行的防火墙结构分别是：双主机型防火墙、主机屏蔽型防火墙和子网屏蔽型防火墙。主机屏蔽防火墙和子网屏蔽防火墙是把路由器和代理服务器结合使用；而双主机防火墙是使用两块独立的网络适配器。'
  - '[PAGE 190]


    # 双主机防火墙


    +   - 双主机防火墙是一种简单而且安全的配置。在双主机防火墙中把一台主机作为本地网和 Internet 之间的分界线。这台计算机使用两块独立的网络适配器把每个网络连接起来。当使用双主机防火墙时，系统管理员必须使主机的路由功能失效，这样，该计算机不能通过软件把两个网络连接起来。


    +   - 双主机防火墙配置的最大缺点是，用户很容易意外地使内部路由有效，并攻破防火墙。'
  - '[PAGE 191]


    # 双主机防火墙


    双主机防火墙是运行一组应用层代理软件或链路层代理软件来工作的。Proxy软件控制数据包从一个网络流向另一个网络。由于主机具有双网络适配器（连接两个网络），这使防火墙可以检测到两个网络上的数据包。防火墙运行proxy软件来控制两个网络上的信息传输，包括两个本地网之间或者一个本地网和Internet之间。


