    解决网络信息安全问题的主要途径是利用密码技术和网络访问控制技术。密码技术用于隐藏传输信息、认证用户身份等。网络访问控制技术用于对系统进行安全保护，抵挡各种外来攻击。


    ## 计算机网络面临的威胁


    计算机网络所面临的威胁大体可分为两种：一是对网络中信息的威胁；二是对网络中设备的威胁。影响计算机网络的因素很多，有些因素可能是有意的，也可能是无意的；可能是人为的，也可能是非人为的；可能是有外来黑客对网络系统资源的非法使用。归结起来，对网络安全的威胁主要有三：


    (1)人为的无意失误：如操作员安全配置不当造成的安全漏洞，用户安全意识不强，用户口令选择不慎，用户将自己的帐号随意转借他人或与别人共享等都会对网络安全带来威胁。


    (2)人为的恶意攻击：这是计算机网络所面临的最大威胁，敌手的攻击和计算机犯罪就属于这一类。此类攻击又可以分为以下两种：一种是主动攻击，它以各种方式有选择地破坏信息的有效性和完整性；另一种是被动攻击，它是在不影响网络正常工作的情况下，进行截获、窃取、破解以获取重要机密信息。这两种攻击均可对计算机网络造成极大的危害，并导致机密数据的泄漏。


    (3)网络软件的漏洞和“后门”：网络软件不可能百分之百的无缺陷和无漏洞的，然而，这些漏洞和缺陷恰恰是黑客进行攻击的首选目标。曾经出现过许多黑客攻入网络内部的事件，这些事件的大部分就是因为安全措施不完善所招致的苦果。另外，软件的“后门”都是软件公司的设计编程人员为了自便而设置的，一般不为外人所知，但一旦“后门”洞开，其造成的后果将不堪设想。


    ## 计算机网络的安全策略


    ### 物理安全策略


    物理安全策略的目的是保护计算机系统、网络服务器、打印机等硬件实体和通信链路免受自然灾害、人为破坏和搭线攻击；验证用户的身份和使用权限、防止用户越权操作；确保计算机系统有一个良好的电磁兼容工作环境；建立完备的安全管理制度，防止非法进入计算机控制室和各种偷窃、破坏活动的发生。


    抑制和防止电磁泄漏（即TEMPEST技术）是物理安全策略的一个主要问题。目前主要防护措施有两类：一类是对传导发射的防护，主要采取对电源线和信号线加装性能良好的滤波器，减小传输阻抗和导线间的交叉耦合。另一类是对辐射的防护，这类防护措施又可分为以下两种：一是采用各种电磁屏蔽措施，如对设备的金属屏蔽和各种接插件的屏蔽，同时对机房的下水管、暖气管和金属门窗进行屏蔽和隔离；二是干扰的防护措施，即在计算机系统工作的同时，利用干扰装置产生一种与计算机系统辐射相关的伪噪声向空间辐射来掩盖计算机系统的工作频率和信息特征。


    ## 访问控制策略


    访问控制是网络安全防范和保护的主要策略，它的主要任务是保证网络资源不被非法使用和非正常访问。它也是维护网络系统安全、保护网络资源的重要手段。各种安全策略必须相互配合才能真正起到保护作用，但访问控制可以说是保证网络安全最重要的核心策略之一。


    ## 入网访问控制


    - 入网访问控制为网络访问提供了第一层访问控制。它控制哪些用户能够登录到服务器并获取网络资源，控制准许用户入网的时间和准许他们在哪台工作站入网。


    - 用户的入网访问控制可分为三个步骤：用户名识别与验证、用户口令的识别与验证、用户帐号的缺省限制检查。三道关卡中只要任何一关未过，该用户便不能进入该网络。


    ## 网络的权限控制


    网络的权限控制是针对网络非法操作所提出的一种安全保护措施。用户和用户组被赋予一定的权限。网络控制用户和用户组可以访问哪些目录、子目录、文件和其他资源。可以指定用户对这些文件、目录、设备能够执行哪些操作。受托者指派和继承权限屏蔽（IRM）可作为其两种实现方式。受托者指派控制用户和用户组如何使用网络服务器的目录、文件和设备。继承权限屏蔽相当于一个过滤器，可以限制子目录从父目录那里继承哪些权限。我们可以根据访问权限将用户分为以下几类：（1）特殊用户（即系统管理员）；（2）一般用户，系统管理员根据他们的实际需要为他们分配操作权限；（3）审计用户，负责网络的安全控制与资源使用情况的审计。用户对网络资源的访问权限可以用一个访问控制表来描述。


    ## 目录级安全控制


    网络应允许控制用户对目录、文件、设备的访问。用户在目录一级指定的权限对所有文件和子目录有效，用户还可进一步指定对目录下的子目录和文件的权限。对目录和文件的访问权限一般有八种：系统管理员权限（Supervisor）、读权限（Read）、写权限（Write）、创建权限（Create）、删除权限（Erase）、修改权限（Modify）、文件查找权限（File
    Scan）、存取控制权限（Access Control）。用户对文件或目标的有效权限取决于以下因素：用户的受托者指派、用户所在组的受托者指派、继承权限、屏蔽取消的用户权限。一个网络系统管理员应当为用户指定适当的访问权限，这些访问权限控制着用户对服务器的访问。八种访问权限的有效组合可以让用户有效地完成工作，同时又能有效地控制用户对服务器资源的访问，从而加强了网络和服务器的安全性。


    ## 属性安全控制


    当用文件、目录和网络设备时，网络系统管理员应给文件、目录等指定访问属性。属性安全控制可以将给定的属性与网络服务器的文件、目录和网络设备联系起来。属性安全在权限安全的基础上提供更进一步的安全性。网络上的资源都应预先标出一组安全属性。用户对网络资源的访问权限对应一张访问控制表，用以表明用户对网络资源的访问能力。属性设置可以覆盖已经指定的任何受托者指派和有效权限。属性往往能控制以下几个方面的权限：向某个文件写数据、拷贝一个文件、删除目录或文件、查看目录和文件、执行文件、隐含文件、共享、系统属性等。网络的属性可以保护重要的目录和文件，防止用户对目录和文件的误删除、执行修改、显示等。


    ## 网络服务器安全控制


    网络允许在服务器控制台上执行一系列操作。用户使用控制台可以装载和卸载模块，可以安装和删除软件等操作。网络服务器的安全控制包括可以设置口令锁定服务器控制台，以防止非法用户修改、删除重要信息或破坏数据；可以设定服务器登录时间限制、非法访问者检测和关闭的时间间隔。


    ## 网络监测和锁定控制


    网络管理员应对网络实施监控，服务器应记录用户对网络资源的访问，对非法的网络访问，服务器应以图形或文字或声音等形式报警，以引起网络管理员的注意。如果非法之徒试图进入网络，网络服务器应会自动记录企图尝试进入网络的次数，如果非法访问的次数达到设定数值，那么该帐户将被自动锁定。


    ## 网络端口和节点的安全控制


    网络中服务器的端口往往使用自动回呼设备、静默调制解调器加以保护，并以加密的形式来识别节点的身份。自动回呼设备用于防止假冒合法用户，静默调制解调器用以防范黑客的自动拨号程序对计算机进行攻击。网络还常对服务器端和用户端采取控制，用户必须携带证实身份的验证器（如智能卡、磁卡、安全密码发生器）。在对用户的身份进行验证之后，才允许用户进入用户端。然后，用户端和服务器端再进行相互验证。


    ## 防火墙控制


    防火墙是一种保护计算机网络安全的技术性措施，它是一个用以阻止网络中的黑客访问某个机构网络的屏障，也可称之为控制进/出两个方向通信的门槛。在网络边界上通过建立起来的相应网络通信监控系统来隔离内部和外部网络，以阻挡外部网络的侵入。


    ## 入侵检测系统(IDS)


    ![](img/3a12b03e666342abc42d27db0d69f39c_361_0.png)


    ## 敏感信息安全


    随着计算机和网络在商业、政府、娱乐和几乎所有日常生活的各个方面的大量使用，导致敏感数据量剧增


    敏感数据指的是这样的数据，如果对它使用得不正确，可能对数据主体或其他有关方造成损害


    关注这些数据的所有权、控制权和正确性成为最重要的研究内容


    除了密码术和安全、数据库系统和数据挖掘等这些在有关领域的重大技术成就，目前尚没有综合的技术框架处理敏感数据问题。在今天这个数据密集的网络世界里，甚至还没有就敏感数据保管者的责任和权利达到广泛的社会共识。


    ## 安全的‘三代’


    ## 安全的‘三代’


    - 第一代安全系统依赖于密码术、可信计算基、鉴别、防火墙、访问控制和其它周边防御阻止入侵者进入。最初是成功的，但对现在的网间环境是不能承受和不切实际的，况且对恶意的内部人员、生命周期威胁、移动代码和可信性未知的产品的广泛使用不能提供足够的防御


    - 第二代安全包括IDS和IPS，仍然不能完全避免攻击成功


    - ITS提供第三代安全，能在这些攻击的整个过程中工作，在系统中构建多层容忍机制，包括实时执行监控器、检测差错和防止其传播、修复损坏和重新分配系统资源让关键功能能优先使用剩余的可信任部件，以及系统功能的降级逐步进行。使用时间、空间和数据冗余，灵活的重组以及实时QoS
    折中提供最后一层容侵


    - ITS宣布进入一个面对恶意内部人员、入侵者和攻击者的可生存性的新时代。第三代安全系统将把安全范例从花费全部代价拒入侵者于门外转变为更划算和承受得起的避免/阻塞、检测和容忍的结合

