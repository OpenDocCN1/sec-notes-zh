  - '[PAGE 59]


    # 文件型病毒


    文件型病毒感染COM文件有两种方法，分别将病毒代码加在COM文件的前部和尾部。在感染的过程中，病毒将COM文件的开始3字节改写为跳转到病毒代码的指令。由于COM文件与执行时的内存映像完全相同，因此被感染的COM文件在执行时将首先运行病毒代码，病毒就在该文件之前抢先夺取了系统控制权。一旦病毒夺取了系统控制权，就开始进行其自身的引导工作。在一般情况下，病毒先将自身驻留到内存中，并为病毒的传染模块和表现模块设置好一定的触发条件，然后，病毒就开始监视系统的运行。完成了这些工作之后，病毒才会将系统控制权交还给用户执行的可执行文件。'
  - '[PAGE 60]


    # 典型病毒及原理


    每一种病毒都有其既定的攻击和传染对象，都有其特定的实现原理、特定的传染方式和危害方式，通过一定的传播渠道对计算机系统实施危害。虽然病毒越来越多，但绝大多数病毒都是模仿其它病毒编写的，这些病毒的传播、感染、加载、破坏等行为特点都可以从已经存在的病毒中找到，作为一般用户不必要、也不可能对每种病毒都作详细的了解。因此，通过分析典型的几种病毒，就可举一反三，触类旁通，快速将新病毒分类，找出查杀方法。'
