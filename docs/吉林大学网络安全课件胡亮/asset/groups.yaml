    # 进程通信原语


    进程通信原语是分布式程序设计语言一部分，用于分布式进程间的通信和同步。通信原语是分布式操作系统内核与服务层之间的接口，是用进程通信协议实现的。集中式计算机系统和紧密耦合分布式计算机系统有共享的存储器，进程之间的通信和同步使用并发程序设计语言，它们使用共享变量。松散耦合分布式计算机系统不使用共享变量，物理上分开的进程之间的通信和同步使用报文交换的方法进行的。在松散耦合分布式计算机系统中，两种基本的实现进程通信的方法是：报文传递（Message
