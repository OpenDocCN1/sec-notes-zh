    # MD5算法


    MD5诞生于1991年，全称是“Message-Digest Algorithm5”，由MIT的Rivest提出，之前已经有MD2、MD3和MD4几种算法。MD5克服了MD4的缺陷，生成128bit的摘要信息串，出现之后迅速成为主流算法，并在1992年被收录到RFC中。MD5算法对输入的信息产生128-bit的文摘，是一种为32bit机器设计的高效安全的文摘算法。虽然MD5已被破解，但仍是我们学习文摘算法的很好实例。'
