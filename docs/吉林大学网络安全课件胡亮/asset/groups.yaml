    # 5.4 无线PKI（WPKI）


    与有线通信相比，无线通信在通信设备的尺寸和使用者的位置上提供更大的便利性。目前为止，无线设备给人们提供的服务还是主要是语音服务。无线应用协议（WAP, Wireless
    Application Protocol）使移动设备可以连入Internet。WAP标准定义了个人无线设备的应用程序框架结构和网络协议，其目的就是给无线设备提供更多的数据服务，如Internet浏览和事务处理等。WAP定义了Internet与无线设备数据传输的标准，因而电子商务也可以使用无线设备作为传输媒介。移动电子商务（Mobile
    Commerce,或M-Commerce）就是使用无线设备的电子商务。WAP协议通过定义无线设备的Internet数据传输标准确保移动商务的安全。移动商务和电子商务都有特殊的安全需求，密码技术和PKI服务可以最大限度地满足这种需求。WPKI（Wireless
    Application Protocol PKI）是有线PKI的一种扩展，是适合无线环境下应用的PKI系统。'
  - '[PAGE 150]


    # 无线PKI与传统PKI的比较


    在WPKI中，代替RA的功能组件是PKI门户（PKI Portal），它是一个网络服务器，与WAP网关类似，其逻辑功能与RA一样，负责把WAP客户的需求转发给PKI中的RA和CA。WML是优化的HTML，WTLS是优化的TLS，WPKI也是对IETF
    PKIX标准的优化，使之更适合无线环境。WPKI与PKI的主要区别体现在WPKI对PKI的优化方面。WPKI对PKI的优化主要有三个方面：编码规则、证书格式、密码算法和密钥，下面分别讨论。'
  - '[PAGE 151]


    # WPKI编码规则


    传统处理PKI需求的发放依赖于ASN.1的基本编码规则（BER，Basic Encoding Rules）和区别编码规则（DER，Distinguished
    Encoding Rules）。BER和DER所需的资源比WAP设备有效运转的资源要多。WPKI协议由WML和WMLSCrypt（WML Script Crypto
    API）实现。在编码和提交PKI服务需求方面，WML和WMLSCrypt中的signText机制确保耗费较少的资源。'
  - '[PAGE 152]


    # WPKI证书格式


    WPKI证书格式的制定者力图减少证书的大小，使之需要更少的存储空间。方法之一就是定义一个新的服务器证书格式（WTLS证书格式），这样与标准的X.509证书相比，WTLS格式证书的长度有很大的减小；另外一个减小证书长度的方法是使用椭圆曲线密码系统（ECC，Elliptic
    Curve Cryptography）。与其它签名方案相比，ECC的密钥长度更小，使用ECC密码系统的证书长度要比其它的小100字节。另外，WPKI也严格限制证书其它数据字段的长度。WPKI证书格式是PKIX证书格式的一个子集。因此，它们的证书在他们之间可以互用。'
  - '[PAGE 153]


    # WPKI的加密算法和密钥


    WAP安全标准也可以支持传统的数字签名方案，如RSA，但由于WAP应用环境中硬件能力的限制，在无线设备上实现它们难以实施。与ECC相比，传统的签名方案需要更多的处理能力、内存和存储空间，因而，ECC密码系统更适合在无线设备中使用。同样强度的密钥（指的不是穷举密钥攻击），ECC的密钥长度（163比特）只是其他方案的六分之一（1024比特）。WAP的安全标准全面支持ECC，并且WAP设备制造商也接受ECC。在穷举密钥攻击的情况下，163比特密钥的安全性当然比1024比特的密钥要低得多。但即使163比特的密钥长度对穷举密钥攻击几乎是绝对安全的。


    无线通信在电子商务中扮演越来越重要的角色，无线环境不再是一个孤立的小岛，WAP标准已经将它和Internet连在一起。不论有线还是无线环境，电子商务的安全都有保证，而PKI总是在电子商务的安全中起到重要的作用。WPKI是传统PKI的一个扩展，包括大多数的PKI的技术和概念。象WAP中所有的安全和应用服务一样，WPKI必须是使用更有效的密码系统和数据传输技术优化了的，以适应个人无线设备硬件运算能力和无线网络的窄带宽。'
