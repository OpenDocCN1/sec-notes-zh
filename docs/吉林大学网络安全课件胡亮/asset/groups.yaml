  md: "\n## IDS和IPS比较3\n\nMarc：IPS能遍及网络和自动保护一个单位的所有可能的攻击点（内部或外部）不受各种类型攻击。\n\nMartin：IPS只提供最基本的功能，仍基于以前的知识阻塞威胁，需要通过预先定义的网上的阻塞点以便执行其任务。我们需要一个普遍深入的系统，使得我们能不仅阻塞我们知道的跨越网上的分散的点，而且能在开始就能执行网络安全策略管理和减少薄弱环节。混合威胁需要具有更多可补救的选项的混合的安全系统。线内入侵阻止是正确方向的第一步，面对普遍深入的威胁，要求基础框架提供比仅仅是点防御更广泛的功能。\n\
    \n## IDS和IPS比较4\n\nMWL：IPS不仅是简单的点防御，不只限于周边防御，而是贯穿整个网络保护核心和内部，定制的硬件就像交换机和路由器一样，提供强大的过滤能力，比简单地阻塞“预先确定的网络模式”作为对已知威胁的反应多得多。\n\
    \n前摄的IPS支持过滤语言，能表达复杂的条件以检测已知和未知的威胁，有时被叫做异常过滤器或漏洞过滤器。能防护任何利用特定漏洞的已知的和未知的攻击。\n\n\
    一个关键部件是过滤器更新服务，当威胁出现时能及时、精确、综合地提供自动保护。\n\nIPS将被集成到交换机和路由器中，以提供嵌入的基础框架安全。新的网络结点将提供包路由/交换功能加上一个智能层，它不仅能决定一个包必须“向哪儿走”，而且能决定是否“应当走”。这种网络将成为更为动态的，不断可适应地滤掉不需要的新的和老的威胁通信流。\n\
    \n## IDS和IPS比较5\n\nMR：IPS技术不是新的。过滤语言已存在，能做的事情与开放源码Snort引擎没有什么重大不同，我们也能检测未知威胁。IPS是点解决方案，与使用时它们怎样深入网络没关系，就像防火墙是点解决方案一样，即使使用时它们也深入今天的网络。真正前摄的安全将是能够从事比只确认发生攻击的条件更多的事情，它将是一个普遍的覆盖网络的智能层，能了解该网络的组成和借助于适当协调各种不同技术以及其固有的检测和阻塞功能执行策略。在威胁产生后果之前，能中途阻止所有可能的攻击携带者，并定义和检测攻击的各种变种。仅依赖于特征的及时更新服务是不够的。特征收集必须是充分全面的，包含网络中的每个设备、平台和应用程序。它必须处理客户端和服务端攻击、随机文件格式和电子邮件附件、加密、分段、客户应用程序和基于硬件的协议分析器不能知道怎样解释的任意协议。真正前摄的安全意味必须在初始地点阻塞可确认的威胁并执行安全策略，以便减少弱点的暴露。前摄的安全解决方案还应当能战胜来自网络上任何点的威胁，不只是事先确定的入出点。大多数IPS公司不顾这些点，引导用户相信传统的、单独的IPS技术能前摄地保护整个网络中的资产。\n\
    \n## IDS和IPS比较6\n\nMWL：可根据漏洞信息而不是利用信息写出很精确的过滤器，即前摄保护的定义：在攻击存在之前及时地和全面地保护客户。这些过滤器先于攻击存在之前，能够前摄地保护任何以漏洞为目标的利用。\n\
    \n软件厂商误传硬件解决方案是固定的和不灵活的。事实是任何硬件设计都可编程或有灵活性。每个协议没必要都由硬件实现，最新技术是建造通用块加速处理指定任务。超过漏洞过滤器，IPS使用网络轮廓描述方法刻画特定网络环境，决定什么是该环境中的正常行为。偏离正常行为就报警、阻塞或扼杀（不需要攻击或漏洞的任何知识）。基于深刻了解网络行为的基线和变化的保护是任何定义下的前摄。我们的IPS已达到这一点，已被广泛测试，已被世界财富500强中的几百家广泛配置。当我们2002年倡导IPS时，IDS厂商一致声称那是不可能的，大多数很快指出误报和延迟将影响网络。具有讽刺意味的是这些问题是由较次的IDS产生的。今天每个IDS厂商都提供IPS，不是所有IPS都是一样，你强调的大多数缺点对这些产品的大多数是真的，但不是全部。\n\
    \n## IDS和IPS比较7\n\n- MR：Sourcefire和广泛的Snort界创造了鉴别以潜在漏洞为目标的威胁技术（而不是简单利用特征）。至于软硬件的辩论，应该知道我们的IPS产品在今天先进网络平台上的性能——在8G上没有延迟。当然我们还能采取比基于硬件方法更快和更有效的方法。Sourcefire没有说过IDS将要灭亡，因为我们没有看到阻止功能的价值。我们知道阻止功能决不是百分之百有效的。你承认需要行为异常检测就恰恰证明这一点。掌握持久的网络资产知识（组成、行为、漏洞、变化）至少与检查针对这些资产的信息流同样重要。我们没有简单地赶时髦，既推荐我们的IPS（获今年RSA展览会最佳入侵解决方案奖），同时也意识到用于广泛的网络威胁的任何过滤技术的局限性。我确信入侵阻止的意义将远远比只是IPS丰富。\n\
    \n## IDS和IPS比较小结\n\n- IPS比IDS功能多\n- 由于in line，要求IPS性能和安全性好\n  - 如果由硬件实现更好，但价格高\n\
    - IPS易用和有效的前提是解决IDS现存的问题\n\n## 入侵阻止(IP)\n\n- 文献15篇\n- 产品评论19篇\n- 研究项目6个，其中一个巴西的HLBR是06年开源\n\
    \n## 入侵追踪与取证\n\n- 可追踪性是一种根据计算机空间中（特别是互联网上）的事件找到现实世界中的制造者的能力，通常要掌握他们，以便追究其行为应负的责任，追踪失败时就表现为匿名。应用领域：追查网络攻击者、网络犯罪者、通过电子邮件发送大量垃圾邮件或有病毒的邮件的机器，有法律意义和经济效益，对电子政务的应用也有重大意义。迄今为止缺少有效的成功方法。有些开源工具。\n\
    - 文献6篇\n\n## 容侵与可靠计算1\n\n容侵（IT，intrusion tolerance）与可靠（信）计算（DC，dependable computing）\n\
    \n- 必要性：有一句名言：“必须找出并修补所有漏洞才能使系统安全，可是只需要找到一个缺陷就能产生一个入侵”。即使IDS检测到入侵，发出响应总是需要一段时间，这段时间受到攻击的服务也是不可信任的，因为警报可能是误报或仅是攻击的瞬间反应。这样，需要一种服务，即使处在各种攻击场景中也能提供特定服务。\n\
    \n## 容侵与可靠计算3\n\n### 从可（信）靠性到容侵\n\n- 可靠性研究界和安全界原来是分开的，但最近开始变得密切起来，彼此交换概念\n- 可靠性是计算机系统的这样一个性质，它提供的服务是可以信赖的\n\
    - 可靠性的属性包括可用性、可靠性（reliability）、安全性、机密性、完整性、可维护性\n- 使用方法包括故障防止，容错，故障消除，故障预报\n-\
    \ 损害包括故障、差错和失效\n- 欧盟项目MAFTIA（因特网应用程序的恶意和意外容错）把可靠性方法应用到安全领域，把入侵和漏洞看作故障，提出以下六个方法：漏洞防止、入侵防止、容侵、漏洞消除、漏洞预报和入侵预测\n\
    \n## 容侵与可靠计算4\n\n### 安全的“三代”\n\n- 第一代安全系统依赖于密码术、可信计算基、鉴别、防火墙、访问控制和其它周边防御阻止入侵者进入。最初是成功的，但对现在的网间环境是不能承受和不切实际的，且对恶意的内部人员、生命周期威胁、移动代码和可信性未知的产品的广泛使用不能提供足够的防御\n\
    - 第二代安全包括IDS和IPS，仍然不能完全避免攻击成功\n- ITS提供第三代安全，能在这些攻击的整个过程中工作，在系统中构建多层容忍机制，包括实时执行监控器、检测差错和防止其传播、修复损坏和重新分配系统资源让关键功能能优先使用剩余的可信任部件，以及系统功能的降级逐步进行。使用时间、空间和数据冗余，灵活的重组以及实时QoS折中提供最后一层容侵\n\
    - ITS宣布进入一个面对恶意内部人员、入侵者和攻击者的可生存性的新时代。第三代安全系统将把安全范例从花费全部代价拒入侵者于门外转变为更划算和承受得起的避免/阻塞、检测和容忍的结合\n\
    \n## 容侵与可靠计算5\n\n### 研究内容1\n\n- 容侵IDS[MAFTIA]：IDS作为分布式系统跟其它分布式系统一样也受到同样威胁，此外还有三个额外的威胁：对手试图在通信通道上篡改，使用DoS攻击对付事件分析器，攻击者已经找到控制事件分析器的方法。提出各种方法对付这三方面的威胁\n\
    - 容侵Web服务：例如项目SITAR\n- 容侵的专用密钥库：斯坦福大学的项目ITTC使用一套共享的服务器结合门限密码术对专用密钥的产生和存储进行保护\n\
    \n## 容侵与可靠计算6\n\n### 研究内容2\n\n- 容侵的鉴别服务（Delta-4）：使用对称和非对称加密技术表示两个变量。集中式鉴别服务器的主要问题是单点失效。补救的办法是把责任分开（适用于对称方案）\n\
    - 容侵的授权和目录服务（Delta-4）：访问控制信息分布于若干服务器以便分布承担责任\n- 容侵的持久文件服务（Delta-4）\n- 容侵组通信服务\n\
    \n## 容侵与可靠计算7\n\n### DARPA的ITS计划\n\n发起“第三代安全”计划保护美国国防部（DoD）的“防御信息基础设施”（DII）。\n\
    \n要点是系统面对信息攻击时具有可生存性和可恢复性，计算机空间的控制和机动性，以及这些性质的评估和确认。\n\n支持一批高级研究和开发项目，特别是有机保证和存活的信息系统（OASIS）计划（包括30个项目），研究容侵和容忍攻击的手段。\n"
  mdcn: "\n## IDS和IPS比较3\n\nMarc：IPS能遍及网络和自动保护一个单位的所有可能的攻击点（内部或外部）不受各种类型攻击。\n\nMartin：IPS只提供最基本的功能，仍基于以前的知识阻塞威胁，需要通过预先定义的网上的阻塞点以便执行其任务。我们需要一个普遍深入的系统，使得我们能不仅阻塞我们知道的跨越网上的分散的点，而且能在开始就能执行网络安全策略管理和减少薄弱环节。混合威胁需要具有更多可补救的选项的混合的安全系统。线内入侵阻止是正确方向的第一步，面对普遍深入的威胁，要求基础框架提供比仅仅是点防御更广泛的功能。\n\
    \n## IDS和IPS比较4\n\nMWL：IPS不仅是简单的点防御，不只限于周边防御，而是贯穿整个网络保护核心和内部，定制的硬件就像交换机和路由器一样，提供强大的过滤能力，比简单地阻塞“预先确定的网络模式”作为对已知威胁的反应多得多。\n\
    \n前摄的IPS支持过滤语言，能表达复杂的条件以检测已知和未知的威胁，有时被叫做异常过滤器或漏洞过滤器。能防护任何利用特定漏洞的已知的和未知的攻击。\n\n\
    一个关键部件是过滤器更新服务，当威胁出现时能及时、精确、综合地提供自动保护。\n\nIPS将被集成到交换机和路由器中，以提供嵌入的基础框架安全。新的网络结点将提供包路由/交换功能加上一个智能层，它不仅能决定一个包必须“向哪儿走”，而且能决定是否“应当走”。这种网络将成为更为动态的，不断可适应地滤掉不需要的新的和老的威胁通信流。\n\
    \n## IDS和IPS比较5\n\nMR：IPS技术不是新的。过滤语言已存在，能做的事情与开放源码Snort引擎没有什么重大不同，我们也能检测未知威胁。IPS是点解决方案，与使用时它们怎样深入网络没关系，就像防火墙是点解决方案一样，即使使用时它们也深入今天的网络。真正前摄的安全将是能够从事比只确认发生攻击的条件更多的事情，它将是一个普遍的覆盖网络的智能层，能了解该网络的组成和借助于适当协调各种不同技术以及其固有的检测和阻塞功能执行策略。在威胁产生后果之前，能中途阻止所有可能的攻击携带者，并定义和检测攻击的各种变种。仅依赖于特征的及时更新服务是不够的。特征收集必须是充分全面的，包含网络中的每个设备、平台和应用程序。它必须处理客户端和服务端攻击、随机文件格式和电子邮件附件、加密、分段、客户应用程序和基于硬件的协议分析器不能知道怎样解释的任意协议。真正前摄的安全意味必须在初始地点阻塞可确认的威胁并执行安全策略，以便减少弱点的暴露。前摄的安全解决方案还应当能战胜来自网络上任何点的威胁，不只是事先确定的入出点。大多数IPS公司不顾这些点，引导用户相信传统的、单独的IPS技术能前摄地保护整个网络中的资产。\n\
    \n## IDS和IPS比较6\n\nMWL：可根据漏洞信息而不是利用信息写出很精确的过滤器，即前摄保护的定义：在攻击存在之前及时地和全面地保护客户。这些过滤器先于攻击存在之前，能够前摄地保护任何以漏洞为目标的利用。\n\
    \n软件厂商误传硬件解决方案是固定的和不灵活的。事实是任何硬件设计都可编程或有灵活性。每个协议没必要都由硬件实现，最新技术是建造通用块加速处理指定任务。超过漏洞过滤器，IPS使用网络轮廓描述方法刻画特定网络环境，决定什么是该环境中的正常行为。偏离正常行为就报警、阻塞或扼杀（不需要攻击或漏洞的任何知识）。基于深刻了解网络行为的基线和变化的保护是任何定义下的前摄。我们的IPS已达到这一点，已被广泛测试，已被世界财富500强中的几百家广泛配置。当我们2002年倡导IPS时，IDS厂商一致声称那是不可能的，大多数很快指出误报和延迟将影响网络。具有讽刺意味的是这些问题是由较次的IDS产生的。今天每个IDS厂商都提供IPS，不是所有IPS都是一样，你强调的大多数缺点对这些产品的大多数是真的，但不是全部。\n\
    \n## IDS和IPS比较7\n\n- MR：Sourcefire和广泛的Snort界创造了鉴别以潜在漏洞为目标的威胁技术（而不是简单利用特征）。至于软硬件的辩论，应该知道我们的IPS产品在今天先进网络平台上的性能——在8G上没有延迟。当然我们还能采取比基于硬件方法更快和更有效的方法。Sourcefire没有说过IDS将要灭亡，因为我们没有看到阻止功能的价值。我们知道阻止功能决不是百分之百有效的。你承认需要行为异常检测就恰恰证明这一点。掌握持久的网络资产知识（组成、行为、漏洞、变化）至少与检查针对这些资产的信息流同样重要。我们没有简单地赶时髦，既推荐我们的IPS（获今年RSA展览会最佳入侵解决方案奖），同时也意识到用于广泛的网络威胁的任何过滤技术的局限性。我确信入侵阻止的意义将远远比只是IPS丰富。\n\
    \n## IDS和IPS比较小结\n\n- IPS比IDS功能多\n- 由于in line，要求IPS性能和安全性好\n  - 如果由硬件实现更好，但价格高\n\
    - IPS易用和有效的前提是解决IDS现存的问题\n\n## 入侵阻止(IP)\n\n- 文献15篇\n- 产品评论19篇\n- 研究项目6个，其中一个巴西的HLBR是06年开源\n\
    \n## 入侵追踪与取证\n\n- 可追踪性是一种根据计算机空间中（特别是互联网上）的事件找到现实世界中的制造者的能力，通常要掌握他们，以便追究其行为应负的责任，追踪失败时就表现为匿名。应用领域：追查网络攻击者、网络犯罪者、通过电子邮件发送大量垃圾邮件或有病毒的邮件的机器，有法律意义和经济效益，对电子政务的应用也有重大意义。迄今为止缺少有效的成功方法。有些开源工具。\n\
