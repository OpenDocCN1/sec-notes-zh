  - '[PAGE 64]


    # CIH病毒特征


    CIH属恶性病毒，当其发作条件成熟时，其将破坏硬盘数据，同时有可能破坏BIOS程序，其发作特征是：


    +   1. 以2048个扇区为单位，从硬盘主引导区开始依次在硬盘中写入垃圾数据，直到硬盘数据被全部破坏为止。最坏的情况下面磁盘所有数据(含全部磁盘分区数据)均被破坏。


    +   2. 某些主板上的Flash Rom中的BIOS信息将被清除。


    CIH病毒属文件型病毒，CIH的原主意是使用Windows的VxD(虚拟设备驱动程序)编程方法，使用这一方法的目的是获取高的CPU权限，CIH病毒使用的方法是首先使用SIDT取得IDT
    base address(中断描述表基地址)，然后IDT入口的3个入口被改动为指向CIH自己的INT 3中断入口程序，再利用自己产生一个INT 3指令运行地址调用CIH自己的INT
    3入口程序，这样CIH病毒就可以获得最高的权限(即环0)。接着病毒将检测到DR0寄存器中的值是否为空，用以判断是否已有CIH病毒驻留，如果DR0值不为0，则表示CIH病毒程序已经驻留，则CIH副本将被恢复先前的INT
    3入口，然后退出(这一特点也可以被用来检测CIH程序，以防止它驻留在内存中，但是当病毒在其它可能的原因后强行退出内存，如果判断DR0为0，则CIH病毒将继续进行，其首先将自己的EBX寄存器的值赋给DR0寄存，以生成驻留标记，然后调用INT
    20中断，使用VxD call Page Allocate系统调用，要求分配Windows系统内存(system memory)，Windows系统内存地址范围为C0000000h~FFFFFFFFFFh，已选用未被系统所使用的内存区域，如果该内存足够大则驻留在内存中，如果该内存不够则分配到内存的内部，假设到地址空间在C0000000h以上的内存区域，如果内存中存在该病毒，则将该病毒文件中的原先部分多段的病毒代码收集起来，并进行组合后放到申请到的内存空间中。完成组合，释放进程后，CIH病毒再次调用INT
    3中断进入CIH病毒的INT 3入口程序，接着调用INT 20中断调用一个IFSMgr_InstallFileSystemApiHook的子程序，用来在文件系统处理函数中挂钩子，以截取文件调用的操作，接着检查IFSMgr_InstallFileSystemApiHook的入口，这样就完成了挂钩子的工作，同时Windows默认于IFSMgr_Ring0_FileIO(InstallableFileSystemManager,
    IFSMgr)服务程序的入口地址是固定的，以便CIH病毒调用，这样，一旦出现要求打开文件的调用，CIH将在第一时间截获该文件，并判断该文件是否为PE格式的可执行文件，如果是，则感染，如果不是，则放过去，将调用链接正确的Windows
    IFSMgr_IO服务程序。


    CIH不会重复多次地感染PE格式文件，同时可执行文件的只读属性是否有效，不影响感染过程。感染文件后，文件的文件日期和时间信息将保持不变。对于绝大多数PE程序感染后，程序的执行长度也将保持不变。因为CIH将把自身成分多段，插入到程序的空域中。完成驻留工作后的CIH病毒将把原先的IDT中断表中的INT
    3入口恢复成原样。'
  - '[PAGE 65]


    # # 爱虫


    +   - “爱虫”病毒是一种蠕虫病毒，是通过OutLook电子邮件系统传播的。邮件的主题为”I Love You”，并包含一个附件。一旦在outlook里打开这个邮件，该脚本就开始运行，将自身拷贝到
    `$windir/win32DLL.vbs ($windir = c:\windows)`、`$systemdir/MSKernel32.vbs ($systemdir
    = c:\windows\system)`、`$windir/LOVE-LETTER-FOR-YOU.TXT.vbs`


    +   - 然后将这些文件加载到注册表中以便在启动时自动运行。接下来它将改变默认的IE浏览页面，通过该页面下载一个可执行的代码，下载完毕后它会将其加入注册表里面且把IE的默认浏览页面更改回about:blank。该系统会自动复制并向地址簿中的所有邮件地址发送病毒。病毒运行后会将你的共享密码及IP地址通过email发送给作者。


    +   - “爱虫”病毒可改写与本地及网络硬盘上面的某些文件。用户机器感染以后，邮件系统将会变慢，并可能导致整个网络系统崩溃。该病毒感染力极强，可寻找本地驱动器和映射驱动器，并扫描你的硬盘及网络共享硬盘，寻找后缀为：`vbs`、`vbe`、`js`、`jse`、`css`、`wsh`、`sct`、`hta`、`vbs`、`jpg`、`jpeg`的文件。当病毒找到有以上扩展名的文件时，用病毒代码覆盖文件原来的内容，并将扩展名修改为vbs，随后删除宿主文件。'
  - '[PAGE 66]


    # 3.3 计算机病毒的检测及清除


    计算机病毒的防治要从防毒、查毒、解毒三方面进行；系统对于计算机病毒的实际防治能力和效果也要从防毒能力、查毒能力和解毒能力三方面来评判。

    "防毒"是指根据系统特性，采取相应的系统安全措施预防病毒侵入计算机。

    "查毒"是指对于确定的环境，能够准确地报出病毒名称，该环境包括，内存、文件、引导区（含主导区）、网络等。

    "杀毒"是指根据不同类型病毒对感染对象的修改，并按照病毒的感染特性所进行的恢复。该恢复过程不能破坏未被病毒修改的内容。感染对象包括：内存、引导区（含主引导区）、可执行文件、文档文件、目录等。


    防毒能力是指预防病毒侵入计算机系统的能力。通过采取防毒措施，可以准确地、实时地监测预警，对经由光盘、软盘、硬盘不同目录之间、局域网、Internet（包括FTP方式、E-Mail、HTTP方式）或其它形式的文件下载等多种方式进行传输的病毒发出警告；能够在病毒侵入时及时发出警报，发现携带病毒的文件，即时清除其中的病毒；对网络而言，能够向网络管理员发送关于病毒入侵的信息，记录病毒入侵的工作站，必要时还要能够注销工作站，隔离病毒源。


    查毒能力是指发现和追踪病毒来源的能力。通过查毒应该能够准确地发现计算机系统是否感染有病毒，准确查找出病毒的来源，并能给出统计报告；查杀病毒的能力由查毒准确率和误报率来评判。


    解毒能力是指从感染对象中清除病毒，恢复被病毒感染前的原始信息的能力；解毒能力应用解毒率来评判。'
  - '[PAGE 67]


    # 计算机病毒检测


    在与病毒的对抗中，及早发现病毒很重要。早发现，早处置，可以减少损失。目前检测病毒方法有：特征代码法、文件指纹法、行为监测法、软件模拟法，这些方法依据的原理各不相同，实现时所需开销不同，检测精度不同，各有所长。特征代码法是当前所有杀毒软件采用的方法，它基本上无法发现新病毒，因此杀毒软件对新病毒的防范始终滞后于病毒的出现。行为监测法是判断可疑程序是否是病毒的动态分析方法。反病毒公司收集到可疑程序时，为了做出准确判断，必须先运行可疑程序，然后再根据程序的行为判断是否是病毒，最后提取新病毒的特征码，加入到病毒特征库中。这些过程一般都是需要人参与的手工查毒方法。'
  - '[PAGE 68]


    # # 文件指纹法


    +   • 对正常文件的内容以及大小、时间、日期等属性计算其校验和或采用摘要算法计算一个文件指纹，并将该文件指纹写入文件或写入别的文件中保存起来。在系统运行过程中，定期地或每次使用文件前，检查从文件当前内容算出的指纹与原来保存的指纹是否一致，从而而发现文件是否被篡改，例如Tripwire。


    +   • 这种方法既能发现已知病毒，也能发现未知病毒，但是，它不能识别病毒的类别，不能报出病毒名称。由于病毒感染不是文件内容改变的唯一的原因，文件内容的改变有可能是正常程序引起的，所以文件指纹法也常常误报警。而且此种方法也会影响系统的运行速度。


    +   • 文件指纹法的优点是：方法简单，能发现未知病毒、被查文件的微细变化也能发现。


    +   • 其缺点是：计算校验和或指纹会增加计算机的计算负担，降低速度，会误报警，不能识别病毒名称，不能对付隐蔽型病毒。'
  - '[PAGE 69]


    # 特征搜索法


    特征代码搜索法是检测已知病毒的最简单、开销最小的方法，它通过采集已知病毒样本检测病毒。病毒如果既感染COM文件，又感染EXE文件，对这种病毒要同时采集COM型病毒样本和EXE型病毒样本。这种方法打开被检测文件，在文件中搜索，检查文件中是否含有病毒数据库中的病毒特征代码。如果发现病毒特征代码，由于特征代码与病毒一一对应，便可以断定被查文件中有某种病毒。目前常见的防杀计算机病毒软件对已知计算机病毒的检测大多采用这种方法。


    采用病毒特征代码法的检测工具，面对不断出现的新病毒，必须不断更新病毒库，否则检测工具便会老化，逐渐失去实用价值。在这种方法中，计算机病毒特征串的选择是非常重要的。短小的计算机病毒只有一百多个字节，长的高上万字节。如果随意从计算机病毒样本中选取一段作为代表该计算机的特征串，则可能在不同的环境下，特征串并不真正具有代表性，不能将计算机病毒查出来，选这种串作为计算机病毒代码库的特征串是不合适的。病毒特征代码法对从未见过的新病毒，自然无法知道其特征代码，因而无法去检测这些新病毒。


    另一种情况是代码串不应含有计算机病毒的数据区，数据区是会经常变化的。代码串一定要在细分析程序之后才选出，而且应该具有代表特性，足以将该计算机病毒区别于其他计算机程序的字节串。选定好的特征代码串是很难容易的，特征库是计算机病毒搜索程序的精华所在。一般情况下，代码串是连续的若干个字节组成的串。但是有些扫描软件采用的是可变长串，即在串中包含有個別几个“模糊”字节。扫描软件遇到这种串时，只要除“模糊”字节之外的串部分能完全匹配，也能判别出计算机病毒。'
