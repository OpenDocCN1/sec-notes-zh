    \n### 目录级安全控制\n\n网络应允许控制用户对目录、文件、设备的访问。用户在目录一级指定的权限对所有文件和子目录有效，用户还可进一步指定对目录下的子目录和文件的权限。对目录和文件的访问权限一般有八种：系统管理员权限（Supervisor）、读权限（Read）、写权限（Write）、创建权限（Create）、删除权限（Erase）、修改权限（Modify）、文件查找权限（File\
    \ Scan）、存取控制权限（Access Control）。用户对文件或目标的有效权限取决于以下因素：用户的受托者指派、用户所在组的受托者指派、继承权限、屏蔽取消的用户权限。一个网络系统管理员应当为用户指定适当的访问权限，这些访问权限控制着用户对服务器的访问。八种访问权限的有效组合可以让用户有效地完成工作，同时又能有效地控制用户对服务器资源的访问，从而加强了网络和服务器的安全性。\n\
    \n### 属性安全控制\n\n当用文件、目录和网络设备时，网络系统管理员应给文件、目录等指定访问属性。属性安全控制可以将给定的属性与网络服务器的文件、目录和网络设备联系起来。属性安全在权限安全的基础上提供更进一步的安全性。网络上的资源都应预先标出一组安全属性。用户对网络资源的访问权限对应一张访问控制表，用以表明用户对网络资源的访问能力。属性设置可以覆盖已经指定的任何受托者指派和有效权限。属性往往能控制以下几个方面的权限：向某个文件写数据、拷贝一个文件、删除目录或文件、查看目录和文件、执行文件、隐含文件、共享、系统属性等。网络的属性可以保护重要的目录和文件，防止用户对目录和文件的误删除、执行修改、显示等。\n\
    \n### 网络服务器安全控制\n\n网络允许在服务器控制台上执行一系列操作。用户使用控制台可以装载和卸载模块，可以安装和删除软件等操作。网络服务器的安全控制包括可以设置口令锁定服务器控制台，以防止非法用户修改、删除重要信息或破坏数据；可以设定服务器登录时间限制、非法访问者检测和关闭的时间间隔。\n\
    \n### 网络监测和锁定控制\n\n网络管理员应对网络实施监控，服务器应记录用户对网络资源的访问，对非法的网络访问，服务器应以图形或文字或声音等形式报警，以引起网络管理员的注意。如果非法之徒试图进入网络，网络服务器应会自动记录企图尝试进入网络的次数，如果非法访问的次数达到设定数值，那么该帐户将被自动锁定。\n\
    \n### 网络端口和节点的安全控制\n\n网络中服务器的端口往往使用自动回呼设备、静默调制解调器加以保护，并以加密的形式来识别节点的身份。自动回呼设备用于防止假冒合法用户，静默调制解调器用以防范黑客的自动拨号程序对计算机进行攻击。网络还常对服务器端和用户端采取控制，用户必须携带证实身份的验证器（如智能卡、磁卡、安全密码发生器）。在对用户的身份进行验证之后，才允许用户进入用户端。然后，用户端和服务器端再进行相互验证。\n\
    \n### 防火墙控制\n\n防火墙是近期发展起来的一种保护计算机网络安全的技术性措施，它是一个用以阻止网络中的黑客访问某个机构网络的屏障，也可称之为控制进/出两个方向通信的门槛。在网络边界上通过建立起来的相应网络通信监控系统来隔离内部和外部网络，以阻挡外部网络的侵入。\n\
    \n## 10.4 网络安全方案\n\n随着计算机技术和通信技术的发展，计算机网络将日益成为工业、农业和国防等方面的重要信息交换手段，渗透到社会生活的各个领域。因此，认清网络的脆弱性和潜在威胁，采取强有力的安全策略，对于保障网络的安全性将变得十分重要。网络管理员在实施一个网络安全方案之前必须考虑以下问题：\n\
    \n- 每个完备的网络系统都应该有一个安全方案；\n- 每个系统的安全方案应该是特有的；\n- 多个部门，包括企业领导、信息专家及普通用户相互交流以建立一个安全方案；\n\
    - 一个安全方案的基本内容在于保护什么而不是如何保护；\n- 在实施安全方案前设计一个周密的计划；\n- 一个安全方案应考虑对冒犯方案可能的解决途径；\n\
    - 安全方案的好坏取决于它的实施效果。\n\n### 安全方案\n\n对于网络管理员来说，对计算机网络安全的兴趣往往取决于他们的风险意识。随着对计算机网络威胁的不断增加，网络管理员必须提供一套网络安全解决方案。组成一个成功安全方案包含若干元素，它们是：\n\
    \n- 标识（Identities）：指系统用以区分不同用户或主机的分类或者命名方案；\n- 认证（Authentication）：主要解决检查那些互相宣称有访问权的问题；\n\
    - 通信认证（Communication authentication）：是指网络用来证明信息确实由真正的发送者发出的，它经常采用数字签名技术实现；\n-\
    \ 通信完整性（Communication integrity）：是网络证明信息是原始信息而未被改动的一种方式；与通信认证类似，它经常采用数字签名技术实现；\n\
    - 授权（Authorization）：判断系统是否授权访问某些数据或函数的一种机制。在一些系统中，操作系统处理目标授权，而其他系统特别是那些使用Kerberos或相似程序的系统，用一个独立的访问服务器处理目标授权；\n\
    - 审计（Auditing）：提供网络系统中进行信息交换的一种记录方法。\n\n当系统管理员实施一种安全方案时，必须确定上述中哪一项是最应考虑的，而后采用适当方案。\n\
    \n### 设计一套安全方案的基本准则\n\n创建一种安全方案意味着设计一种如何处理计算机安全问题的计划，也就是尽力在黑客征服系统以前保护系统。总之，设计一套安全方案涉及以下步骤：\n\
    \n- 确定企图保护的特别的项目。例如，服务器包含重要数据，通过检查用户如何访问数据库，可以以低水平安全措施保护数据库，而以高水平安全措施保护数据库内记录。\n\
    - 确定保护数据库是针对谁和什么事件的，例如试图保护的是一个公司内销售人员的记录。\n- 确定信息窃取人的可能状况，如果一个公司在市场上影响较大，就应该对外部黑客加强防范。\n\
    - 保护的方案应是有效率的，口令保护、加密保护和防火墙等措施都是有效率的保护。\n\n定期不断重复此过程，尤其是系统升级或修改配置时应及时修改安全方案。\n\
    \n### 建立一个安全方案\n\n- 开发一个正式的安全方案的目标是定义一个组织中的计算机和网络的正确使用，而且方案需要指明防卫安全事故的程序和发生安全事故的解决程序。在建立一个安全方案之前，首先需要进行风险评估。\n\
    \n- 风险评估涉及到应保护什么、如何保护等。这是分析风险和划分其危害程度的一般过程，风险评估过程涉及对保护对象的解决方法。下面两个因素在风险分析时必须考虑：\n\
    \    - 确定资产大小\n    - 确定风险大小\n\n- 建立的安全方案对每个资产都应进行完整有力的保护，而对每个风险应该确定风险如何影响安全性及如何防卫。\n\
    \n- 完成系统风险评估之后，应确定基于风险评估之上的安全方案。设计的安全方案应解决如下几个问题：\n    - 用户对资源的使用权限；\n    - 每个资源的正确使用；\n\
    \    - 谁被授权允许他人访问和提高资源使用率；\n    - 谁有系统管理权；\n    - 用户的权限和职责；\n    - 系统管理员与一般用户的权限与职责之区别；\n\
    \    - 如何保护重要的数据，有区别于保护普通数据。\n\n## 10.5 企业网络安全整体解决方案\n\n作为Internet上最活跃的单位，企业网络的安全一直是人们关注的重点。如何设计一套完善的方案来解决企业网络的安全问题，是网络安全的重点问题。\n\
    \n### 安全风险分析和安全策略\n\n- 首先，应该对企业网络中的安全隐患进行全面的分析。企业网络中的风险包括物理安全风险、系统风险、网上业务风险和数据风险等几方面。风险分析可以采取定量风险分析和定性风险分析相结合的方法，特别要注意正确全面的进行资产评估。\n\
    - 然后，根据风险分析结果，制定相应的安全策略。制定策略时要遵循以下几个原则：策略的系统性，从企业网络全局统筹策划，避免各自为战；策略的层次性，安全策略应该是自顶向下的，分层规划；策略的完整性，要考虑到管理、技术和保障等不同方面；策略的机动性，为适应信息系统自身的发展和完善，安全策略要保持随之更新的机动性，更好地满足系统的安全需要。\n"
  mdcn: "\n## 访问控制策略\n\n访问控制是网络安全防范和保护的主要策略，它的主要任务是保证网络资源不被非法使用和不正常访问。它也是维护网络系统安全、保护网络资源的重要手段。各种安全策略必须相互配合才能真正起到保护作用，但访问控制可以说是保证网络安全最重要的核心策略之一。\n\
    \n### 入网访问控制\n\n- 入网访问控制为网络访问提供了第一层访问控制。它控制哪些用户能够登录到服务器并获取网络资源，控制准许用户入网的时间和准许他们在哪台工作站入网。\n\
    \n- 用户的入网访问控制可分为三个步骤：用户名的识别与验证、用户口令的识别与验证、用户帐号的缺省限制检查。三道关卡中只要任何一关未过，该用户便不能进入该网络。\n\
    \n### 网络的权限控制\n\n网络的权限控制是针对网络非法操作所提出的一种安全保护措施。用户和用户组被赋予一定的权限。网络控制用户和用户组可以访问哪些目录、子目录、文件和其他资源。可以指定用户对这些文件、目录、设备能够执行哪些操作。受托者指派和继承权限屏蔽（IRM）可作为其两种实现方式。受托者指派控制用户和用户组如何使用网络服务器的目录、文件和设备。继承权限屏蔽相当于一个过滤器，可以限制子目录从父目录那里继承哪些权限。我们可以根据访问权限将用户分为以下几类：（1）特殊用户（即系统管理员）；（2）一般用户，系统管理员根据他们的实际需要为他们分配操作权限；（3）审计用户，负责网络的安全控制与资源使用情况的审计。用户对网络资源的访问权限可以用一个访问控制表来描述。\n\
