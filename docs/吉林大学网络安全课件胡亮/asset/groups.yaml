    ## 敏感信息安全3


    - PORTIA 是个五年、多单位、多学科、多模式的研究项目，综合研究网络世界中的敏感数据。参加单位有Yale和Stanford等五个高校、技术公司、用户代表和政策机构

    - 主要研究内容有分布系统和网络中敏感数据的管理、机密保护和安全协议、使用可信平台管理敏感信息(特别是版权著作)、身份保护等


