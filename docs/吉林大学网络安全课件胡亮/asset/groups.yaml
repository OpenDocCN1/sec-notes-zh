    \  - 简单。\n- Rijndael之所以最后当选是由于它集安全性、性能、效率、可实现性以及灵活性于一身。\n\n## 4.4分组加密算法的高效实现技术\n\
    \n- 加密算法的两个重要指标是加密强度和速度。加密强度是算法的基本性质，是算法抵抗各种攻击的能力。在大多数应用中，在保证一定加密强度的前提下，加密/解密的速度是最重要的性质，尤其是对于要求较高速度的应用。\n\
    \n- 加密强度在算法的设计阶段已经确定，算法的不同实现一般不会对加密强度产生影响。而同一加密算法的加/解密速度在不同的实现中则可能有很大不同。加密速度在根本上由算法本身的设计决定，但在实现中可以使用各种优化技术最大限度地发挥算法速度的潜力。本节研究在算法确定情况下提高算法速度的实现方法，不涉及新算法设计问题。\n\
    \n## 加密算法及其实现环境的特性\n\n### 加密算法的一般计算特征\n\n对称密钥加密算法包括两个部分：密钥扩展和加解密。密钥扩展是将初始密钥扩展为加密函数使用的子密钥。在一般的应用程序中基本操作是加密循环，加密循环中的操作都是整数运算，包括加减乘除、移位、异或、查表等，很多加密算法还使用S-box和P-box等内部表。有些算法执行时间与明文、密钥长度相关，有些算法与之无关。\n\
    \n### 当代CPU的特征\n\n在以Intel Pentium为代表的当代CPU中采用了许多巨型计算机的先进技术，包括指令流水线、超长整数等。在算法的软件实现中应该充分利用这些特性提高速度。对于Pentium系列CPU，它拥有两条整数运算流水线，能在同一时钟周期内同时执行两条整数运算指令，如果程序设计得当，使得相邻的指令不相关，就能提高速度。编译器会作一些优化工作，但很有限。如果在程序设计时，针对加密算法和CPU的特征进行一些手工优化，则会产生更好的效果。\n\
    \n### 语言的选择\n\n与其他高级语言相比，C语言编译生成的可执行码常常具有较高的执行效率，而且在可移植性方面具有极大的优势，在几乎所有的平台上都有ANSI\
    \ C编译器，并且技术成熟，相互间的兼容性也很好。对于不同的机器很少的某些程序段分别编写，大部分程序不必重写即可实现跨平台使用。著名的SSLeay就是用C语言编写的。汇编语言具有适合编写高速程序的特点，但对不同的机器需重新编写程序。JAVA语言的跨平台能力使得它非常适合某些应用场合。尤其是在瘦客户机系统的安全通信中，JAVA加密包是一个有效的解决方案。\n\
    \n## 提高算法速度的原则\n\n通过对加密算法的特点以及机器的特性的分析和实验归纳，可总结出以下提高算法速度的实现原则：\n\n1. **展开加密循环和函数**\n\
    \n加密算法的大部分运行时间是执行加密循环。展开加密循环实际上是将加密循环变为多个循环体中的程序模块，同时将加密循环中调用的函数展开。这样减少了很多条件转移指令和计算指令，并且将许多变量变为常量。而且由于\
    \ Pentium CPU 采用了指令流水线、超标量等技术，循环和变量替换会造成指令流水线的阻断和指令预取的作用，展开加密循环能减少流水线的阻断和指令预取的产生，而且变量变为常量使得相应的指令变为速度更快的指令，大大提高速度。这种方法的缺点是增大了程序的长度。\n\
    \n2. **在内部循环中避免使用条件跳转指令**\n\n在 Pentium 中，条件跳转会对程序的执行效率有重要的影响。条件跳转指令会产生不可预见的指令流，容易分枝预测的失败，从而浪费大量指令周期。在\
    \ C 语言中 for 和 if/then/else 等语句都会产生条件跳转指令。在加密算法内部循环中应该避免使用条件跳转指令。\n\n3. **变址长度与\
    \ CPU 内部寄存器长度相同**\n\n对于 Pentium 等 32 位 CPU，程序中的数组和变量，如整钥和中间结果等，无论在算法描述中是 16 位或\
    \ 8 位，在实现中都应定义为 32 位。因为数据类型与 CPU 内部长度不同，将使得变量的存取都需要附加其他的指令，增加了程序长度和指令周期。根据实际测算，在\
    \ IDEA 算法的实现中用 16 位中间变量的程序比用 32 位中间变量的程序速度慢近一倍。\n\n4. **限制变量的数量**\n\n在 Pentium\
    \ CPU 中只有 7 个通用寄存器，如果内部加密循环中有太多的变量，它们就不会被存入寄存器中，而存入内存。内存操作与寄存器操作相比是很浪费时间的，因此应减少变量的数量以减少内存操作。另外算法中的常量不要定义为变量。\n\
    \n5. **避免使用耗时的指令**\n\n在 Pentium CPU 中，/、右移指令、乘法指令、除法指令占用很多指令周期，而且左/右移等指令不能与任何其它指令配对形成流水，阻断了流水线。因此在特性上这些指令主要用于提高加密过程中的执行周期。在加密算法中为了获得安全性使用了大量乘法、移位操作，在实现中应尽量避免使用耗时的指令实现这些操作。\n\
    \n以上这些原则可应用于不同的语言编程，对于 ANSI C、汇编、JAVA 都能起到提高性能的效果。\n\n## 性能评测\n\n针对加密算法以及当代CPU的特征提出的加密算法实现的优化原则在实践中取得了很好的加速效果。对于各种语言的算法实现都能取得速度上的提高。我们将这些原则应用于SSLeay之中，比较了采用三种编程方式的加密速度。\n\
    \n| 算法编程方式 | RC2 (改进%) | RC5 (改进%) | IDEA (改进%) |\n|---|---|---|---|\n| 优化 | 3323.54\
    \ (--) | 22550.62 (--) | 5295.84 (--) |\n| SSLeay | 3030.57 (9.7) | 16644.68 (35.5)\
    \ | 4957.81 (6.8) |\n| 未优化 | 1736.05 (91.4) | 14768.68 (52.7) | 2868.88 (84.6)\
    \ |\n\n## 4.5 公开密钥加密算法\n\n1976年Diffie 和Hellman 在\"密码学新方向\"一文中首次提出公开密钥加密的概念。开创了密码学最引人入胜的研究领域。公开密钥加密相对于传统的对称密钥加密来说是一个重大突破。它解决了对称密钥算法所不能解决的密钥传输问题\n\
    \n从提出到现在对公开密钥加密系统的研究一直是密码学的热点。自七十年代以来多种公钥加密算法被提出出来，其中包括背包算法、RSA算法、椭圆曲线算法以及我国学者陶仁骥等人提出的有限状态机算法等。这些算法都是基于一些数学问题的难解性。随着时间的推移，一些公钥加密算法已被攻破，另有很多算法被证明还只具有理论的价值而难以应用于实际。目前，只有三类公钥加密系统被认为是既安全又高效。这三类算法基于的数学困难问题为：\n\
    \n- ◆ 整数分解问题(Integer factorization problem)\nRSA, Rabin-Williams和 K. I. T.\n\n\
    - ◆ 离散对数问题(Discrete logarithm problem)\nDSA, DH和ELGamal.\n\n- ◆ 椭圆曲线上的离散对数问题(Elliptic\
    \ curve discrete logarithm problem)\n椭圆曲线上的DSA, DH和ELGamal。\n\n## RSA算法\n\n- RSA算法是第一个公开加密体制，既能用于加密也能用于数字签名。它所依据的数论中著名的Euler定理。RSA算法的设计思想是使加密和解密使用不同的密钥，而且保证从某种任一公钥出发，都没有有效的方法推出另一个密钥。这样每个用户就可以生成自己的一对密钥，并将一个密钥公布出去作为公开号钥E，另一个作为私人密钥D。现举例说明公开密钥加密的执行过程：\n\
    - 当用户A要向B发送信息m时，用B的公开密钥Eb加密m，将密文发送给B，B就可以用自己的私有密钥Db解密出明文。由于用B的公开密钥加密的信息只能用B的私有密钥才能解密，所以即使密文被另一用户C窃取，C也无法解密出明文。\n\
    - 我们也完全可以颠倒和钥匙的起码这个过程。首先用户B送给每一个发信者自己的“公开密钥”——一把锁，锁的钥匙只有B拥有，即为B的“私有密钥”。在当用户A要向B发通信件时，A用B的锁将信件锁进一个信箱里，将这个信箱发送给B，B就可以用自己的钥匙打开信箱得到信件。对于窥探者C即使拥有锁，也无法打开锁上的锁，因此即使截获信箱也无法得到信件。同样发信人A也无法打开自己锁上的信箱。\n\
    - 这个过程的逆过程可用签名，如果A要发一封公开信，他需要在信上签名以表明信是他本人发出的。首先A拥有一些锁，称为签名锁，及给所有其它人开锁的钥匙，但只有A拥有锁。A将公开信用锁在锁在信箱里，发给每个人。由于只有A拥有锁，因此若钥匙能打开锁，则确实就是A的签名，里边的信息当然是A放入的。虽然锁必须只能用一次，否则锁就不只是A拥有了。其他人由于没有A的签名，因此无法伪造签名存信。\n\
    \n## 4.6 文摘算法\n\n文摘算法是一种单向函数，对任意长度的输入信息文摘算法都产生一个固定长度的文摘。文摘函数有如下特点：\n\n- 1. 对于给定的数据，其文摘很容易计算。\n\
    - 2. 不同输入产生相同文摘的概率极小。\n- 3. 给定一个文摘，寻找能产生此文摘的信息非常困难。\n\n第一个特点保证对于不同输入信息，文摘函数都将产生不同的文摘，这使得文摘同输入建立了近似的一一对应的关系。第二个特点保证了伪造文摘是非常困难的。这两个特点使得文摘函数非常适合维护数据的完整性。因此加密系统中都应用文摘函数保证数据完整性。\n\
    \n到目前为止已有很多文摘算法被提出出来，包括：HAVAL-128、MD4、MD5和RIPEMD以及SHA系列算法，目前应用最广泛的是MD5和SHA-1算法。其中HAVAL-128、MD4、MD5和RIPEMD以及SHA-1已被山东大学王小云教授破解。Lenstra利用王小云教授的方法，伪造了符合X.509标准的数字证书，这说明MD5的破解已经不只是理论上的成果。SHA被认为比MD5更加安全。对SHA-1的研究仍是理论破解，并未像MD5那样已经有实际应用的例子。\n"
