    - 超文本传输协议（HTTP）是Web客户端与服务器之间的通信语言，它规定了客户端和Web服务器之间交换信息的格式和含义。HTTP是一种请求-响应协议，即客户端发送HTTP请求给服务器，然后服务器返回相应的HTTP响应信息。HTTP是一种无状态协议，客户端和服务器独立地处理消息交换，并不要求维持任何状态信息。\n\
    \n## 大规模网络下的信息安全\n\n2007.3.24\n\n## 背景\n\n传统的入侵检测系统主要是对个别主机或局域网络范围内入侵行为的检测和反应(Response)，但随着网络的互连和广泛应用，尤其是Internet的发展，入侵检测系统也面临许多新的问题，主要有：\n\
    \n- 网络覆盖的范围越来越大，如Internet已经遍布全球，攻击者完全可以从入侵检测系统所处的管辖域外展开攻击，而IDS却无能为力。\n- 网络带宽增长迅速，千兆（GB）局域网十分普遍，千兆广域网也已经出现（如GBIP），集中式的入侵数据收集与分析已成为系统检测性能的瓶颈，不可避免地会出现漏检，从而导致系统性能的下降。\n\
    - 网络新技术的采用，如虚网技术(Virtual LAN)、VPN(Virtual Privacy Network)技术、数据加密技术和交换网络技术的采用限制网络数据包的监听范围。\n\
    - 系统的弱点和漏洞分散在网络的各个主机上，入侵检测所依赖的数据来源分散化，搜集原始的检测数据变得困难。\n- 入侵行为呈现协作(Coordinated)、分布、自动、隐蔽、大规模等特点，如协作攻击(Coordinated\
    \ Attack)[E1]、分布式拒绝服务攻击(DDOS)、地理分布的SWEEP攻击[E13]、自动执行的“脚本小子”攻击（script kiddies）[C2]等，而依靠唯一的主机或网络很难发现入侵行为。\n\
    \n在这种情况下，分布式入侵检测系统(dIDS—distributed Intrusion Detection System)应运而生，标志性事件是1991年DIDS\
    \ (Distributed Intrusion Detection System)系统的提出[E2]。\n\n## DIDS发展的三个主要阶段\n\n-\
    \ 简单分布阶段，主要解决在大规模网络环境下多数据源采集的问题。\n- 等级结构(Hierarchical Structure)阶段，重点研究系统分析功能的分布化问题。\n\
    - 合作阶段，重点研究跨域的多个IDS系统间合作的问题，包括在统一管理机构之中的分布在多域的多个IDS系统之间合作的问题和在无集中管理机构的区域内多域间的多个IDS合作的问题。\n\
    \n## 当前DIDS系统主要的研究方向\n\n- DIDS系统结构的研究\n- 入侵检测技术研究\n- 降低网络负载方面的研究\n- 入侵报警和反应方面的研究\n\
    - IDS系统间协调与合作方面的研究\n- 容侵系统与灾难恢复技术研究\n\n## 入侵检测与响应(ID&IR)\n\n- 漏洞检测与风险评估\n- 入侵检测方法和工具\n\
    - 入侵阻止\n- 入侵追踪与取证\n- 容侵与可靠计算\n\n## 警报关联\n\n从Anderson报告(Computer security threat\
    \ monitoring and surveillance.1980)算起，入侵检测的研究已进行了20多年，但入侵检测技术还远不完美：\n\n- 大批误报信号\n\
    - 不能很好检测新型攻击或已知攻击的变种\n- 侧重于检测底层攻击或异常，不能扑获攻击的逻辑步骤或策略\n\n从而IDS通常产生一大批警报。在入侵活动很强烈的场合,真的警报与大批误报混在一起,警报数量之大根本无法处理。结果,用户或入侵响应系统很难了解这些警报后面的入侵情况以及采取相应措施\n\
    \n## 警报关联\n\n大多数入侵都不是孤立的，它们作为攻击序列的不同阶段是相互关联的，前一阶段是下一阶段的准备。换言之,通常一系列攻击后面存在着逻辑步骤或策略\n\
    \n## 警报关联方法\n\n- 第一类方法是根据警报属性之间的相似性把警报进行关联。对聚类相似警报（例如具有相同IP源地址和目的地址的警报）是有效的，但不能完全揭示相关警报的因果关系\n\
    - 第二类方法是根据用户说明或从训练数据集学习的攻击场景进行警报关联，局限于知道攻击场景，或可从已知的场景产生的那些，这类方法的一个变种使用推理机制说明一个给定的攻击后面可能跟着哪一类攻击\n\
    - 第三类方法目标在于识别多阶段攻击，如果后来的警报的先决条件被较早的警报的因果关系所满足，则它对那些警报实现关联。这种方法能潜在地揭示警报之间的因果关系，而且不限于已知的攻击场景\n\
    \n## NCSU项目\n\n### 使用前提和结果的入侵警报关联 1\n\n- 开发一个用于警报关联的形式（化描述）框架，能处理攻击企图和把警报关联起来（只要这些警报之间出现连接征兆，即使某些相关攻击失败或绕过IDS）。提供一个直观机构，通过警报关联描绘攻击场景\n\
    - 开发一套交互式实用程序，帮助分析非常大的攻击场景。这些程序减少了大型攻击场景的尺寸 (但仍保持该攻击的结构), 或从大攻击场景中抽取挑选的特征\n\n\
    ## NCSU项目\n\n### 使用前提和结果的入侵警报关联2\n\n- 开发一个用于入侵警报分析的工具TIAA，它把警报关联方法和分析程序集成到一个系统中，以支持交互式入侵检测分析\n\
    - 进行一系列实验，使用2000 DARPA入侵检测场景指定数据集和网络数据流验证警报关联方法和分析程序。结果表明，不仅关联了相关警报和揭示了攻击策略，而且还提供了一个区分警报的方法，交互分析程序能有效地简化对大数量警报的分析工作\n\
    - 本项目包含文献11篇和软件一套\n\n## 警报关联\n\n- NCSU（北卡洛里纳州立大学）项目：\n  - 使用前提和结果的入侵警报关联\n- 文章25篇、PPT5篇、专著一本\n\
    - 国内相关研究7篇\n\n## IDS和IPS比较1\n\n- 检测和响应\n- 线内和线外\n- 软硬件\n\n## IDS和IPS比较2\n\n- 大辩论：‘入侵阻止系统能根本改进安全还是只是另一个部分解？’\
    \ InfoWorld,05年5月\n- 从来没有任何话题像‘入侵阻止’这样发生的激烈辩论. TippingPoint（3Com）的CTO, Marc Willebeek-LeMair,和Sourcefire创始人兼CTO(也是Snort发明者)Martin\
    \ Roesch持相反观点.前者极力宣扬他们的IPS的效果，后者认为自己的IPS只是一个整体网络防范系统的组成部分.他们的辩论很好地展现了网络保护技术现状和软硬件厂商的竞争\n"
  mdcn: "\n## 设计安全解决方案\n\n设计安全解决方案时，要充分考虑到企业安全的各个方面，在安全策略的指导下，灵活设计一个符合自身情况的方案。一般来说，应该注意以下几个方面：\n\
    \n1. 物理安全\n\n物理安全主要考虑的是可能影响企业网络信息的保密性、完整性和可用性的物理环境和周边设施中的安全因素。一般来说，物理安全的隐患主要来自以下七个方面：温度,气体,液体,有机体,射弹,运动,能量异常\n\
    \n2. 系统安全\n\n对于企业的联网环境来说，要考虑到联网系统中可能存在的多方面问题。通常可以分为三个层次：\n\n- 网络系统安全；考虑网络各层中的安全隐患；\n\
    - 操作系统安全；考虑和操作系统密切相关的隐患；\n- 应用系统安全；考虑应用软件系统中的安全隐患。\n\n3. 网上业务的安全\n\n网上业务是企业网络的重要组成，也是企业网络安全的重点。它主要考虑支撑企业网上业务的技术和管理上的问题，比如电子商务中的认证管理。\n\
    \n4. 数据安全\n\n主要是数据库安全和数据安全。对于数据库的安全，不仅要积极利用数据库管理系统自带的安全机制，还应结合其它安全管理手段，更好地完善数据安全保护。\n\
    \n总之，对于企业网络安全管理来说，要切实注意从安全管理入手，以安全策略为指导，来进行整体方案的设计。从实质上说，安全不是一个技术问题，而是一个技术解决方案基础上的管理问题。\n\
    \n## 课程名称：网络安全\n\n主讲教师：胡亮\n\nEmail:hul@jlu.edu.cn\n\n## 第11章 Web 安全\n\n自从1991年第一个Web浏览器和服务器诞生以来，Web就以一种惊人的速度不断发展。到90年代末，Web流量已占互联网通信量的75%。在当前的互联网上，无论从服务器的数量和网络信息流量来说，Web服务都占有绝对的优势。\n\
    \n### 11.1 Web简介\n\n- Web服务是一个基于客户端-服务器模型的分布式的超文本信息系统。它包括三个主要的语义部件：统一资源标识符（URI）、超文本标记语言（HTML）和超文本传输协议（HTTP）。\n\
    - 统一资源标识符（URI）是一个通用的命名机制，用来标识Web上的资源。在不同的时间，应用到URI上的请求方法会产生潜在不同的响应。请求方法指一种简单的操作，如读取、更改或删除某资源等。通常一个URI包括三个部分：用于与服务器通信的协议（如http、ftp等）、服务器名称（如www.target.com）和服务器上的资源名称（如homepage.html）。最常见的一种URI形式是统一资源定位地址（URL）。\n\
    - 超文本标记语言（HTML）是由标准通用标记语言（SGML）演变而来的，它为ASCII格式的超文本文档提供了一种标准描述方式，允许作者格式化文本、引用音像以及内嵌与其它文档的超文本链接。HTML文件是用来提供给Web浏览器这样的解释器的，而不是直接为用户浏览使用的。\n\
    - 超文本传输协议（HTTP）是Web客户端与服务器之间的通信语言，它规定了客户端和Web服务器之间交换信息的格式和含义。HTTP是一种请求-响应协议，即客户端发送HTTP请求给服务器，然后服务器返回相应的HTTP响应信息。HTTP是一种无状态协议，客户端和服务器独立地处理消息交换，并不要求维持任何状态信息。\n\
