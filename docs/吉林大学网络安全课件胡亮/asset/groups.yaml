    # ## 2.1 同一节点上的进程间通信


    大多数UNIX系统提供多种进程通信方式，主要有信号（Signal）、管道（pipe）、命名管道（FIFO）、消息队列（message queue）、信号灯（semaphore）、共享内存（shared
    memory）和内存映象（memory mapped file）等。'
