    ## 8.1 国内外信息对抗理论与技术研究现状及发展趋势


    该领域正在发展阶段，理论和技术都很不成熟，也比较零散。但它的确是一个研究热点。目前看到的成果主要是一些产品（比如IDS、防范软件、杀病毒软件等），攻击程序和黑客攻击成功的事件。当前在该领域最引人瞩目的问题是网络攻击，美国在网络攻击方面处于国际领先地位，有多个官方和民间组织在做攻击方法的研究。其中联邦调查局的下属组织NIPC维护了一个黑客攻击方法的数据库，列入国家机密，不对外提供服务。该组织每两周公布一次最新的黑客活动报道及其攻击手段与源码。美国最著名的研究黑客攻击方法的组织有：CIAC（计算机事故咨询功能组），CERT（计算机紧急响应小组）和COAST（计算机操作、审计和安全技术组）。他们跟踪研究最新的网络攻击手段，对外及时发布信息，并提供安全咨询。此外，国际上每年举行一次FIRST（安全性事故与响应小组论坛）会议，探讨黑客攻击方法的最新进展。


    该领域的另一个比较热门的问题是入侵检测与防范。这方面的研究相对比较成熟，也形成了系列产品，典型代表是IDS产品。国内在这方面也做了很好的工作，并形成了相应的产品。


    ## 获取口令


    - 口令攻击程序有很多，用于攻击UNIX平台的有Crack、CrackerJack、PaceCrack95、Qcrack、John the Ripper、Hades等等；用于攻击Windows
    平台的有10phtCrack2.0、ScanNT、NTCrack、Passwd NT等等。

    - 通常防御在线口令攻击的办法是通过配置操作系统来限制允许每个用户登录失败的次数，当到达次数限制时，该帐户将被锁定，直到系统管理员解开封锁。但这种方法却正中实施拒绝服务（denial
    of service）攻击者下怀。这类入侵者会反复猜测系统中的用户帐户，使它们都超过失败登录范围，最终锁住所有帐户。

    - 口令攻击之所以能成功，主要是因为用户使用了规律性较强的口令，为防御口令攻击，用户应设计包括大写、小写、数字和特殊字符的8字节以上的长口令，增大入侵者猜测的难度，并且要定期更换口令。另一方面，要保证口令文件的存储安全。


    ## 放置特洛伊木马程序


    特洛伊木马源自于希腊神话，在网络安全领域专指一种黑客程序，它可以直接侵入用户的电脑并进行破坏。它一般包括两个部分，控制端软件和被控端软件。被控端软件常被伪装成工具程序或者游戏等，诱使用户打开带有该软件的邮件附件或从网上直接下载。一旦用户打开了这些邮件的附件或者执行了这些程序之后，它们就会在目标计算机系统中隐藏一个可以在系统启动时悄悄执行的程序。当用户连接到因特网上时，这个程序可以通知攻击者，报告用户的IP地址以及预先设定的端口。攻击者在收到这些信息后，再利用事先潜伏在其中的程序，任意地修改用户的计算机的参数设定、复制文件、窥视用户整个硬盘中的内容等，从而达到控制用户的计算机的目的。


    不要轻易打开陌生的邮件、对下载软件认真核对文件的MD5值是应对此类攻击的稳妥办法。


    ## WWW的欺骗技术


    - 用户通常利用IE等浏览器访问各种各样的WEB站点，如阅读新闻组、咨询产品价格、订阅报纸、电子商务等。然而一般的用户恐怕不会怀疑：当前正在访问的网页已经被别人恶意篡改过，该网站是否是一个真实的合法网站！通常，攻击者会将用户要浏览的网页的URL改写为指向自己的服务器，或者申请一个与合法商务站点极为相似的域名。当用户浏览目标网页、输入个人账号和密码、执行购物操作时，实际上是在与伪站点进行交易。攻击者利用这类Web欺骗轻松获取了用户的保密信息。

    - 仔细分辨似是而非的页面信息、认真查看网站的电子证书是防范这类攻击时必须要注意的。


    ## 电子邮件攻击


    电子邮件攻击主要表现为两种方式：一是电子邮件轰炸，或称邮件炸弹，是指用伪造的IP地址和电子邮件地址向同一信箱发送数以千计、万计的垃圾邮件，致使受害人邮箱空间快速饱和，甚至还可能会给电子邮件服务器的正常运行带来影响，甚至使其宕机；二是电子邮件欺骗，攻击者许称自己为系统管理员（邮件地址和系统管理员完全相同），给用户发送邮件要求用户修改口令（口令可能为指定字符串）或在貌似正常的附件中加载病毒或其它木马程序（如伪装成系统补丁等）。


    邮箱安全一方面要求用户不轻易信任陌生邮件内容，另一方面需要邮件服务提供者加强邮件服务的管理，避免垃圾邮件。


    ## 通过一个节点来攻击其他节点


    攻击者在突破一台主机后，往往会以此主机做为根据地，攻击其它主机。以此隐蔽其入侵路径，避免留下蛛丝马迹。他们可以利用网络监听方法，尝试攻破同一网络内的其它主机；也可以通过IP欺骗和主机信任关系，攻击其它主机。这类攻击很狡猾，但由于某些技术很难掌握和成功实施，因此较少被攻击者使用。


    ## 网络监听


    网络监听就是捕获网络上的报文，对其内容、特征进行分析，非法获取重要信息的一种手段。能够实施监听的程序或设备被称为嗅探器（sniffer），它既是管理员监视网络的状态、数据流动情况及网上传输信息的管理工具，也是入侵者发动攻击的有力武器。


    网络监听是网卡的一种工作模式，在这种模式下，主机会接收到本网段在同一条物理通道上传输的所有信息，而不管这些信息是否发送给它和接收方是它。此时，如果两台主机进行通信没有加密，只要使用某些网络监听工具，例如NetXray
    for windows 95/98/nt, sniffit for linux、solaris等就可以轻而易举地截取包括口令和帐号在内的信息。虽然网络监听者获得的用户名和口令具有一定的局限性，但监听者往往能够获得其所在网段的所有用户帐号及口令。


    监听可以在多种媒质、多种协议上进行。监听的位置不同，效果也不一样。最普遍的做法是在以太网中进行监听。在正常情况下，网络接口对接收到的数据帧进行检查，如果数据帧中的目的物理地址是自己的物理地址，或是广播地址，则将数据帧送交上层协议软件处理，否则将抛弃该帧。但如果入侵者将一个计算机的网络接口设为杂收模式，则所有的数据帧将被送交上层协议软件。此时该计算机就是一个嗅探器。在一般的UNIX系统中，设置网络接口为杂收（promiscuous）模式的I/O控制命令需要超级用户权限，这一限制在很多用户通过网络登录的系统上，但在Windows
    Me、Linux等某些个人操作系统或免费操作系统上，入侵者可以毫无限制地进行网络监听。


    利用嗅探器，入侵者可以监听到网络上传输的信息。很多网络协议对口令信息是不加密的，这样从客户机到服务器的传输路径上的任何计算机都可以监听到用户名和口令。有时即使加密的口令也能帮助入侵者攻击系统，因为有的密码验证过程极其简单，入侵者可利用重放攻击（replay
    attack）把监听到的用户名和加密后的口令发送给服务器，即使被截取的信息。这种监听攻击简而有效，在1994年的嗅探器攻击中，入侵者通过Internet和Milnet收集了10万多个有效的用户名和口令。


    除截获口令外，入侵者还可利用网络监听来进行流量分析。通过对流入、流出网络的流量进行分析，入侵者可以得到大量有关网络的有用信息，如：网络通信双方的IP地址、网关和路由器的位置、网络内部服务器的分布、某些网络服务器广播的信息（如NetBIOS浏览表更新）所暗示的安全漏洞等等，这些信息都将为入侵者发动新的攻击提供帮助。


    ## 寻找系统漏洞


    许多系统都有这样那样的安全漏洞（Bugs），其中某些是操作系统或应用软件本身具有的，如 Sendmail漏洞等。这些漏洞在补丁未被开发出来之前一般很难防御，即使配置了防火墙等防护软件，仍有可能无法阻止攻击的发生。还有一些漏洞是由于系统管理员配置错误引起的，比如在网络文件系统中，将目录和文件以可写的方式调出，将未经
    Shadow的用户密码文件以明文形式存放在某一目录下等，都将会给攻击者带来可乘之机。因此，用户应随时关注有关系统漏洞的发布信息，及时为系统安装相应的安全补丁。


    ## 利用帐号进行攻击


    有的攻击者会利用操作系统提供的缺省账户和密码实施攻击，例如许多UNIX主机都有FTP和Guest等缺省账户（其密码和账户名同名），有的甚至没有口令。攻击者用Unix操作系统提供的命令如Finger和Ruser等收集信息，可以提高自己的攻击效果。此类攻击需要系统管理员提高警惕，将系统提供的缺省账户关掉，或者提醒无口令用户增加口令，避免此类攻击的发生。


    ## 偷取特权


    此类攻击利用各种特洛伊木马程序、后门程序或攻击者自编的缓冲区溢出的程序进行攻击。前者可使攻击者非法获得对用户机器的完全控制权，而后者可使攻击者获得超级用户的权限，进而还可能拥有对整个网络的绝对控制权。这种攻击手段危害性很大。


    ## 拒绝服务（DoS）攻击


    拒绝服务(DoS)攻击是一类以多种形式进行的攻击的总称，其特征表现为攻击者试图阻止某种服务的合法用户可靠、及时地使用该服务。


    常见的拒绝服务攻击主要有：


    - Syn flood: 该攻击以多个随机的源主机地址向目的主机发送SYN包，而在收到目的主机的SYN ACK后并不回应。这样，目的主机就为这些源主机建立了大量的连接队列，并且由于没有收到对方的ACK而在一段时间内一直维护着这些队列，造成了资源的大量消耗而不能为正常请求提供服务。

    - Land-based: 攻击者将一个包的源地址和目的地址都设置为目标主机的地址，然后将该包通过IP欺骗的方式发送给被攻击主机。这种包可以造成被攻击主机试图与自己建立连接而陷入死循环，从而很大程度地降低了系统性能，甚至导致目标系统崩溃。

    - Ping of Death: 根据TCP/IP的规范，一个包的长度最大为65536字节。尽管一个包的长度不能超过65536字节，但是一包分成多个片段后的重组却能做到。当一个主机收到长度大于65536字节的包时，导致16位的变化溢出，从而可能导致目标主机的重启。

    - Teardrop: IP数据包在网络传递时，数据包可以分成更小的片段。攻击者可以通过发送两段（或者更多）数据包来实现TearDrop攻击。第一个包的偏移量为0，长度为N，第二个包的偏移量小于N。为了合并这些数据段，TCP/IP堆栈会分配超乎寻常的巨大资源，从而造成系统资源缺乏甚至机器的重新启动。

    - Ping Sweep: 使用ICMP Echo请求多个主机。

    - Ping flood: 该攻击在短时间内向目的主机发送大量ping包，造成网络堵塞或主机资源耗尽。

    '
