    # IDS和IPS比较3


    Marc：IPS能遍及网络和自动保护一个单位的所有可能的攻击点(内部或外部)不受各种类型攻击


    Martin: IPS只提供最基本的功能,仍基于以前的知识阻塞威胁,需要通过预先定义的网上的阻塞点以便执行其任务.我们需要一个普遍深入的系统使得我们能不仅阻塞我们知道的跨越网上的分散的点,而且能在开始就能执行网络安全策略管理和减少薄弱环节.混合威胁需要具有更多可补救的选项的混合的安全系统.线内入侵阻止是正确方向的第一步,面对普遍深入的威胁,要求基础框架提供比仅仅是点防御更广泛的功能'
  - '[PAGE 424]


    # IDS和IPS比较4


    MWL: IPS不仅是简单的点防御,不只限于周边防御,而是贯穿整个网络保护核心和内部，定制的硬件就像交换机和路由器一样，提供强大的过滤能力，比简单地阻塞“预先确定的网络模式”作为对已知威胁的反应多得多。


    前缀的IPS支持过滤语言，能表达复杂的条件以检测已知和未知的威胁，有时被叫做异常过滤器或漏洞过滤器。能防护任何利用特定漏洞的已知的和未知的攻击。


    一个关键部件是过滤器更新服务，当威胁出现时能及时、精确、综合地提供自动保护。


    IPS将被集成到交换机和路由器中，以提供嵌入的基础框架安全。新的网络结点将提供包一路由/交换功能加上一个智能层，它不仅能决定一个包必须‘向哪儿走’，而且能决定是
    否‘应当走’。这种网络将成为更为动态的，不断可适应地滤 掉不需要的新的和老的威胁通信流'
  - '[PAGE 425]


    # IDS和IPS比较5


    MR: IPS技术不是新的.过滤语言已存在,能做的事情与开放源码Snort引擎没有什么重大不同,我们也能检测未知威胁.IPS是点的解,与使用时它们怎样深入网络没关系,就像防火墙是点的解一样,即使使用时它们也深入今天的网络.真正前缓的安全将是能够从事比只确认发生攻击的条件更多的事
    情,它将是一个普遍的覆盖网络的智能层,能了解该网络的组成和借助于适当协调各种不同技术以及其固有的检测和阻塞功能执行策略.在威胁产生后果之前,能中途阻止所有可能的攻击携带者和定义和检测攻击的各种变种.仅依赖于特征的及时更新服务是不够的.特征收集必须是充分全面的,包含网络中的每个设备,平台和应用程序.它必须处理客户和服务员端攻击、随机文件格式和电子邮件附件、加密、分段、客户应用程序和基于硬件的协议分析器不能知道怎样解释的任意协议.真正前缓的安全意味必须在初始地点阻塞可确认的威胁并执行安全策略,以便减少弱点的暴露.前缓的安全解还应当能战胜来自网络上任何点的威胁,不只是事先确定的入出点.大多数IPS公司不顾这些点,引导用户相信传统的、单独的IPS技术能前缓地保护整个网络中的资产'
  - '[PAGE 426]


    # IDS和IPS比较6


    MWL: 可根据漏洞信息而不是利用信息写出很精确的过滤器，即前缀保护的定义:在攻击存在之前及时地和全面（地点）保护客户。这些过滤器先于攻击存在之前，能够前缀地保护任何以漏洞为目标的任何利用。


    软件厂商误传硬件解是固定的和不灵活的.事实是任何硬件设计都可编程或有灵活性.每个协议没必要都由硬件实现,最新技术是建造通用块加速处理指定任务.超过漏洞过滤器,
    IPS使用网络轮廓描述方法刻画特定网络环境决定什么是该环境中的正常行为。偏离正常行为就报警、阻塞或扼杀(不需要攻击或漏洞的任何知识).基于深刻了解网络行为的基线和变化的保护是任何定义下的前缀.我们的IPS已达到这一点,已被广泛测试,已被世界财富500强中的几百个广泛配置.当我们2002年倡导IPS时,IDS厂商一致声称那是不可能的,大多数很快指出误报和延迟将影响网络.具有讽刺意味的是这些问题是由较次的IDS产生的.今天每个IDS厂商都提供IPS,不是所有IPS都是一样,你强调的大多数缺点对这些产品的大多数是真的,但不是全部'
