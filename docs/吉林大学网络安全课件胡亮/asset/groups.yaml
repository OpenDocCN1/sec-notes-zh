    # 典型的入侵检测系统


    IDS的研究从上世纪80年代就已开始，第一个商业IDS也在1991年诞生。目前各种IDS研究项目和商业产品的数量极为庞大，下面面对具有代表性的入侵检测系统加以介绍，分为商业IDS、IDS研究项目和自由软件三个类别。'
