    ## 敏感信息安全\n\n随着计算机和网络在商业、政府、娱乐和几乎所有日常生活的各个方面的大量使用，导致敏感数据量剧增\n\n敏感数据指的是这样的数据，如果对它使用得不正确，可能对数据主体或其他有关方造成损害\n\
    \n关注这些数据的所有权、控制权和正确性成为最重要的研究内容\n\n除了密码术和安全、数据库系统和数据挖掘等这些在有关领域的重大技术成就，目前尚没有综合的技术框架处理敏感数据问题。在今天这个数据密集的网络世界里，甚至还没有就敏感数据保管者的责任和权利达到广泛的社会共识。\n\
    \n## 安全的‘三代’\n\n## 安全的‘三代’\n\n- 第一代安全系统依赖于密码术、可信计算基、鉴别、防火墙、访问控制和其它周边防御阻止入侵者进入。最初是成功的，但对现在的网间环境是不能承受和不切实际的，况且对恶意的内部人员、生命周期威胁、移动代码和可信性未知的产品的广泛使用不能提供足够的防御\n\
    - 第二代安全包括IDS和IPS，仍然不能完全避免攻击成功\n- ITS提供第三代安全，能在这些攻击的整个过程中工作，在系统中构建多层容忍机制，包括实时执行监控器、检测差错和防止其传播、修复损坏和重新分配系统资源让关键功能能优先使用剩余的可信任部件，以及系统功能的降级逐步进行。使用时间、空间和数据冗余，灵活的重组以及实时QoS折中提供最后一层容侵\n\
    - ITS宣布进入一个面对恶意内部人员、入侵者和攻击者的可生存性的新时代。第三代安全系统将把安全范例从花费全部代价拒入侵者于门外转变为更划算和承受得起的避免/阻塞、检测和容忍的结合\n\
    \n## 网络安全方案\n\n随着计算机技术和通信技术的发展，计算机网络将日益成为工业、农业和国防等方面的重要信息交换手段，渗透到社会生活的各个领域。因此，认清网络的脆弱性和潜在威胁，采取强有力的安全策略，对于保障网络的安全性将变得十分重要。网络管理员在实施一个网络安全方案之前必须考虑到以下问题：\n\
    \n- 每个完备的网络系统都应该有一个安全方案；\n- 每个系统的安全方案应该是特有的；\n- 多个部门，包括企业领导、信息专家及普通用户相互交流以建立一个安全方案；\n\
    - 一个安全方案的基本内容在于保护什么而不是如何保护；\n- 在实施安全方案前设计一个周密的计划；\n- 一个安全方案应考虑对冒犯方案可能的解决途径；\n\
    - 安全方案的好坏取决于它的实施效果。\n\n## 安全方案\n\n对于网络管理员来说，对计算机网络安全的兴趣往往取决于他们的风险意识。随着对计算机网络威胁的不断增加，网络管理员必须提供一套网络安全解决方案。组成一个成功安全方案包含若干元素，它们是：\n\
    \n- 标识（Identities）：指系统用以区分不同用户或主机的分类或者命名方案；\n- 认证（Authentication）：主要解决检查那些互相宣称有访问权的问题；\n\
    - 通信认证（Communication authentication）：是指网络用来证明信息确实由真正的发送者发出的，它经常采用数字签名技术实现；\n-\
    \ 通信完整性（Communication integrity）：是网络证明信息是原始信息而未被改动的一种方式；与通信认证类似，它经常采用数字签名技术实现；\n\
    - 授权（Authorization）：判断系统是否授权访问某些数据或函数的一种机制。在一些系统中，操作系统处理目标授权，而其他系统特别是那些使用Kerberos或相似程序的系统，用一个独立的访问服务器处理目标授权；\n\
    - 审计（Auditing）：提供网络系统中进行信息交换的一种记录方法。\n\n当系统管理员实施一种安全方案时，必须确定上述中哪一项是最应考虑的，而后采用适当方案。\n\
    \n## 设计一套安全方案的基本准则\n\n创建一种安全方案意味着设计一种如何处理计算机安全问题的计划，也就是尽力在黑客征服系统以前保护系统。总之，设计一套安全方案涉及以下步骤：\n\
    \n- 确定企图保护的特别的项目。例如，服务器包含重要数据，通过检查用户如何访问数据库，可以以低水平安全措施保护数据库，而以高水平安全措施保护数据库内记录。\n\
    - 确定保护数据库是针对谁和什么事件的，例如试图保护的是一个公司内销售人员的记录。\n- 确定信息窃取人的可能状况，如果一个公司在市场上影响较大，就应该对外部黑客加强防范。\n\
    - 保护的方案应是有效率的，口令保护、加密保护和防火墙等措施都是有效率的保护。\n\n定期不断重复此过程，尤其是系统升级或修改配置时应及时修改安全方案。\n\
    \n## 信息安全优先研究的十个领域\n\n- 安全基本协议\n- 安全软件工程和软件保障\n- 整体（Holistic）系统安全\n- 监控与检测\n-\
    \ 鉴别技术\n- 缓解与恢复方法学\n- 计算机取证（Cyber Forensics）：抓住罪犯和阻止犯罪活动\n- 建模和测试床（Testbed）新技术\n\
    - 测试标准、基准和最佳实践\n- 危及计算机安全的非技术问题\n\n## 谢谢！\n\n## ‘网络与信息安全’\n研究方向\n\n2006.11.24\n\
    \n## 网络与信息安全研究方向\n\n- 目的： 学科建设\n  科研方向\n  论文指导\n  立项取材\n- 取材范围： 文献315篇、项目33个、1GB\n\
    \  近期： 近三年\n  某些： 国外，内容仅限于相关部分\n\n## 内容\n\n- 优先研究领域\n- 入侵检测与响应(ID&IP)一重点\n- 敏感信息安全\n\
    - 可信计算(trusted computing, TC)\n- 加密技术\n- 因特网应用安全\n- 网络安全培训工具\n\n## PITAC: 信息安全优先研究的十个领域1\n\
    \n- 安全基本协议\n- 安全软件工程和软件保障\n- 整体（Holistic）系统安全\n- 监控与检测\n- 鉴别技术\n\n## 入侵检测与响应(ID&IR)\n\
    \n- 漏洞检测与风险评估\n- 入侵检测方法和工具\n- 入侵阻止\n- 入侵追踪与取证\n- 容侵与可靠计算\n\n## 漏洞检测与风险评估\n\n-\
    \ 文献9篇：检测漏洞和风险评估的方法\n- 项目：马里兰大学FERRET主机漏洞检测工具（Windows、Unix，文档和源程序）\n\n## 入侵检测方法和工具\n\
    \n- 包括\n  异常检测\n  误用检测\n  内部检测\n  蠕虫检测和防御\n  无线的、主机的等\n- 文献46篇，各种检测工具，Snort等\n\
    \n## 恶意软件检测\n\n- 间谍软件已经迅速成为政府、企业网络和家用计算机的主要安全威胁，窃取机密信息并向远方泄露、耗费系统资源。这种恶意软件已经渗透到公共搜索引擎和互联网中一般被认为安全的各个部分。间谍软件利用浏览器的漏洞广泛传染。包括蠕虫检测和响应、研究蠕虫行为方法等。\n\
    - 文献8篇：对间谍软件的综述、研究蠕虫行为的虚拟操场、蠕虫的主动检测和响应等\n\n## 警报关联\n\n从Anderson报告(Computer security\
    \ threat monitoring and surveillance.1980)算起，入侵检测的研究已进行了20多年，但入侵检测技术还远不完美：\n\n\
    - 大批误报信号\n- 不能很好检测新型攻击或已知攻击的变种\n- 侧重于检测底层攻击或异常，不能扑获攻击的逻辑步骤或策略\n\n从而IDS通常产生一大批警报。在入侵活动很强烈的场合,真的警报与大批误报混在一起,警报数量之大根本无法处理。结果,用户或入侵响应系统很难了解这些警报后面的入侵情况以及采取相应措施\n\
    \n## 警报关联\n\n大多数入侵都不是孤立的，它们作为攻击序列的不同阶段是相互关联的，前一阶段是下一阶段的准备。换言之,通常一系列攻击后面存在着逻辑步骤或策略\n\
    \n## 警报关联方法\n\n- 第一类方法是根据警报属性之间的相似性把警报进行关联。对聚类相似警报（例如具有相同IP源地址和目的地址的警报）是有效的，但不能完全揭示相关警报的因果关系\n\
    - 第二类方法是根据用户说明或从训练数据集学习的攻击场景进行警报关联，局限于知道攻击场景，或可从已知的场景产生的那些，这类方法的一个变种使用推理机制说明一个给定的攻击后面可能跟着哪一类攻击\n\
    - 第三类方法目标在于识别多阶段攻击，如果后来的警报的先决条件被较早的警报的因果关系所满足，则它对那些警报实现关联。这种方法能潜在地揭示警报之间的因果关系，而且不限于已知的攻击场景\n\
    \n## NCSU项目\n\n## 使用前提和结果的入侵警报关联 1\n\n- 开发一个用于警报关联的形式（化描述）框架，能处理攻击企图和把警报关联起来（只要这些警报之间出现连接征兆，即使某些相关攻击失败或绕过IDS）。提供一个直观机构，通过警报关联描绘攻击场景\n\
    - 开发一套交互式实用程序，帮助分析非常大的攻击场景。这些程序减少了大型攻击场景的尺寸 (但仍保持该攻击的结构), 或从大攻击场景中抽取挑选的特征\n"
