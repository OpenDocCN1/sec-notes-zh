    ## 第7章 防火墙技术


    防火墙的本义是指古代构筑和使用木制结构房屋的时候，为防止火灾的发生和蔓延，人们将坚固的石块堆砌在房屋周围作为屏障，这种防护构筑物就被称之为“防火墙”。与防火墙一起起作用的就是“门”。如果没有门，各房间的人将无法沟通。当火灾发生时，这些人还须从门逃离现场。这个门就相当于我们这里所讲的防火墙的“安全策略”，所以在此我们所说的防火墙实际并不是一堵实心墙，而是带有一些小门的墙。这些小门就是用来留给那些允许进行的通信，在这些小门中安装了过滤机制。


    网络防火墙是借鉴了古代真正用于防火的防火墙的喻义，它指的是隔离在本地网络与外界网络之间的一道防御系统。防火墙可以使企业内部局域网（LAN）网络与Internet之间或者与其他外部网络互相隔离、限制网络互访用来保护内部网络，防止发生不可预测的、潜在破坏性的侵入。


    ## 防火墙具有的基本特性


    典型的防火墙具有以下三个方面的基本特性：


    ### （1）内部网络和外部网络之间的所有网络数据流都必须经过防火墙


    这是防火墙所处网络位置特性，同时也是一个前提。因为只有当防火墙是内、外网络之间通信的唯一通道，才可以全面、有效地保护企业内部网络不受侵害。根据美国国家安全局制定的《信息保障技术框架》，防火墙适用于用户网络系统的边界，属于用户网络边界的安全保护设备。所谓网络边界即是采用不同安全策略的两各网络的连接处，比如用户网络和Internet之间连接、和其他业务往来单位的网络连接、用户内部网络不同部门之间和连接等。防火墙的目的就是在网络连接之间建立一个安全控制点，通过允许、拒绝或重新定向网络连接对进、出内部网络的服务和访问的审计和控制。


    ### （2）只有符合安全策略的数据流才能通过防火墙


    防火墙最基本的功用是确保网络流量的合法性，并在此前提下将网络的流量快速地从一类网络转发到另一类网络上去。从最早的防火墙模型开始谈起，原始的防火墙是一台“双穴主机”，即具有两个网络接口，同时拥有两个网络层地址。防火墙将网络流量通过相应的网络接口接收上来，按照协议栈的层次结构顺序上传，在适当的协议层进行访问规则和安全审查，然后将符合通过条件的报文从相应的网络接口送出，而对于那些不符合通过条件的报文予以阻断。因此，从这个角度上来说，防火墙是一个类似于交换或路由器的、多端口的（网络接口>=2）转发设备，它跨接于多个分离的物理网段之间，并在报文转发过程之中完成审查工作。


    ### （3）防火墙自身应具有非常强的抗攻击能力


    这是防火墙之所以能担当企业内部网络安全防卫重任的先决条件。防火墙处于网络边缘，它就像一个边界卫士一样，每时每刻都要面对黑客的入侵，这就要求防火墙自身必须具有非常强的抗攻击能力。每个防火墙操作系统本身的安全性是关键。其次就是防火墙自身具有非常少的服务功能，除了专门的防火墙嵌入系统外，再没有其它应用程序在防火墙上运行。


    ## 防火墙发展过程


    - 自从1986年美国Digital公司在Internet上安装了全球第一个商用防火墙系统以来，防火墙技术得到了飞速的发展。目前有几十家公司推出了功能不同的防火墙系统。

    - 第一代防火墙，又称包过滤防火墙，主要通过对数据包源地址、目的地址、端口号等参数的检查来决定是否允许该数据包通过，对其进行转发，但这种防火墙很难抵御IP地址欺骗等攻击，而且审计功能很差。

    - 第二代防火墙，也称代理服务器，它可提供对网络服务层的控制，在外部网络向被保护的内部网络申请服务时充当代理的作用，这种方法可以有效地防止对内部网络的直接攻击，安全性较高。

    - 第三代防火墙有效地提高了防火墙的安全性，称为状态监控功能防火墙，它可以对每一层的数据包进行检测和监控。随着网络攻击手段和信息安全技术的发展，新一代的功能更加强大、安全性更好的防火墙已经问世，这个阶段的防火墙已超出了传统意义上防火墙的范畴，已经演变成一个全方位的安全技术集成系统，可称之为第四代防火墙，它可以抵御目前常见的网络攻击手段，如IP地址欺骗、特洛伊木马攻击、Internet蠕虫、口令探测攻击、邮件攻击等等。实际上，这种防火墙具有很多的IDS功能。IDS与防火墙的相互配合使用，VPN和防火墙的相互配合使用将能提供更全面的安全性，也是防火墙发展的趋势。


    ## 7.1 防火墙简介


    防火墙是网络安全的第二道防线。防火墙在一个机构的私有网络和外部网络间建立一个检查点。这种实现要求所有的流量都通过这个检查点。一旦这些检查点清楚地建立，防火墙设备就可以监视、过滤所有流入和流出的网络流量。只有经过精心选择的数据包才能通过防火墙，所以网络环境变得更安全。如防火墙可以禁止诸如众所周知的不同安全的NFS协议或导出保护网络。这样外的攻击者就不能利用这些脆弱的协议来攻击内部网络。防火墙同时可以保护网络免受基于路由的攻击，如IP选路中的源路由攻击和ICMP重定向中的重定向路径。防火墙可以拒绝所有以上类型攻击的报文并通知防火墙管理员。


    防火墙可以强化网络安全策略。通过以防火墙为中心的安全方案配置，能将所有安全软件（如口令、加密、身份认证、审计等）配置在防火墙上。与将网络安全问题分散到各个主机上相比，防火墙的集中式安全管理在经济性方面占优势。例如在网络访问时，一次一密钥系统和其它的身份认证系统完全可以在不分散在各个主机上，而集中在防火墙一身上。


    防火墙可以对网络存取和访问进行监控审计。如果所有的访问都经过防火墙，那么，防火墙就能记录下这些访问并记录在日志中，同时也能够提供网络使用情况的统计数据。当发生可疑动作时，防火墙还能进行适当的报告，并提供网络是否受到攻击和破坏的线索信息；另外，收集一个系统使用的情况也是非常重要的。首先可以清楚防火墙是否能抵挡攻击者的探测和攻击，并且清楚防火墙的控制是否充足。因此使用统计对网络需求和威胁分析也是非常重要的。


    防火墙可以防止内部信息的外泄。防火墙在内部网络周围建立了一个保护的边界。并且对于公网隐藏了内部系统的信息。当远程节点侦测内部网络时，他们仅仅能看到防火墙。内部细节如Finger、DNS等服务被很好地隐藏起来。Finger显示了主机的所有用户的注册名、真名、最后登录时间和使用shell来登录。Finger显示的信息是非常容易被攻击者恶意并利用。通过Finger攻击者可以知道一个系统使用者的频繁程度，这个系统是否有用户正在连上网。这个系统是否在被攻击时引起注意等。防火墙同样可以阻隔有关外部网络中的DNS信息，这样一台主机的域名和IP地址就不会被外界所了解。另外，利用防火墙对内部网络的划分，可实现对内部网络的重点网段的隔离，从而限制了局部重点或敏感网络安全问题对全局网络造成的影响。

