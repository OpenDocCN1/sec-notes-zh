    # IDEA算法


    IDEA(International Data Encryption Algorithm)是由中国学者来学嘉和著名密码学家James Massey于1990年联合提出，后于1992年修改完成。它的明文与密文块长度都是64位，密钥长度为128位。加密与解密使用相同算法，但使用的子密钥不同。这是与多数分组加密算法不同的。子密钥由算法的128-bit密钥通过密钥扩展生成。IDEA算法的的加解密运算是8重循环。'
