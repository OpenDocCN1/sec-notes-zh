    ## 计算机病毒分类


    根据病毒破坏的能力可以划分为以下几种：

    无害型：除了传染时减少磁盘的可用空间外，对系统没有其它影响。

    无危险型：这类病毒仅仅是减少内存、显示图像、发出声音及同类音响。

    危险型：这类病毒在计算机系统操作中造成严重的错误。

    非常危险型：这类病毒删除程序、破坏数据、清除系统内存区和操作系统中重要的信息。


    ## 病毒发展趋势


    ### 网络成为计算机病毒传播的主要载体


    在1994年以前，计算机病毒的传播载体主要是软盘。到了1998年，计算机病毒才真正地在网络上出现，那就是1998年年底出现的Happy99病毒。它是网络蠕虫病毒的始祖，从此，计算机病毒几乎都完全与软盘脱离关系。计算机病毒的传播越来越依赖网络，而网络也使得病毒传播更加迅速，范围更广。1998年以后出现的影響比较大的病毒，几乎都利用了网络传播到全世界。包括CIH病毒也是利用了当时“小龙女”屏幕保护程序在网上传播。


    ### 病毒与黑客技术相互结合，网络蠕虫成为最主要的病毒类型


    以“红色代码”、“尼姆达”和“sql蠕虫”为例的病毒体现了病毒与黑客技术相互结合的潮流。它们共同的特点是利用微软服务器和应用程序组件的某个漏洞进行攻击。以“红色代码”为例，被其感染后的机器的web目录的\scripts下将生成一个root.exe，可以远程执行任何命令，从而使黑客能够再次进入。目前大多数蠕虫病毒使用了黑客入侵技术，利用系统漏洞进行传播，在控制系统的时候，为系统打开后门。


    ### 手机病毒、信息家电病毒的出现


    随着智能手机的普及，通过彩信、网上浏览与下载到手机中的程序越来越多，不可避免的会对手机安全产生隐患，手机病毒数量猛增。手机病毒将可能成为新一轮电脑病毒危害的“源头”。手机操作系统、无线传送、短信彩信、手机BUG已经成为病毒传播与破坏的“突破点”。


    ## 3.2 计算机病毒原理:引导型病毒


    硬盘有两个引导区，在0面0道1扇区的称为主引导区（MBR），内有主引导程序和分区表，主引导程序查找激活分区，激活分区的第一个扇区即为操作系统引导程序。软盘只有一个操作系统引导区，只要软盘做了格式化，就会在存在。其作用为查找盘上有无IO.SYS和DOS.SYS，若有则引导，若无则显示“NO
    SYSTEM DISK...”等信息。绝大多数病毒感染硬盘主引导区和软盘DOS引导区。


    硬盘主引导记录程序的功能是读出自举分区的引导区程序，并把控制权转移到分区BOOT程序，再由BOOT程序负责引导操作系统。整个程序流程如下：


    - 1. 将本来自BIOS从硬盘装入到0: 7C00H处的硬盘主引导记录程序移存到0: 600H处；

    - 2. 顺序读出四个分区表的自举标志，若找到自举分区，若找不到，转而执行INT18H的BOOT异常执行中断程序；

    - 3. 找到自举分区后，检测该分区的系统标志，若为32位FAT表或16位FAT表支持13号中断的扩展功能，就转到执行13号中断的41号功能调用进行安装检验，检验成功，就执行42号扩展读该功能调用把BOOT区程序读入到内存0:
    7C00H处，成功，跳到第5步，若读失败或系统标志为其它，就调用13号中断的读扇区功能调用把BOOT区读到0: 7C00H；

    - 4. 用13号中断的读扇区功能时，用两种方式分别进行5次试读，第一种方式是直接从自举分区的头扇区读入BOOT程序，若读成功，但读出来标志不是55AA，就采用第二种方式；如果用第一种方式试读五次均不成功，就采用第二种方式。若两种方式试读均失败，就转到出错处理程序；

    - 5. 读入BOOT区程序成功，转至0: 7C00H处执行BOOT程序。


    引导型病毒在系统启动时，通过硬盘它首先运行。这时BIOS将硬盘主引导区读到内存0:7C00处，控制权交给主引导程序，也就说病毒程序。已首先占用0:413单元的最低1K，0:413单元存放常规内存大小，由BIOS上机自检后写入。此后，系统以后将不再访问最低的1K内存计算机可用内存高段地址，将病毒移到高段继续执行。修改INT13地址，指向病毒程序，常指向INT13地保存原来地址，将原INT13地址调入0:7C00执行。


    由于引导型病毒是在运行操作系统之前进入内存，寄生对象又相对固定，所以该类病毒基本上不采用减少操作系统所管辖的内存容量(0:413H单元)方法来驻留内存高端，为了使病毒能频繁够给病毒基本，普遍修改INT
    13H的中断向量，而新 INT 13H 中断向量地址必定指向内存高端。不驻留内存的引导型病毒极少见。


