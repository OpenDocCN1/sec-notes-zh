    \ 情,它将是一个普遍的覆盖网络的智能层,能了解该网络的组成和借助于适当协调各种不同技术以及其固有的检测和阻塞功能执行策略.在威胁产生后果之前,能中途阻止所有可能的攻击携带者和定义和检测攻击的各种变种.仅依赖于特征的及时更新服务是不够的.特征收集必须是充分全面的,包含网络中的每个设备,平台和应用程序.它必须处理客户和服务员端攻击、随机文件格式和电子邮件附件、加密、分段、客户应用程序和基于硬件的协议分析器不能知道怎样解释的任意协议.真正前缓的安全意味必须在初始地点阻塞可确认的威胁并执行安全策略,以便减少弱点的暴露.前缓的安全解还应当能战胜来自网络上任何点的威胁,不只是事先确定的入出点.大多数IPS公司不顾这些点,引导用户相信传统的、单独的IPS技术能前缓地保护整个网络中的资产\n\
    \n## IDS和IPS比较6\n\nMWL: 可根据漏洞信息而不是利用信息写出很精确的过滤器，即前缀保护的定义:在攻击存在之前及时地和全面（地点）保护客户。这些过滤器先于攻击存在之前，能够前缀地保护任何以漏洞为目标的任何利用。\n\
    \n软件厂商误传硬件解是固定的和不灵活的.事实是任何硬件设计都可编程或有灵活性.每个协议没必要都由硬件实现,最新技术是建造通用块加速处理指定任务.超过漏洞过滤器,\
    \ IPS使用网络轮廓描述方法刻画特定网络环境决定什么是该环境中的正常行为。偏离正常行为就报警、阻塞或扼杀(不需要攻击或漏洞的任何知识).基于深刻了解网络行为的基线和变化的保护是任何定义下的前缀.我们的IPS已达到这一点,已被广泛测试,已被世界财富500强中的几百个广泛配置.当我们2002年倡导IPS时,IDS厂商一致声称那是不可能的,大多数很快指出误报和延迟将影响网络.具有讽刺意味的是这些问题是由较次的IDS产生的.今天每个IDS厂商都提供IPS,不是所有IPS都是一样,你强调的大多数缺点对这些产品的大多数是真的,但不是全部\n\
    \n## IDS和IPS比较7\n\n- MR: Sourcefire和广泛的Snort界创造了鉴别以潜在漏洞为目标的威胁技术（而不是简单利用特征）。至于软硬件的辩论,应该知道我们的IPS产品在今天先进网络平台上的性能—在8G上没有延迟。当然我们还能采取比基于硬件方法更快和有效的方法。Sourcefire没有说过IDS将要灭亡,因为我们没有看到阻止功能的价值。我们知道阻止功能决不是百分之百有效的。你承认需要行为异常检测就恰恰证明这一点。掌握持久的网络资产知识（组成、行为、漏洞、变化）至少与检查针对这些资产的信息流同样重要。我们没有简单地赶时髦,既推荐我们的IPS（获今年RSA展览会最佳入侵解奖），同时也意识到用于广泛的网络威胁的任何过虑技术的局限性。我确信入侵阻止的意义将远远比只是IPS丰富\n\
    \n## IDS和IPS比较小结\n\n- IPS比IDS功能多\n- 由于in line, 要求IPS性能和安全性好\n  如果由硬件实现更好，但价格高\n\
    - IPS易用和有效的前提是解决IDS现存的问题\n\n## 入侵阻止(IP)\n\n- 文献15篇\n- 产品评论19篇\n- 研究项目6个，其中一个巴西的HLBR是06年开源\n\
    \n## 入侵追踪与取证\n\n- 可追踪性是一种根据计算机空间中（特别是互联网上）的事件找到现实世界中的制造者的能力，通常要掌握他们用于追究为其行为应负的责任，追踪失败时就表现为匿名。应用领域：追查网络攻击者、网络犯罪者、通过电子邮件发送大量垃圾邮件或有病毒的邮件的机器，有法律意义和经济效益，对电子政务的应用也有重大意义。迄今为止缺少有效的成功的方法。有些开源工具。\n\
    - 文献6篇\n\n## 容侵与可靠计算1\n\n容侵(IT, intrusion tolerance)与可靠(信)计算\n(DC,dependable computing)\n\
    \n- 必要性：有一句名言：“必须找出和修补了所有漏洞才能使系统安全，可是只需要找到一个缺陷就能产生一个入侵”。即使IDS检测到入侵,发出响应总是需要一段时间,这段时间受到攻击的服务也是不可信任的,因为警报可能是误报或仅是攻击的瞬间反映。这样，需要一种服务，即使处在各种攻击场景中也能提供特定服务\n\
    \n## 容侵与可靠计算3\n\n## 从可(信)靠性到容侵\n\n- 可靠性研究界和安全界原来是分开的，但最近开始变得密切起来，彼此交换概念\n- 可靠性是计算机系统的这样一个性质，它提供的服务是可以信赖的\n\
    - 可靠性的属性包括可用性、可靠性 reliability、安全性、机密性、完整性、可维护性\n- 使用方法包括故障防止，容错，故障消除，故障预报\n- 损害包括故障、差错和失效\n\
    - 欧盟项目 MAFTIA（因特网应用程序的恶意和意外容错）把可靠性方法应用到安全领域，把入侵和漏洞看作故障，提出以下六个方法：漏洞防止、入侵防止、容侵、漏洞消除、漏洞预报、和入侵预测\n\
    \n## 容侵与可靠计算4\n\n## 安全的‘三代’\n\n- 第一代安全系统依赖于密码术、可信计算基、鉴别、防火墙、访问控制和其它周边防御阻止入侵者进入。最初是成功的，但对现在的网间环境是不能承受和不切实际的，且对恶意的内部人员、生命周期威胁、移动代码和可信性未知的产品的广泛使用不能提供足够的防御\n\
    - 第二代安全包括IDS和IPS，仍然不能完全避免攻击成功\n- ITS提供第三代安全，能在这些攻击的整个过程中工作，在系统中构建多层容忍机制，包括实时执行监控器、检测差错和防止其传播、修复损坏和重新分配系统资源让关键功能能优先使用剩余的可信任部件，以及系统功能的降级逐步进行。使用时间、空间和数据冗余，灵活的重组以及实时QoS\
    \ 折中提供最后一层容侵\n- ITS宣布进入一个面对恶意内部人员、入侵者和攻击者的可生存性的新时代。第三代安全系统将把安全范例从花费全部代价拒入侵者于门外转变为更划算和承受得起的避免/阻塞、检测和容忍的结合\n"
  mdcn: "\n## NCSU项目\n\n## 使用前提和结果的入侵警报关联2\n\n- 开发一个用于入侵警报分析的工具TIAA，它把警报关联方法和分析程序集成到一个系统中，以支持交互式入侵检测分析\n\
    - 进行一系列实验，使用2000 DARPA入侵检测场景指定数据集和网络数据流验证警报关联方法和分析程序。结果表明，不仅关联了相关警报和揭示了攻击策略，而且还提供了一个区分警报的方法，交互分析程序能有效地简化对大数量警报的分析工作\n\
    - 本项目包含文献11篇和软件一套\n\n## 警报关联\n\n- NCSU（北卡罗来纳州立大学）项目：\n  - 使用前提和结果的入侵警报关联\n- 文章25篇、PPT5篇、专著一本\n\
    - 国内相关研究7篇\n\n## IDS和IPS比较1\n\n- 检测和响应\n- 线内和线外\n- 软硬件\n\n## IDS和IPS比较2\n\n- 大辩论：‘入侵阻止系统能根本改进安全还是只是另一个部分解？’\
