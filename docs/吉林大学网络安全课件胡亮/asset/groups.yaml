    ## MD5算法


    MD5诞生于1991年，全称是“Message-Digest Algorithm5”，由MIT的Rivest提出，之前已经有MD2、MD3和MD4几种算法。MD5克服了MD4的缺陷，生成128bit的摘要信息串，出现之后迅速成为主流算法，并在1992年被收录到RFC中。MD5算法对输入的信息产生128-bit的文摘，是一种为32bit机器设计的高效安全的文摘算法。虽然MD5已被破解，但仍是我们学习文摘算法的很好实例。


    ## SHA-1 算法


    SHA诞生于1993年，全称是安全散列算法（Secure Hash Algorithm），由美国国家安全局（NSA）设计，之后被美国标准与技术研究院（NIST）收录到美国的联邦信息处理标准（FIPS）中，成为美国国家标准，SHA（后来被称作SHA-0）于1995被SHA-1（RFC3174）替代。SHA-1生成长度为160bit的摘要信息串，虽然之后又出现了SHA-224、SHA-256、SHA-384和SHA-512等被统称为“SHA-2”的系列算法，但仍以SHA-1为主流。


    ## 课程名称：网络安全


    主讲教师：胡亮


    Email:hul@jlu.edu.cn


    ## 第5章 PKI技术及其应用


    为了建设高度安全可信的网络空间，世界各国的安全专家们进行了多年的研究，研究了许多不同层次的安全措施与技术。结果发现，大多数安全措施与技术只能解决部分网络空间的安全问题。幸运的是，专家们发现，公钥基础设施（Public
    Key Infrastructure，PKI）似乎可以解决绝大多数网络安全问题，并初步形成一套完整的解决方案和理论。公钥基础设施作为最新发展起来的安全技术和安全服务规范，是利用非对称密码算法原理（公钥理论）和第三方认证技术来实现并提供安全服务的具有通用性的安全服务设施。用户可以利用PKI平台提供的安全服务进行安全通信。PKI建立在统一的标准和规范基础之上，为网络应用提供实体鉴别、数据的保密性、数据的完整性和交易的不可否认性（抗抵赖）等安全服务，因而是信息安全的关键技术。与此同时，一个PKI系统的安全性、可靠性、以及功能的完备性就更是大家关注的焦点。


    ### 5.1 PKI体系


    - 作为一项基础设施，PKI不仅仅包括技术问题，还包括组织管理、法律法规等方面，是一个宏观体系。

    - 在理论上，需要密码学算法和密码协议的支持，这是PKI的理论基础；

    - 在技术上，需要制定相关的标准，如证书及数字签名的格式、各实体间的通信协议，以保证PKI的互操作；

    - 在管理上，需要对各参与方的各种活动进行规范，以保证PKI的正常运作与运营；

    - 在法律上，要对电子签名赋予法律效力。对各参与方的责任、义务进行分配，为PKI的实施提供法律上的保障。


    可见，PKI的部署与实施是个系统工程，需要社会各方包括学术界、工业界、法律界以及政府部门的共同努力。与此同时，对于PKI自身的安全性、可靠性、可用性、高效性以及可扩展性成为了信息安全与认证理论领域的研究热点和重点，构建兼容性好、移植功能强大的PKI体系也是发挥密码技术在电子商务、电子政务等领域的作用的重要途径。


    ## PKI宏观体系


    - 法律：电子签名法

    - 管理：实施规则与运营规范

    - 技术：标准、协议

    - 理论：密码与认证理论


    图5-1

    PKI宏观体系


    |  |  |

    |---|---|

    | 法律：电子签名法 |  |

    | 管理：实施规则与运营规范 |  |

    | 技术：标准、协议 |  |

    | 理论：密码与认证理论 |  |


    图5-1 PKI宏观体系


    ## PKI简介


    - 从狭义上讲，PKI可理解为证书管理的工具，包括为创建、管理、存储、分配、撤销公钥证书（PKC）的所有硬件、软件、人员、政策法规和操作规程（自PKIX）。利用证书可将用户的公钥与身份信息绑定在一起，然而如何保证公钥和身份信息的真实可靠，则需要一定的管理设施。PKI是结合了技术和管理两方面因素，保证了证书中信息的真实性，并对证书提供全程管理。PKI为应用提供了可信的证书，因而也可将PKI认为是信任管理设施。

    - 从广义上讲，PKI是在开放的网络上（如Internet）提供和支持安全电子交易的所有产品、服务、工具、政策法规、操作规程、标准和人的集合。从这个意义上讲，PKI不仅提供了可信的证书，还包括建立在密码学基础之上的安全服务，如实体鉴别服务、消息的保密性服务、消息的完整性服务和抗抵赖服务等。这些安全服务的实现需要通过相关的协议、可信的证书只能提供这些安全服务可信的基础。例如，消息的保密性服务，需要保密通信协议如SSL、TLS、S/MIME等。当然，一个通信协议也可能会同时实现多种安全服务，如SSL既可实现服务器端鉴别，也可实现消息的保密传输。

    - 建立一个PKI，至少涉及三方面的内容：技术、管理和法律。作为一项基础设施，PKI的建立应遵循标准。在技术方面包括消息格式、通信协议和API标准；在管理上要建立完善的证书管理制度；在法律上要对数字签名予以承认，并对各方的权利义务进行分配。


    ## PKI的特点


    - 通用性和强描述能力：PKI能清楚地表达其各方面的信息，包括信任、信任度、推荐、公钥的可靠性、证书路径、公钥的撤销和各参数的依赖关系等。

    - 语义精确：对PKI中的每个参数都有精确的解释。

    - 估值的独立性：推理得到的结论不依赖于使用推理规则的先后顺序。

    - 运行效率高：推理算法有效，便于实际使用。

    - 可扩展性：对PKI系统而言，系统可以处理任意规模的实体集，当一个实体加入到系统中时，参数容易修改。

    - 易用性：参数的说明直观且易于操作。


    ## PKI的组成


    - 最终实体（End Entity，EE）：也就是PKI中的用户，持有数字证书，是证书的主体。最终用户根据在通信过程中的不同性质，可以分为两类：证书持有者和依赖方（relying
    party）。证书持有者即为证书中所标明的用户，依赖方指的是依赖于证书（真实性）的用户。在数字签名中，依赖方就是在相信证书真实性的基础上来验证签名的。

    - 认证机构（Certification Authority，CA）：可信权威结构，负责颁发、管理 and 吊销最终实体的证书。CA最终负责它所有最终实体身份的真实性。因此可以认为CA是整个PKI系统的核心，也被称作一个域，一个用户需要在一个域中注册并注册同一个域中的用户需要通信时，通过域之间的信任关系来建立信息的交换。

    - 注册机构（Registration Authority，RA）：可选的管理实体，主要负责对最终用户的注册管理，被CA所信任。尽管注册的功能可以直接由CA来实现，但当PKI域内实体用户数量很大并且在地理上分布很广的时候，就有必要建立单独的RA来实现注册功能。

    - 证书（及废止列表）库（Cert/CRL Repository）：开放的电子站点，负责向所有的最终用户公开数字证书和证书废止列表（CRL）。


    ## PKI组成部件及其相互关系


