  - '[PAGE 40]


    # RPC调用语义


    +   - 第一种是恰好一次语义（Exactly-Once）。每次调用请求服务员只精确执行一次，它具有和本地过程调用相同的语义。这种语义比较难以实现，主要是服务员有可能崩溃。

    +   - 第二种是最多一次语义（At-Most-Once）。最多一次语义常使用有状态服务员实现。这种语义保证一个调用的重复请求不被服务员执行，服务员根据状态表中的信息判断一个请求是否是一个重复的请求。

    +   - 第三种是至少一次语义（At-Least-Once）。这种语义保证对于一个远程执行请求，服务员会为它至少执行一次，可能会重复执行多次。因此这种语义不保证会给一个调用的哪个请求返回值，但是会给这个调用返回一个或多个值。

    +   - 第四种是多次中最后一次语义（Last-of-Many-Call）。这种语义要求给一个调用的每次请求一个序号。顾客只接受最近一次请求的返回值。

    +   - 第五种是幂等语义（Idempotent）。这种语义可以使用有状态服务员，也可以无状态服务员。在有多个顾客请求远程过程调用的情况下，这种语义保证不会对结果构成不利影响。对于有状态服务员，服务员所保持的状态不会被多个顾客的请求所破坏。'
