    \nMPI_send原语。该原语有一个阻塞实现，其实现依赖于实现。MPI_send原语可以使调用者阻塞直到特定报文被拷贝到发送方的MPI运行时系统中，或者使调用者阻塞直到接收方启动了一个接收操作\n\
    \nMPI_ssend原语。该原语用于同步通信，该原语使得调用者被阻塞，直到报文已被接收者接收。\n\nMPI_sendrecv原语。该原语用于实现最强的异步通信。当发送者调用MPI_sendrecv原语，向接收者发送一个报文之后，发送者一直阻塞直到接收者返回一个应答。该原语和通常的RPC类似。\n\
    \nMPI_isend原语。使用该原语，发送者将要发送的报文的指针传递给MPI运行时系统之后，发送者马上就可以继续向下执行，由MPI运行时系统负责通信。由于传递给MPI运行时系统之后发送的报文，只知道该报文在什么地方，所以要防止一个报文在通信完成之前被覆盖，为此MPI要提供检查通信是否完成和对用户报文缓冲区进行保护的原语。MPI_isend原语相对于MPI_send原语是一种变体，它不需要将报文传递给MPI运行时系统的内部缓冲区。对于MPI_send原语而言，报文是否已经被接收者实际接收还是仅仅被拷贝到本地MPI运行时系统的内部缓冲区，这个问题不需要说明。\n\
    \nMPI_issend原语。与MPI_isend原语一样，发送者仅仅将发送的报文的指针传递给MPI运行时系统。当MPI运行时系统指出了已处理完这个报文时，发送者就可以解除阻塞，继续向下执行，并可以确认接收者已经收到报文。MPI_issend原语实际上是MPI_ssend原语的一种变体，它不需要将报文传递给MPI运行时系统的内部缓冲区。\n\
    \nMPI_recv原语。该原语用于接收一个报文，调用这个原语的进程被阻塞，直到一个报文到达为止。\n\nMPI_irecv原语。通过这个原语接收者向MPI运行时系统指示它准备好了接收一个报文，它是一个异步通信原语，接收者稍后可以检测是否确实有一个报文已经到达，接收者甚至可以阻塞直到有一个报文到达。\n"
  mdcn: "\n## 共享内存\n\n- 共享内存是对将要在多个进程间映射和共享的内存区域（段）所作的映射。这是IPC的最快捷方式，因为这种通信方式没有中介（例如管道、消息队列等等）。相反，消息直接从某内存段映射到调用进程的寻址空间。\n\
    \n- 使用共享内存技术，不同进程可以同时访问相同的内存区域。能够通过共享它们地址空间的若干部分，然后对存储在共享内存中的数据进行读和写，从而实现彼此直接通信。对进程通信来讲，这是一种最快但在某种程度上讲并非最容易的方法。这些数据可以以一种非顺序的随机的方式来访问。为避免不一致的情况，常引入信号量来协调对共享内存段的访问。\n\
    \n- 多个进程共同使用同一段物理内存空间，不需要数据的多次复制，提高了进程间的通信性能，但必须解决复杂的同步和互斥问题。\n\n## 共享内存技术的实现\n\
    \n(1) 由一个进程来创建 / 分配一个共享内存段，其大小和访问权限在其生成时设置。系统调用shmget建立一个新的共享内存区或者返回一个已经存在的共享内存区。\n\
    \n(2) 进程可挂接此存储段，同时将其映射到自己当前的数据空间中。每个进程通过其挂接的地址访问共享内存段。系统调用shmat将一个共享内存区附加到进程的虚拟地址空间上。\n\
    \n(3) 当一个进程对共享内存段的操作已经结束时，可以从虚拟地址空间中分离该共享内存段。系统调用shmdt从进程的虚拟地址空间分离一个共享内存区。\n\n\
    (4) 进程对该共享内存段进行操作。系统调用shmctl对与共享内存相关联的各种参数进行操作。\n\n(5) 当所有进程完成对该共享内存段的操作时，通常由共享内存段的创建进程负责将其删除。\n\
    \n## 共享内存的操作函数\n\n共享内存的主要操作函数如下：\n\n```\n#include <sys/shm.h>\nint shmget(key_t\
    \ key, int size, int shmflg);\n```\n\n函数shmget通过key值获取或者创建一块共享内存。如果shmflg&IPC_CREAT不为0，则在共享内存不存在时将创建它，新创建的共享内存的大小由size指示。\n\
    \n```\n#include <sys/shm.h>\nint shmctl(int shmid, int cmd, struct shmid_ds *buf);\n\
    ```\n\n函数shmctl可以用来查询一些共享内存的使用情况和进行一些控制操作。例如，shmctl(shm_id, IPC_RMID, 0); 这条语句将删除shm_id指示的共享内存。\n\
    \n```\n#include <sys/shm.h>\nvoid *shmat(int shmid, const void *shmaddr, int shmflg);\n\
    ```\n\n函数shmat将根据shmid得到指向共享内存段的指针，即这个共享内存段被附加到进程虚拟地址空间中。进程可以像使用一般的指针一样使用这个指针，例如进行强制类型转换等。\n\
    \n```\n#include <sys/shm.h>\nint shmdt(const void *shmaddr);\n```\n\n函数shmdt是将共享内存段从调用进程的虚拟地址空间中分离出去。参数shmaddr是通过函数shmat得到的指向共享内存的指针。\n\
    \n消息队列和共享内存是同一计算机内进程通信的重要方式。共享内存相对消息队列不需要数据多次拷贝，因此在数据量大的进程间通信中，使用共享内存比消息队列快得多。但是共享内存需要较复杂的进程间的同步和互斥控制，因此在具体应用中应根据需要灵活地选择。\n\
    \n## 2.2 不同节点上的进程间通信\n\n对于不同节点上的进程通信，主要采用 Internet socket技术实现。计算机网络通信通常包括广播通信、多播通信和点对点通信。\n\
    \n## 进程通信原语\n\n进程通信原语是分布式程序设计语言一部分，用于分布式进程间的通信和同步。通信原语是分布式操作系统内核与服务层之间的接口，是用进程通信协议实现的。集中式计算机系统和紧密耦合分布式计算机系统有共享的存储器，进程之间的通信和同步使用并发程序设计语言，它们使用共享变量。松散耦合分布式计算机系统不使用共享变量，物理上分开的进程之间的通信和同步使用报文交换的方法进行的。在松散耦合分布式计算机系统中，两种基本的实现进程通信的方法是：报文传递（Message\
    \ Passing）和远程过程调用（RPC—Remote Procedure Call）。\n\n### 报文传递\n\n- 报文传递允许一个进程将其数据实际地拷贝到另一个进程的地址空间中去而达到进程通信的目的，它是通过一个进程向另一个进程发送一个包含共享数据的报文来完成的。这种通信方式对两个不共享内存空间的进程是最常用的，这两个进程可能处于不同的两个计算机系统中，也可能处于一个系统中但不共享内存。报文传递通信方式包含类似于如下形式的发送和接收原语：\n\
    \n  ```\n  send(b,msg);\n  receive(a,msg);\n  ```\n\n- 这些原语可以是阻塞性的（Blocking），也可以是非阻塞性的（Nonblocking）的，它们各有自己的优缺点。\n\
    \n## 远程过程调用\n\n![](img/3a12b03e666342abc42d27db0d69f39c_39_0.png)\n\n远程过程调用的程序由五部分组成：用户程序、用户代理程序、RPC通信软件包、服务器代理程序和服务器程序。\n\
    \n## RPC调用语义\n\n- 第一种是恰好一次语义（Exactly-Once）。每次调用请求服务器只精确执行一次，它具有和本地过程调用相同的语义。这种语义比较难以实现，主要是服务器有可能崩溃。\n\
    - 第二种是最多一次语义（At-Most-Once）。最多一次语义常使用有状态服务器实现。这种语义保证一个调用的重复请求不被服务器执行，服务器根据状态表中的信息判断一个请求是否是一个重复的请求。\n\
    - 第三种是至少一次语义（At-Least-Once）。这种语义保证对于一个远程执行请求，服务器会为它至少执行一次，可能会重复执行多次。因此这种语义不保证会给一个调用的哪个请求返回值，但是会给这个调用返回一个或多个值。\n\
    - 第四种是多次中最后一次语义（Last-of-Many-Call）。这种语义要求给一个调用的每次请求一个序号。客户只接受最近一次请求的返回值。\n- 第五种是幂等语义（Idempotent）。这种语义可以使用有状态服务器，也可以无状态服务器。在有多个客户请求远程过程调用的情况下，这种语义保证不会对结果构成不利影响。对于有状态服务器，服务器所保持的状态不会被多个客户的请求所破坏。\n\
    \n## 面向连接协议的socket通信模型\n\n![](img/3a12b03e666342abc42d27db0d69f39c_41_0.png)\n\
    \n## MPI中进程地址\n\nMPI中通信总是发生在一个已知的进程组中，每个进程组都被赋予了一个组标识符（groupID），进程还有一个进程标识符（processID）。（groupID，processID）唯一地指出了报文的源地址或目的地址，不使用传输层地址。在一个计算中可能发生多个进程组重叠的现象，并且这多个进程组可以同时执行。\n\
    \n## MPI进程通信原语\n\nMPI_bsend原语。该原语支持异步通信，发送者提交要发送的报文，一般来说这个报文首先被复制到MPI运行时系统（MPI\
    \ runtime system）的本地缓冲区中。当报文已经拷贝到MPI运行时系统的本地缓冲区中后，发送者就可以继续向下执行。一旦接收者调用一个接收原语，本地的MPI运行时系统就将报文从本地缓冲区中取出并负责进行传递。\n\
    \nMPI_send原语。该原语有一个阻塞实现，其实现依赖于实现。MPI_send原语可以使调用者阻塞直到特定报文被拷贝到发送方的MPI运行时系统中，或者使调用者阻塞直到接收方启动了一个接收操作\n\
    \nMPI_ssend原语。该原语用于同步通信，该原语使得调用者被阻塞，直到报文已被接收者接收。\n\nMPI_sendrecv原语。该原语用于实现最强的异步通信。当发送者调用MPI_sendrecv原语，向接收者发送一个报文之后，发送者一直阻塞直到接收者返回一个应答。该原语和通常的RPC类似。\n\
    \nMPI_isend原语。使用该原语，发送者将要发送的报文的指针传递给MPI运行时系统之后，发送者马上就可以继续向下执行，由MPI运行时系统负责通信。由于传递给MPI运行时系统之后发送的报文，只知道该报文在什么地方，所以要防止一个报文在通信完成之前被覆盖，为此MPI要提供检查通信是否完成和对用户报文缓冲区进行保护的原语。MPI_isend原语相对于MPI_send原语是一种变体，它不需要将报文传递给MPI运行时系统的内部缓冲区。对于MPI_send原语而言，报文是否已经被接收者实际接收还是仅仅被拷贝到本地MPI运行时系统的内部缓冲区，这个问题不需要说明。\n\
    \nMPI_issend原语。与MPI_isend原语一样，发送者仅仅将发送的报文的指针传递给MPI运行时系统。当MPI运行时系统指出了已处理完这个报文时，发送者就可以解除阻塞，继续向下执行，并可以确认接收者已经收到报文。MPI_issend原语实际上是MPI_ssend原语的一种变体，它不需要将报文传递给MPI运行时系统的内部缓冲区。\n\
    \nMPI_recv原语。该原语用于接收一个报文，调用这个原语的进程被阻塞，直到一个报文到达为止。\n\nMPI_irecv原语。通过这个原语接收者向MPI运行时系统指示它准备好了接收一个报文，它是一个异步通信原语，接收者稍后可以检测是否确实有一个报文已经到达，接收者甚至可以阻塞直到有一个报文到达。\n"
