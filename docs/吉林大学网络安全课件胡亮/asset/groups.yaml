    ## WPKI证书格式


    WPKI证书格式的制定者力图减少证书的大小，使之需要更少的存储空间。方法之一就是定义一个新的服务器证书格式（WTLS证书格式），这样与标准的X.509证书相比，WTLS格式证书的长度有很大的减小；另外一个减小证书长度的方法是使用椭圆曲线密码系统（ECC，Elliptic
    Curve Cryptography）。与其它签名方案相比，ECC的密钥长度更小，使用ECC密码系统的证书长度要比其它的小100字节。另外，WPKI也严格限制证书其它数据字段的长度。WPKI证书格式是PKIX证书格式的一个子集。因此，它们的证书在他们之间可以互用。


    ## WPKI的加密算法和密钥


    WAP安全标准也可以支持传统的数字签名方案，如RSA，但由于WAP应用环境中硬件能力的限制，在无线设备上实现它们难以实施。与ECC相比，传统的签名方案需要更多的处理能力、内存和存储空间，因而，ECC密码系统更适合在无线设备中使用。同样强度的密钥（指的不是穷举密钥攻击），ECC的密钥长度（163比特）只是其他方案的六分之一（1024比特）。WAP的安全标准全面支持ECC，并且WAP设备制造商也接受ECC。在穷举密钥攻击的情况下，163比特密钥的安全性当然比1024比特的密钥要低得多。但即使163比特的密钥长度对穷举密钥攻击几乎是绝对安全的。


    无线通信在电子商务中扮演越来越重要的角色，无线环境不再是一个孤立的小岛，WAP标准已经将它和Internet连在一起。不论有线还是无线环境，电子商务的安全都有保证，而PKI总是在电子商务的安全中起到重要的作用。WPKI是传统PKI的一个扩展，包括大多数的PKI的技术和概念。象WAP中所有的安全和应用服务一样，WPKI必须是使用更有效的密码系统和数据传输技术优化了的，以适应个人无线设备硬件运算能力和无线网络的窄带宽。


    ## 课程名称：网络安全


    主讲教师：胡亮


    Email:hul@jlu.edu.cn


    ## 第6章 实用安全协议


    安全协议的研究主要包括两方面内容，即安全协议的安全性分析方法研究和各种实用安全协议的设计与分析研究。安全协议的安全性分析方法主要有两类，一类是攻击检验方法，一类是形式化分析方法，其中安全协议的形式化分析方法是安全协议研究中最关键的研究问题之一，它的研究始于80年代初，目前正处于百花齐放，充满活力的状态之中。许多一流大学和公司的介入，使这一领域成为研究热点。随着各种有效方法及思想的不断涌现，这一领域在理论上正在走向成熟。


    目前，在这一领域中比较活跃的群体包括：以Meadows 及Syverson为代表的美国空军研究实验室；以Lowe为代表的英国Leicester学院；以Schneider为代表的英国London学院；以Roscoe为代表的英国Oxford学院；以Millen为代表的美国Carnegie
    Mellon学院；以Stoller为代表的美国Indiana大学；以Thayer、Herzon及Guttman为代表的美国MITRE公司；以Bolignano为代表的美国IBM公司；以J.Mitchell及M.Mitchell为代表的美国Stanford大学；以Stubblebine为代表的美国AT&T实验室；以Paulson为代表的英国Cambridge学院；以Abadi为代表的美国数据设备公司系统研究中心等等。除了这些群体外，许多较有实力的计算机科学系及公司都有专业人员从事这一领域的研究。


    ## 6.1 协议形式化分析

    - 第一种思路是基于推理知识和信念的模态逻辑；

    - 第二种思路是基于状态搜索工具和定理证明技术；

    - 第三种思路是基于新的协议模型发展证明正确性理论。


    ## 典型的实用安全协议


    目前，已经提出了大量的实用安全协议，有代表的有：电子商务协议，IPSec协议，TLS协议，简单网络管理协议（SNMP），PGP协议，PEM协议，S-HTTP协议，S/MIME协议等。实用安全协议的安全性分析特别是电子商务协议，IPSec协议，TLS协议是当前协议研究中的另一个热点。


    典型的电子商务协议有SET协议，iKP协议等。另外，值得注意的是Kailar逻辑，它是目前分析电子商务协议的最有效的一种形式化方法。


    为了实现安全IP，Internet工程任务组IETF于1994年开始了一项IP安全工程，专门成立了IP安全工作组IPSEC，来制定和推动IETF关于IPSec的IP安全协议标准。其目标就是把安全集成到IP层，以便对Internet的安全业务提供底层的支持。IETF于1995年8月公布了一系列关于IPSec的建议标准。IPSec适用于新一代IP协议IPv4，并且是IPv6自身必备的安全机制。但由于IPSec还比较新，正处于研究发展和完善阶段。


    1994年，Netscape公司为了保护Web通信协议HTTP，开发了SSL协议的第一个成熟的版本是SSL2.0，被集成到Netscape公司的Internet产品中，包括Navigator浏览器和Web服务器产品等。SSL2.0协议的出现，基本上上解决了Web通信协议的安全问题，并很快引起了人们的关注。Microsoft公司对该协议进行了一些修改，发布了PCT协议。1996年，Netscape公司发布了SSL3.0，该版本增加了些功能和安全机制，并修改了一些安全缺陷。1997年，IETF基于SSL3.0协议发布了TLS1.0传输层安全协议的草案，Microsoft公司丢弃了PCT，和Netscape公司一起宣布支持该开放的标准。1999年，正式发布了RFC2246。

