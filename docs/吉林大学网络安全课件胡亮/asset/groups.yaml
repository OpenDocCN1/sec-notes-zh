    # 交叉认证


    PKI交叉认证属于PKI互操作问题的一部分。关于PKI的互操作，可以从三个层面进行阐述，即组件级互操作、应用级互操作、域间互操作。


    组件级互操作主要指PKI域内不同组件之间的相互操作，如CA、RA、最终实体、证书库之间的交互。组件级互操作主要解决六个问题：通用公钥算法、证书和消息格式、通信协议、证书与证书信息的存储与查询等。组件级互操作使得在同一个PKI内采用不同厂商的产品成为可能。


    应用级互操作指两个对等应用之间的兼容性，不管对应用提供支持的基础是什么，比如基于S/MIME的电子邮件客户端之间就必须支持互操作，尽管软件来自不同的厂商、运行在不同的平台上，应用来自不同厂商的PKI技术。应用级互操作要求证书与证书状态信息必须兼容，证书策略和密钥用途相一致，算法、数据加密和编码格式兼容，底层通信协议兼容等。


    域间互操作（也称作域间交叉认证问题）主要解决两个独立的PKI信任域之间的互操作问题。域间互操作被认为是最为复杂的PKI技术问题。除了上述组件级和应用级互操作所必须解决的问题外，还需要在两个域之间建立信任关系，域间PKI相关的信息能够相互调用，同时还要制定双方共同遵守的制度以及法律上的统一。'
  - '[PAGE 120]


    +   - PKI域间互操作在原本相互独立的两个或多个PKI之间建立信任关系，使来自不同信任域的用户也能够实现安全交易。从信任域扩展的角度来分析PKI的信任模型，对于域间互操作、建立全球统一PKI具有十分重要的意义。

    +   - PKI的交叉认证问题（即互操作问题）实际上就是扩展PKI的信任模型。同样，在交叉认证的过程中也要解决两个重点问题；即用户信任的起点问题和信任如何传递的问题。保持信任起点不便和信任传递路径的简洁是建立交叉认证的基本原则。

    +   - PKI中的交叉认证问题涉及的范围很广，基本上可以从技术、管理以及法规等三个层面来研究分析。技术层面包括交叉认证的模式、编码原则与通信协议等；管理层面则包含政策、认证机构保证等级及认证机构设立目的等；而数字签名法、数字签名的法律地位、加解密等输出控制与相关的安全管理标准等则属于法规层面的问题。

    +   - 由于各国政府、不同产业、不同行业、以及不同的认证机构的PKI架构、安全政策以及所采用的加密技术的不同，使得信任关系的建立在实际工作中十分复杂，从而导致PKI互连互通十分困难；这也使得各国的科研机构不约而同的将“研究具有弹性和适应的PKI互连互通机制”列在了PKI研究领域的首位。针对不同的PKI互连互通的方法论研究以及对各种方法异同点的比较，将有助于各个企业或组织选择最适当的PKI架构。'
  - '[PAGE 121]


    # 交叉认证的定义


    每一认证机构都具有自己的根密钥对，即根证书（ROOT CA），认证机构为每一用户签发的证书均是用自己的根私钥签发的，以此保证用户身份的真实、不可伪造。因此，为使不同认证机构的证书可以互相识别，必须使不同的认证机构可以互相识别形成根证书。交叉认证是指两个CA互相为对方的公钥进行数字签名，形成交叉认证证书（Cross
    Certificates）使各自签发的用户证书可以被对方的用户（应用软件）正确校验。交叉认证证书就是CA证书与用户证书之间的中间级证书。


    PKI中的交叉认证技术包括部件级交叉认证、证书级交叉认证、以及信任域间的交叉认证。部件级交叉认证主要研究PKI信任域中各操作实体的互操作性问题，包括CA与CA、CA与RA、CA与终端、RA与终端之间的协议、消息格式、证书格式以及证书与证书列表的存取方法等；证书级交叉认证主要研究应用证书的应用程序之间的互操作性，包括证书和证书状态信息兼容性、密钥用途及其限定的兼容性、数据封装和编码格式的兼容性、支持的通信协议的兼容性、共享密钥相关信息方法的兼容性等；信任域间的交叉认证主要研究信任域间的互操作性问题，包括信任域间互操作性模式、方法、标准以及证书策略（CP）、证书实施说明（CPS）等。'
