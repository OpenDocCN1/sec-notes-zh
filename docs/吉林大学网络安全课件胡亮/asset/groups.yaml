    # 异常检测


    与滥用检测相反，异常检测对系统正常状态进行研究，通过监测用户行为模式、主机系统调用特征、网络连接特征等，建立系统常态模型。在运行中，将当前系统行为与常态模型进行比较，根据其与常态偏离的程度判定事件的性质。这种方法很有可能检测到未知入侵与变种攻击，但现有系统通常都存在大量的误报。未知入侵的检测是IDS中最具挑战性的问题，其难度比不正当行为检测要大。异常检测通常使用统计学方法和机器学习方法。


    +   统计学方法 使用统计分析方法建立系统常态模型。统计的数据源包括：用户的点击键特征、telnet对话的平均长度等。通过监测输入值与期望值的偏离程度判断事件的属性，Emerald和cmnds都包括了这种方式。


    +   机器学习方法 将机器学习领域的方法和工具如神经网络、数据挖掘、遗传算法、贝叶斯网络和人工免疫系统等应用于异常检测中。这种方法也是通过建立常态模型进行异常识别。每种方法都具有不同的适用范围和特色。目前研究的热点之一是噪声数据学习


    +   混合检测 上述两类检测方法各有所长，滥用检测能够准确高效地发现已知攻击；异常检测能识别未知攻击。目前任何一种系统都不能很好地完成全部入侵检测任务。混合IDS中同时包含模式识别与异常识别系统，并且根据两种方法的特点对其进行分工，既能精确识别已知攻击，又能发现部分未知攻击，可减少误报和漏报。Emerald是一种典型的混合系统。'
