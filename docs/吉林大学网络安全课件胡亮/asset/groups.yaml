  md: '

    ## 信息安全的特征


    信息的安全性有自己的特征。这些特征体现了信息的价值，但对于不同的用户来说，同样的特征却可能具有不同的价值。


    - 保密性：防止信息有意或无意地被非授权泄露。

    - 完整性：防止信息被非授权修改、保持信息的内外一致。

    - 可用性：保证信息可以被授权者及时、可靠地访问。

    - 可控性：对信息的保密性进行控制的能力。

    - 不可抵赖性：信息源对信息无法否认或抵赖的特性。


    信息安全的主要任务就是保证信息的这些特征。


    ## 信息安全的研究内容


    随着信息技术的发展与应用，信息安全的内涵在不断的延伸，从最初的信息保密性发展到信息的完整性、可用性、可控性和不可否认性，进而又发展为"攻（攻击）、防（防范）、测（检测）、控（控制）、管（管理）、评（评估）"等多方面的基础理论和实施技术。信息安全是一个综合、交叉学科领域，它综合利用数学、物理、通信和计算机诸多学科的长期知识积累和最新发展成果，进行自主创新研究，加强顶层设计，提出系统的、完整的，协同的解决方案。与其他学科相比，信息安全的研究更强调自主性和创新性，自主性可以避免信息系统被别国植入后门，体现国家主权；而创新性可以抵抗各种攻击，适应技术发展的需求。


    ## 信息安全的研究内容


    就理论研究而言，一些关键的基础理论需要保密，因为从基础理论研究到实际应用的距离很短。现代信息系统中的信息安全其核心问题是密码理论及其应用，其基础是可信信息系统的构建与评估。总的来说，目前在信息安全领域人们所关注的焦点主要有以下几方面：


    - 1） 密码理论与技术；

    - 2） 安全协议理论与技术；

    - 3） 安全体系结构理论与技术；

    - 4） 信息对抗理论与技术；

    - 5） 网络安全与安全产品。


    ## 信息安全体系的基本成分


    四大安全理论与技术（手段）


    - 密码理论与技术（基于数学和非数学的）

    - 访问控制理论与技术（各种安全模型）

    - 安全编程理论与技术（漏洞攻击与防范）

    - 容错（与恢复）理论与技术


    ## 信息安全体系的基本成分


    三大安全主体（保护对象）


    - 网络系统（含硬件、协议、网络操作系统、网络应用软件）

    - 计算机系统（含硬件、操作系统、应用软件）

    - 信息系统（含数据、文件与各种应用信息）


    ## 2 我国网络安全现状


    网络安全具体表现为：

    - 电脑黑客活动已形成重要威胁

    - 计算机系统受病毒感染和破坏情况相当严重

    - 信息基础设施面临网络安全的挑战

    - 信息系统在预测、反应、防范和恢复能力方面存在许多薄弱环节

    - 网络政治颠覆活动频繁

    - 各企业和政府机关网络安全意识薄弱


    ## 我国已成全球第二大黑客来源地


    - □ 黑客离我们很近

    - ● CERT组织对历年来黑客攻击事件的统计


    ![](img/3a12b03e666342abc42d27db0d69f39c_336_0.png)


    ## 网络病毒、木马和间谍软件的泛滥


    ![](img/3a12b03e666342abc42d27db0d69f39c_337_0.png)


    ## 网络诈骗猖獗


    - 网络钓鱼：Phishing即网络钓鱼。Phishing与Fishing发音相同，是常见的网络欺诈行为。通常利用电子邮件和建立非法链接引诱用户到伪装网站，以套取用户的个人资料和信用卡号码等.


    > (真假淘宝网站，真假银行网站，真假qq网站)


    间谍软件已经迅速成为政府、企业网络和家用计算机的主要安全威胁，窃取机密信息并向远方泄漏、耗费系统资源。这种恶意软件已经渗透到公共搜索引擎和互联网中一般被认为安全的各个部分。间谍软件利用浏览器的漏洞广泛传染。包括蠕虫检测和响应、研究蠕虫行为的方法等。


    ## 不健康信息的主要传播途径是互联网


    不健康信息污染了互联网络环境：


    - 诈骗、暴力、色情、恐怖、宣传邪教、赌博等事情在互联网上时有发生。

    - BBS、讨论区、留言板等是“重灾区”。

    - 受害者往往是青少年为主，他们对上网着迷上瘾、难以自拔，“垃圾信息”毒害着他们幼小的

    心灵。


    ## 3 我国政府机关网络安全现状


    随着我国政府机关网络环境进一步完善，全国很多城市政府机构网络都划分成外部网络和内部网络两大部分：


    - 外部网络：是政府机构面向社会的门户、联系的渠道，其主要任务是宣传各种国家政策法律法规，发布社会大众所感兴趣的公告、信息，接受社会公众的咨询、监督，为老百姓提供各种利民服务。其主要的构成部分是政府门户网站。

    - 内部网络：是政府机构内部业务系统的网络平台，其主要作用是承载着政府机关日常工作业务的正常运转、无纸化办公、档案资料管理等功能。一些信息化建设走在前面的地方政府，还将内部网络同电子政务系统相结合，使其成为电子政府的一部分。


    ## 我国政府网络安全观念缺乏


    在我国政府的信息化建设过程中：


    - 由于传统观念、技术、预算、管理制度等因素，对网络安全的重视程度不足。

    - 很多人受传统观念影响，认为相比起黑客横行、病毒众多的外部互联网，内部网络就好比小小的世外桃源。

    - 错误的一种传统的思维方式被传承了下来：就是认为“脱离Internet网络的单机系统是安全的。”


    ## 我国政府内网安全现状


    - 从本质上讲，内部网络由于其封闭性和资源占用少的特性。其面临的安全性问题要比外部网络要轻得多。

    - 早期：政府内网的网络构成由于单机间简单互联。

    - 现在，扩展到Client/Server、Brower/Server结构，并在向多层分布式结构发展。


    ## 我国政府广域网建设过程中安全问题


    政府机关网络安全问题主要反映在以下几点：


    - 网络入侵和计算机病毒对网络系统的威胁。

    - 系统软件本身所隐含的BUG 给整个网络系统带来的安全隐患。

    - 网络硬件设备的故障给网络数据所带来的安全问题。

    - 网络拓扑结构的设计缺陷而产生的漏洞给网络系统带来的安全隐患。

    - 制度缺失和人为因素给网络系统带来的安全隐患。

    - 地震、停电、火灾等突发性自然灾害等对网络系统所带来的破坏。


    ## 提高政府网络安全性的八点对策


    - 1. 制订完善可行的网络安全管理制度，严格的贯彻落实。

    - 2. 设立完善的权限管理策略。

    - 3. 客户端和服务端的设置方面配以专人进行设置管理，以国际安全标准中的安全等级标准升级业务受理客户端。

    - 4. 网络维护部门给客户端统一安装正版的杀毒软件、病毒防火墙、负责所有更新；如有条件，购买专门的内部网络安全管理系统软件进行进一步的有效管理。辅以网络入侵检测系统、抗拒绝服务系统、安全认证网关等外网防护措施，建成政务外网网络安全防护体系，保障电子政务的安全可靠运行与有效的应用。


    ## 提高政府网络安全性的八点对策


    - ⑤ 倡导政府工作人员在运用政府计算机设备工作时的规范；如有条件，杜绝来历不明的外部存储系统在内网客户机上使用；并安装入侵检测系统和入侵检测管理系统，跟踪和记录入侵过程，通过入侵记录定期对网络设备进行调节，从源头上堵住非法程序入侵的可能性。

    - ⑥ 选择和使用合格的、拥有完善技术支持和售后服务的知名厂商的硬件设备，配备高质量UPS电源。

    - ⑦ 服务器维护人员应定期备份日志文件，备份数据。建议为服务器购买专用的备份软件，如条件允许，应给服务器配备备份磁带机、磁带库等专用备份系统。

    - ⑧ 将内网环境同外网物理剥离，从原则上做到：“内网内用，外网外用”。


    ## 国内外安全体系结构理论与技术研究现状及发展趋势


    安全体系结构理论与技术主要包括：安全体系模型的建立及其形式化描述与分析，安全策略和机制的研究，检验和评估系统安全性的科学方法和准则的建立，符合这些模型、策略和准则的系统的研制（比如安全操作系统，安全数据库系统等）。


    我国在系统安全的研究与应用方面与先进国家和地区存在很大差距。近几年来，在我国进行了安全操作系统、安全数据库、多级安全机制的研究，但由于自主安全内核受控于人，难以保证没有漏洞。而且大部分有关的工作都以美国1985年的TCSEC标准为主要参照系。开发的防火墙、安全路由器、安全网关、黑客入侵检测系统等产品和技术，主要集中在系统应用环境的较高层次上，在完善性、规范性、实用性上还存在许多不足，特别是在多平台的兼容性、多协议的适应性、多接口的满足性方面存在很大距离，其理论基础和自主的技术手段也有待于发展和强化。


    Linux开放源代码为我们自主研制安全操作系统提供了前所未有的机遇。作为信息系统赖以支持的基础系统软件--操作系统，其安全性是个关键。长期以来，我国广泛使用的主流操作系统都是从国外引进的。从国外引进的操作系统，其安全性难以令人放心。具有我国自主版权的
    安全操作系统产品在我国各行各业都迫切需要。我国的政府、国防、金融等机构对操作系统的安全都有各自的要求，都迫切需要找到一个既满足功能、性能要求，又具备足够的安全可信度的操作系统。Linux的发展及其应用在国际上的广泛兴起，在我国也产生了广泛的影响，只要其安全问题得到妥善解决，将会得到我国各行各业的普遍接受。

