    # 9.1 一个理想的入侵检测系统具有的特性


    一个理想的入侵检测系统具有如下特性：


    +   - [ ] 能以最小的人为干预持续运行。

    +   - [ ] 能够从系统崩溃中恢复和重置。

    +   - [ ] 能抵抗攻击。IDS必须能监视自身和检测自己是否已经被攻击者所改变。

    +   - [ ] 运行时间占用系统的开销最小。

    +   - [ ] 能够根据被监视系统的安全策略进行配置。

    +   - [ ] 能在使用过程中适应系统和用户行为的改变。

    +   当被监控系统的规模和受攻击的机率增加时，我们认为下列的特征也同样重要：

    +   - [ ] 能够检测具有一定规模的网络。

    +   - [ ] 保证当IDS某一部分被攻破时，对其余部分造成的影响尽可能的小。

