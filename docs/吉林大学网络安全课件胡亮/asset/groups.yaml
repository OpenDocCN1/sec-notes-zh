    \n## 可信计算研究内容2\n\n### 构件信任属性的建模、分析和预测\n\n未来的软件将是由各种构件组装而成。在使用构件组装一个系统软件时，可信的构件是实现可信系统软件的前提。如何描述构件的信任属性是关键所在，只有确定了构件信任属性的描述方法，才能对它进行分析和评估\n\
