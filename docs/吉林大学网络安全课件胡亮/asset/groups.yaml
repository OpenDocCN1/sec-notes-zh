    # 4.5 公开密钥加密算法


    1976年Diffie 和Hellman 在"密码学新方向"一文中首次提出公开密钥加密的概念。开创了密码学最引人入胜的研究领域。公开密钥加密相对于传统的对称密钥加密来说是一个重大突破。它解决了对称密钥算法所不能解决的密钥传输问题


    从提出到现在对公开密钥加密系统的研究一直是密码学的热点。自七十年代以来多种公钥加密算法被提出出来，其中包括背包算法、RSA算法、椭圆曲线算法以及我国学者陶仁骥等人提出的有限状态机算法等。这些算法都是基于一些数学问题的难解性。随着时间的推移，一些公钥加密算法已被攻破，另有很多算法被证明还只具有理论的价值而难以应用于实际。目前，只有三类公钥加密系统被认为是既安全又高效。这三类算法基于的数学困难问题为：


    +   ◆ 整数分解问题(Integer factorization problem)

    +   RSA, Rabin-Williams和 K. I. T.


    +   ◆ 离散对数问题(Discrete logarithm problem)

    +   DSA, DH和ELGamal.


    +   ◆ 椭圆曲线上的离散对数问题(Elliptic curve discrete logarithm problem)

    +   椭圆曲线上的DSA, DH和ELGamal。'
  - '[PAGE 91]


    # # RSA算法


    +   - RSA算法是第一个公开加密体制，既能用于加密也能用于数字签名。它所依据的数论中著名的Euler定理。RSA算法的设计思想是使加密和解密使用不同的密钥，而且保证从某种任一公钥出发，都没有有效的方法推出另一个密钥。这样每个用户就可以生成自己的一对密钥，并将一个密钥公布出去作为公开号钥E，另一个作为私人密钥D。现举例说明公开密钥加密的执行过程：

    +   - 当用户A要向B发送信息m时，用B的公开密钥Eb加密m，将密文发送给B，B就可以用自己的私有密钥Db解密出明文。由于用B的公开密钥加密的信息只能用B的私有密钥才能解密，所以即使密文被另一用户C窃取，C也无法解密出明文。

    +   - 我们也完全可以颠倒和钥匙的起码这个过程。首先用户B送给每一个发信者自己的“公开密钥”——一把锁，锁的钥匙只有B拥有，即为B的“私有密钥”。在当用户A要向B发通信件时，A用B的锁将信件锁进一个信箱里，将这个信箱发送给B，B就可以用自己的钥匙打开信箱得到信件。对于窥探者C即使拥有锁，也无法打开锁上的锁，因此即使截获信箱也无法得到信件。同样发信人A也无法打开自己锁上的信箱。

    +   - 这个过程的逆过程可用签名，如果A要发一封公开信，他需要在信上签名以表明信是他本人发出的。首先A拥有一些锁，称为签名锁，及给所有其它人开锁的钥匙，但只有A拥有锁。A将公开信用锁在锁在信箱里，发给每个人。由于只有A拥有锁，因此若钥匙能打开锁，则确实就是A的签名，里边的信息当然是A放入的。虽然锁必须只能用一次，否则锁就不只是A拥有了。其他人由于没有A的签名，因此无法伪造签名存信。'
