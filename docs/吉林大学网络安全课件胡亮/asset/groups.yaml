    # IPv4 的NetFilter框架的五个HOOK点的位置


    ![](img/3a12b03e666342abc42d27db0d69f39c_197_0.png)'
  - '[PAGE 198]


    # # 五个HOOK点的功能


    五个HOOK点的功能分别是：


    +   1. **NF_IP_PRE_ROUTING**：刚刚进入网络层的数据包通过此点（刚刚进行完版本号，校验和等检测），源地址转换在此点进行；ip_input中调用。

    +   2. **NF_IP_LOCAL_IN**：该经本地接收，进往本机的通讯检查点，INPUT包过滤在此点进行；ip_local_deliver中调用

    +   3. **NF_IP_FORWARD**：转发的包通过此检测点，FORWARD包过滤在此点进行；

    +   4. **NF_IP_POST_ROUTING**：所有马上要通过网络设备出去的包通过此检测点，内置的目的地址转换功能（包括地址伪装）在此点进行；

    +   5. **NF_IP_LOCAL_OUT**：本机进程发出的包通过此检测点，OUTPUT包过滤在此点进行。


    这些点是已经在内核中定义好的，内核模块能够注册在这些HOOK点进行的处理，可使用nf_register_hook函数指定。在数据报经过这些钩子函数时被调用，从而模块可以修改这次数据报，并向netfilter返回回去值。


    +   - **NF_ACCEPT** 继续将数据传输

    +   - **NF_DROP** 丢弃该数据报，不再传输

    +   - **NF_STOLEN** 模块接管该数据报，不要继续传输该数据报

    +   - **NF_QUEUE** 对该数据报进行排队（通常用于将数据报给用户空间的进程进行处理）

    +   - **NF_REPEAT** 再次调用该钩子函数'
  - '[PAGE 199]


    # Netfilter-iptables组成


    Netfilter-iptables由两部分组成，一部分是Netfilter的"钩子"，另一部分是指导这些钩子函数如何工作的一套规则，这些规则存在于被称为iptables的数据结构之中。钩子函数通过访问iptables来判断返回什么值给Netfilter框架。在现有内核2.4中已缺省内建了三个iptables：filter、nat和mangle，绝大部分报文处理功能都可以通过在这些内建（built-in）的表格中填入规则完成：


    filter，该模块的功能是过滤报文，不作任何修改，或者接受，或者拒绝。它在NF_IP_LOCAL_IN、NF_IP_FORWARD和NF_IP_LOCAL_OUT三处注册了钩子函数，也就是说，所有报文都将经由filter模块的处理。


    nat，网络地址转换（Network Address Translation），该模块以Connection Tracking模块为基础，仅对每个连接的第一个报文进行匹配和处理，然后交由Connection
    Tracking模块将处理结果应用到该连接之后的所有报文。nat在NF_IP_PRE_ROUTING、NF_IP_POST_ROUTING注册了钩子函数，如果需要，还可以在NF_IP_LOCAL_IN和NF_IP_LOCAL_OUT两处注册钩子，提供对本地报文（出/入）的地址转换。nat仅对报文头的地址信息进行修改，而不修改报文内容，按所修改的部分，nat可分为源NAT（SNAT）和目的NAT（DNAT）两类，前者修改第一个报文的源地址部分，而后者则修改第一个报文的目的地址部分。SNAT可用来实现IP伪装，而DNAT则是透明代理的实现基础。


    mangle，属于可以进行报文内容修改的IP Tables，可供修改的报文内容包括MARK、TOS、TTL等，mangle表的操作函数被嵌入在Netfilter的NF_IP_PRE_ROUTING和NF_IP_LOCAL_OUT两处。


    内核编程人员还可以通过注入模块，调用Netfilter的接口函数创建不同于上述三个表的新的iptables。'
  - '[PAGE 200]


    # IPTables


    iptables是专门针对2.4.x内核的Netfilter制作的内核外配置工具。iptables功能强大，可以对内核的表进行操作，这些操作主要指对其中规则链的添加、修改、清除。关于添加
    / 清除 / 修改规则的命令的一般语法如下：


    ```

    $ iptables [-t table] command [match] [target]

    ```'
