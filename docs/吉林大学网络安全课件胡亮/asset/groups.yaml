    ## snort预处理程序


    预处理程序从Snort版本1.5开始引入，使得Snort的功能可以很容易地扩展，用户和程序员能够将模块化的插件方便地融入Snort之中。预处理器是snort在捕获分组时对分组作的一些"预处理"动作，比如探测过小的IP碎片，重组IP分组，重组TCP报文等，snort预处理程序为spp_*.c形式，比如spp_defrag.c实现重组IP包。预处理程序代码在探测引擎被调用之前运行，但在数据包译码之后。通过这个机制，数据包可以通过额外的方法被修改或分析。使用preprocessor关键字加载和配置预处理程序。


    ## 9.5 入侵检测系统的发展及研究方向


    - 分布式入侵检测：第一层含义，即针对分布式网络攻击的检测方法；第二层含义即使用分布式的方法来检测分布式的攻击，其中的关键技术为检测信息的协同处理与入侵攻击的全局信息的提取。

    - 智能化入侵检测：即使用智能化的方法与手段来进行入侵检测。所谓的智能化方法，现阶段常用的有神经网络、遗传算法、模糊技术、免疫原理等方法，这些方法常用于入侵特征的辨识与泛化。利用专家系统的思想来构建入侵检测系统也是常用的方法之一。特别是具有自学习能力的专家系统，实现了知识库的不断更新与扩展，使设计的入侵检测系统的防范能力不断增强，应具有更广泛的应用前景。应用智能体的概念来进行入侵检测的尝试也已有报道。较为一致的解决方案应为高效常规意义下的入侵检测系统与具有智能检测功能的检测软件或模块的结合使用。

    - 全面的安全防御方案：即使用安全工程风险管理的思想与方法来处理网络安全问题，将网络安全作为一个整体工程来处理。从管理、网络结构、加密通道、防火墙、病毒防护、入侵检测多方位全面对所关注的网络作全面的评估，然后提出可行的全面解决方案。


    ## 入侵检测系统的研究问题


    - 基于网络的IDS的性能问题

    - 数据收集

    - 异常检测方法

    - IDS之间的互操作及标准化

    - 针对IDS的攻击

    - 加密技术对入侵检测的影响

    - IDS的测试


    ## 9.6 提高IDS的性能


    - 网络入侵检测系统面临两方面的挑战。一方面，网络速度不断提高，1000Mbps网络正在成为标准，同时入侵数据库不断扩大。这两个问题对IDS的处理能力提出了更高的要求，IDS处理速度必须能够与之相适应。另一方面由于网络入侵检测系统必须收集、分析、存储整个网络中所有机器的网络流量，因而需要耗费大量的处理器、存储器等系统资源。IDS必须解决由此引起的资源紧张问题。

    - 提高IDS性能的研究是IDS领域的一个重点问题，目前主要有多机并行和提高单个入侵检测器的性能两种方法。


    ## 多机并行


    现有的入侵检测方法在单机上无法高效地处理高速网络流量。多机并行方法在现有检测方法的基础上，通过两种方法分割：流量的分割、处理的分割。实现多个检测器并行工作，协同处理高速网络流量。虽然单个检测器的处理能力无法适应高速网络，但将流量分割为单个检测器能够处理的片段，并由各检测器并行处理，则可有效处理高速网络流量；处理分割是对单机入侵检测的功能进行合理划分，使处理任务均匀地散布在多个处理部件中。这种方法适合高性能计算，但不同的是，入侵检测系统的负载分割还须保证检测的正确性，即能够检测分布在多个流量片段中的攻击。


    此类系统属于滥用检测类型，由一组入侵检测器构成，每个检测器负责检测攻击模式的一个子集。在运行过程中，系统根据检测器的处理能力将检测数据分割为一组片段，其中每个片段由一组检测器处理。系统保证对每个不影响检测结果的正确性，即若检测数据包含入侵模式，则能够被检测到。系统中的每个检测器是自治的，检测器之间并不通信。系统具有可扩展性，增加检测器会提高系统处理更高网络流量的能力。


    系统包含一个网络分路器(network tap), 一个流量分割器(traffic scatterer), 一组流量分发器(traffic slicer),
    一个交换机, 一组流重组器(stream reassembler)以及一组入侵检测器。其中，网络分路器负责获取网络流量，并输出到流量分割器。流量分割器按照某种算法将流量分割为若干子集，并输出到流量分发器处理。流量分发器的任务是对分配到的流量分片进行路由，将分片传递给合适的入侵检测器。不让流量分割器进行路由的原因在于，路由是复杂的操作，这宜分散到多个流量分发器中进行。流重组器负责对网络包的重组，将这些功能独立出来也是为了减少检测器的处理压力。试验表明这种方法具有较单机系统更好的可扩展性。


    ## 提高单机入侵检测器的性能


    另一种提高入侵检测性能的方法是提高单机IDS的性能。首先概括一下入侵检测操作的类型：


    协议分析。通过协议分析模块，根据数据包的协议类型检测相应的协议域。如：TCP包的标志位，IP包长度等。分析的协议是现存的各种网络协议，如Snort中包括IP、TCP、UDP、ICMP、HTTP等协议的检测。协议分析可以显著地缩小检测模式范围，从而减少内容检查，提高了入侵检测的效率。


    内容检查。这是目前大多数网络入侵检测系统最重要的检测手段，内容模式取自攻击数据包的字符特征。一般在协议分析之后对包内容进行特征串匹配，但相反的顺序可能提高检测效率。目前多数入侵检测系统中采用的是串行单模式匹配算法。


    统计量。包括包长度，事件出现的频率等。其中Snort的关键字dsize就是对数据包的负载长度的检查。其他的统计量还有某些事件出现的量(次数或者单位时间内次数)，比如，某个IP在1分钟内报出了100条CGI事件，那么就属于一次CGI扫描事件。


    在这三种入侵检测操作中，内容检查的处理开销占据了最大的比例。以Snort为例，试验表明：在包处理中，内容检查占全部处理时间的31%。通常入侵检测系统需要在一个网络包和TCP流上同时搜索上百条入侵模式。同时入侵规则的数量巨大且在不断增加，而其中包含内容检查的规则又占了绝大多数。因此提高内容检查的效率对整个入侵检测系统性能的提升起很大的作用。


