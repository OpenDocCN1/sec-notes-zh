  - '[PAGE 34]


    # 共享内存技术的实现


    (1) 由一个进程来创建 / 分配一个共享内存段，其大小和访问权限在其生成时设置。系统调用shmget建立一个新的共享内存区或者返回一个已经存在的共享内存区。


    (2) 进程可挂接此存储段，同时将其映射到自己当前的数据空间中。每个进程通过其挂接的地址访问共享内存段。系统调用shmat将一个共享内存区附加到进程的虚拟地址空间上。


    (3) 当一个进程对共享内存段的操作已经结束时，可以从虚拟地址空间中分离该共享内存段。系统调用shmdt从进程的虚拟地址空间分离一个共享内存区。


    (4) 进程对该共享内存段进行操作。系统调用shmctl对与共享内存相关联的各种参数进行操作。


    (5) 当所有进程完成对该共享内存段的操作时，通常由共享内存段的创建进程负责将其删除。'
  - '[PAGE 35]


    # 共享内存的操作函数


    共享内存的主要操作函数如下：


    ```

    #include <sys/shm.h>

    int shmget(key_t key, int size, int shmflg);

    ```


    函数shmget通过key值获取或者创建一块共享内存。如果shmflg&IPC_CREAT不为0，则在共享内存不存在时将创建它，新创建的共享内存的大小由size指示。


    ```

    #include <sys/shm.h>

    int shmctl(int shmid, int cmd, struct shmid_ds *buf);

    ```


    函数shmctl可以用来查询一些共享内存的使用情况和进行一些控制操作。例如，shmctl(shm_id, IPC_RMID, 0);, 这条语句将删除shm_id指示的共享内存。


    ```

    #include <sys/shm.h>

    void *shmat(int shmid, const void *shmaddr, int shmflg);

    ```


    函数shmat将根据shmid得到指向共享内存段的指针，即这个共享内存段被附加到进程虚拟地址空间中。进程可以像使用一般的指针一样使用这个指针，例如进行强制类型转换等。


    ```

    #include <sys/shm.h>

    int shmdt(const void *shmaddr);

    ```


    函数shmdt是将共享内存段从调用进程的虚拟地址空间中分离出去。参数shmaddr是通过函数shmat得到的指向共享内存的指针。


    消息队列和共享内存是同一计算机内进程通信的重要方式。共享内存相对消息队列不需要数据多次拷贝，因此在数据量大的进程间通信中，使用共享内存比消息队列快得多。但是共享内存需要较复杂的进程间的同步和互斥控制，因此在具体应用中应根据需要灵活地选择。'
