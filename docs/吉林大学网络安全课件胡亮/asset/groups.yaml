    - 另外，对于简单信任列表模式无法适当地处理列表中具有某个已失效不再运作的CA的情况，这是因为失效CA与使用列表的证书用户所属的CA之间并不存在任何信任关系，该失效CA甚至不知道自己是某使用者的信任对象，因此无法告知该使用者其失效状况，导致一些信任列表的持有者将继续信任该失效CA所签发的证书，直到察觉到问题为止。对于扩展信任列表模式还存在着证书路径的寻找与构造问题。


    ## 4 桥接模式（Bridge Certification Authority, Bridge CA）


    为了弥补绝对层次模式（树状结构）和平面交叉认证模式（网状结构）的缺点，提出了桥接模式解决交叉认证问题。采用桥型结构首先要建立一个CA，该CA称为“桥CA”（BCA—Bridge
    Certification Authority），在不同的PKI体系中，起信任桥梁作用。BCA不直接向用户签发证书，它也不作为PKI体系中用户的一个信任点，只是用它来建立一个端到端的信任关系。这样，就避免了其它两种方式带来的认证策略方面的问题，允许用户保持他们原来的信任点。BCA只是一个信任关系的桥梁。


    ### 桥接模式示意图


    ![](img/3a12b03e666342abc42d27db0d69f39c_133_0.png)


    ### 桥梁模式的优点


    - 当BCA与树状PKI信任域建立信任关系时，BCA需要与该树状PKI的Root CA进行连结；当BCA与网状PKI信任域建立信任关系时，BCA则只需要与该网状PKI结构中的其中一个CA进行连结。无论上述何种情况，与BCA直接连结的CA称作信任认证机构（Principal
    CA）；通过桥接动作，任何不同PKI架构下的认证机构均可达到相互信任的目的。


    - 桥接模式最大优点就是其具有的“弹性特性”，增加一个CA或甚至一个PKI体系到BCA中是十分容易的，即BCA的扩充十分容易。在BCA架构规模不断扩大的情况下，新的信任关系的建立在BCA上面也具备可管理的特性。当架构中有某一节点的Principal
    CA受到损害时，BCA仅需注销发给该Principal CA的认证证书，使其所属的PKI与BCA间的信任关系无效，但此动作并不影响BCA与其它PKI的信任桥接功能。


    - 在BCA失效或无法正常工作的情况下，由于没有使用者以此BCA作为信任源，因此与BCA连结的各个Principal CA仅需注销各自发放给BCA的认证证书，即可终止与BCA的信任关系。这样的结果是，虽然进行桥接的各个PKI架构使用者不再享有桥接互连互通服务，成为独立运作的PKI系统，但每一系统的CA仍可正常运作。当BCA修复后，整个BCA架构即可重新恢复正常的工作状态。这也被称为桥接模式的“单纯性”。


    ### 桥接模式的缺点


    - 虽然桥接模式具备上述多项优点，但桥接模式因为需要与多种不同的PKI架构进行连接，证书的查询问题以及寻找证书认证路径的复杂度问题仍然需要进一步的研究与解决。


    - 经常被提出的桥接模式的技术性难题是证书认证路径的有效发现与验证以及不同PKI目录（PKI Directory）之间的兼容性（或互通性）问题。因为桥接模式可能会涵盖网状PKI结构，使得网状PKI存在的多信任源以及信任源查找出现循环环路的路径构造问题也会出现在桥接交叉认证模式当中。


    - 参加桥接模式的CA不但须自行构造并验证这些复杂的证书认证路径，还必须为满足某些CA的特定要求，而必须运用证书中的信息来限制或维持桥接CA之间的信任关系；这意味着在桥接模式下，不但需要处理复杂的多种数字证书格式，BCA还必须具有在验证证书认证路径的过程中适当处理及使用额外的信息能力。


    - 另一项BCA的技术性困难是关于证书能力以及证书状态信息的传播问题。在一个有效的PKI环境下，CA必须能够快速地通过单一的信息传输机制取得所需的其它CA的证书以及证书状态信息。最理想的情况是由一个统一的BCA目录（BCA
    Directory）来提供这些信息。因此，关于BCA统一目录的建设规模、性能、安全性、兼容性等技术性问题也是实际工作中遇到的难题。


    - 最后提到的桥接模式的效率问题，以FBCA为例。FBCA须能够支持实时在线交易，且不能给交易的参加者带来任何负担。在FBCA模型的电子邮件测试中，因为采用了对交易数据进行数字签名的操作，使用者必须为每一封电子邮件等待30秒钟时间来验证该数字签名的真实性，以决定是否应该接受收件；这样的时间花费对使用者来说的确不便利。所幸，使用者只需在第一次验证另一名使用者的数字签名（即等待30秒钟的验证时间），之后验证同一使用者数字签名的步骤将大幅缩短为1秒以内。


    ## 5 相互承认模式（Cross Recognition）


    - 相互承认的概念由亚太经合组织的电子安全工作组（APEC E-Security Task Group）提出，其将相互承认定义为：“相互承认是一项互通性的协定，通过它可以使依附于某PKI领域的可信团体能够使用另一个PKI领域的认证信息，达到可以认证其它PKI领域中主体身份的目的，反之亦然。”


    - 具体地说，相互承认模式实际上是一种声明（或陈述），它明确地说明了一个给定的PKI领域中的用户可以在其某个特定的应用上面信任一个外部PKI领域的数字证书。如一个团体外部的证书拥有者需要和团体内部的用户进行通信或交易；或者是需要通信或交易的双方在一个团体内部，但是因为特殊的原因他们希望使用一个外部PKI提供的CA服务，即使用外部PKI提供的数字证书。可以看出，两种方式的相互承认模式在技术处理上面没有本质的区别。


    ### 属于不同团体用户之间的相互承认


    ![](img/3a12b03e666342abc42d27db0d69f39c_137_0.png)


    ### 属于同一团体用户之间的相互承认


    ![](img/3a12b03e666342abc42d27db0d69f39c_138_0.png)


    ## 6 鉴定认可模式（Accreditation Certificate）


    鉴定认可模式（Accreditation Certificate）2000年三月首次在澳大利亚政府所倡导的“Gatekeeper”项目出版的论文中被提出。基本原理是准备进行交叉认证的机构由澳大利亚政府来鉴定。实质上来说，每个鉴定过的认证机构都拥有由Gatekeeper
    Accreditation Certificate（GCA）签发的数字证书来保障交易双方的安全性。这个签发过程提供了符合澳大利亚政府鉴定标准的认证机构给证书使用者，只要证书使用者认为GCA为可信任的机构，那么任何一个由澳大利亚政府鉴定认可的凭证机构都被认为是值得信任的。


    鉴定认可模式（Accreditation Certificate）方法与相互承认（Cross-Recognition）方法相同之处为，两种模式都不需要任何平面交叉认证进行保证（the
    assurance of cross-certificates）。在实际操作中，鉴定衡量的标准由澳大利亚政府制定，这种方法和具体的操作模式在将来非常有可能被其它国家政府所采用。


    2001年三月，澳大利亚政府宣布由银行对企业所核发的数字证书可以被所有政府单位接受，其效果等同于ABN-DSC发行的数字证书。从此澳大利亚的电子商务就可以简单地凭借数字证书对银行、贸易伙伴、政府单位进行线上电子商务、电子政务等活动，并且具有法律效力。

