    ## 第10章 网络安全整体解决方案的设计与分析


    设计网络安全的整体解决方案是解决安全问题的关键。不同的领域会有不同的安全问题，需要制定相应的对策来提高其安全水平，提供更好的保护。安全管理者要从全局分析，有针对性地制定安全策略，并结合各种安全手段，构建适合自身环境的网络安全整体解决方案。


    ## 10.1 国内外安全体系结构理论与技术研究现状及发展趋势


    安全体系结构理论与技术主要包括：安全体系模型的建立及其形式化描述与分析，安全策略和机制的研究，检验和评估系统安全性的科学方法和准则的建立，符合这些模型、策略和准则的系统的研制（比如安全操作系统，安全数据库系统等）。


    ## 10.2 国内外网络安全与安全产品研究现状及发展趋势


    网络安全是信息安全中的重要研究内容之一，也是当前信息安全领域中的研究热点。研究内容包括：网络安全整体解决方案的设计与分析，网络安全产品的研发等。网络安全包括物理安全和逻辑安全。物理安全指网络系统中的各种信息、计算机设备及相关设施的物理保护、免于破坏、丢失等。逻辑安全包括信息完整性、保密性、不可否认性和可用性。它是一个涉及网络、操作系统、数据库、应用系统、人员管理等方方面面的事情，必须综合考虑。网络中的安全威胁主要有：


    - 1）身份窃取，指用户身份在通信时被非法截取；

    - 2）假冒，指非法用户假冒合法用户身份获取敏感信息的行为；

    - 3）数据窃取，指非法用户截获通信网络的数据；

    - 4）否认，指通信方事后否认曾经参与某次活动的行为；

    - 5）非授权访问；

    - 6）拒绝服务，指合法用户的正当申请被拒绝、延迟、更改等；

    - 7）错误路由。


    解决网络信息安全问题的主要途径是利用密码技术和网络访问控制技术。密码技术用于隐藏传输信息、认证用户身份等。网络访问控制技术用于对系统进行安全保护，抵抗各种外来攻击。


    ## 10.3 计算机网络的安全策略


    物理安全策略


    物理安全策略的目的是保护计算机系统、网络服务器、打印机等硬件实体和通信链路免受自然灾害、人为破坏和搭线攻击；验证用户的身份和使用权限、防止用户越权操作；确保计算机系统有一个良好的电磁兼容工作环境；建立完备的安全管理制度，防止非法进入计算机控制室和各种偷窃、破坏活动的发生。


    抑制和防止电磁泄漏（即TEMPEST技术）是物理安全策略的一个主要问题。目前主要防护措施有两类：一类是对传导发射的防护，主要采取对电源线和信号线加装性能良好的滤波器，减小传输阻抗和导线间的交叉耦合。另一类是对辐射的防护，这类防护措施又可分为以下两种：一是采用各种电磁屏蔽措施，如对设备的金属屏蔽和各种接插件的屏蔽，同时对机房的下水管、暖气管和金属门窗进行屏蔽和隔离；二是干扰的防护措施，即在计算机系统工作的同时，利用干扰装置产生一种与计算机系统辐射相关的伪噪声向空间辐射来掩盖计算机系统的工作频率和信息特征。

