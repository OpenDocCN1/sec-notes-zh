    \n这个视频游戏的玩家购买和配置他们的 workstation、服务器、操作系统、应用程序和网络设备。他们进行折中和优化决策，因为他们尽力维持预算、生产力和安全之间的理想平衡。在较长的攻击场景中，用户经过一系列步骤前进，必须保护增值的公司资产不受逐步增强的攻击\n\
