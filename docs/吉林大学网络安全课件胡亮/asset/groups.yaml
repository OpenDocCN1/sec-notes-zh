    \n# 1 开放源码的IDS项目：Snort\n\nSnort是一种运行于单机的基于滥用检测的网络入侵检测系统。Snort通过libpcap获取网络包，并进行协议分析。它定义了一种简单灵活的网络入侵描述语言，对网络入侵进行描述（入侵特征或入侵信号）。Snort根据入侵描述对网络数据进行匹配和搜索，能够检测到多种网络攻击与侦察，包括：缓冲区溢出攻击，端口扫描，CGI攻击，SMB侦察等。并提供了多种攻击响应方式。对于最新的攻击方法，使用Snort的入侵描述语言能够快速方便地写出新攻击的描述，从而使Snort能够检测到这种攻击。在Internet上已建立了发布Snort入侵模式数据库的站点。Snort是极具活力的自由软件，在世界各地的志愿者开发下，技术和功能在不断提高。\n\
    \n# 2 商业产品\n\n国际市场上的主流商业IDS产品大部分为基于网络的，采用滥用检测方法的系统。主要有：\n\n- **RealSecure**\n\
    \  \n  RealSecure（Internet Security Systems（ISS）开发，包括三种系统部件：网络入侵检测agent、主机入侵检测agent和管理控制台。RealSecure属于分布式结构，每个网络监视器运行于专用的工作站上，监视不同的网段。RealSecure的入侵检测方法属于滥用检测，能够检测几乎所有的主流攻击方式，并实现基于主机检测和基于网络检测的完整集成。对于不同的应用程序如Exchange、MS\
    \ SQL、LDAP、Oracle和Sybase等，RealSecure提供了专门的系统代理进行入侵检测。整个系统由一个管理程序进行配置和与用户的交互，可提供安全报告等信息。RealSecure的缺点是无法进行重组，这使得它容易受到欺骗。ISS在七种IDS的评测中得到了最高的评价。\n\
    \  \n- **NFR**\n  \n  Network Flight Recorder™（NFR）是一种基于滥用检测的网络入侵检测系统。它提供两种版本：商业版，研究版（提供源码），目前已停止了研究版的发行。NFR使用经过修改的libpcap进行网络数据包分析，并拥有一种完整的分析脚本语言N-code，通过它编写对各种攻击的检测及处理程序。NFR是世界上第一种具有TCP包重组功能的IDS产品，这使得NFR能够抵抗Ptacek和Newsham提出的躲避IDS的方法。\n\
    \n# 3 研究系统\n\nEMERALD\n\nEMERALD (Event Monitoring Enabling Responses to Anomalous\
    \ Live Disturbances)是DARPA入侵检测研究的一个项目，集成了滥用检测模块和异常检测分析模块协同进行分析。它的开发充分应用了软件工程的思想，系统各模块具有独立性、可重用性。系统的设计目标包括可快速集成新颖的分析技术，能够迅速适应现有网络环境配置的动态改变等。\n\
    \nEMERALD应用了专家系统P-BEST实现滥用检测，应用统计分析技术实现异常检测。系统结构是一种易于扩充的分布式结构，监视器之间可进行通信，形成分层次的结构。监视器具有跨网通信能力，可共享分析方法，协作检测分布式网络攻击，适合于大型广域网的入侵检测。EMERALD仍在不断的发展，它采用的技术和方法代表着IDS技术发展的方向。\n\
    \nJAM\n\nJAM是DARPA的一个研究项目，采用了分布式多代理结构。每个agent在不同的数据源上分布式学习，并共享知识。JAM还应用了数据挖掘技术和meta-learning技术用于异常检测。目前JAM正在从实验系统转向应用，其技术将应用于NFR的新一代产品中。\n\
    \n# 9.4 Snort入侵检测系统\n\nSnort基于libpcap获取网络包，使用协议分析和模式匹配实现入侵检测。libpcap是unix/linux平台下的网络数据包捕获函数库，大多数网络监控软件都以它为基础。\n\
    \nlibpcap可以在绝大多数类unix平台下工作，并已经移植到Windows平台。现代操作系统几乎都提供了对底层网络数据包捕获的机制，在捕获机制之上可以建立网络监控应用软件。网络监控也常简称为嗅探器(sniffer)。\n\
    \n# Snort的工作模式\n\nSnort有三种工作模式：嗅探器、数据包记录器、网络入侵检测系统。嗅探器模式仅仅是从网络上读取数据包并作为连续不断的流显示在终端上。数据包记录器模式把数据包记录到硬盘上。网络入侵检测模式是最复杂的，而且是可配置的。可以让snort分析网络数据流以匹配用户定义的一些规则，并根据检测结果采取一定的动作。\n\
    \n# 编写snort 规则\n\nSnort使用一种简单的，轻量级的规则描述语言，这种语言灵活而强大。在开发snort规则时要记住几个简单的原则。\n\n\
    第一，大多数snort规则都写在一个单行上。或者在多行之间的行尾用\\分隔。Snort规则数分成两个逻辑部分：规则头和规则选项。规则头包含规则的动作，协议，源和目标ip地址与网络掩码，以及源和目标端口信息；规则选项部分包含报警消息内容和要检查的包的具体部分。\n\
    \n下面是一个实例规则：\n\n```\nalert tcp any any -> 192.168.1.0/24 111 (content:\"|00 01\
    \ 86 a5|\"; msg: \"mountd access\";)\n```\n\n第一个括号前的部分是规则头（rule header），包含的括号内的部分是规则选项（rule\
    \ options）。规则选项部分中冒号前的单词称为选项关键字（option keywords）。注意，不是所有规则都必须包含规则选项部分，选项部分只是为了使对要收集或报警，或丢弃的包的定义更加严格。组成一个规则的所无元素对于给定规则的要求取决于动作和要检查的包。当多个元素放在一起时，可以认为它们组成了一个逻辑与（AND）语句。同时，snort规则库文件中不同的规则可以认为是组成了一个大的逻辑或（OR）语句。选项之间可能有一定的依赖关系，选项主体可以分为四类：第一类是数据包相关各种特征的描述选项，比如：content、flags、dsize、ttl等；第二类是规则本身相关一些说明选项，比如：reference、sid、classtype、priority等；第三类是规则匹配后的动作选项，比如：msg、resp、react、session、logto、tag等；第四类是选项对某些选项的修饰，比如属于content的nocase、offset、depth、regex等。由于snort的规则语言语法非常简单，所以可以对新发现的攻击作出快速的反应，迅速开发新的snort规则。编写新的规则，最重要的是知道新攻击的特征码。要得到一个新攻击的特征码，一般的方法就是进行实际的测试。对一个测试网络进行攻击，使用snort记录在攻击主机和测试网络之间的数据流。然后，对记录的数据进行分析得到其唯一的特征码，最后把得到的特征码加入到规则中。\n"
