  - '[PAGE 32]


    # 共享内存


    +   共享内存是对将要在多个进程间映射和共享的内存区域（段）所作的映射。这是IPC的最快捷方式，因为这种通信方式没有中介（例如管道、消息队列等等）。相反，消息直接从某内存段映射到调用进程的寻址空间。


    +   使用共享内存技术，不同进程可以同时访问相同的内存区域。能够通过共享它们地址空间的若干部分，然后对存储在共享内存中的数据进行读和写，从而实现彼此直接通信。对进程通信来讲，这是一种最快但在某种程度上讲并非最容易的方法。这些数据可以以一种非顺序的随机的方式来访问。为避免不一致的情况，常引入信号量来协调对共享内存段的访问。


    +   多个进程共同使用同一段物理内存空间，不需要数据的多次复制，提高了进程间的通信性能，但必须解决复杂的同步和互斥问题。'
