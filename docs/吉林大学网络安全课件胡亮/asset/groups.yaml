    ## 特征搜索法优缺点


    - 特征代码法的优点是：检测准确快速，可识别病毒的名称，误报警率低，依据检测结果，可做解毒处理。

    - 其缺点是：


    A、速度瓶颈。随着病毒种类的增多，检索时间变长。使用传统的单模式搜索算法，如果检索10000种病毒，必须对10000种病毒特征代码逐一检查。如果病毒种数增加，检测病毒的时间开销也随之增加。保持此次检索的高速度变得十分困难。这个问题同样出现在入侵检测系统中，多模式匹配算法在一定程度上可解决这个问题。通过使用多模式匹配算法，可利用串行匹配的潜在并行性，使得查毒程序在病毒特征增加的情况下，搜索时间并不一定增加。


    B、不能检查多态性病毒。特征代码法是不可能检测多态性病毒的。多态性病毒是病毒特征代码法的盲区。


    C、不能对付隐蔽性病毒。隐蔽性病毒如果先进驻内存，后运行病毒检测工具，隐蔽性病毒能先于检测工具，将被查文件中的病毒代码剥去，检测工具由于是在检查一个虚假的“好文件”，而不能报警，被隐蔽性病毒所蒙骗。


    ## 行为监测法


    - 利用病毒的特有行为特征来监测病毒的方法，称为行为监测法。通过对病毒的观察、研究，发现一些病毒的比较特殊行为。而在正常程序中，这些行为比较罕见。当程序运行时，监视其行为，如果发现了病毒行为，立即报警。反病毒公司发现新病毒的方式并不是静态扫描，而恰恰是采用动态分析方法。即便是反病毒公司收集到可疑程序时，也不能确定是不是新病毒，为了做出准确判断，必须先运行可疑程序，然后再根据程序的行为判断是否是病毒。这种方法与异常检测的入侵检测方法类似。


    - 行为监测法的优点：可发现未知病毒，可相当准确地预报未知的多数病毒。


    - 行为监测法的缺点：可能误报警，实现时有一定难度。


    ## 计算机病毒清除


    1、文件型病毒解除

    在计算机病毒中大部分是文件型。所谓文件型病毒是指此类病毒寄生在可执行文件上，传播的途径也是通过可执行文件。借用数学的语言，消除病毒的过程实际上是病毒感染过程的逆过程。通过检测工作已经得到了病毒体的全部代码，则有可能依照一定的程序或方法即可将文件恢复，也就是说可能将病毒解除。


    2、引导型病毒的解除

    这类病毒的种类也比较多，我国发现的第一例病毒--"小球"病毒就是引导型病毒，它们占据软盘或硬盘的第二个扇区，在开机后先于操作系统得到对计算机的控制，影响系统的I/O存取速度，干扰系统正常运行；此类病毒可用：拽扯法、相对法、逻辑法、覆盖法、特殊法予以解除。


    3、内存解毒

    因为内存中的活病毒完全于抗反病毒软件的检测结果，所以几乎所有反病毒软件设计者都要考虑到内存解毒。新的内存解毒技术是找到病毒在内存中的位置，重构其中部分代码，使其传播功能失效。


    4、包裹文件病毒检测

    包裹程序是一些常见的工具软件，它可以包裹可执行文件，减小磁盘占用空间，加快运行速度。但把一个程序包裹后，病毒就会被保护起来，使各种各反病毒软件无法查到。已被包裹并含有病毒的可执行文件在执行时，病毒会受到传播，使用解包将各种病毒解除之后，一些包裹的可执行文件中的病毒却保留下来，危害较大。通过特有的解包裹模块，可以既查出被包裹后的病毒，又不破坏被包裹后没有病毒的可执行文件。


    5、检测被压缩工具处理过的文件

    文件压缩可以节省磁盘空间，便于保密和携带。但是如果将被病毒感染的文件使用压缩工具压缩了，那么按照检测正常文件的方法就无法将病毒从压缩文件中查出；采用解压缩方法和流处理可以根治这种病毒。目前大多数杀毒软件都具有这个功能。


