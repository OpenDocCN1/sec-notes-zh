    # 建立域间交叉认证的一般原则


    通过上面对各种域间交叉认证的介绍、比较和分析，结合国际上著名的PKI互操作协议，可以得出建立PKI域间交叉认证（互操作）的一些基本原则：


    +   - PKI的互操作不是纯粹的技术问题，更重要的是管理，有大家都信任的第三方（如政府）对PKI进行统一管理是目前互操作的主要方向；

    +   - 标准化 证书及状态信息、通信协议、编程接口等技术的标准化是PKI互操作的基础，是实现部件级和应用级互操作的重要保障；

    +   - 与组织结构相对应 PKI信任模型是与实际中的组织结构相对应的，因此在设计PKI架构时应以组织结构为参考；

    +   - 运营管理标准化 PKI作为信息安全的基础设施，有必要对其运营管理标准化，如CA的运营标准、私钥的保护标准以及密钥管理流程的标准化等；

    +   - 策略管理 建立互操作的一个重要问题是策略管理，也就是建立信任等级和管理制度，证书策略（CP）、认证实施说明（CPS）、PKI公开声明（PDS）是建立策略管理的基石，同时也是标准化考虑的重要内容；

    +   - 客户端软件的功能扩展 不论是采取哪一种互操作方案，都需要对客户端软件的功能进行扩展，如获取和处理不同域的PKI信息；

    +   - 目录服务 目录是存储PKI相关信息的最有效方式，因此建立标准的目录服务将为PKI的互操作扫清障碍；

    +   - 法律问题 PKI不可避免地要涉及法律问题，法律上的统一（尤其是数字签名法）将是对PKI互操作的有力保障，并且法律上的最终认同才是完整意义上的互操作。'
