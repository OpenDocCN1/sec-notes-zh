    ## 特征搜索法优缺点


    - 特征代码法的优点是：检测准确快速，可识别病毒的名称，误报警率低，依据检测结果，可做解毒处理。

    - 其缺点是：


    A、速度瓶颈。随着病毒种类的增多，检索时间变长。使用传统的单模式搜索算法，如果检索10000种病毒，必须对10000种病毒特征代码逐一检查。如果病毒种数增加，检测病毒的时间开销也随之增加。保持此次检索的高速度变得十分困难。这个问题同样出现在入侵检测系统中，多模式匹配算法在一定程度上可解决这个问题。通过使用多模式匹配算法，可利用串行匹配的潜在并行性，使得查毒程序在病毒特征增加的情况下，搜索时间并不一定增加。


    B、不能检查多态性病毒。特征代码法是不可能检测多态性病毒的。多态性病毒是病毒特征代码法的盲区。


    C、不能对付隐蔽性病毒。隐蔽性病毒如果先进驻内存，后运行病毒检测工具，隐蔽性病毒能先于检测工具，将被查文件中的病毒代码剥去，检测工具由于是在检查一个虚假的“好文件”，而不能报警，被隐蔽性病毒所蒙骗。


    ## 行为监测法


    - 利用病毒的特有行为特征来监测病毒的方法，称为行为监测法。通过对病毒的观察、研究，发现一些病毒的比较特殊行为。而在正常程序中，这些行为比较罕见。当程序运行时，监视其行为，如果发现了病毒行为，立即报警。反病毒公司发现新病毒的方式并不是静态扫描，而恰恰是采用动态分析方法。即便是反病毒公司收集到可疑程序时，也不能确定是不是新病毒，为了做出准确判断，必须先运行可疑程序，然后再根据程序的行为判断是否是病毒。这种方法与异常检测的入侵检测方法类似。


    - 行为监测法的优点：可发现未知病毒，可相当准确地预报未知的多数病毒。


    - 行为监测法的缺点：可能误报警，实现时有一定难度。


    ## 计算机病毒清除


    1、文件型病毒解除

    在计算机病毒中大部分是文件型。所谓文件型病毒是指此类病毒寄生在可执行文件上，传播的途径也是通过可执行文件。借用数学的语言，消除病毒的过程实际上是病毒感染过程的逆过程。通过检测工作已经得到了病毒体的全部代码，则有可能依照一定的程序或方法即可将文件恢复，也就是说可能将病毒解除。


    2、引导型病毒的解除

    这类病毒的种类也比较多，我国发现的第一例病毒--"小球"病毒就是引导型病毒，它们占据软盘或硬盘的第二个扇区，在开机后先于操作系统得到对计算机的控制，影响系统的I/O存取速度，干扰系统正常运行；此类病毒可用：拽扯法、相对法、逻辑法、覆盖法、特殊法予以解除。


    3、内存解毒

    因为内存中的活病毒完全于抗反病毒软件的检测结果，所以几乎所有反病毒软件设计者都要考虑到内存解毒。新的内存解毒技术是找到病毒在内存中的位置，重构其中部分代码，使其传播功能失效。


    4、包裹文件病毒检测

    包裹程序是一些常见的工具软件，它可以包裹可执行文件，减小磁盘占用空间，加快运行速度。但把一个程序包裹后，病毒就会被保护起来，使各种各反病毒软件无法查到。已被包裹并含有病毒的可执行文件在执行时，病毒会受到传播，使用解包将各种病毒解除之后，一些包裹的可执行文件中的病毒却保留下来，危害较大。通过特有的解包裹模块，可以既查出被包裹后的病毒，又不破坏被包裹后没有病毒的可执行文件。


    5、检测被压缩工具处理过的文件

    文件压缩可以节省磁盘空间，便于保密和携带。但是如果将被病毒感染的文件使用压缩工具压缩了，那么按照检测正常文件的方法就无法将病毒从压缩文件中查出；采用解压缩方法和流处理可以根治这种病毒。目前大多数杀毒软件都具有这个功能。


    ## 课程名称：网络安全


    主讲教师：胡亮


    Email:hul@jlu.edu.cn


    ## 第4章 密码学


    密码学的起源可追溯到人类语言的出现。当人们想确保他们通信的机密的时候，密码学的诞生就是不可避免了。古希腊人的斯巴达人可能是最早有意识地使用一些技术方法来加密信息的人。他们的加密设备是一根叫σκυτάλη的棍子。写信人先将一个纸条绕在棍子上，然后把要写的信在棍子表面上按照与纸条缠绕方向垂直的方向写在纸上，接着将纸条取下，送给收信人。如果不知道棍子的宽度（这里作为密钥）是不可能解密信里面的内容的。后来，罗马的军队用凯撒密码（三个字母表轮换）进行通信。在随后的19个世纪里面，主要是发明一些更加高明的加密技术，这些技术的安全性通常依赖于用户赋予它们多大的信任程度。在19世纪Kerchoffs写下了现代密码学的原理。其中一个重要的原理是：加密体系的安全性并不依赖于加密的方法本身，而是依赖于所使用的密钥。


    ## 实现保密通信必须提供的三种服务


    - 数据保密 传输的信息除了指定的接收者其他人无法解密。

    - 身份鉴别 传输通信的双方能够相互鉴别身份。

    - 保证数据完整性 保证接收者收到的信息与发送者发送的信息相同，并且能够检测到信息被破坏。


    密码学的研究目标就是设计能够实现上述三种服务的各种算法。在本章介绍的算法包括：分组加密算法、公开密钥加密算法、文摘算法。通过组合使用这些算法可全部实现这些服务。


    ### 4.1 密码理论与技术研究现状及发展趋势


    现代密码学主要包括两部分，即基于数学的密码理论与技术（包括公钥密码、分组加密算法、流加密算法、认证码、数字签名、Hash函数、身份识别、密钥管理、PKI技术等）和非数学的密码理论与技术（包括信息隐形，量子密码，基于生物特征的识别理论与技术）。


    ## 非数学的密码理论与技术


    目前国际上对非数学的密码理论与技术（包括信息隐形，量子密码，基于生物特征识别理论与技术等）非常关注，讨论也非常活跃。信息隐藏将在未来网络中保护信息免于破坏起到重要作用，信息隐藏是网络环境下把机密信息隐藏在大量信息中不让对方觉察的一种方法。特别是指图象叠加、数字水印、潜信道、隐匿协议等的理论与技术的研究已经引起人们的重视。基于生物特征（比如手形、指纹、语音、视网膜、虹膜、脸形、DNA等）的识别理论与技术已有所发展，形成了一些理论和技术，也形成了某些产品，这类产品往往由于成本高而未被广泛采用。1969年美国哥伦比亚大学的Wiesner创造性地提出了共轭编码的概念，遗憾的是他这一思想当时没有被人们接受。于是在源于共轭编码概念的量子密码理论与技术才取得了令人惊异的进步，已先后在自由空间和商用光纤中完成了单光子密钥交换协议，英国BT实验室通过30公里的光纤信道实现了每秒20k比特的密钥分配。


    近年来，英、美、日等国的许多大学和研究机构竞相投入到量子密码的研究之中。到目前为止，主要有三大类量子密码实现方案：一是基于单光子量子信道中测不准原理的；二是基于量子相关信道中Bell原理的；三是基于两个非正交量子态性质的。但许多问题还有待于研究。比如，寻找相应的量子码应以便提出更多的量子密钥分配协议，量子加解密理论的形成和完善，量子密码协议的安全性分析方法研究，量子加密算法的开发，量子密码的实用化等。总的来说，非数学的密码理论与技术还处于探索之中。


