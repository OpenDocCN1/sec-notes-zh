    ### 双主机防火墙


    - 在使用双主机防火墙时，安全性中最重要的是必须使主机内部路由功能失效。随着路由功能的失效，应用层成为网络或者网段之间的唯一路径。网段可以是网络中的任何部分，例如，系统管理员可以把办公网分成销售网段和固定资产网段，并用路由器或者防火墙将这两个网段分开。

    - 在双主机防火墙中，如果用户使内部路由有效，则防火墙将变得无用。例如，如果通过设置主机的内部路由使 IP 向前转发，则数据包非常容易避开双主机防火墙应用层的作用。

    - 在 Unix 环境下，双主机防火墙在配置中很容易发生上述错误。一些 Unix 系统（例如 Berkeley Unix）缺省时使路由功能有效。因此在基于
    Unix 系统的网络中，系统管理员必须确认已经使在双主机防火墙中的所有路由无效。如果操作系统没有提供使路由功能无效的接口，系统管理员必须在防火墙内重新配置并重建
    Unix 内核以保证操作系统使路由能力无效。


    ### 主机屏蔽防火墙


    一个包过滤路由器连接外部网络，同时一个堡垒主机安装在内部网络上。堡垒主机只有一个网卡，与内部网络连接（如图 7-2）。通常在路由器上设立过滤规则，并使这个单网卡堡垒主机成为从
    Internet 唯一可以访问的主机，确保了内部网络不受未被授权的外部用户的攻击。而 Intranet 内部的客户机，可以受控制地通过屏蔽主机和路由器访问
    Internet。


    ![](img/3a12b03e666342abc42d27db0d69f39c_193_0.png)


    ### 子网屏蔽防火墙


    这种方法是在 Intranet 和 Internet 之间建立一个被隔离的子网，用两个包过滤路由器将屏蔽子网分别与 Intranet 和 Internet
    分开。两个路由器放在子网的两端，在子网内构成一个“缓冲地带”，两个路由器一个控制 Intranet 数据流，另一个控制 Internet 数据流，Intranet
    和 Internet 均可访问屏蔽子网，但禁止它们穿过屏蔽子网通信。可根据需要在屏蔽子网中安置堡垒主机，为内部网络和外部网络的互相访问提供代理服务，但是来自两个网络的访问都必须通过两个包过滤路由器的检查。对于向
    Internet 公开的服务，像 WWW、FTP、Mail 等 Internet 服务器也可安装在屏蔽子网内，这样无论是外部用户，还是内部用户都可访问。这种结构的防火墙安全性能高，具有很强的抗攻击能力，但需要的设备多，造价高。


    子网屏蔽防火墙能够有效地抵制进攻，由于防火墙在一个单独的网络中把主机独立了。它可以限制网络进攻，并把损害内部网络的可能性最小化。


    ![](img/3a12b03e666342abc42d27db0d69f39c_194_0.png)


    ### 7.3 Linux 中的防火墙


    Linux 提供了一个非常优秀的防火墙工具——netfilter/iptables。它完全免费、功能强大、使用灵活，可以对流入和流出的网络包进行精确的控制，且可以在一台低配置机器上很好地运行。netfilter/iptables
    包含在 2.4 版本以后的内核中，它可以实现防火墙、NAT（网络地址翻译）和数据包的分割等功能。简单地说，netfilter 工作在操作系统内核，iptables
    是一个工作在用户空间的让用户定义防火墙规则集的程序。iptables 中还包含名为 ip6tables 的程序，它实现了对 IPv6 协议的包过滤功能。


    ### Netfilter 框架


    Netfilter 提供了一个抽象、通用化的框架，该框架定义的一个子功能的实现就是包过滤系统。Netfilter 为每种网络协议（IPv4、IPv6 等）定义了一套钩子函数（IPv4
    定义了 5 个钩子函数），这些钩子函数在数据包流过协议栈的几个关键点时被调用。在这几个点中，协议栈把数据包及钩子函数指针作为参数调用 Netfilter 框架。


    内核的任何模块都可以对每种协议的一个或多个钩子进行注册，实现挂接。这样当某个数据包被传递给 Netfilter 框架时，内核能够检测是否有任何模块对该协议和钩子函数进行了注册。若注册了，则调用该模块的注册时提供的回调函数，这样，这些模块就有机会检查（可能还会修改）该数据包、丢弃该数据包及指示
    Netfilter 将该数据包传入用户空间的队列。那些排队的包被传递给用户空间并被异步地处理。通过这种方式，一个用户进程能检查数据包，修改数据包，甚至可以重新将该数据包通过离开内核的同一个钩子函数注入到内核中。


    任何在 IP 层要被抛弃的 IP 数据包在真正抛弃之前都要进行检查。例如允许模块检查 ip-spoofed 包（被路由抛弃）。


    ### IPv4 的 Netfilter 框架的五个 HOOK 点的位置


    ![](img/3a12b03e666342abc42d27db0d69f39c_197_0.png)


    ### 五个 HOOK 点的功能


    五个 HOOK 点的功能分别是：


    1. **NF_IP_PRE_ROUTING**：刚刚进入网络层的数据包通过此点（刚刚进行完版本号、校验和等检测），源地址转换在此点进行；在 ip_input
    中调用。

    2. **NF_IP_LOCAL_IN**：该点用于本地接收，是发往本机的通信检查点，INPUT 包过滤在此点进行；在 ip_local_deliver 中调用。

    3. **NF_IP_FORWARD**：转发的包通过此检测点，FORWARD 包过滤在此点进行。

    4. **NF_IP_POST_ROUTING**：所有马上要通过网络设备出去的包通过此检测点，内置的目的地址转换功能（包括地址伪装）在此点进行。

    5. **NF_IP_LOCAL_OUT**：本机进程发出的包通过此检测点，OUTPUT 包过滤在此点进行。


    这些点是已经在内核中定义好的，内核模块能够注册在这些 HOOK 点进行的处理，可使用 nf_register_hook 函数指定。在数据报经过这些钩子函数时被调用，从而模块可以修改这个数据报，并向
    Netfilter 返回一个值。


    - **NF_ACCEPT** 继续将数据传输

    - **NF_DROP** 丢弃该数据报，不再传输

    - **NF_STOLEN** 模块接管该数据报，不要继续传输该数据报

    - **NF_QUEUE** 对该数据报进行排队（通常用于将数据报交给用户空间的进程进行处理）

    - **NF_REPEAT** 再次调用该钩子函数


    ### Netfilter-iptables 组成


    Netfilter-iptables 由两部分组成，一部分是 Netfilter 的“钩子”，另一部分是指导这些钩子函数如何工作的一套规则，这些规则存在于被称为
    iptables 的数据结构之中。钩子函数通过访问 iptables 来判断返回什么值给 Netfilter 框架。在现有内核 2.4 中，已缺省（默认）内建了三个
    iptables：filter、nat 和 mangle，绝大部分报文处理功能都可以通过在这些内建（built-in）的表格中填入规则完成：


    - **filter**，该模块的功能是过滤报文，不作任何修改，或者接受，或者拒绝。它在 NF_IP_LOCAL_IN、NF_IP_FORWARD 和 NF_IP_LOCAL_OUT
    三处注册了钩子函数，也就是说，所有报文都将经由 filter 模块的处理。

    - **nat**，网络地址转换（Network Address Translation），该模块以 Connection Tracking 模块为基础，仅对每个连接的第一个报文进行匹配和处理，然后交由
    Connection Tracking 模块将处理结果应用到该连接之后的所有报文。nat 在 NF_IP_PRE_ROUTING、NF_IP_POST_ROUTING
    注册了钩子函数，如果需要，还可以在 NF_IP_LOCAL_IN 和 NF_IP_LOCAL_OUT 两处注册钩子，提供对本地报文（出/入）的地址转换。nat
    仅对报文头的地址信息进行修改，而不修改报文内容，按所修改的部分，nat 可分为源 NAT（SNAT）和目的 NAT（DNAT）两类，前者修改第一个报文的源地址部分，而后者则修改第一个报文的目的地址部分。SNAT
    可用来实现 IP 伪装，而 DNAT 则是透明代理的实现基础。

    - **mangle**，属于可以进行报文内容修改的 IP Tables，可供修改的报文内容包括 MARK、TOS、TTL 等，mangle 表的操作函数被嵌入在
    Netfilter 的 NF_IP_PRE_ROUTING 和 NF_IP_LOCAL_OUT 两处。


    内核编程人员还可以通过注入模块，调用 Netfilter 的接口函数创建不同于上述三个表的新的 iptables。


    ### IPTables


    iptables 是专门针对 2.4.x 内核的 Netfilter 制作的内核外配置工具。iptables 功能强大，可以对内核的表进行操作，这些操作主要指对其中规则链的添加、修改、清除。关于添加
    / 清除 / 修改规则的命令的一般语法如下：


    ```

    $ iptables [-t table] command [match] [target]

    ```


    ### 课程名称：网络安全


    主讲教师：胡亮


    Email：hul@jlu.edu.cn


