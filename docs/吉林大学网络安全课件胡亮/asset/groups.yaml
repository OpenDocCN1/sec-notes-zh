    文件型病毒感染COM文件有两种方法，分别将病毒代码加在COM文件的前部和尾部。在感染的过程中，病毒将COM文件的开始3字节改写为跳转到病毒代码的指令。由于COM文件与执行时的内存映像完全相同，因此被感染的COM文件在执行时将首先运行病毒代码，病毒就在该文件之前抢先夺取了系统控制权。一旦病毒夺取了系统控制权，就开始进行其自身的引导工作。在一般情况下，病毒先将自身驻留到内存中，并为病毒的传染模块和表现模块设置好一定的触发条件，然后，病毒就开始监视系统的运行。完成了这些工作之后，病毒才会将系统控制权交还给用户执行的可执行文件。


    ## 典型病毒及原理


    每一种病毒都有其既定的攻击和传染对象，都有其特定的实现原理、特定的传染方式和危害方式，通过一定的传播渠道对计算机系统实施危害。虽然病毒越来越多，但绝大多数病毒都是模仿其它病毒编写的，这些病毒的传播、感染、加载、破坏等行为特点都可以从已经存在的病毒中找到，作为一般用户不必要、也不可能对每种病毒都作详细的了解。因此，通过分析典型的几种病毒，就可举一反三，触类旁通，快速将新病毒分类，找出查杀方法。


    ## "红色代码2"病毒


    "红色代码2"（Code Red II）是一种新型的网络病毒，造成破坏主要是涂改网页，对网络上的其它服务器进行攻击，被攻击的服务器又可以继续攻击其它服务器。在每月的20-27日，向特定IP地址198.137.240.91（www.whitehouse.gov）发动攻击。同时对系统进行软硬件扫描，因而还可能会导致上网及浏览功能明显减慢。这是一个蠕虫+木马型病毒。和第一版红色代码蠕虫病毒相比，这并不是一个简单的变种，这个新蠕虫是极度危险的，因为它不是简单的修改主页，而是通过微软IIS
    Web服务器漏洞实现对一个木马文件的上传和运行。受影响系统主要是未安装补丁程序的微软IIS Web服务器。


    红色代码蠕虫采用了缓存区溢出技术，利用网络上使用微软IIS系统的服务器的端口80来进行病毒的传播。与其它病毒不同的是，红色代码并不将病毒信息写入被攻击服务器的硬盘。它只是驻留在被攻击服务器的内存中，并借助这个服务器的网络连接攻击其它的服务器。而且这种病毒还可以在遭到攻击的机器上植入“特洛伊木马”，使得被攻击的机器“后门大开”。红色代码2拥有极强的可扩充性，通过程序自行完成的木马植入工作，使得病毒作者可以通过修改此程序来达到不同的破坏目的。


    目前，“红色代码”病毒已经发展到了第三代，该病毒是一个典型的恶性病毒。根据一个独立的研究公司报道，仅2001年7月和8月份，“红色代码”在全球就造成大约26亿美元的损失。


    ## "红色代码2"病毒原理


    当本地IIS服务程序收到某个来自Code Red II发的请求数据包时，由于存在漏洞，导致处理函数的堆栈溢出（Overflow）。当函数返回时，原返回地址已被病毒数据包覆盖，程序运行进入到病毒代码中，此时病毒被激活，并运行在IIS服务程序中。病毒代码首先会判断内存中是否已注册了一个名为Code
    Red II的Atom(系统用于对象识别)，如果已存在此对象，表示此机器已被感染，病毒进入无限休眠状态，未感染则注册Atom并创建300个病毒线程，当判断到系统默认的语言ID是中华人民共和国或中国台湾时，线程数猛增到1600个。创建完毕后初始化病毒体内的一个随机数发生器，此发生器产生用于病毒感染的目标电脑IP地址。每个病毒线程每100毫秒就会向一个随机地主机地址的80端口发送一个长度为3818字节的病毒传染数据包。完成上述工作后病毒将系统目录下的CMD.EXE文件分别复制到系统根目录\inetpub\scripts和系统根目录\progra~1\common~1\system\MSADC目录下，并取名为root.exe。然后从病毒体内释放出一个木马程序，复制到系统根目录下，并取名为explorer.exe，此木马运行后会调用系统原explorer.exe，运行效果和正常explorer程序无异，但注册表中的很多项已被修改。由于释放木马的代码是个循环，如果目的目录下explorer.exe发现被删，病毒又会释放出一个。


    ## CIH病毒


    该病毒是迄今为止发现的破坏性最大的病毒之一，是首例直接破坏计算机系统硬件的病毒。它发作时不仅破坏硬盘的引导区和分区表，而且破坏计算机系统flashBIOS芯片中的系统程序，导致主板损坏。CIH首先在台湾被发现，根据台北官方的报告，计算机病毒是由24岁的陈盈豪（Chen
    Ing-Halu）编制的，由于其名字第二个字母分别为C、I、H，所以这可能是计算机病毒名称的由来。其别名有Win95.CIH、Spacefiller、Win32.CIH、PE_CIH。它主要感染Windows95/98下的可执行文件（PE格式，Portable
    Executable Format），目前的版本不感染DOS以及WIN 3.X下的可执行文件，并且在Win NT中无效。其发展过程经历了v1.0、v1.1、v1.2、v1.3、v1.4总共5个版本，目前最流行的是v1.2版本。


    最初的 V1.0版本仅仅只有 656字节，其雏形显得比较简单，与普通类型的病毒在结构上并无多大的改变，其最大的创新是可以感染Microsoft Windows
    PE类可执行文件，被其感染的程序文件长度增加。此版本中的CIH不具有破坏性。当发展到v1.1版本时，病毒长度为796字节，此版本的CIH病毒具有可判断Windows
    NT操作系统信息的功能，一旦判断运行环境是Windows NT，则不发生作用，进行自我隐藏，以避免生产商提出信息，同时对代码进行优化，缩减了长度。此版本的CIH另外一个特点在于其可以利用WIN
    PE可执行文件中的“空隙”，将自身根据需要分成几段后，分别插入到PE类可执行文件中，这样做的优点是在感染大部分WIN PE类文件时，不会导致文件长度增加。


    其发展到v1.2版本时，除了改进了上述缺陷之外，同时增加了破坏用户硬盘以及用户主机BIOS程序的代码，这使得其步入恶性病毒的行列。v1.2版本的CIH病毒最大的缺陷在于当其感染ZIP自解压文件时，将导致此ZIP压缩包在自解压时出现：

    WinZip Self-Extractor header corrupt.

    Possible cause: disk or file transfer error.

    的错误警告信息。v1.3版本的CIH病毒改进了以上缺陷，它的改进方法是：一旦判断开启的文件是WinZIP类的自解压程序，则不进行感染，同时，此版本的CIH病毒修复了发作时间。v1.4版本的CIH病毒改进了上几个版本中的缺陷，不感染ZIP自解压包文件，同时修改了发作日期及病毒中的版本信息（版本信息被更改为：“CIH
    v1.4 TATUNG”，在以前版本中的相关信息为“CIH v1.x TTIT”），此版本的病毒长度为1019字节。

