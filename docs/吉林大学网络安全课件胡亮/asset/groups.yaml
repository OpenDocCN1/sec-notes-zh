    # 恶意软件检测


    +   - 间谍软件已经迅速成为政府、企业网络和家用计算机的主要安全威胁，窃取机密信息并向远方泄露、耗费系统资源。这种恶意软件已经渗透到公共搜索引擎和互联网中一般被认为安全的各个部分。间谍软件利用浏览器的漏洞广泛传染。包括蠕虫检测和响应、研究蠕虫行为方法等。

