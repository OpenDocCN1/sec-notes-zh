    ## 服务原语


    服务原语是引用服务的工具，（N+1）层实体通过使用（N）层的服务原语向（N）层实体要求某个（N）层服务。对一个服务的引用通常是要用多个有关的服务原语来实现。在OSI参考模型中定义了四种类型的服务原语：


    + （1）请求(request)原语，这是由(N+1)层实体向(N)层实体发出的，要求这个(N)层实体向它提供指定的(N)层服务，如进行一次数据传送。

    + （2）指示(indication)原语，这是由(N)层实体向(N+1)层实体发出的，通知这个(N+1)层实体某个特定的(N)层服务已经开始。

    + （3）响应(response)原语，这是由(N+1)层实体向(N)层实体发出的，表示对这个(N)层实体送来的指示原语的响应。

    + （4）证实(confirm)原语，这是由(N)层实体向(N+1)层实体发出的，表示它请求的(N)层服务已经完成。


    为了方便起见，服务原语所涉及的服务常常就在原语名中反映出来，如传输层中的数据传送原语名为T-DATA,而表示层中的数据传送原语名P-DATA等。


    ## 证实型服务中服务原语的相互关系


    ![](img/3a12b03e666342abc42d27db0d69f39c_14_0.png)


    ## 非证实型服务中服务原语的相互关系


    ![](img/3a12b03e666342abc42d27db0d69f39c_15_0.png)


    ## 服务原语的组成


    一个完整的服务原语由三部分组成：原语名字、原语类型和原语参数。原语名字指出是哪一层提供的何种服务。例如，当传输层的用户（即对话实体）要利用传输服务建立传输连接时，它使用请求建立连接的服务原语T-CONNECT.request,其中T是传输层的缩写名。在OSI定义的四种原语类型中，原语参数是在标准中预先定义好的，例如，目的地址、源地址、类型及服务质量等。


    ## 面向连接的和无连接的服务


    | 项目 | 面向连接 | 面向无连接 |

    |---|---|---|

