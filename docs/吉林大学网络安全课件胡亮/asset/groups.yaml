    \n#### 2 平面交叉认证模式\n\n![](img/3a12b03e666342abc42d27db0d69f39c_126_0.png)\n\n-\
    \ 平面交叉认证模式没有明确的信任中心，各个CA之间是平等的。\n- 平面交叉认证模式具有如下优点：\n    - 由于具有多个信任点，因此这种模式具有很好的灵活性，如一个CA非常容易加入到该体系中来。属于非分层管理的结构模型；\n\
    \    - 不存在唯一的信任中心，因此当一个信任点出现信任问题之后（如CA1的私钥泄密），不会造成整个PKI体系的崩溃。并且由于每个信任点的用户数相对较少，因此恢复这种信任关系相对容易；\n\
    \    - 可以比较容易的在各个独立的CA之间建立信任关系，即信任链的节点数目最多为加入该信任体系CA的数量；\n- 与链式层次模式一样，平面交叉认证模式也同样具有一些缺点：\n\
    \    - 证书验证路径难以确定。因为用户可以有多种选择，比如CA1的用户要与CA2的用户确认相互信任的关系，可以选择两种途径：\n        - CA1（——）CA2；\n\
    \        - CA1（——）CA3（——）CA2；\n    - 由于有多种验证途径可供选择，因此容易产生验证路径过长的情况（即事先无法估计验证路径的长度），并且如果存在单方信任的情况下，有些信任路径无法建立双向信任关系。事实上，网状结构的这个缺点恰恰是由于在这种模式中存在多个信任点造成的；\n\
    \    - 在这种模式下的用户必须根据证书中的内容确认该证书能够在什么应用中使用，而不能根据证书是哪一个CA签发的来确定。\n\n#### 3 证书信任列表模式\n\
    \n- 证书信任列表（CTL）是一份被认证机构数字签名后包含“所信任认证机构根证书”列表的PKCS#7数据结构；因为使用了数字签名技术，因此CTL具有一定的抗篡改能力。使用者可以通过该数据结构中的一大串认证机构的数字证书遴选出其所信任的认证机构，同时也可以获得其所信任的认证机构的政策依据（通过CTL中的策略标识符policy\
    \ identifiers指明）。\n\n- 从PKI领域间互连互通性观点出发，CTL是一个既简单又实用的手段。值得注意的是，在形成可信任的CTL之前，必须先评价和确定CTL的签发机构以及CTL中包含的所有证书中指明的认证机构的可信性。在应用CTL时，需要相关的应用程序（如浏览器）支持CTL的结构和方法。\n\
    \n- 在实际的应用中，主要存在两种证书信任列表：简单信任列表（Simple Trust List）、扩展信任列表（Extended Trust List）。\n"
  mdcn: "\n## 以用户为中心的信任模型示意图\n\n![](img/3a12b03e666342abc42d27db0d69f39c_117_0.png)\n\
    \n图5-6 以用户为中心的信任模型\n\n## 信任模型比较\n\n|  | 层次结构 | 分布式 | 基于信任列表 | 以用户为中心 |\n|---|---|---|---|---|\n\
    | 信任起点 | 根CA | 本地发证CA | 所有接受的可信CA列表 | 信任关系网的起点 |\n| 可信CA私钥泄露所带来的问题 | 毁灭性灾难 | 只影响该CA的用户\
    \ | 需要所有用户修改自身配置，否则可能造成欺骗 | 无中心CA |\n| 认证路径构造 | 简单，自上而下 | 难，可能会出现多路径或死循环现象 | 各CA独立可信，无需构造信任路径\
    \ | 依靠信任关系网建立 |\n| 对目录的依赖性 | 低 | 高 | 低 | 高，依靠集中查询信任关系 |\n| 对域间互操作的支持 | 弱，需要一方更改自己的信任起点\
    \ | 较好，但数量的增加会带来管理上的困难 | 需要所有用户同时操作，可实施性较差 | 以个体为单位形成信任链（不构成域） |\n\n## 交叉认证\n\n\
    PKI交叉认证属于PKI互操作问题的一部分。关于PKI的互操作，可以从三个层面进行阐述，即组件级互操作、应用级互操作、域间互操作。\n\n组件级互操作主要指PKI域内不同组件之间的相互操作，如CA、RA、最终实体、证书库之间的交互。组件级互操作主要解决六个问题：通用公钥算法、证书和消息格式、通信协议、证书与证书信息的存储与查询等。组件级互操作使得在同一个PKI内采用不同厂商的产品成为可能。\n\
    \n应用级互操作指两个对等应用之间的兼容性，不管对应用提供支持的基础是什么，比如基于S/MIME的电子邮件客户端之间就必须支持互操作，尽管软件来自不同的厂商、运行在不同的平台上，应用来自不同厂商的PKI技术。应用级互操作要求证书与证书状态信息必须兼容，证书策略和密钥用途相一致，算法、数据加密和编码格式兼容，底层通信协议兼容等。\n\
    \n域间互操作（也称作域间交叉认证问题）主要解决两个独立的PKI信任域之间的互操作问题。域间互操作被认为是最为复杂的PKI技术问题。除了上述组件级和应用级互操作所必须解决的问题外，还需要在两个域之间建立信任关系，域间PKI相关的信息能够相互调用，同时还要制定双方共同遵守的制度以及法律上的统一。\n\
    \n- PKI域间互操作在原本相互独立的两个或多个PKI之间建立信任关系，使来自不同信任域的用户也能够实现安全交易。从信任域扩展的角度来分析PKI的信任模型，对于域间互操作、建立全球统一PKI具有十分重要的意义。\n\
    - PKI的交叉认证问题（即互操作问题）实际上就是扩展PKI的信任模型。同样，在交叉认证的过程中也要解决两个重点问题：即用户信任的起点问题和信任如何传递的问题。保持信任起点不变和信任传递路径的简洁是建立交叉认证的基本原则。\n\
    - PKI中的交叉认证问题涉及的范围很广，基本上可以从技术、管理以及法规等三个层面来研究分析。技术层面包括交叉认证的模式、编码原则与通信协议等；管理层面则包含政策、认证机构保证等级及认证机构设立目的等；而数字签名法、数字签名的法律地位、加解密等输出控制与相关的安全管理标准等则属于法规层面的问题。\n\
    - 由于各国政府、不同产业、不同行业、以及不同的认证机构的PKI架构、安全政策以及所采用的加密技术的不同，使得信任关系的建立在实际工作中十分复杂，从而导致PKI互连互通十分困难；这也使得各国的科研机构不约而同地将“研究具有弹性和适应性的PKI互连互通机制”列在了PKI研究领域的首位。针对不同的PKI互连互通的方法论研究以及对各种方法异同点的比较，将有助于各个企业或组织选择最适当的PKI架构。\n\
    \n### 交叉认证的定义\n\n每一认证机构都具有自己的根密钥对，即根证书（ROOT CA），认证机构为每一用户签发的证书均是用自己的根私钥签发的，以此保证用户身份的真实、不可伪造。因此，为使不同认证机构的证书可以互相识别，必须使不同的认证机构可以互相识别形成根证书。交叉认证是指两个CA互相为对方的公钥进行数字签名，形成交叉认证证书（Cross\
    \ Certificates）使各自签发的用户证书可以被对方的用户（应用软件）正确校验。交叉认证证书就是CA证书与用户证书之间的中间级证书。\n\nPKI中的交叉认证技术包括部件级交叉认证、证书级交叉认证、以及信任域间的交叉认证。部件级交叉认证主要研究PKI信任域中各操作实体的互操作性问题，包括CA与CA、CA与RA、CA与终端、RA与终端之间的协议、消息格式、证书格式以及证书与证书列表的存取方法等；证书级交叉认证主要研究应用证书的应用程序之间的互操作性，包括证书和证书状态信息兼容性、密钥用途及其限定的兼容性、数据封装和编码格式的兼容性、支持的通信协议的兼容性、共享密钥相关信息方法的兼容性等；信任域间的交叉认证主要研究信任域间的互操作性问题，包括信任域间互操作性模式、方法、标准以及证书策略（CP）、证书实施说明（CPS）等。\n\
    \n### 交叉认证需要考虑的因素\n\n#### 技术因素\n\n实际上，进行PKI交叉认证需要考虑的技术因素包含当所有参与交叉认证的各方（指各PKI信任域）在达成了必要的商业意向或协议之后，从事PKI交叉认证所需所有的传输协议、数据结构和其它如证书发放和管理流程以及证书废止和共享法案等相关的技术范畴。\n\
    \n#### 政策和应用因素\n\n政策和应用因素是为了达成互连互通目的所建立的两个PKI信任域间关系的非技术性的因素。建立信任域间互连互通性关系的根本在于信息电子化交换的需求。正因为有了互连互通的需求，才会导致进行交叉认证的两个PKI信任域依靠本身拥有的应用资源为其电子信息交换的需求建立一整套的交叉认证条件，而这些应用资源也就是用来处理不同领域间互通性的关键因素。\n\
    \n#### 法规因素\n\n法规因素是三个因素中的最难理解，也是现实操作当中最不好处理的地方，因此是目前进行交叉认证讨论时的重要议题之一。因为法规因素涉及到不同国家、不同行业和领域的不同法规环境对数字签名的接受程度。国内外许多研究机构都十分重视对交叉认证问题法规因素的研究，目前重点是在交叉认证中责任与义务方面问题的研究。\n\
    \n### 域间交叉认证模式\n\n由于各个PKI信任域的建立的目的、原则可能都不相同，其采用的策略、技术就可能更不相同。因此在两个或多个PKI信任域进行互连互通时就存在着多种PKI交叉认证的模式，基本上可大致分为如下七种：绝对层次模式（Strict\
    \ Hierarchy）、平面交叉认证模式（Cross Certification）、证书信任列表（Certificate Trust List, CTL）、桥接模式（Bridge\
    \ CA）、相互承认模式（Cross Recognition）、鉴定认可模式（Accreditation Certificate）、代理路径查询与验证模式（Delegated\
    \ Path Discovery & Validation）等。\n\n#### 1 绝对层次模式\n\n![](img/3a12b03e666342abc42d27db0d69f39c_124_0.png)\n\
    \n#### 2 平面交叉认证模式\n\n![](img/3a12b03e666342abc42d27db0d69f39c_126_0.png)\n\n-\
    \ 平面交叉认证模式没有明确的信任中心，各个CA之间是平等的。\n- 平面交叉认证模式具有如下优点：\n    - 由于具有多个信任点，因此这种模式具有很好的灵活性，如一个CA非常容易加入到该体系中来。属于非分层管理的结构模型；\n\
    \    - 不存在唯一的信任中心，因此当一个信任点出现信任问题之后（如CA1的私钥泄密），不会造成整个PKI体系的崩溃。并且由于每个信任点的用户数相对较少，因此恢复这种信任关系相对容易；\n\
    \    - 可以比较容易的在各个独立的CA之间建立信任关系，即信任链的节点数目最多为加入该信任体系CA的数量；\n- 与链式层次模式一样，平面交叉认证模式也同样具有一些缺点：\n\
    \    - 证书验证路径难以确定。因为用户可以有多种选择，比如CA1的用户要与CA2的用户确认相互信任的关系，可以选择两种途径：\n        - CA1（——）CA2；\n\
    \        - CA1（——）CA3（——）CA2；\n    - 由于有多种验证途径可供选择，因此容易产生验证路径过长的情况（即事先无法估计验证路径的长度），并且如果存在单方信任的情况下，有些信任路径无法建立双向信任关系。事实上，网状结构的这个缺点恰恰是由于在这种模式中存在多个信任点造成的；\n\
    \    - 在这种模式下的用户必须根据证书中的内容确认该证书能够在什么应用中使用，而不能根据证书是哪一个CA签发的来确定。\n\n#### 3 证书信任列表模式\n\
    \n- 证书信任列表（CTL）是一份被认证机构数字签名后包含“所信任认证机构根证书”列表的PKCS#7数据结构；因为使用了数字签名技术，因此CTL具有一定的抗篡改能力。使用者可以通过该数据结构中的一大串认证机构的数字证书遴选出其所信任的认证机构，同时也可以获得其所信任的认证机构的政策依据（通过CTL中的策略标识符policy\
    \ identifiers指明）。\n\n- 从PKI领域间互连互通性观点出发，CTL是一个既简单又实用的手段。值得注意的是，在形成可信任的CTL之前，必须先评价和确定CTL的签发机构以及CTL中包含的所有证书中指明的认证机构的可信性。在应用CTL时，需要相关的应用程序（如浏览器）支持CTL的结构和方法。\n\
    \n- 在实际的应用中，主要存在两种证书信任列表：简单信任列表（Simple Trust List）、扩展信任列表（Extended Trust List）。\n"
