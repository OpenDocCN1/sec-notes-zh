    Encryption Standard）的建议，作为一种取代DES的二十一世纪加密标准技术。其目标是：（1）执行速度快；（2）易于设计；（3）从大型计算机到智能IC卡（CPU卡）都可实现。在1998年8月举行的第一次AES会议（AES1）上，宣布了来自12个国家的15种候选AES算法。'
