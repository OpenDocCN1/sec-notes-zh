    ## 信息安全的研究内容


    随着信息技术的发展与应用，信息安全的内涵在不断的延伸，从最初的信息保密性发展到信息的完整性、可用性、可控性和不可否认性，进而又发展为"攻（攻击）、防（防范）、测（检测）、控（控制）、管（管理）、评（评估）"等多方面的基础理论和实施技术。信息安全是一个综合、交叉学科领域，它综合利用数学、物理、通信和计算机诸多学科的长期知识积累和最新发展成果，进行自主创新研究，加强顶层设计，提出系统的、完整的，协同的解决方案。与其他学科相比，信息安全的研究更强调自主性和创新性，自主性可以避免信息系统被别国植入后门，体现国家主权；而创新性可以抵抗各种攻击，适应技术发展的需求。


    就理论研究而言，一些关键的基础理论需要保密，因为从基础理论研究到实际应用的距离很短。现代信息系统中的信息安全其核心问题是密码理论及其应用，其基础是可信信息系统的构建与评估。总的来说，目前在信息安全领域人们所关注的焦点主要有以下几方面：


    - 1） 密码理论与技术；

    - 2） 安全协议理论与技术；

    - 3） 安全体系结构理论与技术；

    - 4） 信息对抗理论与技术；

    - 5） 网络安全与安全产品。


    ## 信息安全体系的基本成分


    四大安全理论与技术（手段）


    - - 密码理论与技术（基于数学和非数学的）

    - - 访问控制理论与技术（各种安全模型）

    - - 安全编程理论与技术（漏洞攻击与防范）

    - - 容错（与恢复）理论与技术


    三大安全主体（保护对象）


    - - 网络系统（含硬件、协议、网络操作系统、网络应用软件）

    - - 计算机系统（含硬件、操作系统、应用软件）

    - - 信息系统（含数据、文件与各种应用信息）


    ## 3 网络安全现状


    网络安全具体表现为：


    - - 电脑黑客活动已形成重要威胁

    - - 计算机系统受病毒感染和破坏情况相当严重

    - - 信息基础设施面临网络安全的挑战

    - - 信息系统在预测、反应、防范和恢复能力方面存在许多薄弱环节

    - - 网络政治颠覆活动频繁

    - - 各企业和政府机关网络安全意识薄弱


    ## 我国已成全球第二大黑客来源地


    - □ 黑客离我们很近


    - ● CERT组织对历年来黑客攻击事件的统计


    ![](img/3a12b03e666342abc42d27db0d69f39c_384_0.png)


    ## 网络病毒、木马和间谍软件的泛滥


    ![](img/3a12b03e666342abc42d27db0d69f39c_385_0.png)


    ## 网络诈骗猎狐


    - - 网络钓鱼：Phishing即网络钓鱼。Phishing与Fishing发音相同，是常见的网络欺诈行为。通常利用电子邮件和建立非法链接引诱用户到伪装网站，以套取用户的个人资料和信用卡号码等。

    - （真假淘宝网站，真假银行网站，真假qq网站）


    间谍软件已经迅速成为政府、企业网络和家用计算机的主要安全威胁，窃取机密信息并向远方泄露、耗费系统资源。这种恶意软件已经渗透到公共搜索引擎和互联网中一般被认为安全的各个部分。间谍软件利用浏览器的漏洞广泛传染。包括蠕虫检测和响应、研究蠕虫行为方法等。


    ## 不健康信息的主要传播途径是互联网


    不健康信息污染了互联网网络环境：


    - - 诈骗、暴力、色情、恐怖、宣传邪教、赌博等事情在互联网上时有发生。


    - - BBS、讨论区、留言板等是“重灾区”。


    - - 受害者往往是青少年为主，他们对上网着迷上瘾、难以自拔，“垃圾信息”毒害着他们幼小的

    心灵。


    ## 4 密码学


    密码学的起源可追溯到人类语言的出现。当人们想确保他们通信的机密的时候，密码学的诞生就是不可避免了。古希腊人的斯巴达人可能是最早有意识地使用一些技术方法来加密信息的人。他们的加密设备是一根叫σκυτάλη的棍子。写信人先将一个纸条绕在棍子上，然后把要写的信在棍子表面上按照与纸条缠绕方向垂直的方向写在纸上，接着将纸条取下，送给收信人。如果不知道棍子的宽度（这里作为密钥）是不可能解密信里面的内容的。后来，罗马的军队用凯撒密码（三个字母表轮换）进行通信。在随后的19个世纪里面，主要是发明一些更加高明的加密技术，这些技术的安全性通常依赖于用户赋予它们多大的信任程度。在19世纪Kerchoffs写下了现代密码学的原理。其中一个重要的原理是：加密体系的安全性并不依赖于加密的方法本身，而是依赖于所使用的密钥。


    ## 实现保密通信必须提供的三种服务


    - - 数据保密 传输的信息除了指定的接收者其他人无法解密。

    - - 身份鉴别 传输通信的双方能够相互鉴别身份。

    - - 保证数据完整性 保证接收者收到的信息与发送者发送的信息相同，并且能够检测到信息被破坏。


    密码学的研究目标就是设计能够实现上述三种服务的各种算法。在本章介绍的算法包括：分组加密算法、公开密钥加密算法、文摘算法。通过组合使用这些算法可全部实现这些服务。


    ## 现代密码学主要包括两部分：


    基于数学的密码理论与技术（包括公钥密码、分组加密算法、流加密算法、认证码、数字签名、Hash函数、身份识别、密钥管理、PKI技术等）


    非数学的密码理论与技术（包括信息隐形，量子密码，基于生物特征的识别理论与技术）。


    ## 5 访问控制策略


    访问控制是网络安全防范和保护的主要策略，它的主要任务是保证网络资源不被非法使用和非正常访问。它也是维护网络系统安全、保护网络资源的重要手段。各种安全策略必须相互配合才能真正起到保护作用，但访问控制可以说是保证网络安全最重要的核心策略之一。


    ## 入网访问控制


    - 入网访问控制为网络访问提供了第一层访问控制。它控制哪些用户能够登录到服务器并获取网络资源，控制准许用户入网的时间和准许他们在哪台工作站入网。


    - 用户的入网访问控制可分为三个步骤：用户名识别与验证、用户口令的识别与验证、用户帐号的缺省限制检查。三道关卡中只要任何一关未过，该用户便不能进入该网络。


    ## 网络的权限控制


    网络的权限控制是针对网络非法操作所提出的一种安全保护措施。用户和用户组被赋予一定的权限。网络控制用户和用户组可以访问哪些目录、子目录、文件和其他资源。可以指定用户对这些文件、目录、设备能够执行哪些操作。受托者指派和继承权限屏蔽（IRM）可作为其两种实现方式。受托者指派控制用户和用户组如何使用网络服务器的目录、文件和设备。继承权限屏蔽相当于一个过滤器，可以限制子目录从父目录那里继承哪些权限。我们可以根据访问权限将用户分为以下几类：（1）特殊用户（即系统管理员）；（2）一般用户，系统管理员根据他们的实际需要为他们分配操作权限；（3）审计用户，负责网络的安全控制与资源使用情况的审计。用户对网络资源的访问权限可以用一个访问控制表来描述。


    ## 目录级安全控制


    网络应允许控制用户对目录、文件、设备的访问。用户在目录一级指定的权限对所有文件和子目录有效，用户还可进一步指定对目录下的子目录和文件的权限。对目录和文件的访问权限一般有八种：系统管理员权限（Supervisor）、读权限（Read）、写权限（Write）、创建权限（Create）、删除权限（Erase）、修改权限（Modify）、文件查找权限（File
    Scan）、存取控制权限（Access Control）。用户对文件或目标的有效权限取决于以下因素：用户的受托者指派、用户所在组的受托者指派、继承权限、屏蔽取消的用户权限。一个网络系统管理员应当为用户指定适当的访问权限，这些访问权限控制着用户对服务器的访问。八种访问权限的有效组合可以让用户有效地完成工作，同时又能有效地控制用户对服务器资源的访问，从而加强了网络和服务器的安全性。


    ## 属性安全控制


    当用文件、目录和网络设备时，网络系统管理员应给文件、目录等指定访问属性。属性安全控制可以将给定的属性与网络服务器的文件、目录和网络设备联系起来。属性安全在权限安全的基础上提供更进一步的安全性。网络上的资源都应预先标出一组安全属性。用户对网络资源的访问权限对应一张访问控制表，用以表明用户对网络资源的访问能力。属性设置可以覆盖已经指定的任何受托者指派和有效权限。属性往往能控制以下几个方面的权限：向某个文件写数据、拷贝一个文件、删除目录或文件、查看目录和文件、执行文件、隐含文件、共享、系统属性等。网络的属性可以保护重要的目录和文件，防止用户对目录和文件的误删除、执行修改、显示等。


    ## 网络服务器安全控制


    网络允许在服务器控制台上执行一系列操作。用户使用控制台可以装载和卸载模块，可以安装和删除软件等操作。网络服务器的安全控制包括可以设置口令锁定服务器控制台，以防止非法用户修改、删除重要信息或破坏数据；可以设定服务器登录时间限制、非法访问者检测和关闭的时间间隔。


    ## 防火墙


    防火墙是一种保护计算机网络安全的技术性措施，它是一个用以阻止网络中的黑客访问某个机构网络的屏障，也可称之为控制进入/出两个方向通信的门槛。在网络边界上通过建立起来的相应网络通信监控系统来隔离内部和外部网络，以阻挡外部网络的侵入。

