    ## 1.3 TCP/IP协议


    - TCP/IP (Transmission Control Protocol/Internet Protocol) 是 Internet 运行的基础，是目前应用最广泛的网络通信协议，现在已经成为企业网络的事实标准。许多网络操作系统
    (NOS)，例如 Windows NT 4.0 Server, Windows 2000 Server, UNIX 以及 Novell Netware 5.0
    等，都以TCP/IP作为缺省的网络协议。

    - TCP/IP 是一个可以路由的协议栈，可运行在许多不同的软件平台上。TCP/IP 包含了许多成员协议从而构成了实际的TCP/IP协议栈。TCP/IP 的出现早于OSI
    模型，因此TCP/IP协议栈中的各层不会和 OSI 模型的各层直接对应起来。TCP/IP由五层构成：物理层、数据链路层、网络层、传输层和应用层。TCP/IP中的应用层可以等同于
    OSI的会话层、表示层和应用层的结合。

    - 在传输层中，TCP/IP定义了两个协议：TCP和UDP。在网络层，尽管还有其它协议支持数据传输，TCP/IP定义的主要协议是IP。

    - 在数据链路层和物理层，TCP/IP没有定义任何特定的协议。

