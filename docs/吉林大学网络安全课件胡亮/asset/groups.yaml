    # Netfilter框架


    Netfilter提供了一个抽象、通用化的框架，该框架定义的一个子功能的实现就是包过滤系统。Netfilter为每种网络协议(IPv4、IPv6等)定义了一套钩子函数（IPv4定义了5个钩子函数），这些钩子函数在数据包流过协议栈的几个关键点时被调用。在这几个点中，协议栈把数据包及钩子函数指针作为参数调用netfilter框架。


    内核的任何模块都可以对每种协议的一个或多个钩子进行注册，实现挂接。这样当某个数据包被传递给netfilter框架时，内核能够检测是否有任何模块对该协议和钩子函数进行了注册。若注册了，则调用该模块的注册时提供的回调函数，这样，这些模块就有机会检查(可能还会修改)该数据包、丢弃该数据包及指示netfilter将该数据包传入用户空间的队列。那些排队的包被传递给用户空间并被异步地处理。通过这种方式，一个用户进程能检查数据包，修改数据包，甚至可以重新将该数据包通过离开内核的同一个钩子函数中注入到内核中。


    任何在IP层要被抛弃的IP数据包在真正抛弃之前都要进行检查。例如允许模块检查ip-spoofed包（被路由抛弃）。'
