    ## 用启发式策略检测口令安全


    一个可记忆口令通常是以一或几个易于记忆的词汇为核心，经过替换、变形、重组而形成的。我们把这个核心称为口令核。如以“cooker”为口令核，把字符“o”替换为数字“0”，并尾加2003，变成“c00ker2003”。在破解这样的弱口令时，尽管口令破解软件有快速完成对口令核“cooker”进行各种排列组合变换的计算能力，但由于事先不知道口令核，必须将在一个很大的可能空间中随机尝试，效果很差。相反，若攻击者可以利用社交工程和了解目标对象的职业等级，有利于尽快定位口令核的范围，但在完成对口令核的变换方面计算能力要差一些。


    启发式口令检测方法就是综合了上述两种方法，取长补短。利用启发式策略来指导口令核的检测过程，有针对性的选择口令核字典，缩小搜索空间，再利用计算机的强计算能力完成变形重组工作，提高效率。其指导思想就是以攻击者的思维、角度来考虑安全性，假设攻击者在了解用户的有关信息的情形下，模拟攻击者破解口令的智能导向型模拟检测口令的安全性。


    首先给各种字典进行细化分类，分布式保存。如姓名名字库、体育字典库、电影名字库等。每个库中又进一步分为各种子字典，比如姓名名字库中，又分为英文姓名和中文姓名两个子库。有的子库还会被细分成，如中文姓名子库还可以按照民族、地域、年代、分布规律等细分。


    其次，检测中引入用户口令线索和相应的启发式检测策略。由于口令内的内容通常和用户某些关系，线索往往可以有助缩小口令搜索空间。启发式口令检测策略是利用字典搜索规律来指导对口令核字典的测试字典集，可以加快搜索进程。线索可以是用户的口令核选择习惯，如姓名、籍贯、生日、民族、兴趣、住址、电话、服务等可以被网络和朋友熟知的信息，也可以是目标用户的口令安全习惯，如数字、字母加数字、反加数字等。线索分为显式线索和隐式线索。显式线索可以指导口令检测软件快速破解弱口令，比如已经知道对方的口令核是用户的生日，而他的生日是可以从多种渠道（如身份证、各种证件卡）很容易获得的，这时，计算出弱口令十分容易。而隐式线索不直接提供具体的口令核信息，需要分析推导，才能更进一步获得线索。比如，已知道对方的生日、籍贯，又知道对方喜欢用姓名来作为口令核，这时就需要先猜测对方的姓名。如果毫无边际地搜索所有的名字空间，时间和效率可能很差。启发式检测中使用启发式指导规则对隐式线索进行处理。一方面，根据生日线索可以知道某一年代常见的起名特点，缩小名字核的可能空间；另一方面，根据籍贯线索可以推知该地名字常见的大小写和习惯，利于有个名字上的地方法性差异进一步缩小名字核空间。这样，就可以模拟人类思维指导进行快速、智能地搜索弱口令。


    最后，在检测过程中，利用各种指导规则对测试字典集中内容进行变形、组合、排列等操作，利用各种匹配算法快速可靠地检测用户口令的安全性。


    ## 课程名称：网络安全


    主讲教师：胡亮


    Email:hul@jlu.edu.cn


    ## 第9章入侵检测系统


    通过电子手段对一个组织信息库的恶意攻击称为信息战(information warfare)。攻击的目的可能干扰组织的正常活动，甚至企图对组织的信息库造成严重的破坏。对信息战的各种抵抗措施都可归结为三类：保护、检测、响应。


    保护（入侵的防范）指保护硬件、软件、数据抵御各种攻击的技术。目前各种网络安全设施如防火墙及VPN，各种加密技术，身份认证技术，易攻击性扫描等都属于保护的范围之内，它们是计算系统网络的第二道防线。


    检测（入侵的检测）研究如何高效正确地检测网络攻击。只有入侵防范不足以保护计算机的安全，任何系统及协议都不可避免地存在缺陷，可能以协议本身也可能是协议的实现，还有一些技术之外的社会关系问题，都能威胁或破坏信息安全。因此即使采用这些保护措施，入侵者仍可能利用相应缺陷攻击入侵系统，这意味着入侵检测具有其他安全措施所不能代替的作用。


    响应（入侵的响应）是入侵检测之后的处理工作，主要包括损失评估，根除入侵者留下的后门，数据恢复，收集入侵者留下的证据等。这三种安全措施构成完整的 信息战防御条线。


    入侵检测（Intrusion Detection, ID）是通过监测计算机系统的某些信息，加以分析、检测入侵行为，并做出反应。入侵检测系统所监测的系统信息包括系统记录，网络流量，应用程序日志等。入侵（Intrusion）定义为未经授权的计算机使用者以及不当使用(misuse)计算机的合法用户(内部威胁)，危害或试图危害资源完整性，保密性，可用性的行为。入侵检测系统（Intrusion
    Detection System, IDS）是实现入侵检测功能硬件与软件。入侵检测基于这样一个假设，即：入侵行为与正常行为有显著的不同，因而是可以检测的。入侵检测的研究并于20世纪80年代，进入90年代入侵检测成为研究与应用的热点，其间出现了许多研究原型与商业产品。


    入侵检测系统在功能上是入侵防范系统的补充，而并不是入侵防范系统的替代。相反，它与这些系统共同工作，检测出已经躲过这些系统控制的攻击行为。入侵检测系统是计算机系统安全、网络安全的第二道防线。


    ## 9.1 一个理想的入侵检测系统具有的特性


    一个理想的入侵检测系统具有如下特性：


    - 能以最小的人为干预持续运行。

    - 能够从系统崩溃中恢复和重置。

    - 能抵抗攻击。IDS必须能监视自身和检测自己是否已经被攻击者所改变。

    - 运行时间占用系统的开销最小。

    - 能够根据被监视系统的安全策略进行配置。

    - 能在使用过程中适应系统和用户行为的改变。

    当被监控系统的规模和受攻击的机率增加时，我们认为下列的特征也同样重要：

    - 能够检测具有一定规模的网络。

    - 保证当IDS某一部分被攻破时，对其余部分造成的影响尽可能的小。

    - 允许动态的再配置，即它必须有不用重新启动而能再次配置的功能。

    - 提供很低的误报率。

    - 提供互操作性，在不同环境中运行的IDS组件能够相互作用。

    - 提供方便的用户界面，使管理者方便地配置和监视系统。

    - 能够以实时或接近于实时的方式检测入侵。


    目前的入侵检测系统（包括研究的原型和商业化的IDS）的数目已经超过一百个，它们只具有上述特征的一部分。


    ## 9.2入侵检测系统结构


    CIDF (Common Intrusion Detection Framework) 定义了通用的 IDS系统结构，它将入侵检测系统分为四个功能模块，如图所示。


    ![](img/3a12b03e666342abc42d27db0d69f39c_231_0.png)


    ## 入侵检测系统结构


    - 事件产生器（Event generator, E-box）收集入侵检测事件，并提供给IDS其他部件处理，是IDS的信息源。事件包含的范围很广泛，既可以是网络活动也可以是系统调用序列等系统信息。事件的质量、数量与种类对IDS性能的影响极大。

    - 事件分析器（Analysis engine, A-box）对输入的事件进行分析并检测入侵。许多IDS的研究都集中于如何提高事件分析器的能力，包括提高对已知入侵识别的准确性以及提高发现未知入侵的几率等。

    - 事件数据库（Event database, D-box）E-boxes 和 A-boxes 产生大量的数据，这些数据必须被妥善地存储，以备将来使用。D-box的功能就是存储和管理这些数据，用于IDS的训练和证据保存。

    - 事件响应器（Response unit, C-box）对入侵做出响应，包括向管理员发出警告，切断入侵连接，根除入侵者留下的后门以及数据恢复等。

    - CIDF概括了IDS的功能，并进行了合理的划分。利用这个模型可描述当今现有的各种IDS的系统结构。对IDS的设计及实现提供了有价值的指导。


    ## 9.3入侵检测系统分类


    为了准确地分类，首先要确定用来分类的 IDS特征。IDS是复杂的系统，若只用一种特征分类，结果将是粗糙的。因此本章根据多种特征对IDS进行了不同角度的分类。事件分析器是IDS的核心部分，故首先对检测方法进行分类。其次从事件产生器的角度分类，将采集事件种类或采集事件的方法作为分类标准。


    ## 检测方法分类


    入侵检测的方法可大体分为两类：滥用检测(misuse detection)、异常检测(anomaly detection)。在IDS中，任何一个事件都可能属于以下三种情况：


    - 已知入侵

    - 已知正常状态

    - 无法判定状态


    第三种事件可能是一种未知的入侵，也可能是正常状态，但在现有的系统和技术下无法判定。目前的检测方法都是对已知入侵和已知正常状态的识别，其中滥用检测识别已知入侵，但对于无法判定状态中的未知入侵将漏报(false
    negative)，异常检测根据已知的正常状态将已知入侵、无法判定状态都当作异常，因此会产生误报(false positive)。


    ## 滥用检测


    根据对已知入侵的知识，在输入事件中检测入侵。这种方法不关心正常行为，只研究已知入侵，能较准确地检测已知入侵，但对未知入侵的检测能力有限。目前大多数的商业IDS都使用此类方法。滥用检测所采用的技术包括：


    - 专家系统 使用专家系统技术，用规则表示入侵。通常使用的是 forward-chaining、production-based等专家系统工具。例如DARPA的Emerald项目，将P-BEST工具箱应用于入侵检测。

    - 状态转换模型 将入侵表示为一系列系统状态转换，通过监视系统或网络状态的改变发现入侵。典型系统是NetSTAT。

    - 协议分析与字符串匹配 将已知攻击模式与输入事件进行匹配以判定入侵的发生，这种方法具有速度高、扩展性好的特点，但容易产生误报。典型系统包括shadow、Bro和Snort等。

    '
