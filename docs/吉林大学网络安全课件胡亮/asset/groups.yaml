    情况三：最后一种情况是，如果有一个高度可信而且离你很远的实体，虽然你并不直接认识它，但是你却认为它有足够可信的声誉，那么你就可能会信任它。也就是说，如果该实体证明了一个个体的身份，你就可以准备信任那个个体。在这种情况下，信任锚与你本无关系，但它的良好声誉使你有足够的信心信任那个个体。


    ## 信任模型


    一个PKI内所有的实体即形成一个独立的信任域。PKI内CA与CA、CA与用户实体之间组成的结构组成PKI体系，称为PKI的信任模型。PKI的信任模型是PKI整体架构的抽象，它决定了域内不同实体的组织结构，是建立PKI的首要问题。PKI的信任模型主要解决两方面的问题：


    - 用户的信任起点在何处；

    - 信任在系统中如何被传递。


    根据CA与CA、实体之间的拓扑关系，PKI的基本信任模型有四种：分层结构信任模型、分布式信任模型、基于信任列表的（Web）信任模型和以用户为中心的信任模型。


    ## 分层结构信任模型


    CA的分层结构信任模型是一个树型结构，树根是根CA中心，由上向下各树枝部位有一个CA，叶子节点是用户。分层结构的信任模型的建立方法如下：


    - （1）根CA为它的直接后代节点发放证书；

    - （2）中间节点CA中心为它的直接后代节点CA发放证书；

    - （3）中间节点CA都可以为最终用户发放证书，但为用户发放证书的CA中心不能有下一级CA中心。


    ### 分层结构信任模型示意图


    ![](img/3a12b03e666342abc42d27db0d69f39c_111_0.png)


    图5-3 分层结构的信任模型


    ## 分布式信任模型


    - 与分层结构信任模型不同，在分布式信任模型中，用户有多个分布式根信任中心可以信任，而每个根CA中心又是一个分层结构的信任模型。这种信任模型可以称为森林结构信任模型。


    - 在分布式信任模型中，如果两个通信的用户处于同一个信任域中，则公钥证书的验证与分层结构的信任模型一样；如果两个用户处于不同的信任域中，则需要跨域认证。在分布式信任模型中，认证域之间有两种形式的信任关系：


    - 一是各个CA中心之间两两相互信任，成为网状结构（Mesh）。在N个根CA中心的系统中，每个根CA中心必须保存其余N-1个根CA中心的公钥证书，需建立N2个信任关系；


    - 二是集中发散结构（Hub-and-Spoke）。每个根CA中心与一个中央CA中心之间建立信任关系，当两个CA中心之间需要相互认证时，通过该中央CA中心，每个根CA中心只需要保存中央CA中心的公钥，在有N个根CA中心的需求中，需要建立N个信任关系。这种结构与分层机构信任模型的区别在于用户并不需要拥有中央CA中心的公钥。


    - 无论是上述哪种结构，分布式信任模型的最大特点在于它的灵活性，使得信任域的扩展非常方便。但也正是这种灵活性，使整个系统的可管理性变差；随着CA数量的增加，认证路径的构建（构造）将是件麻烦事，可能会出现多条认证路径和死循环的现象，使证书验证变得困难，从而增加了用户的负担。因此，分布式的信任模型适用于规模不大、数量不多、地位平等的组织群体共同实施PKI。


    ### 分布式信任模型示意图


    根CA中心之间的信任关系


    根CA中心1


    根CA中心2


    根CA中心3


    中间CA中心


    最终用户


    图5-4 分布式信任模型


    ![](img/3a12b03e666342abc42d27db0d69f39c_113_0.png)


    ## 基于信任列表的信任模型


    - 基于信任列表的信任模型又被称作网状信任模型。网状信任模型是从互连网的概念发展来的，主要用在Netscape Navigator（现为SUN ONE）和Microsoft
    IE两个浏览器中。在这种模型中，预先为用户装入许多CA中心的公钥（这些公钥可以修改），且用户在开始时是信任这些公钥的。每一个预装入的公钥都代表一个根CA中心，相当于一个用户处于多个认证域中。


    - 这种信任模型的优点是简单、方便、易于操作使用。但易受到假冒攻击，如果假冒者将一个用于攻击的公钥装入用户的浏览器中，他与该用户的安全通信就可以得到许可，从而方便的取得用户的敏感信息，因为用户对通信对方的验证是由软件系统自动进行的。另外一个缺点是目前还没有实用的方法撤销已经预装在浏览器中的公钥。同时，如果采用这种信任模型，让用户来管理如此多的公钥增加了用户的负担，对用户的技术水平提出了更高的要求，操作不当就会给攻击者造成可乘之机。


    ### 基于信任列表的信任模型示意图


    ![](img/3a12b03e666342abc42d27db0d69f39c_115_0.png)


    图5-5 基于信任列表的信任模型


    ## 以用户为中心的信任模型


    - 在以用户为中心的信任模型中，没有专门的CA中心，用户完全决定与其他用户之间的关系，用户通过亲属、朋友等关系网来建立信任关系网。每个用户向他的亲属和朋友签发公钥证书，通过这样的方式建立一个信任网。


    - 在这种模型中，当用户A要与用户B通信时，他收到B的公钥证书，他不知道该证书，但他看到该证书是由A的朋友签发的，而他的朋友的证书是由他自己签发的，这样他先验证他的朋友的证书，然后验证B的证书。


    - 著名的安全软件PGP（Pretty Good Privacy）就使用这种信任模型。由于该模型的可操作性强，并且对用户行为和决策的充分依赖，这种模型在高技术性和高利害关系的群体中可能是可行的。但是对一般群体（它的许多用户有极少或者没有安全方面的知识或PKI的概念）是不现实的。而且，这种模型一般在公司、金融或政府环境下是不适合的，因为在这些环境下通常希望或需要对用户的信任实行某种控制。

