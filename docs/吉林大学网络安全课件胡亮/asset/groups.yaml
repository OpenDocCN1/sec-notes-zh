    ## 双证书机制中证书及配置文件的申请

    - 双证书用户到证书注册机构（RA）提出关于双证书的使用申请；

    - RA审核用户身份的合法性；

    - RA审核通过后，为用户提供签名证书的RefNum/AuthCode；

    - 在RA处，通过证书申请终端，用户输入RefNum/AuthCode及用于保护用户私钥的口令；

    - RA为用户生成签名证书的申请书；

    - RA以安全方式将用户私有信息保存在本地数据库中；

    - RA向证书签发服务器（Authority）发出签名验证申请，并以安全方式将用户信息传给 Authority；

    - Authority验证RefNum/AuthCode及用户签名证书的申请书；

    - 验证通过；

    - 向密钥管理中心（KMC）发送密钥申请请求，同时将用户口令以安全方式传递给KMC；

    - KMC为用户生成加密密钥对，将该密钥对传送至Authority；

    - Authority签发加密证书；

    - Authority签发用户签名证书；

    - Authority保存用户数据；

    - Authority在其证书发布服务器上面发布用户签名证书及加密证书；

    - 通知RA。


    ## 双证书机制中证书及配置文件下载


    双证书用户只能通过专用的客户端软件下载签名证书、加密证书及加密私钥。具体的流程如下：


    - 用户在双证书客户端软件中输入签名证书的用户识别码（RefNum）和授权码（AuthCode）；

    - 客户端软件以安全方式将RefNum/AuthCode传给Authority；

    - Authority验证用户身份通过；

    - Authority向KMC请求相应加密证书的私钥；

    - Authority检索用户签名证书及对应的加密证书；

    - Authority检索用户加密证书的RefNum/AuthCode；

    - 将用户信息安全传给客户端软件；

    - 客户端软件根据用户要求，制作证书文件；


    ## 5.4 无线PKI（WPKI）


    与有线通信相比，无线通信在通信设备的尺寸和使用者的位置上提供更大的便利性。目前为止，无线设备给人们提供的服务还是主要是语音服务。无线应用协议（WAP, Wireless
    Application Protocol）使移动设备可以连入Internet。WAP标准定义了个人无线设备的应用程序框架结构和网络协议，其目的就是给无线设备提供更多的数据服务，如Internet浏览和事务处理等。WAP定义了Internet与无线设备数据传输的标准，因而电子商务也可以使用无线设备作为传输媒介。移动电子商务（Mobile
    Commerce,或M-Commerce）就是使用无线设备的电子商务。WAP协议通过定义无线设备的Internet数据传输标准确保移动商务的安全。移动商务和电子商务都有特殊的安全需求，密码技术和PKI服务可以最大限度地满足这种需求。WPKI（Wireless
    Application Protocol PKI）是有线PKI的一种扩展，是适合无线环境下应用的PKI系统。


    ## 无线PKI与传统PKI的比较


    在WPKI中，代替RA的功能组件是PKI门户（PKI Portal），它是一个网络服务器，与WAP网关类似，其逻辑功能与RA一样，负责把WAP客户的需求转发给PKI中的RA和CA。WML是优化的HTML，WTLS是优化的TLS，WPKI也是对IETF
    PKIX标准的优化，使之更适合无线环境。WPKI与PKI的主要区别体现在WPKI对PKI的优化方面。WPKI对PKI的优化主要有三个方面：编码规则、证书格式、密码算法和密钥，下面分别讨论。


