    # 信息安全的研究内容


    就理论研究而言，一些关键的基础理论需要保密，因为从基础理论研究到实际应用的距离很短。现代信息系统中的信息安全其核心问题是密码理论及其应用，其基础是可信信息系统的构建与评估。总的来说，目前在信息安全领域人们所关注的焦点主要有以下几方面：


    +   1） 密码理论与技术；

    +   2） 安全协议理论与技术；

    +   3） 安全体系结构理论与技术；

    +   4） 信息对抗理论与技术；

    +   5） 网络安全与安全产品。'
