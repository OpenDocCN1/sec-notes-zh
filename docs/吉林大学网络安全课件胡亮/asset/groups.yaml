    ## 5.2 PKI的信任模型和交叉认证


    在实际应用系统中使用公钥基础设施（PKI）作为解决安全问题的基礎，为用户提供证书服务的CA中心必然会有多个，每个CA中心称为一个认证域，用户会在适当的CA中心注册，申请公钥证书；在使用证书时，如果两个通信的主体处于同一个认证域，则信任问题可以容易的解决；如果两个通信主体不在同一个认证域，则必须通过跨域认证来解决相互之间的认证问题。


    目前，在实际应用系统中，总是认为用户与其注册的CA之间、有信任关系的CA中心之间是完全信任的。但在现实世界中并没有完全可信的实体，因此有必要在用户与CA中心之间、CA中心之间建立起信任模型，通过对信任模型的分析和比较，指导现实世界中的PKI系统的正常运作，使PKI的使用更加有效。同时，如何将信任域的范围扩大，使用户所持的数字证书可以应用到更广泛的领域，这些问题都是通过PKI的互操作技术来实现。


    ## 信任域


    一个信任域对于一个组织实际上可以定义为：公共控制下或从属于一己公共策略的系统集。（策略可以明确的声明者也可以通过操作过程的实现隐含地指出。）你参与什么样的工作，会影响你对其他人的信任。例如在一个公司中，很可能你对公司内部人员比对公司外部人员会有更高的信任水平。在一个群体中，既有的人事关系和运作模式使你给予它较高的信任水平。如果群体中所有个体都遵守同样的规则，则称群体在单一信任域中运作。


    识别与界定信任域及其边界对构建PKI非常重要。使用另一信任域中CA签发的证书通常比使用与你同信任域的CA签发的证书复杂得多。


    在一个企业中，信任域可以被按照组织或地理界限来划分。同时，一个组织中完全可能存在多个信任域，其中的信任域会发生重叠。当各个信任域开始声明特定的策略和操作过程，特别是当组织的不同部分发生交互时，信任域变得复杂而有趣。多数情况下，确立了公共协作要求的一组高级策略往往可以把不同信任域联合起来，形成一个整体来运作。对于建成包括认证机构在内的IT基础设施而言，能否建立一个可确定本地信任模型的广泛策略的拱形信任域（overarching
