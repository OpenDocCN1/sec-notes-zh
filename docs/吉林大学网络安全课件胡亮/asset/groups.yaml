    # 获取口令


    +   - 口令攻击程序有很多，用于攻击UNIX平台的有Crack、CrackerJack、PaceCrack95、Qcrack、John the Ripper、Hades等等；用于攻击Windows
    平台的有10phtCrack2.0、ScanNT、NTCrack、Passwd NT等等。

    +   - 通常防御在线口令攻击的办法是通过配置操作系统来限制允许每个用户登录失败的次数，当到达次数限制时，该帐户将被锁定，直到系统管理员解开封锁。但这种方法却正中实施拒绝服务（denial
    of service）攻击者下怀。这类入侵者会反复猜测系统中的用户帐户，使它们都超过失败登录范围，最终锁住所有帐户。

    +   - 口令攻击之所以能成功，主要是因为用户使用了规律性较强的口令，为防御口令攻击，用户应设计包括大写、小写、数字和特殊字符的8字节以上的长口令，增大入侵者猜测的难度，并且要定期更换口令。另一方面，要保证口令文件的存储安全。'
  - '[PAGE 207]


    # 放置特洛伊木马程序


    +   特洛伊木马源自于希腊神话，在网络安全领域专指一种黑客程序，它可以直接侵入用户的电脑并进行破坏。它一般包括两个部分，控制端软件和被控端软件。被控端软件常被伪装成工具程序或者游戏等，诱使用户打开带有该软件的邮件附件或从网上直接下载。一旦用户打开了这些邮件的附件或者执行了这些程序之后，它们就会在目标计算机系统中隐藏一个可以在系统启动时悄悄执行的程序。当用户连接到因特网上时，这个程序可以通知攻击者，报告用户的IP地址以及预先设定的端口。攻击者在收到这些信息后，再利用事先潜伏在其中的程序，任意地修改用户的计算机的参数设定、复制文件、窥视用户整个硬盘中的内容等，从而达到控制用户的计算机的目的。


    +   不要轻易打开陌生的邮件、对下载软件认真核对文件的MD5值是应对此类攻击的稳妥办法。'
  - '[PAGE 208]


    # WWW的欺骗技术


    +   - 用户通常利用IE等浏览器访问各种各样的WEB站点，如阅读新闻组、咨询产品价格、订阅报纸、电子商务等。然而一般的用户恐怕不会怀疑：当前正在访问的网页已经被别人恶意篡改过，该网站是否是一个真实的合法网站！通常，攻击者会将用户要浏览的网页的URL改写为指向自己的服务器，或者申请一个与合法商务站点极为相似的域名。当用户浏览目标网页、输入个人账号和密码、执行购物操作时，实际上是在与伪站点进行交易。攻击者利用这类Web欺骗轻松获取了用户的保密信息。

    +   - 仔细分辨似是而非的页面信息、认真查看网站的电子证书是防范这类攻击时必须要注意的。'
  - '[PAGE 209]


    # 电子邮件攻击


    +   电子邮件攻击主要表现为两种方式：一是电子邮件轰炸，或称邮件炸弹，是指用伪造的IP地址和电子邮件地址向同一信箱发送数以千计、万计的垃圾邮件，致使受害人邮箱空间快速饱和，甚至还可能会给电子邮件服务器的正常运行带来影响，甚至使其宕机；二是电子邮件欺骗，攻击者许称自己为系统管理员（邮件地址和系统管理员完全相同），给用户发送邮件要求用户修改口令（口令可能为指定字符串）或在貌似正常的附件中加载病毒或其它木马程序（如伪装成系统补丁等）。


    +   邮箱安全一方面要求用户不轻易信任陌生邮件内容，另一方面需要邮件服务提供者加强邮件服务的管理，避免垃圾邮件。'
  - '[PAGE 210]


    # 通过一个节点来攻击其他节点


    攻击者在突破一台主机后，往往会以此主机做为根据地，攻击其它主机。以此隐蔽其入侵路径，避免留下蛛丝马迹。他们可以利用网络监听方法，尝试攻破同一网络内的其它主机；也可以通过IP欺骗和主机信任关系，攻击其它主机。这类攻击很狡猾，但由于某些技术很难掌握和成功实施，因此较少被攻击者使用。'
  - '[PAGE 211]


    # 网络监听


    网络监听就是捕获网络上的报文，对其内容、特征进行分析，非法获取重要信息的一种手段。能够实施监听的程序或设备被称为嗅探器（sniffer），它既是管理员监视网络的状态、数据流动情况及网上传输信息的管理工具，也是入侵者发动攻击的有力武器。


    网络监听是网卡的一种工作模式，在这种模式下，主机会接收到本网段在同一条物理通道上传输的所有信息，而不管这些信息是否发送给它和接收方是它。此时，如果两台主机进行通信没有加密，只要使用某些网络监听工具，例如NetXray
    for windows 95/98/nt, sniffit for linux、solaris等就可以轻而易举地截取包括口令和帐号在内的信息。虽然网络监听者获得的用户名和口令具有一定的局限性，但监听者往往能够获得其所在网段的所有用户帐号及口令。


    监听可以在多种媒质、多种协议上进行。监听的位置不同，效果也不一样。最普遍的做法是在以太网中进行监听。在正常情况下，网络接口对接收到的数据帧进行检查，如果数据帧中的目的物理地址是自己的物理地址，或是广播地址，则将数据帧送交上层协议软件处理，否则将抛弃该帧。但如果入侵者将一个计算机的网络接口设为杂收模式，则所有的数据帧将被送交上层协议软件。此时该计算机就是一个嗅探器。在一般的UNIX系统中，设置网络接口为杂收（promiscuous）模式的I/O控制命令需要超级用户权限，这一限制在很多用户通过网络登录的系统上，但在Windows
    Me、Linux等某些个人操作系统或免费操作系统上，入侵者可以毫无限制地进行网络监听。


