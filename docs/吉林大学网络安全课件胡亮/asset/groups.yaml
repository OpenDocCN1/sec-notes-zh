    ## 5.3 双证书和SSL/TLS安全


    在PKI技术规范发展的过程中目前形成两种证书机制：单证书机制和双证书机制。近年来，在欧洲等国家又掀起多证书协议的研究，但相对还不够成熟，也存在着管理手段的不完善。单证书是目前广泛存在和应用的证书机制。这里重点讨论双证书机制的实现以及应用它对TLS协议进行安全性改进的相关工作。


    ### 双证书


    - 随着Internet的不断发展和电子商务、电子政务的应用越来越广泛，对于信息在网络上面传输的安全性要求越来越高。网络上的身份识别、信息的数字签名和信息加密变得越来越重要。原来普遍通用的基于单密钥对、单电子证书的安全体系已经无法满足越来越高的安全需求。支持双证书、双密钥对（甚至多证书、多密钥对）功能已经变成PKI体系的一项基本要求。双证书就是为每个用户发放两对密钥，每对密钥对应着一张证明其真实性的数字证书。通常，两对密钥中的一对用于加密操作，另一对密钥用于签名操作。随着PKI在规模和功能上面的逐步扩展，一个PKI实体拥有两个（或多个）密钥对的情况将会成为一种非常典型且非常普遍的情况。

    - 目前，随着应用环境的变化以及安全层次的提高，PKI已得到进一步的发展，其中一种是从旧版的单证书机制演变到双证书机制，就是用户可以拥有签名证书和加密证书两张证书，这样可以解决原来由于证书更新而引起的PKI操作环境不稳定和不安全的问题。


    ### 双证书机制的优点


    一个实体拥有两个（多个）密钥对在许多情况是完全合理的。反之，用一个密钥对来满足PKI实体在任何时间、任何情况和任何角色的所有需求的方法在实际应用中也越来越多地遇到更大的困难。采用双证书（双密钥对）机制与采用单证书（单密钥对）机制相比，具有如下一些主要的优点：


    #### 支持密钥备份和抗抵赖的需求


    在单证书系统中，用户采用一对密钥进行数字签名和信息加密。为了保证签名密钥的不可否认性，不能将这一对密钥备份在第三方。这样，用户由于害怕因为密钥的丢失（如忘记保护密钥的口令等）而导致无法解密重要信息的情况发生，常常不对重要信息进行加密处理。在单证书系统中是无法同时满足上述要求的。


    在双证书系统中，用户的签名密钥和加密密钥是分开的。签名密钥由用户自己保存，对第三方是保密的。加密密钥可以放在第三方保管，当用户的加密密钥丢失时，如忘记密钥保护口令，用户可以从第三方将密钥恢复。这样用户就不担心由于加密密钥的丢失，而导致加密信息的丢失。


    #### 对于加密和数字签名采用不同算法的需求


    在单证书系统中，用户采用一对密钥进行数字签名和加密操作，签名操作和加密操作也采用同样的算法和密钥强度。这样就无法满足用户关于签名密钥对和加密密钥对采用不同算法和密钥强度的需求。而在双证书系统中，签名密钥对和加密密钥对是分开的。对两对密钥中的任一对密钥，用户都可以任意指定算法和密钥强度，更为灵活。


    #### 更新加密密钥对，管理解密密钥历史和更新签名密钥对，销毁签名密钥的需求


    对于签名密钥对，密钥过期后，应该更新签名密钥对，同时必须将原来的签名密钥销毁，以防止第三方冒签。对加密密钥对，在密钥过期后，应该更新加密密钥对，同时将原来的解密密钥归档。通过对密钥历史的管理，可以防止由于用户历史解密密钥的丢失，而无法解密历史信息的情况发生。


    在单证书系统中，解密密钥和签名密钥是相同的。如果将签名密钥销毁，因为没有签名密钥历史记录，就无法解密以前使用该密钥加密的信息。如将该密钥备份存储，又不符合销毁签名密钥的要求。因此，对于单证书（单密钥对）机制无法满足既备份解密密钥又销毁签名密钥的需求。


    如果采用双证书，解密密钥和签名密钥是不同的。可以充分满足在密钥到期时，更新加密密钥对，管理解密密钥历史和更新签名密钥对，销毁签名密钥的需求。


    ### 双证书机制的实现


    双证书机制中最重要的部分是双证书的格式与双证书的管理机制，是我们研究的重点。双证书均采用ITU-T X.509标准中规定的证书格式。与其它证书不同的是密钥用法扩展域。签名证书的密钥用法扩展域标识为该证书所对应的密钥只可以用作数字签名和验签操作；而加密证书密钥用法扩展域标识为该证书所对应的密钥只可以用作对信息的加密和解密操作。而对双证书的管理也有两种方式：


    1. 将两张证书封装到一个证书文件中，该文件中还保存与两张证书相关的证书控制信息，如拥有证书的用户的信息、证书存储库的地址等。这些信息可以使用户很方便地获取证书，维护证书的有效性。但是在实际应用中，证书文件格式并不都一致，因此需要专门的客户端证书管理软件对双证书进行管理。目前多数安全应用的双证书都采用这种方式，这也是本节要讨论的重点。

    2. 使用分别独立的两张证书，通过应用程序将这两张证书进行关联。在应用时由应用或用户自身判断使用哪张证书。这种做法虽然可以不需要专门的证书管理软件，但对于两张证书的管理具有一定的复杂度，需要用户过多地参与证书管理工作。


    具体地讲，在X.509中，签名证书和加密证书的区别主要体现在扩展域KeyUsage，签名证书的KeyUsage={Digital Signature}，加密证书的KeyUsage={Key
    Encipherment}，所以实际应用中，用签名证书识别身份，加密证书加密数据或交换密钥。


    ### 双证书的格式


    ```ini

    [MAIN]

    Version=版本号

    !Password=用户口令（加密存放）

    [PERSONAL]

    Alias=用户别名

    !AuthCode=用户授权码

    !SignCertificate=签名证书

    !SignPrivateKey=签名私钥（机密存放）

    !CryptCertificate=加密证书

    CryptPrivateKey=加密私钥（加密存放）

    CRLDP=0

    ```


    | 字段名称 | 注释 |

    |---|---|

    | [MAIN] | 文件证书信息的入口 |

    | Version=版本号 | 使用的ITU-T X.509的版本信息 |

    | !Password=用户口令（加密存放） | 用于保护该文件的用户口令 |

    | [PERSONAL] | 文件中关于用户个人信息的入口 |

    | Alias=用户别名 | 用户的别名（全局唯一） |

    | !AuthCode=用户授权码 | 用户用于管理证书（下载、注销）的号码 |

    | !SignCertificate=签名证书 | 签名证书 |

    | !SignPrivateKey=签名私钥（机密存放） | 用户用于数字签名的私钥 |

    | !CryptCertificate=加密证书 | 用户用于信息加密的证书 |

    | CryptPrivateKey=加密私钥（加密存放） | 用户用于解密数据的私钥 |

    | CRLDP=0 | 证书注销的分布点位置 |

