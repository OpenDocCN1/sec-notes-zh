    # 4.4分组加密算法的高效实现技术


    +   - 加密算法的两个重要指标是加密强度和速度。加密强度是算法的基本性质，是算法抵抗各种攻击的能力。在大多数应用中，在保证一定加密强度的前提下，加密/解密的速度是最重要的性质，尤其是对于要求较高速度的应用。


    +   - 加密强度在算法的设计阶段已经确定，算法的不同实现一般不会对加密强度产生影响。而同一加密算法的加/解密速度在不同的实现中则可能有很大不同。加密速度在根本上由算法本身的设计决定，但在实现中可以使用各种优化技术最大限度地发挥算法速度的潜力。本节研究在算法确定情况下提高算法速度的实现方法，不涉及新算法设计问题。'
  - '[PAGE 87]


    # 加密算法及其实现环境的特性


    # 加密算法的一般计算特征


    对称密钥加密算法包括两个部分：密钥扩展和加解密。密钥扩展是将初始密钥扩展为加密函数使用的子密钥。在一般的应用程序中基本操作是加密循环，加密循环中的操作都是整数运算，包括加减乘除、移位、异或、查表等，很多加密算法还使用S-box和P-box等内部表。有些算法执行时间与明文、密钥长度相关，有些算法与之无关。


    # 当代CPU的特征


    在以Intel Pentium为代表的当代CPU中采用了许多巨型计算机的先进技术，包括指令流水线、超长整数等。在算法的软件实现中应该充分利用这些特性提高速度。对于Pentium系列CPU，它拥有两条整数运算流水线，能在同一时钟周期内同时执行两条整数运算指令，如果程序设计得当，使得相邻的指令不相关，就能提高速度。编译器会作一些优化工作，但很有限。如果在程序设计时，针对加密算法和CPU的特征进行一些手工优化，则会产生更好的效果。


    # 语言的选择


    与其他高级语言相比，C语言编译生成的可执行码常常具有较高的执行效率，而且在可移植性方面具有极大的优势，在几乎所有的平台上都有ANSI C编译器，并且技术成熟，相互间的兼容性也很好。对于不同的机器很少的某些程序段分别编写，大部分程序不必重写即可实现跨平台使用。著名的SSLeay就是用C语言编写的。汇编语言具有适合编写高速程序的特点，但对不同的机器需重新编写程序。JAVA语言的跨平台能力使得它非常适合某些应用场合。尤其是在瘦客户机系统的安全通信中，JAVA加密包是一个有效的解决方案。'
  - "[PAGE 88]\n\n# 提高算法速度的原则\n\n通过对加密算法的特点以及机器的特性的分析和实验归纳，可总结出以下提高算法速度的实现原则：\n\n\
    +   1. **展开加密循环和函数**\n+   \n+   加密算法的大部分运行时间是执行加密循环。展开加密循环实际上是将加密循环变为多个循环体中的程序模块，同时将加密循环中调用的函数展开。这样减少了很多条件转移指令和计算指令，并且将许多变量变为常量。而且由于\
    \ Pentium CPU 采用了指令流水线、超标量等技术，循环和变量替换会造成指令流水线的阻断和指令预取的作用，展开加密循环能减少流水线的阻断和指令预取的产生，而且变量变为常量使得相应的指令变为速度更快的指令，大大提高速度。这种方法的缺点是增大了程序的长度。\n\
    \n+   2. **在内部循环中避免使用条件跳转指令**\n+   \n+   在 Pentium 中，条件跳转会对加密循环的成功率对程序的执行效率有重要的影响。条件跳转指令会产生不可预见的指令流，容易分枝预测的失败，从而浪费大量指令周期。在\
    \ C 语言中 for 和 if/then/else 等语句都会产生条件跳转指令。在加密算法内部循环中应该避免使用条件跳转指令。\n\n+   3. **变址长度与\
    \ CPU 内部寄存器长度相同**\n+   \n+   对于 Pentium 等 32 位 CPU，程序中的数组和变量，如整钥和中间结果等，无论在算法描述中是\
    \ 16 位或 8 位，在实现中都应定义为 32 位。因为数据类型与 CPU 内部长度不同，将使得变量的存取都需要附加其他的指令，增加了程序长度和指令周期。根据实际测算，在\
