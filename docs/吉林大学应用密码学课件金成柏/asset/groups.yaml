  - '[PAGE 203]


    # 3DES密码——双重DES


    +   - 假设明文P、密钥K1和K2、密文C

    +     - 加密算法

    +       - C = Ek2 [Ek1 [P]]

    +     - 解密算法

    +       - P = Dk1 [Dk2 [C]]


    ![](img/0935d481fd26d10140d7cd560b6540ba_203_0.png)'
  - '[PAGE 204]


    # 双重DES——密码分析


    +   - 是否存在K3，使得

    +     - Eₖ₂[Eₖ₁[P]] = Eₖ₃[P]

    +   - 考察

    +     - 64位分组之间的1-1映射有

    +       - (2ⁿ)! > 10¹⁰²⁰

    +     - DES每个密钥定义的1-1映射总数有

    +       - 2⁵⁶ > 10¹⁷

    +     - 单重DES对应的映射与双重DES对应的映射重叠的可能性很小

    +       - 直到1992年该假设才被证明'
  - '[PAGE 205]


    # 双重DES——中间相遇攻击


    +   假设

    +   > C = E_K2[E_K1[P]]

    +   > 因此，X = E_K1[P] = D_K2[C]


    +   给定明密文对（P,C），攻击如下展开

    +   > 将P按密钥K1所有可能的2^56个值加密，得到的结果按x的值排序放在表T中

    +   > 将C用密钥K2所有可能的2^56个值解密，每解密一次，就将解密结果与T表比较，如果有相等的，则用这两个值对应密钥对P加密，若结果为C，则认定这两个密钥是正确的密钥


    +   考察

    +   > 明文P对应的密文空间为2^64

    +   > 双密钥对应的密钥空间为2^112

    +   > 能够产生密文C的密钥个数平均为2^112/2^64 = 2^48

    +   > 因此

    +     - 对第一个（P,C），将产生2^48个错误结果

    +     - 对第二个（P,C），将产生2^48/2^64 = 2^-16

    +   > 结论

    +     - 使用2组已知明密文对，猜出正确密钥的概率为1-2^-16'
