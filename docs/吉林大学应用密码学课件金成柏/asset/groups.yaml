  - "[PAGE 457]\n\n# Kerberos 4——版本4的认证会话\n\n| (a) Authentication Service Exchange:\
    \ to obtain ticket-granting ticket |\n|---| \n| (1) C → AS: IDc || IDtgs || TS1\
    \ |\n| (2) AS → C: EKc[Kc,tgs || IDtgs || TS2 || Lifetime2 || Ticket_tgs] |\n\
    | Ticket_tgs = EKtgs[Kc,tgs || IDC || ADC || IDtgs || TS2 || Lifetime2] |\n| (b)\
    \ Ticket-Granting Service Exchange: to obtain service-granting ticket |\n|---|\
    \ \n| (3) C → TGS: IDv || Ticket_tgs || Authenticatorc |\n| (4) TGS → C: EKc,tgs[Kc,v\
    \ || IDv || TS4 || Ticketv] |\n| Ticketv = EKv[Kc,v || IDC || ADC || IDv || TS4\
    \ || Lifetime4] |\n| Authenticatorc = EKc,tgs[IDC || ADC || TS3] |\n| (c) Client/Server\
    \ Authentication Exchange: to obtain service |\n|---| \n| (5) C → V: Ticketv ||\
    \ Authenticatorc |\n| (6) V → C: EKc,v[TS5 +1] (for mutual authentication) |\n\
    | Authenticatorc = EKc,v[IDC || ADC || TS5] |"
