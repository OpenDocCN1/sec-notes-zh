    \ GCD (a , b) = 1\n\n## Euclid算法——求最大公因子\n\n- 定理\n  - GCD(a,b) = GCD(b, a mod\
    \ b)\n- Euclid算法\n\n```\nA=a, B=b\nwhile B>0\n{\nR = A mod B\nA = B, B = R\n}\n\
