    # 椭圆曲线算术——实数域上的椭圆曲线


    +   选择椭圆曲线方程

    +   > y²=x³+ax+b

    +   其中a和b是实数，且满足4a³+27b² ≠ 0


    +   椭圆曲线上点E(a,b)定义Abel群


    +   加法运算定义


    +   1. O是加法单位元，若P∈E(a,b)，则P+O=P

    +   2. 若P=(x,y)，则逆元-P=(x,-y)

    +   3. 若P≠Q，过P和Q作一条直线交椭圆曲线于第三点S，则定义P+Q+S=O，即P+Q=-S

    +   4. 若P=Q，过P点画一条切线交椭圆曲线于第三点S，则定义P+Q=2P=2Q=-S'
