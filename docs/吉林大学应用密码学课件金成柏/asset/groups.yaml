- raw:
  - "[PAGE 264]\n\n# 素数——因子分解\n\n+   任意的整数a>1，都可以唯一地因子分解为\n+   \n+   a = p₁^{a₁} p₂^{a₂}\
    \ … pₜ^{aₜ}\n+   \n+   其中，p₁,p₂,…,pₜ均是素数，p₁<p₂<…<pₜ，且每一ai,有 ai>0\n\n+   另一种有用的表示方法\n\
    +   \n+   a = ∏_{p∈P} p^{a_p}\n+   \n+   其中，P是所有素数的集合，a_p>=0\n\n+   例子\n+   \n\
    +   ▸ 91=7×13 ； 3600=2^4 × 3^2 × 5^2"
  - '[PAGE 265]


    <!-- no content -->'
  - '[PAGE 266]


    # Fermat定理


    +   - **Fermat定理**

    +     a^{p-1} mod p = 1

    +     其中，p是素数，且gcd(a,p)=1


    +   - **证明**

    +     > 依据

    +       - 如果 (ab)≡(ac) mod n，那么 b≡c mod n，仅当 a 与 n 互素

    +     > 过程

    +       用a乘以Z_p中所有元素，并模p。那么结果将包含Z_p中的所有元素。所以

    +       a × 2a × ⋯ × ((p − 1)a) ≡ [1 × 2 × ⋯ × (p − 1)] mod p

    +       所以      (p − 1)! a^{p-1} ≡ (p − 1)! mod p

    +       因为(p − 1)! 与 p 互素，所以我们可以消去(p − 1)! 项'
  - '[PAGE 267]


    # Euler函数


    +   - Euler函数φ(n) 定义

    +     - 小于n且与n互素的正整数的个数

    +   - 例如

    +     - φ(10)=4，因为小于10且与它互素的数是 {1,3,7,9}

    +   - 性质

    +     - 如果p是素数，那么φ(p)= p-1

    +       - 例如： φ(37)=36 （37是素数）

    +     - 如果p和q都数素数，那么φ(pq)=φ(p)φ(q)

    +       - 例如： φ(21) = (3-1)×(7-1) = 2×6 = 12'
  - "[PAGE 268]\n\n# Euler定理\n\n+   - **Euler定理**\n+     a^φ(n) = 1 mod n\n+     其中\
    \ gcd(a, n)=1\n+   - **例子**\n+     a=3; n=10; φ(10)=4;\n+     因此 3^4 = 81 = 1\
    \ mod 10\n+   \n+     a=2; n=11; φ(11)=10;\n+     因此 2^10 = 1024 = 1 mod 1"
  - '[PAGE 269]


    # Euler定理


    +   - 证明

    +     - 考虑

    +       - 集合 R = { x₁, x₂, …, x_φ(n) }, R 中的每个元素都是小于 n 且与 n 互素的正整数

    +       - 集合 S = { (a x₁ mod n), (a x₂ mod n), …, (a x_φ(n) mod n) }, 因为 a 与 n
    互素, 所以集合 S 中的所有元素都与 n 互素

    +     - 所以 R = S

    +     - 因此

    +       - ∏_{i=1}^{φ(n)} (a x_i mod n) = ∏_{i=1}^{φ(n)} x_i

    +       - ∏_{i=1}^{φ(n)} a x_i = ∏_{i=1}^{φ(n)} x_i (mod n)

    +       - a^{φ(n)} × [∏_{i=1}^{φ(n)} x_i] = ∏_{i=1}^{φ(n)} x_i (mod n)

    +       - a^{φ(n)} ≡ 1 (mod n)'
  - '[PAGE 270]


    # Euler定理


    +   - 推论

    +     a^φ(n)+1 ≡ a mod n

    +     其中，n=pq，p和q是素数，a<n（这里并不要求a和n互素）

    +   - 证明（略）'
  - '[PAGE 271]


    # 素性测试


    +   - 选择大素数

    +     - 密码算法中，经常需要选择非常大的素数


    +   - 如何判断大数n是否是素数

    +     - 传统的检验方法

    +       - 用所有小于n的平方根的数，试除n

    +       - 这种方法只对比较小的数有效

    +     - 素性测试方法

    +       - 基于素数的性质

    +       - 但也有一些满足该性质的数，并不是素数（这样的数称之为伪素数）

    +       - 经过多轮测试，几乎可以肯定产生的数是素数

    +       - 对大数的素性测试非常有效'
  - '[PAGE 272]


    # 素性测试——素数性质


    +   性质


    +   若n是素数


    构造 n-1 = 2^k q, 其中，k>0，q为奇数


    计算幂序列模n的余数


    a^q, a^{2q}, a^{4q}, ..., a^{2^{k-1}q}, a^{2^k q}


