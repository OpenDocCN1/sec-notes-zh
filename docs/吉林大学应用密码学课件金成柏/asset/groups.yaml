    +     - 1949 Claude Shannon 提出了这个概念

    +     - 代换置换乘积密码

    +     - 奠定了现代分组密码学的基础

    +       - Feistel密码机构就是基于这种形式

    +   - 基于两个原语操作

    +     - *substitution* (S-box)

    +     - *permutation* (P-box)

    +   - 支持混淆（diffusion）与扩散（Confusion）'
