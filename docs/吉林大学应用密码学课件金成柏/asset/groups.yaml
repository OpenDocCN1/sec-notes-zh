  - '[PAGE 461]


    # Kerberos 5——认证会话


    Realm: 用户所属的域


    Options: 票据中指定的标识位


    Times: 客户请求在票据中设置的时间


    Nonce: 临时交互号


    Subkey: 客户端选择子密钥保护会话密钥


    Seq#: (可选)服务器向客户端发送消息的序号


    # Table 14.3 Summary of Kerberos Version 5 Message Exchanges


    | (a) Authentication Service Exchange: to obtain ticket-granting ticket |

    |(1) C → AS: Options || ID_C || Realm_c || ID_tgs || Times || Nonce_1|

    |(2) AS → C: Realm_c || ID_C || Ticket_tgs || E_Kc [K_c,tgs || Times || Nonce_1
    || Realm_tgs || ID_tgs]|

    | Ticket_tgs = E_Ktgs [Flags || K_c,tgs || Realm_c || ID_C || AD_C || Times] |

    |(b) Ticket-Granting Service Exchange: to obtain service-granting ticket |

    |(3) C → TGS: Options || ID_v || Times || Nonce_2 || Ticket_tgs || Authenticator_C
    |

    |(4) TGS → C: Realm_c || ID_C || Ticket_v || E_Kc,tgs [K_c,v || Times || Nonce_2
    || Realm_v || ID_V] |

    | Ticket_tgs = E_Ktgs [Flags || K_c,tgs || Realm_c || ID_C || AD_C || Times] |

    | Ticket_v = E_Kv [Flags || K_c,v || Realm_c || ID_C || AD_C || Times] |

    | Authenticator_C = E_Kc,tgs [ID_C || Realm_c || TS1] |

    |(c) Client/Server Authentication Exchange: to obtain service |

    |(5) C → V: Options || Ticket_v || Authenticator_C |

    |(6) V → C: E_Kc,v [ TS2 || Subkey || Seq# ] |

    | Ticket_v = E_Kv [Flags || K_c,v || Realm_c || ID_C || AD_C || Times] |

    | Authenticator_C = E_Kc,v [ID_C || Realm_c || TS2 || Subkey || Seq#] |'
  - '[PAGE 462]


    # X.509认证服务


    +   - CCITT X.500目录服务标准的一部分

    +     - 一组分布式服务器：维护某些用户信息的数据库

    +     - 定义了认证服务框架

    +       - 目录可以存储公钥证书

    +         - 包含用户的公钥

    +         - 并由证书权威签名

    +     - 定义了认证协议

    +   - 基于公钥密码体制和数字签名服务

    +     - 没有规定特定算法，但推荐使用RSA

    +   - 版本

    +     - 1988年首次发布

    +     - 1993年发布修订版

    +     - 1995年发布第三版

    +     - 2000年再次发布修订版'
  - '[PAGE 463]


    # # X.509证书


    +   - 由证书权威 (Certification Authority-CA) 签发，包括：

    +     - 版本 (version)

    +       - 标识证书版本 (1, 2, or 3)，默认设置为1

    +     - 序列号 (serial number)

    +       - 在CA内唯一标识证书

    +     - 签名算法标识 (signature algorithm identifier)

    +       - 签名算法及其参数

    +     - 发行商名称 (issuer)

    +       - 签发证书的CA中心的名字

    +     - 有效期 (period of validity)

    +       - 证书生效日期和终止日期

    +     - 证书主体名 (subject name)

    +       - 证书拥有者的名字'
  - '[PAGE 464]


    # X.509证书


    +   - 由证书权威（Certification Authority-CA）签发，包括：

    +     - 证书主体公钥信息（subject public-key info）

    +       - 主体的公钥、公钥算法及其参数

    +     - 发行商唯一标识（issuer unique identifier）[v2+]

    +       - 由于X.500的名字被许多不同实体引用，因此用可选位串唯一标识认证中心

    +     - 证书主体唯一标识（subject unique identifier）[v2+]

    +       - 由于X.500的名字被许多不同实体引用，因此用可选位串唯一标识证书主体

    +     - 扩展域（extension fields）[v3]

    +     - 签名（signature）

    +       - 证书所有域的hash、签名算法及其参数


    +   - 表示

    +     - CA<<A>> 表示用户A的证书由CA签发'
  - '[PAGE 465]


    # X.509数据格式（证书与注销列表）


    ![](img/0935d481fd26d10140d7cd560b6540ba_465_0.png)


    (a) X.509 Certificate


    (b) Certificate Revocation List'
  - '[PAGE 466]


    # X.509证书——信任模型


    +   - 单一CA

    +     - 所有的用户信任同一个CA，且其证书都由该CA签发

    +     - 问题

    +       - 当证书不断增加，CA将成为瓶颈

    +       - 不能体现用户的组织层次结构

    +   - 层次CA

    +     - 树状结构

    +     - 每个节点（CA）都信任父节点

    +       - 该节点的证书由父节点签发

    +     - 最顶层节点称为根节点

    +       - 该节点的证书是自签名证书

    +   - 交叉CA

    +     - 网状结构

    +     - 每个节点（CA）可能信任其它节点

    +       - 该节点的证书由其它节点签发

    +     - 每个节点可能被其它节点信任

    +       - 该节点为其它节点签发证书'
  - '[PAGE 467]


    # X.509证书——信任模型


    +   - 每个CA目录入口包含两种证书

    +     - 前向证书：其它CA为该CA签发的证书

    +     - 后向证书：该CA为其它CA签发的证书

    +   - 证书链

    +     - 从某个实体到可信的CA的证书列表。

    +       - 列表中每个证书都是由下一个证书对应的CA签发的。

    +       - 最后一个证书一般是根证书

    +     - 用于验证该实体对应证书的可信性


    ![](img/0935d481fd26d10140d7cd560b6540ba_467_0.png)'
