    \n- 多项式环\n  - 所有这样的多项式组成的集合是一个环，其系数是 Zₚ 域上的元素\n- 通常系数在 GF(2) 上的多项式环更有意义\n  - 能够像整数一样，完成加、减、乘、除运算\n\
