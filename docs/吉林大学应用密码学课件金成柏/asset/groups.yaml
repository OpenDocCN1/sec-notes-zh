    # RIPEMD-160——与MD5&SHA-1比较


    |  | MD5 | SHA-1 | RIPEMD-160 |

    |---|---|---|---|

    | Digest length | 128 bits | 160 bits | 160 bits |

    | Basic unit of processing | 512 bits | 512 bits | 512 bits |

    | Number of steps | 64 (4 rounds of 16) | 80 (4 rounds of 20) | 160 (5 paired
    rounds of 16) |

    | Maximum message size | ∞ | 2^64 − 1 bits | 2^64 − 1 bits |

    | Primitive logical functions | 4 | 4 | 5 |

    | Additive constants used | 64 | 4 | 9 |

    | Endianness | Little-endian | Big-endian | Little-endian |


    # Table 12.9 Relative Performance of Several Hash Functions (coded in C++ on a
    850 MHz Celeron)


    | Algorithm | MBps |

    |---|---|

    | MD5 | 26 |

    | SHA-1 | 48 |

    | RIPEMD-160 | 31 |


    Note: Coded by Wei Dai; results are posted at http://www.eskimo.com/~weidai/benchmarks.html'
  - '[PAGE 413]


    # 密码Hash函数


    +   - 希望利用密码hash函数而不是对称分组密码来创建MAC

    +     - 因为hash函数一般更快

    +     - 没有出口限制


    +   - 最初的设计

    +     - KeyedHash = Hash (Key|Message) ，但存在弱点


    +   - HMAC是最受欢迎的方案之一

    +     - 标准：RFC2104和FIPS草案（尚未序号）

    +     - 应用：IP Sec、SSL'
  - '[PAGE 414]


    # HMAC——设计目标


    +   - 不必修改而直接使用现有的hash函数

    +   - 很容易替换嵌入的hash函数

    +   - 保持hash函数原有性能

    +   - 密钥的处理和使用比较简单

    +   - 如果已知嵌入的hash函数的强度，则完全知道消息认证机制抗密码分析的强度'
