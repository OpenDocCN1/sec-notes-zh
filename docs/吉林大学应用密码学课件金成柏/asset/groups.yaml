  - '[PAGE 387]


    # SHA-1


    +   - 1993年被NIST设计，1995年发布修订版（FIPS 180-1），通常称为SHA-1

    +   - Internet Standard也发布了RFC3174，基本复制了FIPS 180-1

    +   - 产生160-bit的hash值

    +   - 目前首选的hash算法

    +   - 基于MD4进行设计'
  - '[PAGE 388]


    # SHA-1——算法步骤


    # 1. 生成512位消息分组


    +   增加填充位

    +     - 填充消息使其长度与448模512同余

    +     - 消息长度恰好满足上述条件时，仍需要填充

    +   填充长度

    +     - 用64位表示填充前消息的长度

    +     - 将64位的消息长度附加到增加填充位后的消息后面（最高有效位在前）

    +   表示

    +     - Y₀, Y₁, ..., Yₗ₋₁表示填充后的消息，其中L是分组长度，Yᵢ为512位的分组'
  - '[PAGE 389]


    # SHA-1——算法步骤


    # 2. 初始化缓冲区


    +   - 缓冲区用5个32位的寄存器（A,B,C,D,E）表示

    +     - 主要用于保存hash函数的中间结果

    +   - 初始化5个寄存器

    +     - A=67452301

    +     - B=EFCDAB89

    +     - C=98BADCFE

    +     - D=10325476

    +     - E=C3D2E1F0

    +   - 以高端格式存储：字的最高有效字节存储在低地址字节位置

    +   - 表示

    +     - 缓冲区初值也表示为IV'
  - '[PAGE 390]


    # SHA-1——算法步骤


    # 3. 处理每个512位消息分组


    第q个分组处理表示为： CVq+1 = H_SHA-1 ( CVq , Yq )


    +   其中：

    +   - H_SHA-1是压缩函数

    +   - Yq是第q个分组

    +   - CVq、CVq+1是压缩函数H_SHA-1的输入、输出，CV0=IV

    +   - CVq也称之为链接变量


    每次处理前，将CVq输入到寄存器ABCDE中，处理后将寄存器ABCDE中内容输出到CVq+1


    # 4. 第L个分组的压缩函数H_SHA-1处理的输出


    CVL即是160位的消息摘要'
