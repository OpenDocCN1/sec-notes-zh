    \ to use the transformation and secret information for a security service\n\n\
    # Model for Network Access Security\n\nOpponent\n\n- human (e.g., cracker)\n-\
    \ software\n  (e.g., virus, worm)\n\nAccess Channel\n\nGatekeeper function\n\n\
    Information System\n\nComputing resources\n(processor, memory, I/O)\n\nData\n\n\
    Processes\n\nSoftware\n\nInternal security controls\n\n![](img/0935d481fd26d10140d7cd560b6540ba_37_0.png)\n\
    \n# Model for Network Access Security\n\n- using this model requires us to:\n\
    \  - select appropriate gatekeeper functions to identify users\n  - implement\
    \ security controls to ensure only authorised users access designated information\
    \ or resources\n- trusted computer systems can be used to implement this model\n\
    \n# 【密码编码学与网络安全】\n\n（第三版）[美]William Stallings\n\n# 第2章 传统加密技术\n\n吉林大学\n\n金成柏 \
    \ jincb@sohu.com\n\n2008年3月8日\n\n# 内容提要\n\n- 基本术语\n- 对称密码模型（Symmetric Cipher Model）\n\
    - 代换密码（Substitution Ciphers）\n  - 凯撒密码（Caesar Cipher）\n  - 单表代换密码（Monoalphabetic\
    \ Cipher）\n  - 多表代换密码\n    - Playfair密码\n    - Hill密码\n    - Vigenère密码\n  - 一次一密\n\
    - 置换密码（Transposition Ciphers）\n- 转轮机（Rotor Machines）\n- 隐写术（stenography）\n\n#\
    \ 基本术语\n\n- 明文（plaintext）\n  > the original message\n- 密文（ciphertext）\n  > the\
    \ coded message\n- 密码（cipher）\n  > algorithm for transforming plaintext to ciphertext\n\
    - 密钥（key）\n  > info used in cipher known only to sender/receiver\n- 加密（encipher/encrypt）\n\
    \  > converting plaintext to ciphertext\n- 解密（decipher/decrypt）\n  > recovering\
    \ ciphertext from plaintext\n\n# 基本术语\n\n- 密码编码学（cryptography）\n  - study of encryption\
    \ principles/methods\n- 密码分析学（cryptanalysis/codebreaking）\n  - the study of principles/\
    \ methods of deciphering ciphertext *without* knowing key\n- 密码学（cryptology）\n\
    \  - the field of both cryptography and cryptanalysis\n\n# Symmetric Cipher Model\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_43_0.png)\n\n- • 对称加密\n  ➢ 传统加密/私钥加密/单密钥加密\n\
    \  ➢ 发送方和接收方共享公共的密钥\n- • 假设\n  ➢ 密码算法已知\n  ➢ 密钥需要通过安全通道分发\n\n# 代换密码—Substitution\
    \ Ciphers\n\n- 如果把明文看作字母序列\n  - 将明文字母替换成其它字母、数字、符号\n  - 传统密码/古典密码\n- 如果把明文看作二进制序列\n\
    \  - 将密文位串替换明文位串\n\n# 凯撒密码——Caesar Cipher\n\n- 每个明文字母用其后的第三个字母替代\n- 例如\n  meet\
    \ me after the toga party\n  PHHW PH DIWHU WKH WRJD SDUWB\n- 密码变换表\n  a b c d\
    \ e f g h i j k l m n o p q r s t u v w x y z\n  D E F G H I J K L M N O P Q R\
