    # ISAKMP——交换类型


    # 交换类型


    +   > 基本交换

    +   > 身份保护交换

    +   > 单认证交换

    +   > 主动交换

    +   > 信息交换


    | Exchange | Note |

    |---|---|

    | (a) Base Exchange | |

    | (1) I → R: SA; NONCE | Begin ISAKMP-SA negotiation |

    | (2) R → I: SA; NONCE | Basic SA agreed upon |

    | (3) I → R: KE; IDi; AUTH | Key generated; Initiator identity verified by responder
    |

    | (4) R → I: KE; IDr; AUTH | Responder identity verified by initiator; Key generated;
    SA established |

    | (b) Identity Protection Exchange | |

    | (1) I → R: SA | Begin ISAKMP-SA negotiation |

    | (2) R → I: SA | Basic SA agreed upon |

    | (3) I → R: KE; NONCE | Key generated |

    | (4) R → I: KE; NONCE | Key generated |

    | (5)* I → R: IDi; AUTH | Initiator identity verified by responder |

    | (6)* R → I: IDr; AUTH | Responder identity verified by initiator; SA established
    |

    | (c) Authentication Only Exchange | |

    | (1) I → R: SA; NONCE | Begin ISAKMP-SA negotiation |

    | (2) R → I: SA; NONCE; IDr; AUTH | Basic SA agreed upon; Responder identity verified
    by initiator |

    | (3) I → R: IDi; AUTH | Initiator identity verified by responder; SA established
    |

    | (d) Aggressive Exchange | |

    | (1) I → R: SA; KE; NONCE; IDi | Begin ISAKMP-SA negotiation and key exchange
    |

    | (2) R → I: SA; KE; NONCE; IDr; AUTH | Initiator identity verified by responder;
    Key generated; Basic SA agreed upon |

    | (3)* I → R: AUTH | Responder identity verified by initiator; SA established
    |

    | (e) Informational Exchange | |

    | (1)* I → R: N/D | Error or status notification, or deletion |

    | Notation: | |

    | I = initiator | |

    | R = responder | |

    | * = signifies payload encryption after the ISAKMP header | |'
