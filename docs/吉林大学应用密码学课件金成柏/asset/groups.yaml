    \  - B可以确信该消息是由A产生的，因为除B外，只有A拥有K，并能够产生用K加密的密文。但是，明文结构必须易于识别\n\n- 问题\n  - 明文结构的易识别性，决定认证的可靠性\n\
    \    - 如果明文结构是无意义的位串，那么，该消息是不可认证的，因为任何密文串都可能解密出合法的明文\n\n## 消息加密——带FCS的对称加密\n\n\
    ![](img/0935d481fd26d10140d7cd560b6540ba_347_0.png)\n\nFigure 11.2 Internal and\
    \ External Error Control\n\n增加明文易识别性的方法\n\n- 对每个消息附加帧校验序列（FCS）或校验和\n- 内部错误控制提高消息的认证能力\n\
    - 外部错误控制不能提高消息的认证能力\n\n## 消息加密——公钥加密\n\n### 保密性\n\n- 不能提供消息认证。因为，任何人都可以使\n  用\
    \ B 的公钥加密消息\n\n![](img/0935d481fd26d10140d7cd560b6540ba_348_0.png)\n\n### 认证和签名\n\
    \n- 不能提供消息保密性。\n  因为，任何 A 的公钥都\n  能解密消息\n  明文结构必须易于识别\n\n![](img/0935d481fd26d10140d7cd560b6540ba_348_1.png)\n\
    \n### 保密性、认证和签名\n\n- 效率低。因为要对整个\n  消息执行4次公钥算法\n\n![](img/0935d481fd26d10140d7cd560b6540ba_348_2.png)\n\
    \n## 消息认证码\n\n- 消息认证码（MAC）\n  - 消息和密钥的公开函数，它产生定长的值作为认证符\n  - 表示为： MAC=Cₖ(M)\n\
    \    - 其中M为输入消息，C为MAC函数，K为共享密钥\n- MAC函数与加密区别\n  - 加密算法必须是可逆的\n  - MAC函数是多对一的映射，不要求可逆性\n\
