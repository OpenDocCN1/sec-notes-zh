  - '[PAGE 115]


    # 分组密码的工作模式


    Table 3.6 Block Cipher Modes of Operation


    +   1. 电码本

    +   2. 密码分组链接

    +   3. 密码反馈

    +   4. 输出反馈

    +   5. 计数器


    | Mode | Description | Typical Application |

    |---|---|---|

    | Electronic Codebook (ECB) | Each block of 64 plaintext bits is encoded independently
    using the same key. | • Secure transmission of single values (e.g., an encryption
    key) |

    | Cipher Block Chaining (CBC) | The input to the encryption algorithm is the XOR
    of the next 64 bits of plaintext and the preceding 64 bits of ciphertext. | •
    General-purpose block-oriented transmission

    • Authentication |

    | Cipher Feedback (CFB) | Input is processed J bits at a time. Preceding ciphertext
    is used as input to the encryption algorithm to produce pseudorandom output, which
    is XORed with plaintext to produce next unit of ciphertext. | • General-purpose
    stream-oriented transmission

    • Authentication |

    | Output Feedback (OFB) | Similar to CFB, except that the input to the encryption
    algorithm is the preceding DES output. | • Stream-oriented transmission over noisy
    channel (e.g., satellite communication) |

    | Counter (CTR) | Each block of plaintext is XORed with an encrypted counter.
    The counter is incremented for each subsequent block. | • General-purpose block-oriented
    transmission

    • Useful for high-speed requirements |'
