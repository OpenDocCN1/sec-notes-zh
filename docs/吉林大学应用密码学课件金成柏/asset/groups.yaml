    \   - RC5分组密码，即ECB模式\n+   - RC5-CBC，即CBC模式。要求消息长度为分组的整数倍。\n+   - RC5-CBC-PAD，属于CBC模式。通过填充，可以处理任意长度的消息。\n\
    +   - RC5-CTS，属于CBC模式，称为密文挪用模式。可以处理任意长度的消息，并产生等长的密文。\n\n![](img/0935d481fd26d10140d7cd560b6540ba_222_0.png)\n\
    \n## 高级对称分组密码特点\n\n+   - 算法参数\n+     - 密钥长度可变、分组长度可变、迭代次数可变\n+   - 复杂的密钥生成算法\n\
    +   - 复合运算：使用多个算术和布尔运算使算法复杂化\n+   - 与密钥相关的S盒\n+   - 与密钥相关的循环位移\n+   - 与数据相关的循环位移\n\
    +   - 可变的轮函数F\n+   - 每一轮迭代对数据左右两半部分同时运算\n\n## 流密码——典型结构\n\n![](img/0935d481fd26d10140d7cd560b6540ba_224_0.png)\n\
    \nFigure 6.8 Stream Cipher Diagram\n\n+   - 密钥K输入到一个伪随机发生器\n+   - 发生器的输出称为密钥流\n\
    +   - 通过与同一时刻的明文流进行异或产生密文流\n\n## 流密码——考虑的因素\n\n## 需考虑的主要因素\n\n+    - 密钥流序列的周期要长\n\
    +    - 密钥流应该尽可能接近一个真正的随机数流的特征\n+    - 密钥应该足够长\n\n## 流密码和分组密码速度对比\n\nTable 6.2\
    \ Speed Comparisons of Symmetric Ciphers on a Pentium II\n\n| Cipher | Key Length\
    \ | Speed (Mbps) |\n|---|---|---|\n| DES | 56 | 9 |\n| 3DES | 168 | 3 |\n| RC2\
    \ | variable | 0.9 |\n| RC4 | variable | 45 |\n\n## RC4流密码\n\n+   - 由Ron Rivest\
    \ 设计，被RSA拥有，简单但高效\n+     - 面向字节流\n+     - 密钥长度可变（1到256个字节）\n+     - 广泛应用\n+  \
    \     - web SSL/TLS, wireless WEP\n\n## RC4流密码——密钥流生成\n\n+   - 假设\n+     - 状态数组S[0...255]，密钥数组K[0...keylen]，临时数组T[0...255]\n\
    +     - 数组元素为字节\n+   - 初始化S\n+     - 置S元素为0到255，即S[0]=0,S[1]=1,...,S[255]=255\n\
    +     - 将密钥K循环重复填充T\n+     - 进行S的初始置换\n+       - j=0\n+       - for i=0 to 255\
    \ do\n+         - j=(j+S[i]+T[i]) mod 256;\n+         - swap (S[i],S[i]);\n+ \
    \  - 密钥流生成\n+     - i = j = 0\n+     - for each message byte Mᵢ\n+       - i =\
    \ (i + 1) (mod 256)\n+       - j = (j + S[i]) (mod 256)\n+       - swap(S[i],\
    \ S[j])\n+       - t = (S[i] + S[j]) (mod 256)\n+       - Cᵢ = Mᵢ XOR S[t]\n\n\
    ## RC4流密码——密钥流生成\n\n(a) Initial state of S and T\n\n(b) Initial permutation of\
    \ S\n\n(c) Stream Generation\n\nFigure 6.9 RC4\n\n![](img/0935d481fd26d10140d7cd560b6540ba_228_0.png)\n\
    \n## RC4流密码——安全性\n\n+   - 能够抵御已知的攻击\n+   - 变换是非常非线性的\n+   - 由于RC4是流密码，密钥决不能重用\n\
    +     - 如果使用相同的密钥对两个明文流加密，则2个密文流的异或，就是两个明文流的异或\n\n## 【密码编码学与网络安全】\n\n（第三版）[美]William\
    \ Stallings\n\n## 第7章 用对称密码实现保密性\n\n吉林大学\n\n金成柏 jincb@sohu.com\n\n2008年3月30日\n\
    \n## 内容提要\n\n+   - 密码功能的配置\n+   - 传输保密性\n+   - 密钥分配\n+   - 随机数的生成\n\n## 密码功能的配置——安全隐患\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_232_0.png)\n\nFigure 7.1 Points of\
    \ Vulnerability\n\n## 密码功能的配置——安全隐患\n\n+   - 考虑典型的场景\n+     - 在局域网上\n+       -\
    \ 局域网通常是广播网络，数据是以帧的形式传输。\n+     - 在电话网上\n+       - 通过调制解调器与通信服务器相连\n+     - 在数字网上（宽带）\n\
    +       - DDN、X.25、帧中继或ATM网，通过路由器与局域网相连\n+     - 在无线网上\n+       - 微波链路、卫星频道，通过路由器与局域网相连\n\
    +   - 在上述的通信链路上，攻击者都可能进行窃听和攻击\n+     - 局域网上的攻击，技术难度低\n+     - 无线网上的攻击，风险小\n\n\
    ## 密码功能的配置——链路加密和端对端加密\n\n![](img/0935d481fd26d10140d7cd560b6540ba_234_0.png)\n\
    \n● = end-to-end encryption device\n\n○ = link encryption device\n\nPSN = packet\
    \ switching node\n\nPacket-switching network\n\nFigure 7.2 Encryption Across a\
    \ Packet-Switching Network\n\n## 密码功能的配置——链路加密和端对端加密\n\n+   - 保证数据传输的安全性，有两种可选配置\n\
    +   - 链路加密（link encryption）\n+     - 在每个链路两端都加上加密设备\n+     - 优点\n+       - 链路传输的保密性得到保证\n\
    +     - 缺点\n+       - 在链路之间传输，都要重新加解密，通信节点的保密性无法控制\n+       - 每条链路都需要一对加密设备和密钥，密钥数量可能很大\n\
    +   - 端对端加密（end-to-end encryption）\n+     - 在信息传输的两端系统中进行加解密\n+     - 优点\n+  \
    \     - 用户数据在传输的全过程中都是保密的\n+     - 缺点\n+       - 传输的过程存在不安全性。路由信息、密文信息\n+    \
    \   - 每对用户都需要一对密钥，密钥数量可能巨大\n"
