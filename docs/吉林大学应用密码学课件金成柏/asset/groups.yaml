    # # 椭圆曲线算术——Zp上的椭圆曲线


    +   - 选择椭圆曲线方程

    +     - $y^2=x^3+ax+b\pmod p$

    +       - 其中$a$和$b$是$Z_p$中的元素，且满足$4a^3+27b^2\ne0\pmod p$


    +   - 椭圆曲线上点$E_p(a,b)$定义Abel群


    +   - 加法运算


    $x_R=(\lambda^2-x_P-x_Q)\pmod p$


    $y_R=(\lambda(x_P-x_R)-y_P)\pmod p$


    其中


    $\lambda=\begin{cases}

    \left(\dfrac{y_Q-y_P}{x_Q-x_P}\right)\pmod p, & \text{若 }P\ne Q\\[6pt]

