    \ | No | No | Yes |\n| DSS | No | Yes | No |\n\n## 公钥密码学——公钥密码要求\n\n- 公钥密码要求\n\
    \  1. B产生一对密钥（公钥KUb,私钥KRb）在计算上是容易的\n  2. 已知接收方B的公钥和要加密的消息M，发送方A产生相应的密文在计算上是容易的\
    \ C = E_KUb(M)\n  3. 接收方B使用其私钥对接收的密文解密在计算上是容易的 M = D_KRb(C)\n  4. 已知公钥KUb，攻击者要确定私钥KRb在计算上是不可行的\n\
    \  5. 已知公钥KUb和密文C，攻击者要恢复明文M在计算上是不可行的\n  6. （可选）加密和解密函数的顺序是可交换的\n- 到目前为止，满足上述所有条件并普遍接受的算法只有RSA和ECC\n\
    \n## 公钥密码学——公钥密码要求\n\n单向函数是满足下列性质的函数\n\n- Y = f(X) 容易\n- X = f¹(Y) 不可行\n\n单向陷门函数是满足下列性质的函数\n\
    \n- 若k已知, 计算 Y = f(k,X) 容易\n- 若k已知, 计算 X = f¹(k,Y) 容易\n- 若k未知, 计算 X = f¹(k,Y)\
    \ 不可行\n\n公钥密码体制的关键就是寻找合适的单向陷门函数\n\n## RSA算法\n\n- 在1977年，Rivest, Shamir和Adleman在MIT\
    \ 提出，已被广泛接受并实现。\n- RSA是分组密码\n  - 其明文和密文均为0至n-1之间的整数，通常n的大小为1024位二进制数\n\n## RSA算法——密钥生成\n\
    \n- 密钥生成\n  - 随机选择两个大素数 p，q\n  - 计算模 n = p·q， ø(n) = (p-1)(q-1)\n  - 随机选择加密密钥（公钥）\
    \ e\n    - 满足 1<e<ø(n)， gcd(e, ø(n))=1\n  - 解下列等式，找解密密钥（私钥） d\n    - e·d=1 mod\
    \ ø(n) and 0≤d≤n\n  - 公开发行公钥 KU={e,n}\n  - 安全保存私钥 KR={d,n}\n\n## RSA算法——密钥生成\n\
    \n## Key Generation\n\n- Select p, q\n  p and q both prime, p ≠ q\n- Calculate\
    \ n = p × q\n- Calculate φ(n) = (p − 1)(q − 1)\n- Select integer e\n  gcd(φ(n),\
    \ e) = 1; 1 < e < φ(n)\n- Calculate d\n  d ≡ e⁻¹ mod φ(n)\n- Public key\n  KU\
    \ = {e, n}\n- Private key\n  KR = {d, n}\n\n## RSA算法——加密/解密\n\n- 加密\n  - C=M^e\
    \ mod n，其中M是消息且满足 0≤M<n\n- 解密\n  - M=C^d mod n，其中C是密文\n\nEncryption\nPlaintext:\
    \ M < n\nCiphertext: C = M^e (mod n)\n\nDecryption\nCiphertext: C\nPlaintext:\
    \ M = C^d (mod n)\n\n## RSA算法——证明\n\n- 根据Euler定理\n  - a^φ(n) mod n = 1，其中a和n互素，即gcd(a,n)=1\n\
    - 在RSA算法中\n  - n=p·q\n  - φ(n)=(p-1)(q-1)\n  - e和d 模φ(n)互逆，因此，存在k使得 e·d=1+k·φ(n)\n\
    - 证明\n  - C^d = (M^e)^d = M^(1+k·φ(n)) = M^1·(M^φ(n))^k = M^1·(1)^k = M^1 = M\
    \ mod n\n\n## RSA算法——例子\n\n## 密钥生成\n\n1. 选择素数 p=17 和 q=11\n2. 计算n=pq=17×11=187\n\
    3. 计算φ(n)=(p-1)(q-1)=16×10=160\n4. 选择e=7，满足gcd(e,160)=1\n5. 确定d=23，满足de=1 mod\
    \ 160且d < 160\n6. 公开发行公钥 KU={7,187}\n7. 安全保存私钥 KR={23,187}\n\n## 加密/解密\n\n假设消息M={88}\n\
    \n加密：C = 88⁷ mod 187 = 11\n\n解密：M = 11²³ mod 187 = 88\n\n## RSA算法——幂运算\n\n- 反复平方和乘法\n\
    \  - 快速、高效的方法\n- 原理\n  - 计算 a^b，b 可表示如下\n    b = Σ_{b_i≠0} 2^i\n    因此\n    a^b\
    \ = a^{(Σ_{b_i≠0} 2^i)} = ∏_{b_i≠0} a^{(2^i)}\n    a^b mod n = [∏_{b_i≠0} a^{(2^i)}]\
    \ mod n = (∏_{b_i≠0} [a^{(2^i)} mod n]) mod n\n  - 例如：3^129 = 3^128 · 3^1 = 3^2*2*2*2*2*2*2\
    \ · 3^1 = 5 · 3 = 4 mod 11\n  - 共进行 7+1=8 次乘法（否则，需要进行 128 次乘法）\n"
