  - '[PAGE 83]


    # Feistel密码——密码结构


    +   - Horst Feistel 设计了 feistel 密码

    +     - 基于乘积密码的概念

    +   - 输入分成两部分：左部L0和右部R0

    +     - n轮迭代处理

    +       - 每轮迭代具有相同的结构

    +       - 第i轮迭代的输入Li-1和Ri-1来自于上轮迭代的输出

    +     - 每轮迭代处理

    +       - 代换作用于数据的左半部分，通过轮函数F作用数据的右半部分，再与左半部分数据异或来完成

    +       - 然后，交换数据的左右两个部分完成置换

    +   - 实现了Shannon的SPN概念'
