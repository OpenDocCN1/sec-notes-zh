    \ to be decoded<br>• Purported ciphertext chosen by cryptanalyst, together with\
    \ its corresponding decrypted plaintext generated with the secret key |\n| Chosen\
    \ text | • Encryption algorithm<br>• Ciphertext to be decoded<br>• Plaintext message\
    \ chosen by cryptanalyst, together with its corresponding ciphertext generated\
    \ with the secret key<br>• Purported ciphertext chosen by cryptanalyst, together\
    \ with its corresponding decrypted plaintext generated with the secret key |\n\
    \n## 密码分析学——密码算法选择\n\n- 密码算法是无条件安全的\n\n如果无论有多少可使用的密文，都不足以唯一地确定由该密码算法产生密文所对应的明文。\n\
    \n除了一次一密密码外，所有的密码算法都不是无条件安全的\n\n- 密码算法是计算上安全的\n\n破译该密码的代价超出密文信息的价值。\n\n破译该密码的时间超出密文信息的有效生命周期\n\
