  - '[PAGE 452]


    # Kerberos 4——概述


    1. User logs on to workstation and requests service on host.


    2. AS verifies user''s access right in database, creates ticket-granting ticket
    and session key. Results are encrypted using key derived from user''s password.


    3. Workstation prompts user for password to decrypt incoming message, then sends
    ticket and authenticator that contains user''s name, network address, and time
    to TGS.


    4. TGS decrypts ticket and authenticator, verifies request, then creates ticket
    for requested server.


    5. Workstation sends ticket and authenticator to server.


    6. Server verifies that ticket and authenticator match, then grants access to
    service. If mutual authentication is required, server returns an authenticator.


    once per user logon session


    request ticket-granting ticket


    ticket + session key


    once per type of service


    request service ticket


    ticket + session key


    once per service session


    provide server authenticator


    Kerberos


    Authentication Server (AS)


    Ticket-granting Server (TGS)'
