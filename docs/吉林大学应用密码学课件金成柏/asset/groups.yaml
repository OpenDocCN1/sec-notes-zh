    \n## 双重DES——密码分析\n\n- 是否存在K3，使得\n  - Eₖ₂[Eₖ₁[P]] = Eₖ₃[P]\n- 考察\n  - 64位分组之间的1-1映射有\n\
    \    - (2ⁿ)! > 10¹⁰²⁰\n  - DES每个密钥定义的1-1映射总数有\n    - 2⁵⁶ > 10¹⁷\n  - 单重DES对应的映射与双重DES对应的映射重叠的可能性很小\n\
    \    - 直到1992年该假设才被证明\n\n## 双重DES——中间相遇攻击\n\n假设\n> C = E_K2[E_K1[P]]\n> 因此，X =\
    \ E_K1[P] = D_K2[C]\n\n给定明密文对（P,C），攻击如下展开\n> 将P按密钥K1所有可能的2^56个值加密，得到的结果按x的值排序放在表T中\n\
    > 将C用密钥K2所有可能的2^56个值解密，每解密一次，就将解密结果与T表比较，如果有相等的，则用这两个值对应密钥对P加密，若结果为C，则认定这两个密钥是正确的密钥\n\
    \n考察\n> 明文P对应的密文空间为2^64\n> 双密钥对应的密钥空间为2^112\n> 能够产生密文C的密钥个数平均为2^112/2^64 = 2^48\n\
