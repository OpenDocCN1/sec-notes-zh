    - 对攻击者而言，即使IV是随机的、秘密的，也能找到hash函数中的碰撞\n  - 攻击者要找到两条消息M和M’，他们产生相同的hash码。攻击代价为2ⁿ/²\n\
    \  - 攻击HMAC时，由于攻击者不知道K，所以无法离线计算消息/hash码对，必须观察HMAC用相同密钥产生的消息序列，并对这些消息进行攻击。这种攻击是比较困难的，因此，MD5虽然只有128位hash值，也完全可以作为嵌入的hash函数\n\
    \n## 【密码编码学与网络安全】\n\n（第三版）[美]William Stallings\n\n## 第13章 数字签名与认证协议\n\n吉林大学\n\
    金成柏  jincb@sohu.com\n2008年4月20日\n\n## 内容提要\n\n- 数字签名\n- 认证协议\n  - 双向认证\n  - 单向认证\n\
    - 数字签名标准（DSS）\n\n## 数字签名（Digital Signatures）\n\n- 消息认证可以保护信息交换双方不受第三方的攻击，但不能处理通信双方发生的争议\n\
    \  - 接收方可以伪造一条消息，并声称该消息发自发送方\n    - 因为接收方与发送方共享密钥\n  - 发送方否认曾发送过某消息\n    - 因为接收方可以伪造该消息\n\
    - 数字签名必须提供以下能力\n  - 能够验证签名者、签名日期和时间\n  - 能够认证被签的消息内容\n  - 能够由第三方仲裁，以解决争议\n\n##\
    \ 数字签名——应满足的条件\n\n- 签名必须是与消息相关的二进制位串\n- 签名必须使用发送方某些独有的信息\n  - 以防伪造和否认\n- 产生数字签名比较容易\n\
    - 识别和验证数字签名比较容易\n- 伪造数字签名在计算上不可行\n  - 从给定的数字签名伪造消息\n  - 从给定的消息伪造数字签名\n- 保存数字签名的拷贝是可行的\n\
    \n## 数字签名——直接数字签名\n\n- 直接数字签名\n  - 只涉及通信双方：发送方和接收方\n  - 接收方拥有发送方的公钥\n  - 签名\n\
    \    - 发送方用私钥加密整个消息或消息的hash值\n  - 验证\n    - 接收方使用发送方的公钥验证签名\n  - 保密性\n    - 也可通过对消息和签名的加密，提供保密性\n\
    - 有效性依赖于发送者私钥的安全性\n  - 发送者可能声称其私钥已丢失或被盗用，其他人伪造了签名\n\n## 数字签名——仲裁数字签名\n\nNotation:\n\
    \n- X = sender\n- Y = recipient\n- A = Arbiter\n- M = message\n- T = timestamp\n\
    \n| (a) Conventional Encryption, Arbiter Sees Message |\n|(1) X → A: M || E_KxA\
    \ [ID_X || H(M)] |\n|(2) A → Y: E_KAY [ID_X | M || E_KXA [ID_X || H(M)] || T]\
    \ |\n|(b) Conventional Encryption, Arbiter Does Not See Message |\n|(1) X → A:\
    \ ID_X || E_KXY [M] || E_KXA [ID_X || H(E_KXY [M])] |\n|(2) A → Y: E_KAY [ID_X\
    \ || E_KXY [M] || E_KXA [ID_X || H(E_KXY [M])] || T] |\n|(c) Public-Key Encryption,\
    \ Arbiter Does Not See Message |\n|(1) X → A: ID_X || E_KR_A [ID_X || E_KU_Y (E_KR_X\
    \ [M])] |\n|(2) A → Y: E_KR_Y [ID_X || E_KU_Y [E_KR_X [M]]] || T |\n\n## 数字签名方法\n\
    \n- (a) 传统加密，仲裁者能阅读消息\n  - X和Y必须高度信任A\n  - 问题: A可能伪造X的签名（有利于Y），也可能否认X的签名（有利于X）\n\
    - (b) 传统加密，仲裁者不能阅读消息\n  - X和Y必须高度信任A\n  - 问题: A可能与Y伪造X的签名（有利于Y），也可能与X否认X的签名（有利于X）\n\
    - (c) 公钥加密，仲裁者不能阅读消息\n  - 解决了上述问题\n\n## 认证协议\n\n- 认证\n  - 确认通信对方身份的真实性，防止假冒者进行攻击\n\
    \  - 参与认证的实体可以是人、计算机、进程或其它设备\n- 认证可以是双向的、也可以是单向的\n  - 单向认证：即通信中只有一方向另一方进行认证\n\
    \  - 双向认证（相互认证）：即通信中双方互相进行认证。\n"
  mdcn: "\n## RIPEMD-160——设计准则\n\n- 使用两列并行处理方法，增加寻找轮与轮之间碰撞复杂性\n- 简单起见，两列处理类似。但为抗对两列的攻击，使处理尽可能不同\n\
    \  - 加法常量不同、基本逻辑函数使用顺序不同、32位字处理顺序不同\n- 与MD5类似\n- 置换ρ使得在某轮中相近的两个字在下一轮中相差甚远，置换π使得在左列相近的两个字在右列至少有7位不同\n\
    - 循环左移\n  - 移动范围5到15\n  - 每个字在五轮中循环移动次数不同，且移动次数的奇偶性不完全相同\n  - 每个字移动不应有特定规律\n \
    \ - 不应有太多的移动次数能被4整除\n\n## RIPEMD-160——与MD5&SHA-1比较\n\n|  | MD5 | SHA-1 | RIPEMD-160\
