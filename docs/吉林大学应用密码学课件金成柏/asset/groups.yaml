    # PGP——信任关系


    # Table 15.2 Contents of Trust Flag Byte


    | (a) Trust Assigned to Public-Key Owner (appears after key packet; user defined)
    | (b) Trust Assigned to Public Key/User ID Pair (appears after User ID packet;
    computed by PGP) | (c) Trust Assigned to Signature (appears after signature packet;
    cached copy of OWNER TRUST for this signator) |

    |---|---|---|

    | **OWNERTRUST Field**

    — undefined trust

    — unknown user

    — usually not trusted to sign other keys

    — usually trusted to sign other keys

    — always trusted to sign other keys

    — this key is present in secret key ring (ultimate trust)


    **BUCKSTOP bit**

    — set if this key appears in secret key ring | **KEYLEGIT Field**

    — unknown or undefined trust

    — key ownership not trusted

    — marginal trust in key ownership

    — complete trust in key ownership


    **WARNONLY bit**

    — set if user wants only to be warned when key that is not fully validated is
    used for encryption | **SIGTRUST Field**

    — undefined trust

    — unknown user

    — usually not trusted to sign other keys

    — usually trusted to sign other keys

    — always trusted to sign other keys

    — this key is present in secret key ring (ultimate trust)


    **CONTIG bit**

    — set if signature leads up a contiguous trusted certification path back to the
    ultimately trusted key ring owner |'
