    \  - 定义了若干个内容格式\n    - 从而标准化支持多媒体的电子邮件\n  - 定义了编码转换方式\n    - 使得任何内容格式均可转化为邮件系统认可的格式\n\
    \n## S/MIME——MIME内容类型\n\n### Table 15.3 MIME Content Types\n\n| Type | Subtype\
    \ | Description |\n|---|---|---|\n| Text | Plain | Unformatted text; may be ASCII\
    \ or ISO 8859. |\n|  | Enriched | Provides greater format flexibility. |\n| Multipart\
    \ | Mixed | The different parts are independent but are to be transmitted together.\
    \ They should be presented to the receiver in the order that they appear in the\
    \ mail message. |\n|  | Parallel | Differs from Mixed only in that no order is\
    \ defined for delivering the parts to the receiver. |\n|  | Alternative | The\
    \ different parts are alternative versions of the same information. They are ordered\
    \ in increasing faithfulness to the original, and the recipient's mail system\
    \ should display the \"best\" version to the user. |\n|  | Digest | Similar to\
    \ Mixed, but the default type/subtype of each part is message/rfc822. |\n| Message\
    \ | rfc822 | The body is itself an encapsulated message that conforms to RFC 822.\
    \ |\n|  | Partial | Used to allow fragmentation of large mail items, in a way\
    \ that is transparent to the recipient. |\n|  | External-body | Contains a pointer\
    \ to an object that exists elsewhere. |\n| Image | jpeg | The image is in JPEG\
    \ format, JFIF encoding. |\n|  | gif | The image is in GIF format. |\n| Video\
    \ | mpeg | MPEG format. |\n| Audio | Basic | Single-channel 8-bit ISDN mu-law\
    \ encoding at a sample rate of 8 kHz. |\n| Application | PostScript | Adobe Postscript\
    \ |\n|  | octet-stream | General binary data consisting of 8-bit bytes. |\n\n\
    ## S/MIME——MIME转换编码\n\n定义了两种编码方式\n\n- 但Content-Transfer-Encoding可以取6个值\n  - 两种编码方式：quoted-printable、base64\n\
    \  - 当值为7 bit、8 bit、binary时，不进行编码\n  - 当值为x-token时，需提供该自定义方式的名称\n\n### Table 15.4\
    \ MIME Transfer Encodings\n\n|  |  |\n|---|---|\n| 7bit | The data are all represented\
    \ by short lines of ASCII characters. |\n| 8bit | The lines are short, but there\
    \ may be non-ASCII characters (octets with the high-order bit set). |\n| binary\
    \ | Not only may non-ASCII characters be present but the lines are not necessarily\
    \ short enough for SMTP transport. |\n| quoted-printable | Encodes the data in\
    \ such a way that if the data being encoded are mostly ASCII text, the encoded\
    \ form of the data remains largely recognizable by humans. |\n| base64 | Encodes\
    \ data by mapping 6-bit blocks of input to 8-bit blocks of output, all of which\
    \ are printable ASCII characters. |\n| x-token | A named nonstandard encoding.\
    \ |\n"
  mdcn: "\n## PGP——信任关系\n\n- 信任处理操作\n- 1. 所有者信任域（OWNER TRUST）\n  - 当A向公钥环中插入一个新的公钥时\n\
    \    - 如果所有者为A（自己），则该域自动设为ultimate trust\n    - 否则，A必须键入相应的信任级别\n- 2. 签名信任域（SIGTRUST）\n\
    \  - 当新的公钥进入到环中，可能有一个或多个签名与它相联系。当插入一个签名时，PGP将搜索公钥环，看该签名的作者是否是已知的公钥所有者\n    - 如果是，则该域设为签名作者的OwnerTrust值\n\
    \    - 否则，该域设为unknown user\n- 3. 密钥合法性域（KEYLEGIT）\n  - 根据表项中签名信任域计算密钥合法性域。\n \
    \   - 如果至少有一个签名的签名信任值为ultimate，则该域置为complete\n    - 否则，PGP计算加权信任值\n\n## PGP——信任模型示例\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_498_0.png)\n\n? = unknown signatory\n\
    \nX → Y = X is signed by Y\n\n○ = key's owner is trusted by you to sign keys\n\
    \n◐ = key's owner is partly trusted by you to sign keys\n\n● = key is deemed legitimate\
    \ by you\n\nFigure 15.7 PGP Trust Model Example\n\n## S/MIME\n\n- **Secure/Multipurpose\
    \ Internet Mail Extensions**\n  - 增强了互联网络电子邮件格式标准MIME的安全性\n  - RFC为S/MIME定义了许多文档\n\
    \    - 重要的有RFC 2630、RFC 2632、RFC 2633\n- **许多现代的邮件代理都支持S/MIME**\n  - MS Outlook、Netscape等\n\
    - **为了理解S/MIME，我们先介绍**\n  - RFC 822\n  - MIME\n\n## S/MIME——RFC 822\n\n- RFC 822定义了用电子邮件传输的文本消息格式\n\
    \  - 消息格式包含若干行的报头和无限制的正文\n  - 报头通常由关键字、冒号 “:”和参数组成\n  - 报头和正文间用一个空行隔开\n\n```\n\
