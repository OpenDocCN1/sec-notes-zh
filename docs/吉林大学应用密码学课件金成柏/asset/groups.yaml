  - '[PAGE 420]


    # 数字签名（Digital Signatures）


    +   - 消息认证可以保护信息交换双方不受第三方的攻击，但不能处理通信双方发生的争议

    +     - 接收方可以伪造一条消息，并声称该消息发自发送方

    +       - 因为接收方与发送方共享密钥

    +     - 发送方否认曾发送过某消息

    +       - 因为接收方可以伪造该消息

    +   - 数字签名必须提供以下能力

    +     - 能够验证签名者、签名日期和时间

    +     - 能够认证被签的消息内容

    +     - 能够由第三方仲裁，以解决争议'
  - '[PAGE 421]


    # 数字签名——应满足的条件


    +   - 签名必须是与消息相关的二进制位串

    +   - 签名必须使用发送方某些独有的信息

    +     - 以防伪造和否认

    +   - 产生数字签名比较容易

    +   - 识别和验证数字签名比较容易

    +   - 伪造数字签名在计算上不可行

    +     - 从给定的数字签名伪造消息

    +     - 从给定的消息伪造数字签名

    +   - 保存数字签名的拷贝是可行的'
  - '[PAGE 422]


    # 数字签名——直接数字签名


    +   - 直接数字签名

    +     - 只涉及通信双方：发送方和接收方

    +     - 接收方拥有发送方的公钥

    +     - 签名

    +       - 发送方用私钥加密整个消息或消息的hash值

    +     - 验证

    +       - 接收方使用发送方的公钥验证签名

    +     - 保密性

    +       - 也可通过对消息和签名的加密，提供保密性

    +   - 有效性依赖于发送者私钥的安全性

    +     - 发送者可能声称其私钥已丢失或被盗用，其他人伪造了签名'
