    # 椭圆曲线算术——实数域上的椭圆曲线


    +   加法运算


    +   设


    • P=(x_p, y_p) 和Q=(x_Q, y_Q)，则连接这两点的直线1的斜率 Δ=(y_Q-y_P)/(x_Q-x_P)


    • R=P+Q


    +   若P≠Q，则


    ```

    x_R = Δ² - x_P - x_Q

    ```


    ```

    y_R = -y_P + Δ(x_P - x_R)

    ```


    +   若P=Q，则


    ```

    x_R = ((3x_p² + a)/(2y_p))² - 2x_p

    ```


    ```

    y_R = ((3x_p² + a)/(2y_p))(x_P - x_R) - y_P

    ```'
