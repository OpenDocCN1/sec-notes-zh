- raw:
  - '[PAGE 426]


    # 双向认证


    +   - 双向认证经常用于会话密钥交换

    +     - 保密性：防止会话密钥泄漏

    +     - 及时性：防止重放攻击'
  - '[PAGE 427]


    # 认证协议——重放攻击


    +   - 复制通信过程中的消息，并冒充通信的某一方重新发送该消息

    +     - 简单重放

    +       - 简单地复制并在以后重放

    +     - 可检测的重放

    +       - 攻击者在有效的时间限内重放有时限的消息

    +     - 不可检测的重放

    +       - 由于原始的消息被禁止而不能达到接收方，而只有重放的消息能够到达

    +     - 逆向重放

    +       - 重放发送方的消息给发送方


    +   - 解决方案

    +     - 序列号（一般情况下不现实）

    +     - 时间戳（ timestamps，需要同步各方时钟）

    +     - 查询/应答（challenge/response，需要随机数）'
  - '[PAGE 428]


    # 双向认证——对称加密方法


    +   - 特点

    +     - 需要一个可信的密钥分配中心（KDC）

    +     - KDC与通信各方共享主密钥

    +     - KDC负责产生会话密钥


    +   - 表示

    +     - 发起者A的主密钥Ka

    +     - 响应者B的主密钥Kb

    +     - 密钥分配中心C知道密钥Ka和Kb


    +   - 应用

    +     - Kerberos'
  - '[PAGE 429]


    # 双向认证——对称加密方法


    +   Needham-Schroeder协议（临时交互号）


    ![](img/0935d481fd26d10140d7cd560b6540ba_429_0.png)'
  - '[PAGE 430]


    # 双向认证——对称加密方法


    +   - Needham-Schroeder协议（临时交互号）

    +     1. A→KDC： ID_A || ID_B || N₁

    +     2. KDC→A： E_Ka[ Ks || ID_B || N₁ || E_Kb[ Ks || ID_A ] ]

    +     3. A→B： E_Kb[ Ks || ID_A ]

    +     4. B→A： E_Ks[ N₂ ]

    +     5. A→B： E_Ks[ f(N₂) ]

    +     其中：

    +       N1、N2（nonce）为临时交互号（随机数）


    +   - 问题

    +     > 重放攻击

    +     - 假设攻击者X已知一个旧的会话密钥，那么，攻击者可以重放步骤3与B通信'
  - '[PAGE 431]


    # 双向认证——对称加密方法


    +   Denning协议（时间戳）

    +   1. A→KDC: ID_A || ID_B

    +   2. KDC→A: E_Ka[Ks || ID_B || T || E_Kb[Ks || ID_A || T]]

    +   3. A→B: E_Kb[Ks || ID_A || T]

    +   4. B→A: E_Ks[N1]

    +   5. A→B: E_Ks[f(N1)]

    +   其中：

    +   N1 (nonce) 为临时交互号（随机数），T为时间戳


    +   问题

    +   依赖于保持时钟同步，验证消息的及时性

    +   |时钟 - T| < t1 + t2， t1为时钟误差， t2网络延迟

    +   禁止-重放攻击

    +   若发送方时钟超前于接收方时钟，则攻击者截获消息并在消息时间戳与接收方时钟匹配时重放该消息'
  - '[PAGE 432]


    # 双向认证——对称加密方法


    # Kehne协议


    +   1. A→B: ID_A || N_a

    +   2. B→KDC: ID_B || N_b || E_Kb[ID_A || N_a || T_b]

    +   3. KDC→A: E_Ka[ID_B || N_a || Ks || T_b] || E_Kb[ID_A || Ks || T_b] || N_b

    +   4. A→B: E_Kb[ID_A || Ks || T_b] || E_Ks[N_b]


    其中：

    N（nonce）为临时交互号（随机数），T为时间戳


    # 特点


    +   解决了禁止-重放攻击

    +     • 不要求时钟同步。T_b由B生成，由B验证

    +   可以不用KDC介入，就可以建立新的会话

    +     1. A→B: E_Kb[ID_A || Ks || T_b] || N_a''

    +     2. B→A: N_b'' || Ks[N_a'']

    +     3. A→B: E_Ks[N_b'']'
  - '[PAGE 433]


    # SMART原则


    +   - S 具体（Specific）

    +   - M 可衡量（Measurable）

    +   - A 可达成（Achievable）

    +   - R 相关（Relevant）

    +   - T 有时限（Time-bound）'
  - '[PAGE 434]


    # 双向认证——公钥加密方法


    # ● Denning协议（时间戳）


    +   1. **A→CA：** `ID_A || ID_B`

    +   2. **CA→A：** `E_KRa uth[ID_A || KU_a || T] || E_KRa uth[ID_B || KU_b || T]`

    +   3. **A→B：** `E_KRa uth[ID_A || KU_a || T] || E_KRa uth[ID_B || KU_b || T]
    || E_KUb[E_KRa[K_s || T]]`


    # ● 特点


    +   ➢ 安全强度较高

    +     - 会话密钥由A产生，与CA无关

    +   ➢ 时间戳防止重放

    +     - 但需要时钟同步'
  - '[PAGE 435]


    # 双向认证——公钥加密方法


    +   Woo-Lam协议（临时交互号）

    +   1. A→KDC: ID_A || ID_B

    +   2. KDC→A: E_KRauth [ID_B || KU_b]

    +   3. A→B: E_KUb [N_a || ID_A]

    +   4. B→KDC: ID_B || ID_A || E_KUauth [N_a]

    +   5. KDC→B: E_KRauth [ID_A || KU_a] || E_KUb [E_KRauth [N_a || K_s || ID_B]]

    +   6. B→A: E_KUa [E_KRauth [N_a || K_s || ID_B] || N_b]

    +   7. A→B: E_Ks [N_b]


    +   问题

    +   > 看起来很安全，但还存在安全缺陷'
  - '[PAGE 436]


    # # 双向认证——公钥加密方法


    +   ## 改进的Woo-Lam协议（临时交互号）

    +   1. A→KDC: ID_A || ID_B

    +   2. KDC→A: E_KRauth [ID_B || KU_b]

