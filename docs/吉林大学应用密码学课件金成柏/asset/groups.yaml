    \n## 消息认证码——使用场景\n\n- 消息加密可以提供认证功能，为什么还要使用分离的消息认证码呢？\n  - 有时，仅需要认证而不需要保密性\n  \
    \  - 例如\n      - 简单网络管理协议SNMPv3\n  - 有时，认证和保密性的生命周期不相同\n    - 例如\n      - 在协议的应用层上提供认证，而在更低层上提供保密性\n\
    \      - 在传输过程中提供保密性，而在接收方仅保存消息认证信息\n\n## 消息认证码——穷举攻击\n\n- 假设\n  - 密钥长度为k位，MAC长度为n位，且k>n\n\
    \n- 已知\n  - 由函数C产生的明文和MAC值对（M1,MAC1）\n\n- 穷举攻击\n  - 对所有可能的密钥值Ki计算MACi=Cki(M1)，那么至少有一个密钥使得MACi=MAC1。\n\
    \  - 所有可能的密钥数为2^k，不同的MAC值最多有2^n<2^k，所以可能会有多个密钥产生正确的MAC，攻击者不知道哪一个是正确的密钥。平均来说，又2^k/2^n=2^(k-n)个密钥会产生正确的MAC，因此攻击者可进行下列重复攻击\n\
    \    - 循环1\n      给定M1，MAC1=CK(M1)，对所有密钥Ki，判断MACi=Cki(M1)。匹配数≈2^(k-n)\n    - 循环2\n\
    \      给定M2，MAC2=CK(M2)，对所有密钥Ki，判断MACi=Cki(M2)。匹配数≈2^(k-2n)\n  - 从上可知，确定认证密钥比确定同样长度的加密密钥更困难\n\
    \n## 消息认证码——算法攻击\n\n- 考虑如下MAC算法\n  > 令消息M={X1 || X2 || ... || Xm}\n  > 定义\n  \
