  - '[PAGE 254]


    # 随机数生成


    +   - 随机数在密码相关算法中大量使用

    +     - 在密码协议中的临时交互号（nonce）

    +     - 会话密钥

    +     - RSA公钥生成

    +   - 随机数评估标准

    +     - 统计上随机性

    +       - 分布的一致性。均匀分布，出现频率相等。

    +       - 独立性。任何随机数都不能从其它数推导出来。

    +     - 不可预测性'
  - '[PAGE 255]


    # 随机数生成——随机数源与伪随机数


    +   - 现实中的天然随机数

    +     - 离子辐射、闸流管、漏电容、各类噪声（无线、声、热）

    +     - 问题

    +       - 这些天然的随机数的随机性和精度存在问题

    +       - 使用也不是很方便

    +   - 发布的随机数

    +     - 1955年，Rand Co发布了一百万个随机数

    +     - 问题

    +       - 数量有限

    +       - 众所周知（可以预测了）

    +   - 伪随机数（Pseudorandom Number）

    +     - 用算法来生成的随机数

    +     - 能够经受住随机性检测

    +     - 虽然不完美，但很有效'
  - '[PAGE 256]


    # 随机数生成——线性拟合法


    +   - 算法

    +     X_{n+1} = (a X_n + c) mod m

    +   - 评价伪随机数的三个标准

    +     T1: 生成函数是全周期的

    +     T2: 生成的序列显得随机

    +     T3: 能够在32-bit CPU上有效实现

    +   - 如何选择a、c、m，同时满足上述三个标准

    +     > 可以证明，当m为素数时，满足T1。

    +     > 2^31-1是素数，满足T3

    +   - 攻击方法

    +     > 只需少量的数，就可以重构随机数列，例如：

    +     X1 = (a X0 + c) mod m

    +     X2 = (a X1 + c) mod m

    +     X3 = (a X2 + c) mod m'
