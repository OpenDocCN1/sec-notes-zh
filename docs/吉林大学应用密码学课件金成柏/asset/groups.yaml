    \    - (3) C → TGS: IDc || IDv || Ticket tgs\n    - (4) TGS → C: Ticket v\n  -\
    \ 每次服务会话仅一次\n    - (5) C → V: IDc || Ticket v\n  - Ticket tgs = EKtgs[IDc || ADc\
    \ || IDtgs || TS1 || Lifetime1]\n  - Ticket v = EKv[IDc || ADc || IDv || TS2 ||\
    \ Lifetime2]\n- 问题的解决\n  - 票据授权服务器（TGS）\n    - 解决了用户口令多次输入的问题\n  - 口令生成密钥 EKc\n\
    \    - 解决了口令明文传输的问题。只有用户才能够生成密钥解密 EKc[Ticket tgs]\n\n### Kerberos 4——版本4的认证会话\n\
    \n| 认证交换消息 |\n| --- |\n| **(a) Authentication Service Exchange: to obtain ticket-granting\
    \ ticket** |\n| (1) C → AS: IDc \\|\\| IDtgs \\|\\| TS1 |\n| (2) AS → C: EKc[Kc,tgs\
    \ \\|\\| IDtgs \\|\\| TS2 \\|\\| Lifetime2 \\|\\| Ticket_tgs] |\n| Ticket_tgs\
    \ = EKtgs[Kc,tgs \\|\\| IDc \\|\\| ADc \\|\\| IDtgs \\|\\| TS2 \\|\\| Lifetime2]\
    \ |\n| **(b) Ticket-Granting Service Exchange: to obtain service-granting ticket**\
    \ |\n| (3) C → TGS: IDv \\|\\| Ticket_tgs \\|\\| Authenticatorc |\n| (4) TGS →\
    \ C: EKc,tgs[Kc,v \\|\\| IDv \\|\\| TS4 \\|\\| Ticketv] |\n| Ticketv = EKv[Kc,v\
    \ \\|\\| IDc \\|\\| ADc \\|\\| IDv \\|\\| TS4 \\|\\| Lifetime4] |\n| Authenticatorc\
    \ = EKc,tgs[IDc \\|\\| ADc \\|\\| TS3] |\n| **(c) Client/Server Authentication\
    \ Exchange: to obtain service** |\n| (5) C → V: Ticketv \\|\\| Authenticatorc\
    \ |\n| (6) V → C: EKc,v[TS5 +1] (for mutual authentication) |\n| Authenticatorc\
    \ = EKc,v[IDc \\|\\| ADc \\|\\| TS5] |\n"
