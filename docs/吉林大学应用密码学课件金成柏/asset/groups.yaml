    # Web安全性——思考


    +   - Web表现出的新挑战

    +     - Internet是双向的。

    +       - Web服务器相对脆弱，易受来自互联网的攻击

    +     - Web是商业信息发布窗口和商业交易平台

    +       - 安全事关信誉和经济问题

    +     - Web底层软件的复杂性

    +       - 隐藏了潜在的安全隐患

    +     - Web服务器可以成为企业的门户

    +       - 如果Web服务器被攻陷，那么与之相连的其它系统都将受到危害

    +     - 普通用户缺少安全风险意识

    +       - 自身利益可能受到侵害'
