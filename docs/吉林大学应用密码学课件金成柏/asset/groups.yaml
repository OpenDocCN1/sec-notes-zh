  - '[PAGE 295]


    # RSA算法


    +   - 在1977年，Rivest, Shamir和Adleman在MIT 提出，已被广泛接受并实现。

    +   - RSA是分组密码

    +     - 其明文和密文均为0至n-1之间的整数，通常n的大小为1024位二进制数'
  - '[PAGE 296]


    # RSA算法——密钥生成


    +   - 密钥生成

    +     - 随机选择两个大素数 p，q

    +     - 计算模 n = p·q， ø(n) = (p-1)(q-1)

    +     - 随机选择加密密钥（公钥） e

    +       - 满足 1<e<ø(n)， gcd(e, ø(n))=1

    +     - 解下列等式，找解密密钥（私钥） d

    +       - e·d=1 mod ø(n) and 0≤d≤n

    +   - 公开发行公钥 KU={e,n}

    +   - 安全保存私钥 KR={d,n}'
  - '[PAGE 297]


    # RSA算法——密钥生成


    # Key Generation


    +   - Select p, q

    +     p and q both prime, p ≠ q

    +   - Calculate n = p × q

    +   - Calculate φ(n) = (p − 1)(q − 1)

    +   - Select integer e

    +     gcd(φ(n), e) = 1; 1 < e < φ(n)

    +   - Calculate d

    +     d ≡ e⁻¹ mod φ(n)

    +   - Public key

    +     KU = {e, n}

    +   - Private key

    +     KR = {d, n}'
  - '[PAGE 298]


    # RSA算法——加密/解密


    +   - 加密

    +     - C=M^e mod n，其中M是消息且满足 0≤M<n

    +   - 解密

    +     - M=C^d mod n，其中C是密文


    Encryption

    Plaintext: M < n

    Ciphertext: C = M^e (mod n)


    Decryption

    Ciphertext: C

    Plaintext: M = C^d (mod n)'
  - '[PAGE 299]


    # RSA算法——证明


    +   - 根据Euler定理

    +     - a^φ(n) mod n = 1，其中a和n互素，即gcd(a,n)=1

    +   - 在RSA算法中

    +     - n=p·q

    +     - φ(n)=(p-1)(q-1)

    +     - e和d 模φ(n)互逆，因此，存在k使得 e·d=1+k·φ(n)

    +   - 证明

    +     - C^d = (M^e)^d = M^(1+k·φ(n)) = M^1·(M^φ(n))^k = M^1·(1)^k = M^1 = M mod
    n'
  - '[PAGE 300]


    # RSA算法——例子


    # 密钥生成


    +   1. 选择素数 p=17 和 q=11

    +   2. 计算n=pq=17×11=187

    +   3. 计算φ(n)=(p-1)(q-1)=16×10=160

    +   4. 选择e=7，满足gcd(e,160)=1

    +   5. 确定d=23，满足de=1 mod 160且d < 160

    +   6. 公开发行公钥 KU={7,187}

    +   7. 安全保存私钥 KR={23,187}


    # 加密/解密


    假设消息M={88}


    加密：C = 88⁷ mod 187 = 11


    解密：M = 11²³ mod 187 = 88'
  - '[PAGE 301]


    # RSA算法——幂运算


    +   - 反复平方和乘法

    +     - 快速、高效的方法


    +   - 原理

    +     - 计算 a^b，b 可表示如下

    +       b = Σ_{b_i≠0} 2^i

    +       因此

    +       a^b = a^{(Σ_{b_i≠0} 2^i)} = ∏_{b_i≠0} a^{(2^i)}

    +       a^b mod n = [∏_{b_i≠0} a^{(2^i)}] mod n = (∏_{b_i≠0} [a^{(2^i)} mod n])
    mod n

    +     - 例如：3^129 = 3^128 · 3^1 = 3^2*2*2*2*2*2*2 · 3^1 = 5 · 3 = 4 mod 11

    +     - 共进行 7+1=8 次乘法（否则，需要进行 128 次乘法）'
