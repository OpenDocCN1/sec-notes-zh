  - '[PAGE 72]


    # 隐写术（Steganography）


    +   - 隐藏消息的存在

    +     - using only a subset of letters/words in a longer message marked in some
    way

    +     - using invisible ink

    +     - hiding in LSB in graphic image or sound file

    +   - 缺点

    +     - 付出比较高的代价去隐藏相对较少的信息'
  - '[PAGE 73]


    # 【密码编码学与网络安全】


    （第三版）[美]William Stallings


    # 第3章 分组密码与DES


    吉林大学


    金成柏 jincb@sohu.com


    2008年3月16日'
  - '[PAGE 74]


    # 内容提要


    +   - 分组密码原理

    +     - Feistel密码结构的设计动机

    +     - Feistel密码

    +   - 数据加密标准（DES）

    +   - DES的安全强度

    +   - 分组密码的设计原则

    +   - 分组密码的工作模式'
  - '[PAGE 75]


    # 流密码与分组密码


    +   - 流密码

    +     - 每次加密/解密消息流的1位或1个比特

    +     - 古典密码的例子： Vigenère密码和Vernam密码

    +   - 分组密码

    +     - 将消息流分成一系列分组，把这些分组作为基本元素进行整体加密/解密

    +     - 典型的分组大小是64位或128位

    +   - 分组密码与流密码

    +     - 分组密码使用更广泛

    +     - 使用某些工作模式，分组密码也可以获得与流密码相同的效果'
  - '[PAGE 76]


    # # Feistel密码结构的设计动机


    +   - 现代对称分组密码基于Feistel密码结构


    +   - 分组密码可以看成是代换密码


    +   - n -bit分组作为代换的基本单位


    +   - n-bit分组密码的代换表将有2^n个元素'
