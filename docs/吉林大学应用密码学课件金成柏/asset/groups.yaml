  mdcn: "\n## S/MIME——MIME示例\n\nMIME-Version: 1.0\nFrom: Nathaniel Borenstein <nsb@bellcore.com>\n\
    To: Ned Freed <ned@innosoft.com>\nSubject: A multipart example\nContent-Type:\
