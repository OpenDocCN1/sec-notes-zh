  mdcn: "\n## X.509证书——证书注销\n\n- 每个证书都有有效期\n- 证书在超期之前可能被注销\n  1. 用户私钥不安全\n  2. 用户不再信任该CA\n\
    \  3. CA证书的安全性受到危害\n- CA维护被注销证书的列表\n  - Certificate Revocation List (CRL)\n\n\
    ## X.509证书——证书验证\n\n- 实体A的证书验证\n  - 检查该证书的有效期和注销列表\n    - 保证该证书没有过期或被注销\n  - 构造证书链\n\
    \    - 保证每个CA证书没有过期或被注销\n  - 如果证书链中存在可信CA的证书，则信任A\n    - 表明A的证书是由可信的CA签发的\n\n\
    ## 认证过程\n\n- X.509包括三种可选的认证过程\n  - 单向认证\n  - 双向认证\n  - 三向认证\n- 表示\n  - 时间戳t\n\
    \  - 临时交互号r\n  - 消息 sgnData\n  - 会话密钥K\n  - 私钥签名 A{}\n\n![](img/0935d481fd26d10140d7cd560b6540ba_470_0.png)\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_470_1.png)\n\n![](img/0935d481fd26d10140d7cd560b6540ba_470_2.png)\n\
    \n## 内容提要\n\n- **PGP**\n  - 基本服务\n  - 会话密钥和密钥环\n  - 公钥管理\n- **S/MIME**\n  - **RFC\
    \ 822**\n  - **MIME**\n  - **S/MIME**\n\n## 电子邮件安全\n\n- 电子邮件是最广泛应用的异构环境下跨平台的分布式系统\n\
    \  - 与操作系统无关\n  - 与通信协议无关\n\n- 安全需求\n  - 认证\n  - 保密性\n\n- 电子邮件安全\n  - PGP (Pretty\
    \ Good Privacy)\n  - S/MIME\n\n## PGP\n\n- 由Phil Zimmermann等人提出\n  - 选择了当时可获得的最好的密码算法\n\
    \    - RSA、DSS、Diffie-Hellman\n    - CAST-128、IDEA和3DES\n  - 独立于操作系统和处理器，只依赖于一个易用的小规模指令集，因此易于在各种平台实现\n\
    \    - Unix, Windows, Macintosh等\n  - 提供了各种免费版本，其商用版本能够得到技术支持服务\n  - 不由任何政府或标准制定机构控制\n\
    \  - 已经成为了Internet标准文档（RFC 3156）\n\n## PGP——符号约定\n\n- Ks = 会话密钥\n- KRa = 用户A的私钥\n\
    - KUa = 用户A的公钥\n- EP = 公钥加密\n- DP = 公钥解密\n- EC = 对称加密\n- DC = 对称解密\n- H = hash函数\n\
    - || = 串联\n- Z = 用ZIP算法压缩\n- R64 = base64编码（基数64编码）\n\n## PGP——基本服务\n\n### Table\
    \ 15.1 Summary of PGP Services\n\n| Function | Algorithms Used | Description |\n\
    |---|---|---|\n| Digital signature | DSS/SHA or RSA/SHA | A hash code of a message\
    \ is created using SHA-1. This message digest is encrypted using DSS or RSA with\
    \ the sender's private key and included with the message. |\n| Message encryption\
    \ | CAST or IDEA or Three-key Triple DES with Diffie-Hellman or RSA | A message\
    \ is encrypted using CAST-128 or IDEA or 3DES with a one-time session key generated\
    \ by the sender. The session key is encrypted using Diffie-Hellman or RSA with\
    \ the recipient's public key and included with the message. |\n| Compression |\
    \ ZIP | A message may be compressed, for storage or transmission, using ZIP. |\n\
    | Email compatibility | Radix 64 conversion | To provide transparency for email\
    \ applications, an encrypted message may be converted to an ASCII string using\
    \ radix 64 conversion. |\n| Segmentation | — | To accommodate maximum message\
    \ size limitations, PGP performs segmentation and reassembly. |\n\n数字签名\n\n消息加密\n\
    \n压缩\n\n电子邮件兼容\n\n分段\n\n## PGP——密码功能\n\n- 仅认证\n- 仅保密\n- 保密和认证\n\n![](img/0935d481fd26d10140d7cd560b6540ba_477_0.png)\n\
    \nFigure 15.1 PGP Cryptographic Functions\n\n## PGP服务——认证\n\n过程描述：\n\n1. 发送方创建消息\n\
    2. 用SHA-1生成消息的160-bit的hash码\n3. 用发送方的私钥按RSA加密hash码并将结果放入消息中\n4. 接收方使用发送方的公钥按RSA解密，恢复hash码\n\
    5. 接收方从消息中生成新的hash码，并与解密得到的hash码比较。如果匹配，则接收到的消息是真实的\n\n## PGP服务——保密\n\n过程描述：\n\
    \n1. 发送方生成消息和作为会话密钥的128-bit随机数\n2. 用会话密钥按CAST-128（或IDEA、3DES）加密消息\n3. 用接收方的公钥按RSA加密会话密钥，放入消息中\n\
    4. 接收方使用其私钥按RSA解密，恢复会话密钥\n5. 使用会话密钥解密消息\n\n## PGP服务——保密和认证\n\n过程描述：\n\n1. 用发送方的私钥创建签名，并附加到消息中\n\
    2. 用会话密钥加密消息和签名\n3. 用接收方的公钥加密会话密钥，并附加到消息中\n\n## PGP服务——压缩\n\n- 压缩将减少电子邮件传输和存储成本\n\
    \  - PGP默认进行压缩\n  - 压缩算法：ZIP\n\n- 压缩原则\n  - 在签名之后\n    - 方便验证为压缩的消息。否则，将每次验证消息签名时，都需要对消息进行压缩\n\
    \    - 即使允许动态压缩消息进行签名验证，但由于PGP中压缩算法允许根据运行环境自动调整速度和压缩比，这将导致消息摘要发生变化，因此，比较困难\n \
    \ - 在加密之前\n    - 可加强密码的安全性。压缩后消息的冗余信息减少，密码分析更加困难\n\n## PGP服务——电子邮件兼容性\n\n- 原因\n\
    \  - PGP需要发送二进制数据\n    - 加密的消息\n    - 消息的签名\n  - 可是，许多电子邮件系统仅允许使用由ASCII码组成的\n\
    \    消息\n  - 因此，PGP必须能够将二进制数据编码为可打印的\n    ASCII码字符\n- 编码方法：base64（基数64）\n  - 将3个字节编码为4个可打印字符\n\
    \    - 该编码方法将使消息大小增加33%\n  - 如果结合消息压缩，实际消息大小将减少\n    - 1.33（编码）*0.5（压缩）*X（消息）\n\
    \      =0.665*X\n\n## PGP——Base64（基数64）编码\n\n### Table 15.9 Radix-64 Encoding\n\
    \n| 6-bit value | character encoding | 6-bit value | character encoding | 6-bit\
    \ value | character encoding | 6-bit value | character encoding |\n|-------------|--------------------|-------------|--------------------|-------------|--------------------|-------------|--------------------|\n\
    | 0 | A | 16 | Q | 32 | g | 48 | w |\n| 1 | B | 17 | R | 33 | h | 49 | x |\n|\
    \ 2 | C | 18 | S | 34 | i | 50 | y |\n| 3 | D | 19 | T | 35 | j | 51 | z |\n|\
    \ 4 | E | 20 | U | 36 | k | 52 | 0 |\n| 5 | F | 21 | V | 37 | l | 53 | 1 |\n|\
    \ 6 | G | 22 | W | 38 | m | 54 | 2 |\n| 7 | H | 23 | X | 39 | n | 55 | 3 |\n|\
    \ 8 | I | 24 | Y | 40 | o | 56 | 4 |\n| 9 | J | 25 | Z | 41 | p | 57 | 5 |\n|\
    \ 10 | K | 26 | a | 42 | q | 58 | 6 |\n| 11 | L | 27 | b | 43 | r | 59 | 7 |\n\
    | 12 | M | 28 | c | 44 | s | 60 | 8 |\n| 13 | N | 29 | d | 45 | t | 61 | 9 |\n\
    | 14 | O | 30 | e | 46 | u | 62 | + |\n| 15 | P | 31 | f | 47 | v | 63 | / |\n\
