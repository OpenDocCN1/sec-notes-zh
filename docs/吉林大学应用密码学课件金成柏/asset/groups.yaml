  md: "\n## 计数器模式（CTR）\n\n(a) Encryption\n\n(b) Decryption\n\n![](img/0935d481fd26d10140d7cd560b6540ba_129_0.png)\n\
    \n## 计数器模式（CTR）——优缺点\n\n- 高效\n  - 能够并行加密\n  - 预处理\n  - 密文数据的随机访问\n  - 可证明的安全性（至少和其它模式一样安全）\n\
