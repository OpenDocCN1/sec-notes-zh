    \  > hash函数H（使用SHA）\n\n## 数字签名标准——数字签名算法（DSA）\n\n## Global Public Key Components\n\
    \np prime number where 2^(L-1) < p < 2^L for 512 ≤ L ≤ 1024 and L a multiple of\
    \ 64 i.e., bit length of between 512 and 1024 bits in increments of 64 bits\n\n\
    q prime divisor of (p - 1), where 2^159 < q < 2^160 i.e., bit length of 160 bits\n\
    \ng = h^((p-1)/q) mod p where h is any integer with 1 < h < (p - 1) such that\
    \ h^((p-1)/q) mod p > 1\n\n## User's Private Key\n\nx random or pseudorandom integer\
    \ with 0 < x < q\n\n## User's Public Key\n\ny = g^x mod p\n\n## User's Per-Message\
    \ Secret Number\n\nk = random or pseudorandom integer with 0 < k < q\n\n## Signing\n\
    \nr = (g^k mod p) mod q\ns = [k^(-1)(H(M) + xr)] mod q\nSignature = (r, s)\n\n\
    ## Verifying\n\nw = (s^(-1)) mod q\nu1 = [H(M')w] mod q\nu2 = (r)w mod q\nv =\
    \ [(g^u1 y^u2 mod p) mod q]\nTEST: v = r'\n\nM = message to be signed\nH(M) =\
    \ hash of M using SHA-1\nM', r', s' = received versions of M, r, s\n\nFigure 13.2\
    \ The Digital Signature Algorithm\n"
