    \n- 端点\n  - 主机\n  - 进程\n  - 用户\n\n若端点数为N\n则需密钥数\n= [N(N-1)]/2\n\n![](img/0935d481fd26d10140d7cd560b6540ba_245_0.png)\n\
    \n## 密钥分配——密钥层次\n\n- 主密钥\n  - 密钥分配中心与终端实体共享的密钥\n  - 密钥分发要求一个秘密通道\n- 会话密钥\n  -\
    \ 通信双方使用的临时密钥\n  - 由主密钥加密后传送\n\n![](img/0935d481fd26d10140d7cd560b6540ba_246_0.png)\n\
    \n## 密钥分配——典型的密钥分配模式\n\n![](img/0935d481fd26d10140d7cd560b6540ba_247_0.png)\n\n\
    Figure 7.9 Key Distribution Scenario\n\n## 密钥分配——典型的密钥分配模式\n\n### 假设\n\n- 发起者A的主密钥Ka\n\
    - 响应者B的主密钥Kb\n- 密钥分配中心C知道密钥Ka和Kb\n\n### 会话密钥分配过程\n\n- 1. A→C: 请求 || N₁\n- 2. C→A:\
    \ E_Ka[ Ks || 请求 || N₁ || E_Kb(Ks, ID_A) ]\n- 3. A→B: E_Kb( Ks, ID_A )\n- 4. B→A:\
    \ E_Ks[ N₂ ]\n- 5. A→B: E_Ks[ f(N₂) ]\n\n其中：\n\n- N1（nonce）为临时交互号，是一个随机数，防止重放攻击\n\
    - 1、2步骤是密钥分配过程，3、4、5步骤是认证过程\n\n## 密钥分配——层次式密钥控制\n\n- 层次式密钥分配中心（KDC）\n  - 分配代价低\n\
    \  - 安全性高\n\n![](img/0935d481fd26d10140d7cd560b6540ba_249_0.png)\n\n## 密钥分配——会话密钥的生命周期\n\
    \n- 会话密钥改变越频繁\n  - 通信就越安全\n  - 但资源消耗就越大（网络和主机资源）\n\n- 折衷考虑\n  - 面向连结的协议\n    -\
    \ 一般地，连接期间使用相同的会话密钥\n    - 如果连接时间很长，则需要周期性改变会话密钥。但要注意：协议的数据单元的序号可能在变化\n  - 面向非连接的协议\n\
    \    - 周期性改变会话密钥，但要注意交易的延迟性。\n\n## 密钥分配——密钥的使用方法\n\n- 密钥的分类\n  - 密钥在实际使用过程中，根据其用法不同，可能需要加以区分\n\
    \  - 除了主密钥和会话密钥，会话密钥还可能分为数据加密密钥、文件加密密钥等\n- 密钥类型标识方法\n  - 密钥自身标识方法\n    - 如DES中64\
    \ bit中8 bit原来用于校验位，现可用于标识密钥类型\n    - 缺点：受密码系统限制；不能以明文形式传送\n  - 控制矢量方法\n    - 用一个密钥关联的控制矢量表示密钥类型\n\
    \    - 优点：矢量长度没有限制，因此，密钥类型数也不受限制；控制矢量能以明文形式传输、存储\n\n## 密钥分配——控制矢量方法\n\n(a) Control\
