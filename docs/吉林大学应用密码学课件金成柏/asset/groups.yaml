    # # SSL握手协议——阶段1


    阶段1: 建立安全能力




    +   - 版本

    +     - 客户端所支持的最高SSL版本


    +   - 随机数

    +     - 由客户端生成的随机数结构，由32位时间戳和一个安全随机数生成器生成的28字节随机数


    +   - 会话标识: 变长的会话标识

    +     - 非0值意味着客户端想更新已存在连接的参数，或为此会话创建一个新的连接

    +     - 0值意味着客户端想在新 的会话上创建一个新连接


    +   - 密码组: 客户端支持的密码算法列表


    +   - 压缩方法: 客户端支持的压缩算法列表




    +   - 版本

    +     - 客户端支持的最低版本和服务器端支持的最高版本


    +   - 会话标识

    +     - 如果客户端会话标识非0，则服务器使用与之相同的值

    +     - 否则，服务器会话标识包含新会话的值'
