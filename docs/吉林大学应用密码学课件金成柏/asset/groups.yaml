    \ in a longer message marked in some way\n  - using invisible ink\n  - hiding\
    \ in LSB in graphic image or sound file\n- 缺点\n  - 付出比较高的代价去隐藏相对较少的信息\n\n## 【密码编码学与网络安全】\n\
    \n（第三版）[美]William Stallings\n\n## 第3章 分组密码与DES\n\n吉林大学\n\n金成柏 jincb@sohu.com\n\
    \n2008年3月16日\n\n## 内容提要\n\n- 分组密码原理\n  - Feistel密码结构的设计动机\n  - Feistel密码\n- 数据加密标准（DES）\n\
    - DES的安全强度\n- 分组密码的设计原则\n- 分组密码的工作模式\n\n## 流密码与分组密码\n\n- 流密码\n  - 每次加密/解密消息流的1位或1个比特\n\
    \  - 古典密码的例子： Vigenère密码和Vernam密码\n- 分组密码\n  - 将消息流分成一系列分组，把这些分组作为基本元素进行整体加密/解密\n\
    \  - 典型的分组大小是64位或128位\n- 分组密码与流密码\n  - 分组密码使用更广泛\n  - 使用某些工作模式，分组密码也可以获得与流密码相同的效果\n\
    \n## Feistel密码结构的设计动机\n\n- 现代对称分组密码基于Feistel密码结构\n- 分组密码可以看成是代换密码\n- n -bit分组作为代换的基本单位\n\
    - n-bit分组密码的代换表将有2^n个元素\n\n![](img/0935d481fd26d10140d7cd560b6540ba_77_0.png)\n\
    \nFigure 3.4 General n-bit-n-bit Block Substitution (shown with n = 4)\n\n## Feistel密码结构的设计动机\n\
