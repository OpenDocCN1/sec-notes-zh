  md: "\n## Vigenère Ciphers——密码分析\n\n- 频率分析\n  - 每个明文字母都可能对应多个密文字母\n  - 因此，字母频率是模糊的\n\
    \  - 但并没有完全丢失\n  - 攻击过程\n    - 从字母频率分析开始\n      - 看是否像单表替换密码\n    - 如果不是，则决定多表替换密码中使用的密码字母表个数\n\
    \n## Vigenère Ciphers——Kasiski方法\n\n- 由Babbage / Kasiski提出\n  > 利用密文中重复字母序列的周期性提供的线索\n\
    \  - 如果两个相同的明文序列之间距离是密钥词长度的整数倍，那么产生的密文序列也是相同的\n  - 密文中重复字母序列的两次出现可能是偶然的，不一定是用相同的密钥加密相同的明文序列导致的。然而，如果消息足够长，就会有大量重复的密文序列出现。通过计算重复密文序列间距的公因子，分析者就很可能猜出密钥词长度。\n\
    \  - 例子\n    - 前面的例子中，重复密文序列 “VTW” 出现的间距是 9，因此，密钥可能大小是3或9\n  > 然后，利用单表替换密码攻击方法进行攻击\n\
    \n## Vigenère Ciphers——Autokey码\n\n- **Vigenère提出了autokey cipher**\n  - 用于自动生成密钥，将密钥作为消息的前缀共同生成新密钥\n\
    \  - 使密钥长度等于消息长度\n  - 避免了密文中重复字母序列周期问题\n  - 但仍然能够进行字母频率攻击\n\n- **例子： 密钥为*deceptive***\n\
    \  - key: deceptivewearediscoveredsav\n  - plaintext: wearediscoveredsaveyourself\n\
    \  - ciphertext:ZICVTWQNGKZEIIGASXSTSLVVWLA\n\n## 一次一密（One-Time Pad）\n\n- 使用与消息同样长的随机密钥\n\
    - 该密码是不可攻破的\n  - 密文与明文之间没有任何统计学特征\n  - 对任意明文和任意密文，都存在密钥相互映射\n- 实际应用中存在的问题\n  -\
    \ 产生大规模随机密钥是困难的\n  - 庞大的密钥分配和保存存在问题\n\n## 一次一密——例子\n\n- 假设使用27个字符的（第27个字符是空格）Vigenère密码，使用的密钥与消息一样长\n\
    - 用两种不同密钥解密\n\n```\n密文：ANKYODKYUREPFJBYOJDSPLREYIUNOFDOIUERFPLUYTS\n密钥：pxlmvmsydofuyrvzwc\
    \ tnlebnecvqdupahfzzlmnyih\n明文：mr mustard with the candlestick in the hall\n```\n\
    \n```\n密文：ANKYODKYUREPFJBYOJDSPLREYIUNOFDOIUERFPLUYTS\n密钥：mfuqpmiYdgaxgoufhklll\
    \ mhsgdgoqtewbgfqyovuhwt\n明文：miss scarlet with the knife in the library\n```\n\
    \n## 置换（Transposition）密码\n\n- 通过重新排列字母顺序，从而达到隐藏消息的目的\n\n## 栅栏（Rail Fence）密码\n\n\
    - 将明文字母按着对角线顺序写入多行\n- 然后，按行的顺序读出作为密文\n- 例子\n  - 明文\n    meet me atfer the toga\
    \ party\n  - 编码\n    m e m a t r h t g p r y\n    e t e f e t e o a a t\n  - 密文\n\
    \    MEMATRHTGPRYETEFE TEOAAT\n\n## Row Transposition 密码\n\n- 按行将消息字母写成矩阵块\n-\
    \ 然后，根据密钥数值顺读出所在的列作为密文\n- 例子\n  Key:        4 3 1 2 5 6 7\n  Plaintext: a t t\
    \ a c k p\n            o s t p o n e\n            d u n t i l t\n            w\
    \ o a m x y z\n  Ciphertext: TTNAAPT MTSUOADWCOIXKNLYPETZ\n\n## Product密码\n\n\
    - 使用代换或置换的密码不是安全的——因为语言特征\n- 考虑连续使用多个密码\n  - two substitutions make a more complex\
    \ substitution\n  - two transpositions make more complex transposition\n  - a\
    \ substitution followed by a transposition makes a new much harder cipher\n- Product密码是传统密码到现代密码的桥梁\n\
    \n## 转轮机（Rotor Machines）\n\n- 转轮是最常见的product cipher\n  - 实现了一个非常复杂、变化的代换密码\n \
    \ - 使用了一组相互独立的旋转轮（圆桶）\n    - 每个圆筒有26个输入引脚和26个输出引脚，构成了一个代换\n    - 每按一次输入键（加密一个字母），最后转轮就旋转一个引脚的位置。最后转轮旋转完一圈，前面的转轮就旋转一个引脚的位置。依此类推。\n\
    \  - 整个系统使用了26³=17576个替换字母表\n\n## 转轮机——三转子机\n\ndirection of motion\n\ndirection\
