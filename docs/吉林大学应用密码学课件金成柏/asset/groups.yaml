    GhIGfHfYGTrfvbnjT6jH7756tbB9H\n```\n\n## S/MIME——签名数据\n\n- 内容类型\n  - Application/pkcs7-mime;\
    \ smime-type=signed-data\n- 步骤\n  - 选择消息摘要算法（SHA-1或MD5）\n  - 计算待签名内容的消息摘要\n  -\
    \ 用签名者的私钥加密数字摘要\n  - 准备一个签名信息块（SignerInfo），包括：\n    - 签名者公钥证书\n    - 消息摘要算法标识\n\
