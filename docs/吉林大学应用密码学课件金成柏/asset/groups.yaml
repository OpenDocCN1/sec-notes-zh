  - '[PAGE 79]


    # Feistel密码结构的设计动机


    +   - 问题

    +     - 当分组较大时，密钥长度规模非常大

    +       - n=4时，密钥长度为n* 2^n = 64

    +       - n=64时，密钥长度为n* 2^n = 2^70


    +   - 观察

    +     - n-bit分组密码的理想密钥长度需要n* 2^n

    +       - 最大可能的密钥数量为(2^n)^2^n

    +     - n-bit分组密码的加密/解密可逆时

    +       - 密钥空间大小为(2^n)!'
