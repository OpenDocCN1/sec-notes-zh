  - '[PAGE 500]


    # S/MIME——RFC 822


    +   - RFC 822定义了用电子邮件传输的文本消息格式

    +     - 消息格式包含若干行的报头和无限制的正文

    +     - 报头通常由关键字、冒号 “:”和参数组成

    +     - 报头和正文间用一个空行隔开


    ```

    Date: Tue, 16 Jan 1998 10:37:17 (EST)

    From: "William Stallings" <ws@shore.net>

    Subject: The Syntax in RFC 822

    To: Smith@Other-host.com

    Cc: Jones@Yet-Another-Host.com


    Hello. This section begins the actual

    message body, which is delimited from the

    message heading by a blank line.

    ```'
  - '[PAGE 501]


    # S/MIME——MIME


    +   - MIME是对RFC 822框架的一个扩展

    +     - 期待解决使用SMTP、RFC 822电子邮件中存在的问题

    +     - 相关文档：RFC 2045-2049

    +   - SMTP/RFC 822存在的限制

    +     - SMTP不能传输可执行文件或其它二进制对象，SMTP仅限于传输7位ASCII码

    +     - SMTP网关在ASCII码和EBCDIC码之间转换时没有使用一致的映射

    +     - 一些SMTP实现与定义在RFC 821中的SMTP标准不完全一致

    +       - 回车和换行的增加、删除、重排

    +       - 长于76个字符的截断和转行

    +       - 去掉空白字符（制表符和空格符）

    +       - 将消息的行填充为等长

    +       - 将制表符转换为若干空格符'
  - '[PAGE 502]


    # S/MIME——MIME


    +   要素

    +     定义了五个新的报头域

    +       MIME-Version（MIME版本）：必须为1.0

    +       Content-Type（内容类型）

    +       Content-Transfer-Encoding（内容转换编码）

    +       Content-ID（内容标识）

    +       Content-Description（内容描述）

    +     定义了若干个内容格式

    +       从而标准化支持多媒体的电子邮件

    +     定义了编码转换方式

    +       使得任何内容格式均可转化为邮件系统认可的格式'
  - '[PAGE 503]


    # S/MIME——MIME内容类型


    # Table 15.3 MIME Content Types


    | Type | Subtype | Description |

    |---|---|---|

    | Text | Plain | Unformatted text; may be ASCII or ISO 8859. |

    |  | Enriched | Provides greater format flexibility. |

    | Multipart | Mixed | The different parts are independent but are to be transmitted
    together. They should be presented to the receiver in the order that they appear
    in the mail message. |

    |  | Parallel | Differs from Mixed only in that no order is defined for delivering
    the parts to the receiver. |

    |  | Alternative | The different parts are alternative versions of the same information.
    They are ordered in increasing faithfulness to the original, and the recipient''s
    mail system should display the "best" version to the user. |

    |  | Digest | Similar to Mixed, but the default type/subtype of each part is message/rfc822.
    |

    | Message | rfc822 | The body is itself an encapsulated message that conforms
    to RFC 822. |

    |  | Partial | Used to allow fragmentation of large mail items, in a way that
    is transparent to the recipient. |

    |  | External-body | Contains a pointer to an object that exists elsewhere. |

    | Image | jpeg | The image is in JPEG format, JFIF encoding. |

    |  | gif | The image is in GIF format. |

    | Video | mpeg | MPEG format. |

    | Audio | Basic | Single-channel 8-bit ISDN mu-law encoding at a sample rate of
    8 kHz. |

    | Application | PostScript | Adobe Postscript |

    |  | octet-stream | General binary data consisting of 8-bit bytes. |'
  - "[PAGE 504]\n\n# S/MIME——MIME转换编码\n\n定义了两种编码方式\n\n+   > 但Content-Transfer-Encoding可以取6个值\n\
    +   - 两种编码方式：quoted-printable、base64\n+   - 当值为7 bit、8 bit、binary时，不进行编码\n+  \
    \ - 当值为x-token时，需提供该自定义方式的名称\n\nTable 15.4 MIME Transfer Encodings\n\n|  |  |\n\
    |---|---| \n| 7bit | The data are all represented by short lines of ASCII characters.\
    \ |\n| 8bit | The lines are short, but there may be non-ASCII characters (octets\
    \ with the high-order bit set). |\n| binary | Not only may non-ASCII characters\
    \ be present but the lines are not necessarily short enough for SMTP transport.\
    \ |\n| quoted-printable | Encodes the data in such a way that if the data being\
    \ encoded are mostly ASCII text, the encoded form of the data remains largely\
    \ recognizable by humans. |\n| base64 | Encodes data by mapping 6-bit blocks of\
    \ input to 8-bit blocks of output, all of which are printable ASCII characters.\
    \ |\n| x-token | A named nonstandard encoding. |"
