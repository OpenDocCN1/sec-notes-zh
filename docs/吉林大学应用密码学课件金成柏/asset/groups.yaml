    \ - 使用2组已知明密文对，猜出正确密钥的概率为1-2^-16\n\n## 3DES密码——使用2个密钥\n\n- 假设明文P、密钥K1和 K2、密文C\n\
    \  - 加密算法\n    - C = Ek1 [Dk2 [Ek1 [P]]]\n  - 解密算法\n    - P = Dk1 [Ek2 [Dk1 [C]]]\n\
