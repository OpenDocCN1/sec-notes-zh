    +     - A=67452301

    +     - B=EFCDAB89

    +     - C=98BADCFE

    +     - D=10325476

    +   > 以低端格式存储：字的最低有效字节存储在低地址字节位置

    +   > 表示

    +     - 缓冲区初值也表示为IV'
