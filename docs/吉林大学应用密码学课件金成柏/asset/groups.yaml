    \ this preamble. If you are reading this text, you might want to consider changing\
    \ to a mail reader that understands how to properly display multipart messages.\n\
    --unique-boundary-1\n...Some text appears here...\n[Note that the preceding blank\
    \ line means no header fields were given and this is text, with charset US ASCII.\
    \ It could have been done with explicit typing as in the next part.]\n--unique-boundary-1\n\
    Content-type: text/plain; charset=US-ASCII\n\nThis could have been part of the\
    \ previous part, but illustrates explicit versus implicit typing of body parts.\n\
    \n```\n--unique-boundary-1\nContent-Type: multipart/parallel; boundary=unique-boundary-2\n\
    \n--unique-boundary-2\nContent-Type: audio/basic\nContent-Transfer-Encoding: base64\n\
    \n... base64-encoded 8000 Hz single-channel mu-law-format audio data goes here....\n\
    \n--unique-boundary-2\nContent-Type: image/jpeg\nContent-Transfer-Encoding: base64\n\
    \n... base64-encoded image data goes here....\n\n--unique-boundary-2--\n```\n\n\
    ```\n--unique-boundary-1\nContent-type: text/enriched\n\nThis is <bold><italic>richtext.</italic></bold>\
    \ <smaller>as defined in RFC 1896</smaller>\nIsn't it <bigger><bigger>cool?</bigger></bigger>\n\
    --unique-boundary-1\nContent-Type: message/rfc822\nFrom: (mailbox in US-ASCII)\n\
    To: (address in US-ASCII)\nSubject: (subject in US-ASCII)\nContent-Type: Text/plain;\
    \ charset=ISO-8859-1\nContent-Transfer-Encoding: Quoted-printable\n\n... Additional\
    \ text in ISO-8859-1 goes here ...\n--unique-boundary-1--\n```\n\n## S/MIME——MIME规范格式\n\
    \n- 本地格式\n  - 被传送的正文部分是按系统的本地格式创建的，使用本地字符集和行结束符标记。\n- 规范格式\n  - 整个正文部分，包括外部信息如记录长度和可能的文件属性信息，均转化为一致的规范格式。\n\
    \n## S/MIME——功能\n\n- 封装数据\n  - 由任何类型的加密内容和加密该内容所用的加密密钥组成\n  - 密钥可以是与一个或多个接收方对应的多个密钥\n\
    - 签名数据\n  - 签名者通过提取签名内容的数字摘要，并用签名者的私钥加密得到\n  - 然后，用base64编码方法重新对内容和签名编码\n  - 因此，一个被签名了的数据消息只能被具有S/MIME能力的接收方接收\n\
    - 透明签名数据\n  - 与签名数据不同，只有数字签名采用了base64编码\n  - 因此，即使没有S/MIME能力的接收方无法验证签名，但还是可以看到消息的内容\n\
    - 签名并封装数据\n  - 封装数据和签名数据可以嵌套，以便对加密后的数据进行签名，或对签名数据、透明签名数据进行加密\n\n## S/MIME——密码算法\n\
    \n- hash函数\n  - SHA-1 & MD5\n- 数字签名\n  - DSS & RSA\n- 会话密钥加密\n  - ElGamal & RSA\n\
    - 消息加密\n  - 3DES, RC2/40\n\n## S/MIME——封装数据\n\n- 内容类型\n  - Application/pkcs7-mime;\
    \ smime-type=enveloped-data\n- 步骤\n  - 为特定的对称加密算法（RC2/40或3DES）生成伪随机的会话密钥\n  -\
    \ 用每个接收方的RSA公钥分别加密会话密钥\n  - 为每个接收方准备一个接收方信息块（RecipientInfo），包含：\n    - 接收方公钥证书标识\n\
    \    - 加密会话密钥的算法标识\n    - 加密后的会话密钥\n  - 用会话密钥加密消息内容\n  - 将接收方信息块、加密的消息内容用base64编码\n\
    \n## S/MIME——封装数据（示例）\n\n```\nContent-Type: application/pkcs7-mime;\n    smime-type=envelopeddata;name=smime.p7m\n\
    Content-Transfer-Encoding: base64\nContent-Disposition: attachment;\n    filename=smime.p7m\n\
    \nrfvbnj75.6tbBghyHhHUujhJhjH77n8HHGT9HG4VQpf\nyF467GhIGfHfYT67n8HHGghyHhHUujhJh4VQpfyF467\n\
    GhIGfHfYGTrfvbnjT6jH7756tbB9H\n```\n\n## S/MIME——签名数据\n\n- 内容类型\n  - Application/pkcs7-mime;\
    \ smime-type=signed-data\n- 步骤\n  - 选择消息摘要算法（SHA-1或MD5）\n  - 计算待签名内容的消息摘要\n  -\
    \ 用签名者的私钥加密数字摘要\n  - 准备一个签名信息块（SignerInfo），包括：\n    - 签名者公钥证书\n    - 消息摘要算法标识\n\
    \    - 加密消息摘要的算法标识\n    - 加密的消息摘要\n  - 将被签名的消息、签名者信息块、一组公钥证书用 base64编码\n\n## S/MIME——签名数据（示例）\n\
    \n```\nContent-Type: application/pkcs7-mime;\n    smime-type=signed-data;name=smime.p7m\n\
    Content-Transfer-Encoding: base64\nContent-Disposition: attachment;\n    filename=smime.p7m\n\
    \n567GhIGfHfYT6ghyHhHUujpfyF4f8HHGTrfvjhJhJ77\n6tbB9HG4VQbnj777n8HHGT9HG4VQpfyF467GhIGfHfY\n\
    T6rfvbnj756tbBghyHhHUujhJhjHHUujhJh4VQpfyF4\n67GhIGfHfYGT rfvbnjT6jH7756tbB9H7n8HHGghyHh6\n\
    YT64V0GhIGfHfQbnj75\n```\n\n## S/MIME——透明签名数据\n\n- 内容类型\n  - Multipart/Signed\n\
    \  - 子部分内容类型\n    - 第一部分：任何MIME类型\n    - 第二部分：Application/pkcs7-signature\n"
