    +     - a. 找出B的公钥P_B

    +     - b. A要加密消息P_m=(10,9)，其选择随机值k=3，试确定密文C_m

    +     - c. 试给出B由C_m恢复P_m的计算过程

    +   - 解

    +     - a.'
