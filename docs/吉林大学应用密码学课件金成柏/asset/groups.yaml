    \    - 2000年再次发布修订版\n\n## X.509证书\n\n- 由证书权威 (Certification Authority-CA) 签发，包括：\n\
    \  - 版本 (version)\n    - 标识证书版本 (1, 2, or 3)，默认设置为1\n  - 序列号 (serial number)\n\
    \    - 在CA内唯一标识证书\n  - 签名算法标识 (signature algorithm identifier)\n    - 签名算法及其参数\n\
    \  - 发行商名称 (issuer)\n    - 签发证书的CA中心的名字\n  - 有效期 (period of validity)\n    - 证书生效日期和终止日期\n\
    \  - 证书主体名 (subject name)\n    - 证书拥有者的名字\n\n## X.509证书\n\n- 由证书权威（Certification\
    \ Authority-CA）签发，包括：\n  - 证书主体公钥信息（subject public-key info）\n    - 主体的公钥、公钥算法及其参数\n\
    \  - 发行商唯一标识（issuer unique identifier）[v2+]\n    - 由于X.500的名字被许多不同实体引用，因此用可选位串唯一标识认证中心\n\
    \  - 证书主体唯一标识（subject unique identifier）[v2+]\n    - 由于X.500的名字被许多不同实体引用，因此用可选位串唯一标识证书主体\n\
    \  - 扩展域（extension fields）[v3]\n  - 签名（signature）\n    - 证书所有域的hash、签名算法及其参数\n\
    \n- 表示\n  - CA<<A>> 表示用户A的证书由CA签发\n\n## X.509数据格式（证书与注销列表）\n\n![](img/0935d481fd26d10140d7cd560b6540ba_465_0.png)\n\
    \n(a) X.509 Certificate\n\n(b) Certificate Revocation List\n\n## X.509证书——信任模型\n\
    \n- 单一CA\n  - 所有的用户信任同一个CA，且其证书都由该CA签发\n  - 问题\n    - 当证书不断增加，CA将成为瓶颈\n    - 不能体现用户的组织层次结构\n\
    - 层次CA\n  - 树状结构\n  - 每个节点（CA）都信任父节点\n    - 该节点的证书由父节点签发\n  - 最顶层节点称为根节点\n   \
    \ - 该节点的证书是自签名证书\n- 交叉CA\n  - 网状结构\n  - 每个节点（CA）可能信任其它节点\n    - 该节点的证书由其它节点签发\n\
    \  - 每个节点可能被其它节点信任\n    - 该节点为其它节点签发证书\n\n## X.509证书——信任模型\n\n- 每个CA目录入口包含两种证书\n\
    \  - 前向证书：其它CA为该CA签发的证书\n  - 后向证书：该CA为其它CA签发的证书\n- 证书链\n  - 从某个实体到可信的CA的证书列表。\n\
    \    - 列表中每个证书都是由下一个证书对应的CA签发的。\n    - 最后一个证书一般是根证书\n  - 用于验证该实体对应证书的可信性\n\n![](img/0935d481fd26d10140d7cd560b6540ba_467_0.png)\n"
