    \ 5.9 × 10³⁶ years | 5.9 × 10³⁰ years |\n| 26 characters (permutation) | 26! =\
    \ 4 × 10²⁶ | 2 × 10²⁶ μs = 6.4 × 10¹² years | 6.4 × 10⁶ years |\n\n- > DES（数据加密标准）：56位密钥（已经不安全）\n\
    - > 3DES：168位密钥\n- > AES（高级加密标准）：>=128位密钥\n- > （注：1μs = 0.001ms = 0.000001 s）\n\
    \n## Services, Mechanisms, Attacks\n\n需要一个定义安全需求的系统性方法。考虑信息安全的三个方面：\n\n- > 安全攻击（security\
    \ attack）\n  - 危害信息安全的行为\n    - 概念: 威胁（threat）和攻击（attack）\n- > 安全机制（security mechanism）\n\
