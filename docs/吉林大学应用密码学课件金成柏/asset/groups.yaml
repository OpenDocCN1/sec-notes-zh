  - '[PAGE 22]


    # 密码编码学——加密/解密模型


    ![](img/0935d481fd26d10140d7cd560b6540ba_22_0.png)'
  - '[PAGE 23]


    # 密码编码学——相关术语


    +   - 消息与加密

    +     - 消息（message）也称为明文（plaintext），是作为加密输入的原始信息。用某种方法伪装消息以隐藏消息的内容的过程称为加密（encryption），加了密的消息称为密文（ciphertext），而把密文转变为明文的过程称为解密（decryption）。


    +   - 密码算法与密钥

    +     - 密码算法（algorithm）也叫密码（cipher），是用于加密和解密的数学函数。

    +     - 通常有两个相关的函数：一个用作加密，另一个用作解密

    +     - 密钥（key）是参与密码算法变换的参数。密钥可能的取值范围称为密钥空间（keyspace）。

    +     - 密码系统（cryptosystem）由密码算法以及所有可能的明文、密文和密钥组成。'
  - '[PAGE 24]


    # 密码编码学——密码系统的特征


    +   - 所有的密码算法都基于两个基本的运算类型：代换（substitution）和置换（transposition）

    +     - 代换是将明文中的每个元素映射成另一个元素

    +     - 置换是将明文中的元素重新排列

    +   - 所使用密钥的数量

    +     - 发送者和接受者使用相同的密钥，这种密码称为对称密码、单密钥密码、传统密码。

    +     - 发送者和接受者各使用一个不同的密钥，这种密码称为非对称密码、双密钥密码或公开密钥密码。

    +   - 明文处理方式

    +     - 分组（block）加密每次处理一个输入分组。

    +     - 流（stream）密码则是连续地处理每个输入元素。'
  - '[PAGE 25]


    # 密码分析学——攻击方法


    +   - 密码分析法

    +     - 利用算法的特征来推导出特别的明文或使用的密钥


    +   - 穷举攻击法

    +     - 攻击者对一条密文尝试所有可能的密钥，直到把它转化为可读的有意义的明文。

    +     - 平均而言，获得成功至少要尝试所有可能密钥的一半。'
  - '[PAGE 26]


    # 密码分析学——密码分析法


    | Type of Attack | Known to Cryptanalyst |

    |---|---|

    | Ciphertext only | • Encryption algorithm

    • Ciphertext to be decoded |

    | Known plaintext | • Encryption algorithm

    • Ciphertext to be decoded

    • One or more plaintext-ciphertext pairs formed with the secret key |

    | Chosen plaintext | • Encryption algorithm

    • Ciphertext to be decoded

    • Plaintext message chosen by cryptanalyst, together with its corresponding ciphertext
    generated with the secret key |

    | Chosen ciphertext | • Encryption algorithm

    • Ciphertext to be decoded

    • Purported ciphertext chosen by cryptanalyst, together with its corresponding
    decrypted plaintext generated with the secret key |

    | Chosen text | • Encryption algorithm

    • Ciphertext to be decoded

    • Plaintext message chosen by cryptanalyst, together with its corresponding ciphertext
    generated with the secret key

    • Purported ciphertext chosen by cryptanalyst, together with its corresponding
    decrypted plaintext generated with the secret key |'
  - '[PAGE 27]


    # 密码分析学——密码算法选择


    +   密码算法是无条件安全的


    如果无论有多少可使用的密文，都不足以唯一地确定由该密码算法产生密文所对应的明文。


    除了一次一密密码外，所有的密码算法都不是无条件安全的


    +   密码算法是计算上安全的


    破译该密码的代价超出密文信息的价值。


    破译该密码的时间超出密文信息的有效生命周期'
  - '[PAGE 28]


    # 密码分析学——穷举攻击的成本


    Table 2.2 Average Time Required for Exhaustive Key Search


    | Key Size (bits) | Number of Alternative Keys | Time required at 1 encryption/μs
    | Time required at 10⁶ encryptions/μs |

    |---|---|---|---|

    | 32 | 2³² = 4.3 × 10⁹ | 2³¹ μs = 35.8 minutes | 2.15 milliseconds |

    | 56 | 2⁵⁶ = 7.2 × 10¹⁶ | 2⁵⁵ μs = 1142 years | 10.01 hours |

    | 128 | 2¹²⁸ = 3.4 × 10³⁸ | 2¹²⁷ μs = 5.4 × 10²⁴ years | 5.4 × 10¹⁸ years |

    | 168 | 2¹⁶⁸ = 3.7 × 10⁵⁰ | 2¹⁶⁷ μs = 5.9 × 10³⁶ years | 5.9 × 10³⁰ years |

    | 26 characters (permutation) | 26! = 4 × 10²⁶ | 2 × 10²⁶ μs = 6.4 × 10¹² years
    | 6.4 × 10⁶ years |


    +   > DES（数据加密标准）：56位密钥（已经不安全）

    +   > 3DES：168位密钥

    +   > AES（高级加密标准）：>=128位密钥

    +   > （注：1μs = 0.001ms = 0.000001 s）'
  - '[PAGE 29]


    # Services, Mechanisms, Attacks


    需要一个定义安全需求的系统性方法。考虑信息安全的三个方面：


    +   > 安全攻击（security attack）

    +     - 危害信息安全的行为

    +       - 概念: 威胁（threat）和攻击（attack）

    +   > 安全机制（security mechanism）

    +     - 能够检测、防止安全攻击，从安全攻击中恢复

    +     - 为安全服务提供的基础设施

    +   > 安全服务（security service）

    +     - 增强数据处理系统和信息传输的安全性。

    +     - 利用一种或多种安全机制，阻击安全攻击'
  - '[PAGE 30]


    # OSI Security Architecture


    +   - ITU-T推荐方案X.800（即OSI Security Architecture）

    +     - 提供了一种定义安全需求的系统性方法'
  - '[PAGE 31]


    # Security Services


    +   - **X.800 定义**

    +     - 为通信开放系统协议层提供的服务，从而保证系统和数据传输有足够的安全性。

    +   - **RFC 2828 定义**

    +     - 一种由系统提供的对系统资源进行特殊保护的处理或通信服务。'
  - '[PAGE 32]


    # Security Services (X.800)


    X.800将服务分为以下五个类别


    +   - 认证（Authentication） - assurance that the communicating entity is the one
    claimed

    +   - 访问控制（Access Control） - prevention of the unauthorized use of a resource

    +   - 数据保密性（Data Confidentiality） - protection of data from unauthorized disclosure

    +   - 数据完整性（Data Integrity） - assurance that data received is as sent by an authorized
    entity

    +   - 不可否认性（Non-Repudiation） - protection against denial by one of the parties
    in a communication'
  - '[PAGE 33]


    # Security Mechanisms (X.800)


    +   - 特定的安全机制

    +     - encipherment, digital signatures, access controls, data integrity, authentication
    exchange, traffic padding, routing control, notarization

    +   - 普遍的安全机制

    +     - trusted functionality, security labels, event detection, security audit
    trails, security recovery'
  md: "\n## 密码编码学——加密/解密模型\n\n![](img/0935d481fd26d10140d7cd560b6540ba_22_0.png)\n\
    \n## 密码编码学——相关术语\n\n- 消息与加密\n  - 消息（message）也称为明文（plaintext），是作为加密输入的原始信息。用某种方法伪装消息以隐藏消息的内容的过程称为加密（encryption），加了密的消息称为密文（ciphertext），而把密文转变为明文的过程称为解密（decryption）。\n\
    \n- 密码算法与密钥\n  - 密码算法（algorithm）也叫密码（cipher），是用于加密和解密的数学函数。\n  - 通常有两个相关的函数：一个用作加密，另一个用作解密\n\
    \  - 密钥（key）是参与密码算法变换的参数。密钥可能的取值范围称为密钥空间（keyspace）。\n  - 密码系统（cryptosystem）由密码算法以及所有可能的明文、密文和密钥组成。\n\
    \n## 密码编码学——密码系统的特征\n\n- 所有的密码算法都基于两个基本的运算类型：代换（substitution）和置换（transposition）\n\
    \  - 代换是将明文中的每个元素映射成另一个元素\n  - 置换是将明文中的元素重新排列\n- 所使用密钥的数量\n  - 发送者和接受者使用相同的密钥，这种密码称为对称密码、单密钥密码、传统密码。\n\
    \  - 发送者和接受者各使用一个不同的密钥，这种密码称为非对称密码、双密钥密码或公开密钥密码。\n- 明文处理方式\n  - 分组（block）加密每次处理一个输入分组。\n\
    \  - 流（stream）密码则是连续地处理每个输入元素。\n\n## 密码分析学——攻击方法\n\n- 密码分析法\n  - 利用算法的特征来推导出特别的明文或使用的密钥\n\
    \n- 穷举攻击法\n  - 攻击者对一条密文尝试所有可能的密钥，直到把它转化为可读的有意义的明文。\n  - 平均而言，获得成功至少要尝试所有可能密钥的一半。\n\
    \n## 密码分析学——密码分析法\n\n| Type of Attack | Known to Cryptanalyst |\n|---|---|\n|\
    \ Ciphertext only | • Encryption algorithm<br>• Ciphertext to be decoded |\n|\
    \ Known plaintext | • Encryption algorithm<br>• Ciphertext to be decoded<br>•\
    \ One or more plaintext-ciphertext pairs formed with the secret key |\n| Chosen\
    \ plaintext | • Encryption algorithm<br>• Ciphertext to be decoded<br>• Plaintext\
    \ message chosen by cryptanalyst, together with its corresponding ciphertext generated\
