    \n![](img/0935d481fd26d10140d7cd560b6540ba_545_2.png)\n\n## 封装安全载荷（ESP）\n\n- 封装安全载荷ESP\n\
    \  - 提供报文内容保密和受限流量保密服务\n  - 也可选择提供与认证头AH提供的相同的认证服务\n- 支持的密码、模式、填充\n  - 密码\n  \
    \  - DES, Triple-DES, RC5, IDEA, CAST, Blowfish\n  - 加密模式\n    - 密码分组链接模式（CBC）\n\
    \  - 填充\n    - 填充到满足加密分组长度\n\n## 封装安全载荷ESP——传输和隧道模式\n\n## 传输模式\n\n- 保护除IP头外的数据\n\
    - 能够进行流量分析\n- 适于主机对主机传输\n\n![](img/0935d481fd26d10140d7cd560b6540ba_548_0.png)\n\
    \n## 隧道模式\n\n- 加密整个原IP包\n- 加一个新IP包头\n- 适于VPN、网关到网关的安全\n\n![](img/0935d481fd26d10140d7cd560b6540ba_548_1.png)\n\
    \n## 封装安全载荷ESP——传输和隧道模式\n\n- 传输模式\n  - ESP头\n    - SPI、序列号\n  - ESP尾\n    - 填充数据、填充长度、邻接头域\n\
    - 隧道模式\n\n(a) Transport Mode\n\n(b) Tunnel Mode\n\nFigure 16.9 Scope of ESP Encryption\
    \ and Authentication\n\n![](img/0935d481fd26d10140d7cd560b6540ba_549_0.png)\n\n\
    ![](img/0935d481fd26d10140d7cd560b6540ba_549_1.png)\n\n## 安全关联组合\n\n- 单个SA可以实现AH或ESP协议，但不能同时实现两者\n\
    - 为了能够组合多种服务，需要为相同的流量提供多个SA\n  - 从而形成了安全关联束\n  - 安全关联束可以在不同节点终止，也可以在同一节点终止\n-\
    \ 安全关联束的两种组合方式\n  - 传输邻接\n    - 不调用隧道的情况下，对一个IP包使用多个安全协议\n    - 仅允许一级组合，不允许多次嵌套\n\
    \  - 隧道迭代\n    - 通过IP隧道应用多层安全协议\n    - 每个隧道可以在路径上的不同IPSec节点起始和终止，因此，允许多层嵌套\n\n\
    ## 安全关联组合\n\n* = implements IPSec\n\n![](img/0935d481fd26d10140d7cd560b6540ba_551_0.png)\n\
    \n## 密钥管理\n\n- **IPSec密钥管理包括密钥的生成与分发**\n- 典型应用需要4个密钥\n  - 对AH和ESP，每个方向都需要2个\n\
    - 手工密钥管理\n  - 系统管理员手工为每个系统配置自己的密钥和其它通信系统的密钥\n  - 适于小规模、相对静止的环境\n- 自动密钥管理\n  -\
    \ 自动系统在大型分布式系统中使用可变配置为SA动态按需创建密钥\n  - 默认的自动密钥管理协议： Oakley和ISAKMP\n\n## 密钥管理——Oakley\n\
    \n- **Oakley密钥生成协议**\n  - 提供增值安全性\n  - 基于Diffie-Hellman算法的密钥交换协议，但进行了改进\n  - 增加新的属性\n\
    \    - Cookies：可以防止阻塞攻击\n    - 组（global params）\n      - 双方协商得到一个组，作为Diffie-Hellman密钥交换的全局参数。3种模幂运算和2种椭圆曲线运算\n\
    \    - Nonces：防止重放攻击\n    - 具有认证的DH，防止中间人攻击\n\n## ISAKMP\n\n## 互联网安全关联和密钥管理协议（ISAKMP）\n\
    \n- > 提供了互联网密钥管理框架\n  > - 定义了建立、协商、修改、删除SA的过程和包格式\n  > - 定义了生成交换密钥的载荷和认证数据\n \
    \ > - 独立于密钥交换协议、加密算法、认证方法\n  > ISAKMP报文由ISAKMP头和一个或多个载荷组成，并包含在传输协议中\n  > - 规范要求必须支持UDP\n\
    \n## ISAKMP——格式\n\n- 发起者cookie\n- 响应者cookie\n- 邻接载荷类型\n- 主版本\n- 从版本\n- 交换类型\n\
    - 标志\n- 报文标识\n  - 报文唯一标识\n- 长度\n  - 头+所有载荷的总字节长度\n\n![](img/0935d481fd26d10140d7cd560b6540ba_555_0.png)\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_555_1.png)\n\n## ISAKMP——载荷类型\n\n##\
    \ Table 16.3 ISAKMP Payload Types\n\n| Type | Parameters | Description |\n|---|---|---|\n\
    | Security Association (SA) | Domain of Interpretation, Situation | Used to negotiate\
    \ security attributes and indicate the DOI and Situation under which negotiation\
    \ is taking place. |\n| Proposal (P) | Proposal #, Protocol-ID, SPI Size, # of\
    \ Transforms, SPI | Used during SA negotiation; indicates protocol to be used\
    \ and number of transforms. |\n| Transform (T) | Transform #, Transform-ID, SA\
    \ Attributes | Used during SA negotiation; indicates transform and related SA\
    \ attributes. |\n| Key Exchange (KE) | Key Exchange Data | Supports a variety\
    \ of key exchange techniques. |\n| Identification (ID) | ID Type, ID Data | Used\
    \ to exchange identification information. |\n| Certificate (CERT) | Cert Encoding,\
    \ Certificate Data | Used to transport certificates and other certificate-related\
    \ information. |\n| Certificate Request (CR) | # Cert Types, Certificate Types,\
    \ # Cert Auths, Certificate Authorities | Used to request certificates; indicates\
    \ the types of certificates requested and the acceptable certificate authorities.\
    \ |\n| Hash (HASH) | Hash Data | Contains data generated by a hash function. |\n\
    | Signature (SIG) | Signature Data | Contains data generated by a digital signature\
    \ function. |\n| Nonce (NONCE) | Nonce Data | Contains a nonce. |\n| Notification\
    \ (N) | DOI, Protocol-ID, SPI Size, Notify Message Type, SPI, Notification Data\
    \ | Used to transmit notification data, such as an error condition. |\n| Delete\
    \ (D) | DOI, Protocol-ID, SPI Size, # of SPIs, SPI (one or more) | Indicates an\
    \ SA that is no longer valid. |\n"
