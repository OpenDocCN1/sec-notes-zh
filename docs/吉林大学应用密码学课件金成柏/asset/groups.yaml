    \  - 第20章 防火墙\n\n## 课程内容——密码分析学\n\n- 第2章 分组密码的分析方法\n- 第3章 序列密码的分析方法\n- 第4章 公钥密码的分析方法\n\
    - 第5章 密码协议的分析方法\n\n## 参考资料——教科书\n\n- 《密码编码学与网络安全-原理与实践》（第三版），[美]William Stallings著，刘玉珍等译，电子工业出版社\
    \ 2004年1月\n- 《密码分析学》，冯登国著，清华大学出版社 2000年8月\n\n## 参考资料——光盘内容\n\n- Applied Cryptography(应用密码学)2nd\n\
    - Cryptography and Network Security(密码编码学与网络安全)\n  - 3rd\n    - 数学资源\n    - 习题解答\n\
    \    - 中文版\n  - 4th\n- Handbook of Applied Cryptography(应用密码学手册)\n- 安全协议\n- 密码分析学\n\
    - 数论相关\n- 阅读工具\n\n## 课程考核\n\n- 课堂参与（10%）\n- 期末测验（90%）\n\n## 【密码编码学与网络安全】\n\n（第三版）[美]William\
    \ Stallings\n\n## 第1章 引言\n\n> 吉林大学\n> 金成柏 jincb@sohu.com\n> 2008年3月8日\n\n## 内容提要\n\
    \n- 密码学发展历程\n- 什么是密码学（cryptology）？\n- 密码编码学\n  - 加密/解密模型\n  - 密码系统特征\n- 密码分析学\n\
    \  - 攻击方法\n  - 攻击成本\n- Services, Mechanisms, Attacks\n- OSI Security Architecture\n\
    - Model for Network Security\n\n## 密码学发展历程——古典密码\n\n- 主要标志（古代——1948年）\n  - 古典密码是基于字符替换的密码\n\
    \n- 其它主要事件\n  - 1844年，萨米尔·莫尔斯发明了莫尔斯电码\n  - 20世纪初，意大利物理学家奎里亚摩·马可尼发明了无线电报\n    -\
    \ 由于通过无线电波送出的每条信息不仅传给了己方，也传送给了敌方，这就意味着必须给每条信息加密\n  - 1914-1917年，密码本在军事上得到广泛应用\n\
    \    - 德国利用密码破译击败了俄军\n    - 又因自己的密码被英国破译而加速走向了死亡\n\n## 密码学发展历程——古典密码\n\n1918年，二十世纪最有影响的密码分析文章之一—William\
    \ F. Friedman的专题论文《重合指数及其在密码学中的应用》作为私立Riverbank实验室的一份研究报告问世了\n\n曾经认为是完美的维吉耐尔(Vigenere)密码和它的变种也都被英国人Charles\
    \ Babbage破解了。\n\n- Charles Babbage可不是凡人，他设计了差分机Difference Engine和分析机Analytical\
    \ Engine\n\n- 简单的明文字母替换法已经通过频率分析法毫无难度地被破解了\n\n## 密码学发展历程——古典密码\n\n> 1918年，加州奥克兰的Edward\
    \ H.Hebern申请了第一个转轮机专利。\n> - 这种装置在差不多50年里被指定为美军的主要密码设备，它依靠转轮不断改变明文和密文的字母映射关系。\n\
    > 1918年，在德国人Arthur Scherbius天才的努力下，第一台非手工编码的密码机—ENIGMA密码机横空出世了。\n> - 密码机是德军在二战期间最重要的通讯利器，也是密码学发展史上的一个传奇。\n\
    \n## 密码学发展历程——古典密码\n\n- ENIGMA密码机\n\n![](img/0935d481fd26d10140d7cd560b6540ba_16_0.png)\n\
    \n## 密码学发展历程——早期对称密码学\n\n- 主要标志（1949年——1975年）\n  - 1949年，香农(Claude Shannon)《保密系统的通信理论》，为近代密码学建立了理论基础\n\
    - 其它主要事件\n  - 1967年，David Kahn《破译者》(The CodeBreaker)的出现，对以往的密码学历史作了相当完整的记述。\n\
    \  - 同一时期，Horst Feistel在位于纽约约克镇高地的IBM Watson实验室里花费了毕生精力致力于密码学的研究。\n    - 开始美国数据加密标准（DES）的研究，并于70年代初期，发表了这个课题方面的几篇技术报告。\n\
    \n## 密码学发展历程——现代密码学\n\n- 主要标志（1976年——1996年）\n  - 1976年，迪菲（diffie）和赫尔曼（hellman）《密码编码学新方向》开创了公钥密码学\n\
    \  - 1977年，美国制定了数据加密标准（Data Encryption Standard，DES）\n- 其它主要事件\n  - 1978年，R.L.Rivest，A.Shamir和L.Adleman实现了RSA公钥密码体制。\n\
    \n## 密码学发展历程——现代密码学\n\n> 1969年，哥伦比亚大学Stephen Wiesner首次提出“共轭编码”（Conjugate coding）的概念。1984年，H.\
    \ Bennett 和G. Brassard在此思想启发下，提出量子理论BB84协议，从此量子密码理论宣告诞生。\n> 1985年，Miller和Koblitz首次将有限域上的椭圆曲线用到了公钥密码系统中（ECC），其安全性是基于椭圆曲线上的离散对数问题。\n\
    > 1989年，R.Mathews, D.Wheeler, L.M.Pecora和Carroll等人首次把混沌理论使用到序列密码及保密通信理论，为序列密码研究开辟了新途径。\n\
    \n## 密码学发展历程——应用密码学\n\n- 主要标志（1997年——现在）\n  - 标准化\n- 主要事件\n  - 1997年美国启动NIST计划\n\
    \    - 公开征集和评估新的数据加密候选标准(Advanced Encryption Standard, AES)。\n  - 2000年，欧盟启动了新欧洲数据加密、数字签名、数据完整性计划NESSIE\n\
    \    - 研究适应于21世纪信息安全发展全面需求的序列密码、分组密码、公开密钥密码、hash函数以及随机噪声发生器等技术。\n\n## 什么是密码学（cryptology）？\n\
    \n- 密码学包括密码编码学和密码分析学\n  - 密码编码学（cryptography）是使消息保密的科学和技术\n    - 密码编码者（cryptographer）是从事密码编码的专业人员\n\
    \  - 密码分析学（cryptanalysis）就是破译密文的科学和技术\n    - 密码分析者（cryptanalyst）是从事密码分析的专业人员\n\
    \    - 精于密码学的人称之为密码学家（cryptologist）\n"
