    +   3. 处理每个512位消息分组

    +     ➢ 第q个分组处理表示为： CVq+1 = HMD5 (CVq , Yq)

    +     • 其中：

    +       • HMD5是压缩函数

    +       • Yq是第q个分组

    +       • CVq、CVq+1是压缩函数HMD5的输入、输出，CV0=IV

    +       • CVq也称之为链接变量

    +     • 每次处理前，将CVq输入到寄存器ABCD中，处理后将寄存器ABCD中内容输出到CVq+1


