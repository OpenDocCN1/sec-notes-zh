    # DES加密算法——单轮迭代结构


    +   - 输入

    +     * $L_{i-1}$（32-bit）

    +     * $R_{i-1}$（32-bit）

    +     * 子密钥$K_i$（48-bit）

    +   - 输出

    +     * $L_i = R_{i-1}$

    +     * $R_i = L_{i-1} \text{ XOR } F(R_{i-1}, K_i)$

    +   - 轮函数F的处理过程

    +     * 使用扩充置换E将$R_{i-1}$扩充为48-bits

    +     * 与子密钥$K_i$与或

    +     * 通过8个S代换盒处理得到 32-bit输出

    +     * 最后进行32-bit的置换函数P'
  md: "\n## Feistel密码结构的设计动机\n\n- 问题\n  - 当分组较大时，密钥长度规模非常大\n    - n=4时，密钥长度为n* 2^n\
    \ = 64\n    - n=64时，密钥长度为n* 2^n = 2^70\n- 观察\n  - n-bit分组密码的理想密钥长度需要n* 2^n\n \
    \   - 最大可能的密钥数量为(2^n)^2^n\n  - n-bit分组密码的加密/解密可逆时\n    - 密钥空间大小为(2^n)!\n\n###\
    \ 解决方法\n- 较少密钥长度——考虑密钥空间的子集\n  - 例如：n=4时，定义如下线性映射（类似Hill密码），密钥大小为n²=16\n    -\
    \ y1 = k11x1 + k12x2 + k13x3 + k14x4\n    - y2 = k21x1 + k22x2 + k23x3 + k24x4\n\
    \    - y3 = k31x1 + k32x2 + k33x3 + k34x4\n    - y4 = k41x1 + k42x2 + k43x3 +\
    \ k44x4\n  - 上述线性系统是较容易攻破的\n- 弱化统计特征（考虑非线性系统）\n\n## Feistel密码——S-P网络（SPN）\n\n\
    - 代换置换网络（substitution-permutation networks）\n  - 1949 Claude Shannon 提出了这个概念\n\
    \  - 代换置换乘积密码\n  - 奠定了现代分组密码学的基础\n    - Feistel密码机构就是基于这种形式\n- 基于两个原语操作\n  - *substitution*\
    \ (S-box)\n  - *permutation* (P-box)\n- 支持混淆（diffusion）与扩散（Confusion）\n\n## Feistel密码——密码结构\n\
    \n- Horst Feistel 设计了 feistel 密码\n  - 基于乘积密码的概念\n- 输入分成两部分：左部L0和右部R0\n  - n轮迭代处理\n\
    \    - 每轮迭代具有相同的结构\n    - 第i轮迭代的输入Li-1和Ri-1来自于上轮迭代的输出\n  - 每轮迭代处理\n    - 代换作用于数据的左半部分，通过轮函数F作用数据的右半部分，再与左半部分数据异或来完成\n\
    \    - 然后，交换数据的左右两个部分完成置换\n- 实现了Shannon的SPN概念\n\n## Feistel密码——参数和特征\n\n- 分组长度（block\
    \ size）\n  - increasing size improves security, but slows cipher\n- 密钥长度（key size）\n\
    \  - increasing size improves security, makes exhaustive key searching harder,\
    \ but may slow cipher\n- 迭代轮数（number of rounds）\n  - increasing number improves\
    \ security, but slows cipher\n- 子密钥生成算法（subkey generation）\n  - greater complexity\
    \ can make analysis harder, but slows cipher\n- 轮函数（round function）\n  - greater\
    \ complexity can make analysis harder, but slows cipher\n\n## Feistel密码——设计原则\n\
    \n- 快速软件加密/解密\n  - 不仅易于快速硬件实现，也应易于快速软件实现\n- 简化分析难度\n  - 设计简单的算法易于分析，从而对算法的安全性和脆弱性有清晰的认识\n\
