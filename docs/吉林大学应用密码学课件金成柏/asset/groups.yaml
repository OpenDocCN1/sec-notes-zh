    \  - 当建立一个新的SA时，计数器初值设为0\n  - 每次在SA上发送一个包，则计数器加1，并将值放入序列号域\n  - 如果序列号达到2³²-1，则SA必须终止，并用新的密钥协商生成新的SA\n\
    \n- W窗口\n  - IP是无连接、不可靠的服务，协议不能保证包按顺序传输，也不能保证所有的包均被传输\n  - 如果所接受的包在窗口中且是新包，则验证MAC。如果通过验证，则在窗口中标记相应位置\n\
    \  - 如果所接受的包超过窗口的右边界且是新包，则验证MAC。如果验证通过，则以这个序列号为窗口的右边界并在窗口中标记相应位置\n  - 如果所接受的包超过左边界或未通过验证，则忽略包，并产生审计事件。\n"
  mdcn: "\n## IPSec——体系结构\n\n- 体系结构 (Architecture)\n  - 概念、安全需求、机制\n- 载荷安全封装 (ESP)\n\
    \  - 加密/认证\n- 认证头 (AH)\n  - 认证\n- 加密算法\n  - ESP中使用的各种加密算法\n- 认证算法\n  - AH和ESP中使用的认证算法\n\
    - 密钥管理 (Key Management)\n  - 密钥管理模式\n- 解释域 (DOI)\n  - 对标识(算法)和参数的值定义\n\n![](img/0935d481fd26d10140d7cd560b6540ba_530_0.png)\n\
    \nFigure 16.2 IPSec Document Overview\n\n## IPSec——服务\n\n### Table 16.1 IPSec\
    \ Services\n\n|  | AH | ESP (encryption only) | ESP (encryption plus authentication)\
    \ |\n|---|---|---|---|\n| Access control | ✓ | ✓ | ✓ |\n| Connectionless integrity\
    \ | ✓ |  | ✓ |\n| Data origin authentication | ✓ |  | ✓ |\n| Rejection of replayed\
    \ packets | ✓ | ✓ | ✓ |\n| Confidentiality |  | ✓ | ✓ |\n| Limited traffic flow\
    \ confidentiality |  | ✓ | ✓ |\n\n- 安全协议\n  - AH——认证协议\n  - ESP——加密认证协议\n\n- 安全协议提供的服务\n\
    \  - 访问控制\n  - 无连接完整性\n  - 数据源认证\n  - 拒绝重放包\n  - 保密性\n  - 受限流量保密性\n\n## IPSec——安全关联（SA）\n\
    \n- **IPSec SA是构成IPSec的基础**\n  - IPSec SA是两个通信实体经协商建立起来的一种协定\n    - 规定了用来保护数据包安全的IPSec协议、转码方式、密钥以及密钥的有效存在时间等等。\n\
    \  - SA数据库（SADB）\n    - 由它来维护IPSec协议中的SA记录\n  - 安全策略数据库（SPD）\n    - 定义了IP流量与特定SA的关联：流量子集入口、与该流量相关的SA指针\n\
    \n## IPSec——安全关联（SA）\n\n- **IPSec SA是单向的**\n  - 如果两个主机（比如A和B）正在通过ESP进行安全通信，那么\n\
    \  - 主机A就需要一个SA，即SA(out)，用来处理外发的数据包；\n  - 还需要有一个不同的SA，即SA(in)，来处理进入的数据包。\n  -\
    \ 主机A的SA(out)和主机B的SA(in)将共享相同的加密参数。\n  - 主机A的SA(in)和主机B的SA(out)也共享同样的加密参数。\n\n\
    - **IPSec SA是“与协议相关”的**\n  - 每种协议都有一个SA\n  - 如果主机A和B同时通过AH和ESP进行安全通信，那么每个主机都会针对每一种协议来构建一个独立的SA。\n\
    \n## IPSec——安全关联（SA）\n\n- IPsec SA由以下三个参数唯一确定\n  - 安全参数索引（SPI）\n    - 标识本地SA的相关长度为32bit的位串\n\
    \    - SPI由AH和ESP携带，使得接受方能够选择合适的SA处理接受包\n  - IP目的地址\n  - 安全协议标识\n    - 标识该关联是AH安全关联或ESP安全关联\n\
    \n## IPSec——安全关联（SA）\n\n- IPSec SA参数\n  > 序列号计数器\n    * 生成AH或ESP报头中序列号的32位值\n\
    \  > 序列号溢出标志\n    * 标志序列号计数器是否溢出，生成审计事件。溢出时阻止在该SA上继续传输包\n  > 反重放窗口\n  > AH信息\n\
    \    * 认证算法、密钥、密钥生存期、AH相关参数\n  > ESP信息\n    * 加密和认证算法、密钥、初始值、密钥生存期、ESP相关参数\n \
    \ > 安全关联的生存期\n    * 一个特定的时间间隔或字节计数\n  > IPSec协议模式\n    * 隧道、传输、通配符\n  > Path MTU\n\
    \    * 最大传输单元路径和延迟变量\n\n## IPSec——SA选择子\n\n- **SA选择子**\n  - 用于定义安全策略数据库（SPD）中的流量入口\n\
    \  - 由一个IP集合和上层协议定义\n- **可用的SA选择子**\n  - 源IP地址和目的IP地址：一个、一组、范围地址和掩码\n  - 用户标识：操作系统用户标识\n\
    \  - 数据敏感性级别：信息流安全级别（秘密、未分类）\n  - 传输层协议：从IP邻接头域获得，可以是一个、一组、范围协议号\n  - IPSec协议：AH、ESP、AH/ESP\n\
    \  - 源端口和目的端口：一个、一组端口或端口通配符\n  - IPv6报类、IPv6报流标签、IPv4报服务类型\n\n## IPSec——传输模式和隧道模式\n\
    \n- 传输模式\n  - 为上层协议提供保护，同时增加了IP包载荷的保护\n    - ESP加密和认证IP载荷（不包括IP报头）、ESP头后的IPv6扩展头\n\
    \    - AH认证IP载荷、IP报头的选中部分、IPv6扩展头\n  - 典型用于主机间端对端安全通信\n\n- 隧道模式\n  - 对整个IP包提供保护，在原有内部IP包外层加一个新的外部IP报头\n\
    \    - ESP加密和认证整个内部IP包，包括内部IP报头\n    - AH认证整个内部包、外部IP报头中选中部分、IPv6扩展头\n  - 当SA的一端或两端为安全网关（防火墙、路由器）时，使用隧道模式\n\
    \n## IPSec——传输模式和隧道模式\n\n### Table 16.2 Tunnel Mode and Transport Mode Functionality\n\
    \n|  | Transport Mode SA | Tunnel Mode SA |\n|---|---|---|\n| AH | Authenticates\
    \ IP payload and selected portions of IP header and IPv6 extension headers. |\
    \ Authenticates entire inner IP packet (inner header plus IP payload) plus selected\
    \ portions of outer IP header and outer IPv6 extension headers. |\n| ESP | Encrypts\
    \ IP payload and any IPv6 extension headers following the ESP header. | Encrypts\
    \ entire inner IP packet. |\n| ESP with Authentication | Encrypts IP payload and\
    \ any IPv6 extension headers following the ESP header. Authenticates IP payload\
    \ but not IP header. | Encrypts entire inner IP packet. Authenticates inner IP\
    \ packet. |\n\n## 认证头（AH）\n\n- 认证头AH\n  - 支持数据完整性和IP包的认证\n  - 防止地址欺诈\n  - 防止重放攻击\n\
    - 基于消息认证码（MAC）\n  - HMAC-MD5-96 or HMAC-SHA-1-96\n  - 双方必须共享同一个密钥\n\n## 认证头（AH）——格式\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_540_0.png)\n\n- 邻接头（Next Header）：紧跟在此报头后面的头类型\n\
    - 载荷长度（Payload Length）：认证头长度减2（32 bit字为单位）\n- 安全参数索引（SPI）\n- 序列号（Sequence Number）：单调递增计数値\n\
    - 认证数据（Authentication Data）：包含完整性校验值（ICV）\n\n## 认证头AH——反重放服务\n\n- SA的序列号计数器可反重放攻击\n\
    \  - 当建立一个新的SA时，计数器初值设为0\n  - 每次在SA上发送一个包，则计数器加1，并将值放入序列号域\n  - 如果序列号达到2³²-1，则SA必须终止，并用新的密钥协商生成新的SA\n\
    \n- W窗口\n  - IP是无连接、不可靠的服务，协议不能保证包按顺序传输，也不能保证所有的包均被传输\n  - 如果所接受的包在窗口中且是新包，则验证MAC。如果通过验证，则在窗口中标记相应位置\n\
    \  - 如果所接受的包超过窗口的右边界且是新包，则验证MAC。如果验证通过，则以这个序列号为窗口的右边界并在窗口中标记相应位置\n  - 如果所接受的包超过左边界或未通过验证，则忽略包，并产生审计事件。\n"
