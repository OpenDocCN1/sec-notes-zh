    \   - 用64位表示填充前消息的长度\n     - 若消息长度大于2⁶⁴，则取模2⁶⁴的余\n     - 将64位的消息长度附加到增加填充位后的消息后面\n\
    \   - 表示\n     - Y₀, Y₁, …, Yₗ₋₁表示填充后的消息，其中L是分组长度，Yᵢ为512位的分组\n\n## RIPEMD-160——算法步骤\n\
    \n### 2. 初始化缓冲区\n\n- 缓冲区用5个32位的寄存器（A,B,C,D,E）和5个32位的寄存器（A′,B′,C′,D′,E′）表示\n  -\
    \ 主要用于保存hash函数的中间结果\n- 初始化10个寄存器\n  - A=A′=67452301\n  - B=B′=EFCDAB89\n  - C=C′=98BADCFE\n\
    \  - D=D′=10325476\n  - E=E′=C3D2E1F0\n- 以低端格式存储：字的最低有效字节存储在低地址字节位置\n- 表示\n  -\
    \ 缓冲区初值也表示为IV\n\n## RIPEMD-160——算法步骤\n\n3. 处理每个512位消息分组\n   > 第q个分组处理表示为： CV_{q+1}=H_{RIPEMD}(CV_q,\
    \ Y_q)\n   • 其中：\n     • H_{RIPEMD}是压缩函数\n     • Y_q是第q个分组\n     • CV_q、CV_{q+1}是压缩函数H_{RIPEMD}的输入、输出，CV_0=IV\n\
    \     • CV_q也称之为链接变量\n   • 每次处理前，将CV_q输入到寄存器ABCDE和A′B′C′D′E′中，处理后将寄存器ABCDE和A′B′C′D′E′中内容计算后输出到CV_{q+1}\n\
    \n4. 第L个分组的压缩函数H_{RIPEMD}处理的输出 CV_L即是160位的消息摘要\n\n## RIPEMD-160——压缩函数H_RIPEMD\n\
    \n- 压缩函数由10轮运算组成\n\n- 分成左右两组，每组5轮\n\n- 每轮运算用轮函数RFx表示\n\n- x表示每个轮函数使用的不同的基本逻辑函数，f1,f2,f3,f4,f5表示基本逻辑函数。\n\
    \n- 右列每轮使用的基本逻辑函数与左列使用顺序正好相反\n\n- 压缩函数H_RIPEMD表示为\n\nCV0=IV\nCVq+1(0)=CVq(1)+C+D'\n\
    CVq+1(1)=CVq(2)+D+E'\nCVq+1(2)=CVq(3)+E+A'\nCVq+1(3)=CVq(4)+A+B'\nCVq+1(4)=CVq(0)+B+C'\n\
    MD=CVL\n\n![](img/0935d481fd26d10140d7cd560b6540ba_404_0.png)\n\n## RIPEMD-160——轮函数RFx\n\
    \n![](img/0935d481fd26d10140d7cd560b6540ba_405_0.png)\n\nFigure 12.9 Elementary\
    \ RIPEMD-160 Operation (single step)\n\n## RIPEMD-160——轮函数RFx\n\n- 每轮需要16步迭代\n\
    \n- 每步迭代可表示为： ABCDE j\n  = A←e,\n  B←rols(j)(a+f(j,b,c,d)+Xr(j)+K(j))+e,\n  C←b,\n\
    \  D←rol10(c),\n  E←d\n\n其中：\n\n- a,b,c,d,e =缓冲区对应的5个寄存器中的字\n\n- j =步骤编号；0<=j<=79。左列和右列分别编号。\n\
    \n- f(j,b,c,d)=左列第j步和右列第79-j步使用的基本逻辑函数\n\n- rols(j) =32位的变量循环左移s(j)位\n\n- Xr(j)\
    \ =当前分组中第x(j)个32位字\n\n- K(j) =第j步使用的加法常量\n\n- + =模2^32加法\n\n## 轮函数RFx——基本逻辑函数f\n\
