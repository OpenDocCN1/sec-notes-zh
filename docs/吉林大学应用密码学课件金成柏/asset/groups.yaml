    - 1854年被Charles Wheatstone发明，而用他的朋友Baron Playfair的名字命名\n- 基于一个由密钥构成的5X5矩阵（例子中使用的密钥是monarchy）\n\
    \  - M O N A R\n  - C H Y B D\n  - E F G I/J K\n  - L P Q S T\n  - U V W X Z\n\
    \n## Playfair Cipher——密码算法\n\n明文按如下规则一次加密两个字母\n\n- 1. 如果字母对的两个字母相同，则在它们之间加一个填充字母，如'X'\n\
    \  - 例如：\"balloon\"处理为\"ba lx lo on\"\n- 2. 落在矩阵同一行的明文字母，由其右边的字母代替。\n  - 例如：\"\
    ar\"加密为\"RM\"\n- 3. 落在矩阵同一列的明文字母，由其下面的字母代替。\n  - 例如：\"mu\"加密为\"CM\"\n- 4. 其它的每组明文字母按如下方式代替：它所行为该字母的所在行，列则为另一个字母的所在列。\n\
    \  - 例如：\"hs\"加密为\"BP\"，\"ea\"加密为\"IM\"或\"JM\"\n\n## Playfair Cipher——密码分析\n\n\
    - 相对单表代换，安全性得到较大改善\n  - 有26 x 26 = 676字母对\n  - 需要建立676字母对的频度表\n  - 频率分析字母对就更加困难\n\
    - 采用频率分析方法\n  - 仍然完整地保留了明文的结构\n  - 几百个字母的密文就足够破译\n\n## 密码算法与字母频率统计特征\n\n![](img/0935d481fd26d10140d7cd560b6540ba_57_0.png)\n\
    \n## 多表（Polyalphabetic）代换密码\n\n- 多表代换密码使用多个密码字母表\n  - 使用密钥来选择那个密码字母表作用于消息中的每个字母\n\
    \  - 依次使用密钥对应的每个密码字母表\n  - 重复使用密钥对应的每个密码字母表\n  - 使频率分析更加困难\n\n## Vigenère Cipher\n\
    \n- **Vigenère Cipher是多表代替密码**\n  - 实际上是多个caesar ciphers\n  - 密钥是多个字母K = k1 k2\
    \ ... kd\n  - 密钥中lth字母指定i th要使用的字母表\n  - 依次使用每个字母表\n  - 到达第d个字母表后，重复使用第1个字母表\n\
    \  - 加密：给定密钥字母x和明文字母y，密文字母是位于x行和y列的那个字母\n  - 解密：密钥字母决定行，密文字母所在列的顶部字母就是明文字母\n \
    \ - 例子：密钥为*deceptive*\n    - key: deceptivedeceptivedeceptive\n    - plaintext:\
    \ wearediscoveredsaveyourself\n    - ciphertext: ZICVTWQNGRZGV TWAVZHCQYGLMGJ\n\
